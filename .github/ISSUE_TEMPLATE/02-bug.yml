name: Bug report
description: Something behaves incorrectly — the API, the explorer, a binary, or a tool.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The shortest sequence that shows it. If it needs a running stack, say which parts.
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Error output, log lines, or a stack trace. Exact text beats a summary — redact any credential first.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `<binary> --version`, or the release tag. For the hosted API, the `as_of` from any response.
    validations: {required: true}
  - type: checkboxes
    id: checked
    attributes:
      label: Before opening
      options:
        - label: I searched existing issues, including closed ones.
          required: true
