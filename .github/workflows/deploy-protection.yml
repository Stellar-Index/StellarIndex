name: deploy-protection

# Does each production environment actually require a human approval,
# and admit only `main`? (deploy-approval-gate, audit-2026-07-23.)
# The matrix below covers every environment a credential-holding job
# declares, not only r1.
#
# deploy.yml declares `environment: r1`, which looks like a gate but
# enforces nothing on its own: an environment with no
# `required_reviewers` protection rule deploys unattended. When the
# audit ran, `gh api repos/<repo>/environments/r1` returned
# `"protection_rules": []` — the declaration was decoration.
#
# The reviewer list lives in GitHub repo settings and CANNOT be set
# from any file in this repository. What the repo can do is (a) refuse
# to deploy while the gate is absent — deploy.yml's "Assert the
# production approval gate is configured" step — and (b) notice the
# gate disappearing without waiting for someone to attempt a deploy,
# which is this workflow.
#
# Run it by hand (Actions → deploy-protection → Run workflow) after
# configuring reviewers; it is also the cheapest way to confirm the
# token can read the environments API BEFORE a real deploy depends on
# it. If the default GITHUB_TOKEN cannot, set DEPLOY_PROTECTION_TOKEN
# to a read-only PAT — that supplies the credential, it never relaxes
# the assertion.
#
# SCHEDULING CAVEAT (corrected 2026-07-25, CID-24, audit-2026-07-23):
# this comment used to claim scheduled workflows "have never fired" for
# this repository, citing a note in ansible-drift.yml. That note was
# itself wrong — `gh run list` shows ansible-drift.yml, security.yml and
# ci-health.yml all firing on schedule; ansible-drift.yml's scheduled
# runs were failing at a credential-loading step, not silently absent.
# Treat the cron here as the primary mechanism; manual dispatch remains
# available as a fallback (e.g. to confirm the token can read the
# environments API before a real deploy depends on it).

on:
  schedule:
    - cron: "43 7 * * 1" # Mondays 07:43 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: read
  actions: read  # GitHub gates the environments API on Actions read

jobs:
  environment-approval:
    name: ${{ matrix.environment }} gate is configured
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      # Every environment a production-credential job declares
      # (scripts/ci/lint-deploy-credentials.py enforces the declaration).
      # deploy = required reviewers + main-only branch policy;
      # observe = main-only only, for scheduled read-only jobs that
      # cannot wait on a reviewer.
      matrix:
        include:
          - {environment: r1, mode: deploy}
          - {environment: testnet, mode: deploy}
          - {environment: futurenet, mode: deploy}
          - {environment: explorer-production, mode: deploy}
          - {environment: docs-production, mode: deploy}
          - {environment: status-production, mode: deploy}
          - {environment: r1-observe, mode: observe}
          - {environment: cf-ssr-shadow, mode: observe}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the environment gate
        # ⚠ PRE-PRODUCTION RELAXATION (2026-07-26): mirrors deploy.yml,
        # fail-closed. Only when the repo variable DEPLOY_APPROVAL_RELAXED
        # is exactly "true" AND DEPLOY_APPROVAL_RELAXED_UNTIL is a
        # still-future ISO-8601 date (K079: an open-ended relaxation
        # never re-alarms) is the REVIEWER half intentionally absent and
        # not alarmed on. The main-only branch policy is never relaxed.
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ENV_NAME: ${{ matrix.environment }}
          MODE: ${{ matrix.mode }}
          APPROVAL_RELAXED: ${{ vars.DEPLOY_APPROVAL_RELAXED }}
          APPROVAL_RELAXED_UNTIL: ${{ vars.DEPLOY_APPROVAL_RELAXED_UNTIL }}
        run: |
          set -euo pipefail
          if [ "$MODE" = observe ]; then
            bash scripts/ci/assert-deploy-gate.sh --observe "$ENV_NAME"
          else
            bash scripts/ci/assert-deploy-gate.sh "$ENV_NAME"
          fi
