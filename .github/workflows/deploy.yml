name: deploy

# Manual deploy of a tagged binary release to a region.
#
# Required GitHub Actions secrets:
#   DEPLOY_SSH_PRIVATE_KEY  — SSH key with root access to the
#                              region's host (`ssh-keygen -t ed25519`,
#                              public key authorised on the host)
#   R1_HOST                  — IP/hostname of the r1 box (e.g. 136.243.90.96)
#   R1_USER                  — SSH user; defaults to "root" if unset
#   R1_SSH_KNOWN_HOSTS       — `ssh-keyscan -t ed25519 <host>` output,
#                              base64-encoded (avoid newline-in-secret
#                              quirks). Pinning known_hosts prevents
#                              MITM during deploy.
#
# Test-net regions (testnet / futurenet) — the VMs are NAT-only behind the
# shared KVM host, so they reach the VM via ProxyJump:
#   <REGION>_HOST            — the VM's PRIVATE NAT IP (192.168.122.10/.20)
#   <REGION>_USER            — SSH user (defaults to "root")
#   <REGION>_SSH_JUMP        — the KVM host as user@public-ip
#                              (e.g. root@95.217.126.13) to ProxyJump through
#   <REGION>_SSH_KNOWN_HOSTS — base64 of ssh-keyscan for BOTH the jump host
#                              AND the VM (the pinned file covers both hops)
# Deploy the test-net binary set (NO aggregator):
#   -f binaries=stellarindex-indexer,stellarindex-api,stellarindex-ops
#
# Triggered exclusively via workflow_dispatch. There's no auto-deploy
# on tag push — the release workflow produces the artefacts; a human
# decides when each region picks them up.
#
# Stack: depends on PRs #645 (release.yml + Dockerfiles + SemVer
# policy) which produces the v* tagged release artefacts this
# workflow downloads.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Target region'
        required: true
        type: choice
        options:
          - r1
          - testnet
          - futurenet
      version:
        description: 'Version tag to deploy (e.g. v0.2.0). Must exist as a GitHub Release.'
        required: true
        type: string
      binaries:
        # F-1314 (codex audit-2026-05-13): the default deploy set
        # now INCLUDES stellarindex-sla-probe so the active
        # /opt/stellarindex/healthchecks/sla-probe.sh wrapper +
        # stellarindex-sla-probe.timer always have a matching
        # /usr/local/bin/stellarindex-sla-probe under it. Pre-fix
        # a nominal deploy would leave the SLA-evidence binary
        # stale (or absent on a fresh host) because the timer's
        # presence on r1 came from the wave-129 ssh-side
        # operator install, not from the release/deploy flow.
        #
        # 2026-08-28: the SAME class recurred for stellarindex-ops,
        # which this list also omitted. Measured on r1: ops sat at
        # v0.44.7 while indexer/aggregator/api/sla-probe were all
        # v0.46.1 — two releases of drift, invisible because a
        # nominal deploy reported success without ever touching it.
        # It is not a bystander: THIRTEEN units on r1 exec it,
        # including the data-integrity gates (verify-archive
        # tier-a/b, archive-completeness, ch-schema-drift,
        # restore-drill) and the served-tier writers (census-rollup,
        # holders-rollup, supply-snapshot, sep1-refresh,
        # directory-sync, cap67-movements). A stale gate binary
        # silently validates the lake with retired rules — the
        # failure mode is a gate that PASSES when it should not.
        # Safe to add: it is already in deploy-binary.yml's
        # cli_binaries deny-list, so it gets a `-version` smoke test
        # and no service restart.
        #
        # stellarindex-migrate joins for the same reason, found by the
        # version-skew probe built alongside this fix: r1 had it at
        # v0.28.1 against v0.46.1 elsewhere — ~18 releases, and it is
        # the SCHEMA MIGRATION runner. deploy-binary.yml executes
        # `stellarindex-migrate up` (F-1220) before any binary swap,
        # so an un-deployed runner meant every deploy applied that
        # release's migrations with a months-old golang-migrate
        # wrapper.
        #
        # Ordering caveat, deliberate: the swap happens AFTER the
        # migration step, so the deploy that first ships a new migrate
        # still runs its migrations with the previous one, and the new
        # binary takes effect from the NEXT deploy. That converges and
        # adds no risk. Making the runner swap before it runs is a
        # structural change to the migration path on a live money
        # database and wants its own reviewed PR, not a rider on this.
        description: 'Comma-separated binaries to deploy. TEST NETS (testnet/futurenet) MUST override to the test-net set — stellarindex-indexer,stellarindex-api,stellarindex-ops — with NO aggregator (no USD markets off pubnet). The default below is the PUBNET set.'
        required: false
        type: string
        default: 'stellarindex-indexer,stellarindex-aggregator,stellarindex-api,stellarindex-sla-probe,stellarindex-ops,stellarindex-migrate'
      health_grace_seconds:
        description: 'Seconds to wait between restart and /v1/healthz probe'
        required: false
        type: string
        default: '15'
      migrations_skip:
        # F-1301 (rc.51 deploy): the playbook's hardcoded passwordless
        # DSN fails auth against the live db; operators who have
        # already applied migrations out-of-band (or who know the
        # schema is unchanged from the prior tag) can skip the step.
        description: 'Skip the migration sync + apply (use ONLY when migrations are already applied or schema is unchanged)'
        required: false
        type: boolean
        default: false
      config_acknowledged:
        # config-apply gate (2026-08-25 declared-peg + rules.d incidents):
        # deploy-binary.yml swaps BINARIES ONLY — it does not render the
        # ansible stellarindex.toml, sync Prometheus rules, install systemd
        # units, or apply DB schema. When a release changed any of those
        # surfaces the post-deploy config-apply gate FAILS unless this is
        # set true, asserting the operator has applied / will apply the
        # config per docs/operations/deploy-config-apply.md. A config-free
        # release passes the gate regardless.
        description: 'Acknowledge you have applied (or will apply) any config/schema this release changed — binary deploy does NOT apply it. See docs/operations/deploy-config-apply.md.'
        required: false
        type: boolean
        default: false

# Concurrency: at most one deploy per region in flight. Prevents two
# operators racing each other and producing inconsistent state.
concurrency:
  group: deploy-${{ inputs.region }}
  cancel-in-progress: false

permissions:
  contents: read           # download release artefacts
  deployments: read        # read the environment's protection rules (approval-gate preflight)
  # F-1296 (codex audit-2026-05-13): `id-token: write` removed.
  # No step currently consumes the OIDC JWT (keyless attestation
  # is planned but not wired yet); a compromised step in this
  # deploy job shouldn't be able to mint an OIDC token. Add it
  # back in the SAME PR that wires the attestation step.

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} → ${{ inputs.region }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.region }}
      # Set this in the repo's Environments → r1 → Reviewers list to
      # require manual approval before this job runs in r1. Leave
      # empty for unattended.

    steps:
      - name: Checkout (for Ansible playbook)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags: the config-apply gate diffs the deploying
          # tag against the previous release tag over the config surfaces.
          fetch-depth: 0

      - name: Assert the production approval gate is configured
        # deploy-approval-gate (audit-2026-07-23): the `environment:`
        # declaration above is not a gate by itself — an environment
        # with no `required_reviewers` rule deploys unattended, which is
        # exactly what `gh api repos/<repo>/environments/r1` returned
        # when the audit ran (`"protection_rules": []`). The reviewer
        # list lives in repo settings and cannot be set from a file in
        # this repo, so the strongest in-repo enforcement is to refuse
        # to deploy while the gate is absent. Runs FIRST: before the SSH
        # key, the artefacts, or the playbook.
        #
        # DEPLOY_PROTECTION_TOKEN is an optional escape hatch: if the
        # default GITHUB_TOKEN cannot read the environments API on this
        # repo, set that secret to a read-only PAT. It never relaxes the
        # assertion — it only supplies the credential to make it.
        #
        #
        # ⚠ PRE-PRODUCTION RELAXATION (2026-07-26): while R1 carries no
        # production traffic, this gate can be deliberately made a NO-OP
        # so the operator deploys autonomously (a self-approved gate is
        # theatre — see the master plan §0). The relaxation is honest,
        # visible, and FAIL-CLOSED by default: it is OFF unless the repo
        # variable DEPLOY_APPROVAL_RELAXED is explicitly set to "true".
        # Unset / a fresh clone / any other value ⇒ the gate ENFORCES.
        # ► RE-ARM BEFORE PRODUCTION LAUNCH: delete the repo variable
        #   (gh variable delete DEPLOY_APPROVAL_RELAXED) AND configure the
        #   r1 environment's Required-reviewers rule (Settings →
        #   Environments → r1). Deleting the variable alone already
        #   restores enforcement.
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
          REGION: ${{ inputs.region }}
          REPO: ${{ github.repository }}
          APPROVAL_RELAXED: ${{ vars.DEPLOY_APPROVAL_RELAXED }}
        run: |
          set -euo pipefail
          if [ "${APPROVAL_RELAXED:-}" = "true" ]; then
            echo "::warning::deploy-approval-gate RELAXED (pre-production, DEPLOY_APPROVAL_RELAXED=true). Deploying to '${REGION}' WITHOUT human approval. RE-ARM before production launch: delete the DEPLOY_APPROVAL_RELAXED repo variable and configure the '${REGION}' environment Required-reviewers rule."
            exit 0
          fi
          if ! gh api "repos/${REPO}/environments/${REGION}" > env-protection.json; then
            echo "::error::Could not read the '${REGION}' environment protection config. Refusing to deploy on an unverified approval gate. If the default GITHUB_TOKEN lacks access, set the DEPLOY_PROTECTION_TOKEN secret to a read-only PAT and re-run."
            exit 1
          fi
          bash scripts/ci/check-deploy-protection.sh env-protection.json "$REGION"

      - name: Validate inputs
        # F-1298 (codex audit-2026-05-13): pass inputs through
        # `env:` rather than interpolating `${{ inputs.* }}`
        # directly into the shell. Pre-fix the validation regex
        # ran AFTER the shell had already expanded the input —
        # an input like `"; cat /etc/passwd; echo "v1.0.0` would
        # execute `cat /etc/passwd` before the SemVer check
        # even fired. Env-var passing means the shell sees the
        # value as a regular string variable.
        env:
          VERSION: ${{ inputs.version }}
          BINARIES: ${{ inputs.binaries }}
          HEALTH_GRACE: ${{ inputs.health_grace_seconds }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$'; then
            echo "::error::Version '$VERSION' must match SemVer vX.Y.Z[-prerelease][+build]"
            exit 1
          fi
          # deploy-ansible-input-8: health_grace_seconds is a `type: string`
          # input (GitHub's `number` typing is UI/API-side and `gh workflow
          # run -f` bypasses it), and it is spliced into
          # `-e "health_grace_seconds=${HEALTH_GRACE}"`. ansible parses that
          # k=v form on WHITESPACE, so a value like
          # `15 backup_freshness_skip=true` would inject a second extra-var
          # and silently skip the backup-freshness gate. Digits only.
          if ! [[ "$HEALTH_GRACE" =~ ^[0-9]{1,4}$ ]]; then
            echo "::error::health_grace_seconds '$HEALTH_GRACE' must be 1-4 digits (seconds); anything else could inject extra-vars into ansible-playbook -e"
            exit 1
          fi
          # Reject empty / whitespace-only binary list early
          BINS="$(echo "$BINARIES" | tr -d '[:space:]')"
          if [ -z "$BINS" ]; then
            echo "::error::binaries input is empty"
            exit 1
          fi
          # Each binary must be a known cmd/<name> directory
          IFS=',' read -ra LIST <<< "$BINS"
          for b in "${LIST[@]}"; do
            # Reject anything that's not [a-zA-Z0-9-] before
            # touching the filesystem — defends against an
            # input like `../../etc/passwd` that happened to
            # have a matching `cmd/` directory.
            if ! [[ "$b" =~ ^[a-zA-Z0-9-]+$ ]]; then
              echo "::error::Binary name '$b' contains illegal characters; only [a-zA-Z0-9-] permitted"
              exit 1
            fi
            if [ ! -d "cmd/$b" ]; then
              echo "::error::Unknown binary '$b' (no cmd/$b/ directory)"
              exit 1
            fi
          done
          echo "Validated ${#LIST[@]} binaries: ${LIST[*]}"

      - name: Resolve region inventory
        id: region
        # F-1298 (wave 126): inputs through `env:`, never
        # interpolated `${{ inputs.* }}` into the shell.
        env:
          R1_HOST: ${{ secrets.R1_HOST }}
          R1_USER: ${{ secrets.R1_USER }}
          TESTNET_HOST: ${{ secrets.TESTNET_HOST }}
          TESTNET_USER: ${{ secrets.TESTNET_USER }}
          TESTNET_SSH_JUMP: ${{ secrets.TESTNET_SSH_JUMP }}
          FUTURENET_HOST: ${{ secrets.FUTURENET_HOST }}
          FUTURENET_USER: ${{ secrets.FUTURENET_USER }}
          FUTURENET_SSH_JUMP: ${{ secrets.FUTURENET_SSH_JUMP }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          jump=""
          # backup_gate: does this host have a pgBackRest stellarindex
          # stanza for deploy-binary.yml's backup-freshness gate to read?
          # r1 does; the test-net VMs never get pgbackrest at all
          # (18-pgbackrest-backup.yml), so on them the fail-closed gate
          # could only exit 1 and the workflow could never apply schema
          # there (deploy-ansible-deploy-2). Passed as -e because the
          # ad-hoc `-i host,` inventory does not load the role's
          # inventory vars. Anything not r1 that grows a stanza flips
          # this to true here, deliberately.
          backup_gate="true"
          case "$REGION" in
            r1)
              host="${R1_HOST}"
              user="${R1_USER:-root}"
              ;;
            testnet)
              # Testnet VM on the shared Frankfurt box. No approval gate
              # (low-stakes test tier); binaries = the test-net set (pass
              # `binaries` = stellarindex-indexer,stellarindex-api,stellarindex-ops
              # — NO aggregator). The VM has no public IP: HOST is its private
              # NAT address (192.168.122.10) and SSH_JUMP is the KVM host
              # (user@public-ip) we ProxyJump through.
              host="${TESTNET_HOST}"
              user="${TESTNET_USER:-root}"
              jump="${TESTNET_SSH_JUMP}"
              backup_gate="false"
              ;;
            futurenet)
              host="${FUTURENET_HOST}"
              user="${FUTURENET_USER:-root}"
              jump="${FUTURENET_SSH_JUMP}"
              backup_gate="false"
              ;;
            *)
              echo "::error::Region '$REGION' has no inventory mapping"
              exit 1
              ;;
          esac
          if [ -z "$host" ]; then
            echo "::error::Region $REGION host secret is unset"
            exit 1
          fi
          # The test-net VMs are NAT-only — a jump host is mandatory for them.
          if [ "$REGION" != "r1" ] && [ -z "$jump" ]; then
            echo "::error::${REGION^^}_SSH_JUMP is unset — the NAT-only ${REGION} VM is unreachable without a jump host (user@public-ip of the KVM host)."
            exit 1
          fi
          # Validate the jump token can't inject into the ProxyCommand shell.
          if [ -n "$jump" ] && [[ ! "$jump" =~ ^[A-Za-z0-9._@-]+$ ]]; then
            echo "::error::SSH_JUMP '$jump' has characters outside [A-Za-z0-9._@-]"
            exit 1
          fi
          {
            echo "host=$host"
            echo "user=$user"
            echo "jump=$jump"
            echo "backup_gate=$backup_gate"
          } >> "$GITHUB_OUTPUT"
          echo "Target: $user@$host${jump:+ (via $jump)} backup-freshness gate: $backup_gate"

      - name: Download release binaries
        # F-1298 (wave 126): inputs through `env:`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          BINARIES: ${{ inputs.binaries }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          IFS=',' read -ra LIST <<< "$(echo "$BINARIES" | tr -d '[:space:]')"
          for b in "${LIST[@]}"; do
            artifact="${b}-linux-amd64"
            echo "Downloading $artifact from release $VERSION"
            gh release download "$VERSION" \
              -p "$artifact" -O "dist/$artifact" \
              -R "$REPO"
            chmod +x "dist/$artifact"
          done
          echo "---"
          ls -la dist/

      - name: Install cosign
        # Same pinned pair as release.yml's signing step: the installer
        # action is SHA-pinned AND the cosign version it installs is
        # pinned, so neither a tag move on the action nor a change in
        # the installer's default cosign version can alter what verifies
        # our releases.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Verify release signature, then checksums
        # CID-09 + artifact-integrity-verification (audit-2026-07-23).
        #
        # Pre-fix this step downloaded SHA256SUMS from the same release
        # as the binaries and checked the binaries against it. That
        # proves internal consistency and nothing else: anyone able to
        # replace a release asset replaces the manifest in the same
        # breath. release.yml has cosign-signed SHA256SUMS since the
        # BACKLOG #51b migration, and NOTHING on the deploy path looked
        # at that signature — the whole value of signing was unrealised.
        #
        # The Fulcio certificate in the sigstore bundle is the anchor an
        # asset-replacing attacker cannot forge: it binds the manifest
        # to THIS repository's release.yml workflow (identity) issued by
        # GitHub's OIDC provider (issuer), and Rekor's transparency log
        # makes a backdated signature detectable. Verify the signature
        # FIRST; only then does a checksum mean anything.
        #
        # Identity is pinned to the release workflow path, and to either
        # the tag being deployed (normal `push`-triggered release) or
        # refs/heads/main (release.yml's documented workflow_dispatch
        # rebuild path). Both require the ability to run release.yml in
        # this repo; neither is reachable by replacing assets.
        #
        # F-1298 (wave 126): inputs through `env:`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          BINARIES: ${{ inputs.binaries }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" -p SHA256SUMS -O dist/SHA256SUMS -R "$REPO"
          gh release download "$VERSION" -p SHA256SUMS.sigstore.json \
            -O dist/SHA256SUMS.sigstore.json -R "$REPO"

          # Regex-escape the interpolated parts. `version` already
          # passed the SemVer gate in "Validate inputs", so it can only
          # contain [A-Za-z0-9.+-]; `.` and `+` are the regex-significant
          # members of that set.
          REPO_RE="$(printf '%s' "$REPO" | sed -e 's/[.+]/\\&/g')"
          VER_RE="$(printf '%s' "$VERSION" | sed -e 's/[.+]/\\&/g')"
          IDENTITY="^https://github\.com/${REPO_RE}/\.github/workflows/release\.yml@refs/(tags/${VER_RE}|heads/main)$"
          echo "Expected signer identity: $IDENTITY"

          cosign verify-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

          cd dist
          # SHA256SUMS is now trusted. It contains every artefact's sum;
          # filter to the binaries we downloaded and verify just those.
          # A binary with no entry in the signed manifest is a hard fail
          # (pre-fix the empty grep also failed, but silently and for
          # the wrong reason).
          IFS=',' read -ra LIST <<< "$(echo "$BINARIES" | tr -d '[:space:]')"
          for b in "${LIST[@]}"; do
            if ! line="$(grep -E "  ${b}-linux-amd64$" SHA256SUMS)"; then
              echo "::error::${b}-linux-amd64 has no entry in the signed SHA256SUMS for $VERSION"
              exit 1
            fi
            printf '%s\n' "$line" | sha256sum -c -
          done
          echo "Signature + checksums OK"

      # F-1220 (codex audit-2026-05-12): ship the migrations dir
      # alongside binaries so the playbook can sync + apply them
      # BEFORE the binary swap. Without this, a tagged deploy that
      # depends on a new schema would restart binaries onto an
      # out-of-date DB and produce partial-outage shapes that
      # /v1/healthz wouldn't catch.
      - name: Stage migrations from the release tag's tree
        # F-1298 (wave 126): inputs through `env:`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist/migrations
          # artifact-integrity-verification (audit-2026-07-23): prefer
          # the SIGNED migrations bundle. release.yml packs the tag's
          # migrations/ into dist/migrations.tar.gz BEFORE computing
          # SHA256SUMS, so the cosign signature verified above covers
          # the SQL that is about to run as DDL on production — the
          # same chain the binaries get.
          # Asked as a single command substitution, NOT `gh … | grep -q`:
          # under `pipefail` a `grep -q` that exits early SIGPIPEs gh
          # (141) and the pipeline reports failure even on a match,
          # which would silently downgrade to the unsigned path.
          has_bundle="$(gh release view "$VERSION" -R "$REPO" --json assets \
            --jq '[.assets[].name] | index("migrations.tar.gz") // empty')"
          if [ -n "$has_bundle" ]; then
            gh release download "$VERSION" -p migrations.tar.gz \
              -O dist/migrations.tar.gz -R "$REPO"
            (cd dist && grep -E "  migrations\.tar\.gz$" SHA256SUMS | sha256sum -c -)
            tar -xzf dist/migrations.tar.gz -C dist/migrations --strip-components=1
            rm -f dist/migrations.tar.gz
          else
            # Releases cut before the signed bundle landed. The tag
            # tarball is served by GitHub but is covered by NO
            # signature, so this path is announced loudly rather than
            # taken silently. Re-cut the tag to get a signed bundle.
            echo "::warning::Release $VERSION has no signed migrations.tar.gz (cut before audit-2026-07-23); falling back to the UNSIGNED tag tarball for migrations. Re-run release.yml for this tag to get a signed bundle."
            # ONE tarball fetch of the tag's tree — guarantees binary ↔
            # migration set parity even if main has advanced since the
            # tag. Previously this looped `gh api contents` per file
            # (~180 sequential API calls); on 2026-07-09 that tripped
            # GitHub's secondary rate limit twice in a row (an HTML
            # error page mid-loop → "invalid character '<'"), failing
            # the v0.10.0 deploy before it touched the host. A single
            # tarball request can't hit the per-request burst limit.
            mkdir -p tag-tree
            gh api "repos/$REPO/tarball/$VERSION" > tag.tar.gz
            tar -xzf tag.tar.gz -C tag-tree --strip-components=1
            cp -R tag-tree/migrations/. dist/migrations/
            rm -rf tag-tree tag.tar.gz
          fi
          echo "---"
          # `| head` + pipefail interacts badly: head closes early,
          # ls hits SIGPIPE, pipefail fails the step even though
          # everything staged correctly. F-1300 (rc.51 deploy fail).
          # Print the count + the first 10 names via sort+head.
          echo "staged $(ls dist/migrations/ | wc -l) migration files"
          ls dist/migrations/ | sort | head -n 10

      - name: Migration rollback-safety gate
        # CID-14 (audit-2026-07-23). The playbook applies `migrate up`
        # in its pre_tasks — BEFORE the binary swap — and a failed
        # health probe rolls back the BINARY ONLY; the schema stays
        # forward (CS-099, deliberate: down-migrations are
        # data-destructive and the pipeline cannot know what already
        # depends on what it would revert). That is safe if and only if
        # every migration keeps the PREVIOUS released binary working
        # against the NEW schema — migrations/README.md rule 9. Prose
        # said so; nothing checked it.
        #
        # This is the LAST gate before DDL runs on production, and it
        # matters independently of the PR-time run in ci.yml: `main` is
        # not branch-protected, so a migration can reach a tag without
        # ever passing CI.
        run: |
          set -euo pipefail
          MIGRATIONS_DIR=dist/migrations \
            bash scripts/ci/lint-migration-compat.sh --staged

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          # Secret names can't be built dynamically in ${{ }}, so pass all
          # three and select by region below. A test-net secret must pin BOTH
          # the jump host key AND the VM key (the ProxyJump uses this one file).
          R1_KH: ${{ secrets.R1_SSH_KNOWN_HOSTS }}
          TESTNET_KH: ${{ secrets.TESTNET_SSH_KNOWN_HOSTS }}
          FUTURENET_KH: ${{ secrets.FUTURENET_SSH_KNOWN_HOSTS }}
          REGION: ${{ inputs.region }}
          HOST: ${{ steps.region.outputs.host }}
        run: |
          set -euo pipefail
          case "$REGION" in
            r1)        KNOWN_HOSTS_B64="${R1_KH:-}" ;;
            testnet)   KNOWN_HOSTS_B64="${TESTNET_KH:-}" ;;
            futurenet) KNOWN_HOSTS_B64="${FUTURENET_KH:-}" ;;
            *) echo "::error::no known_hosts mapping for region '$REGION'"; exit 1 ;;
          esac
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # F-1297 (codex audit-2026-05-13): fail fast if the
          # pinned host-key secret is missing instead of falling
          # back to live `ssh-keyscan` — the fallback was a
          # silent MITM exposure (any TCP attacker on the path
          # to the deploy host could have served a forged host
          # key and the workflow would have trusted it for the
          # entire deploy session). Operators must populate
          # `<REGION>_SSH_KNOWN_HOSTS` from a trusted out-of-band
          # capture before the first deploy of each region.
          if [ -z "${KNOWN_HOSTS_B64:-}" ]; then
            echo "::error::${REGION:-R1}_SSH_KNOWN_HOSTS is unset. Capture once via `ssh root@<host> 'ssh-keyscan -t ed25519 <host>' | base64 -w0` and set it as a repo secret before retrying. Live ssh-keyscan fallback was removed in wave 126 (F-1297) — it was a MITM hole." >&2
            exit 1
          fi
          echo "$KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Install Ansible
        # F-1299 (codex audit-2026-05-13): EXACT pins for both
        # ansible-core and pip itself. Pre-fix `'ansible-core==2.18.*'`
        # let any 2.18.x patch land at deploy time, including future
        # 2.18.999. The requirements.yml file is also now exact-pinned.
        # Bumps are a deliberate three-file edit: this pin, the
        # requirements.yml pin, and a deploy-replay confirmation.
        run: |
          python3 -m pip install 'pip==24.3.1'
          python3 -m pip install 'ansible-core==2.18.4'
          # `ansible-core` ships only the bundled collections; anything
          # from Galaxy must be installed separately, and requirements.yml
          # is the source of truth for ALL collection pins (posix,
          # community.*). deploy-binary.yml itself is builtin-only since
          # deploy-ansible-deploy-2 (it used ansible.posix.synchronize for
          # the migrations dir, which cannot follow the test-net ProxyJump);
          # the install stays so the deploy runner matches the role's pins.
          ansible-galaxy collection install -r configs/ansible/requirements.yml

      - name: Capture the host's live version (config-apply baseline)
        # Read BEFORE the playbook runs, because afterwards the sidecar
        # reports the version we are deploying — which would make the
        # baseline trivially equal to VERSION and the gate vacuous.
        #
        # The config-apply gate compares config surfaces between the
        # host's LIVE version and the deploying tag. Without this it
        # defaulted to "the previous release tag by ancestry", which is
        # only the same thing when the fleet is exactly one release
        # behind. It often is not: `docs/operations/deployed-versions.md`
        # states plainly that "a git tag / release cut does not imply the
        # fleet moved to it", and 8 of 23 adjacent tag hops over
        # v0.40.0..v0.49.0 have an EMPTY config-surface diff. So a
        # catch-up or skip-ahead deploy could get a green
        # "no config-surface changes … the binary deploy is complete"
        # while config from every skipped release stayed unapplied
        # (wave-D LID-5).
        #
        # Best-effort by design: an unreachable sidecar leaves the output
        # empty and the gate falls back to its documented ancestry
        # default with its existing warning. Failing the deploy here
        # would trade a weaker gate for an outage risk, which is the
        # wrong direction — the gate is non-destructive by construction.
        id: baseline
        env:
          DEPLOY_HOST: ${{ steps.region.outputs.host }}
          DEPLOY_USER: ${{ steps.region.outputs.user }}
          DEPLOY_JUMP: ${{ steps.region.outputs.jump }}
        run: |
          set -uo pipefail
          proxy=""
          [ -n "${DEPLOY_JUMP:-}" ] && proxy="-o ProxyJump=${DEPLOY_JUMP}"
          # Lowest version across the managed binaries: config from a
          # release is unapplied if ANY binary predates it, so the
          # oldest is the honest baseline.
          #
          # `awk 1`, NOT `cat`. The sidecars are written by
          # tasks/deploy-one-binary.yml with `ansible.builtin.copy:
          # content: "{{ version }}"`, which writes NO trailing newline.
          # `cat` over six of them therefore yields ONE mashed line
          # (`v0.46.1v0.44.7v0.28.1…`), which the `^`-anchored grep below
          # happily matched and `sort -V | head -1` passed through intact
          # — so the gate received a garbage token, could not resolve it
          # to a commit, and failed CLOSED on every deploy. The binaries
          # deployed fine; the job just went red and SKIPPED the
          # post-deploy smoke step. `awk 1` emits each record with a
          # trailing newline whether or not the file had one.
          #
          # The regex is also anchored at BOTH ends now, so a future
          # concatenation (or any other malformed sidecar) is rejected
          # rather than silently treated as a version. The optional
          # suffix keeps pre-release tags like v1.2.3-rc.1 valid.
          live=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
                   ${proxy} "${DEPLOY_USER}@${DEPLOY_HOST}" \
                   "awk 1 /var/lib/stellarindex/deployed-versions/stellarindex-* 2>/dev/null" \
                 | tr -d '\r' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' | sort -V | head -1 || true)
          if [ -n "$live" ]; then
            echo "host live version (lowest across binaries): $live"
            echo "live=$live" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not read the host's deployed-versions sidecar; the config-apply gate will fall back to the previous release tag by ancestry, which is only correct if the fleet is exactly one release behind."
            echo "live=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run deploy playbook
        # F-1298 (wave 126): inputs through `env:`. Note that
        # `ansible-playbook -e "key=$VAR"` STILL needs care —
        # ansible-playbook itself parses that string, splitting
        # the k=v form on whitespace into MULTIPLE vars. The
        # validation regex on `version` (in the Validate step
        # above), the `[a-zA-Z0-9-]+` regex on per-binary
        # entries and the `^[0-9]{1,4}$` regex on
        # health_grace_seconds (deploy-ansible-input-8 — it is a
        # `type: string` input; GitHub does NOT enforce a number
        # type for `gh workflow run -f`) guarantee none of these
        # values can carry whitespace or shell metacharacters.
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'True'
          ANSIBLE_FORCE_COLOR: '1'
          DEPLOY_HOST: ${{ steps.region.outputs.host }}
          DEPLOY_USER: ${{ steps.region.outputs.user }}
          DEPLOY_JUMP: ${{ steps.region.outputs.jump }}
          BACKUP_GATE: ${{ steps.region.outputs.backup_gate }}
          VERSION: ${{ inputs.version }}
          BINARIES: ${{ inputs.binaries }}
          HEALTH_GRACE: ${{ inputs.health_grace_seconds }}
          MIGRATIONS_SKIP: ${{ inputs.migrations_skip }}
        run: |
          set -euo pipefail
          # NAT-only test-net VMs are reached via ProxyJump through the KVM
          # host. -o ProxyJump=<user@host> (no spaces → no shell-quoting trap
          # that a ProxyCommand string would carry); the inner hop reuses
          # --private-key and the pinned ~/.ssh/known_hosts, so that secret
          # MUST contain BOTH the jump host key AND the VM host key. The jump
          # token was allowlist-validated in the resolve step.
          SSH_ARGS=()
          if [ -n "${DEPLOY_JUMP:-}" ]; then
            SSH_ARGS=(--ssh-common-args "-o ProxyJump=${DEPLOY_JUMP}")
          fi
          ansible-playbook \
            -i "${DEPLOY_HOST}," \
            -u "${DEPLOY_USER}" \
            --private-key ~/.ssh/id_deploy \
            "${SSH_ARGS[@]}" \
            -e "version=${VERSION}" \
            -e "binaries_csv=${BINARIES}" \
            -e "local_dist_dir=$GITHUB_WORKSPACE/dist" \
            -e "health_grace_seconds=${HEALTH_GRACE}" \
            -e "migrations_skip=${MIGRATIONS_SKIP}" \
            -e "pgbackrest_backup_enabled=${BACKUP_GATE}" \
            configs/ansible/playbooks/deploy-binary.yml

      - name: Config-apply gate
        # Runs AFTER the binaries are deployed. deploy-binary.yml swaps
        # binaries only; when a release changed the ansible config,
        # Prometheus rules, systemd units, or DB schema, the feature they
        # gate ships DEAD + SILENT unless an operator applies the config
        # too (2026-08-25 declared-peg + rules.d incidents). This FAILS the
        # job when such a surface changed since the previous release tag and
        # config_acknowledged != true — a loud, NON-destructive forcing
        # function (the binaries are already live; a red gate only flags the
        # outstanding config-apply). See docs/operations/deploy-config-apply.md.
        env:
          VERSION: ${{ inputs.version }}
          CONFIG_ACK: ${{ inputs.config_acknowledged }}
          BASELINE: ${{ steps.baseline.outputs.live }}
        run: |
          bash scripts/ci/config-apply-gate.sh "$VERSION" "$CONFIG_ACK" "$BASELINE"

      - name: Served-path smoke
        # Runs AFTER the config-apply gate, i.e. after every deploy
        # action is done. Everything before this point proves the
        # binaries LANDED: deploy-binary.yml checks `-version` per
        # binary and curls /v1/healthz on localhost. Neither proves
        # the service SERVES. Two green deploys that were not:
        #   - 2026-08-28: /v1/assets?limit=500 returned HTTP 500 after a
        #     NULL-scan regression while localhost /v1/healthz stayed
        #     200 (healthz is a shallow liveness probe by design —
        #     F-1210). limit=500 is the exact fetch the explorer build
        #     makes (web/explorer sitemap), so the site build broke.
        #   - 2026-08-28 (earlier): ops v0.44.7 and migrate v0.28.1 sat
        #     beside v0.46.1 elsewhere because the default binary list
        #     omitted them; the deploy reported success without ever
        #     touching them (the F-1314 class, see the `binaries` input).
        # This step hits the PUBLIC edge (DNS + TLS + proxy + the real
        # query path) and, on r1, re-runs the version-skew probe that
        # found the second incident and requires skew == 0.
        #
        # The binaries are already live when this runs, so a miss here
        # cannot roll anything back — a RED JOB is the loud signal that
        # the operator must act (fix-forward or re-run the deploy with
        # the previous tag). Same non-destructive stance as the
        # config-apply gate above.
        #
        # curl: 5 attempts over ~60s so a cold cache right after the
        # api restart does not false-fail; --fail-with-body so a 5xx
        # shows its body in the log. F-1298: values through `env:`.
        env:
          REGION: ${{ inputs.region }}
          DEPLOY_HOST: ${{ steps.region.outputs.host }}
          DEPLOY_USER: ${{ steps.region.outputs.user }}
        run: |
          set -euo pipefail
          case "$REGION" in
            r1)        API_BASE="https://api.stellarindex.io" ;;
            testnet)   API_BASE="https://api.testnet.stellarindex.io" ;;
            futurenet) API_BASE="https://api.futurenet.stellarindex.io" ;;
            *) echo "::error::no public API base for region '$REGION'"; exit 1 ;;
          esac

          # smoke <path>: GET $API_BASE<path>, require HTTP 200 within
          # the retry budget, leave the body in ./smoke-body.json.
          # --retry-all-errors covers 5xx as well as connection errors
          # (plain --retry only retries transient codes); --retry-delay
          # 12 × 5 attempts ≈ 60s. -A names us in the api access log so
          # smoke traffic is distinguishable from user traffic.
          smoke() {
            local path="$1" code
            local url="${API_BASE}${path}"
            code="$(curl -sS -o smoke-body.json -w '%{http_code}' \
              -A 'stellarindex-deploy-smoke' \
              --max-time 30 --retry 4 --retry-delay 12 --retry-all-errors \
              "$url")" || true
            if [ "$code" != "200" ]; then
              echo "::error::served-path smoke: GET $url returned HTTP ${code:-<none>} after 5 attempts. Binaries are LIVE — fix forward or re-deploy the previous tag."
              head -c 2000 smoke-body.json 2>/dev/null || true
              echo
              exit 1
            fi
            echo "OK 200 GET $url"
          }

          smoke /v1/healthz
          status="$(jq -r '.data.status // empty' smoke-body.json)"
          if [ "$status" != "ok" ]; then
            echo "::error::served-path smoke: ${API_BASE}/v1/healthz is 200 but .data.status='${status}' (want 'ok')"
            cat smoke-body.json; echo
            exit 1
          fi
          echo "OK healthz status=ok"

          if [ "$REGION" = "r1" ]; then
            # The two list sizes the explorer actually requests: 500 is
            # the sitemap/build fetch that 500'd on 2026-08-28; 100 is
            # the default page size the UI uses.
            smoke '/v1/assets?limit=500'
            smoke '/v1/assets?limit=100'

            # Version-skew assertion over the SSH path the playbook
            # step already materialised (~/.ssh/id_deploy + the pinned
            # known_hosts from Set up SSH; r1 has no jump host). Runs
            # the same oneshot the 30-min timer runs so the number
            # below is the one Prometheus will scrape, not a
            # re-implementation. A missing unit is ALSO a failure:
            # it means the observability config that ships the probe
            # has not been applied to r1 (the config-apply gate class).
            PROM=/var/lib/node_exporter/textfile_collector/stellarindex_binary_version.prom
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "systemctl start stellarindex-binary-version-probe.service && cat $PROM" \
              > binary-version.prom
            grep -E '^stellarindex_binary_version_info' binary-version.prom || true
            skew="$(awk '$1 == "stellarindex_binary_version_skew" { print $2 }' binary-version.prom)"
            probe_ok="$(awk '$1 == "stellarindex_binary_version_probe_success" { print $2 }' binary-version.prom)"
            if [ "$skew" != "0" ] || [ "$probe_ok" != "1" ]; then
              echo "::error::binary version skew on r1 after deploy: stellarindex_binary_version_skew=${skew:-<missing>} probe_success=${probe_ok:-<missing>} (want 0 / 1). At least one release-managed binary is on a different version — re-run this deploy naming the stale binary. Runbook: docs/operations/runbooks/binary-version-skew.md"
              exit 1
            fi
            echo "OK binary version skew=0 across managed binaries"
          fi

      - name: Summary
        if: always()
        # F-1298: even the summary writer goes through `env:`, not
        # `${{ inputs.* }}` interpolation. A summary string of
        # `; rm -rf .` would have been shell-expanded pre-fix.
        env:
          REGION: ${{ inputs.region }}
          VERSION: ${{ inputs.version }}
          BINARIES: ${{ inputs.binaries }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Deploy summary"
            echo ""
            echo "- Region: \`${REGION}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Binaries: \`${BINARIES}\`"
            echo "- Outcome: \`${JOB_STATUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
