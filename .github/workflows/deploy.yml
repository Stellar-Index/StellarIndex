name: deploy

# Manual deploy of a tagged binary release to a region.
#
# Required GitHub Actions secrets:
#   DEPLOY_SSH_PRIVATE_KEY  — SSH key with root access to the
#                              region's host (`ssh-keygen -t ed25519`,
#                              public key authorised on the host)
#   R1_HOST                  — IP/hostname of the r1 box (e.g. 136.243.90.96)
#   R1_USER                  — SSH user; defaults to "root" if unset
#   R1_SSH_KNOWN_HOSTS       — `ssh-keyscan -t ed25519 <host>` output,
#                              base64-encoded (avoid newline-in-secret
#                              quirks). Pinning known_hosts prevents
#                              MITM during deploy.
#
# Triggered exclusively via workflow_dispatch. There's no auto-deploy
# on tag push — the release workflow produces the artefacts; a human
# decides when each region picks them up.
#
# Stack: depends on PRs #645 (release.yml + Dockerfiles + SemVer
# policy) which produces the v* tagged release artefacts this
# workflow downloads.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Target region'
        required: true
        type: choice
        options:
          - r1
      version:
        description: 'Version tag to deploy (e.g. v0.2.0). Must exist as a GitHub Release.'
        required: true
        type: string
      binaries:
        # F-1314 (codex audit-2026-05-13): the default deploy set
        # now INCLUDES stellarindex-sla-probe so the active
        # /opt/stellarindex/healthchecks/sla-probe.sh wrapper +
        # stellarindex-sla-probe.timer always have a matching
        # /usr/local/bin/stellarindex-sla-probe under it. Pre-fix
        # a nominal deploy would leave the SLA-evidence binary
        # stale (or absent on a fresh host) because the timer's
        # presence on r1 came from the wave-129 ssh-side
        # operator install, not from the release/deploy flow.
        description: 'Comma-separated binaries to deploy'
        required: false
        type: string
        default: 'stellarindex-indexer,stellarindex-aggregator,stellarindex-api,stellarindex-sla-probe'
      health_grace_seconds:
        description: 'Seconds to wait between restart and /v1/healthz probe'
        required: false
        type: string
        default: '15'
      migrations_skip:
        # F-1301 (rc.51 deploy): the playbook's hardcoded passwordless
        # DSN fails auth against the live db; operators who have
        # already applied migrations out-of-band (or who know the
        # schema is unchanged from the prior tag) can skip the step.
        description: 'Skip the migration sync + apply (use ONLY when migrations are already applied or schema is unchanged)'
        required: false
        type: boolean
        default: false

# Concurrency: at most one deploy per region in flight. Prevents two
# operators racing each other and producing inconsistent state.
concurrency:
  group: deploy-${{ inputs.region }}
  cancel-in-progress: false

permissions:
  contents: read           # download release artefacts
  deployments: read        # read the environment's protection rules (approval-gate preflight)
  # F-1296 (codex audit-2026-05-13): `id-token: write` removed.
  # No step currently consumes the OIDC JWT (keyless attestation
  # is planned but not wired yet); a compromised step in this
  # deploy job shouldn't be able to mint an OIDC token. Add it
  # back in the SAME PR that wires the attestation step.

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} → ${{ inputs.region }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.region }}
      # Set this in the repo's Environments → r1 → Reviewers list to
      # require manual approval before this job runs in r1. Leave
      # empty for unattended.

    steps:
      - name: Checkout (for Ansible playbook)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Assert the production approval gate is configured
        # deploy-approval-gate (audit-2026-07-23): the `environment:`
        # declaration above is not a gate by itself — an environment
        # with no `required_reviewers` rule deploys unattended, which is
        # exactly what `gh api repos/<repo>/environments/r1` returned
        # when the audit ran (`"protection_rules": []`). The reviewer
        # list lives in repo settings and cannot be set from a file in
        # this repo, so the strongest in-repo enforcement is to refuse
        # to deploy while the gate is absent. Runs FIRST: before the SSH
        # key, the artefacts, or the playbook.
        #
        # DEPLOY_PROTECTION_TOKEN is an optional escape hatch: if the
        # default GITHUB_TOKEN cannot read the environments API on this
        # repo, set that secret to a read-only PAT. It never relaxes the
        # assertion — it only supplies the credential to make it.
        #
        #
        # ⚠ PRE-PRODUCTION RELAXATION (2026-07-26): while R1 carries no
        # production traffic, this gate can be deliberately made a NO-OP
        # so the operator deploys autonomously (a self-approved gate is
        # theatre — see the master plan §0). The relaxation is honest,
        # visible, and FAIL-CLOSED by default: it is OFF unless the repo
        # variable DEPLOY_APPROVAL_RELAXED is explicitly set to "true".
        # Unset / a fresh clone / any other value ⇒ the gate ENFORCES.
        # ► RE-ARM BEFORE PRODUCTION LAUNCH: delete the repo variable
        #   (gh variable delete DEPLOY_APPROVAL_RELAXED) AND configure the
        #   r1 environment's Required-reviewers rule (Settings →
        #   Environments → r1). Deleting the variable alone already
        #   restores enforcement.
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
          REGION: ${{ inputs.region }}
          REPO: ${{ github.repository }}
          APPROVAL_RELAXED: ${{ vars.DEPLOY_APPROVAL_RELAXED }}
        run: |
          set -euo pipefail
          if [ "${APPROVAL_RELAXED:-}" = "true" ]; then
            echo "::warning::deploy-approval-gate RELAXED (pre-production, DEPLOY_APPROVAL_RELAXED=true). Deploying to '${REGION}' WITHOUT human approval. RE-ARM before production launch: delete the DEPLOY_APPROVAL_RELAXED repo variable and configure the '${REGION}' environment Required-reviewers rule."
            exit 0
          fi
          if ! gh api "repos/${REPO}/environments/${REGION}" > env-protection.json; then
            echo "::error::Could not read the '${REGION}' environment protection config. Refusing to deploy on an unverified approval gate. If the default GITHUB_TOKEN lacks access, set the DEPLOY_PROTECTION_TOKEN secret to a read-only PAT and re-run."
            exit 1
          fi
          bash scripts/ci/check-deploy-protection.sh env-protection.json "$REGION"

      - name: Validate inputs
        # F-1298 (codex audit-2026-05-13): pass inputs through
        # `env:` rather than interpolating `${{ inputs.* }}`
        # directly into the shell. Pre-fix the validation regex
        # ran AFTER the shell had already expanded the input —
        # an input like `"; cat /etc/passwd; echo "v1.0.0` would
        # execute `cat /etc/passwd` before the SemVer check
        # even fired. Env-var passing means the shell sees the
        # value as a regular string variable.
        env:
          VERSION: ${{ inputs.version }}
          BINARIES: ${{ inputs.binaries }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$'; then
            echo "::error::Version '$VERSION' must match SemVer vX.Y.Z[-prerelease][+build]"
            exit 1
          fi
          # Reject empty / whitespace-only binary list early
          BINS="$(echo "$BINARIES" | tr -d '[:space:]')"
          if [ -z "$BINS" ]; then
            echo "::error::binaries input is empty"
            exit 1
          fi
          # Each binary must be a known cmd/<name> directory
          IFS=',' read -ra LIST <<< "$BINS"
          for b in "${LIST[@]}"; do
            # Reject anything that's not [a-zA-Z0-9-] before
            # touching the filesystem — defends against an
            # input like `../../etc/passwd` that happened to
            # have a matching `cmd/` directory.
            if ! [[ "$b" =~ ^[a-zA-Z0-9-]+$ ]]; then
              echo "::error::Binary name '$b' contains illegal characters; only [a-zA-Z0-9-] permitted"
              exit 1
            fi
            if [ ! -d "cmd/$b" ]; then
              echo "::error::Unknown binary '$b' (no cmd/$b/ directory)"
              exit 1
            fi
          done
          echo "Validated ${#LIST[@]} binaries: ${LIST[*]}"

      - name: Resolve region inventory
        id: region
        # F-1298 (wave 126): inputs through `env:`, never
        # interpolated `${{ inputs.* }}` into the shell.
        env:
          R1_HOST: ${{ secrets.R1_HOST }}
          R1_USER: ${{ secrets.R1_USER }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          case "$REGION" in
            r1)
              host="${R1_HOST}"
              user="${R1_USER:-root}"
              ;;
            *)
              echo "::error::Region '$REGION' has no inventory mapping"
              exit 1
              ;;
          esac
          if [ -z "$host" ]; then
            echo "::error::Region $REGION host secret is unset"
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "Target: $user@$host"

      - name: Download release binaries
        # F-1298 (wave 126): inputs through `env:`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          BINARIES: ${{ inputs.binaries }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          IFS=',' read -ra LIST <<< "$(echo "$BINARIES" | tr -d '[:space:]')"
          for b in "${LIST[@]}"; do
            artifact="${b}-linux-amd64"
            echo "Downloading $artifact from release $VERSION"
            gh release download "$VERSION" \
              -p "$artifact" -O "dist/$artifact" \
              -R "$REPO"
            chmod +x "dist/$artifact"
          done
          echo "---"
          ls -la dist/

      - name: Install cosign
        # Same pinned pair as release.yml's signing step: the installer
        # action is SHA-pinned AND the cosign version it installs is
        # pinned, so neither a tag move on the action nor a change in
        # the installer's default cosign version can alter what verifies
        # our releases.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Verify release signature, then checksums
        # CID-09 + artifact-integrity-verification (audit-2026-07-23).
        #
        # Pre-fix this step downloaded SHA256SUMS from the same release
        # as the binaries and checked the binaries against it. That
        # proves internal consistency and nothing else: anyone able to
        # replace a release asset replaces the manifest in the same
        # breath. release.yml has cosign-signed SHA256SUMS since the
        # BACKLOG #51b migration, and NOTHING on the deploy path looked
        # at that signature — the whole value of signing was unrealised.
        #
        # The Fulcio certificate in the sigstore bundle is the anchor an
        # asset-replacing attacker cannot forge: it binds the manifest
        # to THIS repository's release.yml workflow (identity) issued by
        # GitHub's OIDC provider (issuer), and Rekor's transparency log
        # makes a backdated signature detectable. Verify the signature
        # FIRST; only then does a checksum mean anything.
        #
        # Identity is pinned to the release workflow path, and to either
        # the tag being deployed (normal `push`-triggered release) or
        # refs/heads/main (release.yml's documented workflow_dispatch
        # rebuild path). Both require the ability to run release.yml in
        # this repo; neither is reachable by replacing assets.
        #
        # F-1298 (wave 126): inputs through `env:`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          BINARIES: ${{ inputs.binaries }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" -p SHA256SUMS -O dist/SHA256SUMS -R "$REPO"
          gh release download "$VERSION" -p SHA256SUMS.sigstore.json \
            -O dist/SHA256SUMS.sigstore.json -R "$REPO"

          # Regex-escape the interpolated parts. `version` already
          # passed the SemVer gate in "Validate inputs", so it can only
          # contain [A-Za-z0-9.+-]; `.` and `+` are the regex-significant
          # members of that set.
          REPO_RE="$(printf '%s' "$REPO" | sed -e 's/[.+]/\\&/g')"
          VER_RE="$(printf '%s' "$VERSION" | sed -e 's/[.+]/\\&/g')"
          IDENTITY="^https://github\.com/${REPO_RE}/\.github/workflows/release\.yml@refs/(tags/${VER_RE}|heads/main)$"
          echo "Expected signer identity: $IDENTITY"

          cosign verify-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

          cd dist
          # SHA256SUMS is now trusted. It contains every artefact's sum;
          # filter to the binaries we downloaded and verify just those.
          # A binary with no entry in the signed manifest is a hard fail
          # (pre-fix the empty grep also failed, but silently and for
          # the wrong reason).
          IFS=',' read -ra LIST <<< "$(echo "$BINARIES" | tr -d '[:space:]')"
          for b in "${LIST[@]}"; do
            if ! line="$(grep -E "  ${b}-linux-amd64$" SHA256SUMS)"; then
              echo "::error::${b}-linux-amd64 has no entry in the signed SHA256SUMS for $VERSION"
              exit 1
            fi
            printf '%s\n' "$line" | sha256sum -c -
          done
          echo "Signature + checksums OK"

      # F-1220 (codex audit-2026-05-12): ship the migrations dir
      # alongside binaries so the playbook can sync + apply them
      # BEFORE the binary swap. Without this, a tagged deploy that
      # depends on a new schema would restart binaries onto an
      # out-of-date DB and produce partial-outage shapes that
      # /v1/healthz wouldn't catch.
      - name: Stage migrations from the release tag's tree
        # F-1298 (wave 126): inputs through `env:`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist/migrations
          # artifact-integrity-verification (audit-2026-07-23): prefer
          # the SIGNED migrations bundle. release.yml packs the tag's
          # migrations/ into dist/migrations.tar.gz BEFORE computing
          # SHA256SUMS, so the cosign signature verified above covers
          # the SQL that is about to run as DDL on production — the
          # same chain the binaries get.
          # Asked as a single command substitution, NOT `gh … | grep -q`:
          # under `pipefail` a `grep -q` that exits early SIGPIPEs gh
          # (141) and the pipeline reports failure even on a match,
          # which would silently downgrade to the unsigned path.
          has_bundle="$(gh release view "$VERSION" -R "$REPO" --json assets \
            --jq '[.assets[].name] | index("migrations.tar.gz") // empty')"
          if [ -n "$has_bundle" ]; then
            gh release download "$VERSION" -p migrations.tar.gz \
              -O dist/migrations.tar.gz -R "$REPO"
            (cd dist && grep -E "  migrations\.tar\.gz$" SHA256SUMS | sha256sum -c -)
            tar -xzf dist/migrations.tar.gz -C dist/migrations --strip-components=1
            rm -f dist/migrations.tar.gz
          else
            # Releases cut before the signed bundle landed. The tag
            # tarball is served by GitHub but is covered by NO
            # signature, so this path is announced loudly rather than
            # taken silently. Re-cut the tag to get a signed bundle.
            echo "::warning::Release $VERSION has no signed migrations.tar.gz (cut before audit-2026-07-23); falling back to the UNSIGNED tag tarball for migrations. Re-run release.yml for this tag to get a signed bundle."
            # ONE tarball fetch of the tag's tree — guarantees binary ↔
            # migration set parity even if main has advanced since the
            # tag. Previously this looped `gh api contents` per file
            # (~180 sequential API calls); on 2026-07-09 that tripped
            # GitHub's secondary rate limit twice in a row (an HTML
            # error page mid-loop → "invalid character '<'"), failing
            # the v0.10.0 deploy before it touched the host. A single
            # tarball request can't hit the per-request burst limit.
            mkdir -p tag-tree
            gh api "repos/$REPO/tarball/$VERSION" > tag.tar.gz
            tar -xzf tag.tar.gz -C tag-tree --strip-components=1
            cp -R tag-tree/migrations/. dist/migrations/
            rm -rf tag-tree tag.tar.gz
          fi
          echo "---"
          # `| head` + pipefail interacts badly: head closes early,
          # ls hits SIGPIPE, pipefail fails the step even though
          # everything staged correctly. F-1300 (rc.51 deploy fail).
          # Print the count + the first 10 names via sort+head.
          echo "staged $(ls dist/migrations/ | wc -l) migration files"
          ls dist/migrations/ | sort | head -n 10

      - name: Migration rollback-safety gate
        # CID-14 (audit-2026-07-23). The playbook applies `migrate up`
        # in its pre_tasks — BEFORE the binary swap — and a failed
        # health probe rolls back the BINARY ONLY; the schema stays
        # forward (CS-099, deliberate: down-migrations are
        # data-destructive and the pipeline cannot know what already
        # depends on what it would revert). That is safe if and only if
        # every migration keeps the PREVIOUS released binary working
        # against the NEW schema — migrations/README.md rule 9. Prose
        # said so; nothing checked it.
        #
        # This is the LAST gate before DDL runs on production, and it
        # matters independently of the PR-time run in ci.yml: `main` is
        # not branch-protected, so a migration can reach a tag without
        # ever passing CI.
        run: |
          set -euo pipefail
          MIGRATIONS_DIR=dist/migrations \
            bash scripts/ci/lint-migration-compat.sh --staged

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS_B64: ${{ secrets.R1_SSH_KNOWN_HOSTS }}
          HOST: ${{ steps.region.outputs.host }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # F-1297 (codex audit-2026-05-13): fail fast if the
          # pinned host-key secret is missing instead of falling
          # back to live `ssh-keyscan` — the fallback was a
          # silent MITM exposure (any TCP attacker on the path
          # to the deploy host could have served a forged host
          # key and the workflow would have trusted it for the
          # entire deploy session). Operators must populate
          # `<REGION>_SSH_KNOWN_HOSTS` from a trusted out-of-band
          # capture before the first deploy of each region.
          if [ -z "${KNOWN_HOSTS_B64:-}" ]; then
            echo "::error::${REGION:-R1}_SSH_KNOWN_HOSTS is unset. Capture once via `ssh root@<host> 'ssh-keyscan -t ed25519 <host>' | base64 -w0` and set it as a repo secret before retrying. Live ssh-keyscan fallback was removed in wave 126 (F-1297) — it was a MITM hole." >&2
            exit 1
          fi
          echo "$KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Install Ansible
        # F-1299 (codex audit-2026-05-13): EXACT pins for both
        # ansible-core and pip itself. Pre-fix `'ansible-core==2.18.*'`
        # let any 2.18.x patch land at deploy time, including future
        # 2.18.999. The requirements.yml file is also now exact-pinned.
        # Bumps are a deliberate three-file edit: this pin, the
        # requirements.yml pin, and a deploy-replay confirmation.
        run: |
          python3 -m pip install 'pip==24.3.1'
          python3 -m pip install 'ansible-core==2.18.4'
          # F-1220 (codex audit-2026-05-12): the deploy-binary playbook
          # uses `ansible.posix.synchronize` to stage the new binary
          # before atomic install. `ansible-core` ships only the
          # bundled collections; `ansible.posix` lives in Galaxy and
          # must be installed separately. requirements.yml is the
          # source of truth for ALL collection pins (posix,
          # community.*).
          ansible-galaxy collection install -r configs/ansible/requirements.yml

      - name: Run deploy playbook
        # F-1298 (wave 126): inputs through `env:`. Note that
        # `ansible-playbook -e "key=$VAR"` STILL needs care —
        # ansible-playbook itself parses that string. The
        # validation regex on `version` (in the Validate step
        # above) and the `[a-zA-Z0-9-]+` regex on per-binary
        # entries (also above) guarantee these values can't
        # carry shell metacharacters. health_grace_seconds is
        # type=number per the workflow_dispatch schema so
        # GitHub itself enforces the type before substitution.
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'True'
          ANSIBLE_FORCE_COLOR: '1'
          DEPLOY_HOST: ${{ steps.region.outputs.host }}
          DEPLOY_USER: ${{ steps.region.outputs.user }}
          VERSION: ${{ inputs.version }}
          BINARIES: ${{ inputs.binaries }}
          HEALTH_GRACE: ${{ inputs.health_grace_seconds }}
          MIGRATIONS_SKIP: ${{ inputs.migrations_skip }}
        run: |
          set -euo pipefail
          ansible-playbook \
            -i "${DEPLOY_HOST}," \
            -u "${DEPLOY_USER}" \
            --private-key ~/.ssh/id_deploy \
            -e "version=${VERSION}" \
            -e "binaries_csv=${BINARIES}" \
            -e "local_dist_dir=$GITHUB_WORKSPACE/dist" \
            -e "health_grace_seconds=${HEALTH_GRACE}" \
            -e "migrations_skip=${MIGRATIONS_SKIP}" \
            configs/ansible/playbooks/deploy-binary.yml

      - name: Summary
        if: always()
        # F-1298: even the summary writer goes through `env:`, not
        # `${{ inputs.* }}` interpolation. A summary string of
        # `; rm -rf .` would have been shell-expanded pre-fix.
        env:
          REGION: ${{ inputs.region }}
          VERSION: ${{ inputs.version }}
          BINARIES: ${{ inputs.binaries }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Deploy summary"
            echo ""
            echo "- Region: \`${REGION}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Binaries: \`${BINARIES}\`"
            echo "- Outcome: \`${JOB_STATUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
