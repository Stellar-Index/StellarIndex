---
# Daily production crawl guard.
#
# Why: silent site rot: pages 404ing from the site's
# own links, canonicals pointing at dead URLs, doubled titles, a
# curated sliver presented as the asset universe. Each incident is
# pinned as a check in scripts/ci/site-crawl-check.sh; this runs the
# battery daily against production and on demand. The `browser` job
# crawls all three explorers in Chromium (scripts/ci/site-crawl-browser/crawl.cjs)
# for client-rendered Not found pages and failing API calls, which curl
# cannot see.
#
# Read-only: ~80 GETs against the public site + API, no secrets.
#
# A regression here would otherwise just turn the Actions tab red with no
# escalation — indistinguishable from every other quiet failure until
# someone went looking. Same idempotent open/update/close tracking-issue
# shape as public-dataset-check.yml and dns-perimeter-check.yml: this
# checks a deployed, external artifact (production), not repo state at
# HEAD, so it never fails the scheduled run red — it pages through the
# issue instead.

name: site-crawl

on:
  schedule:
    - cron: '20 6 * * *' # daily 06:20 UTC
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: site-crawl
  cancel-in-progress: false

env:
  ISSUE_LABEL: site-crawl-drift
  ISSUE_TITLE: "Site crawl regression (stellarindex.io)"

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the site crawl battery
        id: crawl
        run: |
          set -uo pipefail
          # Capture the exit code directly. Piping this into tee or sed
          # would report the pipe's last status, not the gate's. `|| rc=$?`
          # because the step shell is `bash -e`: a bare failure aborts here.
          rc=0
          bash scripts/ci/site-crawl-check.sh > /tmp/site-crawl.txt 2>&1 || rc=$?
          cat /tmp/site-crawl.txt
          {
            echo "verdict_rc=${rc}"
            echo "report<<REPORT_EOF"
            cat /tmp/site-crawl.txt
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue (site crawl regressed)
        if: steps.crawl.outputs.verdict_rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.crawl.outputs.report }}
        run: |
          set -euo pipefail
          gh label create "$ISSUE_LABEL" --color B60205 \
            --description "scripts/ci/site-crawl-check.sh found a regression against production" 2>/dev/null || true

          body="$(printf '%s\n\n---\n_Auto-managed by the site-crawl workflow (run %s). Closes automatically once site-crawl-check.sh is clean again._\n' \
            "$REPORT" "${GITHUB_RUN_ID:-?}")"

          existing="$(gh issue list --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Updated existing site-crawl-drift issue #$existing."
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
            echo "Opened new site-crawl-drift issue."
          fi
          echo "::warning::site-crawl-check.sh found a regression — see the tracking issue. (Scheduled run deliberately not failed.)"

      - name: Close the tracking issue (site crawl clean)
        if: steps.crawl.outputs.verdict_rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --label "$ISSUE_LABEL" --state open \
              --json number --jq '.[].number' || true); do
            gh issue close "$n" --comment "site-crawl-check.sh is clean again — site-crawl closing automatically."
            echo "Closed site-crawl-drift issue #$n."
          done

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: mainnet
            site: https://stellarindex.io
            api: https://api.stellarindex.io
          - network: testnet
            site: https://testnet.stellarindex.io
            api: https://api.testnet.stellarindex.io
          - network: futurenet
            site: https://futurenet.stellarindex.io
            api: https://api.futurenet.stellarindex.io
    env:
      BROWSER_LABEL: site-crawl-browser-${{ matrix.network }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          cd scripts/ci/site-crawl-browser
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Crawl the explorer in a browser
        id: crawl
        env:
          SITE: ${{ matrix.site }}
          API: ${{ matrix.api }}
        run: |
          set -uo pipefail
          rc=0
          node scripts/ci/site-crawl-browser/crawl.cjs "$SITE" "$API" 300 > /tmp/browser-crawl.txt 2>&1 || rc=$?
          cat /tmp/browser-crawl.txt
          {
            echo "verdict_rc=${rc}"
            echo "report<<REPORT_EOF"
            cat /tmp/browser-crawl.txt
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Open or update the tracking issue (browser crawl regressed)
        if: steps.crawl.outputs.verdict_rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.crawl.outputs.report }}
          NETWORK: ${{ matrix.network }}
        run: |
          set -euo pipefail
          gh label create "$BROWSER_LABEL" --color B60205 \
            --description "scripts/ci/site-crawl-browser/crawl.cjs found a regression on $NETWORK" 2>/dev/null || true
          body="$(printf '%s\n\n---\n_Auto-managed by the site-crawl workflow (run %s). Closes automatically once the %s browser crawl is clean again._\n' \
            "$REPORT" "${GITHUB_RUN_ID:-?}" "$NETWORK")"
          existing="$(gh issue list --label "$BROWSER_LABEL" --state open \
            --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Browser crawl regression ($NETWORK explorer)" --label "$BROWSER_LABEL" --body "$body"
          fi
          echo "::warning::$NETWORK browser crawl found a regression — see the tracking issue."
      - name: Close the tracking issue (browser crawl clean)
        if: steps.crawl.outputs.verdict_rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --label "$BROWSER_LABEL" --state open \
              --json number --jq '.[].number' || true); do
            gh issue close "$n" --comment "Browser crawl is clean again — closing automatically."
          done
