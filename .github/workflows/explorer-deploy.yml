---
# Manual-trigger Cloudflare Pages deploy for the explorer.
#
# **The recommended publish path is Cloudflare's git integration**
# (see docs/operations/explorer-deployment.md §Recommended). It
# auto-deploys on every push to main without consuming GitHub
# Actions minutes. This workflow exists for two cases:
#
#   1. **Hotfix** — push a fixed version of an arbitrary commit
#      (workflow_dispatch supports `ref:` selection).
#   2. **CF git integration paused** — fall back to publishing
#      from CI when the Pages project's git connection is
#      disabled (e.g. mid-rotation of the CF GitHub app token).
#
# Only fires on workflow_dispatch — never on push. Operators
# trigger via the Actions tab or:
#
#     gh workflow run explorer-deploy.yml --ref main \
#         -f network=testnet -f environment=production
#
# The `network` input selects which explorer to build + publish; it bakes
# NEXT_PUBLIC_NETWORK (drives the nav network-switcher) and derives the grey
# api.* origin + the Cloudflare Pages project:
#   mainnet   → stellarindex-explorer            (api.stellarindex.io)
#   testnet   → stellarindex-explorer-testnet    (api.testnet.stellarindex.io)
#   futurenet → stellarindex-explorer-futurenet  (api.futurenet.stellarindex.io)
# The two test-net Pages projects + their custom domains (testnet./futurenet.
# stellarindex.io) must be created ONCE in the Cloudflare dashboard — see
# docs/operations/explorer-deployment.md §Test nets.
#
# Required secrets (set once in repo settings):
#   - CLOUDFLARE_API_TOKEN  — token with Pages:Edit on ALL three explorer
#                             projects (mainnet renamed from
#                             stellarindex-showcase 2026-07-04, task #23)
#   - CLOUDFLARE_ACCOUNT_ID — the CF account UUID

name: explorer-deploy

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Which network's explorer to deploy"
        required: true
        default: "mainnet"
        type: choice
        options:
          - mainnet
          - testnet
          - futurenet
      environment:
        description: "production or preview"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      api_base_url:
        description: "Override NEXT_PUBLIC_API_BASE_URL (blank → derived from network: api[.<net>].stellarindex.io)"
        required: false
        default: ""

permissions:
  contents: read
  deployments: write

# One deploy at a time. Mid-deploy cancellation is fine — the
# new run takes over before traffic shifts.
concurrency:
  group: explorer-deploy-${{ github.event.inputs.network }}-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: explorer-${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the production approval gate is configured
        # deploy-approval-gate (audit-2026-07-23, CID-20): this job
        # declares `environment: explorer-${environment}`, which is not
        # a gate by itself — an environment with no `required_reviewers`
        # rule deploys unattended, exactly like deploy.yml's `r1` gate
        # before that assertion landed. This job holds
        # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID and can repoint the
        # live explorer, so it gets the same fail-closed check. Scoped
        # to `production` only — `preview` is a low-stakes, non-public
        # target and gating it too would block routine hotfix previews
        # without a matching security benefit.
        #
        # DEPLOY_PROTECTION_TOKEN is the same optional escape hatch
        # deploy.yml documents: if the default GITHUB_TOKEN cannot read
        # the environments API on this repo, set that secret to a
        # read-only PAT. It never relaxes the assertion.
        # ► RE-ARM BEFORE PRODUCTION LAUNCH: delete the repo variable
        #   (gh variable delete DEPLOY_APPROVAL_RELAXED) AND configure the
        #   explorer-production environment's Required-reviewers rule.
        #   Deleting the variable alone already restores enforcement.
        #   The relaxation arm mirrors deploy.yml VERBATIM (2026-08-05):
        #   the two deploy workflows must share ONE approval posture —
        #   pre-fix this one lacked the arm, so the repo-wide
        #   DEPLOY_APPROVAL_RELAXED=true phase variable let r1 binaries
        #   deploy unattended while the explorer hard-failed.
        if: github.event.inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
          ENV_NAME: explorer-${{ github.event.inputs.environment }}
          REPO: ${{ github.repository }}
          APPROVAL_RELAXED: ${{ vars.DEPLOY_APPROVAL_RELAXED }}
        run: |
          set -euo pipefail
          if [ "${APPROVAL_RELAXED:-}" = "true" ]; then
            echo "::warning::deploy-approval-gate RELAXED (pre-production, DEPLOY_APPROVAL_RELAXED=true). Deploying '${ENV_NAME}' WITHOUT human approval. RE-ARM before production launch: delete the DEPLOY_APPROVAL_RELAXED repo variable and configure the '${ENV_NAME}' environment Required-reviewers rule."
            exit 0
          fi
          if ! gh api "repos/${REPO}/environments/${ENV_NAME}" > env-protection.json; then
            echo "::error::Could not read the '${ENV_NAME}' environment protection config. Refusing to deploy on an unverified approval gate. If the default GITHUB_TOKEN lacks access, set the DEPLOY_PROTECTION_TOKEN secret to a read-only PAT and re-run."
            exit 1
          fi
          bash scripts/ci/check-deploy-protection.sh env-protection.json "$ENV_NAME"

      - name: Resolve network config
        # Map the network choice → NEXT_PUBLIC_NETWORK, the grey api.* origin,
        # and the per-network Cloudflare Pages project. Untrusted inputs are
        # read via env and never interpolated into the shell; the project name
        # is a fixed case-arm string (safe for the wrangler command).
        id: net
        env:
          NETWORK: ${{ github.event.inputs.network }}
          API_OVERRIDE: ${{ github.event.inputs.api_base_url }}
        run: |
          set -euo pipefail
          case "$NETWORK" in
            mainnet)   base="https://api.stellarindex.io";           project="stellarindex-explorer" ;;
            testnet)   base="https://api.testnet.stellarindex.io";   project="stellarindex-explorer-testnet" ;;
            futurenet) base="https://api.futurenet.stellarindex.io"; project="stellarindex-explorer-futurenet" ;;
            *) echo "::error::unknown network '$NETWORK'"; exit 1 ;;
          esac
          api="${API_OVERRIDE:-$base}"
          if [[ ! "$api" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::api_base_url '$api' is not a bare https origin"; exit 1
          fi
          {
            echo "network=$NETWORK"
            echo "api_base=$api"
            echo "project=$project"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: network=$NETWORK api=$api project=$project"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/explorer/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web/explorer
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web/explorer
        env:
          NEXT_PUBLIC_NETWORK: ${{ steps.net.outputs.network }}
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.net.outputs.api_base }}
        run: pnpm build

      - name: Verify build artefact
        working-directory: web/explorer
        run: |
          test -d out || { echo "out/ missing — Next.js build produced no static export"; exit 1; }
          test -f out/index.html || { echo "out/index.html missing — sitemap or routing broken"; exit 1; }
          ls -la out/ | head

      # TRIAGE (site-audit S-024, 2026-07-03): Next 16 emits ~8 per-segment
      # RSC prefetch files per page (__next.*.txt) for its client segment
      # cache — 36k files at our page count, past Cloudflare Pages' hard
      # 20,000-file cap. Every deploy since the Next 15→16 bump silently
      # failed here and the site froze on a June-24 build. The segment
      # files are prefetch-only: the client treats a missing segment as a
      # cache miss and falls back to the standard index.txt RSC fetch
      # (verified by browsing a pruned build). Pruning restores deploys
      # while ADR-0044 (edge SSR) replaces static export as the real fix.
      # KEEP __next._tree.txt: it is the ONLY segment file the client router
      # actually PREFETCHES (on <Link> hover/viewport). Pruning it 404s every
      # prefetch on routes without a functions/*/[[path]].js shell fallback —
      # the "tons of console errors" report (2026-08-27). The bulkier
      # per-segment payloads (_head/_full/_index/__PAGE__/layout) are fetched
      # only on actual navigation, where the client falls back to index.txt, so
      # those stay pruned to hold the file budget. Keeping ~1 tree file/route
      # adds ~2.3k files — still far under the 18,500 ceiling. ADR-0044 (edge
      # SSR) remains the real fix.
      - name: Prune Next 16 segment-cache prefetch files (keep _tree)
        run: |
          BEFORE=$(find web/explorer/out -type f | wc -l)
          find web/explorer/out -type f -name "__next.*" ! -name "__next._tree.txt" -delete
          AFTER=$(find web/explorer/out -type f | wc -l)
          echo "pruned segment files (kept _tree): $BEFORE -> $AFTER"

      # Fail BEFORE the CF upload if the static export approaches Cloudflare
      # Pages' 20,000-file-per-deployment cap (Spike A 2026-06-24; SEO plan R1).
      # Exceeding it makes `wrangler pages deploy` fail opaquely; this surfaces
      # it early with the fix (lower the curated pre-render caps / shard).
      - name: Cloudflare file-budget guard
        run: bash scripts/ci/explorer-file-budget.sh web/explorer/out

      # Assert every indexable page has title + description + canonical
      # (noindex pages exempt). SEO plan WS15.
      - name: SEO metadata lint
        run: bash scripts/ci/explorer-seo-lint.sh web/explorer/out

      - name: Resolve deploy branch
        # F-004: workflow_dispatch means github.ref_name is whatever ref the
        # run was launched from — any pushable branch (incl. wt/* agent
        # branches). Passed straight into the wrangler `command:` it is a
        # script-injection vector in a job holding CLOUDFLARE_API_TOKEN. Take
        # the raw value via `env:` (never interpolate a `${{ }}` into the
        # shell), allowlist-validate it, and only then export it for the
        # deploy step to consume as a static, metacharacter-free token.
        env:
          RAW_BRANCH: ${{ github.event.inputs.environment == 'production' && 'main' || github.ref_name }}
        run: |
          set -euo pipefail
          # Whole-string match ([[ =~ ]], not line-oriented grep) so an
          # embedded newline can't slip a second line past the allowlist
          # and into $GITHUB_ENV. Mirrors deploy.yml's binary-name check.
          if [[ ! "$RAW_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Refusing to deploy: branch '$RAW_BRANCH' has characters outside [A-Za-z0-9._/-]"
            exit 1
          fi
          printf 'BRANCH=%s\n' "$RAW_BRANCH" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/explorer
          command: >-
            pages deploy out
            --project-name ${{ steps.net.outputs.project }}
            --branch ${{ env.BRANCH }}
