name: ansible-drift

# The codified≠live guarantee: a weekly --check --diff of the
# archival-node playbook against live r1. Any reported change means the
# two have diverged — a hand fix that needs codifying, or repo config that
# needs applying. Either way the workflow FAILS loudly instead of the gap
# surfacing as an incident months later (rules "fixed" in ansible but
# never live; a playbook about to erase hand-made live config).
#
# Secrets (all must be current — set in repo settings):
#   - DEPLOY_SSH_PRIVATE_KEY  (same key deploy.yml uses)
#   - R1_SSH_KNOWN_HOSTS      (base64 of the pinned r1 host key — the same
#                              secret deploy.yml pins; REQUIRED, there is no
#                              live ssh-keyscan fallback)
#   - ANSIBLE_VAULT_PASSWORD  (the r1.secrets.yml vault password)
#   - ANSIBLE_VAULT_FILE_B64  (base64 of the encrypted r1.secrets.yml)
#   - R1_INVENTORY_B64        (base64 of configs/ansible/inventory/r1.yml —
#                              see immediately below)
#
# R1_INVENTORY_B64. configs/ansible/inventory/r1.yml is not tracked — it
# carries the production host IP, `allowed_ssh_cidrs`, disk serials and
# the operator SSH pubkey, and this is a PUBLIC repository — so this
# workflow materializes it from an Actions secret, exactly as it does the
# vault. Recreate the secret from the working-tree copy with
# `base64 -w0 configs/ansible/inventory/r1.yml` (macOS: `base64 -i`).
#
# Untracking does not rewrite git history. Every value that file ever held
# is still readable from any clone via `git log -p --
# configs/ansible/inventory/r1.yml`, and must be treated as public:
#   - the r1 IP and open SSH surface are already-known facts — mitigate by
#     narrowing `allowed_ssh_cidrs`, not by hiding the file;
#   - anything credential-shaped that ever appeared there needs ROTATION,
#     not untracking (see docs/operations/credential-rotation.md).
#
# A FAILURE here is a GENUINE DRIFT signal (host≠codified: a `changed>0`
# diff or a missing systemd unit), NOT a credential problem — reconcile r1
# (or the playbook). The "Vault password" step fails fast with an explicit
# message if a secret is ever unset (see the missing-secret guard below);
# `R1_INVENTORY_B64 is unset` lines elsewhere in a log are the shell
# ECHOING the guard's source, not the guard firing.
#
# "Red on every schedule, green on dispatch" is NOT a scheduled-context
# difference: credentials are present under `schedule` exactly as under
# `workflow_dispatch`. Dispatches tend to be green because of WHEN they
# run — minutes after an operator applies config to r1, so the host is
# momentarily in step. Repo config then moves on and the next Monday's run
# finds the week's worth that was never applied (deploy-binary.yml ships
# binaries; nothing ships config). Look there, not at Actions settings.
#
# Check mode cannot enable a unit that is NEW IN THE REPO and not yet on
# r1 (`--check` never really writes the unit file), and that module error
# is fatal to the play. The role carries the CHECK-MODE UNIT GUARD rule
# (configs/ansible/roles/archival-node/tasks/main.yml) on tasks that enable
# ROLE-INSTALLED units, and the verdict step below runs even when the
# playbook step fails, so an abort is reported with the failing task named
# instead of as a bare red X.
#
# THIS WORKFLOW REPORTS BY FAILING, AND SAYS SO IN ONE MACHINE-READABLE
# LINE. The scheduled-control sweep in ci-health.yml has to know that a
# red scheduled run here is this control WORKING — it found drift and
# named the tasks — not a control that has stopped. Without the
# declaration the sweep can only see "no passing scheduled run past N
# days" and reports a stopped control. The marker below moves this
# workflow from that sweep's FAIL class to its ALARM class: still flagged,
# still counted, still failing ci-health.yml — the sweep grants no relief
# for declaring, and cannot (see WHY THE MARKER CANNOT HIDE A REAL FAILURE
# in scripts/ci/check-scheduled-controls.sh) — but named as a finding to
# read rather than as plumbing to repair.
#
# The quoted step name is load-bearing and checked two ways: the sweep
# ignores the marker unless a step of exactly that name exists in this
# file, and scripts/ci/check-scheduled-controls-test.sh fails on every
# PR if it does not. Rename the verdict step and this line must be
# renamed with it.
#
# scheduled-control: reports-by-failing "Drift verdict (fails on drift, and NAMES the tasks)"
#
# A GREEN RUN MEANS "codified = live", ON EVERY PATH. An apply re-runs the
# dry-run and renders the verdict on the result, so `apply=true` cannot
# conclude `success` without checking anything, and it proves convergence
# rather than merely asserting it.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: >-
          APPLY the playbook for real (drops --check). Default false =
          dry-run only. Applying RESTARTS stellarindex-indexer,
          -aggregator and -api. Run the dry-run first and read its
          changed-task list; this input is deliberately not the default.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read        # read the environment's protection rules (gate preflight)
  actions: read            # GitHub gates the environments API on Actions read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    # An apply run is two full playbook passes (the apply, then the
    # dry-run that renders its verdict); one pass has measured ~12 min.
    timeout-minutes: 45
    # apply=true mutates r1 as root, so it takes deploy.yml's gate: the
    # r1 environment's reviewers and main-only branch policy. The
    # scheduled dry-run holds the same key but cannot wait on a
    # reviewer, so it runs in r1-observe (main-only, no reviewers).
    environment:
      name: ${{ inputs.apply && 'r1' || 'r1-observe' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # FULL history and tags, both load-bearing for this job.
          # The role stamps the shipped Tier-1 intent file with
          # `git describe --tags --abbrev=0` and the last commit to touch
          # tier1_schema.sql. Under the default shallow checkout the
          # first returns EMPTY (no tags fetched) and the second returns
          # the TIP commit rather than the file's own — so the intent
          # file this job renders differs from the one an operator
          # renders from a full clone, and the drift verdict compares
          # a stamp against a different stamp and reports drift that
          # does not exist.
          fetch-depth: 0
          fetch-tags: true

      - name: Assert the environment gate is configured
        # Runs before any credential is materialized. The reviewer
        # relaxation (DEPLOY_APPROVAL_RELAXED) applies to apply=true
        # exactly as it does to deploy.yml; see assert-deploy-gate.sh.
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APPLY: ${{ inputs.apply }}
          APPROVAL_RELAXED: ${{ vars.DEPLOY_APPROVAL_RELAXED }}
          APPROVAL_RELAXED_UNTIL: ${{ vars.DEPLOY_APPROVAL_RELAXED_UNTIL }}
        run: |
          set -euo pipefail
          if [ "${APPLY:-false}" = "true" ]; then
            bash scripts/ci/assert-deploy-gate.sh r1
          else
            bash scripts/ci/assert-deploy-gate.sh --observe r1-observe
          fi

      - name: Install ansible
        # EXACT pins. This job holds the root
        # SSH key for r1 AND the decrypted production vault; an
        # unpinned `pipx install ansible` hands whatever PyPI serves at
        # run time full execution rights over both. A yanked, hijacked or
        # simply broken upstream release becomes a production-credential
        # incident with no diff to review.
        #
        # Bumps are a reviewable one-line diff. Note deploy.yml pins
        # ansible-core 2.18.4 separately — that is the DEPLOY path's pin and moves
        # on its own schedule; this is the drift-check controller.
        #
        # PyPI forbids re-uploading a version's files, so `==` closes
        # the yanked/hijacked-new-release vector. Full transitive hash
        # pinning (`pip install --require-hashes`) would need a
        # generated constraints file covering ansible's entire closure;
        # tracked as follow-up, not hand-maintainable here.
        #
        # The `ansible` bundle carries its own
        # community.general/ansible.posix/community.postgresql at
        # whatever version pipx resolved (community.general 11.x-class
        # under ansible 14.2.0) — a different set than deploy.yml
        # applies to r1 (community.general 9.5.0 / ansible.posix 1.5.4
        # / community.postgresql 3.10.0, pinned in requirements.yml).
        # Without the step below, this job's `--check --diff` (and its
        # opt-in `apply=true` real run against r1) would evaluate under the
        # bundle's collections, not the ones applied at deploy time — two
        # different collection sets both able to mutate production r1. Installing
        # the pinned collections AFTER the bundle puts them in
        # ~/.ansible/collections, which Ansible resolves ahead of the
        # collections shipped inside the `ansible` package, so this
        # job's dry-run and apply now use the same collections deploy.yml
        # does.
        run: |
          set -euo pipefail
          ./scripts/ci/install-ansible.sh bundle
          pipx inject ansible 'passlib==1.7.4'
          ansible-galaxy collection install -r configs/ansible/requirements.yml

      - name: SSH key + known_hosts
        # Mirrors deploy.yml's "Set up SSH" step:
        #  - route the deploy key through `env:`, never interpolate a
        #    `${{ secrets.* }}` into the shell, and write it with printf.
        #  - PIN the host key from R1_SSH_KNOWN_HOSTS and fail fast if it
        #    is unset. The previous live `ssh-keyscan` trusted whatever
        #    key was served on the wire — a silent MITM hole in a job that
        #    carries the deploy key + vault password (host_key_checking is
        #    True in ansible.cfg, so this known_hosts is load-bearing).
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS_B64: ${{ secrets.R1_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # inventory/r1.yml pins ansible_ssh_private_key_file to this path.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -z "${KNOWN_HOSTS_B64:-}" ]; then
            echo "::error::R1_SSH_KNOWN_HOSTS is unset — pin the r1 host key before retrying (capture once out-of-band, e.g. ssh root@136.243.90.96 ssh-keyscan -t ed25519 136.243.90.96 | base64 -w0, then set it as a repo secret). The live ssh-keyscan fallback was removed (F-001) — it was a MITM hole." >&2
            exit 1
          fi
          echo "$KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Inventory
        # configs/ansible/inventory/r1.yml is gitignored — it carries the
        # production host IP, allowed_ssh_cidrs, disk serials and the
        # operator SSH pubkey, and this is a PUBLIC repo. Materialize it from an Actions secret using the exact
        # ANSIBLE_VAULT_FILE_B64 pattern below: routed through `env:`, never
        # interpolated into the shell, decoded with base64 -d.
        #
        # Fails fast and specifically when the secret is unset, mirroring the
        # SSH-key and vault guards — a missing inventory is a
        # missing-credential signal, NOT a drift signal, and the two must
        # never be confusable.
        env:
          INVENTORY_B64: ${{ secrets.R1_INVENTORY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${INVENTORY_B64:-}" ]; then
            echo "::error::R1_INVENTORY_B64 is unset — this is a missing-credential failure, NOT a drift signal. configs/ansible/inventory/r1.yml is no longer tracked (C6-041: public repo). Create the secret from the working-tree copy: base64 -w0 configs/ansible/inventory/r1.yml → repo Settings → Secrets and variables → Actions → R1_INVENTORY_B64. This cannot be fixed from inside the repository." >&2
            exit 1
          fi
          printf '%s' "$INVENTORY_B64" | base64 -d > configs/ansible/inventory/r1.yml
          chmod 600 configs/ansible/inventory/r1.yml
          # Fail loudly on a mis-encoded secret rather than letting ansible
          # report a confusing "Could not match supplied host pattern".
          if ! grep -q 'archival_nodes' configs/ansible/inventory/r1.yml; then
            echo "::error::R1_INVENTORY_B64 decoded to something that is not the r1 inventory (no 'archival_nodes' group). Re-encode with: base64 -w0 configs/ansible/inventory/r1.yml" >&2
            exit 1
          fi

      - name: Vault password
        # The vault password + the base64 vault both flow through
        # `env:`, never interpolated into the shell. Inlined, the password
        # is a shell-injection sink (a `$(...)`/backtick inside the secret
        # would execute in the runner). Written with printf,
        # not echo, so no trailing newline is appended to the password.
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          VAULT_FILE_B64: ${{ secrets.ANSIBLE_VAULT_FILE_B64 }}
        run: |
          set -euo pipefail
          # Fail HERE, loudly and specifically, when either secret is
          # unset — mirrors the SSH-key step's own `-z` guard above.
          # Writing empty files would let `ansible-playbook` fail two steps
          # later with a generic "Invalid vault password" —
          # indistinguishable, without reading the raw log, from an
          # actually-wrong password, and easy to misdiagnose as "the cron
          # never fires". This is the distinct, unambiguous paging state.
          if [ -z "${VAULT_PASS:-}" ] || [ -z "${VAULT_FILE_B64:-}" ]; then
            echo "::error::ANSIBLE_VAULT_PASSWORD and/or ANSIBLE_VAULT_FILE_B64 is unset — this is a missing-credential failure, NOT a drift signal. Set both secrets from the current r1 vault (repo Settings → Secrets → Actions) and re-run. This cannot be fixed from inside the repository." >&2
            exit 1
          fi
          mkdir -p ~/.ansible
          printf '%s' "$VAULT_PASS" > ~/.ansible/r1_vault_pass
          chmod 600 ~/.ansible/r1_vault_pass
          # The encrypted vault itself is NOT in the (public) repo.
          # Materialize it from the Actions secret.
          printf '%s' "$VAULT_FILE_B64" | base64 -d > configs/ansible/inventory/r1.secrets.yml

      - name: Run the playbook against r1 (dry-run unless apply=true)
        id: dryrun
        working-directory: configs/ansible
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          # pipefail so an ansible failure (invalid vault password, unreachable
          # host, task error) fails THIS step loudly. Without it, `... | tee`
          # returns tee's exit 0 under `bash -e`, masking the real error and
          # resurfacing it as a confusing empty-recap "drift detected" in the
          # next step (a stale ANSIBLE_VAULT_PASSWORD secret produces
          # exactly that misleading failure).
          set -o pipefail
          # APPLY MODE is opt-in per run. The scheduled Monday run and every
          # default dispatch stay --check, so this workflow keeps being a
          # detector; only an explicit apply=true mutates r1.
          #
          # This exists because the config-apply gate in deploy.yml is a
          # forcing function with nowhere to force TO: deploy-binary.yml
          # swaps binaries only, and the full render needed the vault, which
          # lives in these secrets and nowhere a person could reach it from
          # a laptop. So config lagged binaries and features shipped dead —
          # exactly what that gate exists to prevent. The same credentials that prove drift can
          # correct it.
          if [ "${APPLY:-false}" = "true" ]; then
            echo "::warning::APPLY MODE — this run MUTATES r1 and restarts the indexer, aggregator and api."
            ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
              --diff | tee /tmp/apply.out
            echo "::notice::apply finished — re-running the dry-run so this run still renders a verdict."
          fi
          # ALWAYS ends on a --check pass, and the verdict below always
          # reads it. An apply that leaves the host out of step (a task
          # that did not converge, a hand edit the role does not own)
          # now fails the run instead of concluding success without
          # having checked anything.
          ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
            --check --diff | tee /tmp/drift.out

      - name: Drift verdict (fails on drift, and NAMES the tasks)
        # Runs even when the playbook step FAILED. A task error under
        # `--check` aborts the play; if this step only ran on success, that
        # run would end as a bare red X with no verdict at all, and the
        # drift it was sitting on would never be reported. The verdict
        # script classifies an aborted preview
        # explicitly (it names the failing task and says the recap is a
        # PREFIX, not a result), which is only useful if it gets to run.
        #
        # `steps.dryrun.outcome != 'skipped'` keeps a missing-credential
        # failure in the guard steps above from also producing a confusing
        # "no dry-run output" second failure — those steps already fail
        # with their own explicit message.
        #
        # The verdict also renders a JOB SUMMARY naming every task that
        # would change and the host paths it would touch, because
        # "r1 has unapplied changes" buried in ~1,800
        # lines of ansible stdout is unactionable, while "these six tasks
        # would change, here are their files" is a 20-minute fix.
        #
        # The step above always ends
        # on a `--check` pass, so an apply run is judged on whether it
        # actually converged r1 rather than on having been attempted.
        # This is also what makes a green run of this workflow usable as
        # evidence by the dead-control sweep in ci-health.yml —
        # a skipped verdict step and a passing one are indistinguishable
        # in run history.
        #
        # No count threshold. A slack of N UNNAMED changed tasks lets a
        # hand fix on r1 that ansible would erase — precisely what this
        # guard is for — pass silently inside it, and every task that
        # legitimately clears hands its share of the slack to genuine
        # drift. scripts/ci/check-ansible-drift.sh matches
        # the changed tasks by NAME against
        # scripts/ci/ansible-drift.baseline, where each entry carries
        # the reason it reports changed on every run; anything else is
        # drift at count 1. That baseline is `*.baseline`, so widening
        # it needs a `Baseline-Growth:` commit trailer
        # (scripts/ci/lint-baseline-growth.sh) — an auditable act with
        # a task name attached, unlike a `13` → `14`.
        #
        # The baseline is validated against live runs (see the note at
        # the top of scripts/ci/ansible-drift.baseline). When
        # this step is red it is NAMING tasks: confirm each is genuinely
        # non-idempotent (and add it with a reason) or codify/apply it.
        # Do not restore a numeric allowance to clear the red.
        if: ${{ !cancelled() && steps.dryrun.outcome != 'skipped' }}
        run: bash scripts/ci/check-ansible-drift.sh /tmp/drift.out

      - name: Shred materialized secrets
        # Always remove the decoded vault + the plaintext vault
        # password from the runner — even if the dry-run failed above — so
        # neither the workspace copy of r1.secrets.yml nor the vault-pass
        # file lingers on the (shared-tenant) runner disk or gets swept into
        # any post-job artifact. `shred` overwrites first; `rm -f` is the
        # fallback if shred is unavailable / the file was never created.
        if: always()
        run: |
          shred -u ~/.ansible/r1_vault_pass 2>/dev/null || rm -f ~/.ansible/r1_vault_pass
          shred -u configs/ansible/inventory/r1.secrets.yml 2>/dev/null || rm -f configs/ansible/inventory/r1.secrets.yml
          # The materialized inventory is operationally sensitive too
          # (host IP, SSH surface, disk serials) — same treatment.
          shred -u configs/ansible/inventory/r1.yml 2>/dev/null || rm -f configs/ansible/inventory/r1.yml
