name: ansible-drift

# The codified≠live guarantee (2026-07-03 drift audit): a weekly
# --check --diff of the archival-node playbook against live r1. Any
# reported change means the two have diverged — a hand fix that needs
# codifying, or repo config that needs applying. Either way the
# workflow FAILS loudly instead of the gap surfacing as an incident
# months later (the 2026-06-11 rsyslog rules were "fixed" in ansible
# but never live; the reverse direction nearly had a playbook erase
# the CS-010 supply config).
#
# Secrets (all four must be current — set in repo settings):
#   - DEPLOY_SSH_PRIVATE_KEY  (same key deploy.yml uses)
#   - R1_SSH_KNOWN_HOSTS      (base64 of the pinned r1 host key — the same
#                              secret deploy.yml pins; REQUIRED, there is no
#                              live ssh-keyscan fallback anymore)
#   - ANSIBLE_VAULT_PASSWORD  (the r1.secrets.yml vault password)
#   - ANSIBLE_VAULT_FILE_B64  (base64 of the encrypted r1.secrets.yml)
#   - R1_INVENTORY_B64        (base64 of configs/ansible/inventory/r1.yml —
#                              see the OPERATOR ACTION block immediately below)
#
# ════════════════════════════════════════════════════════════════════════
# OPERATOR ACTION REQUIRED BEFORE MERGING — R1_INVENTORY_B64 (C6-041)
# ════════════════════════════════════════════════════════════════════════
# configs/ansible/inventory/r1.yml is no longer tracked (it carried the
# production host IP, the world-open `allowed_ssh_cidrs`, disk serials and
# the operator SSH pubkey in a PUBLIC repository). This workflow now
# materializes it from an Actions secret, exactly as it already does for
# the vault. THIS WORKFLOW IS RED UNTIL THAT SECRET EXISTS.
#
# Create it FIRST, from a machine holding the working-tree copy:
#
#     base64 -w0 configs/ansible/inventory/r1.yml   # macOS: base64 -i <file>
#     # → repo Settings → Secrets and variables → Actions → New secret
#     #   Name: R1_INVENTORY_B64
#
# HISTORY IS NOT REWRITTEN by the untracking. Every value that file ever
# held is still readable from any clone via `git log -p --
# configs/ansible/inventory/r1.yml`, and must be treated as public:
#   - the r1 IP and open SSH surface are already-known facts — mitigate by
#     narrowing `allowed_ssh_cidrs` (C6-018/C6-028/C6-060/C6-092), not by
#     hiding the file;
#   - anything credential-shaped that ever appeared there needs ROTATION,
#     not untracking (see docs/operations/credential-rotation.md).
# Untracking stops the LEAK GROWING (no future host/topology change is
# published); it does not undo the past.
# NOTE (2026-07-25, CID-24, audit-2026-07-23): ANSIBLE_VAULT_PASSWORD /
# ANSIBLE_VAULT_FILE_B64 are not merely stale — the 2026-07-20 scheduled
# run's own log shows both env vars EMPTY (`VAULT_PASS: `,
# `VAULT_FILE_B64: `), i.e. the secrets are currently UNSET on this repo,
# not mismatched. Every run since has failed at "Dry-run the playbook
# against r1" with `[ERROR]: Invalid vault password was provided from
# file`, before ever reaching PLAY RECAP — this is NOT a drift signal, it
# is a missing-credential signal, and no drift verdict has been produced
# since the rotation. This cannot be fixed from inside the repository: an
# operator must set both secrets from the current r1 vault (repo Settings
# → Secrets → Actions), then re-run this workflow. The "Vault password"
# step below now fails fast with an explicit message instead of silently
# writing empty files and letting ansible's generic error surface several
# steps later.
#
# SCHEDULING: the "this cron has never fired" claim that used to live here
# was wrong and has been removed — `gh run list --workflow=ansible-drift.yml`
# shows real schedule-triggered runs (e.g. 2026-07-20T09:35 UTC), all
# failing at the step above, not silently absent. Treating "broken guard"
# as "cron never fires" would have sent the next investigation down the
# wrong path (GitHub Actions scheduling config) instead of the real one
# (the two vault secrets above).

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install ansible
        # DEP-01 (audit-2026-07-23): EXACT pins. This job holds the root
        # SSH key for r1 AND the decrypted production vault; an
        # unpinned `pipx install ansible` handed whatever PyPI served at
        # 06:17 UTC that Monday full execution rights over both. A
        # yanked, hijacked or simply broken upstream release became a
        # production-credential incident with no diff to review.
        #
        # Pinned to the versions this job was already resolving to, so
        # the pin is behaviour-preserving; bumps are now a reviewable
        # one-line diff. Note deploy.yml pins ansible-core 2.18.4
        # separately (F-1299) — that is the DEPLOY path's pin and moves
        # on its own schedule; this is the drift-check controller.
        #
        # PyPI forbids re-uploading a version's files, so `==` closes
        # the yanked/hijacked-new-release vector. Full transitive hash
        # pinning (`pip install --require-hashes`) would need a
        # generated constraints file covering ansible's entire closure;
        # tracked as follow-up, not hand-maintainable here.
        run: |
          set -euo pipefail
          pipx install --include-deps 'ansible==14.2.0'
          pipx inject ansible 'passlib==1.7.4'

      - name: SSH key + known_hosts
        # Mirrors deploy.yml's "Set up SSH" step (F-1297/F-1298):
        #  - route the deploy key through `env:`, never interpolate a
        #    `${{ secrets.* }}` into the shell, and write it with printf.
        #  - PIN the host key from R1_SSH_KNOWN_HOSTS and fail fast if it
        #    is unset. The previous live `ssh-keyscan` trusted whatever
        #    key was served on the wire — a silent MITM hole in a job that
        #    carries the deploy key + vault password (host_key_checking is
        #    True in ansible.cfg, so this known_hosts is load-bearing).
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS_B64: ${{ secrets.R1_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # inventory/r1.yml pins ansible_ssh_private_key_file to this path.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -z "${KNOWN_HOSTS_B64:-}" ]; then
            echo "::error::R1_SSH_KNOWN_HOSTS is unset — pin the r1 host key before retrying (capture once out-of-band, e.g. ssh root@136.243.90.96 ssh-keyscan -t ed25519 136.243.90.96 | base64 -w0, then set it as a repo secret). The live ssh-keyscan fallback was removed (F-001) — it was a MITM hole." >&2
            exit 1
          fi
          echo "$KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Inventory
        # C6-041 (audit-2026-07-23): configs/ansible/inventory/r1.yml is
        # gitignored — it carried the production host IP, world-open
        # allowed_ssh_cidrs, disk serials and the operator SSH pubkey in a
        # PUBLIC repo. Materialize it from an Actions secret using the exact
        # ANSIBLE_VAULT_FILE_B64 pattern below: routed through `env:`, never
        # interpolated into the shell (F-1298), decoded with base64 -d.
        #
        # Fails fast and specifically when the secret is unset, mirroring the
        # SSH-key and vault guards — a missing inventory is a
        # missing-credential signal, NOT a drift signal, and the two must
        # never be confusable (that confusion is what let this guard run
        # broken for a week under CID-24).
        env:
          INVENTORY_B64: ${{ secrets.R1_INVENTORY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${INVENTORY_B64:-}" ]; then
            echo "::error::R1_INVENTORY_B64 is unset — this is a missing-credential failure, NOT a drift signal. configs/ansible/inventory/r1.yml is no longer tracked (C6-041: public repo). Create the secret from the working-tree copy: base64 -w0 configs/ansible/inventory/r1.yml → repo Settings → Secrets and variables → Actions → R1_INVENTORY_B64. This cannot be fixed from inside the repository." >&2
            exit 1
          fi
          printf '%s' "$INVENTORY_B64" | base64 -d > configs/ansible/inventory/r1.yml
          chmod 600 configs/ansible/inventory/r1.yml
          # Fail loudly on a mis-encoded secret rather than letting ansible
          # report a confusing "Could not match supplied host pattern".
          if ! grep -q 'archival_nodes' configs/ansible/inventory/r1.yml; then
            echo "::error::R1_INVENTORY_B64 decoded to something that is not the r1 inventory (no 'archival_nodes' group). Re-encode with: base64 -w0 configs/ansible/inventory/r1.yml" >&2
            exit 1
          fi

      - name: Vault password
        # F-1298: the vault password + the base64 vault both flow through
        # `env:`, never interpolated into the shell. The password was a
        # shell-injection sink when inlined (a `$(...)`/backtick inside the
        # secret would have executed in the runner). Written with printf,
        # not echo, so no trailing newline is appended to the password.
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          VAULT_FILE_B64: ${{ secrets.ANSIBLE_VAULT_FILE_B64 }}
        run: |
          set -euo pipefail
          # CID-24 (audit-2026-07-23): fail HERE, loudly and specifically,
          # when either secret is unset — mirrors the SSH-key step's own
          # `-z` guard above. Pre-fix this step wrote empty files
          # unconditionally and let `ansible-playbook` fail two steps
          # later with a generic "Invalid vault password" — indistinguish-
          # able, without reading the raw log, from an actually-wrong
          # password. That confusion is exactly what let this guard run
          # broken for a week: "no valid drift verdict" got misdiagnosed
          # as "the cron never fires" instead of "these two secrets are
          # unset". This is the distinct, unambiguous paging state.
          if [ -z "${VAULT_PASS:-}" ] || [ -z "${VAULT_FILE_B64:-}" ]; then
            echo "::error::ANSIBLE_VAULT_PASSWORD and/or ANSIBLE_VAULT_FILE_B64 is unset — this is a missing-credential failure, NOT a drift signal. Set both secrets from the current r1 vault (repo Settings → Secrets → Actions) and re-run. This cannot be fixed from inside the repository." >&2
            exit 1
          fi
          mkdir -p ~/.ansible
          printf '%s' "$VAULT_PASS" > ~/.ansible/r1_vault_pass
          chmod 600 ~/.ansible/r1_vault_pass
          # The encrypted vault itself is NOT in the (public) repo —
          # 2026-07-03 exposure response. Materialize it from the
          # Actions secret.
          printf '%s' "$VAULT_FILE_B64" | base64 -d > configs/ansible/inventory/r1.secrets.yml

      - name: Dry-run the playbook against r1
        working-directory: configs/ansible
        run: |
          # pipefail so an ansible failure (invalid vault password, unreachable
          # host, task error) fails THIS step loudly. Without it, `... | tee`
          # returns tee's exit 0 under `bash -e`, masking the real error and
          # resurfacing it as a confusing empty-recap "drift detected" in the
          # next step (observed 2026-07-17: a stale ANSIBLE_VAULT_PASSWORD
          # secret produced exactly that misleading failure).
          set -o pipefail
          ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
            --check --diff | tee /tmp/drift.out

      - name: Fail on drift
        # OBS-drift (audit-2026-07-23): the verdict used to be
        # `[ "${CHANGED:-999}" -gt 13 ]` — thirteen UNNAMED changed
        # tasks passed as "codified = live", justified by a one-line
        # comment ("known non-idempotent command tasks (chown recurse,
        # bucket-ensure)") that enumerated nothing. A hand fix on r1
        # that ansible would erase — precisely what this guard was
        # built for after the 2026-06-11 rsyslog incident — passed
        # silently anywhere inside that slack, and every enumerated
        # task that legitimately CLEARED just handed its share of the
        # slack to genuine drift.
        #
        # The number is gone. scripts/ci/check-ansible-drift.sh matches
        # the changed tasks by NAME against
        # scripts/ci/ansible-drift.baseline, where each entry carries
        # the reason it reports changed on every run; anything else is
        # drift at count 1. That baseline is `*.baseline`, so widening
        # it needs a `Baseline-Growth:` commit trailer
        # (scripts/ci/lint-baseline-growth.sh) — an auditable act with
        # a task name attached, unlike a `13` → `14`.
        #
        # FIRST RUN AFTER THE VAULT SECRETS ARE RESTORED: expect this to
        # be red. No verdict has been produced since the rotation
        # (CID-24), so the baseline was seeded from the runbook's
        # 2026-07-06 reconcile rather than from an observed run. The
        # failure will NAME the tasks — confirm each is genuinely
        # non-idempotent (and add it with a reason) or codify/apply it.
        # Do not restore a numeric allowance to clear the red.
        run: bash scripts/ci/check-ansible-drift.sh /tmp/drift.out

      - name: Shred materialized secrets
        # F-003: always remove the decoded vault + the plaintext vault
        # password from the runner — even if the dry-run failed above — so
        # neither the workspace copy of r1.secrets.yml nor the vault-pass
        # file lingers on the (shared-tenant) runner disk or gets swept into
        # any post-job artifact. `shred` overwrites first; `rm -f` is the
        # fallback if shred is unavailable / the file was never created.
        if: always()
        run: |
          shred -u ~/.ansible/r1_vault_pass 2>/dev/null || rm -f ~/.ansible/r1_vault_pass
          shred -u configs/ansible/inventory/r1.secrets.yml 2>/dev/null || rm -f configs/ansible/inventory/r1.secrets.yml
          # C6-041: the materialized inventory is operationally sensitive too
          # (host IP, SSH surface, disk serials) — same treatment.
          shred -u configs/ansible/inventory/r1.yml 2>/dev/null || rm -f configs/ansible/inventory/r1.yml
