name: k6-weekly

# Canonical mixed-realistic load run: the load-at-volume evidence for the
# Freighter SLA p95 <= 200 ms claim. Its report feeds the proof-of-SLA
# procedure (docs/operations/sla-proof-procedure.md).
#
# There is no schedule. The weekly proof is rendered from the SLA probe's
# own series by .github/workflows/sla-proof-weekly.yml, which needs no load
# target. A scheduled control that cannot run is not a control: it is a red
# badge that teaches people to ignore red badges. The probe measures served
# latency at concurrency 1 from inside the box; the scenarios here measure
# client-observed latency under synthetic concurrency across the edge. When
# a production-shaped target exists, this workflow closes that gap.
#
# Two jobs, INDEPENDENT (no `needs:`) so neither can silence the other:
#
#   1. Scenario compile-check: no secret, no target, runs on every
#      `pull_request` touching test/load/**. `k6 archive` does not pass
#      system env vars into __ENV (unlike `k6 run`), so the Makefile target
#      seeds placeholder __ENV values explicitly. The pinned k6 0.50.0
#      transpiles with babel, which parses array spread but not object
#      spread: scenarios merge with Object.assign, never `{ ...x }`. The pin
#      stays because 0.50.0 captured the historical AC2 evidence
#      (p95 54.4 ms), so the measuring instrument stays comparable.
#   2. Load run (`workflow_dispatch`):
#      - exports summary.json with p(99) requested explicitly (k6's default
#        trend stats stop at p(95), which would leave the p99 <= 500 ms half
#        of ADR-0009 reading "n/a" while looking complete), and renders the
#        headline numbers into $GITHUB_STEP_SUMMARY;
#      - uploads only $REPORT_DIR, and only when the scenario ran.
#        test/load/reports/ is never empty (it keeps dated historical
#        exports), so an unscoped upload publishes stale evidence for a run
#        that measured nothing;
#      - renders the export into docs/operations/sla-proof-<YYYY-MM-DD>.md
#        with scripts/ci/render-sla-proof.sh, which REFUSES (rc 2, writing
#        nothing) when a headline metric or provenance field is absent, and
#        commits it through the contents API with the job token (every
#        checkout stays `persist-credentials: false`). Failing to retain a
#        measurement the run took reddens the run;
#      - does not abort on a non-zero k6 exit. k6 exits 99 on a BREACHED
#        threshold, the most important report to retain; the exit code is
#        an output and the final step reddens the run on it;
#      - recomputes the scripts/ci/check-sla-evidence.sh verdict AFTER the
#        report lands, so a first healthy run does not report the absence of
#        the file it just wrote. A non-zero verdict opens/updates a tracking
#        issue (the reconciliation-health.yml pattern) and fails the run.
#
# --out experimental-prometheus-rw is conditional: k6 defaults
# K6_PROMETHEUS_RW_SERVER_URL to the runner's own localhost, so passing it
# with the secret unset silently discards the run.
#
# Never point the run at r1. r1 is the single production host,
# test/load/scenarios/lib/env.js refuses production targets by design, and
# mixed-realistic is a 300 rps / 10 min soak.
#
# Secrets (repo settings → Secrets). K6_TARGET_STAGING is deliberately
# UNSET until a production-shaped target exists. Before minting it: it is
# recorded VERBATIM in the proof report this workflow commits to a public
# repo (a proof that will not say what it measured proves nothing), so pick
# a host that is fine to publish. The credential is never recorded; it
# travels only in STELLARINDEX_LOAD_API_KEY, and the renderer refuses a
# target URL carrying userinfo.
#   - K6_TARGET_STAGING         — e.g. https://api.staging.stellarindex.io/v1
#   - STELLARINDEX_LOAD_API_KEY — load-test API key (vault-minted)
#   - K6_PROMETHEUS_RW_SERVER_URL — remote-write sink for the run's metrics
#   - ALERTMANAGER_URL_STAGING  — used by the spike scenario only
#
# Manual dispatch runs any single scenario via the `scenario` input.

on:
  # NO `schedule:`. The Sunday 02:00 UTC slot moved to
  # .github/workflows/sla-proof-weekly.yml, which renders the weekly proof
  # from the SLA probe and needs no load target. Re-adding a cron here
  # without first minting K6_TARGET_STAGING makes a red-forever
  # scheduled control — and would put two
  # workflows in the same week both trying to publish
  # docs/operations/sla-proof-<same-date>.md.
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario file under test/load/scenarios/ (default: 06-mixed-realistic.js)'
        required: false
        default: '06-mixed-realistic.js'
  # Scenario syntax is gated on any PR that can break it. This path needs
  # no secrets and no target, so it is the one leg of this workflow that
  # can run continuously.
  pull_request:
    paths:
      - 'test/load/**'
      - 'Makefile'
      - '.github/workflows/k6-weekly.yml'
      - 'scripts/ci/check-sla-evidence.sh'

permissions:
  contents: read

jobs:
  scenario-compile:
    name: k6 scenario compile-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1  # v1.2.2
        with:
          k6-version: '0.50.0'

      - name: Compile-check all scenarios
        # No `if:`. The compile gate must
        # not be conditional on secrets that do not exist.
        run: make test-load-check

  sla-run:
    name: weekly SLA evidence run
    # Deliberately NO `needs: scenario-compile`. The two jobs answer
    # different questions and must not gate each other: `needs:` would let
    # a scenario syntax error SKIP the evidence verdict, the sla-evidence
    # tracking issue and the ::error:: — the mechanism that makes a run
    # with no evidence visible — and the operator would be pointed at a
    # babel parse error instead of at the missing target. Either job going
    # red is a real, separately-actionable signal.
    #
    # A PR gets the compile gate only: there is nothing to load-test from a
    # pull request, and the secrets aren't available to one anyway.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `contents: write` is what makes the evidence DURABLE. The run
      # publishes docs/operations/sla-proof-<YYYY-MM-DD>.md through the
      # contents API using the job token — that committed file is the only
      # thing scripts/ci/check-sla-evidence.sh counts as evidence, and a
      # step summary or a 90-day artifact both age out. Scoped to this job
      # (the compile job stays read-only) and used by exactly one step.
      contents: write
      issues: write
    env:
      K6_TARGET: ${{ secrets.K6_TARGET_STAGING }}
      STELLARINDEX_LOAD_API_KEY: ${{ secrets.STELLARINDEX_LOAD_API_KEY }}
      K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.K6_PROMETHEUS_RW_SERVER_URL }}
      SCENARIO: ${{ inputs.scenario || '06-mixed-realistic.js' }}
      # Ask the decision core about THIS producer and no other. The core
      # now knows two sources, and its default (`any`) is satisfied by
      # either — which is the right answer to "is the feed alive" and the
      # wrong answer here: a configured probe source would report rc 0 and
      # this job would start k6 with nowhere to point.
      SLA_EVIDENCE_SOURCE: k6
      ISSUE_LABEL: sla-evidence
      ISSUE_TITLE: "SLA evidence: the weekly k6 proof run is producing no evidence"
      # Run-scoped, gitignored output dir. Deliberately NOT the bare
      # test/load/reports/ — that directory permanently holds checked-in
      # historical evidence (README.md + 2026-06-13/00-acceptance.json, kept
      # by .gitignore's `!/test/load/reports/2026-*/`); uploading it
      # wholesale would publish an old all-green k6 summary under this
      # run's name. See the "Upload" step below.
      REPORT_DIR: test/load/reports/run-${{ github.run_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Assess the SLA evidence feed
        id: gate
        # Deterministic, offline verdict (unit-tested by
        # scripts/ci/check-sla-evidence-test.sh). rc 0 = healthy,
        # 1 = no target (skip the run), 2 = no recent proof report (run
        # anyway — a stale report must not block the run that refreshes it).
        # This step never fails: the issue + fail steps below need to run.
        run: |
          set -euo pipefail
          set +e
          report="$(./scripts/ci/check-sla-evidence.sh 2>&1)"
          rc=$?
          set -e
          echo "$report"
          # `if`, not `&&`: under `set -e` a false `[ ]` test at the head of
          # an && list aborts the step.
          target_ready=true
          if [ "$rc" -eq 1 ]; then target_ready=false; fi
          {
            echo "verdict_rc=${rc}"
            echo "target_ready=${target_ready}"
            echo "report<<REPORT_EOF"
            echo "$report"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install k6
        if: steps.gate.outputs.target_ready == 'true'
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1  # v1.2.2
        with:
          k6-version: '0.50.0'

      - name: Run scenario
        id: k6
        if: steps.gate.outputs.target_ready == 'true'
        # This step deliberately does NOT fail on a non-zero k6 exit. k6
        # exits 99 when a declared threshold is BREACHED — which is a real
        # measurement and therefore real evidence, and a breached-threshold
        # proof report is exactly the document an operator needs. Failing
        # here would skip the render, so the only run that ever mattered
        # most would be the one that left nothing behind. The exit code is
        # published as an output and the "Fail the run" step below reddens
        # the run on it.
        run: |
          set -uo pipefail
          mkdir -p "$REPORT_DIR"

          # The remote-write sink is OPTIONAL and must be proven present.
          # k6 defaults K6_PROMETHEUS_RW_SERVER_URL to
          # http://localhost:9090/api/v1/write, so an unconditional
          # `--out experimental-prometheus-rw` against an unset secret
          # streams the whole run into the runner's own localhost and
          # discards it — a silent black hole that looks identical to a
          # working sink. Evidence therefore does NOT depend on it: the
          # summary export below is the primary artefact.
          out_args=()
          if [ -n "${K6_PROMETHEUS_RW_SERVER_URL:-}" ]; then
            out_args=(--out experimental-prometheus-rw)
          else
            echo "::warning::K6_PROMETHEUS_RW_SERVER_URL is unset — this run has no" \
                 "remote-write sink; the summary export is its only durable evidence."
          fi

          # The run window is provenance, not decoration: it is what lets a
          # reader line these client-side numbers up against the
          # server-side histogram for the same minutes. Stamped here, in
          # the step that actually runs k6, so it can never describe a
          # different run.
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # --summary-trend-stats: k6's default trend stats are
          # avg,min,med,max,p(90),p(95) — p(99) is NOT among them, so a
          # naive export would land evidence missing one of the two
          # headline ADR-0009 numbers (p95 <= 200 ms AND p99 <= 500 ms)
          # while still looking complete. render-sla-proof.sh REFUSES such
          # an export, so dropping this flag fails the run rather than
          # publishing half a proof.
          # `set +e` around the run, not `set -uo pipefail` alone. GitHub
          # runs a `run:` block as `bash -e {0}`, and `set -uo pipefail`
          # adds -u and pipefail without ever clearing that -e — so a k6
          # exit 99 aborted the step here, which is precisely what the
          # comment above says must not happen. The breaching run is the
          # one whose report matters most, and it was the one that could
          # never reach the renderer.
          set +e
          k6 run \
            "${out_args[@]}" \
            --summary-export "$REPORT_DIR/summary.json" \
            --summary-trend-stats 'avg,min,med,max,p(90),p(95),p(99)' \
            --tag run_id=${{ github.run_id }} \
            --tag run_attempt=${{ github.run_attempt }} \
            "test/load/scenarios/$SCENARIO"
          k6_rc=$?
          set -e

          ended_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Captured then sliced, never `k6 version | head -1`: an
          # early-exiting pipe consumer under pipefail is a SIGPIPE failure
          # (scripts/ci/lint-shell-sigpipe.sh).
          k6_version="$(k6 version)"
          k6_version="${k6_version%%$'\n'*}"

          {
            echo "k6_rc=${k6_rc}"
            echo "started_at=${started_at}"
            echo "ended_at=${ended_at}"
            echo "k6_version=${k6_version}"
          } >> "$GITHUB_OUTPUT"
          echo "k6 exited ${k6_rc} (99 = a declared threshold was breached)."

      - name: Render the durable SLA proof report
        id: proof
        # The only durable output of the run. Everything before it
        # is ephemeral: a job log rotates, a run summary rotates, an
        # artifact expires at 90 days. `scripts/ci/render-sla-proof.sh`
        # turns the export into docs/operations/sla-proof-<YYYY-MM-DD>.md,
        # which the next step commits — and a committed file is the only
        # thing scripts/ci/check-sla-evidence.sh counts as evidence.
        #
        # The renderer is deterministic and offline, and is unit-tested by
        # scripts/ci/render-sla-proof-test.sh on every PR. It REFUSES
        # (rc 2, writing nothing) when the export lacks a headline metric or
        # the run cannot name its own provenance, so this workflow cannot
        # publish an unlabelled number as a proof.
        #
        # Note for whoever mints the secret: SLA_PROOF_TARGET is recorded
        # VERBATIM in a report committed to a public repo. That is
        # deliberate — a proof that will not say what it measured proves
        # nothing — so K6_TARGET_STAGING must be a hostname that is fine to
        # publish. The credential never appears; it travels only in
        # STELLARINDEX_LOAD_API_KEY.
        if: always() && steps.gate.outputs.target_ready == 'true'
        env:
          SLA_PROOF_TARGET: ${{ env.K6_TARGET }}
          SLA_PROOF_SCENARIO: test/load/scenarios/${{ env.SCENARIO }}
          SLA_PROOF_K6_VERSION: ${{ steps.k6.outputs.k6_version }}
          SLA_PROOF_COMMIT: ${{ github.sha }}
          SLA_PROOF_STARTED_AT: ${{ steps.k6.outputs.started_at }}
          SLA_PROOF_ENDED_AT: ${{ steps.k6.outputs.ended_at }}
          SLA_PROOF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          K6_RC: ${{ steps.k6.outputs.k6_rc }}
        run: |
          set -euo pipefail

          if [ -n "${K6_PROMETHEUS_RW_SERVER_URL:-}" ]; then
            export SLA_PROOF_PROM_SINK="prometheus remote-write (configured)"
          else
            export SLA_PROOF_PROM_SINK="none — the summary export is the only durable output"
          fi
          export SLA_PROOF_NOTE="k6 exited ${K6_RC:-?} (99 = a declared threshold was breached; 0 = clean)."

          set +e
          out="$(./scripts/ci/render-sla-proof.sh --summary "$REPORT_DIR/summary.json" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"

          proof_path=""
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; then
            # The renderer prints the written path as its last line.
            proof_path="${out##*$'\n'}"
            # Keep a copy inside the uploaded artifact so the run's own
            # bundle is self-contained even before the commit lands.
            cp "$proof_path" "$REPORT_DIR/"
            # From the H1 onward: the YAML front matter renders as a stray
            # horizontal rule in a step summary. The committed file keeps it.
            sed -n '/^# /,$p' "$proof_path" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Weekly SLA evidence — \`$SCENARIO\`"
              echo
              echo "**No proof report was produced.** The renderer refused the"
              echo "export, so this run measured nothing that can be labelled:"
              echo
              echo '```'
              printf '%s\n' "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "proof_rc=${rc}"
            echo "proof_path=${proof_path}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the proof report
        id: publish
        # What makes it DURABLE. Committed through the contents API with
        # the job token rather than a credentialed checkout, so no step in
        # this workflow ever holds push credentials on disk (every checkout
        # here stays `persist-credentials: false`). A commit made with
        # GITHUB_TOKEN does not re-trigger workflows, and ci.yml's
        # push-to-main trigger ignores docs/** anyway, so this costs no CI.
        #
        # A failure here is a real failure: the run measured something and
        # then failed to retain it. It is NOT swallowed.
        if: always() && steps.proof.outputs.proof_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROOF_PATH: ${{ steps.proof.outputs.proof_path }}
          PROOF_RC: ${{ steps.proof.outputs.proof_rc }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          verdict=PASS
          if [ "$PROOF_RC" = "1" ]; then verdict=FAIL; fi

          content="$(base64 -w0 "$PROOF_PATH")"
          message="$(printf 'docs(sla): weekly SLA proof %s (%s)\n\nRendered by scripts/ci/render-sla-proof.sh from the k6 summary export\nof run %s. Scenario %s, commit %s. Prunes all but the newest four\ndocs/operations/sla-proof-*.md files in this commit.\n' \
            "${PROOF_PATH##*/}" "$verdict" "${GITHUB_RUN_ID:-?}" "$SCENARIO" "${GITHUB_SHA:-?}")"

          # Git Data API, not the Contents API: publishing and pruning old
          # dated reports must land as ONE commit, and the Contents API can
          # only touch one path per call. base_tree pins the prune to the
          # branch head read at the top of this step.
          ref_sha="$(gh api "repos/${GH_REPO}/git/refs/heads/${BRANCH}" --jq '.object.sha')"
          base_tree="$(gh api "repos/${GH_REPO}/git/commits/${ref_sha}" --jq '.tree.sha')"
          blob_sha="$(gh api --method POST "repos/${GH_REPO}/git/blobs" \
            -f "content=${content}" -f "encoding=base64" --jq '.sha')"

          # Every dated report in docs/operations, plus the one being
          # published (it may not exist yet, or this may be a same-day
          # re-run). Keep the newest four by name — the YYYY-MM-DD in the
          # filename sorts lexically — and delete the rest via a tree entry
          # with sha=null.
          existing_names="$(gh api "repos/${GH_REPO}/contents/docs/operations?ref=${BRANCH}" \
            --jq '.[].name' | grep -E '^sla-proof-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' || true)"
          prune_names="$(printf '%s\n%s\n' "$existing_names" "${PROOF_PATH##*/}" \
            | grep -v '^$' | sort -u | sort -r | tail -n +5)"
          prune_json="$(printf '%s\n' "$prune_names" | jq -R -s \
            'split("\n") | map(select(length>0)) | map({path: ("docs/operations/" + .), mode: "100644", type: "blob", sha: null})')"

          new_tree_sha="$(jq -n --arg base "$base_tree" --arg path "$PROOF_PATH" \
              --arg blobsha "$blob_sha" --argjson prune "$prune_json" \
              '{base_tree: $base, tree: ([{path: $path, mode: "100644", type: "blob", sha: $blobsha}] + $prune)}' \
            | gh api --method POST "repos/${GH_REPO}/git/trees" --input - --jq '.sha')"
          new_commit_sha="$(jq -n --arg msg "$message" --arg tree "$new_tree_sha" --arg parent "$ref_sha" \
              '{message: $msg, tree: $tree, parents: [$parent]}' \
            | gh api --method POST "repos/${GH_REPO}/git/commits" --input - --jq '.sha')"
          gh api --method PATCH "repos/${GH_REPO}/git/refs/heads/${BRANCH}" \
            -f "sha=${new_commit_sha}" -F force=false > /dev/null

          echo "$new_commit_sha" > "$REPORT_DIR/published-commit.txt"
          pruned_count="$(printf '%s\n' "$prune_names" | grep -c . || true)"
          echo "Published ${PROOF_PATH} to ${BRANCH} as ${new_commit_sha}; pruned ${pruned_count} old sla-proof file(s)."

      - name: Re-assess the SLA evidence feed
        id: verdict
        # The verdict that drives the tracking issue and the run's exit
        # status is taken AFTER the report has been rendered, not before.
        # Taken before, a first successful run would still report rc 2 ("no
        # proof inside the window") and go red for the absence of the very
        # file it had just produced — the feed would need two weeks to
        # report itself healthy once. Never fails; the steps below need to
        # run.
        if: always() && steps.gate.outcome == 'success'
        run: |
          set -euo pipefail
          set +e
          report="$(./scripts/ci/check-sla-evidence.sh 2>&1)"
          rc=$?
          set -e
          echo "$report"
          {
            echo "verdict_rc=${rc}"
            echo "report<<REPORT_EOF"
            echo "$report"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the k6 summary export
        # Scoped to $REPORT_DIR, and only when the scenario actually ran.
        # An unscoped `if: always()` upload of test/load/reports/ would
        # publish the CHECKED-IN historical export (all green) under the
        # name of a run that measured nothing. An artifact asserting a pass
        # for such a run is worse than no artifact.
        # if-no-files-found: error — if the scenario ran and produced no
        # summary, that is a failure to make evidence, not a nothing.
        if: always() && steps.gate.outputs.target_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: k6-summary-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 90

      - name: Open or update the tracking issue (no SLA evidence)
        # `always() && verdict computed && ...`, not the implicit success():
        # a failing `Run scenario` step must not suppress the report. The
        # verdict step never fails by design, so gating on its outcome means
        # "the verdict was actually computed" (an aborted checkout leaves
        # verdict_rc empty, which would otherwise read as non-zero).
        if: always() && steps.verdict.outcome == 'success' && steps.verdict.outputs.verdict_rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.verdict.outputs.report }}
        run: |
          set -euo pipefail
          # Ensure the label exists (idempotent).
          gh label create "$ISSUE_LABEL" --color B60205 \
            --description "the weekly k6 SLA-evidence feed is not producing evidence" 2>/dev/null || true

          body="$(printf '%s\n\n---\n_Auto-managed by the k6-weekly workflow (run %s). Closes automatically once a scheduled run executes against a configured target AND a dated proof report is inside the freshness window (docs/operations/sla-proof-procedure.md)._\n' \
            "$REPORT" "${GITHUB_RUN_ID:-?}")"

          existing="$(gh issue list --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Updated existing sla-evidence issue #$existing."
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
            echo "Opened new sla-evidence issue."
          fi

      - name: Close the tracking issue (evidence feed healthy)
        # Keyed on the POST-run verdict, and additionally on this run having
        # actually produced a proof report. Without the second clause a run
        # that failed to measure anything would still close the issue on the
        # strength of a report some earlier run landed inside the 45-day
        # window — the feed would be reported healthy by a run that was not.
        #
        # A run whose thresholds BREACHED still closes this issue, and that
        # is correct: this issue tracks whether the feed produces evidence,
        # not whether the SLA held. A breached run produced a `Verdict:
        # FAIL` proof report — evidence, and the most useful kind. The
        # breach itself reddens the run through k6_rc below.
        if: steps.verdict.outputs.verdict_rc == '0' && steps.proof.outputs.proof_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --label "$ISSUE_LABEL" --state open \
              --json number --jq '.[].number' || true); do
            gh issue close "$n" --comment "The k6 SLA-evidence feed is producing evidence again — k6-weekly closing automatically."
            echo "Closed sla-evidence issue #$n."
          done

      - name: Fail the run when no SLA evidence was produced
        # Four independent ways this run can fail to leave evidence behind,
        # each of which reddens the run:
        #
        #   verdict_rc != 0  no target, or no dated proof inside the window
        #                    even after this run.
        #   k6_rc    != 0    the scenario breached a threshold, died, or was
        #                    skipped entirely (a skipped step leaves the
        #                    output empty, which is correctly != '0').
        #   proof_rc == 2    the renderer REFUSED the export — no headline
        #                    metric, or no provenance. Evidence that cannot
        #                    be labelled is not evidence.
        #   publish failed   the run measured something and then failed to
        #                    retain it; the step's own failure already
        #                    reddens the job, and it is named here so the
        #                    ::error:: says which limb broke.
        #
        # Without this step a run with every real step skipped exits 0, and a
        # badge asserting "the SLA alarm ran" stays green while nothing
        # measures anything.
        if: >-
          always() && steps.verdict.outcome == 'success' &&
          (steps.verdict.outputs.verdict_rc != '0' ||
           steps.k6.outputs.k6_rc != '0' ||
           steps.proof.outputs.proof_rc == '2' ||
           steps.publish.outcome == 'failure')
        env:
          VERDICT_RC: ${{ steps.verdict.outputs.verdict_rc }}
          K6_RC: ${{ steps.k6.outputs.k6_rc }}
          PROOF_RC: ${{ steps.proof.outputs.proof_rc }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          echo "::error::This run did not leave durable SLA evidence behind" \
               "(check-sla-evidence rc=${VERDICT_RC:-?}, k6 rc=${K6_RC:-skipped}," \
               "render rc=${PROOF_RC:-skipped}, publish=${PUBLISH_OUTCOME:-skipped})" \
               "— see the sla-evidence tracking issue."
          exit 1
