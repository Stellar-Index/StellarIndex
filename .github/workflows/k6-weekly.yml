name: k6-weekly

# Weekly canonical mixed-realistic run — the regression alarm for the
# Freighter SLA p95 ≤ 200 ms claim (Task #74 Wave 4; the artefact it
# generates is the input to Task #77's monthly proof-of-SLA report,
# docs/operations/sla-proof-procedure.md).
#
# Schedule: Sundays 02:00 UTC. Off-peak for the target's traffic so a
# legitimate latency regression isn't masked by routine load.
#
# 2026-08-29 (#316) — this workflow was a permanently-green no-op. With
# the target secrets unset the scheduled path printed `::notice::` and
# exited 0, so every scheduled run since the cron was restored concluded
# `success` with `Install k6`, `Compile-check all scenarios` and `Run
# scenario` all `skipped` (runs 30733884244, 31292354359, 31922897932,
# 32614013429) — and no docs/operations/sla-proof-<YYYY-MM-DD>.md has
# ever landed. Three structural changes:
#
#   1. The scenario compile-check is its own job with NO secret and NO
#      target dependency, and it also runs on `pull_request`. It used to
#      sit behind the secrets gate, so `make test-load-check` ran exactly
#      once ever — 2026-07-30 run 30542038490 — where it FAILED: `k6
#      archive` does not pass system env vars into __ENV (unlike `k6
#      run`), so scenarios/lib/env.js threw "K6_TARGET is required" even
#      with the secrets present. Fixed in the Makefile target, which now
#      seeds placeholder __ENV values explicitly.
#   2. The scenarios themselves had to be MADE to compile before the gate
#      could be made mandatory. 04-batch.js and 06-mixed-realistic.js used
#      object spread (`{ ...headers }`) from the day they were written
#      (dc145698, 2026-05-01); the pinned k6 0.50.0 transpiles with babel,
#      which parses array spread but not object spread, so `k6 archive`
#      died with "Unexpected token" — and 06-mixed-realistic.js is the
#      DEFAULT scenario this schedule runs. Both are now Object.assign
#      merges, verified against a real k6 v0.50.0: all 9 scenarios archive
#      clean, and the mixed scenario executes end-to-end. The version pin
#      is deliberately unchanged: 0.50.0 is the binary that captured the
#      historical AC2 evidence (p95 54.4 ms), so the measuring instrument
#      stays comparable.
#   3. A scheduled run that cannot produce evidence no longer reports
#      success. scripts/ci/check-sla-evidence.sh is the decision core;
#      a non-zero verdict opens/updates a tracking issue (the
#      reconciliation-health.yml pattern) and fails the run. Silence and
#      success are no longer the same signal. The two jobs are INDEPENDENT
#      (no `needs:`) so that neither can silence the other.
#
# 2026-09-03 (#378) — #316 made a run that measures NOTHING go red. It did
# not make a run that DOES measure land anything, and it left a live
# false-evidence surface. Three further changes, none of which presume an
# answer to the staging-target question below:
#
#   1. The upload step was `if: always()` over the bare test/load/reports/,
#      which is never empty — .gitignore deliberately keeps dated dirs, so
#      it holds README.md + 2026-06-13/00-acceptance.json. Every weekly run
#      therefore published `k6-summary-<run_id>` containing an eleven-week-
#      old export reading "passes": 30600, "fails": 0, p(95) 54.4 ms, all
#      thresholds green — for a run whose `Run scenario` step was SKIPPED
#      (run 33299745709). Now scoped to $REPORT_DIR and gated on the
#      scenario actually having run.
#   2. There was no --summary-export and no handleSummary anywhere, so even
#      WITH a target the only output was console text in a log that ages
#      out. The run now exports summary.json and renders the headline
#      numbers into $GITHUB_STEP_SUMMARY (the public-dataset-check.yml
#      convention). That is the INPUT an operator promotes to
#      docs/operations/sla-proof-<YYYY-MM-DD>.md, which stays the durable
#      artefact check-sla-evidence.sh leg 2 measures.
#   3. --summary-trend-stats now requests p(99) explicitly. k6 exports
#      avg,min,med,max,p(90),p(95) by default, so the evidence would have
#      read "n/a" for the p99 <= 500 ms half of ADR-0009 while looking
#      complete — exactly what the real 2026-06-13 export does.
#
# 2026-09-09 (#378, second pass) — the run still had no way to leave
# anything DURABLE behind. `summary.json` and the step summary are both
# ephemeral (a log rotates, an artifact expires at 90 days), and the only
# thing scripts/ci/check-sla-evidence.sh has ever counted as evidence is a
# committed docs/operations/sla-proof-<YYYY-MM-DD>.md. The sole
# implementation of that promotion was a paragraph in
# sla-proof-procedure.md instructing an operator to mint Grafana snapshots
# from grafana.staging.stellarindex.io — a host that does not exist — and
# to run promql over `k6_*` series that only exist when the (unset)
# remote-write secret is set. So the durable half of the feed had no
# implementation at all, on any branch, which is why the freshness leg has
# been red since it was written. Four changes:
#
#   1. scripts/ci/render-sla-proof.sh renders the export into the dated
#      report, with a provenance block naming the target, the run window,
#      the method, the scenario, the commit and the k6 version, plus the
#      sha256 of the export it was rendered from. It REFUSES (rc 2, writing
#      nothing) when a headline metric or a provenance field is absent, so
#      an unlabelled number cannot be published as a proof.
#   2. The run commits that report through the contents API with the job
#      token — no credentialed checkout, every checkout here stays
#      `persist-credentials: false`. Failing to retain a measurement the
#      run actually took is itself a failure and reddens the run.
#   3. `Run scenario` no longer aborts the job on a non-zero k6 exit. k6
#      exits 99 on a BREACHED threshold, which is a real measurement and
#      the single most important report to retain; aborting there meant the
#      one run that mattered most left nothing behind. The exit code is an
#      output and the final step reddens the run on it.
#   4. The verdict that drives the tracking issue and the exit status is
#      recomputed AFTER the report lands. Taken before, a first healthy run
#      would report rc 2 for the absence of the file it had just written,
#      and the feed would need two weeks to call itself healthy once.
#
# Also: --out experimental-prometheus-rw is now conditional. k6 defaults
# K6_PROMETHEUS_RW_SERVER_URL to the runner's own localhost, so passing it
# with the secret unset silently discarded the run.
#
# Deliberately NOT done: pointing the run at r1. r1 is the single
# production host, test/load/scenarios/lib/env.js refuses production
# targets by design, and mixed-realistic is a 300 rps / 10 min soak.
# Restoring the feed means provisioning a production-shaped target, not
# load-testing production.
#
# History of the target secret, so nobody re-derives it: the org
# migration ate the original secrets (the workflow "had failed SILENTLY"
# — docs/operations/v1-launch-plan.md, 2026-07-30 ~14:40Z), the load key
# was re-minted, and K6_TARGET_STAGING was then deliberately deleted
# again "so the weekly cron keeps its designed skip-until-staging
# behavior" — i.e. the green no-op was a conscious park, not an
# accident. #316 is about the park being INVISIBLE: parked and healthy
# looked identical from the outside. The park is now visible (a
# tracking issue + a red run) instead of silent. Two ways out, both
# legitimate: provision a production-shaped target, or retire this
# workflow.
#
# Secrets (repo settings → Secrets) — K6_TARGET_STAGING is UNSET, which
# is exactly what the tracking issue reports. Note before minting it:
# K6_TARGET_STAGING is recorded VERBATIM in the proof report this workflow
# commits to a public repo. That is deliberate — a proof that will not say
# what it measured proves nothing — so pick a host that is fine to
# publish. The credential is never recorded; it travels only in
# STELLARINDEX_LOAD_API_KEY, and the renderer refuses a target URL
# carrying userinfo.
#   - K6_TARGET_STAGING         — e.g. https://api.staging.stellarindex.io/v1
#   - STELLARINDEX_LOAD_API_KEY — load-test API key (vault-minted)
#   - K6_PROMETHEUS_RW_SERVER_URL — remote-write sink for the run's metrics
#   - ALERTMANAGER_URL_STAGING  — used by the spike scenario only; the
#                                 weekly runs mixed-realistic, so it
#                                 matters on the manual-dispatch path
#
# Manual dispatch supports running any single scenario via the `scenario`
# input — useful for re-running a regression investigation without
# waiting for next Sunday.

on:
  # Weekly SLA-evidence run — restored 2026-07-06 (was disabled under the
  # Actions spending cap, Task #50). Kept cheap: one ≤30-min job a week.
  schedule:
    - cron: '0 2 * * 0'   # 02:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario file under test/load/scenarios/ (default: 06-mixed-realistic.js)'
        required: false
        default: '06-mixed-realistic.js'
  # Scenario syntax is gated on any PR that can break it. This path needs
  # no secrets and no target, so it is the one leg of this workflow that
  # can run continuously — previously a scenario syntax error could sit
  # undetected indefinitely.
  pull_request:
    paths:
      - 'test/load/**'
      - 'Makefile'
      - '.github/workflows/k6-weekly.yml'
      - 'scripts/ci/check-sla-evidence.sh'

permissions:
  contents: read

jobs:
  scenario-compile:
    name: k6 scenario compile-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065  # v1
        with:
          k6-version: '0.50.0'

      - name: Compile-check all scenarios
        # No `if:` — this is the whole point of #316. The compile gate must
        # not be conditional on secrets that do not exist.
        run: make test-load-check

  sla-run:
    name: weekly SLA evidence run
    # Deliberately NO `needs: scenario-compile`. The two jobs answer
    # different questions and must not gate each other: `needs:` would let
    # a scenario syntax error SKIP the evidence verdict, the sla-evidence
    # tracking issue and the ::error:: — i.e. exactly the mechanism #316
    # exists to guarantee would silently not run, and the operator would be
    # pointed at a babel parse error instead of at the missing target.
    # Both jobs run in parallel on the schedule; either one going red is a
    # real, separately-actionable signal.
    #
    # A PR gets the compile gate only: there is nothing to load-test from a
    # pull request, and the secrets aren't available to one anyway.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `contents: write` is what makes the evidence DURABLE. The run
      # publishes docs/operations/sla-proof-<YYYY-MM-DD>.md through the
      # contents API using the job token — that committed file is the only
      # thing scripts/ci/check-sla-evidence.sh counts as evidence, and a
      # step summary or a 90-day artifact both age out. Scoped to this job
      # (the compile job stays read-only) and used by exactly one step.
      contents: write
      issues: write
    env:
      K6_TARGET: ${{ secrets.K6_TARGET_STAGING }}
      STELLARINDEX_LOAD_API_KEY: ${{ secrets.STELLARINDEX_LOAD_API_KEY }}
      K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.K6_PROMETHEUS_RW_SERVER_URL }}
      SCENARIO: ${{ inputs.scenario || '06-mixed-realistic.js' }}
      ISSUE_LABEL: sla-evidence
      ISSUE_TITLE: "SLA evidence: the weekly k6 proof run is producing no evidence"
      # Run-scoped, gitignored output dir. Deliberately NOT the bare
      # test/load/reports/ — that directory permanently holds checked-in
      # historical evidence (README.md + 2026-06-13/00-acceptance.json, kept
      # by .gitignore's `!/test/load/reports/2026-*/`), and uploading it
      # wholesale published an eleven-week-old all-green k6 summary under
      # this run's name. See the "Upload" step below.
      REPORT_DIR: test/load/reports/run-${{ github.run_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Assess the SLA evidence feed
        id: gate
        # Deterministic, offline verdict (unit-tested by
        # scripts/ci/check-sla-evidence-test.sh). rc 0 = healthy,
        # 1 = no target (skip the run), 2 = no recent proof report (run
        # anyway — a stale report must not block the run that refreshes it).
        # This step never fails: the issue + fail steps below need to run.
        run: |
          set -euo pipefail
          set +e
          report="$(./scripts/ci/check-sla-evidence.sh 2>&1)"
          rc=$?
          set -e
          echo "$report"
          # `if`, not `&&`: under `set -e` a false `[ ]` test at the head of
          # an && list aborts the step.
          target_ready=true
          if [ "$rc" -eq 1 ]; then target_ready=false; fi
          {
            echo "verdict_rc=${rc}"
            echo "target_ready=${target_ready}"
            echo "report<<REPORT_EOF"
            echo "$report"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install k6
        if: steps.gate.outputs.target_ready == 'true'
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065  # v1
        with:
          k6-version: '0.50.0'

      - name: Run scenario
        id: k6
        if: steps.gate.outputs.target_ready == 'true'
        # This step deliberately does NOT fail on a non-zero k6 exit. k6
        # exits 99 when a declared threshold is BREACHED — which is a real
        # measurement and therefore real evidence, and a breached-threshold
        # proof report is exactly the document an operator needs. Failing
        # here would skip the render, so the only run that ever mattered
        # most would be the one that left nothing behind. The exit code is
        # published as an output and the "Fail the run" step below reddens
        # the run on it.
        run: |
          set -uo pipefail
          mkdir -p "$REPORT_DIR"

          # The remote-write sink is OPTIONAL and must be proven present.
          # k6 defaults K6_PROMETHEUS_RW_SERVER_URL to
          # http://localhost:9090/api/v1/write, so an unconditional
          # `--out experimental-prometheus-rw` against an unset secret
          # streams the whole run into the runner's own localhost and
          # discards it — a silent black hole that looks identical to a
          # working sink. Evidence therefore does NOT depend on it: the
          # summary export below is the primary artefact.
          out_args=()
          if [ -n "${K6_PROMETHEUS_RW_SERVER_URL:-}" ]; then
            out_args=(--out experimental-prometheus-rw)
          else
            echo "::warning::K6_PROMETHEUS_RW_SERVER_URL is unset — this run has no" \
                 "remote-write sink; the summary export is its only durable evidence."
          fi

          # The run window is provenance, not decoration: it is what lets a
          # reader line these client-side numbers up against the
          # server-side histogram for the same minutes. Stamped here, in
          # the step that actually runs k6, so it can never describe a
          # different run.
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # --summary-trend-stats: k6's default trend stats are
          # avg,min,med,max,p(90),p(95) — p(99) is NOT among them, so a
          # naive export would land evidence missing one of the two
          # headline ADR-0009 numbers (p95 <= 200 ms AND p99 <= 500 ms)
          # while still looking complete. render-sla-proof.sh REFUSES such
          # an export, so dropping this flag fails the run rather than
          # publishing half a proof.
          k6 run \
            "${out_args[@]}" \
            --summary-export "$REPORT_DIR/summary.json" \
            --summary-trend-stats 'avg,min,med,max,p(90),p(95),p(99)' \
            --tag run_id=${{ github.run_id }} \
            --tag run_attempt=${{ github.run_attempt }} \
            "test/load/scenarios/$SCENARIO"
          k6_rc=$?

          ended_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Captured then sliced, never `k6 version | head -1`: an
          # early-exiting pipe consumer under pipefail is the #475 bug class
          # (scripts/ci/lint-shell-sigpipe.sh).
          k6_version="$(k6 version)"
          k6_version="${k6_version%%$'\n'*}"

          {
            echo "k6_rc=${k6_rc}"
            echo "started_at=${started_at}"
            echo "ended_at=${ended_at}"
            echo "k6_version=${k6_version}"
          } >> "$GITHUB_OUTPUT"
          echo "k6 exited ${k6_rc} (99 = a declared threshold was breached)."

      - name: Render the durable SLA proof report
        id: proof
        # THE STEP THIS WORKFLOW WAS MISSING (#378). Everything before it
        # is ephemeral: a job log rotates, a run summary rotates, an
        # artifact expires at 90 days. `scripts/ci/render-sla-proof.sh`
        # turns the export into docs/operations/sla-proof-<YYYY-MM-DD>.md,
        # which the next step commits — and a committed file is the only
        # thing scripts/ci/check-sla-evidence.sh has ever counted as
        # evidence. Until now the only implementation of that promotion was
        # a paragraph in sla-proof-procedure.md telling an operator to visit
        # a Grafana host that does not exist, which is why no dated proof
        # report has ever landed on any branch.
        #
        # The renderer is deterministic and offline, and is unit-tested by
        # scripts/ci/render-sla-proof-test.sh on every PR. It REFUSES
        # (rc 2, writing nothing) when the export lacks a headline metric or
        # the run cannot name its own provenance, so this workflow cannot
        # publish an unlabelled number as a proof.
        #
        # Note for whoever mints the secret: SLA_PROOF_TARGET is recorded
        # VERBATIM in a report committed to a public repo. That is
        # deliberate — a proof that will not say what it measured proves
        # nothing — so K6_TARGET_STAGING must be a hostname that is fine to
        # publish. The credential never appears; it travels only in
        # STELLARINDEX_LOAD_API_KEY.
        if: always() && steps.gate.outputs.target_ready == 'true'
        env:
          SLA_PROOF_TARGET: ${{ env.K6_TARGET }}
          SLA_PROOF_SCENARIO: test/load/scenarios/${{ env.SCENARIO }}
          SLA_PROOF_K6_VERSION: ${{ steps.k6.outputs.k6_version }}
          SLA_PROOF_COMMIT: ${{ github.sha }}
          SLA_PROOF_STARTED_AT: ${{ steps.k6.outputs.started_at }}
          SLA_PROOF_ENDED_AT: ${{ steps.k6.outputs.ended_at }}
          SLA_PROOF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          K6_RC: ${{ steps.k6.outputs.k6_rc }}
        run: |
          set -euo pipefail

          if [ -n "${K6_PROMETHEUS_RW_SERVER_URL:-}" ]; then
            export SLA_PROOF_PROM_SINK="prometheus remote-write (configured)"
          else
            export SLA_PROOF_PROM_SINK="none — the summary export is the only durable output"
          fi
          export SLA_PROOF_NOTE="k6 exited ${K6_RC:-?} (99 = a declared threshold was breached; 0 = clean)."

          set +e
          out="$(./scripts/ci/render-sla-proof.sh --summary "$REPORT_DIR/summary.json" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"

          proof_path=""
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; then
            # The renderer prints the written path as its last line.
            proof_path="${out##*$'\n'}"
            # Keep a copy inside the uploaded artifact so the run's own
            # bundle is self-contained even before the commit lands.
            cp "$proof_path" "$REPORT_DIR/"
            # From the H1 onward: the YAML front matter renders as a stray
            # horizontal rule in a step summary. The committed file keeps it.
            sed -n '/^# /,$p' "$proof_path" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Weekly SLA evidence — \`$SCENARIO\`"
              echo
              echo "**No proof report was produced.** The renderer refused the"
              echo "export, so this run measured nothing that can be labelled:"
              echo
              echo '```'
              printf '%s\n' "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "proof_rc=${rc}"
            echo "proof_path=${proof_path}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the proof report
        id: publish
        # What makes it DURABLE. Committed through the contents API with
        # the job token rather than a credentialed checkout, so no step in
        # this workflow ever holds push credentials on disk (every checkout
        # here stays `persist-credentials: false`). A commit made with
        # GITHUB_TOKEN does not re-trigger workflows, and ci.yml's
        # push-to-main trigger ignores docs/** anyway, so this costs no CI.
        #
        # A failure here is a real failure: the run measured something and
        # then failed to retain it, which is the #378 defect in a different
        # spelling. It is NOT swallowed.
        if: always() && steps.proof.outputs.proof_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROOF_PATH: ${{ steps.proof.outputs.proof_path }}
          PROOF_RC: ${{ steps.proof.outputs.proof_rc }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          verdict=PASS
          if [ "$PROOF_RC" = "1" ]; then verdict=FAIL; fi

          content="$(base64 -w0 "$PROOF_PATH")"
          message="$(printf 'docs(sla): weekly SLA proof %s (%s)\n\nRendered by scripts/ci/render-sla-proof.sh from the k6 summary export\nof run %s. Scenario %s, commit %s.\n' \
            "${PROOF_PATH##*/}" "$verdict" "${GITHUB_RUN_ID:-?}" "$SCENARIO" "${GITHUB_SHA:-?}")"

          # An existing file at this path (a same-day re-run) needs its blob
          # sha to update rather than 422. Absent file => empty sha => create.
          existing="$(gh api "repos/${GH_REPO}/contents/${PROOF_PATH}?ref=${BRANCH}" \
            --jq '.sha' 2>/dev/null || true)"

          args=(--method PUT "repos/${GH_REPO}/contents/${PROOF_PATH}"
                -f "message=${message}" -f "content=${content}" -f "branch=${BRANCH}")
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            args+=(-f "sha=${existing}")
          fi
          gh api "${args[@]}" --jq '.commit.sha' > "$REPORT_DIR/published-commit.txt"
          echo "Published ${PROOF_PATH} to ${BRANCH} as $(cat "$REPORT_DIR/published-commit.txt")."

      - name: Re-assess the SLA evidence feed
        id: verdict
        # The verdict that drives the tracking issue and the run's exit
        # status is taken AFTER the report has been rendered, not before.
        # Taken before, a first successful run would still report rc 2 ("no
        # proof inside the window") and go red for the absence of the very
        # file it had just produced — the feed would need two weeks to
        # report itself healthy once. Never fails; the steps below need to
        # run.
        if: always() && steps.gate.outcome == 'success'
        run: |
          set -euo pipefail
          set +e
          report="$(./scripts/ci/check-sla-evidence.sh 2>&1)"
          rc=$?
          set -e
          echo "$report"
          {
            echo "verdict_rc=${rc}"
            echo "report<<REPORT_EOF"
            echo "$report"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the k6 summary export
        # Scoped to $REPORT_DIR, and only when the scenario actually ran.
        # The previous form (`if: always()`, `path: test/load/reports/`)
        # uploaded the CHECKED-IN historical fixture on every run: run
        # 33299745709 had `Run scenario: skipped` yet published
        # `k6-summary-33299745709` (1,691 B) containing the 2026-06-13
        # export — "passes": 30600, "fails": 0, p(95) 54.4 ms, all green.
        # An artifact named after a run that measured nothing, asserting a
        # pass, is worse than no artifact.
        # if-no-files-found: error — if the scenario ran and produced no
        # summary, that is a failure to make evidence, not a nothing.
        if: always() && steps.gate.outputs.target_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: k6-summary-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 90

      - name: Open or update the tracking issue (no SLA evidence)
        # `always() && verdict computed && ...`, not the implicit success():
        # a failing `Run scenario` step must not suppress the report. The
        # verdict step never fails by design, so gating on its outcome means
        # "the verdict was actually computed" (an aborted checkout leaves
        # verdict_rc empty, which would otherwise read as non-zero).
        if: always() && steps.verdict.outcome == 'success' && steps.verdict.outputs.verdict_rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.verdict.outputs.report }}
        run: |
          set -euo pipefail
          # Ensure the label exists (idempotent).
          gh label create "$ISSUE_LABEL" --color B60205 \
            --description "the weekly k6 SLA-evidence feed is not producing evidence" 2>/dev/null || true

          body="$(printf '%s\n\n---\n_Auto-managed by the k6-weekly workflow (run %s). Closes automatically once a scheduled run executes against a configured target AND a dated proof report is inside the freshness window (docs/operations/sla-proof-procedure.md)._\n' \
            "$REPORT" "${GITHUB_RUN_ID:-?}")"

          existing="$(gh issue list --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Updated existing sla-evidence issue #$existing."
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
            echo "Opened new sla-evidence issue."
          fi

      - name: Close the tracking issue (evidence feed healthy)
        # Keyed on the POST-run verdict, and additionally on this run having
        # actually produced a proof report. Without the second clause a run
        # that failed to measure anything would still close the issue on the
        # strength of a report some earlier run landed inside the 45-day
        # window — the feed would be reported healthy by a run that was not.
        #
        # A run whose thresholds BREACHED still closes this issue, and that
        # is correct: this issue tracks whether the feed produces evidence,
        # not whether the SLA held. A breached run produced a `Verdict:
        # FAIL` proof report — evidence, and the most useful kind. The
        # breach itself reddens the run through k6_rc below.
        if: steps.verdict.outputs.verdict_rc == '0' && steps.proof.outputs.proof_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --label "$ISSUE_LABEL" --state open \
              --json number --jq '.[].number' || true); do
            gh issue close "$n" --comment "The k6 SLA-evidence feed is producing evidence again — k6-weekly closing automatically."
            echo "Closed sla-evidence issue #$n."
          done

      - name: Fail the run when no SLA evidence was produced
        # Four independent ways this run can fail to leave evidence behind,
        # each of which used to be survivable:
        #
        #   verdict_rc != 0  no target, or no dated proof inside the window
        #                    even after this run (#316's defect).
        #   k6_rc    != 0    the scenario breached a threshold, died, or was
        #                    skipped entirely (a skipped step leaves the
        #                    output empty, which is correctly != '0').
        #   proof_rc == 2    the renderer REFUSED the export — no headline
        #                    metric, or no provenance. Evidence that cannot
        #                    be labelled is not evidence (#378).
        #   publish failed   the run measured something and then failed to
        #                    retain it; the step's own failure already
        #                    reddens the job, and it is named here so the
        #                    ::error:: says which limb broke.
        #
        # The defect this replaces (#316): the scheduled run exited 0 with
        # every real step skipped, so a badge asserting "the SLA alarm ran"
        # was green for months while nothing measured anything.
        if: >-
          always() && steps.verdict.outcome == 'success' &&
          (steps.verdict.outputs.verdict_rc != '0' ||
           steps.k6.outputs.k6_rc != '0' ||
           steps.proof.outputs.proof_rc == '2' ||
           steps.publish.outcome == 'failure')
        env:
          VERDICT_RC: ${{ steps.verdict.outputs.verdict_rc }}
          K6_RC: ${{ steps.k6.outputs.k6_rc }}
          PROOF_RC: ${{ steps.proof.outputs.proof_rc }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          echo "::error::This run did not leave durable SLA evidence behind" \
               "(check-sla-evidence rc=${VERDICT_RC:-?}, k6 rc=${K6_RC:-skipped}," \
               "render rc=${PROOF_RC:-skipped}, publish=${PUBLISH_OUTCOME:-skipped})" \
               "— see the sla-evidence tracking issue."
          exit 1
