name: ci

on:
  pull_request:
    # Skip docs-only PRs — a CHANGELOG bump or markdown edit
    # doesn't need to spin up 11 runners. Code-touching PRs
    # still hit the full matrix via the doc-code consistency job.
    paths-ignore:
      - 'CHANGELOG.md'
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # Push-to-main also fires CI. F-1231 (codex audit-2026-05-12):
  # direct pushes (live-in-development sessions, hot-fix commits,
  # the /loop workflow) must still run the canonical suite.
  #
  # 2026-07-02 (CS-097): main was reported protected by two repo
  # rulesets — "main-integrity" (force-push + deletion blocked, NO
  # bypass, not even admins) and "main-required-checks" (the core jobs
  # here are required status checks; repository admins bypass so the
  # operator's direct-push workflow keeps working).
  #
  # CID-01 (audit-2026-07-23, corrected 2026-07-25): that claim was
  # never verified from inside the repo, and a live check found it
  # false — `GET /repos/<repo>/rules/branches/main` currently returns
  # `[]` (no active rules), confirmed both authenticated and via a
  # plain unauthenticated `curl` (the repo is public). The
  # `branch-protection-status` job below turns this from a one-time
  # manual check into an ongoing, visible signal on every push, since
  # nothing in this repo can configure the ruleset itself. Regardless
  # of ruleset state, this push trigger is NOT redundant: it is what
  # keeps direct pushes honest even under an admin-bypass rule — a red
  # run on main is the tripwire. Do not remove it.
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# N2-01: scope the GITHUB_TOKEN to read-only at the workflow level.
# No job here writes to the repo (tests, lint, build, artifact upload all
# work with contents: read), and main is not branch-protection-enforced,
# so a compromised transitive dep running in a job must not be able to
# push. Jobs that need more must opt in explicitly.
permissions:
  contents: read

env:
  GOFUMPT_VERSION: v0.8.0
  GOIMPORTS_VERSION: v0.42.0
  GOLANGCI_LINT_VERSION: v2.11.4
  GOVULNCHECK_VERSION: v1.1.4
  GITLEAKS_VERSION: 8.21.2

  # F-1294 (codex audit-2026-05-13): SHA-256 of upstream tool
  # tarballs that the install steps verify before unpacking —
  # pre-fix the install steps were `curl | tar -xz` with no
  # checksum, so a compromised upstream tarball could have made
  # the `monitoring-rules` job accept broken PromQL or the `vuln`
  # job miss leaked secrets.
  #
  # audit-2026-07-16 (C4-17b): the EXPECTED checksums are committed
  # (PROM_TARBALL_SHA256_DEFAULT next to PROM_VERSION in the
  # monitoring-rules job; GITLEAKS_TARBALL_SHA256_DEFAULT below),
  # NOT stored only in a repo secret. A tarball checksum is public
  # (upstream sha256sums.txt) and belongs in the reviewable diff:
  # storing it as a secret gained nothing and left main CI hard-red
  # for 24h+ whenever the secret was unset — invisible to local
  # `make verify`. The `secrets.*` references remain as an OPTIONAL
  # override (a set secret wins); an unset secret now falls back to
  # the committed default instead of fail-fast.
  #
  # Bump procedure: bump the VERSION; copy the matching SHA from the
  # upstream release (Prometheus publishes sha256sums.txt; gitleaks
  # ships gitleaks_<v>_checksums.txt) into the *_DEFAULT beside it,
  # IN THE SAME COMMIT. CI fails loudly on a stale SHA — the message
  # names the tarball and shows expected-vs-actual.
  GITLEAKS_TARBALL_SHA256_DEFAULT: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
  PROM_TARBALL_SHA256: ${{ secrets.PROM_TARBALL_SHA256 }}
  GITLEAKS_TARBALL_SHA256: ${{ secrets.GITLEAKS_TARBALL_SHA256 }}

# Cancel old runs on the same ref when a new one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # Fast path — runs on every commit. < 2 min target.
  # Path filters below skip unneeded jobs when only docs changed.
  # ────────────────────────────────────────────────────────────────

  lint:
    name: lint
    runs-on: ubuntu-latest
    # CID-02 (audit-2026-07-23): `lint` is a required status check
    # (main-required-checks per CS-097); a job-level `if:` that a PR
    # author's own label can flip to `false` makes a "skipped" run
    # report as a passing required check — the PR author controls
    # whether their own gate runs. This job-level escape was already
    # dropped from `build` (N2-07, audit-2026-06-11) but missed here.
    # If a docs/WIP PR genuinely needs to skip Go lint, filter it at
    # the trigger (`paths-ignore` above already exempts docs-only
    # diffs) — not with a per-job label a required check can't defend
    # against.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@${GOFUMPT_VERSION}
          go install golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}
      - name: gofmt / gofumpt
        run: |
          if [ -n "$(gofumpt -l .)" ]; then
            echo "::error::gofumpt found unformatted files:"
            gofumpt -l .
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
      - name: go vet
        run: go vet ./...

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Test with race detector
        # TestI128TruncationGuard does a repo-wide go/packages walk and
        # can legitimately exceed 2m on hosted runners with the race
        # detector enabled. Keep the guard, but give the unit job enough
        # headroom that it does not flap on unrelated PRs.
        run: go test -race -timeout 4m -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Compile integration-tagged tests (no Docker)
        # F-1334: catches build-tag breakage (an interface change that
        # doesn't update an `//go:build integration` test) without
        # spinning testcontainers. The full Docker suite stays
        # operator-/local-invoked.
        run: make test-integration-build
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage
          path: coverage.txt

  integration-test:
    name: integration tests (Docker)
    runs-on: ubuntu-latest
    # BLOCKING (CS-070). Wiring this job first surfaced accumulated rot (the
    # suite was only ever compiled, never run) — all fixed 2026-07-01: the
    # stale FXSources assertion (massive joined the registry), the markets
    # tests that only refreshed prices_1m when DistinctPairs enumerates from
    # prices_1d, and the blend jsonb-attribute checks (compact substrings vs
    # postgres's spaced ::text). The full suite is green, so this is now a
    # required gate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: make test-integration
        # testcontainers-go spins TimescaleDB/Redis/MinIO; ubuntu-latest ships
        # a Docker daemon. 10-min cap matches the Makefile target.
        run: make test-integration

  # ────────────────────────────────────────────────────────────────
  # Policy checks — keep the repo enterprise-grade per
  # docs/discovery/engineering-standards.md.
  # ────────────────────────────────────────────────────────────────

  doc-checks:
    name: doc-code consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: lint-docs
        # Single script covers: doc freshness (90-day warn, 180-day
        # fail on frontmatter-dated docs), config/API/metrics
        # round-trip between code + reference, TODO-issue-link
        # discipline, generated-file banner integrity, ADR status
        # + superseded-by validity.
        run: ./scripts/ci/lint-docs.sh

  import-checks:
    name: import-boundary lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # lint-baseline-growth diffs against the PR base / push
          # `before` sha, so it needs more than a depth-1 checkout.
          fetch-depth: 0
      - name: lint-baseline-growth self-test
        # Runs BEFORE the restore below, deliberately: this validates the
        # gate script AS THIS PR SHIPS IT. After the restore the working
        # copy is the base ref's, so running it there would only ever
        # re-test main's version and a fix to the gate could never be
        # shown to work.
        #
        # This does not weaken CID-03. The gate that JUDGES this PR is
        # still the base-ref copy restored below; these fixtures only
        # assert that the version being merged behaves — undeclared
        # growth fails, declared growth passes, a reason-less trailer
        # does not count, and the verdict does not depend on how large
        # the commit range is (the piped `grep -q` it used to run took
        # SIGPIPE past the 64KB pipe buffer and failed PRs that had
        # declared correctly).
        run: ./scripts/ci/lint-baseline-growth-test.sh
      - name: Restore trusted gate scripts from the base ref
        # CID-03 (audit-2026-07-23): every step below runs from the
        # PR-head checkout, including the SCRIPT FILES themselves — so
        # a single PR could edit e.g. lint-migrations.sh to stop
        # flagging a BIGINT money column, add exactly that column in
        # the same diff, and be judged by its own weakened copy.
        # lint-migrations.sh (money-column DDL scan), lint-i128.sh (the
        # Go-side i128-truncation grep — same self-weakening risk: a PR
        # could broaden the pattern to stop matching int64(x.Lo) and add
        # exactly that truncation in one diff) and lint-baseline-growth.sh
        # (the anti-self-bypass tripwire for every OTHER baseline/
        # allowlist — the one gate whose own sabotage would be hardest to
        # notice) get the un-modified base-ref version restored over the
        # PR-head one before they run; every step still evaluates PR-head
        # CONTENT (the migrations/ tree, the internal/ + cmd/ + pkg/ Go
        # source lint-i128 scans, the git history lint-baseline-growth
        # diffs) — only the checker's own source is pinned to the base.
        #
        # These three guard the #1 money + i128 ADR-0003 invariants (and
        # the baseline-tripwire that guards everyone else); deliberately
        # scoped to them (medium-severity CID-03 scope) rather than every
        # scripts/ci/*.sh: a blanket policy
        # would also block a PR from ever exercising ITS OWN fix to
        # any other gate script in the same PR that adds the case it
        # fixes — a real workflow cost this repo does not currently
        # pay for the other ~20 gate scripts. Widen the loop below if
        # that trade-off is revisited.
        #
        # First push / shallow history (no BASE_SHA, or it isn't in
        # this checkout's history) falls back to the PR-head script
        # rather than failing the job — same fallback lint-baseline-
        # growth.sh's own BASE_SHA handling already uses.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            echo "::notice::no BASE_SHA — running PR-head gate scripts (first push / no comparison base)."
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::BASE_SHA ${BASE_SHA} not in local history — running PR-head gate scripts (fetch-depth too shallow?)."
            exit 0
          fi
          for f in scripts/ci/lint-migrations.sh scripts/ci/lint-i128.sh scripts/ci/lint-baseline-growth.sh; do
            if git show "${BASE_SHA}:${f}" > "${f}.trusted" 2>/dev/null; then
              mv "${f}.trusted" "$f"
              chmod +x "$f"
              echo "Restored $f from base ${BASE_SHA} — judged by the un-modified guard."
            else
              rm -f "${f}.trusted"
              echo "::notice::$f did not exist at base ${BASE_SHA} (new gate) — running the PR-head version."
            fi
          done
      - name: lint-imports
        # Enforces architectural import rules:
        # - No stellar-rpc in production ingest (removed from r1
        #   2026-04-23; see docs/architecture/ingest-pipeline.md).
        # - go-stellar-sdk/xdr scoped to internal/scval (ADR-0013).
        # - No Horizon anywhere (ADR-0001).
        # Grandfathered legacy violations live in
        # scripts/ci/lint-imports.baseline; the lint fails on NEW
        # violations or on stale baseline entries, forcing the
        # baseline to shrink monotonically.
        run: ./scripts/ci/lint-imports.sh
      - name: lint-protocol-registry-sync
        # The frontend protocol registry (web/explorer/.../protocols/registry.ts)
        # mirrors the Go source-of-truth (internal/api/v1/protocols_registry.go)
        # for the static-export slug set. Nothing cross-checked them, so a
        # Go-registered protocol could silently ship with no pre-rendered
        # explorer page (sorocredit, 2026-07-07). This fails on any name-set
        # drift between the two registries.
        run: ./scripts/ci/lint-protocol-registry-sync.sh
      - name: lint-i128
        # ADR-0003: reject int64(x.Lo) i128 truncation in Go (fast grep;
        # the deep go/types guard is TestI128TruncationGuard in
        # internal/canonical, which runs in the test job).
        run: ./scripts/ci/lint-i128.sh
      - name: lint-migrations
        # ADR-0003 SQL side: monetary migration columns must be NUMERIC —
        # never BIGINT/INT8/DOUBLE PRECISION/FLOAT/REAL. Escapes need an
        # inline `-- lint-money:ok <reason>`.
        run: ./scripts/ci/lint-migrations.sh
      - name: lint-migration-compat
        # CID-14 (audit-2026-07-23): migrations/README.md rule 9 —
        # every up-migration must be additive + old-binary-safe. The
        # deploy pipeline applies `migrate up` BEFORE the binary swap
        # and a failed health probe rolls back the BINARY ONLY
        # (CS-099), so a destructive migration turns a rollback into an
        # outage the pipeline cannot clear. Rule 9 was prose only; this
        # enforces it. Escapes need an inline
        # `-- migration-compat:ok <reason>`; pre-existing violations are
        # grandfathered (shrink-only) in
        # scripts/ci/migration-compat.baseline.
        run: ./scripts/ci/lint-migration-compat.sh
      - name: lint-migration-compat self-test
        # The gate's own fixtures: each violation class fires, the
        # inline escape needs a reason, `NOT NULL DEFAULT` stays
        # additive-safe. A rule-9 gate that silently stops matching is
        # worse than none.
        run: ./scripts/ci/lint-migration-compat-test.sh
      - name: check-deploy-protection self-test
        # deploy-approval-gate (audit-2026-07-23): fixtures for the
        # fail-closed environment-approval assertion deploy.yml runs
        # before it touches production. No network, no token.
        run: ./scripts/ci/check-deploy-protection-test.sh
      - name: check-main-ci-health self-test
        # reconciliation-and-monitoring-liveness (audit-2026-07-23):
        # fixtures for the shared red-streak decision core both
        # ci-health.yml (watches `ci.yml`) and reconciliation-health.yml
        # (watches `ansible-drift.yml`) call. No network, no token.
        run: ./scripts/ci/check-main-ci-health-test.sh
      - name: check-ansible-drift self-test
        # OBS-drift (audit-2026-07-23): fixtures for the codified≠live
        # verdict ansible-drift.yml calls. The load-bearing case runs the
        # pre-fix rule (`changed -gt 13`) and the current gate against the
        # same ansible output and asserts they disagree — thirteen unnamed
        # changed tasks used to pass as "no drift". ansible-drift.yml only
        # fires weekly against live r1, so these fixtures are the only
        # place the verdict is exercised on a PR. No network, no ansible.
        run: ./scripts/ci/check-ansible-drift-test.sh
      - name: lint-lexicon
        # Maintainability audit 2026-07-01 (D2+D6): domain-lexicon +
        # idiom ratchet. Zero rules (no Fetch/Make verbs, slog is the
        # only logger) + shrink-only per-file baseline for
        # grandfathered `Coin*` vocabulary and non-canonical
        # constructor shapes. See docs/architecture/lexicon.md.
        run: ./scripts/ci/lint-lexicon.sh
      - name: lint-baseline-growth
        # CS-098: lint baselines/allowlists are shrink-only. Growing
        # scripts/ci/*.baseline or the KNOWN_INERT allowlist in the
        # same change that introduces the violation it hides would
        # silently defeat the gate — growth must be declared with a
        # `Baseline-Growth:` commit trailer (auditable in git log).
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/ci/lint-baseline-growth.sh

  actions-pinning:
    name: github-actions SHA-pinning lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore trusted lint-actions-pinning.sh from the base ref
        # CID-03 (audit-2026-07-23): same class as import-checks'
        # equivalent step — a PR could weaken this script's PR_DIFF
        # hard-fail (e.g. widen SHA_RE, or exempt a namespace) and
        # introduce a new tag-pinned third-party action in the same
        # diff, and be judged by its own weakened copy. Restore the
        # base-ref (un-modified) script before it runs; its own
        # internal `git diff origin/main` logic is unaffected and still
        # evaluates the PR-head `.github/workflows/*.yml` content.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          f=scripts/ci/lint-actions-pinning.sh
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            echo "::notice::no BASE_SHA — running the PR-head $f (first push / no comparison base)."
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::BASE_SHA ${BASE_SHA} not in local history — running the PR-head $f (fetch-depth too shallow?)."
            exit 0
          fi
          if git show "${BASE_SHA}:${f}" > "${f}.trusted" 2>/dev/null; then
            mv "${f}.trusted" "$f"
            chmod +x "$f"
            echo "Restored $f from base ${BASE_SHA} — judged by the un-modified guard."
          else
            rm -f "${f}.trusted"
            echo "::notice::$f did not exist at base ${BASE_SHA} (new gate) — running the PR-head version."
          fi
      - name: lint-actions-pinning
        # F-1216 (codex audit-2026-05-12): warns on existing
        # tag-pinned third-party actions and HARD-FAILS when a
        # PR introduces a new tag-pinned third-party use. Existing
        # tag pins are bumped to SHA via Dependabot PRs over time.
        env:
          PR_DIFF: "1"
        run: bash scripts/ci/lint-actions-pinning.sh

  monitoring-rules:
    name: prometheus rule validation
    runs-on: ubuntu-latest
    # Validates BOTH deploy/monitoring/rules/*.yml (multi-host) and
    # configs/prometheus/rules.r1/*.yml (R1 single-host overlay)
    # with promtool. Catches YAML syntax errors, broken PromQL, and
    # undefined recording-rule references at PR time rather than at
    # Prometheus reload on a production node. Pre-wave-96 only the
    # multi-host files were validated; the R1 overlay shipped
    # unchecked.
    env:
      PROM_VERSION: "2.55.1"
      # audit-2026-07-16 (C4-17b): the expected tarball SHA-256 lives HERE, in
      # version control next to the version pin — NOT in a repo secret. A
      # checksum is public (from the upstream sha256sums.txt) and belongs in the
      # reviewable diff: bumping PROM_VERSION obligates bumping this in the same
      # commit. Storing it as a secret gained nothing and left CI hard-red for
      # 24h+ whenever the secret was unset. The `secrets.PROM_TARBALL_SHA256`
      # override below is retained only as an optional escape hatch.
      PROM_TARBALL_SHA256_DEFAULT: "19700bdd42ec31ee162e4079ebda4cd0a44432df4daa637141bdbea4b1cd8927"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: structural rule lint (no promtool)
        # Pure-Python guard that runs even if the promtool install below fails —
        # catches the mis-indented-rule class (2026-07-06 galexie-archive: alerts
        # at group level). Also wired into scripts/dev/verify.sh for local dev.
        run: python3 ./scripts/ci/lint-rule-structure.py
      - name: runbook-annotations lint (no promtool)
        # YAML-aware guard (audit C4-1): every alert's runbook_url must live
        # in `annotations`, not `labels` — else the Alertmanager Discord
        # templates render no runbook link. Fails if a runbook_url regresses
        # into labels. Also exercised via lint-docs.sh §9 + verify.sh.
        run: python3 ./scripts/ci/lint-runbook-annotations.py
      - name: install promtool
        run: |
          # F-1294 (codex audit-2026-05-13): SHA-verified install.
          # Pre-fix this was `curl | tar -xz` straight, no
          # checksum. Now we download, verify, then unpack.
          # Checksum source (audit-2026-07-16 C4-17b): the committed
          # PROM_TARBALL_SHA256_DEFAULT (in the job env, versioned + reviewable),
          # overridable by an optional repo secret. No unset-secret hard-red.
          SHA="${PROM_TARBALL_SHA256:-$PROM_TARBALL_SHA256_DEFAULT}"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" -o /tmp/prom.tar.gz
          echo "${SHA}  /tmp/prom.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prom.tar.gz
          sudo install -m 0755 "prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
      - name: validate rules
        run: make monitoring-check

  # ────────────────────────────────────────────────────────────────
  # Security — fast scans on every PR: govulncheck + gitleaks (below).
  # Heavier scans (trivy fs vuln+secret, CycloneDX SBOM) run OFF the
  # PR path in .github/workflows/security.yml (weekly schedule +
  # workflow_dispatch) — that workflow closes the N2-02 pre-flip gap
  # that used to be documented here. Don't duplicate scanners across
  # the two: fast-and-blocking lives here, deep-and-scheduled there.
  # ────────────────────────────────────────────────────────────────

  vuln:
    name: govulncheck + gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...
      - name: gitleaks
        # gitleaks/gitleaks-action@v2 changed to a paid-license model
        # in late 2022 — fails every run without a GITLEAKS_LICENSE
        # secret. We invoke the OSS CLI directly instead (same scan,
        # MIT licensed, no key).
        run: |
          # F-1294 (codex audit-2026-05-13): SHA-verified install.
          # Pre-fix this was `curl | tar -xz` straight, no
          # checksum. Now we download, verify, then unpack.
          # Checksum source (audit-2026-07-16 C4-17b): the committed
          # GITLEAKS_TARBALL_SHA256_DEFAULT (top-level env, versioned +
          # reviewable), overridable by an optional repo secret.
          SHA="${GITLEAKS_TARBALL_SHA256:-$GITLEAKS_TARBALL_SHA256_DEFAULT}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${SHA}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks detect --redact --verbose --no-banner

  # ────────────────────────────────────────────────────────────────
  # Build — the binaries must compile on every PR.
  # ────────────────────────────────────────────────────────────────

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
      - name: Upload binaries (short retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: binaries-${{ github.sha }}
          path: bin/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # API contract check — OpenAPI lint + docs-regen drift detection.
  # ────────────────────────────────────────────────────────────────

  openapi:
    name: openapi lint
    runs-on: ubuntu-latest
    # N2-04: runs on push-to-main too — a direct push (the live-in-dev
    # norm) that edits openapi/ or the handlers previously skipped Spectral
    # + the generated-reference drift check, the exact bypass the push
    # trigger above exists to close. The job is cheap.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Spectral lint
        uses: stoplightio/spectral-action@6416fd018ae38e60136775066eb3e98172143141  # v0.8.13
        with:
          file_glob: openapi/*.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: ADR-0018 URL-discipline check
        run: go run ./scripts/ci/lint-openapi-urls openapi/stellar-index.v1.yaml
      - name: ADR-0033 PK-discriminator check (coarse-PK data-loss guard)
        run: go run ./scripts/ci/lint-pk-discriminators
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
      - name: Generated API reference is in sync
        run: |
          ./scripts/dev/docs-api.sh
          if ! git diff --exit-code -- docs/reference/api/index.html docs/reference/api/README.md docs/reference/api/stellar-index.v1.yaml; then
            echo "::error::Generated API reference is stale. Run 'make docs-api' locally and commit the result."
            exit 1
          fi
      - name: Generated Postman collection is in sync
        # Third leg of the generated-artifact drift guard: docs/reference/api
        # is checked above, web/explorer/src/api/types.ts in the web-explorer
        # job. The converter is deterministic (seeded json-schema-faker
        # preload + jq ID-strip in docs-postman.sh, commit 8ea2b9ad), so an
        # exact-diff gate is safe.
        run: |
          ./scripts/dev/docs-postman.sh
          if ! git diff --exit-code -- examples/postman; then
            echo "::error::Generated Postman collection is stale. Run 'make docs-postman' locally and commit the result."
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────
  # Showcase site — typecheck, lint, build the Next.js app at
  # web/explorer/. Static-export build is fast (~30s).
  # Also verifies the OpenAPI → TypeScript codegen is in sync; if
  # the OpenAPI spec changed and someone forgot to regen the types,
  # this fails with a clear error.
  # ────────────────────────────────────────────────────────────────

  web-explorer:
    name: web/explorer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/explorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        with:
          version: "10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/explorer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are in sync
        run: |
          pnpm generate:api
          if ! git diff --exit-code -- src/api/types.ts; then
            echo "::error::Generated TS API types are stale. Run 'make web-generate-api' locally and commit src/api/types.ts."
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm lint
      # Build covers what typecheck/lint don't: Next.js static-export
      # constraints (e.g. `dynamic = 'force-static'` requirement on
      # sitemap/robots routes), generateStaticParams behaviour at
      # build time, and any runtime-vs-build divergence in the
      # output: 'export' pipeline. The build-time API fetch falls
      # through to the seed-only path when CI can't reach the
      # production API — that's expected and not a CI failure.
      #
      # We deliberately run the build ONLY against the CI stub URL.
      # A second build against the real API used to live here, but
      # Next.js's per-page-render 60s worker timeout is too tight
      # for /assets/native — XLM has 5,553 markets and the build
      # serialises the response into the static HTML, which trips
      # the timeout on busy build hosts. CF Pages does the real-API
      # build at deploy time with its own retry policy, so the CI
      # second-pass was redundant. Keep the stub-URL build — it
      # exercises every code path that doesn't depend on API shape.
      - run: pnpm build
        env:
          # Force a deterministic api-base URL so the build doesn't
          # try to contact production from CI. The fallback in
          # generateStaticParams kicks in when the fetch fails, so
          # the build still succeeds with seed-only slugs.
          NEXT_PUBLIC_API_BASE_URL: http://api.ci-stub.invalid
      # F-1207 (codex audit-2026-05-12): pnpm advisory gate.
      - name: pnpm audit (advisory gate)
        # 2026-07-15: the npm advisory endpoint pnpm audit calls has been
        # returning ERR_PNPM_AUDIT_BAD_RESPONSE (registry-side, not a repo
        # issue); treat only that specific failure as non-fatal so a real
        # high-severity advisory still reds the build.
        run: |
          set +e
          audit_output="$(pnpm audit --audit-level high 2>&1)"
          audit_exit=$?
          set -e
          echo "$audit_output"
          if [ "$audit_exit" -eq 0 ]; then
            exit 0
          fi
          if echo "$audit_output" | grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE"; then
            echo "::warning::pnpm audit endpoint returned a bad response (registry-side) — not failing the build on this."
            exit 0
          fi
          exit "$audit_exit"

  # ────────────────────────────────────────────────────────────────
  # Status page — the status.stellarindex.io project is now redirect-only
  # (the page lives at stellarindex.io/status). Replaces
  # the cstate Hugo build with a custom Next.js static-export.
  # ────────────────────────────────────────────────────────────────
  web-status:
    name: web/status
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6
        with:
          version: "10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/status/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://api.ci-stub.invalid
      # F-1207 (codex audit-2026-05-12): pnpm advisory gate.
      - name: pnpm audit (advisory gate)
        # 2026-07-15: the npm advisory endpoint pnpm audit calls has been
        # returning ERR_PNPM_AUDIT_BAD_RESPONSE (registry-side, not a repo
        # issue); treat only that specific failure as non-fatal so a real
        # high-severity advisory still reds the build.
        run: |
          set +e
          audit_output="$(pnpm audit --audit-level high 2>&1)"
          audit_exit=$?
          set -e
          echo "$audit_output"
          if [ "$audit_exit" -eq 0 ]; then
            exit 0
          fi
          if echo "$audit_output" | grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE"; then
            echo "::warning::pnpm audit endpoint returned a bad response (registry-side) — not failing the build on this."
            exit 0
          fi
          exit "$audit_exit"

  ansible-check:
    name: ansible syntax + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install ansible + lint
        # DEP-01 (audit-2026-07-23): exact pins, same reasoning as
        # ansible-drift.yml — this job carries no secrets, but an
        # unpinned install still runs arbitrary upstream code in CI on
        # every PR. Pinned to what it already resolved to.
        run: |
          set -euo pipefail
          pipx install --include-deps 'ansible==14.2.0'
          pipx install 'ansible-lint==26.6.0'
      - name: Syntax check (secrets stubbed — structure only)
        working-directory: configs/ansible
        run: |
          # syntax-check only needs the vars file to exist and parse.
          # Do not expose production vault material to Dependabot PRs.
          # GUARD (2026-07-27): only write the stub if no password file
          # exists — on 2026-07-25 these exact commands, reproduced on an
          # operator workstation, silently OVERWROTE the real vault
          # password (which had no other copy). Ephemeral CI runners never
          # have the file, so the guard is a no-op in CI.
          mkdir -p ~/.ansible
          if [ ! -e ~/.ansible/r1_vault_pass ]; then
            printf '%s\n' 'ci-syntax-only' > ~/.ansible/r1_vault_pass
            chmod 600 ~/.ansible/r1_vault_pass
          fi
          printf '%s\n' '--- {}' > inventory/ci.syntax-secrets.yml
          ansible-playbook --syntax-check -i inventory/r1.example.yml playbooks/archival-node.yml -e secrets_file=../inventory/ci.syntax-secrets.yml
          ansible-playbook --syntax-check -i inventory/r1.example.yml playbooks/monitoring.yml
      - name: ansible-lint (production profile, warnings tolerated)
        working-directory: configs/ansible
        run: ansible-lint --profile moderate roles/ playbooks/ || true

  branch-protection-status:
    name: branch protection status (informational)
    runs-on: ubuntu-latest
    # CID-01 (audit-2026-07-23): only meaningful on the branch itself —
    # a PR's merge-ref isn't "main", so this only runs on push-to-main.
    if: github.event_name == 'push'
    permissions: {}
    steps:
      - name: Warn if main has no active branch-protection rules
        # `GET /repos/<repo>/rules/branches/<branch>` is a PUBLIC,
        # unauthenticated GitHub API endpoint for a public repo — no
        # token or checkout needed, so this cannot be broken by a
        # credential problem. Deliberately advisory (::warning::,
        # never fails the build): ruleset configuration is a repo
        # Setting nothing in this repo can change, and hard-failing
        # every push to main over an org setting would just make main
        # permanently red for everyone with merge rights rather than
        # fix anything. See the CID-01 note on the `push:` trigger
        # above for why the claim this replaces was wrong.
        run: |
          set -euo pipefail
          rules="$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/rules/branches/main")"
          count="$(printf '%s' "$rules" | jq 'length')"
          if [ "$count" -eq 0 ]; then
            echo "::warning::main has ZERO active branch-protection rules right now (GET /repos/${{ github.repository }}/rules/branches/main returned []). Anyone with push access can force-push or delete main. Configure branch rulesets in repo Settings → Rules if this is unintentional."
          else
            echo "main has ${count} active branch-protection rule(s)."
          fi
