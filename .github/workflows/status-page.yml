---
# Manual-trigger Cloudflare Pages deploy for the status.stellarindex.io
# project — now REDIRECT-ONLY (web/status/public/_redirects 301s to
# stellarindex.io/status). The live status page moved onto the main
# explorer at /status; this deploy just keeps the redirect + cert fresh.
#
# **The recommended publish path is Cloudflare's git integration**
# — it auto-deploys on every push to main without consuming GitHub
# Actions minutes. This workflow is the same hotfix / git-paused
# fallback as docs-deploy.yml + explorer-deploy.yml.
#
# Builds the Next.js static-export status page at web/status/
# and pushes it to the `stellarindex-status` Pages project.
#
# Required secrets (set once in repo settings):
#   - CLOUDFLARE_API_TOKEN  — token with Pages:Edit on
#                             stellarindex-status
#   - CLOUDFLARE_ACCOUNT_ID — the CF account UUID

name: status-page

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "production or preview"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      api_base_url:
        description: "NEXT_PUBLIC_API_BASE_URL bake-in (default https://api.stellarindex.io)"
        required: false
        default: "https://api.stellarindex.io"

permissions:
  contents: read
  deployments: write
  actions: read  # GitHub gates the environments API on Actions read

concurrency:
  group: status-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: status-${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the production approval gate is configured
        # Same gate as explorer-deploy.yml: this job holds
        # CLOUDFLARE_API_TOKEN and publishes production Pages. Scoped to
        # production; preview is non-public.
        if: github.event.inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
          ENV_NAME: status-${{ github.event.inputs.environment }}
          REPO: ${{ github.repository }}
          APPROVAL_RELAXED: ${{ vars.DEPLOY_APPROVAL_RELAXED }}
          APPROVAL_RELAXED_UNTIL: ${{ vars.DEPLOY_APPROVAL_RELAXED_UNTIL }}
        run: bash scripts/ci/assert-deploy-gate.sh "$ENV_NAME"

      - name: Validate api_base_url
        # Baked into the build; same bare-https-origin rule as
        # explorer-deploy.yml's override.
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          set -euo pipefail
          if [[ ! "$API_BASE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::api_base_url '$API_BASE_URL' is not a bare https origin"
            exit 1
          fi

      - name: Set up pnpm
        # T547: package_json_file reads web/status/package.json's
        # `packageManager` pin instead of a version input that floats
        # independently of it.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          package_json_file: web/status/package.json
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/status/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web/status
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web/status
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: pnpm build

      - name: Verify build artefact
        working-directory: web/status
        run: |
          test -d out || { echo "out/ missing"; exit 1; }
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          ls -la out/ | head

      - name: Resolve deploy branch
        # The Pages branch label is the production switch, so it must agree
        # with the ref this job checked out: production only from main,
        # preview never as `main`, allowlisted because it reaches wrangler's
        # command line (F-004). Refs pass through the runner's GITHUB_REF /
        # GITHUB_REF_NAME, never a `${{ }}` interpolated into the shell.
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: bash scripts/ci/resolve-pages-branch.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/status
          command: >-
            pages deploy out
            --project-name stellarindex-status
            --branch ${{ env.BRANCH }}
