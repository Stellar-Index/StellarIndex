---
# Publish the generated API reference to GitHub Pages.
#
# Runs on every push to main that affects either the OpenAPI source
# or the generated output. The CI drift check in ci.yml has already
# verified the two are in sync at PR-merge time, so this workflow
# trusts what's in main and just publishes.
#
# DNS: docs.stellarindex.io is wired to the project's GitHub Pages
# domain (set via repository CNAME after the public-flip per
# docs/operations/public-flip.md).

name: api-docs

on:
  # GitHub Pages is configured AFTER the public-flip per
  # docs/operations/public-flip.md §"Post-flip" — until then this
  # workflow's `actions/deploy-pages` step fails on every run
  # because Pages isn't enabled on the private repo. Run manually
  # via workflow_dispatch when needed (and re-enable the push
  # trigger as part of the public-flip cutover, Task #78).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single-deploy queue: avoid two runs racing the Pages deploy.
concurrency:
  group: api-docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The generated index.html is committed; we don't regenerate
      # here (CI drift check guards correctness). Just stage what's
      # in the tree.
      - name: Stage Pages artefact
        run: |
          mkdir -p _site
          cp -r docs/reference/api/index.html _site/index.html
          cp -r docs/reference/api/README.md _site/README.md
          cp -r docs/reference/api/stellar-index.v1.yaml _site/stellar-index.v1.yaml

      # CID-02 / CID-06 (audit-2026-07-23): both were tag-pinned in a
      # job holding id-token:write + pages:write — a mutable major tag
      # a compromised/hijacked upstream release could move. Every other
      # actions/* use in this repo is already SHA-pinned (see
      # actions/checkout and actions/deploy-pages just above/below);
      # these two were the outliers, not an intentional exception —
      # lint-actions-pinning.sh exempts the whole actions/* namespace
      # from its gate, so nothing caught the drift. SHAs resolved via
      # `gh api repos/actions/configure-pages/commits/v6 --jq .sha` and
      # the equivalent for upload-pages-artifact@v5.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5