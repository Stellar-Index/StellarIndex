---
# Publish the generated API reference to GitHub Pages.
#
# docs.stellarindex.io is NOT served from here: it is on Cloudflare
# Pages (project stellarindex-docs), published by Cloudflare's git
# integration with docs-deploy.yml as the manual fallback. This
# workflow is dispatch-only and deliberately not push-triggered, so a
# second publisher never races the canonical one.

name: api-docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single-deploy queue: avoid two runs racing the Pages deploy.
concurrency:
  group: api-docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The generated index.html is committed; we don't regenerate
      # here (CI drift check guards correctness). Just stage what's
      # in the tree.
      - name: Stage Pages artefact
        run: |
          mkdir -p _site
          cp -r docs/reference/api/index.html _site/index.html
          cp -r docs/reference/api/README.md _site/README.md
          cp -r docs/reference/api/stellar-index.v1.yaml _site/stellar-index.v1.yaml

      # CID-02 / CID-06 (audit-2026-07-23): both were tag-pinned in a
      # job holding id-token:write + pages:write — a mutable major tag
      # a compromised/hijacked upstream release could move. Every other
      # actions/* use in this repo is already SHA-pinned (see
      # actions/checkout and actions/deploy-pages just above/below);
      # these two were the outliers, not an intentional exception —
      # lint-actions-pinning.sh exempts the whole actions/* namespace
      # from its gate, so nothing caught the drift. SHAs resolved via
      # `gh api repos/actions/configure-pages/commits/v6 --jq .sha` and
      # the equivalent for upload-pages-artifact@v5.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1