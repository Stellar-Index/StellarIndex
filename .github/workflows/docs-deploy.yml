---
# Manual-trigger Cloudflare Pages deploy for docs.stellarindex.io.
#
# **The recommended publish path is Cloudflare's git integration**
# — it auto-deploys on every push to main without consuming GitHub
# Actions minutes. This workflow exists for two cases:
#
#   1. **Hotfix** — publish a fix. environment=production must be
#      dispatched from main (scripts/ci/resolve-pages-branch.sh refuses
#      any other ref); any other ref publishes as a preview.
#   2. **CF git integration paused / stale** — fall back to publishing
#      from CI when the Pages project's git connection isn't firing
#      (e.g. mid-rotation of the CF GitHub app token, or after a
#      project was created without git integration).
#
# Mirrors explorer-deploy.yml but for the `stellarindex-docs` project.
# The docs site is a small static directory (Scalar's index.html +
# the OpenAPI YAML); no build step needed.
#
# Required secrets (set once in repo settings):
#   - CLOUDFLARE_API_TOKEN  — token with Pages:Edit on
#                             stellarindex-docs
#   - CLOUDFLARE_ACCOUNT_ID — the CF account UUID

name: docs-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "production or preview"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  deployments: write
  actions: read  # GitHub gates the environments API on Actions read

# One deploy at a time. Mid-deploy cancellation is fine — the
# new run takes over before traffic shifts.
concurrency:
  group: docs-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: docs-${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the production approval gate is configured
        # Same gate as explorer-deploy.yml: this job holds
        # CLOUDFLARE_API_TOKEN and publishes production Pages. Scoped to
        # production; preview is non-public.
        if: github.event.inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
          ENV_NAME: docs-${{ github.event.inputs.environment }}
          REPO: ${{ github.repository }}
          APPROVAL_RELAXED: ${{ vars.DEPLOY_APPROVAL_RELAXED }}
          APPROVAL_RELAXED_UNTIL: ${{ vars.DEPLOY_APPROVAL_RELAXED_UNTIL }}
        run: bash scripts/ci/assert-deploy-gate.sh "$ENV_NAME"

      # No build step — `docs/reference/api/` already contains
      # the rendered Scalar index.html + the colocated OpenAPI
      # YAML, both committed by `make docs-api`. The CI drift
      # check guards correctness on every merge.
      - name: Verify staged artefact
        run: |
          test -f docs/reference/api/index.html || {
            echo "::error::docs/reference/api/index.html missing"
            exit 1
          }
          test -f docs/reference/api/stellar-index.v1.yaml || {
            echo "::error::docs/reference/api/stellar-index.v1.yaml missing"
            exit 1
          }
          ls -la docs/reference/api/

      - name: Resolve deploy branch
        # The Pages branch label is the production switch, so it must agree
        # with the ref this job checked out: production only from main,
        # preview never as `main`, allowlisted because it reaches wrangler's
        # command line (F-004). Refs pass through the runner's GITHUB_REF /
        # GITHUB_REF_NAME, never a `${{ }}` interpolated into the shell.
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: bash scripts/ci/resolve-pages-branch.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47  # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy docs/reference/api
            --project-name stellarindex-docs
            --branch ${{ env.BRANCH }}
