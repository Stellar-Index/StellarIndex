---
# Transactional-email (notify / Resend) alerts (task #33 / W8 recon 9c).
#
# internal/notify is the mail client behind magic-link dashboard login and
# API-signup email confirmation. It had ZERO prometheus visibility, so a
# Resend outage was silent: the login handler swallows the send error
# (returns 200 either way, to avoid an email-enumeration oracle) and the
# signup path only logs it. stellarindex_notify_sends_total{template,result}
# is emitted at every send call site; a sustained failed ratio is the alert.
#
# Every alert here has a runbook at docs/operations/runbooks/.

groups:
  - name: stellarindex.notify
    interval: 60s
    rules:

      # Sustained mail-send failure ratio per template. Ratio (not absolute
      # rate) so a single stray 4xx in a quiet window doesn't page; a 15m
      # window + for:15m means a genuine provider outage, not a blip. When
      # there is zero mail traffic the ratio is 0/0 = NaN and the comparison
      # drops it (no false page during quiet hours). Severity ticket, not
      # page: existing sessions + API keys keep working — only NEW logins and
      # signup confirmations stop delivering — but it needs prompt action
      # because both are user-facing auth flows.
      - alert: stellarindex_notify_send_failure_ratio_high
        expr: |
          sum by (template) (rate(stellarindex_notify_sends_total{result="failed"}[15m]))
          /
          sum by (template) (rate(stellarindex_notify_sends_total{result!="suppressed"}[15m]))
          > 0.5
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: notify
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/notify-send-failure.md
          summary: "Transactional email ({{ $labels.template }}) failing > 50% of sends"
          description: |
            More than half of {{ $labels.template }} email sends have failed
            for 15+ minutes ({{ $value | humanizePercentage }} failed). The
            mail provider (Resend) is likely down, the API key is rotated/
            invalid, or the sending domain is unverified. Customer impact:
            magic-link dashboard LOGIN and/or API-signup CONFIRMATION stop
            delivering — existing sessions and API keys are unaffected. Check
            the Resend status + credentials per the runbook.

            Runbook: docs/operations/runbooks/notify-send-failure.md

      # Q268/RLT-324: the ratio rule above is 0/0 = NaN whenever a template
      # has sent nothing at all in the last 15m, and the comparison drops
      # NaN — so a mailer that has stopped being invoked entirely (wiring
      # broken, a panic before the Send() call site, the client silently
      # never firing) produces NO signal, the same "all quiet" reading as a
      # legitimately idle overnight window. This is a dead-man's-switch
      # companion, not a ratio: it fires on TOTAL absence of send attempts
      # (either result) over 6h, but only while sign-in/signup requests were
      # being answered 2xx — each of those reaches a Send() call, so demand
      # with zero attempts is a broken mailer, and no demand is just idle.
      - alert: stellarindex_notify_no_send_activity
        expr: |
          sum(increase(http_requests_total{job="stellarindex_api",method="POST",route=~"/v1/auth/login|/v1/signup",status=~"2.."}[6h])) > 0
          unless
          sum(increase(stellarindex_notify_sends_total[6h])) > 0
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: notify
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/notify-send-failure.md
          summary: "{{ $value | humanize }} sign-in/signup requests in 6h, but no transactional email send attempts"
          description: |
            POST /v1/auth/login and POST /v1/signup answered 2xx
            {{ $value | humanize }} times in the last 6 hours, yet
            stellarindex_notify_sends_total has not incremented for any
            template or result. The mailer has stopped being invoked
            entirely — not merely failing — which the failure-ratio alert
            cannot see (0 failed / 0 sent is NaN, not "> 0.5"). Check that
            the dashboard-login and signup-verify handlers are still calling
            internal/notify.Sender.Send, and that the signup verification
            emailer is configured.

            Runbook: docs/operations/runbooks/notify-send-failure.md

      # Any failed send in the last hour. The ratio rule is NaN when a
      # template has no attempts and needs >50% failures; the sustained rule
      # needs failures in every 15m window for 1h. A rare failure (a handful
      # a day) trips neither, yet each one is a user without their login or
      # confirmation email. Counter children are pre-seeded, so increase()
      # sees a lone failure.
      - alert: stellarindex_notify_send_failed
        expr: sum by (template) (increase(stellarindex_notify_sends_total{result="failed"}[1h])) > 0
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: notify
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/notify-send-failure.md
          summary: "Transactional email ({{ $labels.template }}) had {{ $value | humanize }} failed send(s) in the last hour"
          description: |
            At least one {{ $labels.template }} email send failed in the
            last hour. Rare failures stay under the ratio and sustained
            alerts, so this is the only signal for them. A user did not get
            their magic link or confirmation email.

            Runbook: docs/operations/runbooks/notify-send-failure.md

      # Q268/RLT-324: the ratio rule only pages once failures cross 50% of
      # a template's traffic. A high-volume template failing a sustained
      # ~20-40% of sends never crosses that bar but still means a steady
      # stream of users never got their magic link or confirmation email —
      # this absolute-rate companion pages on sustained non-zero failures
      # regardless of the surrounding success volume.
      - alert: stellarindex_notify_send_failures_sustained
        expr: sum by (template) (rate(stellarindex_notify_sends_total{result="failed"}[15m])) > 0
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: notify
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/notify-send-failure.md
          summary: "Transactional email ({{ $labels.template }}) has been failing continuously for 1h"
          description: |
            {{ $labels.template }} email sends have included at least one
            failure in every 15m window for the last hour — a persistent
            failure trickle that may never cross the 50%-ratio alert's
            threshold if send volume is high, but still means some fraction
            of users never received their magic link or confirmation email.

            Runbook: docs/operations/runbooks/notify-send-failure.md

      # Global ceiling on mail actually sent. The login throttles are per
      # inbox and per IP, so volume spread across many IPs and addresses is
      # bounded by neither. 300/h is ~30 IPs each at their full login budget,
      # far above organic sign-in and signup traffic.
      - alert: stellarindex_notify_send_rate_high
        expr: sum(rate(stellarindex_notify_sends_total{result="sent"}[15m])) * 3600 > 300
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: notify
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/notify-send-failure.md
          summary: "Transactional email is going out at {{ $value | humanize }}/h (ceiling 300/h)"
          description: |
            Successful transactional email sends, summed across every
            template, have stayed above 300 mails/hour for 15+ minutes. The
            per-inbox and per-IP login-mail throttles bound each caller, not
            the total, so this is the only signal that aggregate volume has
            left its normal range — a send loop, or sign-in links requested
            for many addresses from many IPs. Sustained high volume spends
            the sending domain's reputation for every recipient.

            Runbook: docs/operations/runbooks/notify-send-failure.md
