---
# verify-archive systemd-timer alerts.
#
# Scrape source: node_exporter's `--collector.systemd` exports
# `node_systemd_unit_state{name=…,state=…}` for each enabled unit.
# We use that to detect failed runs (verify-archive exits non-zero
# on chain-mismatch / missing-file / archivist-timeout — any of
# these is a fail-loud signal that ops needs to investigate).
#
# Alert family:
#
#   - `stellarindex_verify_archive_unit_failed` — the most-recent
#     run of the verify-archive-tier-a.service unit ended in the
#     `failed` state. Severity: ticket (the API still serves
#     correct data; this is an integrity-confidence signal).
#
#   - `stellarindex_verify_archive_run_stale` — the unit hasn't
#     completed cleanly in over 36h (the timer's 24h cadence plus a
#     12h cushion). Either the timer is disabled or every recent
#     run failed. Severity: page at 36h (R1's nightly check is
#     core to the cross-region trust model per ADR-0016).
#
# These two are R1-only — R2/R3 trust R1 for chain-link and don't
# run this nightly timer. When the weekly Tier A timer for R2/R3
# ships its alerts will be parameterised by `region` label.

groups:
  - name: stellarindex.verify_archive
    interval: 60s
    rules:

      - alert: stellarindex_verify_archive_unit_failed
        expr: |
          node_systemd_unit_state{
            name="verify-archive-tier-a.service",
            state="failed"
          } == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/verify-archive.md#stellarindex_verify_archive_unit_failed
          summary: "verify-archive Tier A nightly run failed on {{ $labels.instance }}"
          description: |
            The most-recent run of `verify-archive-tier-a.service` exited
            in the `failed` state. Possible causes:
              - Chain-link mismatch — a ledger's prev_hash doesn't match the
                previous ledger's hash. Real corruption signal.
              - Missing file in the galexie-archive bucket — gap that the
                archive-completeness daily run should also be alerting on.
              - 8h max-runtime cap exceeded — investigate the per-chunk
                progress in journald (`journalctl -u verify-archive-tier-a`).
              - Lock wait expired — Tier B (or a manual `verify-archive`
                run) held the shared `verify-archive` lock for the whole
                HEAVY_JOB_LOCK_WAIT (20h); the journal says "still held
                after waiting". Find the holder with
                `fuser -v /run/lock/stellarindex-heavy-verify-archive.lock`.
            Customer impact: zero immediate; the API serves from existing
            data. Cross-region trust model degrades after 48h without a
            clean run (see stellarindex_verify_archive_run_stale).

      # Staleness: when did verification last SUCCEED?
      #
      # Reads stellarindex_verify_archive_last_success_unix, which the
      # verify-archive binary writes to its node_exporter textfile and
      # advances ONLY on a clean exit (internal/ops/archive/
      # verify_archive_textfile.go). A failed run carries the prior
      # value forward.
      #
      # It must not read node_systemd_timer_last_trigger_seconds — that is
      # when the TIMER last FIRED, independent of the triggered service's
      # exit status. A job that failed every single night would keep the
      # gauge perfectly fresh, and this page would be defeated by exactly
      # the scenario it exists for.
      #
      # The `> 0` guard is retained deliberately: a host that has never
      # completed a run emits an explicit 0, and 0 would otherwise read
      # as "stale since 1970" on first install. That keeps
      # a fresh host quiet; making a never-verified host page is
      # a separate operator decision.
      #
      # absent_over_time branch (OBS-2 pattern; same shape as
      # stellarindex_api_price_stale in api.yml and
      # stellarindex_ch_schema_snapshot_stale in storage.yml): `time() -
      # x` over an empty vector is itself empty, so if the textfile is
      # never written at all — node_exporter down, the collector
      # directory misconfigured, the unit never scheduled — the series
      # doesn't exist and the bare comparison can never fire, exactly
      # the scenario this page exists for. absent_over_time(...[36h])
      # restores that coverage.
      #
      # 36h = 24h cadence + 12h cushion.
      - alert: stellarindex_verify_archive_run_stale
        expr: |
          (
            time()
            -
            (stellarindex_verify_archive_last_success_unix{
              tier="chain"
            } > 0)
          ) > (36 * 3600)
          or
          absent_over_time(stellarindex_verify_archive_last_success_unix{tier="chain"}[36h]) == 1
        for: 10m
        labels:
          severity: page
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/verify-archive.md#stellarindex_verify_archive_run_stale
          summary: "(R1 integrity-leader) verify-archive Tier A hasn't run cleanly in {{ $value | humanizeDuration }}"
          description: |
            R1 is the integrity leader per ADR-0016 — its nightly chain-link
            verification is what R2/R3 trust. 36h without a clean run means
            either the timer isn't enabled or every recent attempt failed.
            Escalate immediately; the cross-region trust property degrades
            with each missed cycle. Diagnosis:
              - `systemctl status verify-archive-tier-a.timer` — is it active?
              - `journalctl -u verify-archive-tier-a.service` — what's failing?
              - check `archive_files_missing` — a gap upstream blocks verify.

      # Tier B checkpoint ANCHOR. verify_archive.go
      # has always implemented `-tier checkpoint` (cross-check each 64-ledger
      # checkpoint's LCM header-hash against the canonical hash in the local
      # /srv/history-archive mirror), but only the Tier A (chain) unit was
      # scheduled — so this single-source-corruption check, the failure mode
      # Tier A is blind to, never actually ran. These two alerts mirror the
      # Tier A pair for the new verify-archive-tier-b.{service,timer}. Both are
      # ticket, not page: Tier B is defence-in-depth over the page-level Tier A
      # chain check (a stale/failed Tier B does not by itself break the
      # cross-region trust the chain check anchors).
      - alert: stellarindex_verify_archive_tier_b_unit_failed
        expr: |
          node_systemd_unit_state{
            name="verify-archive-tier-b.service",
            state="failed"
          } == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/verify-archive.md#stellarindex_verify_archive_tier_b_unit_failed
          summary: "verify-archive Tier B checkpoint anchor failed on {{ $labels.instance }}"
          description: |
            The most-recent run of `verify-archive-tier-b.service` exited in the
            `failed` state. Possible causes:
              - Checkpoint anchor mismatch — our LCM's header-hash for a
                checkpoint ledger disagrees with the canonical hash in the local
                /srv/history-archive mirror. A single-source-corruption signal
                (Tier A chain-link can pass while this fails).
              - The local /srv/history-archive mirror is missing/stale for the
                checked range — every checkpoint "missed", which Tier B treats
                as inconclusive-and-fatal (DAT-09).
              - max-runtime / watchdog — investigate journald
                (`journalctl -u verify-archive-tier-b`).
              - Lock wait expired — Tier A (or a manual `verify-archive`
                run) held the shared `verify-archive` lock for the whole
                HEAVY_JOB_LOCK_WAIT (20h); the journal says "still held
                after waiting". Find the holder with
                `fuser -v /run/lock/stellarindex-heavy-verify-archive.lock`.
            Customer impact: zero immediate; the API serves from existing data.

            Runbook: docs/operations/runbooks/verify-archive.md#stellarindex_verify_archive_tier_b_unit_failed

      # Same absent_over_time branch as the Tier A staleness rule above
      # (OBS-2 pattern) — `time() - x` over an empty vector is empty, so
      # a Tier B textfile that was never written (unit never scheduled,
      # node_exporter down) would otherwise never page.
      - alert: stellarindex_verify_archive_tier_b_run_stale
        expr: |
          (
            time()
            -
            (stellarindex_verify_archive_last_success_unix{
              tier="checkpoint"
            } > 0)
          ) > (36 * 3600)
          or
          absent_over_time(stellarindex_verify_archive_last_success_unix{tier="checkpoint"}[36h]) == 1
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/verify-archive.md#stellarindex_verify_archive_tier_b_run_stale
          summary: "verify-archive Tier B checkpoint anchor hasn't run cleanly in {{ $value | humanizeDuration }}"
          description: |
            The Tier B checkpoint-anchor timer hasn't fired cleanly in 36h+
            (24h cadence + 12h cushion) — either the timer isn't enabled or
            every recent attempt failed. The single-source-corruption anchor
            check is not running. Lower urgency than the Tier A chain staleness
            page (Tier B is defence-in-depth), but investigate. Diagnosis:
              - `systemctl status verify-archive-tier-b.timer` — is it active?
              - `journalctl -u verify-archive-tier-b.service` — what's failing?
              - is the /srv/history-archive mirror synced to the checked range?

            Runbook: docs/operations/runbooks/verify-archive.md#stellarindex_verify_archive_tier_b_unit_failed

      # Tier D (multi-peer fork-detection, weekly). `-tier peers` samples
      # 50 peer archives and compares their checkpoint hashes against
      # ours — the failure mode Tier A/B cannot see (our own mirror can
      # agree with itself while disagreeing with the network). Installed
      # as a root CRON entry (Sunday 16:23 UTC), not a systemd unit, so
      # there is no node_systemd_unit_state series to pair a "run failed"
      # alert off of the way Tier A/B do — staleness on
      # stellarindex_verify_archive_last_success_unix{tier="peers"} is
      # the only signal that covers both "every recent run failed" and
      # "the cron entry was never installed" (gated on
      # verify_archive_tier_d_enabled — pubnet only; a single-region
      # testnet/futurenet host has no peer region to cross-check).
      #
      # 8d = the weekly cadence (Sunday) plus one day of slack, the same
      # idiom backup-offsite.yml uses for its own weekly full backup.
      # Ticket, not page: a stale Tier D means the weekly cross-check
      # hasn't run, not that the network has forked — Tier A's nightly
      # chain-link carries the page-level signal.
      #
      # absent_over_time branch (OBS-2 pattern, same as the rules above):
      # a cron entry that was never installed leaves the series absent,
      # not old; the bare `time() - x` comparison over an empty vector
      # can never fire without it.
      - alert: stellarindex_verify_archive_tier_d_run_stale
        expr: |
          (
            time()
            -
            (stellarindex_verify_archive_last_success_unix{
              tier="peers"
            } > 0)
          ) > (8 * 24 * 3600)
          or
          absent_over_time(stellarindex_verify_archive_last_success_unix{tier="peers"}[8d])
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/verify-archive.md#stellarindex_verify_archive_tier_d_run_stale
          summary: "verify-archive Tier D (multi-peer fork-detection) has recorded no success in >8d (weekly cron, Sunday)"
          description: |
            The weekly multi-peer fork-detection sweep (`-tier peers`,
            stellarindex-verify-archive-tier-d cron, Sunday 16:23 UTC) has
            not recorded a clean exit in over 8 days — one missed weekly
            cycle plus slack — or has never recorded one. Either the cron
            entry isn't installed (check verify_archive_tier_d_enabled in
            inventory — pubnet only) or every recent run failed. While
            this is stale, a genuine divergence against a peer archive
            would surface only in journald, not here.
            Diagnosis:
              - `crontab -l -u root | grep verify-archive-tier-d` — is
                the entry present?
              - `grep stellarindex-tier-d /var/log/syslog` (or journald,
                depending on syslog routing) — what did the last run log?
              - re-run by hand: `stellarindex-ops verify-archive -tier
                peers -peer-samples 50 -from <hot floor>`.

            Runbook: docs/operations/runbooks/verify-archive.md#stellarindex_verify_archive_tier_d_run_stale
