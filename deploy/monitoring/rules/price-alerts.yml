---
# Price-alert evaluator health (BACKLOG #60). The aggregator's
# price-alert evaluation sweep (internal/pricealerts) checks every
# enabled price_alerts row against the latest closed 1m VWAP each tick
# and enqueues `price.alert` customer-webhook deliveries. These alerts
# fire when the sweep can't even list the alert set — no customer price
# alerts are being evaluated. Analytics-adjacent, not an SLO: ticket
# severity.

groups:
  - name: stellarindex.price_alerts
    interval: 60s
    rules:

      # The evaluator's ListEnabledPriceAlerts read is failing more
      # often than it succeeds (Postgres unreachable / query error) for
      # 30+ min. While this holds, NO price alerts are evaluated, so
      # customers who registered alerts get no `price.alert` webhooks
      # even when their threshold is crossed. `partial_error` (a subset
      # of alerts hit a price-read / enqueue error) is deliberately NOT
      # part of this expr — it's narrower and self-heals per-alert.
      #
      # Threshold: `list_error` rate exceeds `ok` rate AND total rate is
      # non-zero (avoids firing during cold start when both are 0). Only
      # fires at all when the evaluator is enabled ([price_alerts]
      # enabled=true) — a disabled evaluator emits no series.
      - alert: stellarindex_price_alert_eval_failing
        expr: |
          sum(rate(stellarindex_price_alert_eval_total{outcome="list_error"}[5m]))
            >
          sum(rate(stellarindex_price_alert_eval_total{outcome="ok"}[5m]))
          and
          sum(rate(stellarindex_price_alert_eval_total{outcome=~"list_error|ok"}[5m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: price-alerts
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/price-alert-eval-failing.md
          summary: "Price-alert evaluator failing to list alerts (P3)"
          description: |
            More list_error outcomes than ok over the last 5 min for 30+
            min sustained. The aggregator's price-alert evaluator can't
            read the enabled price_alerts set (Postgres unreachable /
            query error), so no customer price alerts are being
            evaluated and no `price.alert` webhooks fire. Check Postgres
            reachability from the aggregator host and the aggregator's
            `price-alert evaluator: wired` startup log line, then the
            runbook.

      # GH #749: a sweep in which EVERY enabled alert errors (bad row,
      # price-read, or enqueue failure — e.g. the app role losing
      # INSERT on webhook_deliveries) still returns "ok" from the list
      # step, so it emits `partial_error`, never `list_error`. The rule
      # above only reads list_error and stays silent forever in that
      # shape ("narrower, self-heals per-alert" does not hold when it
      # is every alert, every tick). This rule reads the same counter
      # for the complementary signal: sustained sweeps that produce
      # partial_error but never a single clean ok. The `> 0` term on
      # partial_error itself is the cold-start/disabled guard — a
      # disabled evaluator emits no partial_error samples, so this
      # never fires when [price_alerts] enabled=false, without needing
      # a separate enabled gauge.
      - alert: stellarindex_price_alert_eval_no_successful_sweeps
        expr: |
          sum(rate(stellarindex_price_alert_eval_total{outcome="ok"}[5m])) == 0
          and
          sum(rate(stellarindex_price_alert_eval_total{outcome="partial_error"}[5m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: price-alerts
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/price-alert-eval-failing.md
          summary: "Price-alert evaluator has no clean sweeps — every tick hits an eval error (P3)"
          description: |
            Zero `ok` sweeps and 1+ `partial_error` sweeps/sec, sustained
            30+ min: the alert list read is succeeding but every sweep
            since has hit at least one per-alert error and none have
            gone clean. Unlike a single bad pair, this shape does not
            self-heal — check aggregator logs for `price-alert evaluate
            failed` and whether the failure (e.g. a permission error on
            webhook_deliveries) is common to every alert, then the
            runbook.

      # Companion to the two rules above (RLT-226): both read `rate()`
      # over stellarindex_price_alert_eval_total, and a counter with no
      # increments is ABSENT, not zero, so neither can ever fire while
      # the evaluator has never produced a single series — disabled by
      # config, or crashed before its first sweep. Same shape as
      # stellarindex_aggregator_supply_refresh_never_initialized
      # (configs/prometheus/rules.r1/supply-refresh.yml): ticket, not
      # page, because [price_alerts] enabled=false is the default and
      # this is expected to fire on every host that hasn't opted in —
      # the runbook's own checklist already covers that case.
      - alert: stellarindex_price_alert_eval_never_initialized
        expr: |
          absent_over_time(stellarindex_price_alert_eval_total{outcome="ok"}[36h]) == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: price-alerts
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/price-alert-eval-failing.md
          summary: "Price-alert evaluator has never recorded a successful sweep"
          description: |
            stellarindex_price_alert_eval_total{outcome="ok"} has been
            absent for 36h+. Either [price_alerts] enabled=false (the
            default — this host hasn't opted into the evaluator), or
            it's enabled but has never completed a clean sweep since
            startup. Check the aggregator's `price-alert evaluator:
            wired` startup log line and Postgres reachability, then the
            runbook.
