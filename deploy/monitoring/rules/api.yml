---
# API serving-plane alerts.
#
# Job names in this directory are UNDERSCORED (ansible-rendered scrape config); the R1 overlay at
# configs/prometheus/rules.r1/ uses HYPHENATED names matching its systemd units. Editing only one half silently breaks the other deployment shape.

groups:
  - name: stellarindex.api
    interval: 30s
    rules:

      - alert: stellarindex_api_down
        # sum() over an EMPTY vector is empty, not 0, so a target that
        # vanishes from discovery (job dropped, unit removed, DNS gone) emits
        # no `up` series and would never alert; the absent_over_time arm
        # covers that. `sum() == 0` covers scraped-but-every-pod-failing. Same
        # shape as the exporter pages in meta.yml.
        expr: |
          sum(up{job="stellarindex_api"}) == 0
          or absent_over_time(up{job="stellarindex_api"}[5m]) == 1
        for: 60s
        labels:
          severity: page
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_api_down
          summary: "Every API pod is down (SEV-1)"
          description: |
            No API instance is scrape-reachable across the fleet — or the
            API scrape target has vanished from service discovery, in which
            case the outage signal itself is blind. Both are pageable: the
            first is a full public outage with customers seeing connection
            errors, the second is an outage nobody would be told about.
            Follow the api-down runbook immediately.

      - alert: stellarindex_api_latency_p95_high
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="stellarindex_api"}[5m]))
          ) > 0.5
        # 10m (not 2m): p95 is already a 5m-windowed percentile; the long
        # `for` rides out deploy cold-cache and load bursts so only a
        # sustained slowdown fires.
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_api_latency_p95_high
          summary: "API p95 {{ $value | humanizeDuration }} > 500ms"
          description: |
            The published p95 ≤ 200 ms is enforced per endpoint by
            stellarindex_sla_probe_p95_breach; this all-route real-traffic
            backstop alarms at > 500 ms (2.5×). Typical root cause: Redis cache miss storm → Timescale
            saturation. Check Redis eviction rate + Postgres connection pool.

      - alert: stellarindex_api_latency_p99_high
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="stellarindex_api"}[5m]))
          ) > 2
        # 10m (not 2m): ride out transient tail-latency bursts (deploy cold
        # start, one-off heavy scan); fire only on a sustained p99 regression.
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_api_latency_p99_high
          summary: "API p99 {{ $value | humanizeDuration }} > 2s"
          description: |
            The published p99 ≤ 500 ms is enforced per endpoint by
            stellarindex_sla_probe_p99_breach; this all-route real-traffic
            backstop alarms at > 2 s (4×).
            Tail latency is usually a specific slow endpoint — check the
            per-endpoint breakdown.

      # The aggregator is publishing closed-bucket events and the API is
      # fanning none of them out. go-redis retries a dead pubsub silently
      # and a clock-skewed API host rejects every event, so /price/stream
      # stays 200 with keepalives only; this is the one signal of either.
      # lint-tripwire-window:sustained: the aggregator publishes every tick, so only a continuing publish-without-delivery gap should notify
      - alert: stellarindex_api_price_stream_not_delivering
        expr: |
          sum(rate(stellarindex_aggregator_stream_publish_total{outcome="ok"}[15m])) > 0
          unless on()
          sum(rate(stellarindex_api_stream_subscribe_total{outcome="ok"}[15m])) > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_api_price_stream_not_delivering
          summary: "Aggregator publishes closed-bucket events but the API fans out none (15m)"
          description: |
            /v1/price/stream subscribers are receiving keepalives only.
            Read stellarindex_api_stream_subscribe_total by outcome:
            future_observed_at means the API host clock lags the
            aggregator; no increments at all means the Redis pubsub is
            down or the subscriber is not running.

      - alert: stellarindex_api_error_rate_high
        expr: |
          sum(rate(http_requests_total{job="stellarindex_api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="stellarindex_api"}[5m])) > 0.01
        for: 2m
        labels:
          severity: ticket
          team: stellarindex
          component: api
          alert_family: api_error_rate
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_api_error_rate_high
          summary: "API 5xx rate {{ $value | humanizePercentage }}"
          description: |
            Sustained > 1 % 5xx responses. At 5 % we escalate to SEV-1 via
            the critical variant.

      - alert: stellarindex_api_error_rate_critical
        expr: |
          sum(rate(http_requests_total{job="stellarindex_api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="stellarindex_api"}[5m])) > 0.05
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: api
          alert_family: api_error_rate
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_api_error_rate_critical
          summary: "API 5xx rate {{ $value | humanizePercentage }} (SEV-1)"
          description: |
            > 5 % of requests returning 5xx. Customers are broken; declare
            SEV-1 and follow the api-5xx runbook.

      - alert: stellarindex_api_price_stale
        # The gauge is emitted at end-of-tick; under cascade the tick wedges
        # and the series goes absent, so a bare `> 120` sees no data and never
        # fires. absent_over_time() fires on 10m of absence. Same pattern as
        # aggregator_silent and the exporter-down meta-alerts.
        expr: |
          stellarindex_price_staleness_seconds > 120
          OR
          absent_over_time(stellarindex_price_staleness_seconds[10m]) == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_api_price_stale
          summary: "Price for {{ $labels.asset }} in {{ $labels.quote }} is {{ $value }}s stale"
          description: |
            The most recent aggregated price observation is older than 2 min
            (Freighter SLA is 30 s freshness; we alarm at 4× SLA). Usually
            means the source for this asset has stopped or the aggregator
            isn't writing. If the gauge is ABSENT (the absent_over_time
            branch fires alone), the aggregator is wedged — see the
            aggregator-silent runbook instead.

      # Per-(cache, op) miss rate on the in-memory cache wrappers: >50 % for
      # 10 min on a hot op means the prewarm key has drifted from what the
      # handler looks up. Ratio, not count: a low-traffic cache missing 100 %
      # is fine, a hot one missing 50 % is phantom-key drift.
      #
      # Denominator is the READ outcomes (hit|miss|stale) only: a bounded
      # cache under key enumeration emits one `evicted` per `miss`, capping
      # miss/(miss+evicted) at 0.5. `*_redis` caches are excluded: the
      # in-memory layer in front asks every 2 min against a 60 s Redis TTL, so
      # they miss by design.
      - alert: stellarindex_api_cache_miss_rate_high
        expr: |
          (
            sum by (cache, op) (rate(stellarindex_api_cache_ops_total{cache!~".*_redis",result="miss"}[5m]))
            /
            sum by (cache, op) (rate(stellarindex_api_cache_ops_total{cache!~".*_redis",result=~"hit|miss|stale"}[5m]))
          ) > 0.5
          and
          sum by (cache, op) (rate(stellarindex_api_cache_ops_total{cache!~".*_redis",result=~"hit|miss|stale"}[5m])) > 0.1
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_api_cache_miss_rate_high
          summary: "API cache {{ $labels.cache }}/{{ $labels.op }} miss rate {{ $value | humanizePercentage }}"
          description: |
            Sustained > 50 % miss rate on the v1.Cached* wrapper for
            {{ $labels.cache }}/{{ $labels.op }}. The prewarm goroutine
            should keep hot ops > 90 % hit. Likely cause: the prewarm
            is calling the cached reader with a slightly-different
            argument tuple than the handler does (see
            cmd/stellarindex-api/main.go prewarmCaches + the cached
            wrappers at internal/api/v1/markets_cache.go and
            asset_catalogue_cache.go). Cache key is a
            stringified tuple of all args; one drifted dimension
            (Order, Sources, Limit, …) means a phantom warmed slot.
            Follow the cache-miss-rate-high runbook.

      # SWR wrappers keep serving the last good row while a refresh fails
      # (clients only see `flags.stale`); this is the operator signal.
      # increase()>0 held 30m means every 15m window had a failure:
      # persistent, not a blip.
      - alert: stellarindex_api_cache_refresh_failing
        expr: |
          sum by (cache, op) (increase(stellarindex_api_cache_ops_total{result="refresh_error"}[15m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_api_cache_refresh_failing
          summary: "API cache {{ $labels.cache }}/{{ $labels.op }} background refresh failing"
          description: |
            The background refresh for {{ $labels.cache }}/{{ $labels.op }}
            has failed in every 15 min window for 30 min. Callers are being
            served the last good value with flags.stale set, and it keeps
            ageing. Check the API logs for the refresh error and the
            upstream store (Postgres / ClickHouse) for that op.
            See the cache-miss-rate-high runbook, "Refresh failures".

      # Customer-webhook delivery failures (5xx, network_error, exhausted) by
      # attempt outcome.
      #
      # Threshold: one endpoint's rows are delivered serially under a 10s
      # attempt timeout, so a black-holing endpoint yields at most 0.1
      # failures/s and `> 0.1` could never fire. 0.05 fires once that lane is
      # half saturated; customerwebhook's
      # TestDeliveryFailingAlertBelowSingleLaneCeiling pins the bound.
      - alert: stellarindex_customer_webhook_delivery_failing
        expr: |
          sum(rate(stellarindex_customer_webhook_delivery_attempts_total{outcome=~"server_error|network_error"}[5m])) > 0.05
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_customer_webhook_delivery_failing
          summary: "Customer webhook delivery failing at {{ printf \"%.2f\" $value }}/s"
          description: |
            The customer-webhook delivery worker has been failing
            (5xx + network errors) at > 0.05 attempts/s for 15+ min.
            One customer's endpoint is likely sustained-down.
            Query `webhook_deliveries` to find the failing webhook:
            `SELECT webhook_id, COUNT(*) FROM webhook_deliveries
             WHERE last_response_status >= 500
               AND created_at > now() - interval '15 min'
             GROUP BY webhook_id ORDER BY 2 DESC LIMIT 10`.

      # The API folds Redis per-endpoint usage counters into usage_daily every
      # 5 min. Failure only stales the dashboard usage page; pricing is
      # unaffected and the counters (35-day TTL) keep accumulating, so short
      # outages lose nothing.
      - alert: stellarindex_usage_rollup_failing
        expr: |
          sum(rate(stellarindex_usage_rollup_sweeps_total{outcome=~"scan_error|sink_error"}[15m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_usage_rollup_failing
          summary: "Usage-rollup sweeps failing ({{ $value | humanize }}/s error rate)"
          description: |
            The API binary's usage-rollup worker has been failing its
            5-minute sweeps (Redis scan or Timescale upsert) for 30+
            minutes. Dashboard per-endpoint usage analytics stop
            advancing; /v1/account/usage degrades to endpoint-less
            legacy rows. Counters are safe in Redis for 35 days — fix
            the failing backend and the worker re-folds every day it
            missed, oldest first, 7 days per sweep. Days older than 35
            days are lost.

      # No `for:` equal to the rate() window: after ONE exhausted delivery the
      # expr is true for exactly 1h, so a 1h pending period could never
      # complete. An exhausted delivery already ended ~8h of retries, so there
      # is no transient to filter. No born-inside-the-window arm: outcome
      # children are pre-seeded at 0 (obs.seedBoundedLabelSeries), so the
      # first exhaustion is a 0 -> 1 step rate() sees.
      # Pinned by rule-tests/tripwire-isolated-increment{,-r1}_test.yml.
      - alert: stellarindex_customer_webhook_delivery_exhausted
        expr: |
          sum(rate(stellarindex_customer_webhook_delivery_attempts_total{outcome="exhausted"}[1h])) > 0
          or sum (
            stellarindex_customer_webhook_delivery_attempts_total{outcome="exhausted"}
            unless max_over_time(stellarindex_customer_webhook_delivery_attempts_total{outcome="exhausted"}[1d] offset 1h)
          ) > 0 and on() (time() - prometheus_tsdb_lowest_timestamp_seconds > 90000)
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_customer_webhook_delivery_exhausted
          summary: "Customer webhook deliveries permanently failed (budget exhausted)"
          description: |
            A delivery hit the 15-attempt retry budget (~8h) and
            was marked terminally failed. Customer hasn't received
            the event. Operator should reach out before the
            customer notices via their own monitoring.

      # `mark_error`: the worker completed a POST but failed to RECORD it, so
      # the row re-POSTs in a loop (markTerminal's godoc promises this alert).
      #
      # Separate from `…_delivery_failing`: that rule's > 0.05/s describes an
      # endpoint failing under load; one wedged row re-POSTing on its 5-minute
      # claim lease is ~0.003/s, fifteen times below it.
      #
      # [30m] against `for: 15m` so one step stays true longer than the
      # pending period; the label set is pre-seeded, so increase() reads a
      # real zero before the first occurrence.
      - alert: stellarindex_customer_webhook_mark_errors
        expr: |
          increase(stellarindex_customer_webhook_delivery_attempts_total{outcome="mark_error"}[30m]) > 0
          or (
            stellarindex_customer_webhook_delivery_attempts_total{outcome="mark_error"}
            unless max_over_time(stellarindex_customer_webhook_delivery_attempts_total{outcome="mark_error"}[1d] offset 30m)
          ) > 0 and on() (time() - prometheus_tsdb_lowest_timestamp_seconds > 88200)
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_customer_webhook_mark_errors
          summary: "Customer-webhook delivery outcomes are not being recorded — deliveries are looping"
          description: |
            stellarindex_customer_webhook_delivery_attempts_total{outcome="mark_error"}
            advanced in the last 30 minutes. The delivery worker
            completed a POST and then failed to write the result
            (MarkDelivered / MarkAttemptFailed). The row keeps the
            5-minute claim lease ListPendingDeliveries set and
            attempt_count does not advance, so the SAME payload is
            re-POSTed to the customer every lease interval until the
            write succeeds — a duplicate-delivery loop with no retry
            budget to end it. Check Postgres health first.

      # Caddy auto-renews 30 days before expiry; this catches stuck renewal
      # (rate limit, DNS, ACME quota). The self-probe dials each host every 6
      # h and emits leaf NotAfter; <14 days leaves a fortnight to renew
      # manually.
      #
      # The prober (internal/api/v1/tls_probe.go) can wedge, leaving the
      # series absent; a bare threshold sees no data and never fires (same
      # shape as stellarindex_api_price_stale), so absent_over_time() surfaces
      # a missing prober.
      - alert: stellarindex_tls_cert_expiring_soon
        expr: |
          (
            stellarindex_tls_cert_not_after_unix - time() < 14 * 24 * 3600
            and stellarindex_tls_cert_not_after_unix > 0
          )
          or absent_over_time(stellarindex_tls_cert_not_after_unix[1h]) == 1
          or (
            sum by (host) (increase(stellarindex_tls_cert_probe_total{outcome!="ok"}[13h])) > 0
            unless on (host)
            sum by (host) (increase(stellarindex_tls_cert_probe_total{outcome="ok"}[13h])) > 0
          )
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_tls_cert_expiring_soon
          summary: "TLS cert for {{ $labels.host }} expires in <14 days"
          description: |
            The leaf certificate for {{ $labels.host }} expires at
            {{ $value | humanizeTimestamp }}. Caddy's Let's Encrypt
            auto-renewal normally triggers 30 days before expiry;
            this alert firing means the renewal hasn't happened
            (rate limit, DNS issue, ACME quota, Caddy stuck). If the
            gauge is ABSENT (the absent_over_time branch fires alone),
            the TLS prober itself is down — check it before assuming
            the cert is fine. If the probe-outcome arm fires, the host
            had failed probes and no successful one in 13 h (unreachable,
            or a cert failing verification: wrong name, broken chain,
            expired) and the value is a failure count, not a timestamp —
            read stellarindex_tls_cert_probe_total{host} by outcome.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_tls_cert_expiring_soon

      # stellarindex_ratelimit_fail_open_total
      # (internal/api/v1/middleware/ratelimit.go). The limiter fails OPEN on a
      # Redis error so a cache outage can't take the API down, which silently
      # turns the abuse control OFF; this counter is the only trace.
      #
      # A count over a wide window, not `rate(...[5m]) > 0 for: 10m`, which
      # can NEVER fire: fail-open is capped at ratelimit.DefaultDwellTime
      # (30s), after which it fails CLOSED (see
      # stellarindex_ratelimit_fail_closed) and the counter goes flat. >100
      # bypassed requests in 15m tickets regardless of how the dwell time
      # chops the rate.
      - alert: stellarindex_ratelimit_fail_open
        expr: sum(increase(stellarindex_ratelimit_fail_open_total[15m])) > 100
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_ratelimit_fail_open
          summary: "Rate limiting FAILED OPEN {{ $value | humanize }} times in 15m"
          description: |
            The API rate limiter could not reach its Redis backing store
            and let more than 100 requests through unlimited in the last
            15 minutes. Per-key quotas, burst protection and the abuse
            ceiling are intermittently inert: a single caller can
            saturate the serving plane, and metered usage still records
            (billing is unaffected) while the throughput cap is not
            always enforced.

            Check the Redis readyz probe first — this normally moves
            together with it. If Redis is healthy, the failure is in the
            limiter's own path (auth, evicted script, key namespace).

      # Companion to the fail-open alert above: past the same dwell
      # time (ratelimit.DefaultDwellTime, 30s) of continuous Redis
      # errors, the limiter flips from failing open to failing CLOSED —
      # every request in the affected bucket gets a 503
      # (errors/throttle-unavailable, Retry-After: 30) instead of being
      # served. That is the whole API down for anyone hitting a
      # rate-limited path, not a narrowed surface (one such state on r1
      # lasted 2h53m and served 2.03M 503s).
      # `for: 2m`, not 10m — a fail-closed window is an ongoing outage
      # from the first second, not a tolerable blip.
      - alert: stellarindex_ratelimit_fail_closed
        expr: |
          sum(rate(stellarindex_ratelimit_fail_closed_total[5m])) > 0
          or sum (
            stellarindex_ratelimit_fail_closed_total
            unless max_over_time(stellarindex_ratelimit_fail_closed_total[1d] offset 5m)
          ) > 0 and on() (time() - prometheus_tsdb_lowest_timestamp_seconds > 86700)
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_ratelimit_fail_closed
          summary: "Rate limiting is FAILING CLOSED — the API is 503ing rate-limited requests"
          description: |
            The rate limiter's Redis calls have been failing longer than
            the fail-open dwell time, so it has flipped to failing
            CLOSED: every request in the affected bucket now gets a 503
            (errors/throttle-unavailable) instead of being served. This
            is outright customer-visible API unavailability, not a
            throttling side-effect — the 2026-09-16 incident held this
            state for 2h53m and served 2.03M 503s. Clears once Redis has
            answered without error for the same dwell time.

      # The monthly-quota middleware fails OPEN on a backing-store error (the
      # cap is billing fairness, not a security boundary, so a Redis blip must
      # not 429 paying customers). Revenue-side twin of
      # stellarindex_ratelimit_fail_open, shaped identically, but the exposure
      # is MONEY: while open, a metered key bills past its cap and the overage
      # cannot be reclaimed.
      - alert: stellarindex_monthly_quota_fail_open
        expr: sum(rate(stellarindex_monthly_quota_fail_open_total[5m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_monthly_quota_fail_open
          summary: "Monthly quota ceiling is FAILING OPEN ({{ $value | humanize }} req/s bypassing the cap)"
          description: |
            The per-key monthly request quota could not be read from its
            backing store and the requests were served anyway, continuously
            for the last 10 minutes. Every metered key is currently
            uncapped: usage still meters (so the customer is still billed)
            but the agreed ceiling is not enforced, and any overage served
            in this window is unrecoverable.

            Normally moves together with the Redis readyz probe and with
            stellarindex_ratelimit_fail_open — the two share a backing
            store. If this fires ALONE, suspect the usage-counter key
            namespace or an eviction policy rather than Redis availability.

      # Companion to the fail-open alert above: past the same dwell time
      # (DefaultMonthlyQuotaDwellTime, 30s) the gate fails CLOSED and 429s
      # metered keys instead, so the fail-open counter goes flat and only
      # this counter moves for a sustained outage.
      - alert: stellarindex_monthly_quota_fail_closed
        expr: |
          sum(rate(stellarindex_monthly_quota_fail_closed_total[5m])) > 0
          or sum (
            stellarindex_monthly_quota_fail_closed_total
            unless max_over_time(stellarindex_monthly_quota_fail_closed_total[1d] offset 5m)
          ) > 0 and on() (time() - prometheus_tsdb_lowest_timestamp_seconds > 86700)
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_monthly_quota_fail_closed
          summary: "Monthly quota is FAILING CLOSED — metered keys are being 429'd"
          description: |
            The month-to-date usage counter has been unreadable for longer
            than the fail-open dwell time, so the monthly-quota gate has
            flipped to failing CLOSED: every request from a key with a
            monthly cap now gets a 429 (errors/monthly-quota-unavailable)
            whether or not the key is anywhere near its cap. Paying
            customers are denied service until the counter answers
            without error for the same dwell time.

      # Write-side twin of stellarindex_monthly_quota_fail_open: that fires
      # when the READ of the counter fails; this fires when the WRITE fails
      # (stellarindex_usage_units_dropped_total, by counter billable|detail),
      # so MonthToDate reads a real zero and the quota gate sees nothing. A
      # failed Increment logs only at Debug, so a wedged Redis pipeline, ACL
      # change or key-namespace typo uncaps every metered key silently.
      - alert: stellarindex_usage_write_failing
        expr: sum(rate(stellarindex_usage_units_dropped_total{counter="billable"}[5m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_usage_write_failing
          summary: "Usage-counter writes are failing ({{ $value | humanize }} billable units/s dropped)"
          description: |
            The API served requests it could not meter: writes to the
            billable usage counter have been failing continuously for the
            last 10 minutes. Every dropped unit is unmetered — MonthToDate
            reads a real Redis zero, not an error, so MonthlyQuota sees a
            healthy read and never fails open; there is no other signal
            that the ceiling has gone uncapped.

            Does NOT move with stellarindex_monthly_quota_fail_open — that
            fires on a failed READ, this fires on a failed WRITE, and they
            are mutually exclusive per request. Check Redis health and the
            usage-counter key namespace first.

      # UsageTracker/TouchUsage bookkeeping runs on the shared
      # middleware.AfterResponse pool, off the request goroutine; a saturated
      # pool drops the task, silent unless watched.
      - alert: stellarindex_after_response_tasks_dropping
        expr: sum(rate(stellarindex_after_response_tasks_dropped_total[5m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_after_response_tasks_dropping
          summary: "After-response bookkeeping tasks are being dropped ({{ $value | humanize }}/s)"
          description: |
            The shared after-response worker pool (usage-counter writes,
            TouchUsage last-seen updates) has been dropping tasks for the
            last 10 minutes because its queue was full. Each drop silently
            loses one usage row or one last-seen touch; the client response
            itself is unaffected. Sustained saturation usually means a slow
            downstream store (Redis/Postgres) or a genuine traffic spike.

      # The scam-pricing gate fails OPEN on an account_directory lookup error
      # (closed would blank every price on a DB blip), so while open every
      # directory-flagged issuer is priced at 200 on every gated surface.
      # lint-tripwire-window:sustained: a continuing fail-open window is actionable, one failover blip is not
      - alert: stellarindex_scam_gate_fail_open
        expr: |
          sum by (surface) (rate(stellarindex_scam_gate_lookup_failures_total[5m])) > 0
          or sum by (surface) (
            stellarindex_scam_gate_lookup_failures_total
            unless max_over_time(stellarindex_scam_gate_lookup_failures_total[1d] offset 5m)
          ) > 0 and on() (time() - prometheus_tsdb_lowest_timestamp_seconds > 86700)
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_scam_gate_fail_open
          summary: "Scam-pricing gate is FAILING OPEN on {{ $labels.surface }} ({{ $value | humanize }} lookups/s serving unguarded)"
          description: |
            The scam-pricing gate could not read account_directory and
            served the price unguarded, continuously for the last 5
            minutes. Directory-flagged issuers are being priced on this
            surface for the duration.

            Check the Postgres readyz probe first. If Postgres is healthy,
            look for lock contention from directory-sync or pool
            exhaustion in the gate's WARN line.

      # Each scam-class tag directory-sync clears re-publishes that issuer's
      # price, so each un-flag is reviewed; the churn ceiling only bounds how
      # many one run may clear. The textfile gauge holds the last committed
      # run's count until the next daily run.
      - alert: stellarindex_directory_sync_unflagged
        expr: max by (instance, source) (stellarindex_directory_sync_rows_changed{kind="unflagged"}) > 0
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_directory_sync_unflagged
          summary: "directory-sync cleared {{ $value }} scam-class tag(s) from {{ $labels.source }} — those issuers are priced again"
          description: |
            The most recent committed directory-sync un-flagged
            {{ $value }} address(es) of source {{ $labels.source }}: a
            scam-class tag was removed upstream or the row was pruned,
            so the scam-pricing gate no longer withholds their prices.
            Confirm each un-flag against the upstream change. If one is
            not a genuine upstream correction, pin directory-sync to the
            last good upstream commit (-url + -sha256) and re-run it.

      # Admin-surface audit rows are appended best-effort after the mutation
      # commits, so a failure leaves an account tier, API credential or status
      # notice changed with NO durable record; the only other trace is one
      # `logger.Warn`.
      #
      # increase() over 1h with for: 5m, not rate()>0: events are rare and
      # bursty, and the response (reconstruct rows from application logs
      # before retention closes) is worth a ticket for ONE occurrence.
      # `surface` is preserved so the ticket names the mutation class.
      - alert: stellarindex_admin_audit_write_failing
        expr: |
          sum by (surface) (increase(stellarindex_admin_audit_write_failures_total[1h])) > 0
          or sum by (surface) (
            stellarindex_admin_audit_write_failures_total
            unless max_over_time(stellarindex_admin_audit_write_failures_total[1d] offset 1h)
          ) > 0 and on() (time() - prometheus_tsdb_lowest_timestamp_seconds > 90000)
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_admin_audit_write_failing
          summary: "Admin audit trail has holes: {{ $value | humanize }} lost row(s) on {{ $labels.surface }}"
          description: |
            A privileged mutation on the `{{ $labels.surface }}` surface
            COMPLETED but its durable audit row did not land. The change is
            live — a tier override, a minted or revoked credential, a public
            status notice — with no record of the actor, the reason, or
            the previous values.

            This is a compliance/forensics gap, not an availability one: do
            NOT roll anything back. Recover the missing rows from the API's
            application logs (each site logs `… audit append failed
            (best-effort)` with the target id) BEFORE the log retention
            window closes on them, then fix whatever made the audit store
            unwritable.

      # A passkey assertion verified but its sign counter went BACKWARDS: at
      # least two copies of the private key exist. Sign-in is already refused;
      # this tickets a human to contact the owner. increase() over 1h with
      # for: 5m, as above.
      - alert: stellarindex_passkey_clone_warning
        expr: |
          sum(increase(stellarindex_passkey_login_refusals_total{reason="clone_warning"}[1h])) > 0
          or sum (
            stellarindex_passkey_login_refusals_total{reason="clone_warning"}
            unless max_over_time(stellarindex_passkey_login_refusals_total{reason="clone_warning"}[1d] offset 1h)
          ) > 0 and on() (time() - prometheus_tsdb_lowest_timestamp_seconds > 90000)
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_passkey_clone_warning
          summary: "Passkey clone warning: {{ $value | humanize }} sign-in(s) refused on a sign-counter regression"
          description: |
            A passkey sign-in presented a valid signature with a sign
            counter at or below the stored one — WebAuthn's signal that the
            credential's private key has been copied. The sign-in was
            refused. The `passkey.clone_warning` rows in audit_log name the
            account and credential; contact the owner and have them remove
            that passkey.

      # The failed-auth throttle caps each client IP and API-key prefix at
      # failed_auth_rate_limit_per_min (20/min), so guessing spread over many
      # of both never 429s; this fleet-wide rate is the only place that shows.
      # Counts outcome="rejected" only (throttled attempts are already
      # capped); the per-IP cap holds one source to 0.33/s, so >1/s for 15m
      # needs more than three sources at their cap, or many under it.
      - alert: stellarindex_failed_auth_rate_high
        expr: sum(rate(stellarindex_failed_auth_total{outcome="rejected"}[5m])) > 1
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_failed_auth_rate_high
          summary: "Credentials rejected at {{ $value | humanize }}/s fleet-wide for 15 minutes"
          description: |
            The API has been rejecting presented credentials at more than
            one per second, summed across every instance, for 15 minutes.
            The per-IP and per-key-prefix failed-auth throttles only see
            their own bucket; this total catches credential guessing spread
            thinly enough to stay under both. Group the access log's 401s
            by remote_ip to tell a handful of capped sources from a
            distributed guess.

      # The durable login-code lockout table is written by an UNAUTHENTICATED
      # endpoint under an ATTACKER-CHOSEN key (POST /v1/auth/verify-code with
      # a synthetic address); no sign-in clears the row, so it is a cheap
      # remote table-fill on a disk-fixed host.
      #
      # Two arms, one alert (the response starts the same way: look at the
      # table):
      #
      #   rows         - the retention sweep is not keeping up, or the table fills faster
      #                  than 48h retention drains it. Healthy sits in the low tens.
      #   status_check - the pre-match read is FAILING OPEN; responses look healthy, so
      #                  this counter is the only evidence. Typically migration 0122
      #                  lagging a node.
      #
      # `register` and `sweep` failures are deliberately NOT alerted: a lost
      # guess-count is bounded harm, and sweep failure shows here as rows
      # climbing.
      - alert: stellarindex_login_code_lockout_table_growing
        expr: |
          stellarindex_login_code_lockout_rows > 10000
          or
          increase(stellarindex_login_code_lockout_errors_total{op="status_check"}[1h]) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_login_code_lockout_table_growing
          summary: "login_code_lockouts is growing or its check is failing open ({{ $value | humanize }})"
          description: |
            Either `login_code_lockouts` has exceeded 10k rows — a table
            whose key an unauthenticated caller chooses, so sustained
            growth is a remote fill rather than user behaviour — or the
            lockout's pre-match read has been failing open, which means
            the brute-force bound on the 6-digit email code is not being
            enforced at all while sign-in looks perfectly healthy.

            Neither is an outage. Both are silent: the fill ends at a
            disk-full page that names the wrong subsystem, and the
            fail-open ends at an account takeover with no trace.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_login_code_lockout_table_growing

      # magic_link_tokens is keyed on an address an unauthenticated caller
      # chooses, so sustained growth is a remote table-fill. Same bound as
      # login_code_lockout_table_growing; the reaper-stalled alert cannot
      # see growth while the reaper is alive but outpaced.
      - alert: stellarindex_magic_link_token_table_growing
        expr: stellarindex_magic_link_token_rows > 10000
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_magic_link_token_table_growing
          summary: "magic_link_tokens has {{ $value | humanize }} rows (bound 10000)"
          description: |
            `magic_link_tokens` has stayed above 10k rows for 30+ minutes.
            The key is attacker-chosen and POST /v1/auth/login is
            unauthenticated, so sustained growth is a remote fill of a table
            holding email and requested_ip. The retention sweep is the only
            bound; it is either outpaced or failing.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_magic_link_token_table_growing

      # Auth-reaper liveness: other metrics say WHAT the reapers did; this
      # says THAT they ran. A dead reaper freezes every rows gauge at a
      # healthy-looking value, so login_code_lockout_table_growing can never
      # see the bound lost. Threshold is 3 x each reaper's configured
      # interval. A DISABLED reaper publishes no series and never alerts:
      # absence is config, not death.
      - alert: stellarindex_auth_reaper_stalled
        expr: |
          (time() - stellarindex_auth_reaper_last_sweep_unix)
            > 3 * stellarindex_auth_reaper_interval_seconds
          or
          (stellarindex_auth_reaper_interval_seconds > 0
            unless stellarindex_auth_reaper_last_sweep_unix)
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_auth_reaper_stalled
          summary: "{{ $labels.reaper }} auth reaper has not completed a sweep for {{ $value | humanizeDuration }}"
          description: |
            The {{ $labels.reaper }} reaper in the API binary last completed
            a sweep {{ $value | humanizeDuration }} ago — more than three
            times its configured interval. Its bounded table
            (login_code_lockouts / magic_link_tokens / speculative
            accounts / ended sessions / webhook_deliveries) is no longer being trimmed; the rows gauge it
            normally refreshes is FROZEN, not healthy. Check the API
            binary's log for the reaper's "sweep failed" / panic lines and
            whether the goroutine is stuck on a Postgres call.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_auth_reaper_stalled

      # The DEX TVL refresher recomputes per-protocol TVL every 10 min; a
      # failed protocol keeps its previous entry, so /v1/protocols and /tvl
      # LOOK healthy while the figure ages. Isolated errors during lake merges
      # self-heal.
      - alert: stellarindex_dex_tvl_refresh_failing
        expr: |
          sum(rate(stellarindex_dex_tvl_refresh_total{outcome="error"}[15m])) > 0
            and
          sum(rate(stellarindex_dex_tvl_refresh_total{outcome="ok"}[15m])) == 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_dex_tvl_refresh_failing
          summary: "DEX TVL snapshot refresher failing — TVL figures aging silently"
          description: |
            Every DEX TVL refresh in the last 15 min errored, sustained
            30+ min, with zero successes interleaved. The served TVL on
            /v1/protocols and the per-protocol pages is a carried-forward
            snapshot growing stale behind an honest-looking page. Usual
            causes: lake reserve reads failing (ClickHouse down / part
            churn) or the served-tier prices_1m reads failing.

      # /v1/protocols `tvl_total` DROPS a per-protocol figure whose claims
      # fail (named in `excluded`): honest but narrower, with no 5xx or stale
      # flag, and the sibling refresh alert can't fire while OTHER protocols
      # succeed. Sustained `divergent` with zero `ok` means the total
      # understates a whole protocol (or is ABSENT). Window is three refresh
      # cycles; the 1h `for:` needs six more, so a merge-window blip cannot
      # fire it.
      - alert: stellarindex_dex_tvl_total_divergent
        expr: |
          sum(rate(stellarindex_dex_tvl_reconcile_total{outcome="divergent"}[30m])) > 0
            and
          sum(rate(stellarindex_dex_tvl_reconcile_total{outcome="ok"}[30m])) == 0
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_dex_tvl_total_divergent
          summary: "DEX TVL headline total is refusing a protocol — the published figure understates"
          description: |
            Every DEX TVL reconciliation in the last 30 min refused at
            least one protocol, sustained 1h+, with zero clean cycles
            interleaved. The `tvl_total` served on /v1/protocols (and the
            explorer's headline) excludes that protocol and names it in
            `excluded`; if NOTHING was admitted, `tvl_total` is omitted
            entirely and the explorer shows no headline. Usual cause is a
            single protocol's reserve read failing every cycle, so its
            figure is carried forward and cannot be published under this
            snapshot's as_of. Read `excluded[].reason` on /v1/protocols
            first — it names the protocol and the rule it failed.

      # In-process SDEX order book behind /v1/sdex/orderbook. load_error
      # repeating = stuck on its 503 warming problem; advance_error = served
      # book drifting from the live ledger under an ever-older honest
      # timestamp; verify_error = version-tie quarantine never drains, so its
      # offers stay withheld.
      - alert: stellarindex_sdex_orderbook_maintain_failing
        expr: |
          sum(rate(stellarindex_sdex_orderbook_maintain_total{outcome=~"load_error|advance_error|verify_error"}[15m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_sdex_orderbook_maintain_failing
          summary: "SDEX order-book maintenance failing (load, advance or verify errors 30+ min)"
          description: |
            The live order book's lake reads (initial load, the 60s
            incremental advance, or the quarantine removal probe) have
            been failing for 30+ minutes. If load_error:
            /v1/sdex/orderbook is serving 503 warming problems. If
            advance_error: the book serves increasingly stale depth with
            an honest as_of_ledger. If verify_error: quarantined offers
            stay withheld (ask_offers_withheld / bid_offers_withheld
            non-zero) and stellarindex_sdex_orderbook_pending_offers
            stops draining. Check ClickHouse health and the
            ledger_entry_changes partition layout first.

      # maintain_failing only fires on ERROR outcomes; advance_held
      # (internal/api/v1/sdex_orderbook.go) is the same staleness without an
      # error: OfferChangesSince returns cleanly with next==cursor while held
      # below an unhealed lake hole, so as_of_ledger stops advancing with
      # nothing else to page on.
      - alert: stellarindex_sdex_orderbook_advance_held
        expr: |
          sum(rate(stellarindex_sdex_orderbook_maintain_total{outcome="advance_held"}[15m])) > 0
          unless sum(rate(stellarindex_sdex_orderbook_maintain_total{outcome="advance_ok"}[15m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_sdex_orderbook_advance_held
          summary: "SDEX order-book cursor held below a lake hole for 30+ min (no errors, still stale)"
          description: |
            The order book's 60s Advance tick has made ZERO cursor progress
            for 30+ minutes without ever erroring — an unhealed
            ledger_entry_changes hole (or a broader ingest halt) is holding
            it, per the "advance held below a lake hole" log line.
            /v1/sdex/orderbook keeps answering with an honest but frozen
            as_of_ledger; maintain_failing stays silent throughout because
            nothing here is an error. Check ch-live-catchup and the lake's
            contiguity around the held cursor first.

      # A failed daily re-load retries once an hour (SDEXOrderBookReloadRetry)
      # while the old book keeps serving, so its load_error is too sparse for
      # maintain_failing's rate()[15m] + for: 30m to ever hold. The 3h window
      # outlasts the widest gap between two failed attempts (1h retry + the 30m
      # load timeout); for: 2h lets the next retry heal a single failure.
      - alert: stellarindex_sdex_orderbook_reload_failing
        expr: |
          sum by (instance) (increase(stellarindex_sdex_orderbook_maintain_total{outcome="load_error"}[3h])) > 0
          unless sum by (instance) (increase(stellarindex_sdex_orderbook_maintain_total{outcome="load_ok"}[3h])) > 0
        for: 2h
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_sdex_orderbook_reload_failing
          summary: "SDEX order-book full load failing with no success for 2+ hours on {{ $labels.instance }}"
          description: |
            Every full-book load attempt on this instance for 2+ hours
            has failed and none has succeeded. After the first load this
            is the daily self-heal re-load, retried hourly: the old book
            keeps serving and advancing, but changes that landed below
            its cursor stay wrong until a re-load lands, and
            maintain_failing cannot see errors this sparse. Check
            ClickHouse health and the load's duration against its 30m
            timeout first.

      # Invariant: a resting Stellar book never has best bid > best ask, so a
      # crossed SERVED pair is a phantom offer (a residual zombie the lake
      # never saw removed; verification can't disprove it, the daily re-load
      # does). The gauge only logs on change, so without this it pages nobody.
      - alert: stellarindex_sdex_orderbook_crossed_book
        expr: |
          max(stellarindex_sdex_orderbook_crossed_pairs) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_sdex_orderbook_crossed_book
          summary: "SDEX order book serving {{ $value }} crossed pair(s) for 30+ min"
          description: |
            The served /v1/sdex/orderbook book has at least one asset
            pair whose best bid is strictly above its best ask, which a
            resting on-chain book cannot be. Phantom offers are being
            served on that pair. The API logs the pair ids on the
            "sdex order book crossed-pair count changed" line; chase the
            missing removal as a ledger_entry_changes coverage gap.

      # Explorer reader lake-schema probes: an "absent" answer from a process
      # that never saw the object latches until restart, so an API started
      # before the lake DDL serves that surface from the slow fallback (or
      # 503s) indefinitely. Per instance, not aggregated: the latch is per
      # process. The gauge moves only on an ANSWER (a lake outage leaves it
      # alone); for: 30m rides out an empty table being repopulated.
      - alert: stellarindex_ch_schema_probe_absent
        expr: stellarindex_ch_schema_probe_present == 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_ch_schema_probe_absent
          summary: "Explorer lake object {{ $labels.probe }} absent or empty on {{ $labels.instance }} for 30+ min"
          description: |
            The API's last answer from ClickHouse for the `{{ $labels.probe }}`
            probe was "absent" or "empty", and it has held for 30 minutes.
            The explorer is serving that surface from its fallback path
            (slower scans) or 503ing it. If the object now exists and
            holds rows, the verdict latched before the DDL landed and the
            API must be restarted to pick it up.
      # A read whose table or column is missing answers empty, which a page shows as "no activity". Any such read tickets:
      # the schema probes cover only the tables they probe.
      - alert: stellarindex_explorer_schema_absent_empty
        expr: |
          sum by (table) (increase(stellarindex_explorer_schema_absent_empty_total[1h])) > 0
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_explorer_schema_absent_empty
          summary: "Explorer reads of stellar.{{ $labels.table }} answered empty because the table is missing"
          description: |
            An explorer read of stellar.{{ $labels.table }} got a
            missing-table or missing-column answer from ClickHouse in
            the last hour and was served as an empty result. Pages
            built on it (entry changes, trustline history,
            sponsorships) show "nothing" instead of the truth until
            the table is created and backfilled.
      # A page read whose bounded window cannot prove a full page re-runs as the exact O(history) query: correct, but the slow path
      # the window exists to avoid. Sustained fallbacks mean un-merged duplicates are piling up on that read's table.
      - alert: stellarindex_explorer_exact_fallback_sustained
        expr: |
          sum by (read) (rate(stellarindex_explorer_exact_fallback_total[30m])) > 0.05
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_explorer_exact_fallback_sustained
          summary: "Explorer {{ $labels.read }} reads fall back to the exact query {{ printf \"%.2f\" $value }}/s for 1h"
          description: |
            More than 3 per minute of the explorer's {{ $labels.read }}
            page reads could not prove a full page from their bounded
            window and re-ran as the exact LIMIT 1 BY / dedup query,
            which reads the account's or contract's whole history.
            Pages stay correct but slow. The usual cause is un-merged
            ReplacingMergeTree duplicates on that read's table.
      # A derived index with no completeness watermark leaves every fast path gated on it serving its fallback (a scan,
      # or a lower bound): the G6 rule is that this pages rather than degrading quietly.
      - alert: stellarindex_derived_index_watermark_missing
        expr: |
          min by (index) (stellarindex_derived_index_watermark_ledger) == 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
