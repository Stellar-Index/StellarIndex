---
# ADR-0016 hashdb drift detector (internal/hashdb). Off by default
# ([hashdb].enabled=false); once an operator opts a region in, the
# indexer appends sha256(LCM) per ledger on its live ingest loop and
# periodically re-reads a trailing window from the same bucket to
# compare. Metrics are declared in internal/obs/metrics.go; the counters
# are registered and the append/verify outcome series seeded at 0 in
# every process, so they exist on a region that hasn't opted in but
# stay at zero. The rate()/increase() alerts below stay quiet on such a
# region because their numerators are zero, not because the series are
# missing.
#
# Alert family:
#
#   - `stellarindex_hashdb_drift_detected` — the alert this detector
#     exists to produce. `stellarindex_hashdb_drift_total` is a
#     monotonic counter of drifted ledgers found across every verify
#     sweep since the indexer process started; any nonzero value
#     means upstream history was rewritten (a previously-fetched
#     ledger's bytes changed under us) or the copy we're reading now
#     is locally corrupted. Ticket severity, not page: this is a
#     brand-new, first-production-exposure detector (2026-07-08
#     sign-off) and a standing data-integrity concern rather than a
#     customer-facing outage — but it needs prompt, deliberate
#     investigation, not a 2am wake-up on an unproven signal.
#
#   - `stellarindex_hashdb_verify_failing` — "is the detector alive"
#     companion, same shape as signup-reaper's failing alert: more
#     error-outcome sweeps than ok-outcome sweeps over a multi-sweep
#     window means the periodic verifier itself is broken (bucket
#     unreachable, hashdb file I/O error), which is a DIFFERENT
#     failure mode than "found drift" — the detector going blind
#     rather than the detector finding something.
#
#   - `stellarindex_hashdb_verify_stale` — the "detector went idle"
#     companion (T132): `verify_failing` above is rate()-based and
#     reads as green whenever hashDBVerifySweep takes an early return
#     (tip hasn't cleared the safety margin, or the computed window
#     is empty) on EVERY tick — no runs_total series ever gets a
#     sample, so both the numerator and the denominator of the ratio
#     above are permanently zero and the `and rate(...) > 0` guard
#     blocks it from firing. absent_over_time catches that directly.
#
#   - `stellarindex_hashdb_append_failing` — the write-side companion:
#     the per-ledger `hashdb.Append` call (recorded by
#     stellarindex_hashdb_append_total{outcome}) is deliberately
#     failure-tolerant and never stalls ingest, so a sustained run of
#     `error` outcomes has no other signal. If Append is silently not
#     recording, the periodic verify sweep finds nothing to compare
#     against (Missing, not Drifted) — the detector goes blind on the
#     write side without ever tripping drift_detected or
#     verify_failing.

groups:
  - name: stellarindex.hashdb
    interval: 60s
    rules:

      - alert: stellarindex_hashdb_drift_detected
        expr: stellarindex_hashdb_drift_total > 0
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: hashdb
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/hashdb-drift-detected.md
          summary: "hashdb drift detected — {{ $value }} drifted ledger(s) since indexer start"
          description: |
            The periodic hashdb verify sweep re-read a trailing window of
            ledgers from the galexie bucket and found at least one whose
            freshly-computed sha256(LCM) does NOT match the value recorded
            when the indexer first observed it. This means either upstream
            retroactively rewrote a previously-fetched ledger's bytes, or
            our local copy of that ledger is corrupted — the founding case
            was ledger 63332650 (2026-07-08). A chain-link check alone
            can't catch this: rewritten bytes can still be internally
            consistent. Check the indexer's log for the "hashdb DRIFT
            DETECTED" line (names the drifted sequences), then the runbook.

      - alert: stellarindex_hashdb_verify_failing
        expr: |
          sum(rate(stellarindex_hashdb_verify_runs_total{outcome="error"}[6h]))
            >
          sum(rate(stellarindex_hashdb_verify_runs_total{outcome=~"ok|drift"}[6h]))
          and
          sum(rate(stellarindex_hashdb_verify_runs_total{outcome=~"error|ok|drift"}[6h])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: hashdb
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/hashdb-drift-detected.md
          summary: "hashdb periodic verify sweep failing more often than it completes (P3)"
          description: |
            More error-outcome sweeps than clean/drift-outcome sweeps over
            the last 6h for 30+ min sustained. The indexer's periodic hashdb
            verifier can't complete its window re-read (bucket unreachable,
            hashdb file I/O error) — the detector has gone blind rather
            than found anything. Not customer-facing on its own, but it
            means drift (if any is happening) is going unnoticed. Check the
            indexer's "hashdb verify sweep failed" WARN log lines, then the
            runbook.

      - alert: stellarindex_hashdb_verify_stale
        expr: |
          sum(increase(stellarindex_hashdb_append_total[6h])) > 0
          and
          absent_over_time(stellarindex_hashdb_verify_runs_total[6h])
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: hashdb
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/hashdb-drift-detected.md
          summary: "hashdb periodic verify sweep has recorded no outcome in 6h+ (T132)"
          description: |
            hashdb.Append has been recording ledgers on this region for
            the last 6h (so hashdb IS enabled and ingest IS live) but
            stellarindex_hashdb_verify_runs_total has had zero samples
            over the same window — the periodic verifier hasn't
            completed a single pass, clean, drifted or errored.
            verify_failing above can't catch this: it's a ratio of
            outcomes recorded BY the sweep, and a sweep that never
            emits an outcome (every tick took hashDBVerifySweep's early
            return, or the ticker goroutine died) leaves that ratio's
            both sides at zero, which its own `rate(...) > 0` guard
            reads as no signal rather than as failure. Same effect as
            drift_detected going permanently dark: the detector isn't
            wrong, it just stopped running. Check the indexer process
            is alive and its logs for hashdb verifier startup/panic,
            then the runbook.

      - alert: stellarindex_hashdb_append_failing
        expr: |
          sum(rate(stellarindex_hashdb_append_total{outcome="error"}[15m]))
            >
          sum(rate(stellarindex_hashdb_append_total{outcome="ok"}[15m]))
          and
          sum(rate(stellarindex_hashdb_append_total{outcome=~"error|ok"}[15m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: hashdb
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/hashdb-drift-detected.md
          summary: "hashdb per-ledger Append failing more often than it succeeds (P3)"
          description: |
            More error-outcome hashdb.Append calls than ok-outcome ones
            over the last 15m, sustained 10+ min. Append runs once per
            ledger on the indexer's live ingest loop and is deliberately
            failure-tolerant — it never stalls or fails ingest — so this
            counter is the ONLY signal that the write side has gone
            silent. A sustained run of errors here means the periodic
            verify sweep has nothing recorded to compare against and
            will report Missing, not Drifted, even if real drift is
            happening. Check the indexer's hashdb Append error logs
            (disk full, permission error, out-of-range seq), then the
            runbook.
