---
# Metrics-registry-present alerts (audit-2026-07-16 C4-4).
#
# Some components CAN run without a Prometheus Registry, in which case
# the SDK-side metrics they would register go absent (the source series
# is never registered). The concrete case that motivated this:
# ledgerstream's SDK BufferedStorageBackend buffer metrics register only
# when Config.Registry != nil, but the production builder
# (pipeline.LedgerstreamConfig) deliberately leaves it nil to avoid the
# SDK's non-idempotent re-registration panic across the
# archive→live→catch-up Stream calls. Result: those SDK buffer metrics
# (buffer_fetch_latency_seconds etc.) are not exported in production.
#
# NOTE (W5-mon-3): the TieredDataStore's OWN tier_read_total /
# cold_read_duration_seconds metrics are NO LONGER gated on this — they
# moved to obs package-level (always registered), so the ledgerstream-
# tier `both_missing` page is live regardless of this gauge. This alert
# now flags only the SDK buffer-metric coverage gap.
#
# internal/obs/metrics.go exports stellarindex_metrics_registry_present
# {component} — set to 1 at boot when the component got a Registry, 0
# when it is running Registry-less. This alert makes the dead-alert
# state itself observable + alertable instead of lurking unnoticed.
#
# Scrape source: the indexer sets this gauge at startup (no textfile
# indirection). An ABSENT series means "this binary doesn't use the
# component" and is intentionally NOT alerted (only a present 0 is).

groups:
  - name: stellarindex.metrics_registry
    interval: 60s
    rules:

      - alert: stellarindex_metrics_registry_absent
        # ledgerstream is the DOCUMENTED accepted exception (runbook "The
        # known case"): the SDK's WithMetrics takes a concrete
        # *prometheus.Registry and MustRegisters fresh collectors per
        # Stream call, so the repeated-Stream production shape must run
        # registry-less until a gatherer-bridge lands (queued in the
        # runbook). Alerting forever on a documented accepted state is
        # noise; the rule stays armed for any NEW registry-less
        # component (2026-08-05).
        expr: stellarindex_metrics_registry_present{component!="ledgerstream"} == 0
        for: 15m
        labels:
          severity: informational
          team: stellarindex
          component: observability
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/metrics-registry-absent.md
          summary: "Component {{ $labels.component }} is running WITHOUT a metrics Registry — its metrics + dependent alerts are dead"
          description: |
            stellarindex_metrics_registry_present{component="{{ $labels.component }}"} = 0
            — the named component was started without a Prometheus Registry,
            so the metrics it would otherwise export are not registered and
            any alert built on them can NEVER fire (a silent monitoring-
            coverage hole, not an active outage).

            For component="ledgerstream" this means the SDK
            BufferedStorageBackend buffer metrics
            (buffer_fetch_latency_seconds etc.) are not exported. This is
            the known nil-Registry state (LedgerstreamConfig leaves Registry
            nil to dodge the SDK's re-registration panic). NOTE (W5-mon-3):
            the ledgerstream-tier `both_missing` page is NOT affected —
            stellarindex_ledgerstream_tier_read_total is obs package-level
            and always live. Remediation for the buffer metrics is a code
            fix — make the SDK registration idempotent, then wire
            obs.Registry through LedgerstreamConfig — after which this gauge
            flips to 1 and the alert clears.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/metrics-registry-absent.md
