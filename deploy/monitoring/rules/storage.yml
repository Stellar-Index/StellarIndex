---
# Storage alerts — Postgres + TimescaleDB + pgBackRest.

groups:
  - name: stellarindex.storage
    interval: 30s
    rules:

      # postgres_exporter emits no `role` label, so
      # `up{job="postgres",role="primary"}` matches no series; `pg_up` is the
      # liveness signal for the single-node primary.
      - alert: stellarindex_timescale_primary_down
        expr: pg_up == 0
        for: 30s
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/postgres.md#stellarindex_timescale_primary_down
          summary: "TimescaleDB primary is down (SEV-1)"
          description: |
            Postgres primary {{ $labels.instance }} has been unreachable for
            30+ s. Writes are blocked everywhere. Patroni should auto-failover
            within 60 s — if not, follow the manual-failover path in the
            runbook.

      # A *sql.DB pool can hold dead conns for hours after a postgres crash; the
      # 30 min PoolConnMaxLifetime is only the slow safety net, this is the live
      # signal.
      # Threshold is `> 0`, not `> 0.5`: the probe ticks once per 60 s, so the
      # max rate is 1/60 = 0.0167/s and `> 0.5` could never fire. Matches the
      # metric docstring in internal/obs/metrics.go.
      - alert: stellarindex_postgres_ping_failing
        expr: |
          rate(stellarindex_postgres_ping_total{outcome="error"}[5m]) > 0
          or (
            stellarindex_postgres_ping_total{outcome="error"}
            unless max_over_time(stellarindex_postgres_ping_total{outcome="error"}[1d] offset 5m)
          ) > 0 and on() (time() - prometheus_tsdb_lowest_timestamp_seconds > 86700)
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/postgres.md#stellarindex_postgres_ping_failing
          summary: "Indexer postgres pool ping failing (F-0151)"
          description: |
            The indexer's resilience-ping goroutine is reporting
            sustained Postgres ping failures (rate {{ $value }}/s
            over the last 5 m). The pool's 30 min lifetime
            safety-net will refresh dead conns automatically, but
            until then writes are likely stalled. Check
            `postgresql@15-main.service` (NOT the umbrella) and
            the indexer journal for the `pool may be wedged` log
            line.

      - alert: stellarindex_timescale_replica_lag
        expr: pg_replication_lag_seconds > 5
        for: 2m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/postgres.md#stellarindex_timescale_replica_lag
          summary: "Postgres sync replica lagging {{ $value }}s"
          description: |
            Replica {{ $labels.instance }} is more than 5 s behind the primary
            for 2+ minutes. If this is the sync replica, writes on the primary
            are being held back until it catches up — look for saturation on
            the replica.

      # node_exporter re-serves patroni.prom's last values even when the 30 s
      # scraper timer is dead, and stellarindex_patroni_role/_running cannot see
      # that. 10m tolerates ~20 missed runs before paging.
      - alert: stellarindex_patroni_textfile_stale
        expr: time() - node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/patroni.prom"} > 600
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/textfile-stale.md#stellarindex_patroni_textfile_stale
          summary: "patroni-textfile-scraper has not run for 10m on {{ $labels.instance }}"
          description: |
            patroni.prom has not been rewritten in 10+ minutes despite
            a 30s timer. stellarindex_patroni_role and
            stellarindex_patroni_running are reading a frozen file, not
            live cluster state. `systemctl status
            patroni-textfile-scraper.timer`.

      # Lock-table size is max_locks_per_transaction x max_connections;
      # saturation fails ingest with `out of shared memory (53200)`. Fires at
      # 70% to warn before another bump is forced.
      # `pg_locks_count` has one sample per (datname, mode), so an unqualified
      # division has no matching right-hand series and is silently empty. Sum to
      # a per-instance total (the lock table is one cluster-wide arena) and join
      # `on (instance)`.
      - alert: stellarindex_timescale_lock_table_pressure
        expr: |
          sum by (instance) (pg_locks_count)
            / on (instance) (pg_settings_max_locks_per_transaction * pg_settings_max_connections)
            > 0.7
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/postgres.md#stellarindex_timescale_lock_table_pressure
          summary: "Postgres lock-table > 70% saturated (P3)"
          description: |
            Lock-table utilisation is {{ $value | humanizePercentage }}.
            The next sustained ingest spike risks SQLSTATE 53200
            ("out of shared memory") and dropped INSERTs — the
            2026-05-06 SEV-3 class. Bump
            `postgres_max_locks_per_transaction` in the archival-node
            role and reapply.

      - alert: stellarindex_timescale_disk_full
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"} /
           node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"}) * 100 < 10
        for: 1m
        labels:
          severity: page
          team: stellarindex
          component: storage
          alert_family: timescale_disk
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/postgres.md#stellarindex_timescale_disk_full
          summary: "Postgres disk {{ $value | humanize }}% free (SEV-1)"
          description: |
            Postgres data volume on {{ $labels.instance }} has < 10 % free.
            WAL will refuse to write once full, halting all writes. Act now.

      - alert: stellarindex_timescale_disk_warning
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"} /
           node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"}) * 100 < 20
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
          alert_family: timescale_disk
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/postgres.md#stellarindex_timescale_disk_full
          summary: "Postgres disk {{ $value | humanize }}% free"
          description: |
            Postgres data volume on {{ $labels.instance }} under 20 %. Plan
            retention tuning / vacuum / compression policy review. Hard page
            fires at 10 %.

      # Root is a separate dataset from /var/lib/postgresql and can fill from
      # logs before any other alert fires; without this the symptom shows up
      # downstream (Redis MISCONF -> /v1/price 404s).
      - alert: stellarindex_node_root_disk_full
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} /
           node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 1m
        labels:
          severity: page
          team: stellarindex
          component: storage
          alert_family: node_root_disk
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_node_root_disk_full
          summary: "Root filesystem on {{ $labels.instance }} {{ $value | humanize }}% free (SEV-1)"
          description: |
            Root FS (/) under 10 % free on {{ $labels.instance }}.
            If pg_wal is still here (`readlink -f
            /var/lib/postgresql/15/main/pg_wal` under /pgwal; v0.92.1
            moves it to the data/postgres/wal dataset), Postgres crashes
            at zero AND cannot complete crash recovery (incident
            2026-09-16: 3 h of API 503s, 18 units failed).
            Redis also can't snapshot once full; with the default
            stop-writes-on-bgsave-error=yes that blocks every cache
            write, blocking aggregator VWAP refresh, surfacing as
            `/v1/price` 404s on rewritten / triangulated /
            stablecoin-proxy pairs (incident 2026-05-10).

      - alert: stellarindex_node_root_disk_warning
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} /
           node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
          alert_family: node_root_disk
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_node_root_disk_warning
          summary: "Root filesystem on {{ $labels.instance }} {{ $value | humanize }}% free"
          description: |
            Root FS (/) under 20 % on {{ $labels.instance }}.
            Investigate /var/log + /tmp + /var/cache before this
            grows into the page-tier alert.

      # Static thresholds fire after the line is crossed; a ClickHouse log-wedge
      # fills root in ~5 min, faster than a human can act on the <10% page. This
      # fires on a 30 min trend to full; the avail<50% guard keeps trends on a
      # roomy disk from paging.
      - alert: stellarindex_node_root_disk_filling_fast
        expr: |
          (
            predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[10m], 1800) < 0
          and
            (node_filesystem_avail_bytes{mountpoint="/"} /
             node_filesystem_size_bytes{mountpoint="/"}) < 0.5
          )
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_node_root_disk_filling_fast
          summary: "Root filesystem on {{ $labels.instance }} trending to FULL within 30 min"
          description: |
            Root FS (/) on {{ $labels.instance }} is filling fast enough
            to reach 0 bytes within 30 minutes (10m linear trend). This
            is the log-flood signature (2026-05-10 / 2026-05-13 /
            2026-06-11 class): find the writer NOW —
            `du -xs /var/log/* /tmp | sort -rh | head` — and see the
            runbook for the CH log-wedge kill sequence.

      # Ansible does not auto-run against r1, so a codified fix stays unapplied
      # until run and a live-only hand fix is erased by the next render.
      # config-assertions.sh (hourly) checks file CONTENT; for: 65m spans two
      # runs.
      - alert: stellarindex_config_assertion_failed
        expr: stellarindex_config_assertion_ok == 0
        for: 65m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/config-assertion-failed.md
          summary: "Guard config {{ $labels.assertion }} is missing or reverted on {{ $labels.instance }}"
          description: |
            config-assertions.sh found {{ $labels.assertion }} absent or
            content-reverted for two consecutive hourly runs. Each
            assertion is a load-bearing incident fix (root-fill loop
            guards, public-edge firewall, redis cap, CS-010 supply
            config). See the runbook for the per-assertion restore
            recipe and docs/operations/r1-ansible-drift-2026-07-03.md
            for why this class exists.

      - alert: stellarindex_config_assertions_stale
        # Watches the textfile mtime, not timestamp(): a dead checker's stale
        # .prom is still re-scraped, so the sample timestamp stays ~now and a
        # timestamp()-based form never fires.
        expr: time() - node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/config_assertions.prom"} > 7200
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/config-assertion-failed.md
          summary: "config-assertions has not run for 2h on {{ $labels.instance }}"
          description: |
            The hourly config-assertions.timer is not producing fresh
            textfile output — a silent checker is the same class of
            failure the checker exists to catch. systemctl status
            config-assertions.timer.

      # Catches the root-disk failure from another angle: the Redis volume may
      # be a separate mount, or BGSAVE may fail for non-disk reasons
      # (permissions, fork failure under memory pressure).
      - alert: stellarindex_redis_writes_blocked
        expr: redis_rdb_last_bgsave_status == 0
        for: 1m
        labels:
          severity: page
          team: stellarindex
          component: cache
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/cache.md#stellarindex_redis_writes_blocked
          summary: "Redis BGSAVE failing on {{ $labels.instance }} (SEV-1) — writes blocked"
          description: |
            Redis BGSAVE on {{ $labels.instance }} has been failing
            for 1+ minute. With the default
            stop-writes-on-bgsave-error=yes, every Redis write is
            being rejected — aggregator VWAP cache stops refreshing,
            `/v1/price` 404s on rewritten/triangulated/proxy pairs
            (incident 2026-05-10). Free disk on the Redis volume
            (typically `/`), then `redis-cli BGSAVE` to clear the
            stop-writes block.

      - alert: stellarindex_timescale_connections_saturated
        expr: |
          (sum by (instance) (pg_stat_activity_count) / on (instance)
           pg_settings_max_connections) * 100 > 80
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/postgres.md#stellarindex_timescale_connections_saturated
          summary: "Postgres connection pool {{ $value | humanize }}% used"
          description: |
            > 80 % of max_connections in use for 5+ minutes. PgBouncer should
            be smoothing this; check that the pool is healthy + sized right.

      # ── TimescaleDB job-scheduler state ──
      # postgres_exporter does not cover
      # timescaledb_information.job_stats/.chunks; timescale-jobs-probe
      # (archival-node role, 10-observability.yml) writes them to the textfile
      # collector every minute.
      # lint-metric-refs.sh reads the inline ansible `content:` blocks
      # via ANSIBLE_TASK_PATHS, so both are known-produced series.
      - alert: stellarindex_timescale_cagg_stale
        # Probe interval is well inside the 5x-of-30s (=150s) tightest
        # threshold, so the freshness metric cannot age past the window it
        # judges and self-trigger.
        expr: |
          (time() - stellarindex_cagg_last_refresh_unix) > 5 * stellarindex_cagg_refresh_interval_seconds
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale.md#stellarindex_timescale_cagg_stale
          summary: "Continuous aggregate {{ $labels.cagg }} hasn't refreshed"
          description: |
            Refresh for {{ $labels.cagg }} is 5× its configured interval
            overdue. API reads from this CAGG will return stale data until it
            refreshes; check timescaledb job-scheduler health.

      # A dropped refresh policy removes that CAGG's series entirely (the probe
      # enumerates timescaledb_information.jobs), so cagg_stale's `time() - x`
      # over an absent series never fires, and probe_rows only catches the whole
      # family going to zero.
      #
      # Fires on "reported within 1d, absent now"; `x offset 1h unless x` would
      # self-resolve an hour after the drop. for: 15m absorbs a probe restart.
      #
      # This is the edge only: it resolves when the last sample leaves the 1d
      # window, and a CAGG created without a policy never reports. The standing
      # check is caggs_have_refresh_policy in scripts/ops/config-assertions.sh
      # (via stellarindex_config_assertion_failed).
      #
      # Decommissioning a CAGG trips this for a day: silence it rather than
      # joining continuous_aggregates in the probe query, which yields NULL and
      # drops every series.
      - alert: stellarindex_timescale_cagg_refresh_missing
        expr: |
          last_over_time(stellarindex_cagg_last_refresh_unix[1d])
          unless
          stellarindex_cagg_last_refresh_unix
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale.md#stellarindex_timescale_cagg_stale
          summary: "Continuous aggregate {{ $labels.cagg }} has stopped reporting refresh status"
          description: |
            {{ $labels.cagg }} was reporting
            stellarindex_cagg_last_refresh_unix in the last day and is not
            now — its refresh policy was dropped or renamed rather than
            merely late, which stellarindex_timescale_cagg_stale cannot
            see (an absent series never satisfies `time() - x > N`).
            Check timescaledb_information.jobs for a
            policy_refresh_continuous_aggregate row on {{ $labels.cagg }}.
            If this is a deliberate decommission, silence the alert
            rather than changing the probe query.

      # Late live trades (past a policy's start_offset) are materialised only by
      # the indexer's LateTradeRefresher (internal/pipeline). The gauge is the
      # age of the oldest unrefreshed window past its rate limit, read at scrape
      # time, so it climbs through errors and hangs alike. A healthy catch-up
      # stays under ~2 min.
      - alert: stellarindex_late_trade_cagg_refresh_failing
        expr: |
          stellarindex_late_trade_cagg_refresh_overdue_seconds > 600
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale.md#stellarindex_late_trade_cagg_refresh_failing
          summary: "Late-trade cagg refresh failing on {{ $labels.instance }}"
          description: |
            A late-trade window of the trades continuous aggregates has been
            due for {{ $value | humanizeDuration }} without a successful
            refresh. Those buckets under-report until one succeeds; the
            indexer log names the view and window of each failure.

      - alert: stellarindex_timescale_job_failures_climbing
        # Producer: timescale-jobs-probe.timer, same probe as the alerts above.
        #
        # Ticket, not informational (that routes to a silent receiver): this
        # counter is the only evidence of silent "failed to start job" failures
        # (background-worker starvation). Jobs get a slot on a later tick, so
        # last_run_status reads Success and cagg_stale and compression_lag stay
        # quiet.
        #
        # increase() over windows, not a rate: the counter is per job and
        # cumulative, and jobs run on minute-scale or slower schedules. Three
        # arms, because a job scheduled every T accrues at most 6h/T failures in
        # 6h: `> 10` needs T < 36 min, so every compression policy and several
        # CAGG refreshes could never trip it.
        #
        # 3d arm (>= 3) judges those; 3d not 7d because local retention is 7d
        # and an increase() window at the retention edge loses samples. Schedule
        # arm: failures x schedule_interval >= 129600 s (half of 3d) means at
        # least half the scheduled runs failed whatever T is, covering jobs
        # slower than a day where the 3d count is unreachable. A job whose
        # interval did not parse drops out of this arm only and reports query_ok
        # 0 (probe_degraded).
        #
        # Every arm discounts failures from a concurrent CAGG refresh rejecting
        # the policy (an operator replay on the same window): the job body is
        # fine and the next tick retries. Where the discount gauge is absent the
        # `or 0 *` term falls back to the raw count, so a missing gauge only
        # makes the alert louder. A collision that never ends is cagg_stale's to
        # report.
        expr: |
          (
            increase(stellarindex_timescale_job_failures_total[6h])
              - (stellarindex_timescale_job_concurrent_refresh_failures_6h
                  or 0 * increase(stellarindex_timescale_job_failures_total[6h]))
          ) > 10
            or
          (
            increase(stellarindex_timescale_job_failures_total[3d])
              - (stellarindex_timescale_job_concurrent_refresh_failures_3d
                  or 0 * increase(stellarindex_timescale_job_failures_total[3d]))
          ) >= 3
            or
          (
            (
              increase(stellarindex_timescale_job_failures_total[3d])
                - (stellarindex_timescale_job_concurrent_refresh_failures_3d
                    or 0 * increase(stellarindex_timescale_job_failures_total[3d]))
            )
              * stellarindex_timescale_job_schedule_interval_seconds
          ) >= 129600
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale.md#stellarindex_timescale_job_failures_climbing
          summary: "TimescaleDB job {{ $labels.proc }} failing repeatedly ({{ $labels.hypertable }})"
          description: |
            Job {{ $labels.job_id }} ({{ $labels.proc }} on
            {{ $labels.hypertable }}) is failing repeatedly: more than 10 runs in
            6 hours, 3 or more runs in 3 days, or at least half of the runs its
            schedule_interval gave it in 3 days. TimescaleDB retries on the next
            tick, so the caggs may look fresh and no staleness ticket will fire —
            that is exactly how the 2026 background-worker starvation stayed
            invisible.

            The three arms are not redundant. This counter is per job, so a job
            scheduled every T can accrue at most 6h/T failures and the 6h arm is
            unreachable for anything slower than ~36 minutes — every compression
            policy and five of the CAGG refresh policies. The 3-day count judges
            those, but is itself unreachable once T exceeds a day; the
            schedule_interval arm judges any T, and a job slower than 1.5 days
            trips it on a single failed run.

            Check max_parallel_workers / timescaledb.max_background_workers
            headroom first; "failed to start job" in the job_errors view means
            starvation, not a broken job body.

            The counter above says only that {{ $labels.proc }} is
            failing, never why. Query
            stellarindex_timescale_job_last_failure_reason_info{job_id="{{ $labels.job_id }}"}
            for the most recent job_errors.err_message text without a
            psql round trip.

      # Judged against each policy's own compress_after plus its
      # schedule_interval: chunks inside either are uncompressed by design or
      # queued for the next tick (fx_quotes is 90 d, aquarius_admin and
      # defindex_fees 30 d; all policies run every 12h), and a fixed 7-day count
      # flagged both. for: 24h means two missed ticks.
      # Not this alert's job: a hypertable with no compression policy at all;
      # that is compression_policies_applied in
      # scripts/ops/config-assertions.sh, surfaced via
      # stellarindex_config_assertion_failed.
      - alert: stellarindex_timescale_compression_lag
        # Producer: timescale-jobs-probe.timer (every 60s).
        expr: stellarindex_timescale_chunks_overdue_compression > 0
        for: 24h
        labels:
          severity: informational
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale.md#stellarindex_timescale_compression_lag
          summary: "{{ $labels.hypertable }}: {{ $value }} chunks past their compression policy's own window"
          description: |
            Chunks on {{ $labels.hypertable }} are still uncompressed more than
            one full schedule_interval after that hypertable's own
            compress_after elapsed, and have been for 24 h. The policy is not
            keeping up: check the job scheduler, then locks and IO.

      # ── The probe's own health ──
      #
      # The alerts above all read timescale_jobs.prom (written every 60 s by
      # timescale-jobs-probe.timer), and each producer failure is otherwise
      # silent: a failing psql query drops its families (`>` and `time() - x`
      # over an empty vector never fire); a query returning zero rows drops the
      # same series; a dead timer leaves node_exporter serving a frozen file
      # with fresh scrape timestamps (the class
      # stellarindex_config_assertions_stale exists for). Four arms: query
      # errored, query empty, file stale, file never written.
      #
      # Ticket, not page: it must not be louder than the cagg_stale ticket it
      # protects, and informational routes to receiver: silent.
      #
      # 600 s = ten missed 60 s ticks, plus for: 15m, so a postgres restart or
      # slow run (TimeoutStartSec=60) cannot trip it. The absent arm's 30m
      # window exceeds that so the two cannot flap.
      #
      # Known limit: the absent arm is fleet-global, so in the multi-host tree
      # one host still writing masks a host that never has; the other arms are
      # per-instance. A per-host anchor (the pgbackrest_backup_metrics_absent
      # shape) is wrong because node_exporter runs on every host but only
      # archival nodes run this probe.
      - alert: stellarindex_timescale_probe_degraded
        expr: |
          stellarindex_timescale_probe_query_ok == 0
          or
          stellarindex_timescale_probe_rows == 0
          or
          (time() - stellarindex_timescale_probe_last_run_unix) > 600
          or
          absent_over_time(stellarindex_timescale_probe_last_run_unix[30m])
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale.md#stellarindex_timescale_probe_degraded
          summary: "TimescaleDB job/CAGG probe is not producing usable metrics{{ if $labels.query }} ({{ $labels.query }}){{ end }}"
          description: |
            timescale-jobs-probe.timer is not producing a usable
            timescale_jobs.prom, so stellarindex_timescale_cagg_stale,
            _compression_lag and _job_failures_climbing are evaluating over
            series that are absent or frozen and cannot fire. Silence from
            those three currently means nothing either way.

            Which arm tripped says where to look. query_ok == 0 is a query
            that errored — psql, peer auth, or a renamed timescaledb_information
            view. rows == 0 is a query that succeeded and returned nothing,
            which drops exactly the same series without raising an error.
            A last_run_unix older than 10 min, or absent, is the script or its
            timer not running: node_exporter keeps serving the last file it
            saw, so the metrics stay present and stop moving.

            Start with `systemctl status timescale-jobs-probe.timer` and the
            file's mtime, then run /usr/local/sbin/timescale-jobs-probe.sh by
            hand.

      # ── the lock convoy ──
      #
      # A long AccessShareLock holder on `trades` (e.g. the aggregator's
      # cold-start VWAP aggregation) lets a queued AccessExclusiveLock request
      # (restamp decompress_chunk) pin every LATER request behind it, even
      # compatible ones: the exporter, API reads and the size watcher stall
      # while systemd units read `active`. Other alerts describe the wreckage,
      # not the convoy.
      #
      # Where the check runs is the point: postgres_exporter is in the convoy
      # and blind, so the producer is timescale-jobs-probe.sh (its own short
      # psql connection, via the textfile collector) reading only
      # pg_stat_activity + pg_blocking_pids(), which take no lock on `trades`.
      #
      # Depth-2 predicate, not "someone is waiting": decompressing a large chunk
      # legitimately holds AccessExclusiveLock for ~1.5 h and its readers wait,
      # so alerting on blocked backends would fire on every healthy restamp. The
      # gauge counts only backends whose blocker is itself blocked; under a
      # healthy hold the blocker is running and the count is zero.
      #
      # 120 s + for 2m: never normal (pending behind pending resolves in ms),
      # ~13x below the worst observed waits, and above the 30 s
      # postgres_exporter scrape timeout so a self-clearing stall does not page.
      # No absent arm: a dead producer is already
      # stellarindex_timescale_probe_degraded's alert.
      #
      # The restamp bounds its own lock request with `SET LOCAL lock_timeout`
      # and retries (internal/storage/timescale/trades_chunks.go), so this
      # covers convoys headed by something else (manual ALTER, migration,
      # compression policy).
      - alert: stellarindex_pg_lock_convoy
        expr: stellarindex_pg_lock_convoy_wait_seconds_max > 120
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/postgres.md#stellarindex_pg_lock_convoy
          summary: "Postgres lock convoy: a backend has waited {{ $value | humanizeDuration }} behind a blocker that is itself blocked"
          description: |
            {{ $value | humanizeDuration }} is the longest wait among the
            backends queued behind a lock request that is ITSELF queued —
            the 2026-09-10 shape. Postgres puts every later request for an
            object behind a pending exclusive one, so this grows to include
            work that has nothing to do with the original contention:
            postgres_exporter's scrapes, the API's reads, the size watcher.

            Treat the alerting layer as untrustworthy while this is firing.
            postgres_exporter is very likely in the convoy, which makes
            every pg_* alert unable to fire; this gauge comes from
            timescale-jobs-probe.sh via node_exporter and is not.

            Find the HEAD of the chain (the one blocked backend nothing is
            blocking) and decide about that one process — cancelling
            anything further down only frees its own slot. The runbook has
            the query.

      # woblerr's pgbackrest_exporter emits `pgbackrest_*` (no
      # stellarindex_pgbackrest_*). backup_since_last_completion_seconds is
      # already seconds-since, one series per backup_type per stanza; `min by
      # (stanza)` lets the freshest backup of any type satisfy it, and the
      # all-stanzas pseudo-stanzas are excluded so a per-stanza failure is not
      # masked.
      - alert: stellarindex_timescale_backup_failed
        expr: |
          min by (stanza) (
            pgbackrest_backup_since_last_completion_seconds{stanza!~"all-stanzas.*"}
          ) > 25 * 3600
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
          alert_family: "timescale_backup_age/{{ $labels.stanza }}"
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_timescale_backup_failed
          summary: "pgBackRest stanza {{ $labels.stanza }} last backup {{ $value | humanizeDuration }} ago"
          description: |
            Backup has missed at least one expected daily cycle (no completed
            full/diff/incr in > 25 h). Check pgBackRest logs + MinIO connectivity.

      - alert: stellarindex_timescale_backup_none_24h
        expr: |
          min by (stanza) (
            pgbackrest_backup_since_last_completion_seconds{stanza!~"all-stanzas.*"}
          ) > 24 * 3600
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: storage
          alert_family: "timescale_backup_age/{{ $labels.stanza }}"
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_timescale_backup_none_24h
          summary: "No successful Postgres backup in > 24 h (SEV-1)"
          description: |
            RPO breach. At 24h+ without a backup we exceed the documented
            5-min RPO target by 288×. Escalate immediately.

      # The two alerts above are `min by (stanza)(...) > N`, empty over an empty
      # vector, so an exporter that is up but reports no stanza (pgbackrest
      # missing, unreadable conf, `pgbackrest info` erroring) would silence the
      # SEV-1 page; meta.yml's pgbackrest_exporter_down checks `up` only.
      # Per-instance `unless on (instance)` so a healthy host cannot mask a
      # blind one; gated on up==1 so a down exporter pages once (exporter_down).
      # for: 15m covers --collect.interval=600 after a restart.
      - alert: stellarindex_pgbackrest_backup_metrics_absent
        expr: |
          up{job="pgbackrest_exporter"} == 1
          unless on (instance)
          pgbackrest_backup_since_last_completion_seconds{stanza!~"all-stanzas.*"}
        for: 15m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_pgbackrest_backup_metrics_absent
          summary: "pgbackrest_exporter on {{ $labels.instance }} is up but reports no stanza — backup alerts are blind"
          description: |
            The exporter answers scrapes (up == 1) but has emitted no
            pgbackrest_backup_since_last_completion_seconds for a
            real stanza for 15+ min. `stellarindex_timescale_backup_failed`
            and `_backup_none_24h` are `min by (stanza)(...) > N`
            over that series: with it absent they evaluate to an
            empty vector and CANNOT fire, so a backup that stopped
            would never page. Usual causes: pgbackrest not installed
            on this host (the unit exits 127), the exporter user
            cannot read /etc/pgbackrest/pgbackrest.conf or the repo,
            or `pgbackrest info` errors on the stanza. Run
            `sudo -u pgbackrest_exporter pgbackrest --stanza=stellarindex info`
            and `curl -s localhost:9854/metrics | grep pgbackrest_backup_since`.

      # Causal early signal: the nightly unit failed (exit 127 when pgbackrest
      # is absent, or a backup error). Same shape as verify-archive.yml's
      # unit_failed; needs node_exporter --collector.systemd.
      - alert: stellarindex_pgbackrest_backup_unit_failed
        expr: |
          node_systemd_unit_state{
            name="pgbackrest-backup.service",
            state="failed"
          } == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_pgbackrest_backup_unit_failed
          summary: "pgbackrest-backup.service failed on {{ $labels.instance }}"
          description: |
            The nightly pgBackRest unit exited non-zero. The freshness
            alerts catch this ~24 h later (or never, if the exporter has
            no stanza to report); this is the early, causal signal.
            `journalctl -u pgbackrest-backup.service -n 100`.

      # ── ClickHouse lake protection (ADR-0043 §2.1) ──
      #
      # The lake has no data backup by design (ADR-0043); the metadata snapshot
      # (SHOW CREATE, partition/settings inventory, ch-backfill cursor) from
      # ch-schema-snapshot.timer is what protects it, so the snapshot's own
      # freshness is load-bearing: a stale one drifts from reality until a
      # rebuild reproduces the wrong ORDER BY.
      #
      # scripts/ops/ch-schema-snapshot.sh deliberately stamps nothing on a
      # partial capture, and a first-run failure writes no stamp at all, so
      # never-succeeded / every-run-failed / host-rebuilt make the series
      # absent, not old. `time() - x` over an empty vector never fires, hence
      # the absent_over_time(...[36h]) arm (restore-drill.yml pattern).
      - alert: stellarindex_ch_schema_snapshot_stale
        expr: |
          (time() - stellarindex_ch_schema_snapshot_last_success_unix) > 36 * 3600
          or
          absent_over_time(stellarindex_ch_schema_snapshot_last_success_unix[36h])
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-schema-restore.md
          summary: "ClickHouse schema snapshot has recorded no full capture in > 36 h (daily timer)"
          description: |
            ch-schema-snapshot.timer (daily, 03:40 UTC) has not
            completed a full capture in over 36 h — one missed cycle
            plus slack — or has never completed one. The ClickHouse
            lake's ONLY backup is this metadata copy (ADR-0043 §2.1);
            while it is stale, every DDL change since the last good
            snapshot is unprotected and a re-derive would rebuild
            against a schema that no longer matches production.
            The script stamps last_success ONLY on a clean run and
            rewrites the textfile each run, so every-run-failed /
            never-ran shows up as an ABSENT series, not an old one —
            both shapes fire this alert.
            Check `systemctl status ch-schema-snapshot.service` and
            run `/usr/local/bin/ch-schema-snapshot.sh` by hand — it
            refuses to write an empty or partial snapshot, so a
            failure here usually means ClickHouse was unreachable or a
            SHOW CREATE errored.

      # The offsite stamp exists only after a successful push, so a
      # never-succeeded push is an absent series and the `time() - x` arm alone
      # can never fire.
      #
      # Ungated on `offsite_configured`: gating on it made the loudest state
      # (the lake's only DDL copy on the pool it protects, no off-site anywhere)
      # the one that stayed silent. ADR-0043's restore is schema-first, so total
      # site loss without an off-site copy leaves the schema nowhere.
      #
      # Per host, not fleet-global: a bare absent_over_time(offsite[72h]) is one
      # boolean, so any host pushing would hide every other host's missing copy.
      # The second arm takes hosts with a local snapshot (last_success_unix)
      # minus those that pushed off-site in the window; a host with a failing
      # snapshot has no last_success_unix and belongs to _stale.
      - alert: stellarindex_ch_schema_snapshot_offsite_stale
        expr: |
          (time() - stellarindex_ch_schema_snapshot_offsite_last_success_unix) > 72 * 3600
          or
          (
            stellarindex_ch_schema_snapshot_last_success_unix
            unless on (instance)
            max_over_time(stellarindex_ch_schema_snapshot_offsite_last_success_unix[72h])
          )
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-schema-restore.md
          summary: "ClickHouse schema snapshot has not reached offsite storage in > 72 h"
          description: |
            The daily schema snapshot is not reaching off-site storage —
            the push has been failing for 3+ days, or no off-site target
            has ever been configured on this host. Either way the only
            copy of the lake's DDL lives on the same pool as the lake
            (CS-111's failure shape, one layer down), and ADR-0043's
            restore is schema-first, so a pool loss makes the re-derive
            archaeology rather than a procedure.
            `stellarindex_ch_schema_snapshot_offsite_configured` tells
            the two apart: 0 = never configured (set
            ch_schema_snapshot_mc_target and re-apply the role), 1 =
            configured but pushing — check the `mc` alias/credentials
            and the remote's quota.

      # Config/secrets backup (scripts/ops/config-backup.sh, off-site-backup-plan
      # §3). Every run writes offsite_configured; last_success only on a clean
      # run. The second arm is per host: hosts whose timer ran minus those with a
      # backup inside the window. The third catches a timer that never runs.
      - alert: stellarindex_config_backup_stale
        expr: |
          (time() - stellarindex_config_backup_last_success_unix) > 36 * 3600
          or
          (
            stellarindex_config_backup_offsite_configured
            unless on (instance)
            max_over_time(stellarindex_config_backup_last_success_unix[36h])
          )
          or
          absent_over_time(stellarindex_config_backup_offsite_configured[36h])
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/off-site-backup-plan.md
          summary: "Encrypted config/secrets backup has not succeeded in > 36 h (daily timer)"
          description: |
            config-backup.timer (daily, 03:55 UTC) has not written an
            age-encrypted backup of the host's config and secrets in
            over 36 h, or has never run. These files cannot be
            re-derived: losing the host without a copy means
            rebuilding every credential and the pgBackRest cipher
            pass by hand. Check `systemctl status config-backup.service`
            and run `/usr/local/bin/config-backup.sh` by hand; it
            refuses to run without AGE_RECIPIENT or `age`.

      # Same shape as the schema snapshot's offsite alert: ungated on
      # offsite_configured, per host.
      - alert: stellarindex_config_backup_offsite_stale
        expr: |
          (time() - stellarindex_config_backup_offsite_last_success_unix) > 72 * 3600
          or
          (
            stellarindex_config_backup_last_success_unix
            unless on (instance)
            max_over_time(stellarindex_config_backup_offsite_last_success_unix[72h])
          )
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/off-site-backup-plan.md
          summary: "Encrypted config/secrets backup has not reached offsite storage in > 72 h"
          description: |
            The config backup exists only on the host it protects: the
            push has failed for 3+ days, or no off-site target is
            configured. `stellarindex_config_backup_offsite_configured`
            tells the two apart: 0 = set config_backup_mc_target (or
            ch_schema_snapshot_mc_target) and re-apply the role, 1 =
            check the `mc` alias, credentials and remote quota.

      # Lake data backup (scripts/ops/ch-lake-backup.sh, ADR-0043 §2.4). The
      # stamp is written only on success, so never-configured / never-succeeded
      # / failing are absent series the `time() - x` arm cannot fire on. The
      # second arm is per host: every host whose timer ran (the `configured`
      # gauge is written by every run) minus those with a backup inside the
      # window; hosts with ch_lake_backup_enabled: false write no textfile and
      # never enter it.
      # 96 h, not 36: a full of the lake takes ~2 days at the default bandwidth
      # cap and the incrementals it delays must not ticket. The last two arms
      # watch the FULL: last_full_unix is absent only while no confirmed full
      # exists, and age past FULL_INTERVAL_DAYS + 4 d (a ~2-day full plus one
      # retry) means new fulls keep failing.
      - alert: stellarindex_ch_lake_backup_stale
        expr: |
          (time() - stellarindex_ch_lake_backup_last_success_unix) > 96 * 3600
          or
          (
            stellarindex_ch_lake_backup_configured
            unless on (instance)
            max_over_time(stellarindex_ch_lake_backup_last_success_unix[96h])
          )
          or
          (
            (time() - stellarindex_ch_lake_backup_last_full_unix)
            >
            (stellarindex_ch_lake_backup_full_interval_days + 4) * 86400
          )
          or
          (
            stellarindex_ch_lake_backup_configured == 1
            unless on (instance)
            max_over_time(stellarindex_ch_lake_backup_last_full_unix[72h])
          )
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-lake-backup.md
          summary: "ClickHouse lake has no current off-site backup on {{ $labels.instance }}"
          description: |
            No ch-lake-backup run has completed on this host in 96 h (or
            none ever has), no confirmed full has been on record for 72 h,
            or the recorded full is older than FULL_INTERVAL_DAYS + 4 d.
            Without a current chain the lake's only recovery path is a
            re-derive from the Galexie archive (~1–2 weeks) instead of a
            restore (hours). `stellarindex_ch_lake_backup_configured`
            splits the cases: 0 = no off-site disk configured (set
            ch_lake_backup_s3_endpoint + the vault key pair and re-apply
            the role), 1 = configured but failing —
            `journalctl -u ch-lake-backup.service -n 100`.

      # The unit also exits non-zero on a failed verdict, so stellarindex_systemd_unit_failed
      # tickets beside _failed; that catch-all also covers a run that crashed before its textfile.
      - alert: stellarindex_lake_verify_stale
        expr: |
          (time() - stellarindex_lake_verify_last_run_unix) > 172800
          or
          (
            stellarindex_ch_schema_snapshot_last_success_unix
            unless on (instance)
            max_over_time(stellarindex_lake_verify_last_run_unix[2d])
          )
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/lake-verify.md
          summary: "verify-lake has not completed a run on {{ $labels.instance }} in 2 days"
          description: |
            Timer not running, or every run crashed before its verdict —
            `systemctl status verify-lake.timer verify-lake.service`,
            `journalctl -u verify-lake --since -50h`.

      - alert: stellarindex_lake_verify_failed
        expr: max by (instance, check) (stellarindex_lake_verify_failures) > 0
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/lake-verify.md
          summary: "verify-lake found {{ $value }} {{ $labels.check }} failure(s) on {{ $labels.instance }}"
          description: |
            Per-check triage is in the runbook; `journalctl -u verify-lake -n 300`
            holds the gap / deficiency / SHORT lines of the last run.

      - alert: stellarindex_network_state_verify_stale
        expr: |
          (time() - stellarindex_network_state_verify_last_run_unix) > 172800
          or
          (
            stellarindex_ch_schema_snapshot_last_success_unix
            unless on (instance)
            max_over_time(stellarindex_network_state_verify_last_run_unix[2d])
          )
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/network-state-verify.md
          summary: "verify-network-state has not completed a run on {{ $labels.instance }} in 2 days"
          description: |
            Timer not running, history archive unreachable, or every run
            crashed before its verdict —
            `systemctl status verify-network-state.timer verify-network-state.service`,
            `journalctl -u verify-network-state --since -50h`.

      - alert: stellarindex_network_state_verify_failed
        expr: max by (instance, check) (stellarindex_network_state_verify_failures) > 0
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/network-state-verify.md
          summary: "verify-network-state found {{ $value }} {{ $labels.check }} failure(s) on {{ $labels.instance }}"
          description: |
            The lake's derived state disagrees with the network's. Per-check
            triage is in the runbook; `journalctl -u verify-network-state -n 300`
            holds the MISMATCH sample and the lumen residual of the last run.

      # wasm-drift (internal/ops/chops/wasm_drift.go): a gated contract
      # running a hash its audit log never string-checked. No never-ran
      # arm: the timer is not deployed everywhere yet.
      - alert: stellarindex_wasm_drift
        expr: max by (source, contract) (stellarindex_wasm_drift) > 0
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/wasm-drift.md
          summary: "{{ $labels.source }} contract {{ $labels.contract }} runs a WASM hash no audit log has string-checked"
          description: |
            The decoder was audited against other bytes. String-check the new
            hash, record it in the source's audit log, then add it to
            internal/wasmaudit/audited_wasm.json.

      - alert: stellarindex_wasm_drift_stale
        expr: (time() - stellarindex_wasm_drift_last_run_unix) > 172800
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/wasm-drift.md
          summary: "wasm-drift has not completed a run on {{ $labels.instance }} in 2 days"
          description: |
            A run that errors writes no textfile — check the unit's journal
            for the wasm-drift error line.

      # Same never-succeeded anchoring as ch_lake_backup_stale
      # (off-site-backup-plan.md §1): the `configured` gauge is emitted on every
      # run (0 or 1). 48h, not 96h: the mirror is hourly.
      - alert: stellarindex_galexie_archive_mirror_stale
        expr: |
          (time() - stellarindex_galexie_archive_mirror_last_success_timestamp) > 48 * 3600
          or
          (
            stellarindex_galexie_archive_mirror_configured
            unless on (instance)
            max_over_time(stellarindex_galexie_archive_mirror_last_success_timestamp[48h])
          )
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/archive.md#stellarindex_galexie_archive_mirror_stale
          summary: "Galexie archive has no verified off-site mirror younger than 48 h on {{ $labels.instance }}"
          description: |
            No galexie-archive-mirror run has completed and verified clean
            on this host in 48 h, or none ever has. Without one the
            archive has no off-site copy at all — a pool or box loss
            recovers only via re-ingest of the public Stellar history
            archives (days-weeks). `stellarindex_galexie_archive_mirror_configured`
            splits the cases: 0 = no off-site target configured (set
            galexie_archive_mirror_s3_endpoint + the vault key pair and
            re-apply the role), 1 = configured but failing —
            `journalctl -u galexie-archive-mirror.service -n 100`.

      # Causal early signal for both snapshot alerts: the oneshot unit has no
      # OnFailure, so a failed run otherwise surfaces only 36 h later.
      - alert: stellarindex_ch_schema_snapshot_unit_failed
        expr: |
          node_systemd_unit_state{
            name="ch-schema-snapshot.service",
            state="failed"
          } == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-schema-restore.md
          summary: "ch-schema-snapshot.service failed on {{ $labels.instance }}"
          description: |
            The daily ClickHouse schema-snapshot unit exited non-zero
            (exit 1 = nothing usable written, exit 2 = written but the
            offsite push failed). The staleness alerts catch the
            consequence 36 h / 72 h later; this is the causal signal.
            `journalctl -u ch-schema-snapshot.service -n 50`.

      # ch-schema-drift.sh (ADR-0043 §2.1;
      # docs/operations/runbooks/ch-schema-restore.md). node_exporter serves the
      # last-written gauges forever if the daily timer dies, so a frozen "0
      # divergent" reads like a clean run today.
      - alert: stellarindex_ch_schema_drift_detected
        expr: stellarindex_ch_schema_drift_divergent > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-schema-restore.md
          summary: "ClickHouse live schema has drifted from tier1_schema.sql ({{ $value }} table(s))"
          description: |
            stellarindex_ch_schema_drift_divergent = {{ $value }} — the
            live ClickHouse schema no longer matches
            deploy/clickhouse/tier1_schema.sql on ENGINE, PARTITION BY,
            ORDER BY, columns or indexes. A re-derive against the wrong
            ORDER BY silently writes a differently-ordered table rather
            than failing. Decide which side is wrong before touching
            anything — see the runbook's "converged and drifted" case.

      # A NOT CONVERGED run compares nothing, so `_divergent` goes absent rather
      # than stale (the runbook's "unvouched" state). Absence is not a clean
      # verdict and would silently disarm the alert above.
      - alert: stellarindex_ch_schema_drift_not_converged
        expr: stellarindex_ch_schema_drift_intent_converged == 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-schema-restore.md
          summary: "ch-schema-drift could not verify intent vs. host release — no comparison ran"
          description: |
            stellarindex_ch_schema_drift_intent_converged == 0: the
            shipped tier1_schema.sql's release stamp is older than the
            release this host runs, or one side could not be read.
            stellarindex_ch_schema_drift_divergent is absent for this
            run, not clean. This is a provisioning gap: re-apply the
            archival-node role, then check
            stellarindex_ch_schema_drift_intent_info for the two
            releases actually compared.

      # Staleness leg for the two alerts above: ch-schema-drift.timer is daily
      # (04:10 UTC) and node_exporter keeps serving the last gauges if it dies,
      # freezing _divergent and _intent_converged. Same class as
      # ch_schema_snapshot_stale.
      - alert: stellarindex_ch_schema_drift_stale
        expr: |
          (time() - stellarindex_ch_schema_drift_last_run_unix) > 36 * 3600
          or
          absent_over_time(stellarindex_ch_schema_drift_last_run_unix[36h])
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-schema-restore.md
          summary: "ch-schema-drift has not completed a comparison in > 36 h (daily timer)"
          description: |
            ch-schema-drift.timer (daily, 04:10 UTC) has not written a
            fresh stellarindex_ch_schema_drift_last_run_unix in over
            36 h — one missed cycle plus slack — or has never run.
            _detected and _not_converged above are now evaluating a
            frozen or absent verdict and cannot fire either way.
            Check `systemctl status ch-schema-drift.service` and run
            `ch-schema-drift.sh` by hand.

      # NVMe wear and media health. r1's NVMe is not swappable on demand, so
      # these give lead time rather than catch a failure in progress. Collector:
      # the packaged nvme collector redirected to the textfile dir by the
      # archival-node role (10-observability.yml).
      - alert: stellarindex_nvme_wear_high
        expr: nvme_percentage_used_ratio > 0.80
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_nvme_wear_high
          summary: "NVMe {{ $labels.device }} at {{ $value | humanizePercentage }} rated write endurance"
          description: |
            Rated endurance consumed on {{ $labels.device }}. Not urgent at
            80%, deliberately: replacing a drive here is a planned
            operation, so this is a procurement trigger, not an incident.

      - alert: stellarindex_nvme_spare_low
        expr: nvme_available_spare_ratio < 0.20
        for: 30m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_nvme_spare_low
          summary: "NVMe {{ $labels.device }} spare blocks down to {{ $value | humanizePercentage }}"
          description: |
            The drive is consuming its reserve block pool, which is a
            late-stage wear signal — unlike percentage_used this one moves
            shortly before failure.

      - alert: stellarindex_nvme_media_errors
        expr: increase(nvme_media_errors_total[24h]) > 0
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_nvme_media_errors
          summary: "NVMe {{ $labels.device }} reported {{ $value }} new media errors in 24h"
          description: |
            Uncorrected media errors on a ZFS member. ZFS will surface
            corruption on scrub, but the drive reporting them first is the
            earlier signal.

      # ClickHouse is the only r1 dependency with no exporter, and the raw lake
      # behind the ADR-0033 completeness claim; its disappearance otherwise has
      # no single symptom. The signal is the API's own readiness gauge, which
      # measures whether the API can actually reach it.
      # `== 0`, not `absent()`: the gauge is published every readiness round,
      # including failures. Absence would fire on a renamed check or a
      # briefly-down API, which the api-down alert covers.
      - alert: stellarindex_dependency_down
        expr: stellarindex_dependency_up == 0
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/dependency-down.md
          summary: "API dependency {{ $labels.dependency }} is unreachable"
          description: |
            The API's /v1/readyz check for {{ $labels.dependency }} has been
            failing for 2+ minutes on {{ $labels.instance }}.

            For clickhouse this is the raw lake (ADR-0034): ingest writes and
            every projector read go through it, and it has no exporter of its
            own, so this gauge is the only signal that it is gone.

            For postgres/redis the dedicated exporter alerts fire alongside
            this one and carry more detail — treat those as primary and this
            as corroboration.

      # Catch-all backstop: most textfile producers
      # (scripts/ci/textfile-producers.manifest) have no file-scoped alert, so
      # with no `file=` selector this matches every .prom node_exporter has
      # scraped, present or future. Tighter file-scoped alerts fire sooner; 24h
      # sits above every known producer's refresh interval, so this only catches
      # what nothing else does.
      #
      # False-fire exclusions (files whose age is not a dead producer):
      # - `ops_job_*.pid<N>.prom`: orphan fallback written when a run loses the
      #   heartbeat flock; never rewritten.
      # - `ops_job_backfill`, `ops_job_usd_volume_restamp`: one-off jobs with no
      #   timer. `ops_job_projected_rebuild_<source>`: finished runs stay with
      #   running=0; live ones are watched by
      #   stellarindex_ops_job_heartbeat_stale.
      # - `restore_drill*`: monthly, see
      #   stellarindex_restore_drill_textfile_stale. `verify_archive_tier_d`:
      #   weekly, see stellarindex_verify_archive_tier_d_run_stale
      #   (verify-archive.yml, 8d).
      # - `alertmanager_receivers`: rewritten only by a hand run of
      #   configs/alertmanager/apply.sh. `heavy_job_*`: written at job start,
      #   removed at exit. `ch_lake_backup`: written only when a run ends and a
      #   full runs for days; stellarindex_ch_lake_backup_stale owns it.
      # - `galexie_archive_upstream`: weekly, written only on a completed run;
      #   stellarindex_galexie_archive_upstream_check_stale (galexie-archive.yml)
      #   owns it.
      #
      # Lock-gated producers (the `unless` clause is the one list) wait behind
      # the host-wide heavy lock, so a long heavy job legitimately freezes their
      # files. Suppressed only while stellarindex_heavy_lock_held_since_unix
      # shows the lock held under 72h; `min` (newest hold) so an orphaned file
      # from a SIGKILLed job cannot disable suppression. Non-root holders
      # (verify-archive tiers A/B) never publish.
      - alert: stellarindex_textfile_producer_stale
        expr: |
          (
            time() - node_textfile_mtime_seconds{
              file!~".*/ops_job_.*\\.pid[0-9]+\\.prom$|.*/ops_job_(backfill|usd_volume_restamp|projected_rebuild_[a-z0-9_]+)\\.prom$|.*/restore_drill.*\\.prom$|.*/verify_archive_tier_d\\.prom$|.*/alertmanager_receivers\\.prom$|.*/heavy_job_.*\\.prom$|.*/ch_lake_backup\\.prom$|.*/galexie_archive_upstream\\.prom$"
            } > 86400
          )
          unless on (instance, file) (
            node_textfile_mtime_seconds{
              file=~".*/(archive_completeness|verify_archive_tier_a|verify_archive_tier_b|lake_verify|network_state_verify|ops_job_asset_registry_backfill)\\.prom$"
            }
            and on (instance)
            (min by (instance) (time() - stellarindex_heavy_lock_held_since_unix) < 259200)
          )
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/textfile-stale.md#stellarindex_textfile_producer_stale
          summary: "textfile-collector file {{ $labels.file }} has not been refreshed in 24h+ on {{ $labels.instance }}"
          description: |
            node_exporter has not seen a fresh mtime on {{ $labels.file }}
            for 24+ hours. Its producing timer/cron has likely died; check
            scripts/ci/textfile-producers.manifest for which script owns
            this file and `systemctl status` its unit. This is a catch-all:
            most producers should have fired their own, tighter alert long
            before this one does.

      # restore-drill.sh runs on a monthly timer, so the catch-all's 24h
      # backstop would false-fire and excludes it. This is the mtime backstop
      # (35d) for the timer dying before writing a gauge; the content signal is
      # stellarindex_restore_drill_stale / _offsite_stale.
      - alert: stellarindex_restore_drill_textfile_stale
        expr: time() - node_textfile_mtime_seconds{file=~".*/restore_drill.*\\.prom$"} > (35 * 24 * 3600)
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/restore-drill.md#stellarindex_restore_drill_textfile_stale
          summary: "restore-drill textfile {{ $labels.file }} has not been refreshed in 35d+ on {{ $labels.instance }}"
          description: |
            node_exporter has not seen a fresh mtime on {{ $labels.file }}
            for 35+ days despite the monthly restore-drill timer.
            `systemctl status restore-drill.timer restore-drill-offsite.timer`.
