---
# Projector alerts (ADR-0032). The projector tails soroban_events
# and writes per-source rows; Phase 3 runs in parallel with the
# dispatcher's existing per-source sinks. Lag (live-tip minus the
# projector's per-source cursor) is the canonical health signal.
#
# Every alert here has a runbook at docs/operations/runbooks/.

groups:
  - name: stellarindex.projector
    interval: 30s
    rules:

      # Projector keeping up: lag should normally be 0 — once a
      # source catches up, the per-source cursor is set to the
      # ledgerstream tip every Interval. Sustained > 256 ledgers
      # (≈21 minutes of bucket time) is the first sign that a
      # decode is hot-looping or that postgres writes are slow.
      - alert: stellarindex_projector_lag_high
        expr: |
          max by (source) (stellarindex_projector_lag_ledgers) > 256
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-lag.md
          summary: "Projector source {{ $labels.source }} lagging > 256 ledgers"
          description: |
            The ADR-0032 projector's per-source cursor for {{ $labels.source }}
            is {{ $value }} ledgers behind the ledgerstream tip. Sustained lag
            means the projector cannot keep up with raw soroban_events writes,
            so per-source projections (trades, blend_*, phoenix_*, ...) will
            increasingly diverge from the raw store.

            Runbook: docs/operations/runbooks/projector-lag.md

      # Cycle failures bumping `outcome="error"`. Single hiccups
      # (postgres restart, MinIO blip) are harmless — the projector
      # retries next cycle. Sustained error rate means the source
      # is stuck (decoder panic, bad row in landing zone, downstream
      # PK constraint failure).
      - alert: stellarindex_projector_error_rate_high
        expr: |
          sum by (source) (rate(stellarindex_projector_runs_total{outcome="error"}[15m])) > 0.05
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-lag.md
          summary: "Projector source {{ $labels.source }} cycle errors sustained"
          description: |
            The projector for {{ $labels.source }} is failing > 5% of cycles
            for 15+ minutes. Cursor is not advancing — backlog is growing.

            Runbook: docs/operations/runbooks/projector-lag.md

      # COR-11/COR-01 (audit-2026-07-23): the projector's poison-row escape
      # hatch (quarantineCandidate) gives up on at most ONE un-processable
      # row per cycle once its retry budget is exhausted, then advances the
      # cursor past it so a deterministic sink failure can't wedge a
      # sole-writer domain forever. The raw event survives in the lake and
      # is re-driveable via `stellarindex-ops projector-replay`, but a
      # quarantine is otherwise SILENT data-completeness debt — the row is
      # out of the served tier until an operator notices and re-drives it.
      # Sensitive (any nonzero increase over the window fires), same
      # posture as stellarindex_ingestion_persist_drop in ingestion.yml —
      # a rare, low-rate signal that still needs eyes.
      - alert: stellarindex_projector_row_quarantined
        expr: increase(stellarindex_projector_events_decoded_total{outcome="sink_quarantined"}[15m]) > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-row-quarantined.md
          summary: "Projector quarantined a row on {{ $labels.source }} — poison-row escape hatch fired"
          description: |
            stellarindex_projector_events_decoded_total{source="{{ $labels.source }}",outcome="sink_quarantined"}
            incremented: the projector gave up on ONE un-processable row
            after exhausting its retry budget and advanced the cursor past
            it. The row is durably skipped from the served tier — not
            lost (the raw event is still in the lake) — until it is
            re-driven with `stellarindex-ops projector-replay -source
            {{ $labels.source }}` after the underlying defect is fixed.
            Any nonzero rate needs eyes.

            Runbook: docs/operations/runbooks/projector-row-quarantined.md

      # DATA-6 / NS-2 (audit-2026-08-14): a projector decode soft-fail (a
      # returned decode error or a recovered decoder panic) SKIPS the row and
      # lets the cursor advance past it. That is correct for a rare, scattered
      # poison row — but a shipped decoder REGRESSION breaks a whole CLASS of
      # valid events the same way (the projector runs the SAME decoders as
      # ingest; the proven phoenix 5,161-orphaned-swap class), silently draining
      # every affected event from the served tier while the cursor sails to tip.
      # The row-level loss is counted as events_decoded_total{outcome=
      # "decode_error"} and the cycle is marked runs_total{outcome=
      # "decode_degraded"} (so it is no longer reported "ok"), but the cursor
      # still advances (holding would re-wedge a sole-writer source — COR-11), so
      # this RATE alert is the defence: a SUSTAINED per-source decode_error rate
      # is a regression, not the odd bad row. Sibling of
      # stellarindex_ingestion_decode_error (ingestion.yml), which watches the
      # dispatcher/ingest decode path; the projector path had no equivalent.
      # Threshold deliberately more sensitive than the ingest sibling's (>1/s):
      # a class-wide regression on a QUIET source (rozo/defindex) can sit well
      # below 1/s yet still be a total loss for that class, so >0.1/s sustained
      # 15m catches a regression while staying clear of scattered poison rows.
      - alert: stellarindex_projector_decode_error_rate_high
        expr: |
          sum by (source) (rate(stellarindex_projector_events_decoded_total{outcome="decode_error"}[10m])) > 0.1
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-decode-error-rate.md
          summary: "Projector source {{ $labels.source }} decode errors sustained — likely a decoder regression"
          description: |
            The ADR-0032 projector for {{ $labels.source }} is failing to decode
            events at {{ $value | humanize }}/sec sustained 15+ minutes. Each
            failure SKIPS the row and advances the cursor past it, so those
            events are silently dropped from the served per-source tier (trades,
            phoenix_*, blend_*, ...) — recoverable only by re-drive. A sustained
            rate (as opposed to the odd poison row) means a decoder REGRESSION
            broke a whole class of valid events (the projector runs the same
            decoders as ingest). Fix the decoder, then re-drive the affected
            range with `stellarindex-ops projector-replay -source
            {{ $labels.source }}`.

            Runbook: docs/operations/runbooks/projector-decode-error-rate.md
