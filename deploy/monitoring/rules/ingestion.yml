---
# Ingestion alerts — matches docs/operations/alerts-catalog.md
# "Ingestion alerts" section. Every alert here has a runbook
# under docs/operations/runbooks/.

groups:
  - name: stellarindex.ingestion
    interval: 30s
    rules:

      # A 5m window false-positives on low-volume Soroban/FX sources (band, blend,
      # comet, ecb, phoenix), so windows are per source class, chosen by name regex
      # (no `class` label on stellarindex_source_events_total). Total outage is
      # stellarindex_ingestion_all_sources_stopped, which stays at 3m.
      - alert: stellarindex_ingestion_source_stopped
        expr: |
          sum by (source) (rate(stellarindex_source_events_total[30m])) == 0
          and on (source) stellarindex_source_enabled == 1
          and on (source) (
            label_replace(vector(1), "source", "binance",       "", "") or
            label_replace(vector(1), "source", "bitstamp",      "", "") or
            label_replace(vector(1), "source", "coinbase",      "", "") or
            label_replace(vector(1), "source", "kraken",        "", "") or
            label_replace(vector(1), "source", "sdex",          "", "") or
            label_replace(vector(1), "source", "aquarius",      "", "") or
            label_replace(vector(1), "source", "reflector-dex", "", "") or
            label_replace(vector(1), "source", "reflector-cex", "", "") or
            label_replace(vector(1), "source", "reflector-fx",  "", "") or
            label_replace(vector(1), "source", "redstone",      "", "") or
            label_replace(vector(1), "source", "coingecko",     "", "")
          )
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
          alert_family: ingestion_source_stopped
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_source_stopped
          summary: "Source {{ $labels.source }} has stopped ingesting"
          description: |
            No events from source {{ $labels.source }} in the last 30 minutes,
            sustained for ≥ 15 min. The source is configured
            as enabled in ingestion.enabled_sources.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_source_stopped

      - alert: stellarindex_ingestion_source_stopped_low_volume_dex
        expr: |
          sum by (source) (rate(stellarindex_source_events_total[24h])) == 0
          and on (source) stellarindex_source_enabled == 1
          and on (source) (
            label_replace(vector(1), "source", "comet",    "", "") or
            label_replace(vector(1), "source", "phoenix",  "", "") or
            label_replace(vector(1), "source", "soroswap", "", "") or
            label_replace(vector(1), "source", "blend",    "", "")
          )
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
          alert_family: ingestion_source_stopped
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_source_stopped
          summary: "Low-volume Soroban DEX {{ $labels.source }} silent 24+ hours"
          description: |
            For low-volume Soroban DEXes this is unusual but not
            necessarily an outage — check the contract on
            stellar.expert before paging the indexer team.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_source_stopped

      - alert: stellarindex_ingestion_source_stopped_daily_publisher
        expr: |
          sum by (source) (rate(stellarindex_source_events_total[30h])) == 0
          and on (source) stellarindex_source_enabled == 1
          and on (source) (
            label_replace(vector(1), "source", "ecb", "", "")
          )
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
          alert_family: ingestion_source_stopped
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_source_stopped
          summary: "Daily publisher {{ $labels.source }} silent 30+ hours"
          description: |
            ECB publishes daily. 30h gives a one-day buffer plus
            ample slack for upstream cadence variation.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_source_stopped

      # Band relays hourly (divergence.md#stellarindex_oracle_stale), so a 30h window
      # would take a day and a half to notice a dead relayer. 6h = six missed relays;
      # for 1h keeps a late push from ticketing.
      - alert: stellarindex_ingestion_source_stopped_hourly_publisher
        expr: |
          sum by (source) (rate(stellarindex_source_events_total[6h])) == 0
          and on (source) stellarindex_source_enabled == 1
          and on (source) label_replace(vector(1), "source", "band", "", "")
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
          alert_family: ingestion_source_stopped
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_source_stopped
          summary: "Hourly publisher {{ $labels.source }} silent 6+ hours"
          description: |
            No events from {{ $labels.source }} in 6+ hours. Band relays
            hourly, so this is six missed relays, not a quiet day.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_source_stopped

      - alert: stellarindex_ingestion_all_sources_stopped
        # The absent_over_time branch keeps the page alive: once a dead process's samples
        # age out of the 5m window, sum(rate()) is an empty vector, not 0, and the SEV-1
        # would RESOLVE while ingestion is still down. It hands over at the same 5m
        # boundary and also covers Prometheus starting or restarting mid-outage.
        expr: |
          sum(rate(stellarindex_source_events_total[5m])) == 0
          or
          absent_over_time(stellarindex_source_events_total[5m])
        for: 3m
        labels:
          severity: page
          team: stellarindex
          component: ingestion
          alert_family: ingestion_source_stopped
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_all_sources_stopped
          summary: "All ingestion sources have stopped (SEV-1)"
          description: |
            No events from any source in the last 3 minutes. API data will go
            stale within 60 s. This is a P1 — check shared upstream (Galexie/MinIO lake)
            or shared storage (Timescale) before restarting the indexer.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_all_sources_stopped

      # A MinIO / lake outage must PAGE and no other rule does it:
      #   1. The live-tail read retries for ~5 min, so the process does not exit fast.
      #   2. StartLimitBurst 60 / 15 min never parks a ~5min10s restart cycle, so
      #      stellarindex_systemd_unit_failed (ticket, 15m) stays quiet.
      #   3. CEX/FX connectors in the same binary keep source_events_total moving, so
      #      all_sources_stopped stays quiet.
      # cursor_stuck cannot fire either: "ledgerstream" is a cursor namespace, not a
      # stellarindex_source_enabled series. source_stopped and data_source_stale only
      # ticket.
      #
      # So page on the ledger cursor itself. cmd/stellarindex-indexer advances it only
      # after a ledger is processed and its cursor row committed, so it covers the whole
      # lake -> dispatcher -> Postgres path. Branches hand over at 5m as in
      # all_sources_stopped; the gauge is born on the first committed ledger, so a
      # restart that never gets one leaves it absent, which must not read as recovery.
      #
      # ~10 min to page (5m flat window + `for: 5m`). Ledgers close every ~5-6 s, so
      # deploys and Postgres restarts fit well inside it.
      - alert: stellarindex_ingestion_ledger_stalled
        expr: |
          (
            max_over_time(stellarindex_cursor_last_ledger{source="ledgerstream"}[5m])
            - min_over_time(stellarindex_cursor_last_ledger{source="ledgerstream"}[5m])
          ) == 0
          or
          absent_over_time(stellarindex_cursor_last_ledger{source="ledgerstream"}[5m])
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ledger-ingest.md#stellarindex_ingestion_ledger_stalled
          summary: "Ledger ingest has stalled — the indexer is not committing ledgers (SEV-1)"
          description: |
            stellarindex_cursor_last_ledger{source="ledgerstream"} has not
            advanced for 10 minutes (or the series is gone entirely). No
            new ledger has been fully processed and committed, so every
            on-chain surface is frozen at that ledger while the in-process
            CEX/FX connectors keep publishing — which is why
            `all_sources_stopped` is NOT firing.
            First checks: is the lake readable (MinIO / galexie-live), is
            Postgres accepting writes, is the unit restart-looping?
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ledger-ingest.md#stellarindex_ingestion_ledger_stalled

      - alert: stellarindex_ingestion_cursor_stuck
        expr: |
          increase(stellarindex_cursor_last_ledger[5m]) == 0
          and on (source) stellarindex_source_enabled == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ledger-ingest.md#stellarindex_ingestion_cursor_stuck
          summary: "Cursor for {{ $labels.source }} not advancing"
          description: |
            The persisted cursor hasn't moved in 5 minutes while the source is
            enabled. Typical cause: indexer consumed events but UpsertCursor
            failed silently, or the indexer's cursor-persist path is wedged.

      - alert: stellarindex_ingestion_orphan_events
        expr: sum by (source) (rate(stellarindex_source_orphan_events_total[10m])) > 10/60
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-events.md#stellarindex_ingestion_orphan_events
          summary: "Source {{ $labels.source }} orphan events {{ $value | humanize }}/sec"
          description: |
            Source {{ $labels.source }} has events arriving without their
            correlation partner (Soroswap swap-without-sync, Phoenix
            incomplete 8-field swap) at a rate above 10/min sustained
            15 min. Likely a page-boundary issue in the RPC subscription
            or a contract-schema shift we haven't accounted for.

      - alert: stellarindex_ingestion_decode_error
        expr: rate(stellarindex_source_decode_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_decode_error
          summary: "Decode errors on {{ $labels.source }} at {{ $value }}/sec"
          description: |
            Source {{ $labels.source }} failed to decode > 1 event/sec for 5+
            minutes. Usually a contract-event-schema change or a regression
            in the decoder.

      # The dispatcher recovers a decoder panic and skips that input, which is only
      # sound if the skip is LOUD, so this pages on the FIRST occurrence.
      # Raw value, not increase(): a poison input usually panics once, so the series is
      # born at 1 and increase() reads 0. `> 0` also keeps firing until the fixed
      # binary ships, as the decoder still drops that event shape.
      - alert: stellarindex_decoder_panicked
        expr: stellarindex_decoder_panics_total > 0
        for: 0m
        labels:
          severity: page
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_decoder_panicked
          summary: "decoder {{ $labels.source }} panicked — its events are being SKIPPED (#371 F1)"
          description: |
            The {{ $labels.source }} decoder panicked on a ledger input. The
            dispatcher skipped that input and ingest continued, so the cursor
            is advancing and every other source is unaffected — but this
            decoder will keep dropping every event of that shape until a
            fixed binary ships. The raw event is still in the ClickHouse
            lake, so nothing is lost permanently. Runbook: find the
            `decoder panicked` log line (it carries ledger / tx_hash /
            op_index / stack), fix the decoder, then re-derive the window
            with projector-replay or ch-rebuild.

      # Oracle capture-totality (docs/design/oracle-capture-totality-design.md): a
      # Reflector / RedStone / Band symbol or feed_id the allow-list does not map is
      # stored as `raw:` rows, so nothing is lost; only a code change closes the gap.
      # 25h window: band publishes daily, so a shorter trailing window flaps. An
      # unmapped symbol recurs on every event, so any increase is a persistent gap.
      #
      # INFORMATIONAL, not ticket: an oracle listing a new token is not our fault and
      # would compete with things that ARE broken. Routes to a low-traffic channel.
      - alert: stellarindex_ingestion_oracle_unknown_symbols
        expr: sum by (source) (increase(stellarindex_source_unknown_symbols_total[25h])) > 0
        for: 30m
        labels:
          severity: informational
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-events.md#stellarindex_ingestion_oracle_unknown_symbols
          summary: "Oracle {{ $labels.source }} is publishing a ticker we do not map yet — captured, not lost"
          description: |
            stellarindex_source_unknown_symbols_total{source="{{ $labels.source }}"}
            increased in the trailing 25 h: the decoder met a symbol / feed_id
            with no canonical asset mapping. This is NOT a fault — an oracle
            listing a new token is routine, and the observations ARE captured
            under `raw:<symbol>`, readable via
            /v1/oracle/streams?include_unmapped=true, so nothing is lost while
            this is open. What it earns is a mapping, so the token gets a real
            identity rather than a raw one: extend the allow-list (ADR-0010 /
            0014 / 0028) or the RedStone feed registry, then replay the affected
            ledgers so existing history moves to the mapped identity. Worth
            doing at leisure, which is why this is informational rather than a
            ticket. See the runbook.

      # A feed_id the record layer cannot represent (empty, >64 bytes, non-printable) is
      # DROPPED with no raw: row. Separate from unknown_symbols because that remedy
      # promotes raw rows in place, and here there are none: it needs the registry entry
      # AND a replay. Mostly RedStone (ScString feed_ids). Same 25h/30m shape so a
      # daily-cadence oracle cannot flap it.
      #
      # Second arm, as in decoder_panicked: the counter is an unseeded CounterVec, so a
      # child born at N reads 0 under increase(). `unless ... offset 25h` reads "exists
      # now, did not exist a window ago" (backup-offsite.yml idiom) and goes quiet once
      # the birth leaves the window.
      - alert: stellarindex_ingestion_oracle_unrepresentable_symbols
        expr: |
          sum by (source) (increase(stellarindex_source_unrepresentable_symbols_total[25h])) > 0
          or sum by (source) (
            stellarindex_source_unrepresentable_symbols_total
            unless stellarindex_source_unrepresentable_symbols_total offset 25h
          ) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-events.md#stellarindex_ingestion_oracle_unrepresentable_symbols
          summary: "Oracle {{ $labels.source }} published a feed_id the record layer cannot store"
          description: |
            stellarindex_source_unrepresentable_symbols_total{source="{{ $labels.source }}"}
            increased in, or first appeared inside, the trailing 25 h. The
            decoder met a symbol / feed_id that fails even the permissive
            raw: validator (empty, >64 bytes, or a byte outside printable
            ASCII), so that slot was dropped with NO row written — unlike
            the unknown-symbols case, there is no raw: row to promote
            later. Closing it needs a feed-registry / allow-list entry AND
            a replay of the affected ledgers. See the runbook.

      # `for:` equal to the increase window is DELIBERATE here: it cannot fire on one
      # isolated increment, only while increments keep arriving, which is what this
      # rule's description asks for. The any-increase tripwires (persist_drop,
      # trade_buffer_drop, projector row_quarantined, ledgerstream tier_both_missing)
      # use `for: 0m`. Pinned in deploy/monitoring/rule-tests/tripwire-isolated-increment*_test.yml.
      # Same for discovery_record_failures and the two ch_live_sink_drops* rules. Each
      # carries its own waiver marker (read by lint-tripwire-window.py) because a
      # waiver covers only the rule directly beneath it.
      # lint-tripwire-window:sustained: informational; one dropped hit is
      # best-effort by design, the description asks for "continued doing so
      # for 10 minutes"
      - alert: stellarindex_ingestion_discovery_drops
        expr: increase(stellarindex_discovery_dropped_hits_total[10m]) > 0
        for: 10m
        labels:
          severity: informational
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_discovery_drops
          summary: "Discovery sink is dropping hits"
          description: |
            The SEP-41 discovery sink dropped at least one hit in the last
            10 minutes and continued doing so for 10 minutes. This does not
            stall the main ingest path, but discovery coverage is degrading
            under recorder pressure or buffer saturation.

      # SENSITIVE (rate > 0) tripwire on the money-flow insert kinds. The generic
      # insert_errors alert only fires above 0.1/s, so a low-rate silent drop slips
      # past it. kind="trade" is a permanent data-fault drop; a ctx-abandoned retry
      # (cursor held, re-derivable) is kind="trade_abandoned" and deliberately excluded.
      # `for: 0m`: increase(m[W]) > 0 with `for: W` cannot fire on one isolated
      # increment (true for W, needs W more), and a shorter `for:` filters nothing.
      # Second arm: the CounterVec child is not pre-seeded, so the very increment we
      # alert on births it at 1 and increase() reads 0 (counters reset on every
      # deploy). `unless ... offset` = "exists now, not one window ago"; it goes quiet
      # once the birth leaves the window.
      # KNOWN FALSE POSITIVE of that arm, accepted at ticket severity (and why it is
      # not used on a page): after a Prometheus gap longer than the 5m lookback every
      # child above 0 looks newly born, so this tickets for up to 15m with no new drop.
      # Check `increase()` on the series first. Pinned in
      # rule-tests/tripwire-isolated-increment*_test.yml.
      - alert: stellarindex_ingestion_persist_drop
        expr: |
          increase(stellarindex_source_insert_errors_total{kind=~"trade|soroswap_router_swap|defindex_flow_strategy|defindex_flow_vault"}[15m]) > 0
          or (
            stellarindex_source_insert_errors_total{kind=~"trade|soroswap_router_swap|defindex_flow_strategy|defindex_flow_vault"} > 0
            unless stellarindex_source_insert_errors_total{kind=~"trade|soroswap_router_swap|defindex_flow_strategy|defindex_flow_vault"} offset 15m
          )
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_insert_errors
          summary: "Persist drops on {{ $labels.source }}/{{ $labels.kind }} (any rate)"
          description: |
            A trade, soroswap-router or defindex persist write failed for
            {{ $labels.source }}/{{ $labels.kind }} in the last 15 minutes.
            These are DEX-swap / vault-flow rows — even a low-rate drop
            matters. kind="trade" is a trade rejected as a permanent data
            fault: the row is NOT in the served tier (a projected source
            also counts it as projector outcome="sink_permanent"). For the
            other kinds, a write through the projector is retried (watch
            stellarindex_projector_events_decoded_total{outcome="sink_retry"});
            one through the dispatcher drain was dropped. Check Timescale
            health and the poison-row logs.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_insert_errors

      # Recorder.Record failures in the async sink; without this a recorder outage
      # silently stops discovered_assets growing. Informational posture as
      # discovery_drops (the contract re-appears on a later event).
      # lint-tripwire-window:sustained: best-effort write, the contract
      # re-appears on a later event; the description asks for "kept failing
      # for 10 minutes" (see the `for:` note above discovery_drops)
      - alert: stellarindex_ingestion_discovery_record_failures
        expr: increase(stellarindex_discovery_record_failures_total[10m]) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_discovery_drops
          summary: "Discovery recorder writes are failing"
          description: |
            The discovery async sink's Recorder.Record write failed at
            least once in the last 10 minutes and kept failing for 10
            minutes. discovered_assets stops growing while this persists —
            usually a Postgres outage or a discovered_assets schema/constraint
            problem. Best-effort by design (the contract re-appears on a
            later event), so this is a coverage-degradation signal, not
            data loss.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_discovery_drops

      # lint-tripwire-window:sustained: clickhouse.md#stellarindex_ingestion_ch_live_sink_drops: "drops are
      # normal in rare bursts", healed by the ch-live-catchup timer; this
      # tickets only when dropping is continuous (see the `for:` note above
      # discovery_drops)
      - alert: stellarindex_ingestion_ch_live_sink_drops
        expr: increase(stellarindex_ch_live_sink_ledgers_total{outcome="dropped"}[10m]) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
          alert_family: ingestion_ch_live_sink_drops
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/clickhouse.md#stellarindex_ingestion_ch_live_sink_drops
          summary: "ClickHouse live-sink is dropping ledger extracts"
          description: |
            The real-time CH dual-sink dropped at least one whole ledger
            extract in the last 10 minutes and kept doing so for 10
            minutes. Drops are healed by the ch-live-catchup timer, so
            this is "the heal path is being exercised abnormally" —
            check CH health and sink buffer pressure before the lake
            tail integrity degrades (ADR-0041).

      # lint-tripwire-window:sustained: a PAGE for "dropping continuously
      # for an hour" — the heal path losing the race, not one shed ledger,
      # which the ticket above and ch-live-catchup already cover
      - alert: stellarindex_ingestion_ch_live_sink_drops_sustained
        expr: increase(stellarindex_ch_live_sink_ledgers_total{outcome="dropped"}[1h]) > 0
        for: 1h
        labels:
          severity: page
          team: stellarindex
          component: ingestion
          alert_family: ingestion_ch_live_sink_drops
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/clickhouse.md#stellarindex_ingestion_ch_live_sink_drops
          summary: "ClickHouse live-sink drops sustained for 1h — heal path losing the race"
          description: |
            Ledger extracts have been dropping continuously for an hour.
            ch-live-catchup is either down or cannot keep up; the
            certified-lake tail (the coverage claim's substrate) is at
            risk. Treat as data-loss-risk (ADR-0041).

      # `errored` is not outcome="dropped": either ExtractLedger failed before the sink
      # saw the ledger, or the sink's own Add/Flush failed. The remedies differ, hence
      # a separate rule.
      # [30m] range against `for: 15m` on purpose: one step must stay true longer than
      # the pending period, or the fault (one meta-version break, then a dead indexer)
      # resolves under itself.
      - alert: stellarindex_ingestion_ch_live_sink_errors
        expr: increase(stellarindex_ch_live_sink_ledgers_total{outcome="errored"}[30m]) > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/clickhouse.md#stellarindex_ingestion_ch_live_sink_errors
          summary: "ClickHouse live-sink is erroring on ledger extracts"
          description: |
            stellarindex_ch_live_sink_ledgers_total{outcome="errored"}
            advanced in the last 30 minutes. Either
            clickhouse.ExtractLedger failed on a ledger (nothing was
            handed to the sink at all — a decode / TransactionMeta
            version break fails EVERY ledger in lock-step) or the
            sink's own Add/Flush errored. Unlike `dropped`, which is
            the sink shedding load it did see, this is the lake's
            live edge not being written. ch-live-catchup heals it
            only if a re-read succeeds; a systematic extract break
            leaves the hole, and internal/projector clamps to the
            contiguous watermark behind it.

      # Read-undercount twin of the errored rule: the extract succeeds and the ledgers
      # row is written, so the commit marker claims a ledger with short contract_events
      # that ch-live-catchup (which refills MISSING ledgers) never revisits. The census
      # path skips the ledger_ingest_log row instead. Same [30m] / for: 15m shape.
      - alert: stellarindex_ingestion_ch_live_sink_read_undercount
        expr: increase(stellarindex_ch_live_sink_read_undercount_total[30m]) > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/clickhouse.md#stellarindex_ingestion_ch_live_sink_read_undercount
          summary: "Indexer read path could not fully decode ledgers ({{ $labels.kind }})"
          description: |
            stellarindex_ch_live_sink_read_undercount_total{kind="{{ $labels.kind }}"}
            advanced in the last 30 minutes. A transaction envelope,
            its events, or a ledger-entry meta could not be read, so
            the ledger was written to the ClickHouse lake with an
            undercount (tx_read_errors / tx_event_read_errors /
            entry_meta_unsupported) or its ledger_ingest_log substrate
            row was skipped (*_census kinds). ch-live-catchup does not
            heal the lake case: the ledgers row exists. A climb on
            every ledger is a TransactionMeta version break.

      # Served-tier twin of the ch_live_sink rules. The Postgres sink's shutdown drain
      # is bounded and the cursor is upserted before the sink writes, so an abandoned
      # row is a served-tier gap the cursor never revisits.
      # `for: 0m` with a 1h range: the loss is a completed event (the process exits
      # within seconds), so a `for:` could only let it resolve before firing. 1h keeps
      # the ticket readable after a deploy and increase() carries the pre-restart value
      # across the counter reset. Ticket, not page: rows are recoverable (ch-rebuild
      # -sdex-gaps, the source's gap detector) but only if someone acts.
      - alert: stellarindex_ingestion_sink_undrained_rows
        expr: increase(stellarindex_sink_undrained_rows_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_sink_undrained_rows
          summary: "{{ $labels.sink }} sink abandoned {{ $labels.kind }} rows at shutdown — served-tier gap to re-derive"
          description: |
            The {{ $labels.sink }} sink's bounded shutdown drain gave up
            with {{ $labels.kind }} rows still unwritten while the ledger
            cursor had already advanced past them: a served-tier gap the
            indexer will never revisit on its own. The indexer journal
            carries the authoritative ERROR line ("abandoned on shutdown
            — re-derive") with the exact ledger range (trades) or source
            (events); re-derive it from the CH lake (ADR-0034) per the
            runbook. Usually Postgres was slow or down during a deploy.

      # ADR-0041: infra insert failures retry with backpressure instead of dropping.
      # The drain goroutine blocks, so the cursor stalls and the served tier freezes
      # with nothing lost; a sustained retry rate is the early sign Postgres is
      # unreachable. Ticket, not page: cursor-stuck / all-sources-stopped page if it
      # becomes a full outage.
      - alert: stellarindex_ingestion_trade_insert_backpressure
        expr: sum(rate(stellarindex_trade_insert_retries_total{outcome="retry"}[5m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_trade_insert_backpressure
          summary: "Trade sink retrying under backpressure — Postgres write path blocked"
          description: |
            The trade sink has been retrying infrastructure-classified
            insert failures (connection refused/reset, PG restarting) for
            ≥ 10 min. The on-chain ledger cursor is HELD (not advancing)
            until the writes land — nothing is dropped, but the served
            tier is frozen and external (CEX/FX) price freshness is
            degrading (watch stellarindex_trade_insert_buffer_depth).
            Almost always a Postgres outage/restart.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_trade_insert_backpressure

      - alert: stellarindex_ingestion_insert_errors
        expr: sum by (source, kind) (rate(stellarindex_source_insert_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_insert_errors
          summary: "Insert errors on {{ $labels.source }}/{{ $labels.kind }} at {{ $value }}/sec"
          description: |
            Source {{ $labels.source }} failed to persist {{ $labels.kind }}
            events (>6/min sustained for 5 min). Storage layer is rejecting
            writes — usually Timescale outage, disk-full, or a schema
            mismatch after a migration.

            Post-2026-07-06 (ADR-0041), INFRASTRUCTURE faults no longer
            drop — they retry with backpressure (see
            trade_insert_backpressure). So a firing here means GENUINE
            loss: a permanent data fault (kind=trade) or external-buffer
            overflow (kind=dropped). Escalate quickly if the rate is high.

      # ADR-0041 companion to trade_insert_backpressure: kind="dropped" is permanent
      # loss (the external CEX/FX retry buffer trimmed its oldest entry, or per-row
      # isolation hit a permanent data fault; internal/pipeline/trade_sink.go). The
      # fleet-wide insert_errors gate (0.1/s) can miss a slow trickle during a partial
      # DB outage, so any increase tickets.
      # `for: 0m` plus the born-inside-the-window arm: see persist_drop above for why,
      # including that arm's known false positive after a Prometheus gap.
      - alert: stellarindex_ingestion_trade_buffer_drop
        expr: |
          increase(stellarindex_source_insert_errors_total{kind="dropped"}[15m]) > 0
          or (
            stellarindex_source_insert_errors_total{kind="dropped"} > 0
            unless stellarindex_source_insert_errors_total{kind="dropped"} offset 15m
          )
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_trade_insert_backpressure
          summary: "External trade(s) permanently dropped on {{ $labels.source }} — buffer overflow or data fault during backpressure"
          description: |
            stellarindex_source_insert_errors_total{source="{{ $labels.source }}",kind="dropped"}
            incremented: at least one external (CEX/FX) trade was
            permanently dropped — either the bounded retry buffer
            overflowed while Postgres was unreachable (see
            stellarindex_ingestion_trade_insert_backpressure) or a
            permanent data fault surfaced during per-row isolation. This
            IS genuine, unrecoverable loss for that trade (vendor-
            refillable, not lake-refillable). Any nonzero rate needs eyes —
            the coarse stellarindex_ingestion_insert_errors alert only
            trips above 0.1/s fleet-wide and can miss a slow trickle.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_trade_insert_backpressure

      # Classic-supply companion to persist_drop / trade_buffer_drop: trustline_observation
      # errors (~0.007/s measured on r1) sit far under the generic 0.1/s insert_errors
      # gate. persistTrustlineObservation has no retry/backpressure path (unlike trade,
      # ADR-0041), so a failed insert is a trustline delta permanently missing from
      # that account's history.
      - alert: stellarindex_ingestion_trustline_observation_drop
        expr: |
          increase(stellarindex_source_insert_errors_total{kind="trustline_observation"}[15m]) > 0
          or (
            stellarindex_source_insert_errors_total{kind="trustline_observation"} > 0
            unless stellarindex_source_insert_errors_total{kind="trustline_observation"} offset 15m
          )
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_insert_errors
          summary: "trustline_observation persist errors on {{ $labels.source }} (any rate)"
          description: |
            A trustline_observation insert failed for {{ $labels.source }}
            in the last 15 minutes. Unlike trade writes there is no
            ADR-0041 retry/backpressure path here: the row is genuinely
            lost — a classic-supply trustline delta that never reached
            trustline_observations. The coarse
            stellarindex_ingestion_insert_errors alert only trips above
            0.1/s fleet-wide and misses this class's low, sustained rate
            (INV-0786). Check Timescale health and the poison-row logs.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_insert_errors

      # Cursor-replay: trade_inserts_total can tick while the trades max(ts) is hours
      # old, every attempt an ON CONFLICT DO NOTHING no-op; neither insert_errors nor
      # source_stopped fires. Fires on a duplicate rate with zero new rate for 10m.
      # Ticket: degraded freshness, not outage.
      # `unless on (source) rate(new[10m]) > 0`, not `and ... == 0`: the outcome="new"
      # child is call-site-seeded with a config-dependent `source` label, so a source
      # that only ever hit the conflict path has no such series and an `and` join would
      # stay silent in exactly this flood. `unless` treats absent and zero alike.
      - alert: stellarindex_ingestion_duplicate_flood
        expr: |
          sum by (source) (rate(stellarindex_trade_insert_outcome_total{outcome="duplicate"}[10m])) > 0.5
          unless on (source)
          sum by (source) (rate(stellarindex_trade_insert_outcome_total{outcome="new"}[10m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_duplicate_flood
          summary: "Source {{ $labels.source }} producing duplicates only (cursor replay or stuck-tip)"
          description: |
            Source {{ $labels.source }} has been attempting >0.5
            inserts/sec for ≥10 min but EVERY attempt hits
            `ON CONFLICT DO NOTHING` — no new rows are landing in
            the trades hypertable. The indexer cursor advances but
            the data underneath it is stale.

            Likely root causes: cursor-state corruption (cursor
            jumped past data without persisting), a stale event
            channel feeding the sink from an old replay loop, or a
            back-pressure event that lost in-flight events.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_duplicate_flood

      # Unit-ratio sentinel: a decoder field-mapping bug that collapses base_amount and
      # quote_amount puts every trade of a source at exactly 1:1, and ADR-0033
      # completeness checks verify presence, not plausibility. Counts landed ON-CHAIN
      # trades with base == quote (CEX/FX scale amounts differently, so excluded).
      # Legitimate 1:1 trades are common on parity pairs (yUSDC/USDC, yETH/ETH,
      # EUR-stables; a few % of sdex flow), so alert on the FRACTION (>50%) with a
      # >25 trades/30m volume guard. Ticket: data quality, not outage.
      - alert: stellarindex_dex_trade_unit_ratio_detected
        expr: |
          (
            sum by (source) (increase(stellarindex_dex_trade_unit_ratio_total[30m])) > 25
          )
          and
          (
            sum by (source) (increase(stellarindex_dex_trade_unit_ratio_total[30m]))
              / sum by (source) (increase(stellarindex_trade_inserts_total[30m])) > 0.5
          )
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/dex.md#stellarindex_dex_trade_unit_ratio_detected
          summary: "Source {{ $labels.source }} producing a sustained stream of unit-ratio (1:1) trades"
          description: |
            Source {{ $labels.source }} has landed > 25 on-chain DEX
            trades with base_amount == quote_amount in the last 30
            minutes. An occasional equal-value cross-asset fill is
            normal; a sustained stream at this rate is the signature
            of the 2026-07-07 Phoenix decoder field-mapping bug that
            silently collapsed every trade's price to 1:1 for months.

            Check the source's recent trades ratio distribution, then
            the decoder's amount field mapping against the contract's
            event definition.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/dex.md#stellarindex_dex_trade_unit_ratio_detected

      # Timestamp-shape sibling of duplicate_flood: last successful INSERT older than
      # the budget while source_enabled=1. Covers low-volume sources (phoenix, comet)
      # whose insert rate never crosses the rate-shape 0.5/s threshold.
      - alert: stellarindex_ingestion_source_insert_stale
        # 1 h budget for dispatcher-written sources. A projected source (one with a
        # stellarindex_projector_lag_ledgers series) gets 24 h: its freshness is the
        # projector cursor, which projector_lag_high watches, and quiet pools go hours
        # without a swap (sushiswap_v3 2026-10-16, phoenix 8h28m, comet ~20/day). The
        # 24 h arm catches a decoder that silently drops every row; the ADR-0033
        # completeness verdict is the correctness net.
        expr: |
          (
            time() - stellarindex_source_last_insert_unix > 3600
            and on (source) stellarindex_source_enabled == 1
            unless on (source) stellarindex_projector_lag_ledgers
          )
          or
          (
            time() - stellarindex_source_last_insert_unix > 86400
            and on (source) stellarindex_source_enabled == 1
            and on (source) stellarindex_projector_lag_ledgers
          )
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_duplicate_flood
          summary: "Source {{ $labels.source }} hasn't landed a new row in >1h"
          description: |
            stellarindex_source_last_insert_unix{source="{{ $labels.source }}"}
            hasn't advanced in over an hour while the source is
            still enabled. Same root-cause cluster as the
            duplicate-flood alert; the timestamp-shape signal
            catches low-volume sources whose insert rate sits
            under the rate-shape alert's 0.5/s threshold.

            Cross-check stellarindex_source_last_event_unix — if the
            dispatcher is still matching events, the gap is the
            stuck-tip diagnostic (cursor advances, data doesn't).

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-sink.md#stellarindex_ingestion_duplicate_flood

      # Data-derived gap detector: the cursor-derived density in
      # /v1/diagnostics/ingestion measures process state ("did we walk this ledger")
      # and can read 100% while data is missing, so this reads the data-derived gauge.
      # >1000 ledgers (~1.5 h network time) filters legitimate no-Soroban-activity
      # stretches; 15 min = three 5-min detector cycles, so the gap between
      # cascade-clear and targeted-backfill completion doesn't trip it.
      - alert: stellarindex_ingest_gap_detected
        expr: |
          max by (source) (stellarindex_ingest_gap_max_size_ledgers) > 1000
        for: 15m
        labels:
          severity: page
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingest-gap.md#stellarindex_ingest_gap_detected
          summary: "Data-coverage gap of {{ $value }} ledgers in source={{ $labels.source }}"
          description: |
            max by (source) (stellarindex_ingest_gap_max_size_ledgers{source="{{ $labels.source }}"})
            = {{ $value }} ledgers — a contiguous block of {{ $labels.source }}
            ingest is missing in one of its per-source hypertables.
            Cursor inventory may read fine; this alert reads the data
            tables directly.

            Resolve via:
              stellarindex-ops find-data-gaps --config /etc/stellarindex.toml --source {{ $labels.source }} --output text
            for per-source diagnosis, then for Soroban-derived sources:
              stellarindex-ops projector-replay --source <name> --from F  (per-source projection cursor rewind; ADR-0032)
            For non-projected sources (sdex / soroban-events):
              stellarindex-ops backfill -write --source <name> --from F --to T

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingest-gap.md#stellarindex_ingest_gap_detected

      # Meta-alert: the gap detector is wedged for a target: last SUCCESSFUL scan older
      # than 8h (above the 6h sdex/soroban ScanCadence) or the metric is absent
      # (aggregator down).
      # Keyed off the last-success TIMESTAMP gauge, not rate(runs_total{outcome="ok"}):
      # heavy targets scan once per 6h, so their ok counter sits at 1 and a restart
      # (1 -> 1) is invisible to rate(), which false-fired for >7h. A wall-clock gauge
      # is reset-proof.
      # Third clause: absent_over_time is also satisfied by the ERROR outcome, and a
      # target that never once succeeded has no last_success series to age (e.g.
      # soroban_events failing every cycle on statement_timeout). So: errors present
      # now AND 8h ago (a fresh process's first failure doesn't ticket) with no
      # last_success in 8h. Presence rather than increase(): heavy targets retry every
      # 6h, so the error counter is as rate()-hostile as the ok one.
      - alert: stellarindex_ingest_gap_detector_silent
        expr: |
          (time() - stellarindex_ingest_gap_detector_last_success_unix) > 28800
          OR
          absent_over_time(stellarindex_ingest_gap_detector_runs_total[15m]) == 1
          OR
          (
            (
              stellarindex_ingest_gap_detector_runs_total{outcome="error"} > 0
              and on (source, table)
              stellarindex_ingest_gap_detector_runs_total{outcome="error"} offset 8h > 0
            )
            unless on (source, table)
            count_over_time(stellarindex_ingest_gap_detector_last_success_unix[8h])
          )
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingest-gap.md#stellarindex_ingest_gap_detector_silent
          summary: "Data-gap detector hasn't scanned {{ $labels.source }}/{{ $labels.table }} successfully in >8h (above the 6h sdex/soroban scan cadence)"
          description: |
            The aggregator's data-gap detector goroutine appears
            stuck or absent for a target. Without it the operator-facing
            `stellarindex_ingest_gap_max_size_ledgers` gauge stops
            updating — gauges read stale value until restart.

            Three clauses: (1) the per-target last-success stamp is
            older than 8h; (2) the runs_total metric is absent for 15m
            (aggregator fully down); (3) the target has errored both now
            and 8h ago and has had NO last-success stamp in 8h — a
            scan that has never once succeeded in this process life
            (no cursor row → nothing to re-emit) produces no stamp for
            clause 1 to age, and its error counter satisfies clause 2's
            "runs_total present", so before 2026-08-28 that target
            never fired anything.

            Likely causes: aggregator binary crash-looping; Postgres
            connection-pool exhaustion causing every scan to hit the
            per-target Go timeout / SQL statement_timeout and increment
            outcome=error; deploy regression that removed the worker
            wiring. Grep the aggregator log for
            `gap-detector: scan failed` (a non-ok outcome is logged
            loudly with elapsed_s so a timeout is unmistakable).

            Cross-check: aggregator service `active`?
            postgres_exporter targets `up`?
            `stellarindex_ingest_gap_detector_runs_total{outcome="error"}`
            climbing?

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingest-gap.md#stellarindex_ingest_gap_detector_silent

      # ── long-running ops jobs ──
      # Without these a HUNG multi-day backfill looks like a working one.
      # opsutil.JobHeartbeat publishes running, heartbeat_unix (60s timer, independent
      # of work) and progress_total separately because the two alerts below are
      # distinct failure modes.
      # `running == 1` in both exprs is load-bearing: a finished job stamps running=0
      # and stops progressing, so without it every finished backfill alerts forever.
      - alert: stellarindex_ops_job_heartbeat_stale
        # Operand ORDER is load-bearing: `and` returns the LEFT sample's value, and
        # `running == 1` on the left made {{ $value }} render the flag instead of the
        # staleness (deploy/monitoring/rule-tests/ops-job_test.yml).
        # Join key (ops_job, instance, pid), all three needed:
        #   - `ops_job`, not `job`: `job` is reserved (node_exporter has honor_labels
        #     unset, so a textfile `job` is demoted to `exported_job`), and `on (job)`
        #     matched every ops job on the host as one group.
        #   - `instance`: otherwise a healthy namesake on host B masks a dead job on A.
        #   - `pid`: opsutil.claimPath gives a concurrent second run its own
        #     `.pid<N>.prom` with a `pid` label; without it the still-running loser
        #     rescues a cleanly finished winner and tickets forever. An absent label is
        #     "", so the primary matches only itself; that is why pid is not emitted
        #     unconditionally.
        expr: |
          (time() - stellarindex_ops_job_heartbeat_unix) > 900
          and on (ops_job, instance, pid)
          stellarindex_ops_job_running == 1
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md
          summary: "ops job {{ $labels.ops_job }} says it is running but stopped heartbeating {{ $value | humanizeDuration }} ago"
          description: |
            The job's textfile still claims running=1 but the 60-second
            liveness ticker has not written for 15+ minutes. The ticker
            runs independently of progress, so this is NOT "the job is
            busy" — the PROCESS IS GONE: OOM-kill, SIGKILL, host reboot,
            or the terminal that owned it closed.

            The range it was walking is NOT complete. Confirm with
            `systemctl status` / `ps`, then re-run the same window — the
            backfills are idempotent (ReplacingMergeTree on the CH side,
            ON CONFLICT on the served side), so re-running is free and
            leaving the hole is not.

            The stale textfile persists until the next run overwrites it;
            that is deliberate (a job that died must not become invisible
            just because nothing is running).

      - alert: stellarindex_ops_job_no_progress
        # Same operand-order and (ops_job, instance, pid) join discipline as
        # heartbeat_stale.
        # TWO progress counters, both must be flat. progress_total is structurally zero
        # for whole phases of a healthy run (usd-volume-restamp -chunks decompresses a
        # Timescale chunk first: 49+ min for 17 GB, ~1.5 h for 160 GB on r1), so alone it
        # would ticket every healthy chunked run. No phase mute or wider window: that
        # phase is the most dangerous and "alive and hung" is real there
        # (decompress_chunk can wait on a lock). progress_bytes_total (chunk on-disk size
        # climbing) moves through a decompress; a wedged one extends no files, so both
        # go flat.
        # `or changes(progress_total[30m]) * 0` defaults the bytes term to 0 for jobs
        # that do not publish it; otherwise the one-to-one `+` drops those label sets and
        # the alert goes silent. The emitter publishes it at 0, so this only covers older
        # binaries mid-rollout.
        expr: |
          (
            changes(stellarindex_ops_job_progress_total[30m])
            +
            (
              changes(stellarindex_ops_job_progress_bytes_total[30m])
              or
              changes(stellarindex_ops_job_progress_total[30m]) * 0
            )
          ) == 0
          and on (ops_job, instance, pid)
          stellarindex_ops_job_running == 1
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md
          summary: "ops job {{ $labels.ops_job }} is alive but has completed no work for 30+ minutes"
          description: |
            The process is heartbeating (so it has not died) but neither
            of its progress counters has moved in 30 minutes: no unit
            completed AND no storage observed to move. The job is HUNG,
            not dead: a blocked S3 GET with no deadline, a
            ClickHouse/Postgres write waiting on a lock, a
            decompress_chunk that cannot take its lock, or a stuck
            captive-core.

            Distinguish from a genuinely slow window by checking the
            cursor: `stellarindex_ops_job_progress_cursor{ops_job="…"}`
            frozen at the same ledger across scrapes is a hang. Take a
            goroutine dump / strace before killing it — a hang here has
            recurred (galexie wedge, 2026-07-05) and the stack is the
            only evidence of which read blocked.

      # ── a job that ran to completion and FAILED ──
      # last_exit_ok: heartbeat_stale and no_progress are both correctly silent on a
      # job that exited non-zero (running=0), so nothing else watches it. No
      # `running == 1` guard: this is the terminal state a finished run left. `for: 0m`
      # because one bad exit is the whole signal (as stellarindex_projector_row_dropped_permanent).
      - alert: stellarindex_ops_job_run_failed
        expr: stellarindex_ops_job_last_exit_ok == 0
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md
          summary: "ops job {{ $labels.ops_job }} exited with an error on its last run"
          description: |
            The job's textfile reports last_exit_ok=0: the most recent
            run of this stellarindex-ops subcommand ended with a non-zero
            exit, not a crash (a crash leaves running=1 forever and is
            covered by heartbeat_stale instead). The range it was walking
            is NOT confirmed complete.

            Check the job's log for the failure, fix the underlying
            cause, and re-run the same window — every backfill here is
            idempotent, so re-running a covered range is free and leaving
            the hole is not.

            This value persists until the job's next run overwrites it,
            same as heartbeat_stale — deliberate, so a failed run does
            not go invisible just because nothing is currently running.

      # The entry index (stellar.account_entry_ledgers / asset_entry_ledgers) is
      # what per-account and per-asset ledger walks read; a builder that stops
      # (timer silent, lock wedged, watermark refusing a hole) leaves recent
      # activity invisible there while the lake itself is complete. max() on both
      # sides drops instance labels so the two gauges subtract; `or vector(0)`
      # also catches a builder that never reported. The initial build keeps this
      # firing until it catches up, which is the intended signal.
      - alert: stellarindex_entry_index_lagging
        expr: max(stellarindex_cursor_last_ledger{source="ledgerstream"}) - (max(stellarindex_ops_job_progress_cursor{ops_job="ch-entry-index"}) or vector(0)) > 20000
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#entry-index-lagging
          summary: "entry index trails the ledgerstream cursor by more than 20000 ledgers"
          description: |
            stellar.account_entry_ledgers / asset_entry_ledgers, built by
            entry-index.timer every 10 min, are more than 20000 ledgers
            behind the ledgerstream cursor for 30 min, or the builder has
            never reported. Either the timer is silent, the builder is
            refusing a window (lake hole, or no account_id below the
            ec-floor), or the initial build is still catching up.

      # Whole-transaction skip counters (tx_read_errors, tx_event_read_errors,
      # entry_meta_unsupported) plus evicted_keys_unreadable (a ledger's evictions): each
      # means events or an entry walk vanished, indistinguishable downstream from an
      # empty ledger, so any increase tickets. `for: 0m` so a lone occurrence fires —
      # see lint-tripwire-window.py.
      - alert: stellarindex_ingestion_dispatcher_tx_skips
        expr: |
          increase(stellarindex_dispatcher_tx_read_errors_total[15m]) > 0
          or increase(stellarindex_dispatcher_tx_event_read_errors_total[15m]) > 0
          or increase(stellarindex_dispatcher_entry_meta_unsupported_total[15m]) > 0
          or increase(stellarindex_dispatcher_evicted_keys_unreadable_total[15m]) > 0
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_dispatcher_tx_skips
          summary: "Dispatcher skipped a transaction or a ledger's evictions during ProcessLedger — silent data loss"
          description: |
            One of stellarindex_dispatcher_tx_read_errors_total (malformed
            tx skipped), stellarindex_dispatcher_tx_event_read_errors_total
            (GetTransactionEvents failed — that tx's Soroban events
            dropped), stellarindex_dispatcher_entry_meta_unsupported_total
            (unhandled TransactionMeta version — that tx's apply-phase
            entry changes, e.g. classic balance/trustline/offer/LP
            updates, skipped), or
            stellarindex_dispatcher_evicted_keys_unreadable_total (a
            ledger's evicted keys failed to read — its state-archival
            evictions skipped) rose. Downstream this reads as an empty
            ledger, not a failure, so any nonzero increase needs eyes.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion.md#stellarindex_ingestion_dispatcher_tx_skips

      # An oracle-class ContractCall declared in the auth tree but never executed is
      # refused before Decode; a rejected price-forgery attempt, or a routing change
      # refusing legitimate calls, needs eyes. Any increase tickets; `for: 0m` as in
      # the tripwire above — see lint-tripwire-window.py.
      # Second arm: the CounterVec{source} child is not pre-seeded, so a source's
      # first-ever rejection is born at 1 and increase() reads 0; same idiom as
      # persist_drop. Both arms use `sum by (source)` so scrape-added job/instance
      # labels don't produce a second, differently-labelled alert for one event.
      - alert: stellarindex_ingestion_uncorroborated_calls
        expr: |
          sum by (source) (increase(stellarindex_source_uncorroborated_calls_total[15m])) > 0
          or sum by (source) (
            stellarindex_source_uncorroborated_calls_total > 0
            unless stellarindex_source_uncorroborated_calls_total offset 15m
          )
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-events.md#stellarindex_ingestion_uncorroborated_calls
          summary: "Source {{ $labels.source }} rejected an uncorroborated oracle call"
          description: |
            stellarindex_source_uncorroborated_calls_total rose for source
            {{ $labels.source }}: an oracle-class ContractCall invocation
            was declared in the auth tree but never executed, so the
            dispatcher refused it before Decode. Either a price-forgery
            attempt was rejected, or the legitimate routing shape changed
            and started refusing calls that should decode — both need
            review.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-events.md#stellarindex_ingestion_uncorroborated_calls
