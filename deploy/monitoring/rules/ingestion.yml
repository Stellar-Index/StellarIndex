---
# Ingestion alerts — matches docs/operations/alerts-catalog.md
# "Ingestion alerts" section. Every alert here has a runbook
# under docs/operations/runbooks/.

groups:
  - name: stellarindex.ingestion
    interval: 30s
    rules:

      # F-1212b (audit-2026-05-12): 5-minute window false-positives
      # routinely on low-volume Soroban / FX sources (band, blend,
      # comet, ecb, phoenix). Total-outage detection is the
      # `_all_sources_stopped` alert below at 3 min — that one
      # stays tight; this one widens to give bursty sources their
      # natural breathing room.
      # F-1208 (codex audit-2026-05-12): per-source-class windows.
      # See configs/prometheus/rules.r1/ingestion.yml for the
      # rationale + the matching R1 overlay.
      - alert: stellarindex_ingestion_source_stopped
        expr: |
          sum by (source) (rate(stellarindex_source_events_total[30m])) == 0
          and on (source) stellarindex_source_enabled == 1
          and on (source) (
            label_replace(vector(1), "source", "binance",       "", "") or
            label_replace(vector(1), "source", "bitstamp",      "", "") or
            label_replace(vector(1), "source", "coinbase",      "", "") or
            label_replace(vector(1), "source", "kraken",        "", "") or
            label_replace(vector(1), "source", "sdex",          "", "") or
            label_replace(vector(1), "source", "aquarius",      "", "") or
            label_replace(vector(1), "source", "reflector-dex", "", "") or
            label_replace(vector(1), "source", "reflector-cex", "", "") or
            label_replace(vector(1), "source", "reflector-fx",  "", "") or
            label_replace(vector(1), "source", "redstone",      "", "") or
            label_replace(vector(1), "source", "coingecko",     "", "")
          )
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/source-stopped.md
          summary: "Source {{ $labels.source }} has stopped ingesting"
          description: |
            No events from source {{ $labels.source }} in the last 30 minutes,
            sustained for ≥ 15 min. The source is configured
            as enabled in ingestion.enabled_sources.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/source-stopped.md

      - alert: stellarindex_ingestion_source_stopped_low_volume_dex
        expr: |
          sum by (source) (rate(stellarindex_source_events_total[24h])) == 0
          and on (source) stellarindex_source_enabled == 1
          and on (source) (
            label_replace(vector(1), "source", "comet",    "", "") or
            label_replace(vector(1), "source", "phoenix",  "", "") or
            label_replace(vector(1), "source", "soroswap", "", "") or
            label_replace(vector(1), "source", "blend",    "", "")
          )
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/source-stopped.md
          summary: "Low-volume Soroban DEX {{ $labels.source }} silent 24+ hours"
          description: |
            For low-volume Soroban DEXes this is unusual but not
            necessarily an outage — check the contract on
            stellar.expert before paging the indexer team.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/source-stopped.md

      - alert: stellarindex_ingestion_source_stopped_daily_publisher
        expr: |
          sum by (source) (rate(stellarindex_source_events_total[30h])) == 0
          and on (source) stellarindex_source_enabled == 1
          and on (source) (
            label_replace(vector(1), "source", "ecb",  "", "") or
            label_replace(vector(1), "source", "band", "", "")
          )
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/source-stopped.md
          summary: "Daily publisher {{ $labels.source }} silent 30+ hours"
          description: |
            ECB publishes daily; Band publishes on relayer push
            (also roughly daily). 30h gives a one-day buffer plus
            ample slack for upstream cadence variation.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/source-stopped.md

      - alert: stellarindex_ingestion_all_sources_stopped
        # Two branches, and the second is what makes this a P1 that
        # STAYS a P1.
        #
        # `sum(rate(...))` over a series that has STOPPED behaves in two
        # phases. While the dead process's last samples are still inside
        # the 5m window, rate() is 0 and the alert fires correctly at
        # t+3m. Then the samples age out, the series vanishes, and
        # sum(rate()) over nothing is the EMPTY VECTOR — not zero. The
        # alert stops matching and Alertmanager sends a RESOLVED for a
        # SEV-1 while ingestion is still completely down, which reads to
        # a responder as "it fixed itself" (wave-D ALERT-01).
        #
        # absent_over_time takes over at exactly the point rate() gives
        # up — both use a 5m window — so the two branches hand over
        # without a gap, and the page persists until events actually
        # resume. It also covers the case rate() never sees at all: the
        # indexer already being down when Prometheus starts, or
        # Prometheus restarting mid-outage.
        #
        # No new paging scenario: the rate branch ALREADY pages after 3m
        # of zero events, so any restart longer than `for: 3m` pages
        # today. What changes is that the page no longer lies about
        # recovery.
        expr: |
          sum(rate(stellarindex_source_events_total[5m])) == 0
          or
          absent_over_time(stellarindex_source_events_total[5m])
        for: 3m
        labels:
          severity: page
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/all-ingestion-down.md
          summary: "All ingestion sources have stopped (SEV-1)"
          description: |
            No events from any source in the last 3 minutes. API data will go
            stale within 60 s. This is a P1 — check shared upstream (Galexie/MinIO lake)
            or shared storage (Timescale) before restarting the indexer.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/all-ingestion-down.md

      # A MinIO / lake outage must PAGE, and until 2026-09-03 it did not
      # (RV2 #5). Three changes composed into that hole:
      #
      #   1. #371 F3 gave the live-tail read a ~5-minute retry budget, so
      #      the process no longer exits within seconds of the lake going
      #      away.
      #   2. StartLimitBurst 60 / 15 min means a ~5min10s start cycle can
      #      never accumulate enough restarts to park the unit, so
      #      `stellarindex_systemd_unit_failed` (a TICKET, 15m) cannot
      #      fire for it either.
      #   3. The CEX/FX connectors run in the SAME binary and keep
      #      incrementing stellarindex_source_events_total, so
      #      `all_sources_stopped` — which the unit file named as the
      #      cover — stays quiet while no ledger is being ingested at all.
      #
      # What is left without this rule: cursor_stuck (ticket) cannot fire
      # for this cursor, because it joins `on (source)
      # stellarindex_source_enabled`, and "ledgerstream" is a cursor
      # namespace, not a configured source — no such series exists.
      # source_stopped (ticket, 30m window) and data_source_stale
      # (ticket, 1h) eventually notice. No page.
      #
      # So page on the thing that is actually wrong: the LEDGER cursor is
      # not advancing. cmd/stellarindex-indexer advances this gauge only
      # after a ledger is fully processed AND its cursor row is committed
      # (processAndPersistCursor), so it is the honest liveness signal for
      # the whole Galexie -> ledgerstream -> dispatcher -> Postgres path —
      # a lake read failure, a wedged dispatch goroutine and a Postgres
      # outage all stall it, and none of them is "all sources stopped".
      #
      # Two branches, handing over at the same 5m boundary, for the reason
      # all_sources_stopped documents above: while the last samples are
      # still in the window the gauge is flat and the delta branch fires;
      # once the process is gone long enough for the series to age out,
      # the delta branch has nothing to evaluate and absent_over_time
      # takes over. The gauge is BORN on the first successfully committed
      # ledger, so a restart that never gets one leaves it absent — that
      # is the MinIO-outage shape, and it must not read as recovery.
      #
      # ~10 min to page (5m flat window + `for: 5m`). Live ledgers close
      # every ~5-6 s, so five flat minutes is ~50 consecutive misses; a
      # deploy or a Postgres restart is well inside it.
      - alert: stellarindex_ingestion_ledger_stalled
        expr: |
          (
            max_over_time(stellarindex_cursor_last_ledger{source="ledgerstream"}[5m])
            - min_over_time(stellarindex_cursor_last_ledger{source="ledgerstream"}[5m])
          ) == 0
          or
          absent_over_time(stellarindex_cursor_last_ledger{source="ledgerstream"}[5m])
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ledger-ingest-stalled.md
          summary: "Ledger ingest has stalled — the indexer is not committing ledgers (SEV-1)"
          description: |
            stellarindex_cursor_last_ledger{source="ledgerstream"} has not
            advanced for 10 minutes (or the series is gone entirely). No
            new ledger has been fully processed and committed, so every
            on-chain surface is frozen at that ledger while the in-process
            CEX/FX connectors keep publishing — which is why
            `all_sources_stopped` is NOT firing.
            First checks: is the lake readable (MinIO / galexie-live), is
            Postgres accepting writes, is the unit restart-looping?
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ledger-ingest-stalled.md

      - alert: stellarindex_ingestion_cursor_stuck
        expr: |
          increase(stellarindex_cursor_last_ledger[5m]) == 0
          and on (source) stellarindex_source_enabled == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/cursor-stuck.md
          summary: "Cursor for {{ $labels.source }} not advancing"
          description: |
            The persisted cursor hasn't moved in 5 minutes while the source is
            enabled. Typical cause: indexer consumed events but UpsertCursor
            failed silently, or the indexer's cursor-persist path is wedged.

      - alert: stellarindex_ingestion_orphan_events
        expr: sum by (source) (rate(stellarindex_source_orphan_events_total[10m])) > 10/60
        for: 15m
        labels:
          severity: informational
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/orphan-events.md
          summary: "Source {{ $labels.source }} orphan events {{ $value | humanize }}/sec"
          description: |
            Source {{ $labels.source }} has events arriving without their
            correlation partner (Soroswap swap-without-sync, Phoenix
            incomplete 8-field swap) at a rate above 10/min sustained
            15 min. Likely a page-boundary issue in the RPC subscription
            or a contract-schema shift we haven't accounted for.

      - alert: stellarindex_ingestion_decode_error
        expr: rate(stellarindex_source_decode_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: informational
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/decode-errors.md
          summary: "Decode errors on {{ $labels.source }} at {{ $value }}/sec"
          description: |
            Source {{ $labels.source }} failed to decode > 1 event/sec for 5+
            minutes. Usually a contract-event-schema change or a regression
            in the decoder.

      # A decoder CRASHED on an input (#371 F1). The dispatcher recovers
      # the panic, skips that one input, counts it as a decode error and
      # lets the ledger complete — which is the only design that does not
      # turn one decoder's bug into an all-source ingest outage (before
      # the guard the process exited, systemd restarted it onto the same
      # cursor, and StartLimitBurst restarts later the unit parked in
      # `failed`). The trade is only sound if the skip is LOUD, so this
      # pages on the FIRST occurrence.
      #
      # Raw value, not increase(): the counter is process-lifetime and a
      # poison input usually panics ONCE, so the series is born at 1 and
      # never moves again — increase() over a series that appears inside
      # the lookback window evaluates to 0 and would never fire. `> 0`
      # also keeps firing until the fixed binary is deployed, which is
      # correct: the decoder is still dropping every event of that shape.
      - alert: stellarindex_decoder_panicked
        expr: stellarindex_decoder_panics_total > 0
        for: 0m
        labels:
          severity: page
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/decoder-panicked.md
          summary: "decoder {{ $labels.source }} panicked — its events are being SKIPPED (#371 F1)"
          description: |
            The {{ $labels.source }} decoder panicked on a ledger input. The
            dispatcher skipped that input and ingest continued, so the cursor
            is advancing and every other source is unaffected — but this
            decoder will keep dropping every event of that shape until a
            fixed binary ships. The raw event is still in the ClickHouse
            lake, so nothing is lost permanently. Runbook: find the
            `decoder panicked` log line (it carries ledger / tx_hash /
            op_index / stack), fix the decoder, then re-derive the window
            with projector-replay or ch-rebuild.

      # Oracle capture-totality (docs/design/oracle-capture-totality-design.md):
      # an indexed on-chain oracle (Reflector / RedStone / Band) is
      # publishing a symbol / feed_id the canonical allow-list does not
      # map. Until the decoders emit `raw:` rows those slots are DROPPED
      # from the price surface; afterwards they are recorded verbatim
      # and this alert means "extend the allow-list / feed registry".
      # Either way it is a mapping gap only a code change closes — the
      # 2026-07-24 RedStone expansion lost ~5,600 events this way, and
      # r1 carried 7,794 dropped reflector slots with NO consumer of this
      # counter (cold audit 2026-08-04). 25h window: band publishes once
      # a day, so a trailing window shorter than its cadence flaps daily.
      # An unmapped symbol recurs on EVERY event of that source until the
      # registry catches up, so any increase is a persistent gap, not a
      # one-off. Ticket, not page: nothing on the serving path breaks,
      # but the loss widens until acted on.
      - alert: stellarindex_ingestion_oracle_unknown_symbols
        expr: sum by (source) (increase(stellarindex_source_unknown_symbols_total[25h])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-unknown-symbols.md
          summary: "Oracle {{ $labels.source }} is publishing symbols the canonical allow-list does not map"
          description: |
            stellarindex_source_unknown_symbols_total{source="{{ $labels.source }}"}
            increased in the trailing 25 h. The oracle decoder met a symbol /
            feed_id with no canonical asset mapping. Until the decoders
            record such slots under `raw:` they are dropped from the price
            surface; either way the allow-list (ADR-0010 / 0014 / 0028) or
            the RedStone feed registry needs extending, and the affected
            ledgers need a replay once it is. See the runbook.

      # #291: a slot whose feed_id the record layer cannot represent at
      # all (empty / >64 bytes / a byte outside printable ASCII) is
      # DROPPED — not even a raw: row lands. Its own alert, not a fold
      # into the unknown-symbols one above: that alert's remedy is
      # "extend the registry, then promote the raw rows in place", and
      # there are no raw rows here to promote — this needs the registry
      # entry AND a replay. Only RedStone can realistically fire it
      # (feed_ids are ScString; Reflector/Band symbols are ScSymbol).
      # Same 25h/30m shape as its sibling so a daily-cadence oracle
      # cannot flap it.
      - alert: stellarindex_ingestion_oracle_unrepresentable_symbols
        expr: sum by (source) (increase(stellarindex_source_unrepresentable_symbols_total[25h])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-unknown-symbols.md
          summary: "Oracle {{ $labels.source }} published a feed_id the record layer cannot store"
          description: |
            stellarindex_source_unrepresentable_symbols_total{source="{{ $labels.source }}"}
            increased in the trailing 25 h. The decoder met a symbol /
            feed_id that fails even the permissive raw: validator (empty,
            >64 bytes, or a byte outside printable ASCII), so that slot
            was dropped with NO row written — unlike the unknown-symbols
            case, there is no raw: row to promote later. Closing it needs
            a feed-registry / allow-list entry AND a replay of the
            affected ledgers. See the runbook.

      - alert: stellarindex_ingestion_discovery_drops
        expr: increase(stellarindex_discovery_dropped_hits_total[10m]) > 0
        for: 10m
        labels:
          severity: informational
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/discovery-drops.md
          summary: "Discovery sink is dropping hits"
          description: |
            The SEP-41 discovery sink dropped at least one hit in the last
            10 minutes and continued doing so for 10 minutes. This does not
            stall the main ingest path, but discovery coverage is degrading
            under recorder pressure or buffer saturation.

      # audit-2026-07-16 C4-3: the soroswap-router + defindex persist
      # paths used to log a Warn without bumping any counter, so a
      # dropped swap / vault-flow row was invisible to metrics. Those
      # sites now increment source_insert_errors_total like every sibling
      # case; this alert is the SENSITIVE (rate > 0) tripwire on exactly
      # those money-flow kinds — the existing stellarindex_ingestion_
      # insert_errors alert only fires above 0.1/s, so a low-rate silent
      # drop would slip past it.
      - alert: stellarindex_ingestion_persist_drop
        expr: increase(stellarindex_source_insert_errors_total{kind=~"soroswap_router_swap|defindex_flow_strategy|defindex_flow_vault"}[15m]) > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/insert-errors.md
          summary: "Persist drops on {{ $labels.source }}/{{ $labels.kind }} (any rate)"
          description: |
            A soroswap-router or defindex persist write failed for
            {{ $labels.source }}/{{ $labels.kind }} in the last 15 minutes.
            These are DEX-swap / vault-flow rows — even a low-rate drop
            matters, and this path was previously counter-less (the drop
            was log-only and invisible). If the write went through the
            projector it is retried (watch stellarindex_projector_events_
            decoded_total{outcome="sink_retry"}); if it went through the
            dispatcher drain the row was dropped. Check Timescale health
            and the poison-row logs.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/insert-errors.md

      # audit-2026-07-16 C4-3: discovery Recorder.Record failures were
      # log-only inside the async sink, so a recorder outage silently
      # stopped discovered_assets from growing. Now counted +
      # alertable. Informational (best-effort: the contract re-appears
      # on a later event), same posture as discovery_drops.
      - alert: stellarindex_ingestion_discovery_record_failures
        expr: increase(stellarindex_discovery_record_failures_total[10m]) > 0
        for: 10m
        labels:
          severity: informational
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/discovery-drops.md
          summary: "Discovery recorder writes are failing"
          description: |
            The discovery async sink's Recorder.Record write failed at
            least once in the last 10 minutes and kept failing for 10
            minutes. discovered_assets stops growing while this persists —
            usually a Postgres outage or a discovered_assets schema/constraint
            problem. Best-effort by design (the contract re-appears on a
            later event), so this is a coverage-degradation signal, not
            data loss.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/discovery-drops.md

      - alert: stellarindex_ingestion_ch_live_sink_drops
        expr: increase(stellarindex_ch_live_sink_ledgers_total{outcome="dropped"}[10m]) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-live-sink-drops.md
          summary: "ClickHouse live-sink is dropping ledger extracts"
          description: |
            The real-time CH dual-sink dropped at least one whole ledger
            extract in the last 10 minutes and kept doing so for 10
            minutes. Drops are healed by the ch-live-catchup timer, so
            this is "the heal path is being exercised abnormally" —
            check CH health and sink buffer pressure before the lake
            tail integrity degrades (ADR-0041).

      - alert: stellarindex_ingestion_ch_live_sink_drops_sustained
        expr: increase(stellarindex_ch_live_sink_ledgers_total{outcome="dropped"}[1h]) > 0
        for: 1h
        labels:
          severity: page
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-live-sink-drops.md
          summary: "ClickHouse live-sink drops sustained for 1h — heal path losing the race"
          description: |
            Ledger extracts have been dropping continuously for an hour.
            ch-live-catchup is either down or cannot keep up; the
            certified-lake tail (the coverage claim's substrate) is at
            risk. Treat as data-loss-risk (ADR-0041).

      # #371 F6: `errored` had no alert in either tree — both live-sink
      # rules matched outcome="dropped" only, and `errored` is a
      # different fault. A drop is the sink shedding a ledger it
      # accepted; an error is either ExtractLedger failing before the
      # sink is even offered the ledger (cmd/stellarindex-indexer/
      # main.go, the sampled `ch extract` WARN) or the sink's own
      # Add/Flush failing. The remedies differ, so this is its own rule
      # rather than a widened matcher on the existing page — redefining
      # a page an operator already reads is not a bug fix.
      #
      # Range [30m] against `for: 15m` deliberately: a single step must
      # stay true for longer than the pending period, otherwise the
      # very fault this exists for (one meta-version break, then a dead
      # indexer) resolves out from under itself.
      - alert: stellarindex_ingestion_ch_live_sink_errors
        expr: increase(stellarindex_ch_live_sink_ledgers_total{outcome="errored"}[30m]) > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-live-sink-errors.md
          summary: "ClickHouse live-sink is erroring on ledger extracts"
          description: |
            stellarindex_ch_live_sink_ledgers_total{outcome="errored"}
            advanced in the last 30 minutes. Either
            clickhouse.ExtractLedger failed on a ledger (nothing was
            handed to the sink at all — a decode / TransactionMeta
            version break fails EVERY ledger in lock-step) or the
            sink's own Add/Flush errored. Unlike `dropped`, which is
            the sink shedding load it did see, this is the lake's
            live edge not being written. ch-live-catchup heals it
            only if a re-read succeeds; a systematic extract break
            leaves the hole, and internal/projector clamps to the
            contiguous watermark behind it.

      # 2026-07-06 Postgres-outage fix (ADR-0041): the trade sink now
      # RETRIES an infrastructure-classified insert failure (connection
      # refused/reset, PG restarting) with backpressure instead of
      # dropping the write. While it retries, the on-chain drain
      # goroutine is blocked, so the ledger cursor STALLS (nothing lost)
      # but the served tier is frozen. A sustained retry rate is the
      # early signal that Postgres is unreachable and ingest is
      # backpressured. Ticket, not page: no data is being lost, and
      # cursor-stuck / all-sources-stopped page separately if this turns
      # into a full outage.
      - alert: stellarindex_ingestion_trade_insert_backpressure
        expr: sum(rate(stellarindex_trade_insert_retries_total{outcome="retry"}[5m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/trade-insert-backpressure.md
          summary: "Trade sink retrying under backpressure — Postgres write path blocked"
          description: |
            The trade sink has been retrying infrastructure-classified
            insert failures (connection refused/reset, PG restarting) for
            ≥ 10 min. The on-chain ledger cursor is HELD (not advancing)
            until the writes land — nothing is dropped, but the served
            tier is frozen and external (CEX/FX) price freshness is
            degrading (watch stellarindex_trade_insert_buffer_depth).
            Almost always a Postgres outage/restart.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/trade-insert-backpressure.md

      - alert: stellarindex_ingestion_insert_errors
        expr: sum by (source, kind) (rate(stellarindex_source_insert_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/insert-errors.md
          summary: "Insert errors on {{ $labels.source }}/{{ $labels.kind }} at {{ $value }}/sec"
          description: |
            Source {{ $labels.source }} failed to persist {{ $labels.kind }}
            events (>6/min sustained for 5 min). Storage layer is rejecting
            writes — usually Timescale outage, disk-full, or a schema
            mismatch after a migration.

            Post-2026-07-06 (ADR-0041), INFRASTRUCTURE faults no longer
            drop — they retry with backpressure (see
            trade_insert_backpressure). So a firing here means GENUINE
            loss: a permanent data fault (kind=trade) or external-buffer
            overflow (kind=dropped). Escalate quickly if the rate is high.

      # ADR-0041 companion to trade_insert_backpressure above: kind="dropped"
      # is GENUINE, PERMANENT loss — the external (CEX/FX) retry buffer
      # trimmed its oldest entry because an infra fault (sick DB) outlasted
      # the bounded buffer, or a per-row isolation pass hit a permanent data
      # fault (externalRetryBuffer.trimOldestLocked / drainOnce in
      # internal/pipeline/trade_sink.go). The existing
      # stellarindex_ingestion_insert_errors alert above only fires above
      # 0.1/s (>6/min) summed across EVERY kind fleet-wide, so a slow
      # trickle of buffer-overflow drops during a sustained-but-not-total
      # DB outage — exactly "the sink is blocking on a sick DB" — could sit
      # below that threshold indefinitely and never surface. Sensitive (any
      # nonzero increase), same posture as stellarindex_ingestion_persist_drop.
      - alert: stellarindex_ingestion_trade_buffer_drop
        expr: increase(stellarindex_source_insert_errors_total{kind="dropped"}[15m]) > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/trade-insert-backpressure.md
          summary: "External trade(s) permanently dropped on {{ $labels.source }} — buffer overflow or data fault during backpressure"
          description: |
            stellarindex_source_insert_errors_total{source="{{ $labels.source }}",kind="dropped"}
            incremented: at least one external (CEX/FX) trade was
            permanently dropped — either the bounded retry buffer
            overflowed while Postgres was unreachable (see
            stellarindex_ingestion_trade_insert_backpressure) or a
            permanent data fault surfaced during per-row isolation. This
            IS genuine, unrecoverable loss for that trade (vendor-
            refillable, not lake-refillable). Any nonzero rate needs eyes —
            the coarse stellarindex_ingestion_insert_errors alert only
            trips above 0.1/s fleet-wide and can miss a slow trickle.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/trade-insert-backpressure.md

      # Live r1 evidence on 2026-05-28 surfaced a cursor-replay
      # pattern: trade_inserts_total{source=sdex} ticked at 157/min
      # while the trades hypertable's max(ts) was 11 h old — every
      # attempt was an ON CONFLICT DO NOTHING short-circuit. The
      # `_insert_errors` alert above doesn't fire (no errors); the
      # `_source_stopped` alert above doesn't fire (events are still
      # being decoded); but the database is silently 0% fresh.
      #
      # The trade_insert_outcome_total counter (added 2026-05-28)
      # exposes the new-vs-duplicate split directly. This alert
      # fires when a source produces a sustained dedupe-only stream:
      # nonzero duplicate rate AND zero new rate for 10 min. Ticket
      # severity (not page) because the symptom is degraded
      # freshness, not outage.
      # 2026-08-29 (#302): the second clause was
      # `and on (source) rate(new[10m]) == 0`, which needs the
      # outcome="new" CHILD SERIES to exist — and
      # trade_insert_outcome_total is call-site-seeded
      # (WithLabelValues on the insert path) with a config-dependent
      # `source` label that internal/obs deliberately does not
      # pre-seed. A source whose every insert since process start hit
      # the conflict path therefore never creates that child, the join
      # matches nothing, and the alert stayed SILENT in exactly the
      # post-restart replay-flood it exists for. `unless on (source)
      # rate(new[10m]) > 0` treats an absent child and a zero rate
      # alike — the same absent-series idiom the insert_stale sibling
      # below uses.
      - alert: stellarindex_ingestion_duplicate_flood
        expr: |
          sum by (source) (rate(stellarindex_trade_insert_outcome_total{outcome="duplicate"}[10m])) > 0.5
          unless on (source)
          sum by (source) (rate(stellarindex_trade_insert_outcome_total{outcome="new"}[10m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-duplicate-flood.md
          summary: "Source {{ $labels.source }} producing duplicates only (cursor replay or stuck-tip)"
          description: |
            Source {{ $labels.source }} has been attempting >0.5
            inserts/sec for ≥10 min but EVERY attempt hits
            `ON CONFLICT DO NOTHING` — no new rows are landing in
            the trades hypertable. The indexer cursor advances but
            the data underneath it is stale.

            Likely root causes: cursor-state corruption (cursor
            jumped past data without persisting), a stale event
            channel feeding the sink from an old replay loop, or a
            back-pressure event that lost in-flight events.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-duplicate-flood.md

      # Unit-ratio trade sentinel (2026-07-07 Phoenix incident): a
      # decoder field-mapping bug swapped/collapsed base_amount and
      # quote_amount for every Phoenix trade, landing 237k rows at an
      # exact 1:1 price for MONTHS — ADR-0033 completeness checks
      # verify presence, not economic plausibility, so nothing caught
      # it. stellarindex_dex_trade_unit_ratio_total (emitted from
      # internal/storage/timescale InsertTrade + BatchInsertTrades)
      # bumps per landed ON-CHAIN trade whose base_amount exactly
      # equals quote_amount (CEX/FX excluded — they scale amounts
      # differently). Legitimate 1:1 trades are COMMON on parity pairs
      # (yUSDC/USDC, yETH/ETH wrapper redemptions; EUR-stable crosses
      # — 2026-07-31: a busy wrapper morning tripped the old absolute
      # threshold on sdex with ~2% of flow). The decode-bug fingerprint
      # this alert exists for (2026-07-07 Phoenix field-mapping) makes
      # EVERY trade 1:1, so alert on the FRACTION of the source's flow
      # (>50%) with a >25 min-volume guard. Ticket, not page — a
      # data-quality signal, not an outage.
      - alert: stellarindex_dex_trade_unit_ratio_detected
        expr: |
          (
            sum by (source) (increase(stellarindex_dex_trade_unit_ratio_total[30m])) > 25
          )
          and
          (
            sum by (source) (increase(stellarindex_dex_trade_unit_ratio_total[30m]))
              / sum by (source) (increase(stellarindex_trade_inserts_total[30m])) > 0.5
          )
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/dex-trade-unit-ratio.md
          summary: "Source {{ $labels.source }} producing a sustained stream of unit-ratio (1:1) trades"
          description: |
            Source {{ $labels.source }} has landed > 25 on-chain DEX
            trades with base_amount == quote_amount in the last 30
            minutes. An occasional equal-value cross-asset fill is
            normal; a sustained stream at this rate is the signature
            of the 2026-07-07 Phoenix decoder field-mapping bug that
            silently collapsed every trade's price to 1:1 for months.

            Check the source's recent trades ratio distribution, then
            the decoder's amount field mapping against the contract's
            event definition.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/dex-trade-unit-ratio.md

      # Timestamp-shape sibling to the rate-shape duplicate_flood
      # above. Fires when a source's last successful INSERT is over
      # 1 h old even though source_enabled=1. Doesn't require
      # sustained insert attempts to trigger — works for low-volume
      # sources (phoenix, comet) where the rate-shape alert never
      # crosses its 0.5/s threshold. The 1 h budget tolerates
      # legitimately-bursty sources without false-firing.
      - alert: stellarindex_ingestion_source_insert_stale
        # 1 h budget for normal sources; 24 h for the genuinely-sparse Soroban
        # AMMs (comet, phoenix). Comet is tiny — ~20-70 trades/day, bursty —
        # so multi-hour quiet stretches are normal and the flat 1 h budget
        # false-fired (2026-06-20); the 6 h budget that replaced it ALSO
        # false-fired (2026-08-05: phoenix's measured 30-day max gap is
        # 8h28m and a genuine 12h market lull tripped it while the lake
        # showed zero swap events on any known or unknown pool). 24 h
        # still catches a real day-scale stall; the ADR-0033 completeness
        # verdict is the correctness net. Tune the regex as new sparse
        # sources appear.
        expr: |
          (
            time() - stellarindex_source_last_insert_unix > 3600
            and on (source) stellarindex_source_enabled == 1
            unless on (source) stellarindex_source_last_insert_unix{source=~"comet|phoenix"}
          )
          or
          (
            time() - stellarindex_source_last_insert_unix{source=~"comet|phoenix"} > 86400
            and on (source) stellarindex_source_enabled == 1
          )
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-duplicate-flood.md
          summary: "Source {{ $labels.source }} hasn't landed a new row in >1h"
          description: |
            stellarindex_source_last_insert_unix{source="{{ $labels.source }}"}
            hasn't advanced in over an hour while the source is
            still enabled. Same root-cause cluster as the
            duplicate-flood alert; the timestamp-shape signal
            catches low-volume sources whose insert rate sits
            under the rate-shape alert's 0.5/s threshold.

            Cross-check stellarindex_source_last_event_unix — if the
            dispatcher is still matching events, the gap is the
            stuck-tip diagnostic (cursor advances, data doesn't).

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingestion-duplicate-flood.md

      # Data-derived gap detector. The cursor-derived density
      # projection in /v1/diagnostics/ingestion measures process
      # state ("did we walk this ledger") and can read 100% while
      # data is missing — the F-0020 audit found that exact pattern,
      # with the soroban_events writer halted across a 92,737-ledger
      # contiguous window. This alert fires on the data-derived
      # gauge instead: a sustained contiguous gap of >1000 ledgers
      # in soroban_events that doesn't close on its own implies an
      # ingest halt that needs operator action.
      #
      # Threshold: max_gap_size > 1000 sustained 15 min. The 5-min
      # detector cadence × 3 cycles ensures the alert isn't fooled
      # by the brief window between cascade-clear + targeted-backfill
      # completion. 1000 ledgers (~1.5 h network time) filters out
      # legitimate no-Soroban-activity stretches.
      - alert: stellarindex_ingest_gap_detected
        expr: |
          max by (source) (stellarindex_ingest_gap_max_size_ledgers) > 1000
        for: 15m
        labels:
          severity: page
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingest-gap-detected.md
          summary: "Data-coverage gap of {{ $value }} ledgers in source={{ $labels.source }}"
          description: |
            max by (source) (stellarindex_ingest_gap_max_size_ledgers{source="{{ $labels.source }}"})
            = {{ $value }} ledgers — a contiguous block of {{ $labels.source }}
            ingest is missing in one of its per-source hypertables.
            Cursor inventory may read fine; this alert reads the data
            tables directly.

            Resolve via:
              stellarindex-ops find-data-gaps --config /etc/stellarindex.toml --source {{ $labels.source }} --output text
            for per-source diagnosis, then for Soroban-derived sources:
              stellarindex-ops projector-replay --source <name> --from F  (per-source projection cursor rewind; ADR-0032)
            For non-projected sources (sdex / soroban-events):
              stellarindex-ops backfill --source <name> --from F --to T

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingest-gap-detected.md

      # Meta-alert: gap detector itself is wedged for a target. Fires
      # when a (source, table)'s last SUCCESSFUL scan is older than 8h
      # (comfortably above the 6h sdex/soroban ScanCadence) OR the
      # detector metric is entirely absent (aggregator down).
      #
      # Keyed off the last-success TIMESTAMP gauge, not
      # rate(runs_total{outcome="ok"}). The heavy targets scan once per
      # 6h, so their ok counter is pinned at 1 within a process life;
      # across restarts the value is 1 → 1, which Prometheus cannot see
      # as a reset, so rate() read a flat line and false-fired for >7h
      # even though every scan succeeded (incident 2026-07-06). A
      # wall-clock gauge is reset-proof: a healthy startup scan re-stamps
      # it to now(), clearing staleness immediately.
      # 2026-08-28 (found verifying PR #258): the absent_over_time clause
      # is satisfied by the ERROR outcome of runs_total just as well as
      # the ok one, and a target that has never once succeeded in this
      # process life (no cursor row → nothing re-emits the stamp) has NO
      # last_success series for the staleness clause to age. Such a
      # target — soroban_events failing every 6h cycle on
      # statement_timeout — fired NOTHING. Third clause: the target's
      # error counter is present now AND 8h ago (so a fresh process's
      # first failed scan doesn't ticket; identical labels across a
      # restart, so the previous process's errors count) and no
      # last_success stamp has been seen for that (source, table) in 8h.
      # Presence rather than increase(): the heavy targets retry every
      # 6h, so the error counter is as rate()-hostile as the ok one.
      - alert: stellarindex_ingest_gap_detector_silent
        expr: |
          (time() - stellarindex_ingest_gap_detector_last_success_unix) > 28800
          OR
          absent_over_time(stellarindex_ingest_gap_detector_runs_total[15m]) == 1
          OR
          (
            (
              stellarindex_ingest_gap_detector_runs_total{outcome="error"} > 0
              and on (source, table)
              stellarindex_ingest_gap_detector_runs_total{outcome="error"} offset 8h > 0
            )
            unless on (source, table)
            count_over_time(stellarindex_ingest_gap_detector_last_success_unix[8h])
          )
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingest-gap-detector-silent.md
          summary: "Data-gap detector hasn't scanned {{ $labels.source }}/{{ $labels.table }} successfully in >8h (above the 6h sdex/soroban scan cadence)"
          description: |
            The aggregator's data-gap detector goroutine appears
            stuck or absent for a target. Without it the operator-facing
            `stellarindex_ingest_gap_max_size_ledgers` gauge stops
            updating — gauges read stale value until restart.

            Three clauses: (1) the per-target last-success stamp is
            older than 8h; (2) the runs_total metric is absent for 15m
            (aggregator fully down); (3) the target has errored both now
            and 8h ago and has had NO last-success stamp in 8h — a
            scan that has never once succeeded in this process life
            (no cursor row → nothing to re-emit) produces no stamp for
            clause 1 to age, and its error counter satisfies clause 2's
            "runs_total present", so before 2026-08-28 that target
            never fired anything.

            Likely causes: aggregator binary crash-looping; Postgres
            connection-pool exhaustion causing every scan to hit the
            per-target Go timeout / SQL statement_timeout and increment
            outcome=error; deploy regression that removed the worker
            wiring. Grep the aggregator log for
            `gap-detector: scan failed` (a non-ok outcome is logged
            loudly with elapsed_s so a timeout is unmistakable).

            Cross-check: aggregator service `active`?
            postgres_exporter targets `up`?
            `stellarindex_ingest_gap_detector_runs_total{outcome="error"}`
            climbing?

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ingest-gap-detector-silent.md

      # ── C6-020 (audit-2026-07-23): long-running ops jobs ──────────
      # There was NO backfill-progress alert in either rule tree — every
      # grep hit was runbook prose. Long backfills are the dominant ops
      # activity right now (Phase A recompress, movement backfills), they
      # run for days, and a HUNG one was indistinguishable from a working
      # one unless somebody happened to be tailing the journal.
      #
      # internal/ops/opsutil.JobHeartbeat publishes three things
      # separately, on purpose, because they need different responses:
      #   running        1 while the process is alive
      #   heartbeat_unix rewritten on a 60s TIMER, independent of work
      #   progress_total units completed
      #
      # so the two alerts below are genuinely distinct failure modes and
      # not two thresholds on one signal.
      #
      # `running == 1` in both exprs is load-bearing: after a clean exit
      # the job stamps running=0 and progress stops advancing forever, so
      # without that guard a finished backfill would alert eternally.
      - alert: stellarindex_ops_job_heartbeat_stale
        # Operand ORDER is load-bearing, not style: `and` returns the LEFT
        # side's sample value, so with `running == 1` on the left the
        # summary's {{ $value }} rendered the flag (1 → "1s ago") instead
        # of the staleness. Caught by
        # deploy/monitoring/rule-tests/ops-job_test.yml.
        #
        # The JOIN KEY is `(ops_job, instance)` and both halves matter.
        #
        # `ops_job` because `job` is a Prometheus reserved label: node_exporter
        # is scraped with honor_labels unset, so a textfile that exposed
        # `job="ch-backfill"` arrives as `job="node_exporter"` with the real
        # value demoted to `exported_job`. Joining `on (job)` therefore matched
        # EVERY ops job on the host as one group — a cleanly-finished
        # `backfill` (running=0, heartbeat frozen) joined against a healthy
        # running `ch-backfill` and ticketed forever. Two .prom files per host
        # is the steady state: the heartbeat is wired into both subcommands.
        #
        # `instance` because without it a job running on host B satisfies host
        # A's `running == 1` guard, so a genuinely dead job on A is masked by a
        # healthy namesake on B. Multi-host is exactly what this tree is for.
        #
        # `pid` because the emitter's concurrency guard (opsutil.claimPath)
        # gives the SECOND concurrent run of a subcommand its own
        # `<file>.pid<N>.prom`, carrying an extra `pid` label. Without pid in
        # the join, the flock winner and that sibling share a match key
        # exactly — so a winner that finished cleanly gets "rescued" by the
        # still-running loser and tickets forever. Same cross-match class the
        # `ops_job` rename fixed one scope out. PromQL treats an absent label
        # as "", so the primary (no pid) matches only the primary and a .pid
        # sibling only its own; the primary's series identity is unchanged,
        # which is why pid is NOT emitted unconditionally.
        expr: |
          (time() - stellarindex_ops_job_heartbeat_unix) > 900
          and on (ops_job, instance, pid)
          stellarindex_ops_job_running == 1
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md
          summary: "ops job {{ $labels.ops_job }} says it is running but stopped heartbeating {{ $value | humanizeDuration }} ago"
          description: |
            The job's textfile still claims running=1 but the 60-second
            liveness ticker has not written for 15+ minutes. The ticker
            runs independently of progress, so this is NOT "the job is
            busy" — the PROCESS IS GONE: OOM-kill, SIGKILL, host reboot,
            or the terminal that owned it closed.

            The range it was walking is NOT complete. Confirm with
            `systemctl status` / `ps`, then re-run the same window — the
            backfills are idempotent (ReplacingMergeTree on the CH side,
            ON CONFLICT on the served side), so re-running is free and
            leaving the hole is not.

            The stale textfile persists until the next run overwrites it;
            that is deliberate (a job that died must not become invisible
            just because nothing is running).

      - alert: stellarindex_ops_job_no_progress
        # Same operand-order and (ops_job, instance, pid) join discipline as
        # the sibling above — see its comment for why none of the three is
        # optional.
        expr: |
          changes(stellarindex_ops_job_progress_total[30m]) == 0
          and on (ops_job, instance, pid)
          stellarindex_ops_job_running == 1
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md
          summary: "ops job {{ $labels.ops_job }} is alive but has completed no work for 30+ minutes"
          description: |
            The process is heartbeating (so it has not died) but its
            completed-units counter has not moved in 30 minutes. The job
            is HUNG, not dead: a blocked S3 GET with no deadline, a
            ClickHouse/Postgres write waiting on a lock, or a stuck
            captive-core.

            Distinguish from a genuinely slow window by checking the
            cursor: `stellarindex_ops_job_progress_cursor{ops_job="…"}`
            frozen at the same ledger across scrapes is a hang. Take a
            goroutine dump / strace before killing it — a hang here has
            recurred (galexie wedge, 2026-07-05) and the stack is the
            only evidence of which read blocked.
