---
# Supply-refresh alerts. Pair with the aggregator-resident supply
# refresher in cmd/stellarindex-aggregator.
#
# Scrape source: the aggregator's Prometheus /metrics endpoint
# emits stellarindex_aggregator_supply_refresh_total{outcome=…},
# defined in internal/obs/metrics.go and incremented by
# runSupplyRefresh on every tick.
#
# Distinct from the systemd-timer-path alerts in
# deploy/monitoring/rules/supply-snapshot.yml — those consume the
# textfile metrics emitted by internal/supply/textfile.go and only
# fire when operators run the timer-driven path. These alerts fire
# on the goroutine path operators use when
# `[supply] aggregator_refresh_enabled = true`.
#
# Alert family:
#
#   - `stellarindex_aggregator_supply_refresh_stalled` — the
#     refresher hasn't recorded a successful tick in ≥ 30 min.
#     With the default 5-min cadence that's 6 missed ticks.
#     Either the goroutine is wedged (aggregator deadlock) or
#     every recent tick has failed.
#
#   - `stellarindex_aggregator_supply_refresh_error_dominant` —
#     for ≥ 30 min, the rate of error outcomes (no_ledger /
#     no_observation / compute_error / write_error) exceeds the
#     rate of `ok` outcomes. Indicates the refresher is running
#     but consistently producing wrong results — operator config
#     drift, observer not backfilled, or storage layer broken.
#
#   - `stellarindex_aggregator_supply_refresh_dormant_fleet` — two or
#     more assets report `dormant` together for ≥ 30 min. The freshness
#     anchor is a producer-wide watermark, so shared dormancy means a
#     component observer stalled, not that the assets went quiet.
#
#   - `stellarindex_sep41_supply_rollup_no_cursor` — a watched
#     SEP-41 contract's rollup has been pinned for ≥ 30 min because
#     the projector's sep41_supply cursor is absent, so its supply
#     reads run the full-history scan.

groups:
  - name: stellarindex.supply_refresh
    interval: 60s
    rules:

      - alert: stellarindex_aggregator_supply_refresh_stalled
        # Fires when NO successful (ok) tick has been recorded across any
        # watched asset in the last 30m. Uses changes()==0 on the counter,
        # NOT time()-timestamp(...): timestamp() returns the SAMPLE's scrape
        # time (≈now while the series is still scraped), so a
        # time()-timestamp(...) form evaluates to ≈0 and never fires.
        # Fleet-wide sum() (not per-asset): a single healthy asset means the
        # goroutine is alive; per-asset failure is _error_dominant's job. The
        # "never ticked at all" case (series absent) is _never_initialized's.
        expr: |
          sum(changes(stellarindex_aggregator_supply_refresh_total{outcome="ok"}[30m])) == 0
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: supply
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply.md#stellarindex_aggregator_supply_refresh_stalled
          summary: "supply refresher has recorded no successful tick across any watched asset in the last 30m (cadence 5m)"
          description: |
            The aggregator-resident supply refresher emits
            stellarindex_aggregator_supply_refresh_total{outcome="ok"}
            on every successful per-asset tick. No `ok` increments
            in 30+ minutes means either the goroutine is wedged
            (aggregator deadlock), the orchestrator hasn't started,
            or every recent tick across every watched asset has
            failed. /v1/assets/{id}'s F2 fields go increasingly
            stale. Runbook: check aggregator process health first;
            inspect logs for recurring outcome labels; route to the
            error_dominant runbook if every tick is genuinely
            failing.

      # Same blind spot as supply-snapshot's `_stale`: when no
      # `outcome="ok"` increment has ever happened (aggregator
      # running but `[supply] aggregator_refresh_enabled = false`,
      # or the orchestrator hasn't started any supply tick yet),
      # the metric series doesn't appear in /metrics — Prometheus
      # counters with no increments are absent, not zero — so
      # `_stalled` evaluates to "no data" and never fires.
      #
      # 36 h matches the cushion used in supply-snapshot's
      # `_never_initialized`: a brand-new aggregator deployment has
      # plenty of time to fire its first tick; a deployment that's
      # been up for over a day without one is genuinely uninitialized.
      - alert: stellarindex_aggregator_supply_refresh_never_initialized
        expr: |
          absent_over_time(stellarindex_aggregator_supply_refresh_total{outcome="ok"}[36h]) == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: supply
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply.md#stellarindex_aggregator_supply_refresh_never_initialized
          summary: "supply refresher (goroutine path) has never recorded a successful tick"
          description: |
            stellarindex_aggregator_supply_refresh_total{outcome="ok"}
            has been absent for ≥ 36 h. Either
            `[supply] aggregator_refresh_enabled = false` (the
            default — operator hasn't opted into the goroutine
            path), or the orchestrator hasn't fired its first tick.
            Distinct from `_stalled` (which requires the metric to
            have existed at some point); together they cover both
            "was working, stopped" and "never worked." Runbook is
            the supply-refresh page; the timer-path sibling is
            `stellarindex_supply_snapshot_never_initialized`. Only
            enabling the goroutine path clears this one; r1 runs
            both paths.

      - alert: stellarindex_aggregator_supply_refresh_error_dominant
        # Aggregate PER ASSET (`by (asset_key)`), not fleet-wide — a
        # single asset failing 100% of its ticks could never push the
        # fleet-wide fraction past 50% while healthy siblings dilute it,
        # so a permanently-stale asset would be un-alertable. Also exclude
        # the benign `dormant` outcome (a dormant asset's last observation
        # IS current — accepted, not an error) and `missing_baseline`
        # (a SAC-wrapper whose pre-Soroban opening
        # balance hasn't been seeded — a range-scoped condition fixed by
        # `stellarindex-ops supply seed-sep41-genesis`, not corruption; a
        # genuine post-seed negative still surfaces as `compute_error`).
        expr: |
          (
            sum by (asset_key) (rate(stellarindex_aggregator_supply_refresh_total{outcome!~"ok|dormant|missing_baseline"}[5m]))
            /
            (sum by (asset_key) (rate(stellarindex_aggregator_supply_refresh_total[5m])) > 0)
          ) > 0.5
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: supply
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply.md#stellarindex_aggregator_supply_refresh_error_dominant
          summary: "supply refresher: > 50% of ticks non-ok for asset {{ $labels.asset_key }} for ≥ 30m"
          description: |
            More than half of the supply refresher's ticks for
            asset {{ $labels.asset_key }} are failing — outcome ∈
            {no_ledger, no_observation, compute_error, write_error,
            stale_component, missing_freshness, static_reserve} (the
            last is XLM published from the dated static reserve map
            because the live account observer could not answer; the benign `dormant`
            and `missing_baseline` outcomes are excluded). Steady-state
            should be mostly `ok`; a single asset stuck here is usually a
            stalled freshness producer (sustained `stale_component`) or
            operator config drift (watched_classic_assets parse errors,
            sac_wrappers map missing entries). A SAC-wrapper stuck on
            `missing_baseline` (visible in the per-asset series, not this
            alert) needs `stellarindex-ops supply seed-sep41-genesis`.
            Runbook: split by outcome, inspect the dominant kind; for
            sustained `stale_component` on one asset, see
            WithStaleComponentLedgersFor.

      - alert: stellarindex_aggregator_supply_refresh_dormant_fleet
        # MinComponentLedger is the producer's watermark (MAX(ledger) over the
        # observer tables), not a per-asset age, so every asset fed by one
        # producer freezes on the same tick. `dormant` is excluded from
        # _error_dominant, which would otherwise stay silent until the 24h
        # dormancy horizon flips these assets to stale_component.
        expr: |
          count(
            sum by (asset_key) (rate(stellarindex_aggregator_supply_refresh_total{outcome="dormant"}[15m])) > 0
          ) > 1
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: supply
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply.md#stellarindex_aggregator_supply_refresh_dormant_fleet
          summary: "supply refresher: {{ $value }} assets reporting dormant together for ≥ 30m — a component observer has likely stalled"
          description: |
            {{ $value }} watched assets are reporting outcome `dormant`
            at once. The supply freshness anchor is a producer-wide
            watermark (classic: the slowest of the four component
            observers; SEP-41: sep41_supply_events), so assets share a
            frozen anchor only when that producer stops advancing. Each
            tick still re-stamps the last observation as current, so
            served supply goes stale silently until the 24h dormancy
            horizon. Runbook: section "Several assets dormant at once" —
            check each component observer is advancing.

      # The sep41 rollup fails closed when the projector's
      # sep41_supply cursor row is absent — the fold stays pinned and every
      # supply read for the contract runs the full-history scan migration 0085
      # exists to prevent. The worker
      # `no_cursor`, distinct from the dormant-token `noop`. Per contract: one
      # pinned contract is the whole incident for that contract. A projector
      # that commits its first sep41_supply cycle clears it on the next pass.
      - alert: stellarindex_sep41_supply_rollup_no_cursor
        expr: |
          sum by (contract_id) (increase(stellarindex_sep41_supply_rollup_advances_total{outcome="no_cursor"}[15m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: supply
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply.md#stellarindex_sep41_supply_rollup_no_cursor
          summary: "sep41 supply rollup for {{ $labels.contract_id }} pinned for ≥ 30m: projector cursor (projector, sep41_supply) is absent"
          description: |
            Every rollup pass for {{ $labels.contract_id }} in the last
            30m folded nothing because ingestion_cursors has no
            (projector, sep41_supply) row. Served supply stays exact,
            but each supply read for this contract sums its whole
            sep41_supply_events history instead of checkpoint + delta —
            the unbounded scan behind the 2026-07-06 Postgres saturation.
            Usual causes: the projector has not committed its first
            sep41_supply cycle (not running, sep41_supply not enabled,
            or quarantined), or ingestion_cursors was lost in a restore.

      # ch-supply.service (daily supply_flows gap-fill) failed its last run.
      # On r1 this unit once failed SILENTLY for weeks (a /var/log
      # permission regression under the non-root hardening) with nothing
      # alerting on it. It logs to journald, and this alert makes a
      # future failure loud. node_systemd_unit_state comes from
      # node_exporter --collector.systemd (same source as verify-archive).
      - alert: stellarindex_ch_supply_gapfill_failed
        expr: |
          node_systemd_unit_state{
            name="ch-supply.service",
            state="failed"
          } == 1
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: supply
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply.md#stellarindex_ch_supply_gapfill_failed
          summary: "ch-supply SEP-41 supply gap-fill failed on {{ $labels.instance }}"
          description: |
            The most-recent run of `ch-supply.service` ended in the `failed`
            state — the daily defensive forward-gap-fill of stellar.supply_flows
            (backing /v1/assets SEP-41 supply) did not complete. The live
            decode-at-ingest path normally keeps supply_flows current, so served
            supply is likely still correct, but the backstop is down: a genuine
            live-writer gap would go unhealed. Diagnose with
            `journalctl -u ch-supply` (chunk-level FAILED lines, ClickHouse
            memory-guard stalls, or a Postgres tip-resolution error).
