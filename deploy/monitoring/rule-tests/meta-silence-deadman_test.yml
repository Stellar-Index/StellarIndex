# promtool unit tests for the deadman heartbeat's silence gate: a silence held
# at 90% of the last day's 5-minute samples stops stellarindex_deadmansswitch
# so the external check pages, however often the silence is rotated.
#
#   promtool test rules deploy/monitoring/rule-tests/meta-silence-deadman_test.yml

rule_files:
  - ../rules/meta.yml
  - ../../../configs/prometheus/rules.r1/meta.yml

evaluation_interval: 1m

tests:
  # No silence: the heartbeat fires (once per tree).
  - interval: 5m
    name: deadmansswitch — beats with no silence
    input_series:
      - series: 'alertmanager_silences{state="active"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 25h
        alertname: stellarindex_deadmansswitch
        exp_alerts: &beat
          - exp_labels: {severity: informational, team: stellarindex, component: meta}
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/meta.md#stellarindex_deadmansswitch"
              summary: "This alert fires constantly — alarm is when it STOPS"
              description: |
                Routing target (e.g., an external watchdog.healthchecks.io URL)
                expects to receive this every minute. If it doesn't, IT pages
                us via a separate channel — which catches Prometheus or
                AlertManager being down.
          - exp_labels: {severity: informational, team: stellarindex, component: meta}
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/meta.md#stellarindex_deadmansswitch"
              summary: "This alert fires constantly — alarm is when it STOPS"
              description: |
                Routing target (e.g., an external watchdog.healthchecks.io URL)
                expects to receive this every minute. If it doesn't, IT pages
                us via a separate channel — which catches Prometheus or
                AlertManager being down.

  # A silence held from t=0: 259 of 288 samples is reached at 21h30m.
  - interval: 5m
    name: deadmansswitch — stops once a silence is held for most of a day
    input_series:
      - series: 'alertmanager_silences{state="active"}'
        values: '1x300'
    alert_rule_test:
      - eval_time: 21h
        alertname: stellarindex_deadmansswitch
        exp_alerts: *beat
      - eval_time: 22h
        alertname: stellarindex_deadmansswitch
        exp_alerts: []

  # One sample of an active silence, then none: the heartbeat never stops.
  - interval: 5m
    name: deadmansswitch — a single short silence does not stop it
    input_series:
      - series: 'alertmanager_silences{state="active"}'
        values: '0x100 1 0x200'
    alert_rule_test:
      - eval_time: 25h
        alertname: stellarindex_deadmansswitch
        exp_alerts: *beat

  # Silenced for 20h, a short gap, silenced again: rotating a silence must
  # not reset the gate, so the heartbeat stops.
  - interval: 5m
    name: deadmansswitch — a silence rotated with a short gap still stops it
    input_series:
      - series: 'alertmanager_silences{state="active"}'
        values: '1x240 0x5 1x60'
    alert_rule_test:
      - eval_time: 25h
        alertname: stellarindex_deadmansswitch
        exp_alerts: []

  # One sample at zero on a 5-minute boundary each day is not a gap.
  - interval: 5m
    name: deadmansswitch — a one-sample daily gap still stops it
    input_series:
      - series: 'alertmanager_silences{state="active"}'
        values: '1x275 0 1x60'
    alert_rule_test:
      - eval_time: 25h
        alertname: stellarindex_deadmansswitch
        exp_alerts: []

  # Silenced for 12h of the day: well under 90%, keeps beating.
  - interval: 5m
    name: deadmansswitch — a half-day of silences does not stop it
    input_series:
      - series: 'alertmanager_silences{state="active"}'
        values: '0x144 1x144 0x12'
    alert_rule_test:
      - eval_time: 25h
        alertname: stellarindex_deadmansswitch
        exp_alerts: *beat
