# promtool unit test for the restart-proof arm of
# stellarindex_aggregator_baseline_refresh_stale in the r1 overlay copy
# (aggregator_test.yml proves the multi-host copy; the job label differs).
#
# Run: promtool test rules deploy/monitoring/rule-tests/aggregator-baseline-age-r1_test.yml

rule_files:
  - ../../../configs/prometheus/rules.r1/aggregator.yml

evaluation_interval: 1m

tests:
  # The heartbeat tracks now (a restart loop re-stamps it), so the stamp arm
  # stays quiet; 2 of 3 pairs' stored rows cross 24h at ~7m, held 15m.
  - interval: 1m
    name: a restart-looping refresher with day-old baselines still tickets
    input_series:
      - series: 'stellarindex_aggregator_baseline_refresh_last_success_unix{job="stellarindex-aggregator"}'
        values: '60+60x120'
      - series: 'stellarindex_aggregator_baseline_age_seconds{job="stellarindex-aggregator",pair="a"}'
        values: '86000+60x120'
      - series: 'stellarindex_aggregator_baseline_age_seconds{job="stellarindex-aggregator",pair="b"}'
        values: '86000+60x120'
      - series: 'stellarindex_aggregator_baseline_age_seconds{job="stellarindex-aggregator",pair="c"}'
        values: '600x120'
    alert_rule_test:
      - eval_time: 10m
        alertname: stellarindex_aggregator_baseline_refresh_stale
        exp_alerts: []
      - eval_time: 40m
        alertname: stellarindex_aggregator_baseline_refresh_stale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: aggregator
              job: stellarindex-aggregator
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_baseline_refresh_stale
              summary: "No volatility-baseline refresh pass has succeeded in over 3 h — the Phase-2 z-score freeze goes unscored once baselines pass 24 h"
              description: |
                No baseline refresh pass has finished within its 45-minute
                timeout with a store answer for over 3 hours (three hourly
                passes) plus a 15-minute for-duration, or most pairs'
                stored baseline rows are already older than 24 h (the
                restart-proof arm). Baselines older than
                24 h make every pair's confidence step return baseline_stale,
                so the ADR-0019 Phase-2 freeze can neither fire nor unfreeze.
                Look at the aggregator's `baseline refresh complete` log for
                `timed_out` and `read_errors`, and
                stellarindex_aggregator_baseline_refresh_total{outcome="read_error"}.
                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_baseline_refresh_stale
