---
# promtool unit tests for the FX sanity-band alert.
#
#   promtool test rules deploy/monitoring/rule-tests/external-pollers_test.yml
#
# `stellarindex_external_fx_rate_rejections` guards a control that is
# SUPPOSED to fire occasionally: the forex worker's two-strike band holds
# an out-of-band rate for one refresh and accepts it if the next fetch
# agrees. A `> 0` rule would therefore page on every genuine devaluation
# and get muted inside a week — the exact failure mode that makes an
# alert worthless.
#
# So the two cases below are the whole contract:
#   1. one bad bar + its confirmation must stay SILENT;
#   2. a ticker the upstream keeps disagreeing about (wedged on its last
#      accepted rate) must TICKET.
#
# The worker refreshes hourly, so `increase(...[3h]) > 2` means "more than
# two of the last three refreshes were refused".
#
# Deliberately lives OUTSIDE `deploy/monitoring/rules/` — see the header
# of archive-completeness_test.yml.

rule_files:
  - ../rules/external-pollers.yml

evaluation_interval: 1m

tests:
  # ── One bad bar, then confirmation ───────────────────────────────
  # A single decimal-shifted EUR bar is refused at t=60m. The next
  # hourly fetch agrees with the new value, the two-strike arm accepts
  # it, and the counter never moves again. Two rejections total (the
  # counter steps once) — under the > 2 threshold, so no ticket.
  - interval: 1m
    name: a single refused bar does not ticket
    input_series:
      - series: 'stellarindex_external_fx_rate_rejected_total{job="stellarindex_api",instance="r1:3000",source="massive",reason="deviation"}'
        values: '0+0x60 1+0x180'
    alert_rule_test:
      - eval_time: 120m
        alertname: stellarindex_external_fx_rate_rejections
        exp_alerts: []
      - eval_time: 200m
        alertname: stellarindex_external_fx_rate_rejections
        exp_alerts: []

  # ── A wedged ticker ──────────────────────────────────────────────
  # The upstream keeps reporting a scale the confirmation arm never
  # settles: one rejection per hourly refresh, indefinitely. By t=240m
  # the trailing 3h window holds 3 rejections (> 2) and has for well
  # over the 30-minute `for`.
  - interval: 1m
    name: sustained rejections ticket
    input_series:
      - series: 'stellarindex_external_fx_rate_rejected_total{job="stellarindex_api",instance="r1:3000",source="massive",reason="deviation"}'
        values: '0+0x60 1+0x59 2+0x59 3+0x59 4+0x59 5+0x59'
    alert_rule_test:
      - eval_time: 340m
        alertname: stellarindex_external_fx_rate_rejections
        exp_alerts:
          - exp_labels:
              reason: deviation
              severity: ticket
              team: stellarindex
              component: external-poller
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/external-pollers.md#stellarindex_external_fx_rate_rejections
              summary: "forex sanity band is rejecting upstream rates (deviation)"
              description: |
                The forex worker refused more than 2 upstream rates in 3 h
                with reason `deviation`. Those tickers are HELD on
                their last accepted fx_quotes row, so fiat-quoted usd_volume
                for them is being converted at a stale rate. `deviation`
                means the upstream keeps reporting a move > 50% that the
                two-strike confirmation is not clearing — usually a real
                redenomination the guard needs to be told about, or an
                upstream scale change. `deviation_history_conflict` means a
                two-fetch confirmation was VETOED because the ticker's own
                trailing-7d majority refutes the candidate — the current
                feed is persistently serving a broken bar. `non_positive` /
                `non_finite` mean the feed is emitting garbage fields. Grep
                the API logs for "forex: rejected upstream rate" (or
                "pending confirmation refuted") to get the ticker(s).

  # ── Primary down behind a healthy standby ────────────────────────
  # The standby stamps the shared liveness gauge, so feed_stale stays
  # quiet. The gauge holds a unix time: the standby's advances with the
  # clock, the primary's froze at t=0. The gap passes 6h at 360m and has
  # held for 2h by 481m.
  - interval: 1m
    name: a primary that stopped committing tickets while the standby serves
    input_series:
      - series: 'stellarindex_external_fx_last_quote_unix{job="stellarindex_api",instance="r1:3000",source="ecb"}'
        values: '0+60x600'
      - series: 'stellarindex_external_fx_last_quote_unix{job="stellarindex_api",instance="r1:3000",source="massive"}'
        values: '0+0x600'
    alert_rule_test:
      - eval_time: 470m
        alertname: stellarindex_external_fx_primary_down
        exp_alerts: []
      - eval_time: 490m
        alertname: stellarindex_external_fx_feed_stale
        exp_alerts: []
      - eval_time: 490m
        alertname: stellarindex_external_fx_primary_down
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: external-poller
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/external-pollers.md#stellarindex_external_fx_primary_down
              summary: "(P3) fiat-FX is served from a standby; the primary feed has committed nothing for 6+ h"
              description: |
                A standby FX source has committed rates more than 6 h newer
                than the primary (`massive`), for 2 h. Currencies the standby
                publishes stay fresh. Currencies only the primary publishes
                are served as held rates and leave the cache and the fx_quotes
                snap after 7 days, when their fiat-quoted prices go dark.
                Likely cause: a lapsed subscription or a bad MASSIVE_API_KEY
                (401/403 on every refresh).

  - interval: 1m
    name: a primary committing alongside the standby is silent
    input_series:
      - series: 'stellarindex_external_fx_last_quote_unix{job="stellarindex_api",instance="r1:3000",source="ecb"}'
        values: '0+60x600'
      - series: 'stellarindex_external_fx_last_quote_unix{job="stellarindex_api",instance="r1:3000",source="massive"}'
        values: '0+60x600'
    alert_rule_test:
      - eval_time: 590m
        alertname: stellarindex_external_fx_primary_down
        exp_alerts: []

  # A primary that has not committed since the API started has no series
  # at all; the standby's stamp is then compared with zero.
  - interval: 1m
    name: a primary that never committed since boot tickets after two hours
    input_series:
      - series: 'stellarindex_external_fx_last_quote_unix{job="stellarindex_api",instance="r1:3000",source="ecb"}'
        values: '1000000+60x300'
    alert_rule_test:
      - eval_time: 110m
        alertname: stellarindex_external_fx_primary_down
        exp_alerts: []
      - eval_time: 130m
        alertname: stellarindex_external_fx_primary_down
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: external-poller
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/external-pollers.md#stellarindex_external_fx_primary_down
              summary: "(P3) fiat-FX is served from a standby; the primary feed has committed nothing for 6+ h"
              description: |
                A standby FX source has committed rates more than 6 h newer
                than the primary (`massive`), for 2 h. Currencies the standby
                publishes stay fresh. Currencies only the primary publishes
                are served as held rates and leave the cache and the fx_quotes
                snap after 7 days, when their fiat-quoted prices go dark.
                Likely cause: a lapsed subscription or a bad MASSIVE_API_KEY
                (401/403 on every refresh).
