# promtool unit tests for two API alerts on unauthenticated sign-in paths:
#
#   stellarindex_login_code_guessing
#   stellarindex_registration_table_growing
#
#   promtool test rules deploy/monitoring/rule-tests/api-signin-registration_test.yml

rule_files:
  - ../rules/api.yml

evaluation_interval: 1m

tests:
  # ── one address locked out by wrong codes ────────────────────────
  - interval: 1m
    name: a lockout engaged by guessing tickets; a few typos do not
    input_series:
      - series: 'stellarindex_login_code_failures_total{outcome="lockout_engaged"}'
        values: '0+0x60 1+0x60'
      - series: 'stellarindex_login_code_failures_total{outcome="wrong_code"}'
        values: '0+0x30 3+0x30 13+0x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: stellarindex_login_code_guessing
        exp_alerts: []
      - eval_time: 70m
        alertname: stellarindex_login_code_guessing
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: api
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_login_code_guessing
              summary: "Dashboard email codes are being guessed: an address was locked out, or over 50 wrong codes in an hour"
              description: |
                Wrong 6-digit sign-in codes locked an address out, or more
                than 50 wrong codes were entered across all addresses in an
                hour. The lockout slows a guesser and does not stop a long
                campaign. The API log names the masked address and the
                client IP of each lockout.
                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_login_code_guessing

  # ── guessing spread under every address's budget ─────────────────
  - interval: 1m
    name: many wrong codes with no lockout still ticket
    input_series:
      - series: 'stellarindex_login_code_failures_total{outcome="lockout_engaged"}'
        values: '0+0x120'
      - series: 'stellarindex_login_code_failures_total{outcome="wrong_code"}'
        values: '0+0x10 0+2x110'
    alert_rule_test:
      - eval_time: 20m
        alertname: stellarindex_login_code_guessing
        exp_alerts: []
      - eval_time: 60m
        alertname: stellarindex_login_code_guessing
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: api
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_login_code_guessing
              summary: "Dashboard email codes are being guessed: an address was locked out, or over 50 wrong codes in an hour"
              description: |
                Wrong 6-digit sign-in codes locked an address out, or more
                than 50 wrong codes were entered across all addresses in an
                hour. The lockout slows a guesser and does not stop a long
                campaign. The API log names the masked address and the
                client IP of each lockout.
                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_login_code_guessing

  # ── registration farming paced under the hourly cap ──────────────
  # 59 an hour is one below the default register_max_per_hour (60): the
  # budget alert never trips, so the growth alert must.
  - interval: 5m
    name: 59 registrations an hour for six hours ticket; two a day do not
    input_series:
      - series: 'stellarindex_registrations_total{job="stellarindex_api",outcome="created"}'
        values: '0+5x200'
      - series: 'stellarindex_registrations_total{job="stellarindex_aggregator",outcome="created"}'
        values: '0+0x200'
    alert_rule_test:
      - eval_time: 1h
        alertname: stellarindex_registration_table_growing
        exp_alerts: []
      - eval_time: 8h
        alertname: stellarindex_registration_table_growing
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: api
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_registration_table_growing
              summary: "360 registrations in 6 hours"
              description: |
                POST /v1/register created more than 50 accounts in six hours.
                Each one is permanent and carries a live
                free-tier key with its own quota, so sustained growth
                outside expected sign-ups is abuse of the open registration
                path, not a table that cleans itself up.
                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_registration_table_growing
  - interval: 5m
    name: a trickle of registrations stays quiet
    input_series:
      - series: 'stellarindex_registrations_total{job="stellarindex_api",outcome="created"}'
        values: '0+0x100 1+0x100'
    alert_rule_test:
      - eval_time: 12h
        alertname: stellarindex_registration_table_growing
        exp_alerts: []

  # ── the hourly registration cap is spent ─────────────────────────
  - interval: 1m
    name: registrations refused at the hourly cap ticket; accepted ones do not
    input_series:
      - series: 'stellarindex_registrations_total{job="stellarindex_api",outcome="created"}'
        values: '0+1x60'
      - series: 'stellarindex_registrations_total{job="stellarindex_api",outcome="budget_exhausted"}'
        values: '0+0x30 0+1x7 7+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: stellarindex_registration_budget_exhausted
        exp_alerts: []
      - eval_time: 38m
        alertname: stellarindex_registration_budget_exhausted
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: api
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_registration_budget_exhausted
              summary: "7 registration(s) refused in 15 minutes: the hourly cap is spent"
              description: |
                POST /v1/register reached its hourly all-caller cap and is
                answering 503. Either open registration is being farmed
                from many addresses, or real sign-ups now exceed the cap
                and are being turned away.
                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api.md#stellarindex_registration_budget_exhausted
      - eval_time: 60m
        alertname: stellarindex_registration_budget_exhausted
        exp_alerts: []
