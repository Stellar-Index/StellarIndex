---
# promtool unit test for cache.yml's stellarindex_redis_replication_broken.
#
#   promtool test rules deploy/monitoring/rule-tests/cache_test.yml
#
# rule-equivalence.baseline waives this rule's expr as an
# intentional multi-host-vs-r1 divergence (r1 is single-node, so its
# copy compares against its own redis_expected_slaves recording rather
# than a fixed threshold), but nothing proved either tree's copy
# actually fires. This covers the multi-host tree's threshold form.

rule_files:
  - ../rules/cache.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    name: fewer than 2 connected replicas fires replication_broken
    input_series:
      - series: 'redis_connected_slaves{instance="cache1:6379"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: stellarindex_redis_replication_broken
        exp_alerts:
          - exp_labels:
              instance: cache1:6379
              severity: ticket
              team: stellarindex
              component: cache
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/cache.md#stellarindex_redis_replication_broken
              summary: "Redis master cache1:6379 missing replicas"
              description: |
                Master reports 1 connected replicas, fewer than the
                ADR-0024 expected 2. Sentinel can't promote on failover if
                replicas are gone.

  - interval: 30s
    name: two connected replicas stays silent
    input_series:
      - series: 'redis_connected_slaves{instance="cache1:6379"}'
        values: '2+0x10'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: stellarindex_redis_replication_broken
        exp_alerts: []

  # ── widened past err="OOM" alone ─────────
  # to also catch READONLY and NOREPLICAS — same customer-visible
  # shape (writes refused outright), different cause.
  - interval: 30s
    name: OOM write rejections page
    input_series:
      - series: 'redis_errors_total{instance="cache1:6379",err="OOM"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: stellarindex_redis_write_rejected_oom
        exp_alerts:
          - exp_labels:
              instance: cache1:6379
              err: OOM
              severity: page
              team: stellarindex
              component: cache
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/cache.md#stellarindex_redis_write_rejected_oom
              summary: "Redis cache1:6379 rejecting writes (OOM)"
              description: |
                Redis is refusing writes outright rather than degrading —
                OOM: OOM (at maxmemory, noeviction/nowhere
                left to evict), READONLY (this instance stopped accepting
                writes — check for a stale primary handoff) or NOREPLICAS
                (min-replicas-to-write blocking on too few connected
                replicas). Application writes are failing now, not just
                degrading. Scale up / free memory (OOM) or fix the
                replication topology (READONLY/NOREPLICAS) immediately.

  - interval: 30s
    name: READONLY write rejections page (new — widened coverage)
    input_series:
      - series: 'redis_errors_total{instance="cache1:6379",err="READONLY"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: stellarindex_redis_write_rejected_oom
        exp_alerts:
          - exp_labels:
              instance: cache1:6379
              err: READONLY
              severity: page
              team: stellarindex
              component: cache
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/cache.md#stellarindex_redis_write_rejected_oom
              summary: "Redis cache1:6379 rejecting writes (READONLY)"
              description: |
                Redis is refusing writes outright rather than degrading —
                READONLY: OOM (at maxmemory, noeviction/nowhere
                left to evict), READONLY (this instance stopped accepting
                writes — check for a stale primary handoff) or NOREPLICAS
                (min-replicas-to-write blocking on too few connected
                replicas). Application writes are failing now, not just
                degrading. Scale up / free memory (OOM) or fix the
                replication topology (READONLY/NOREPLICAS) immediately.

  - interval: 30s
    name: NOREPLICAS write rejections page (new — widened coverage)
    input_series:
      - series: 'redis_errors_total{instance="cache1:6379",err="NOREPLICAS"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: stellarindex_redis_write_rejected_oom
        exp_alerts:
          - exp_labels:
              instance: cache1:6379
              err: NOREPLICAS
              severity: page
              team: stellarindex
              component: cache
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/cache.md#stellarindex_redis_write_rejected_oom
              summary: "Redis cache1:6379 rejecting writes (NOREPLICAS)"
              description: |
                Redis is refusing writes outright rather than degrading —
                NOREPLICAS: OOM (at maxmemory, noeviction/nowhere
                left to evict), READONLY (this instance stopped accepting
                writes — check for a stale primary handoff) or NOREPLICAS
                (min-replicas-to-write blocking on too few connected
                replicas). Application writes are failing now, not just
                degrading. Scale up / free memory (OOM) or fix the
                replication topology (READONLY/NOREPLICAS) immediately.

  # ── deliberately NOT widened: MISCONF/EXECABORT already page via
  # stellarindex_redis_writes_blocked (storage.yml); a second rule
  # here would double-page the same disk-full event.
  - interval: 30s
    name: MISCONF errors do not double-page here
    input_series:
      - series: 'redis_errors_total{instance="cache1:6379",err="MISCONF"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: stellarindex_redis_write_rejected_oom
        exp_alerts: []
