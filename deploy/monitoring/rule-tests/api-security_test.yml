---
# promtool unit tests for api-security.yml (GH-1039).
#
#   promtool test rules deploy/monitoring/rule-tests/api-security_test.yml

rule_files:
  - ../rules/api-security.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: sustained allowed_wildcard traffic pages a ticket
    input_series:
      - series: 'stellarindex_api_cors_decisions_total{outcome="allowed_wildcard"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: stellarindex_api_cors_wildcard_in_prod
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: api
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api-cors-wildcard.md
              summary: "Wildcard CORS policy is serving real cross-origin requests in prod (P3)"
              description: |
                stellarindex_api_cors_decisions_total{outcome="allowed_wildcard"}
                has incremented within the last 15 minutes on the r1
                production tree: `STELLARINDEX_ALLOWED_ORIGINS=*` is
                configured and matching real cross-origin traffic. A
                wildcard policy paired with credentialed auth_mode lets any
                origin read authenticated responses (F-1244).

                Check the api instance's STELLARINDEX_ALLOWED_ORIGINS env
                var and auth_mode; if credentials are in play, replace the
                wildcard with an explicit allow-list.

  - interval: 1m
    name: allowed_origin traffic never trips the wildcard alert
    input_series:
      - series: 'stellarindex_api_cors_decisions_total{outcome="allowed_origin"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: stellarindex_api_cors_wildcard_in_prod
        exp_alerts: []
