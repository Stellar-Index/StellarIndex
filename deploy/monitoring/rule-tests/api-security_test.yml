---
# promtool unit tests for api-security.yml.
#
#   promtool test rules deploy/monitoring/rule-tests/api-security_test.yml

rule_files:
  - ../rules/api-security.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: sustained allowed_wildcard traffic pages a ticket
    input_series:
      - series: 'stellarindex_api_cors_decisions_total{outcome="allowed_wildcard"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: stellarindex_api_cors_wildcard_in_prod
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: api
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api-security.md#stellarindex_api_cors_wildcard_in_prod
              summary: "Wildcard CORS policy is serving real cross-origin requests in prod (P3)"
              description: |
                stellarindex_api_cors_decisions_total{outcome="allowed_wildcard"}
                has incremented within the last 15 minutes on the r1
                production tree: `STELLARINDEX_ALLOWED_ORIGINS=*` is
                configured and matching real cross-origin traffic. A
                wildcard policy paired with credentialed auth_mode lets any
                origin read authenticated responses (F-1244).

                Check the api instance's STELLARINDEX_ALLOWED_ORIGINS env
                var and auth_mode; if credentials are in play, replace the
                wildcard with an explicit allow-list.

  - interval: 1m
    name: allowed_origin traffic never trips the wildcard alert
    input_series:
      - series: 'stellarindex_api_cors_decisions_total{outcome="allowed_origin"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: stellarindex_api_cors_wildcard_in_prod
        exp_alerts: []

  - interval: 1m
    name: sustained lineage write failures (a missing ACL grant) file a ticket per op
    input_series:
      - series: 'stellarindex_apikey_lineage_write_failures_total{op="slide",instance="api-1"}'
        values: '0+3x60'
      - series: 'stellarindex_apikey_lineage_write_failures_total{op="mint",instance="api-1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: stellarindex_apikey_lineage_write_failures
        exp_alerts: []
      - eval_time: 50m
        alertname: stellarindex_apikey_lineage_write_failures
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: api
              op: slide
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api-security.md#stellarindex_apikey_lineage_write_failures
              summary: "API-key lineage writes (op=slide) have failed for 30 minutes (P3)"
              description: |
                stellarindex_apikey_lineage_write_failures_total{op="slide"} has
                increased in every 15-minute window for 30 minutes. No request
                fails, but lineage records go unwritten or undeleted. Check first
                that the redis-sentinel role was applied after the binary: the
                ACL must grant ~apikey-lineage:*.

  - interval: 1m
    name: one lineage write blip never files a ticket
    input_series:
      - series: 'stellarindex_apikey_lineage_write_failures_total{op="delete",instance="api-1"}'
        values: '0x5 1x55'
    alert_rule_test:
      - eval_time: 20m
        alertname: stellarindex_apikey_lineage_write_failures
        exp_alerts: []
      - eval_time: 50m
        alertname: stellarindex_apikey_lineage_write_failures
        exp_alerts: []
