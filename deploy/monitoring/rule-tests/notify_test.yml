# promtool unit tests for ../rules/notify.yml.
#
#   promtool test rules deploy/monitoring/rule-tests/notify_test.yml
#
# Q268/RLT-324: stellarindex_notify_send_failure_ratio_high is 0/0 = NaN
# whenever a template has zero send attempts, so a mailer that stops being
# invoked entirely reads identically to a legitimately quiet window. Case 1
# proves the stellarindex_notify_no_send_activity dead-man's-switch catches
# 6h of zero send attempts while sign-in/signup requests keep succeeding;
# case 1b proves an idle deployment (no such requests) stays silent; case 2
# proves it stays silent once any send (success or failure) has happened
# recently.
#
# Case 3 proves the new stellarindex_notify_send_failures_sustained
# companion pages on a persistent low-ratio failure trickle (well under the
# 50% ratio threshold) that the ratio rule alone would never catch; case 4
# proves a template with only occasional, non-sustained failures stays
# silent.
#
# Cases 5-6 prove stellarindex_notify_send_rate_high fires on aggregate sent
# volume above its ceiling and ignores failed sends.

rule_files:
  - ../rules/notify.yml

evaluation_interval: 1m

tests:
  # ── Case 1: sign-in demand with zero sends for 6h — dead-man fires ─
  # One successful POST /v1/auth/login per minute, a non-2xx signup that
  # must not count as demand, and not a single send attempt.
  - interval: 1m
    name: sign-in demand with zero send attempts for 6h fires the dead-man alert
    input_series:
      - series: 'http_requests_total{job="stellarindex_api",method="POST",route="/v1/auth/login",status="200"}'
        values: '0+1x400'
      - series: 'http_requests_total{job="stellarindex_api",method="POST",route="/v1/signup",status="429"}'
        values: '0+5x400'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0+0x400'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0+0x400'
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="sent"}'
        values: '0+0x400'
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="failed"}'
        values: '0+0x400'
    alert_rule_test:
      - eval_time: 400m
        alertname: stellarindex_notify_no_send_activity
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: notify
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high
              summary: "360 sign-in/signup requests in 6h, but no transactional email send attempts"
              description: |
                POST /v1/auth/login and POST /v1/signup answered 2xx
                360 times in the last 6 hours, yet
                stellarindex_notify_sends_total has not incremented for any
                template or result. The mailer has stopped being invoked
                entirely — not merely failing — which the failure-ratio alert
                cannot see (0 failed / 0 sent is NaN, not "> 0.5"). Check that
                the dashboard-login and signup-verify handlers are still calling
                internal/notify.Sender.Send, and that the signup verification
                emailer is configured.

                Runbook: docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high

  # ── Case 1b: idle deployment — no demand, no sends, no alert ───────
  # Zero sends is the expected reading when nobody signs in or signs up;
  # unrelated API traffic and refused (non-2xx) auth requests are not
  # demand.
  - interval: 1m
    name: zero send attempts with no sign-in or signup demand stays silent
    input_series:
      - series: 'http_requests_total{job="stellarindex_api",method="GET",route="/v1/ledger/latest",status="200"}'
        values: '0+50x400'
      - series: 'http_requests_total{job="stellarindex_api",method="POST",route="/v1/auth/login",status="400"}'
        values: '0+1x400'
      - series: 'http_requests_total{job="stellarindex_api",method="POST",route="/v1/auth/login",status="200"}'
        values: '0+0x400'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0+0x400'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0+0x400'
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="sent"}'
        values: '0+0x400'
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="failed"}'
        values: '0+0x400'
    alert_rule_test:
      - eval_time: 400m
        alertname: stellarindex_notify_no_send_activity
        exp_alerts: []

  # ── Case 2: a single recent send anywhere keeps it silent ──────────
  - interval: 1m
    name: any recent send activity silences the dead-man alert
    input_series:
      - series: 'http_requests_total{job="stellarindex_api",method="POST",route="/v1/auth/login",status="200"}'
        values: '0+1x400'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0x300 1+0x100'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0+0x400'
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="sent"}'
        values: '0+0x400'
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="failed"}'
        values: '0+0x400'
    alert_rule_test:
      - eval_time: 400m
        alertname: stellarindex_notify_no_send_activity
        exp_alerts: []

  # ── Case 3: a low, persistent failure trickle under the 50% ratio ──
  # magic-link sends 10/min successfully and 1/min failing throughout: a
  # ~9% failure ratio the ratio rule never fires on, sustained past the 1h
  # dwell.
  - interval: 1m
    name: a sustained low-ratio failure trickle fires the absolute-rate companion
    input_series:
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0+10x150'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0+1x150'
    alert_rule_test:
      - eval_time: 30m
        alertname: stellarindex_notify_send_failures_sustained
        exp_alerts: []
      - eval_time: 90m
        alertname: stellarindex_notify_send_failures_sustained
        exp_alerts:
          - exp_labels:
              template: magic-link
              severity: ticket
              team: stellarindex
              component: notify
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high
              summary: "Transactional email (magic-link) has been failing continuously for 1h"
              description: |
                magic-link email sends have included at least one
                failure in every 15m window for the last hour — a persistent
                failure trickle that may never cross the 50%-ratio alert's
                threshold if send volume is high, but still means some fraction
                of users never received their magic link or confirmation email.

                Runbook: docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high
      # The pre-existing ratio rule must stay silent throughout — proves
      # this is a genuinely NEW signal, not a duplicate of the ratio alert.
      - eval_time: 90m
        alertname: stellarindex_notify_send_failure_ratio_high
        exp_alerts: []

  # ── Case 4: an occasional, non-sustained failure stays silent ──────
  - interval: 1m
    name: an isolated failure blip does not fire the sustained-failure alert
    input_series:
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="sent"}'
        values: '0+10x150'
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="failed"}'
        values: '0 0+1x5 5x144'
    alert_rule_test:
      - eval_time: 90m
        alertname: stellarindex_notify_send_failures_sustained
        exp_alerts: []

  # ── Case 5: aggregate sent volume above the ceiling ────────────────
  # 4/min per template = 480/h summed, sustained past the 15m dwell. Each
  # template alone (240/h) is under the ceiling: the rule must sum them.
  - interval: 1m
    name: sustained aggregate send volume above 300/h fires the ceiling alert
    input_series:
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0+4x60'
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="sent"}'
        values: '0+4x60'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: stellarindex_notify_send_rate_high
        exp_alerts: []
      - eval_time: 40m
        alertname: stellarindex_notify_send_rate_high
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: notify
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high
              summary: "Transactional email is going out at 480/h (ceiling 300/h)"
              description: |
                Successful transactional email sends, summed across every
                template, have stayed above 300 mails/hour for 15+ minutes. The
                per-inbox and per-IP login-mail throttles bound each caller, not
                the total, so this is the only signal that aggregate volume has
                left its normal range — a send loop, or sign-in links requested
                for many addresses from many IPs. Sustained high volume spends
                the sending domain's reputation for every recipient.

                Runbook: docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high

  # ── Case 6: failed sends and organic volume stay under the ceiling ─
  # 2/min sent (120/h) plus 10/min failed: failures deliver nothing, so
  # they must not count toward the sent ceiling.
  - interval: 1m
    name: organic sent volume plus failures does not fire the ceiling alert
    input_series:
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0+2x60'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: stellarindex_notify_send_rate_high
        exp_alerts: []

  # ── Case 7: ONE failed send fires the any-failure alert ────────────
  # A lone failure on a template that has sent nothing in the window: the
  # ratio and sustained rules produce nothing at 5m, this one fires at once
  # and clears an hour after the failure leaves the 1h window.
  - interval: 1m
    name: a single failed send fires stellarindex_notify_send_failed
    input_series:
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0x200'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0x4 1x200'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_notify_send_failed
        exp_alerts:
          - exp_labels:
              template: magic-link
              severity: ticket
              team: stellarindex
              component: notify
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high
              summary: "Transactional email (magic-link) had 1 failed send(s) in the last hour"
              description: |
                At least one magic-link email send failed in the
                last hour. Rare failures stay under the ratio and sustained
                alerts, so this is the only signal for them. A user did not get
                their magic link or confirmation email.

                Runbook: docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high
      - eval_time: 5m
        alertname: stellarindex_notify_send_failure_ratio_high
        exp_alerts: []
      - eval_time: 5m
        alertname: stellarindex_notify_send_failures_sustained
        exp_alerts: []
      - eval_time: 90m
        alertname: stellarindex_notify_send_failed
        exp_alerts: []

  # ── Case 8: no failures, zero or healthy traffic stays silent ──────
  - interval: 1m
    name: no failed sends keeps stellarindex_notify_send_failed silent
    input_series:
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0+5x100'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '3x100'
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="sent"}'
        values: '0x100'
      - series: 'stellarindex_notify_sends_total{template="signup-verify",result="failed"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 60m
        alertname: stellarindex_notify_send_failed
        exp_alerts: []

  # ── Case 7: suppressed sends do not dilute the failure ratio ───────
  # 2 failed + 1 sent per minute is a 2/3 failure ratio; 10 suppressed per
  # minute must not pull it under 0.5 (2/13 would).
  - interval: 1m
    name: suppressed sends are excluded from the failure-ratio denominator
    input_series:
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0+1x60'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0+2x60'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="suppressed"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: stellarindex_notify_send_failure_ratio_high
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: notify
              template: magic-link
            exp_annotations:
              summary: "Transactional email (magic-link) failing > 50% of sends"
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high"
              description: "More than half of magic-link email sends have failed\nfor 15+ minutes (66.67% failed). The\nmail provider (Resend) is likely down, the API key is rotated/\ninvalid, or the sending domain is unverified. Customer impact:\nmagic-link dashboard LOGIN and/or API-signup CONFIRMATION stop\ndelivering — existing sessions and API keys are unaffected. Check\nthe Resend status + credentials per the runbook.\n\nRunbook: docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high\n"

  # ── Case 9: rare failures (1 per 20m) fire the any-failure alert ───
  # Too sparse for the sustained rule's every-window dwell and far under the
  # 50% ratio; stellarindex_notify_send_failed still sees each one.
  - interval: 1m
    name: one failed send every 20m fires the any-failure alert only
    input_series:
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0+10x120'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0x20 1x20 2x20 3x20 4x20 5x20'
    alert_rule_test:
      - eval_time: 100m
        alertname: stellarindex_notify_send_failed
        exp_alerts:
          - exp_labels:
              template: magic-link
              severity: ticket
              team: stellarindex
              component: notify
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high
              # promtool 2.x (CI and r1) renders increase() here as exactly 3; 3.x extrapolates to 3.051.
              summary: "Transactional email (magic-link) had 3 failed send(s) in the last hour"
              description: |
                At least one magic-link email send failed in the
                last hour. Rare failures stay under the ratio and sustained
                alerts, so this is the only signal for them. A user did not get
                their magic link or confirmation email.

                Runbook: docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high
      - eval_time: 100m
        alertname: stellarindex_notify_send_failures_sustained
        exp_alerts: []
      - eval_time: 100m
        alertname: stellarindex_notify_send_failure_ratio_high
        exp_alerts: []

  # ── Case 10: all sends failed, none sent — ratio rule fires ────────
  # failed is in the denominator, so 0 sent + N failed is 1.0, not NaN.
  - interval: 1m
    name: all sends failed with zero sent fires the ratio alert
    input_series:
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0x60'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: stellarindex_notify_send_failure_ratio_high
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: notify
              template: magic-link
            exp_annotations:
              summary: "Transactional email (magic-link) failing > 50% of sends"
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high"
              description: "More than half of magic-link email sends have failed\nfor 15+ minutes (100% failed). The\nmail provider (Resend) is likely down, the API key is rotated/\ninvalid, or the sending domain is unverified. Customer impact:\nmagic-link dashboard LOGIN and/or API-signup CONFIRMATION stop\ndelivering — existing sessions and API keys are unaffected. Check\nthe Resend status + credentials per the runbook.\n\nRunbook: docs/operations/runbooks/meta.md#stellarindex_notify_send_failure_ratio_high\n"

  # ── Case 11: zero traffic (0/0) fires none of the failure alerts ───
  - interval: 1m
    name: zero sends and zero failures keeps every failure alert silent
    input_series:
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="sent"}'
        values: '0x60'
      - series: 'stellarindex_notify_sends_total{template="magic-link",result="failed"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: stellarindex_notify_send_failure_ratio_high
        exp_alerts: []
      - eval_time: 45m
        alertname: stellarindex_notify_send_failed
        exp_alerts: []
      - eval_time: 45m
        alertname: stellarindex_notify_send_failures_sustained
        exp_alerts: []
