---
# promtool unit tests for stellarindex_pg_lock_convoy — the r1 incident of
# 2026-09-10 00:12–00:31 UTC (see the rule comment in ../rules/storage.yml).
#
#   promtool test rules deploy/monitoring/rule-tests/pg-lock-convoy_test.yml
#
# WHAT THE ALERT HAS TO GET RIGHT is not "did anything wait" — that is the
# easy half and it is the half that would make it useless. Decompressing
# the 159.7 GB `trades` chunk legitimately holds AccessExclusiveLock for
# ~1.5 h, and everything reading that chunk legitimately waits behind it,
# so an alert on blocked backends fires on every healthy restamp. The
# producer (timescale-jobs-probe.sh) therefore emits a NARROWER gauge:
# backends whose blocker is ITSELF blocked, which is the convoy signature
# and is zero under a healthy hold.
#
# So the three cases are: the incident fires (1), a healthy long
# decompress with a big queue behind it stays silent (2), and a brief
# self-clearing collision stays silent (3).
#
# PROVEN-RED: two independent mutations, each run against these cases —
#
#   (a) point the expr at stellarindex_pg_lock_blocked_backends (the
#       "someone is waiting" rule this deliberately is not):
#       case 2 gains an alert promtool did not expect — the healthy
#       1.5 h decompress pages.
#   (b) drop the `for: 2m`:
#       case 1 fires at 13m instead of 15m, and case 3 gains an alert at
#       2m — the single-sample, self-clearing blip pages.
#
# Both were run and both reported the extra alerts before the rule as
# committed was restored.

rule_files:
  - ../rules/storage.yml

evaluation_interval: 1m

tests:
  # ── Case 1: the 2026-09-10 convoy ────────────────────────────────────
  #
  # Quiet for 10 min, then the aggregator's cold-start read collides with
  # the restamp's decompress. The decompress queues behind the read; the
  # exporter scrapes, the restamp's own UPDATEs and the size watcher then
  # queue behind the DECOMPRESS — six backends whose blocker is itself
  # blocked, and the worst wait climbs past 1,164 s.
  #
  # The probe writes every 60 s, so one sample per minute is the real
  # cadence. Waits are in seconds: 60, 120, 180 … as the queue ages.
  - interval: 1m
    name: the 2026-09-10 lock convoy pages
    input_series:
      - series: 'stellarindex_pg_lock_convoy_wait_seconds_max{instance="r1:9100",job="node_exporter"}'
        values: '0x10 60 120 180 240 300 360 420 480 540 600 660 720 780 840 900 960 1020 1080 1140'
      - series: 'stellarindex_pg_lock_convoy_backends{instance="r1:9100",job="node_exporter"}'
        values: '0x10 1 3 6 6 6 6 6 6 6 6 6 6 6 6 6 6 6 6 6'
      - series: 'stellarindex_pg_lock_blocked_backends{instance="r1:9100",job="node_exporter"}'
        values: '0x10 2 4 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7'
    alert_rule_test:
      # Still quiet before the collision.
      - eval_time: 10m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts: []
      # The sample at t=12m is exactly 120 s, which the strict `> 120`
      # does not match; t=13m is the first sample over the line, so
      # `for: 2m` holds it pending until 15m. Not yet.
      - eval_time: 13m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts: []
      # Fires, four minutes after the collision started. On the real
      # timeline that is roughly 00:16 UTC — about 15 minutes before the
      # convoy was cleared by hand.
      - eval_time: 15m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts:
          - exp_labels:
              severity: page
              team: stellarindex
              component: storage
              instance: r1:9100
              job: node_exporter
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/pg-lock-convoy.md
              summary: "Postgres lock convoy: a backend has waited 5m 0s behind a blocker that is itself blocked"
              description: |
                5m 0s is the longest wait among the
                backends queued behind a lock request that is ITSELF queued —
                the 2026-09-10 shape. Postgres puts every later request for an
                object behind a pending exclusive one, so this grows to include
                work that has nothing to do with the original contention:
                postgres_exporter's scrapes, the API's reads, the size watcher.

                Treat the alerting layer as untrustworthy while this is firing.
                postgres_exporter is very likely in the convoy, which makes
                every pg_* alert unable to fire; this gauge comes from
                timescale-jobs-probe.sh via node_exporter and is not.

                Find the HEAD of the chain (the one blocked backend nothing is
                blocking) and decide about that one process — cancelling
                anything further down only frees its own slot. The runbook has
                the query.
      # Still firing 15 minutes in, with the worst wait past 1,100 s.
      - eval_time: 29m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts:
          - exp_labels:
              severity: page
              team: stellarindex
              component: storage
              instance: r1:9100
              job: node_exporter
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/pg-lock-convoy.md
              summary: "Postgres lock convoy: a backend has waited 19m 0s behind a blocker that is itself blocked"
              description: |
                19m 0s is the longest wait among the
                backends queued behind a lock request that is ITSELF queued —
                the 2026-09-10 shape. Postgres puts every later request for an
                object behind a pending exclusive one, so this grows to include
                work that has nothing to do with the original contention:
                postgres_exporter's scrapes, the API's reads, the size watcher.

                Treat the alerting layer as untrustworthy while this is firing.
                postgres_exporter is very likely in the convoy, which makes
                every pg_* alert unable to fire; this gauge comes from
                timescale-jobs-probe.sh via node_exporter and is not.

                Find the HEAD of the chain (the one blocked backend nothing is
                blocking) and decide about that one process — cancelling
                anything further down only frees its own slot. The runbook has
                the query.

  # ── Case 2: a HEALTHY 1.5-hour decompress must stay silent ───────────
  #
  # This is the case that decides whether the alert is usable at all. The
  # outlier `trades` chunk is 159.7 GB uncompressed and its decompress
  # runs about 1.5 hours holding AccessExclusiveLock. Nine backends sit
  # behind it for the whole time, waiting up to 5,400 s — every one of
  # them blocked by a HOLDER that is running, not waiting. The convoy
  # gauge is 0 throughout and the alert must never fire.
  #
  # Get this wrong and the alert pages on every restamp of the big chunk,
  # which is how an alert becomes something the operator mutes — the same
  # blindness it exists to prevent, arriving by another door (the
  # stellarindex_ops_job_no_progress lesson).
  - interval: 1m
    name: a healthy long decompress with a queue behind it never fires
    input_series:
      - series: 'stellarindex_pg_lock_convoy_wait_seconds_max{instance="r1:9100",job="node_exporter"}'
        values: '0x95'
      - series: 'stellarindex_pg_lock_convoy_backends{instance="r1:9100",job="node_exporter"}'
        values: '0x95'
      - series: 'stellarindex_pg_lock_blocked_backends{instance="r1:9100",job="node_exporter"}'
        values: '0 0 0 0 0 9x91'
    alert_rule_test:
      - eval_time: 30m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts: []
      - eval_time: 60m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts: []
      - eval_time: 94m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts: []

  # ── Case 3: a brief self-clearing collision stays silent ─────────────
  #
  # A convoy that forms and drains inside one `for` window is not worth a
  # page: by the time anyone reads it, it is gone. One probe sample sees
  # 150 s of convoyed wait and the next sees none. `for: 2m` is what
  # swallows it — without it this pages at 3m.
  - interval: 1m
    name: a convoy that clears inside the for window never fires
    input_series:
      - series: 'stellarindex_pg_lock_convoy_wait_seconds_max{instance="r1:9100",job="node_exporter"}'
        values: '0 0 150 0 0 0 0 0 0 0'
      - series: 'stellarindex_pg_lock_convoy_backends{instance="r1:9100",job="node_exporter"}'
        values: '0 0 2 0 0 0 0 0 0 0'
      - series: 'stellarindex_pg_lock_blocked_backends{instance="r1:9100",job="node_exporter"}'
        values: '0 1 3 0 0 0 0 0 0 0'
    alert_rule_test:
      # t=2m is the one sample over the line. Without `for: 2m` this is
      # where the blip pages.
      - eval_time: 2m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts: []
      - eval_time: 3m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts: []
      - eval_time: 5m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts: []
      - eval_time: 9m
        alertname: stellarindex_pg_lock_convoy
        exp_alerts: []
