# Guard for the #323 restart shape: RunGapDetector pre-registers
# runs_total{outcome=ok|error} at 0 for every target on process start,
# and the cursor-seeded schedule may defer every scan for hours. Series
# present at 0 + a fresh stamp must satisfy none of the three clauses
# (stamp fresh; family present; error counter not > 0). Rule-level only,
# so it holds with or without #323's Go change.
- interval: 1m
  name: pre-registered runs_total at 0 with a fresh stamp and no scan due stays silent
  input_series:
  - series: stellarindex_ingest_gap_detector_runs_total{source="sdex",table="trades",outcome="ok"}
    values: 0+0x700
  - series: stellarindex_ingest_gap_detector_runs_total{source="sdex",table="trades",outcome="error"}
    values: 0+0x700
  - series: stellarindex_ingest_gap_detector_last_success_unix{source="sdex",table="trades"}
    values: 0+60x700
  alert_rule_test:
  - eval_time: 30m
    alertname: stellarindex_ingest_gap_detector_silent
    exp_alerts: []
  - eval_time: 690m
    alertname: stellarindex_ingest_gap_detector_silent
    exp_alerts: []
- interval: 1m
  name: a flat counter does not ticket
  input_series:
  - series: stellarindex_source_unknown_symbols_total{job="stellarindex_indexer",instance="r1:9100",source="reflector"}
    values: 7794+0x1700
  alert_rule_test:
  - eval_time: 1600m
    alertname: stellarindex_ingestion_oracle_unknown_symbols
    exp_alerts: []
- interval: 1m
  name: a recurring unmapped reflector symbol tickets
  input_series:
  - series: stellarindex_source_unknown_symbols_total{job="stellarindex_indexer",instance="r1:9100",source="reflector"}
    values: 0+0x4 1+0x4 2+0x4 3+0x4 4+0x4 5+0x4 6+0x4 7+0x4 8+0x4 9+0x4 10+0x4 11+0x4 12+0x4
  alert_rule_test:
  - eval_time: 60m
    alertname: stellarindex_ingestion_oracle_unknown_symbols
    exp_alerts:
    - exp_labels:
        source: reflector
        severity: ticket
        team: stellarindex
        component: ingestion
      exp_annotations:
        runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-unknown-symbols.md
        summary: Oracle reflector is publishing symbols the canonical allow-list does not map
        description: 'stellarindex_source_unknown_symbols_total{source="reflector"}

          increased in the trailing 25 h. The oracle decoder met a symbol /

          feed_id with no canonical asset mapping. Until the decoders

          record such slots under `raw:` they are dropped from the price

          surface; either way the allow-list (ADR-0010 / 0014 / 0028) or

          the RedStone feed registry needs extending, and the affected

          ledgers need a replay once it is. See the runbook.

          '
- interval: 1m
  name: a daily-cadence band symbol keeps the alert firing across the day boundary
  input_series:
  - series: stellarindex_source_unknown_symbols_total{job="stellarindex_indexer",instance="r1:9100",source="band"}
    values: 0+0x1440 1+0x1440 2+0x200
  alert_rule_test:
  - eval_time: 1000m
    alertname: stellarindex_ingestion_oracle_unknown_symbols
    exp_alerts: []
