rule_files:
  - ../rules/ingestion.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: lending state more than 20000 ledgers behind the cursor fires after 30m
    input_series:
      - series: 'stellarindex_cursor_last_ledger{job="stellarindex",instance="r1:9102",source="ledgerstream"}'
        values: '60000000+10x60'
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '59900000+0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_lending_state_lagging
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-state-lagging
              summary: "lending state history trails the ledgerstream cursor by more than 20000 ledgers"
              description: |
                stellar.lending_state_hourly, derived by lending-state.timer,
                is more than 20000 ledgers behind the ledgerstream cursor for
                30 min. Either the timer is silent, the derive is refusing a
                window (lake hole, or same-ledger changes without intra-ledger
                order), or the initial catch-up is still running.

  - interval: 1m
    name: a host where the lending derive never reported stays quiet
    input_series:
      - series: 'stellarindex_cursor_last_ledger{job="stellarindex",instance="r1:9102",source="ledgerstream"}'
        values: '60000000+10x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_lending_state_lagging
        exp_alerts: []

  - interval: 1m
    name: lending state within 20000 ledgers of the cursor stays quiet
    input_series:
      - series: 'stellarindex_cursor_last_ledger{job="stellarindex",instance="r1:9102",source="ledgerstream"}'
        values: '60000000+10x60'
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '59990000+10x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_lending_state_lagging
        exp_alerts: []

  - interval: 1m
    name: lending interest more than 100000 ledgers behind lending state fires after 2h
    input_series:
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '60000000+10x180'
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest"}'
        values: '59899000+0x180'
    alert_rule_test:
      - eval_time: 1h
        alertname: stellarindex_lending_interest_lagging
        exp_alerts: []
      - eval_time: 2h30m
        alertname: stellarindex_lending_interest_lagging
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-lagging
              summary: "lending interest history trails lending state by more than 100000 ledgers"
              description: |
                stellar.lending_interest_hourly is more than 100000 ledgers
                behind lending_state_hourly for 2 h. The timer's pass does not
                catch up that far ("backfill incomplete"): run the backfill
                chunks. Or the pass is refusing a window (WASM gate, identity
                check, uncovered pool), or a backfill chunk is still running.

  - interval: 5m
    name: a redo holding the interest pass for 6h fires
    input_series:
      - series: 'stellarindex_lending_interest_redo_pending{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest"}'
        values: '1x80'
      - series: 'stellarindex_lending_interest_redo_pending{job="node_exporter",instance="r2:9100",ops_job="ch-entry-history-lending-interest"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 5h
        alertname: stellarindex_lending_interest_redo_pending
        exp_alerts: []
      - eval_time: 6h10m
        alertname: stellarindex_lending_interest_redo_pending
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-redo-pending
              summary: "lending interest is held by a pending redo"
              description: |
                A lending_state replay rewrote state the interest rows were
                derived from, and for 6 h the timer's interest pass has derived
                nothing until they are re-derived: run the -interest-only -from
                re-derive its log line names, through the tip.

  - interval: 5m
    name: a redo cleared within 6h stays quiet
    input_series:
      - series: 'stellarindex_lending_interest_redo_pending{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest"}'
        values: '1x60 0x20'
    alert_rule_test:
      - eval_time: 6h30m
        alertname: stellarindex_lending_interest_redo_pending
        exp_alerts: []

  - interval: 1m
    name: a host whose interest pass was never initialised stays quiet
    input_series:
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '60000000+10x180'
    alert_rule_test:
      - eval_time: 2h30m
        alertname: stellarindex_lending_interest_lagging
        exp_alerts: []

  - interval: 1m
    name: lending interest within one window of lending state stays quiet
    input_series:
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '60000000+10x180'
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest"}'
        values: '59990000+10x180'
    alert_rule_test:
      - eval_time: 2h30m
        alertname: stellarindex_lending_interest_lagging
        exp_alerts: []

  - interval: 1m
    name: a failed lending interest proof fires at once and clears on the next clean run
    input_series:
      - series: 'stellarindex_lending_interest_proof_failed{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest-prove"}'
        values: '0x10 1x10 0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_lending_interest_proof_failed
        exp_alerts: []
      - eval_time: 12m
        alertname: stellarindex_lending_interest_proof_failed
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-proof-failed
              summary: "the lending interest proof found stored rows that disagree with the lake"
              description: |
                `stellarindex-ops ch-entry-history -lending-only -prove -interest`
                recomputed stellar.lending_interest_hourly from the lake and a
                stored row (or a window's identities) disagrees. The proof's
                report in `journalctl -u lending-interest-prove -n 200` names
                each mismatch: pool, asset, hour, column, stored and recomputed.
                Re-derive the named hours before anything serves them.
      - eval_time: 25m
        alertname: stellarindex_lending_interest_proof_failed
        exp_alerts: []

  - interval: 1m
    name: unexplained lending interest versions fire after an hour and clear when a proof counts none
    input_series:
      - series: 'stellarindex_lending_interest_unexplained_versions{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest-prove-full"}'
        values: '0x10 8x90 0x10'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_lending_interest_unexplained_versions
        exp_alerts: []
      - eval_time: 80m
        alertname: stellarindex_lending_interest_unexplained_versions
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
              ops_job: ch-entry-history-lending-interest-prove-full
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-unexplained-versions
              summary: "lending interest rows hold reserve versions no event explains"
              description: |
                The last ch-entry-history-lending-interest-prove-full run counted 8 versions in
                stellar.lending_interest_hourly whose b_rate, fee entry or backstop
                credit moved outside accrual with no same-transaction pool event
                that states the move exactly. Those hours' interest totals are not
                the reserve's whole movement; the runbook's query lists the rows.
      - eval_time: 105m
        alertname: stellarindex_lending_interest_unexplained_versions
        exp_alerts: []

  - interval: 1m
    name: unexplained lending interest versions stay quiet where the proof never ran
    input_series:
      - series: 'stellarindex_lending_interest_proof_failed{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest-prove"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 2h
        alertname: stellarindex_lending_interest_unexplained_versions
        exp_alerts: []

  # Finished at t=0 (unix 0); time() at eval_time is the seconds since.
  - interval: 1m
    name: a lending interest proof whose last finished run is over two days old fires
    input_series:
      - series: 'stellarindex_ops_job_last_finish_unix{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest-prove"}'
        values: '0x3000'
    alert_rule_test:
      - eval_time: 47h
        alertname: stellarindex_lending_interest_proof_stale
        exp_alerts: []
      - eval_time: 50h
        alertname: stellarindex_lending_interest_proof_stale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
              job: node_exporter
              instance: r1:9100
              ops_job: ch-entry-history-lending-interest-prove
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-proof-stale
              summary: "a lending interest proof has not finished on its schedule"
              description: |
                The last finished run of ch-entry-history-lending-interest-prove is older than its
                cadence allows (lending-interest-prove.timer, daily: 48 h;
                lending-interest-prove-full.timer, weekly: 8 days): the timer was
                disabled or stopped firing, or a run has hung (heartbeat_stale
                covers a dead one). Its proof gauge still shows the last run's
                verdict, which is no longer current.

  # The weekly full-range proof has its own series and an 8-day threshold: 3 days old is not stale.
  - interval: 1m
    name: the weekly full-range lending interest proof is stale only past eight days
    input_series:
      - series: 'stellarindex_ops_job_last_finish_unix{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest-prove-full"}'
        values: '0x12000'
    alert_rule_test:
      - eval_time: 72h
        alertname: stellarindex_lending_interest_proof_stale
        exp_alerts: []
      - eval_time: 194h
        alertname: stellarindex_lending_interest_proof_stale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
              job: node_exporter
              instance: r1:9100
              ops_job: ch-entry-history-lending-interest-prove-full
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-proof-stale
              summary: "a lending interest proof has not finished on its schedule"
              description: |
                The last finished run of ch-entry-history-lending-interest-prove-full is older than its
                cadence allows (lending-interest-prove.timer, daily: 48 h;
                lending-interest-prove-full.timer, weekly: 8 days): the timer was
                disabled or stopped firing, or a run has hung (heartbeat_stale
                covers a dead one). Its proof gauge still shows the last run's
                verdict, which is no longer current.

  - interval: 1m
    name: a lending interest proof that finishes daily stays quiet
    input_series:
      - series: 'stellarindex_ops_job_last_finish_unix{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest-prove"}'
        values: '0x1439 86400x1439 172800x1439'
    alert_rule_test:
      - eval_time: 70h
        alertname: stellarindex_lending_interest_proof_stale
        exp_alerts: []

  # started_unix 600: the worker started at t=10m and has never succeeded, so the 30 minutes run from the start.
  - interval: 1m
    name: a lending revenue rollup that never succeeded since it started fires
    input_series:
      - series: 'stellarindex_lending_revenue_rollup_started_unix{job="stellarindex-api",instance="api-a:8080"}'
        values: '600x60'
      - series: 'stellarindex_lending_revenue_rollup_last_success_unix{job="stellarindex-api",instance="api-a:8080"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 44m
        alertname: stellarindex_lending_revenue_rollup_stalled
        exp_alerts: []
      - eval_time: 47m
        alertname: stellarindex_lending_revenue_rollup_stalled
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-revenue-rollup-stalled
              summary: "lending revenue rollup has not finished a cycle in over 30 minutes"
              description: |
                No API instance has finished a lending revenue rollup cycle holding
                its lock in over 30 minutes since its last success or start.
                lending_revenue_usd_daily stops advancing and the
                /v1/lending/protocols revenue windows fall behind as lower bounds.

  # Last success at t=30m, then none: fires once 30 minutes have passed plus the 5m hold.
  - interval: 1m
    name: a lending revenue rollup that stops succeeding fires after 30 minutes
    input_series:
      - series: 'stellarindex_lending_revenue_rollup_started_unix{job="stellarindex-api",instance="api-a:8080"}'
        values: '1x120'
      - series: 'stellarindex_lending_revenue_rollup_last_success_unix{job="stellarindex-api",instance="api-a:8080"}'
        values: '0+60x30 1800x90'
    alert_rule_test:
      - eval_time: 64m
        alertname: stellarindex_lending_revenue_rollup_stalled
        exp_alerts: []
      - eval_time: 68m
        alertname: stellarindex_lending_revenue_rollup_stalled
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-revenue-rollup-stalled
              summary: "lending revenue rollup has not finished a cycle in over 30 minutes"
              description: |
                No API instance has finished a lending revenue rollup cycle holding
                its lock in over 30 minutes since its last success or start.
                lending_revenue_usd_daily stops advancing and the
                /v1/lending/protocols revenue windows fall behind as lower bounds.

  # api-a holds the lock and succeeds every minute; api-b never holds it and never succeeds. max() keeps it quiet.
  - interval: 1m
    name: a replica that never holds the lending revenue rollup lock does not fire
    input_series:
      - series: 'stellarindex_lending_revenue_rollup_started_unix{job="stellarindex-api",instance="api-a:8080"}'
        values: '1x150'
      - series: 'stellarindex_lending_revenue_rollup_last_success_unix{job="stellarindex-api",instance="api-a:8080"}'
        values: '0+60x150'
      - series: 'stellarindex_lending_revenue_rollup_started_unix{job="stellarindex-api",instance="api-b:8080"}'
        values: '1x150'
      - series: 'stellarindex_lending_revenue_rollup_last_success_unix{job="stellarindex-api",instance="api-b:8080"}'
        values: '0x150'
    alert_rule_test:
      - eval_time: 2h
        alertname: stellarindex_lending_revenue_rollup_stalled
        exp_alerts: []

  - interval: 1m
    name: a host with the lending revenue rollup disabled stays quiet
    input_series:
      - series: 'stellarindex_lending_revenue_rollup_started_unix{job="stellarindex-api",instance="api-a:8080"}'
        values: '0x150'
      - series: 'stellarindex_lending_revenue_rollup_last_success_unix{job="stellarindex-api",instance="api-a:8080"}'
        values: '0x150'
    alert_rule_test:
      - eval_time: 2h
        alertname: stellarindex_lending_revenue_rollup_stalled
        exp_alerts: []

  - interval: 1m
    name: a lending revenue sweep mismatch tickets
    input_series:
      - series: 'stellarindex_lending_revenue_rollup_sweep_mismatches_total{job="stellarindex-api",instance="api-a:8080"}'
        values: '0x30 1x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: stellarindex_lending_revenue_rollup_sweep_mismatch
        exp_alerts: []
      - eval_time: 40m
        alertname: stellarindex_lending_revenue_rollup_sweep_mismatch
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-revenue-rollup-sweep-mismatch
              summary: "lending revenue rollup's sweep found stored USD that a fresh valuation does not reproduce"
              description: |
                The rollup's daily sweep found stored lending revenue USD days
                in the last day that a fresh day walk valued differently
                with nothing to explain it. Each was rewritten; the cause is a
                valuer that is not deterministic, and served windows may have been
                wrong until the rewrite.
