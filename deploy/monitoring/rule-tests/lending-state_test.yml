rule_files:
  - ../rules/ingestion.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: lending state more than 20000 ledgers behind the cursor fires after 30m
    input_series:
      - series: 'stellarindex_cursor_last_ledger{job="stellarindex",instance="r1:9102",source="ledgerstream"}'
        values: '60000000+10x60'
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '59900000+0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_lending_state_lagging
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-state-lagging
              summary: "lending state history trails the ledgerstream cursor by more than 20000 ledgers"
              description: |
                stellar.lending_state_hourly, derived by lending-state.timer,
                is more than 20000 ledgers behind the ledgerstream cursor for
                30 min. Either the timer is silent, the derive is refusing a
                window (lake hole, or same-ledger changes without intra-ledger
                order), or the initial catch-up is still running.

  - interval: 1m
    name: a host where the lending derive never reported stays quiet
    input_series:
      - series: 'stellarindex_cursor_last_ledger{job="stellarindex",instance="r1:9102",source="ledgerstream"}'
        values: '60000000+10x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_lending_state_lagging
        exp_alerts: []

  - interval: 1m
    name: lending state within 20000 ledgers of the cursor stays quiet
    input_series:
      - series: 'stellarindex_cursor_last_ledger{job="stellarindex",instance="r1:9102",source="ledgerstream"}'
        values: '60000000+10x60'
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '59990000+10x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_lending_state_lagging
        exp_alerts: []
