rule_files:
  - ../rules/ingestion.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: lending state more than 20000 ledgers behind the cursor fires after 30m
    input_series:
      - series: 'stellarindex_cursor_last_ledger{job="stellarindex",instance="r1:9102",source="ledgerstream"}'
        values: '60000000+10x60'
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '59900000+0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_lending_state_lagging
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-state-lagging
              summary: "lending state history trails the ledgerstream cursor by more than 20000 ledgers"
              description: |
                stellar.lending_state_hourly, derived by lending-state.timer,
                is more than 20000 ledgers behind the ledgerstream cursor for
                30 min. Either the timer is silent, the derive is refusing a
                window (lake hole, or same-ledger changes without intra-ledger
                order), or the initial catch-up is still running.

  - interval: 1m
    name: a host where the lending derive never reported stays quiet
    input_series:
      - series: 'stellarindex_cursor_last_ledger{job="stellarindex",instance="r1:9102",source="ledgerstream"}'
        values: '60000000+10x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_lending_state_lagging
        exp_alerts: []

  - interval: 1m
    name: lending state within 20000 ledgers of the cursor stays quiet
    input_series:
      - series: 'stellarindex_cursor_last_ledger{job="stellarindex",instance="r1:9102",source="ledgerstream"}'
        values: '60000000+10x60'
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '59990000+10x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_lending_state_lagging
        exp_alerts: []

  - interval: 1m
    name: lending interest more than 100000 ledgers behind lending state fires after 2h
    input_series:
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '60000000+10x180'
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest"}'
        values: '59899000+0x180'
    alert_rule_test:
      - eval_time: 1h
        alertname: stellarindex_lending_interest_lagging
        exp_alerts: []
      - eval_time: 2h30m
        alertname: stellarindex_lending_interest_lagging
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-lagging
              summary: "lending interest history trails lending state by more than 100000 ledgers"
              description: |
                stellar.lending_interest_hourly is more than 100000 ledgers
                behind lending_state_hourly for 2 h. The timer's pass does not
                catch up that far ("backfill incomplete"): run the backfill
                chunks. Or the pass is refusing a window (WASM gate, identity
                check, uncovered pool), or a backfill chunk is still running.

  - interval: 5m
    name: a redo holding the interest pass for 6h fires
    input_series:
      - series: 'stellarindex_lending_interest_redo_pending{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest"}'
        values: '1x80'
      - series: 'stellarindex_lending_interest_redo_pending{job="node_exporter",instance="r2:9100",ops_job="ch-entry-history-lending-interest"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 5h
        alertname: stellarindex_lending_interest_redo_pending
        exp_alerts: []
      - eval_time: 6h10m
        alertname: stellarindex_lending_interest_redo_pending
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-redo-pending
              summary: "lending interest is held by a pending redo"
              description: |
                A lending_state replay rewrote state the interest rows were
                derived from, and for 6 h the timer's interest pass has derived
                nothing until they are re-derived: run the -interest-only -from
                re-derive its log line names, through the tip.

  - interval: 5m
    name: a redo cleared within 6h stays quiet
    input_series:
      - series: 'stellarindex_lending_interest_redo_pending{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest"}'
        values: '1x60 0x20'
    alert_rule_test:
      - eval_time: 6h30m
        alertname: stellarindex_lending_interest_redo_pending
        exp_alerts: []

  - interval: 1m
    name: a host whose interest pass was never initialised stays quiet
    input_series:
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '60000000+10x180'
    alert_rule_test:
      - eval_time: 2h30m
        alertname: stellarindex_lending_interest_lagging
        exp_alerts: []

  - interval: 1m
    name: lending interest within one window of lending state stays quiet
    input_series:
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending"}'
        values: '60000000+10x180'
      - series: 'stellarindex_ops_job_progress_cursor{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest"}'
        values: '59990000+10x180'
    alert_rule_test:
      - eval_time: 2h30m
        alertname: stellarindex_lending_interest_lagging
        exp_alerts: []

  - interval: 1m
    name: a failed lending interest proof fires at once and clears on the next clean run
    input_series:
      - series: 'stellarindex_lending_interest_proof_failed{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest-prove"}'
        values: '0x10 1x10 0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_lending_interest_proof_failed
        exp_alerts: []
      - eval_time: 12m
        alertname: stellarindex_lending_interest_proof_failed
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-proof-failed
              summary: "the lending interest proof found stored rows that disagree with the lake"
              description: |
                `stellarindex-ops ch-entry-history -lending-only -prove -interest`
                recomputed stellar.lending_interest_hourly from the lake and a
                stored row (or a window's identities) disagrees. The proof's
                report in `journalctl -u lending-interest-prove -n 200` names
                each mismatch: pool, asset, hour, column, stored and recomputed.
                Re-derive the named hours before anything serves them.
      - eval_time: 25m
        alertname: stellarindex_lending_interest_proof_failed
        exp_alerts: []

  # Finished at t=0 (unix 0); time() at eval_time is the seconds since.
  - interval: 1m
    name: a lending interest proof whose last finished run is over two days old fires
    input_series:
      - series: 'stellarindex_ops_job_last_finish_unix{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest-prove"}'
        values: '0x3000'
    alert_rule_test:
      - eval_time: 47h
        alertname: stellarindex_lending_interest_proof_stale
        exp_alerts: []
      - eval_time: 50h
        alertname: stellarindex_lending_interest_proof_stale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
              job: node_exporter
              instance: r1:9100
              ops_job: ch-entry-history-lending-interest-prove
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-proof-stale
              summary: "a lending interest proof has not finished on its schedule"
              description: |
                The last finished run of ch-entry-history-lending-interest-prove is older than its
                cadence allows (lending-interest-prove.timer, daily: 48 h;
                lending-interest-prove-full.timer, weekly: 8 days): the timer was
                disabled or stopped firing, or a run has hung (heartbeat_stale
                covers a dead one). Its proof gauge still shows the last run's
                verdict, which is no longer current.

  # The weekly full-range proof has its own series and an 8-day threshold: 3 days old is not stale.
  - interval: 1m
    name: the weekly full-range lending interest proof is stale only past eight days
    input_series:
      - series: 'stellarindex_ops_job_last_finish_unix{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest-prove-full"}'
        values: '0x12000'
    alert_rule_test:
      - eval_time: 72h
        alertname: stellarindex_lending_interest_proof_stale
        exp_alerts: []
      - eval_time: 194h
        alertname: stellarindex_lending_interest_proof_stale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
              job: node_exporter
              instance: r1:9100
              ops_job: ch-entry-history-lending-interest-prove-full
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#lending-interest-proof-stale
              summary: "a lending interest proof has not finished on its schedule"
              description: |
                The last finished run of ch-entry-history-lending-interest-prove-full is older than its
                cadence allows (lending-interest-prove.timer, daily: 48 h;
                lending-interest-prove-full.timer, weekly: 8 days): the timer was
                disabled or stopped firing, or a run has hung (heartbeat_stale
                covers a dead one). Its proof gauge still shows the last run's
                verdict, which is no longer current.

  - interval: 1m
    name: a lending interest proof that finishes daily stays quiet
    input_series:
      - series: 'stellarindex_ops_job_last_finish_unix{job="node_exporter",instance="r1:9100",ops_job="ch-entry-history-lending-interest-prove"}'
        values: '0x1439 86400x1439 172800x1439'
    alert_rule_test:
      - eval_time: 70h
        alertname: stellarindex_lending_interest_proof_stale
        exp_alerts: []
