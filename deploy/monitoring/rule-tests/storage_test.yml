  # ══ stellarindex_nvme_spare_low ═══════════════════════════════════
  - interval: 1m
    name: an nvme eating its spare pool pages after 30m
    input_series:
      - series: 'nvme_available_spare_ratio{job="node_exporter",instance="r1:9100",device="nvme0n1"}'
        values: '0.1+0x45'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_nvme_spare_low
        exp_alerts:
          - exp_labels:
              job: node_exporter
              instance: r1:9100
              device: nvme0n1
              severity: page
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/nvme-smart.md
              summary: "NVMe nvme0n1 spare blocks down to 10%"
              description: |
                The drive is consuming its reserve block pool, which is a
