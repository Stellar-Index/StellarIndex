        alertname: stellarindex_nvme_media_errors
        exp_alerts:
          - exp_labels:
              job: node_exporter
              instance: r1:9100
              device: nvme0n1
              severity: ticket
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/nvme-smart.md
              summary: "NVMe nvme0n1 reported 15 new media errors in 24h"
              description: |
                Uncorrected media errors on a ZFS member. ZFS will surface
