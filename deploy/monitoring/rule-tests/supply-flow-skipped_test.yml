# stellarindex_supply_flow_skipped: only a reason other than not_token_shaped, sustained, tickets.
# Lives outside deploy/monitoring/rules/ — see the header of archive-completeness_test.yml.

rule_files:
  - ../rules/ingestion.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: a token-shaped body whose amount did not decode tickets after 2h
    input_series:
      - series: 'stellarindex_supply_flow_skipped_total{job="stellarindex-indexer",instance="r1:9464",reason="amount_not_i128"}'
        values: '0+1x300'
      - series: 'stellarindex_supply_flow_skipped_total{job="stellarindex-indexer",instance="r1:9464",reason="not_token_shaped"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 90m
        alertname: stellarindex_supply_flow_skipped
        exp_alerts: []
      - eval_time: 200m
        alertname: stellarindex_supply_flow_skipped
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/clickhouse.md#stellarindex_supply_flow_skipped
              summary: "Supply events written without a supply_flows row"
              description: |
                stellarindex_supply_flow_skipped_total rose for a reason
                other than not_token_shaped (amount_not_i128 or
                body_unparseable) in the last hour, for two hours running.
                A token-shaped mint/burn/clawback body was not decoded, so
                that token's supply_flows sum is short. The raw event is in
                contract_events.

  - interval: 1m
    name: foreign-contract not_token_shaped traffic never tickets
    input_series:
      - series: 'stellarindex_supply_flow_skipped_total{job="stellarindex-indexer",instance="r1:9464",reason="not_token_shaped"}'
        values: '0+5x300'
      - series: 'stellarindex_supply_flow_skipped_total{job="stellarindex-indexer",instance="r1:9464",reason="amount_not_i128"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 200m
        alertname: stellarindex_supply_flow_skipped
        exp_alerts: []
