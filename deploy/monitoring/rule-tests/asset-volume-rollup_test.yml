---
# promtool unit tests for stellarindex_asset_volume_rollup_failing (see the
# rule comment in ../rules/aggregator.yml).
#
#   promtool test rules deploy/monitoring/rule-tests/asset-volume-rollup_test.yml
#
# The listings ignore asset_price_snapshot rows older than 15 min, so the
# alert must fire about 15 min after the last successful sweep, whether
# the sweeps then fail (case 2) or hang and emit nothing (case 3).
#
# PROVEN-RED: under the old rate(refresh_error) > 0 for 30m rule, case 2
# fires only after 30 min (missing at 40m) and case 3 never fires.

rule_files:
  - ../rules/aggregator.yml

evaluation_interval: 1m

tests:
  # ── Case 1: healthy sweeps every 2 min stay silent ──
  - interval: 1m
    input_series:
      - series: 'stellarindex_asset_volume_rollup_sweeps_total{outcome="ok"}'
        values: '0+0.5x60'
      - series: 'stellarindex_asset_volume_rollup_sweeps_total{outcome="refresh_error"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: stellarindex_asset_volume_rollup_failing
        exp_alerts: []

  # ── Case 2: sweeps fail from t=20m; fires within ~15 min, not 30+ ──
  - interval: 1m
    input_series:
      - series: 'stellarindex_asset_volume_rollup_sweeps_total{outcome="ok"}'
        values: '0+0.5x20 10x40'
      - series: 'stellarindex_asset_volume_rollup_sweeps_total{outcome="refresh_error"}'
        values: '0x20 0+0.5x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: stellarindex_asset_volume_rollup_failing
        exp_alerts: []
      - eval_time: 40m
        alertname: stellarindex_asset_volume_rollup_failing
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: aggregator
            exp_annotations: &annotations
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_asset_volume_rollup_failing
              summary: "Asset listing rollups: no successful sweep for 15+ minutes"
              description: |
                The aggregator's asset-volume rollup worker has not completed
                a sweep (asset_volume_24h + asset_price_snapshot upsert) for
                15+ minutes, either failing or hung. Price, change and market
                cap on the asset and contract listings, and the snapshot
                fallback of change summaries, are now blank (snapshot rows
                older than 15 min are ignored); volume_24h_usd is stale.
                /v1/price is unaffected. Fix the failing Postgres backend or
                restart a hung aggregator; the next sweep restores the rows.

  # ── Case 3: a hung pass emits no outcome at all; still fires ──
  - interval: 1m
    input_series:
      - series: 'stellarindex_asset_volume_rollup_sweeps_total{outcome="ok"}'
        values: '0+0.5x20 10x40'
      - series: 'stellarindex_asset_volume_rollup_sweeps_total{outcome="refresh_error"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_asset_volume_rollup_failing
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: aggregator
            exp_annotations: *annotations
