---
# promtool unit tests for the price-quality alert family in
# ../rules/divergence.yml.
#
#   promtool test rules deploy/monitoring/rule-tests/divergence_test.yml
#
# The two price-divergence alerts are INERT in production (F-1329:
# stellarindex_our_price / stellarindex_reference_price have no
# Prometheus producer — divergence values live in PG + Redis). That is
# precisely why they are tested here: promtool proves the EXPR fires on
# synthetic series, so the rules' logic is known-good the day a producer
# lands, and any threshold edit to a dormant rule is still caught.
#
# Deliberately lives OUTSIDE `deploy/monitoring/rules/` — everything in
# that directory is globbed by `promtool check rules`,
# lint-rule-structure.py and lint-metric-refs.sh, all of which require a
# top-level `groups:` key that a unit-test file does not have.

rule_files:
  - ../rules/divergence.yml

evaluation_interval: 1m

tests:
  # ══ stellarindex_price_divergence_warning (INERT, F-1329) ═════════
  # ── firing: 6% off reference crosses the 5% warning line only ─────
  - interval: 1m
    name: a six percent divergence warns but is not critical
    input_series:
      - series: 'stellarindex_our_price{job="stellarindex_aggregator",instance="r1:9102",asset="XLM",reference_source="coingecko"}'
        values: '106+0x10'
      - series: 'stellarindex_reference_price{job="stellarindex_aggregator",instance="r1:9102",asset="XLM",reference_source="coingecko"}'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_price_divergence_warning
        exp_alerts:
          - exp_labels:
              job: stellarindex_aggregator
              instance: r1:9102
              asset: XLM
              reference_source: coingecko
              severity: informational
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/price-divergence.md
              summary: "XLM 6% off reference"
              description: |
                Our aggregated price for XLM differs from reference
                (coingecko) by > 5 % sustained 2 min.
                Normal during rapid market moves; investigate if sustained.
      - eval_time: 5m
        alertname: stellarindex_price_divergence_critical
        exp_alerts: []

  # ── near-threshold: 4% off stays silent ───────────────────────────
  - interval: 1m
    name: a four percent divergence raises nothing
    input_series:
      - series: 'stellarindex_our_price{job="stellarindex_aggregator",instance="r1:9102",asset="XLM",reference_source="coingecko"}'
        values: '104+0x10'
      - series: 'stellarindex_reference_price{job="stellarindex_aggregator",instance="r1:9102",asset="XLM",reference_source="coingecko"}'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_price_divergence_warning
        exp_alerts: []
      - eval_time: 5m
        alertname: stellarindex_price_divergence_critical
        exp_alerts: []

  # ══ stellarindex_price_divergence_critical (INERT, F-1329) ════════
  # ── firing: 15% off trips both tiers; abs() catches the low side ──
  # The price is BELOW reference here, so this also pins the abs()
  # in the expr — a one-sided comparator would miss an undershoot.
  - interval: 1m
    name: a fifteen percent undershoot is critical
    input_series:
      - series: 'stellarindex_our_price{job="stellarindex_aggregator",instance="r1:9102",asset="XLM",reference_source="coingecko"}'
        values: '85+0x10'
      - series: 'stellarindex_reference_price{job="stellarindex_aggregator",instance="r1:9102",asset="XLM",reference_source="coingecko"}'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_price_divergence_critical
        exp_alerts:
          - exp_labels:
              job: stellarindex_aggregator
              instance: r1:9102
              asset: XLM
              reference_source: coingecko
              severity: ticket
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/price-divergence.md
              summary: "XLM 15% off reference (critical)"
              description: |
                Divergence > 10 % from reference sustained 2 min. This is usually
                a bad ingest (wrong decimals, stale source contributing) rather
                than a real market move.

  # ══ stellarindex_oracle_stale ═════════════════════════════════════
  # Every case below carries a
  # `stellarindex_oracle_staleness_budget_seconds` series on the SAME
  # label set as `stellarindex_oracle_last_update_unix`, because that is
  # what production carries: obs.RecordOracleUpdate emits the two
  # together (#478). Before that, the budget was computed inside the
  # expression from the {source}-only resolution gauge, and the rule
  # needed `ignoring(asset) group_left()` to bridge the label mismatch.
  #
  # A fixture that keeps only the resolution series now goes empty —
  # which is exactly the intended failure: the rule must read the
  # per-asset budget, never re-derive a threshold of its own.

  # ── firing: no publish for longer than the pair's budget ──────────
  # 3000 s is the DEFAULT budget for a reflector source: 10 × its 300 s
  # declared resolution, i.e. the number the old expression computed
  # inline. The resolution series rides along because production still
  # publishes it (it describes the oracle's cadence and is what the
  # default is derived from) — but nothing in the rule reads it, and
  # the boundary case further down proves that by omitting it.
  - interval: 1m
    name: an oracle silent past its staleness budget tickets
    input_series:
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex",asset="XLM"}'
        values: '0+0x60'
      - series: 'stellarindex_oracle_staleness_budget_seconds{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex",asset="XLM"}'
        values: '3000+0x60'
      # NO asset label on the resolution series. stellarindex_oracle_-
      # resolution_seconds is declared with []string{"source"}
      # (internal/obs/metrics.go), so a series carrying `asset` cannot
      # exist in production — WithLabelValues would panic. This test
      # used to fabricate one, which is the only reason the old broken
      # join ever went green (wave-D ALERT-02).
      - series: 'stellarindex_oracle_resolution_seconds{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex"}'
        values: '300+0x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: stellarindex_oracle_stale
        exp_alerts:
          - exp_labels:
              job: stellarindex_aggregator
              instance: r1:9102
              source: reflector-dex
              asset: XLM
              severity: ticket
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-stale.md
              summary: "Oracle reflector-dex stale for XLM"
              description: |
                reflector-dex hasn't published a price for XLM
                in longer than that pair's staleness budget (default 10× the
                source's declared resolution; per-asset overrides live in
                [[oracle.staleness_overrides]]). May be legitimate (oracle paused)
                or a signal of oracle failure — check the oracle's own status page.

  # ── near-threshold: a publishing oracle stays silent ──────────────
  - interval: 1m
    name: a publishing oracle raises nothing
    input_series:
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex",asset="XLM"}'
        values: '0+60x60'
      - series: 'stellarindex_oracle_staleness_budget_seconds{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex",asset="XLM"}'
        values: '3000+0x60'
      - series: 'stellarindex_oracle_resolution_seconds{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex"}'
        values: '300+0x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: stellarindex_oracle_stale
        exp_alerts: []

  # ── NOT firing: one source, TWO assets, only one of them silent ───
  # The budget is per (source, asset), so the fresh sibling has its own
  # budget series and its own comparison. A regression that aggregated
  # the budget up to {source} — or dropped `asset` from either side —
  # would either lose this per-asset cardinality or fail the match.
  - interval: 1m
    name: a fresh asset on a source with a stale sibling does not ticket
    input_series:
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex",asset="XLM"}'
        values: '0+0x60'
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex",asset="USDC"}'
        values: '0+60x60'
      - series: 'stellarindex_oracle_staleness_budget_seconds{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex",asset="XLM"}'
        values: '3000+0x60'
      - series: 'stellarindex_oracle_staleness_budget_seconds{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex",asset="USDC"}'
        values: '3000+0x60'
      - series: 'stellarindex_oracle_resolution_seconds{job="stellarindex_aggregator",instance="r1:9102",source="reflector-dex"}'
        values: '300+0x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: stellarindex_oracle_stale
        exp_alerts:
          - exp_labels:
              job: stellarindex_aggregator
              instance: r1:9102
              source: reflector-dex
              asset: XLM
              severity: ticket
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-stale.md
              summary: "Oracle reflector-dex stale for XLM"
              description: |
                reflector-dex hasn't published a price for XLM
                in longer than that pair's staleness budget (default 10× the
                source's declared resolution; per-asset overrides live in
                [[oracle.staleness_overrides]]). May be legitimate (oracle paused)
                or a signal of oracle failure — check the oracle's own status page.

  # ── multi-target: TWO indexer instances, one silent oracle each ────
  # This case was written when the rule joined two label sets, to prove
  # `on (source)` could not be used: `on` discards job/instance, so two
  # targets exporting the same {source} made the right side non-unique
  # and the WHOLE RULE errored —
  #
  #   found duplicate series for the match group {source="reflector-dex"}
  #   … many-to-many matching not allowed
  #
  # — which the multi-host prometheus template produces the moment a
  # second indexer host (R2, ADR-0004/ADR-0016) is scraped. It is kept
  # because the bare comparison must clear the same bar: both series
  # come from the same process, so job/instance match naturally and each
  # target gets its own alert.
  - interval: 1m
    name: two scrape targets each get their own alert, not a match error
    input_series:
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_indexer",instance="r1:9101",source="reflector-dex",asset="XLM"}'
        values: '0+0x60'
      - series: 'stellarindex_oracle_staleness_budget_seconds{job="stellarindex_indexer",instance="r1:9101",source="reflector-dex",asset="XLM"}'
        values: '3000+0x60'
      - series: 'stellarindex_oracle_resolution_seconds{job="stellarindex_indexer",instance="r1:9101",source="reflector-dex"}'
        values: '300+0x60'
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_indexer",instance="r2:9101",source="reflector-dex",asset="XLM"}'
        values: '0+0x60'
      - series: 'stellarindex_oracle_staleness_budget_seconds{job="stellarindex_indexer",instance="r2:9101",source="reflector-dex",asset="XLM"}'
        values: '3000+0x60'
      - series: 'stellarindex_oracle_resolution_seconds{job="stellarindex_indexer",instance="r2:9101",source="reflector-dex"}'
        values: '300+0x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: stellarindex_oracle_stale
        exp_alerts:
          - exp_labels:
              job: stellarindex_indexer
              instance: r1:9101
              source: reflector-dex
              asset: XLM
              severity: ticket
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-stale.md"
              summary: "Oracle reflector-dex stale for XLM"
              description: |
                reflector-dex hasn't published a price for XLM
                in longer than that pair's staleness budget (default 10× the
                source's declared resolution; per-asset overrides live in
                [[oracle.staleness_overrides]]). May be legitimate (oracle paused)
                or a signal of oracle failure — check the oracle's own status page.
          - exp_labels:
              job: stellarindex_indexer
              instance: r2:9101
              source: reflector-dex
              asset: XLM
              severity: ticket
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-stale.md"
              summary: "Oracle reflector-dex stale for XLM"
              description: |
                reflector-dex hasn't published a price for XLM
                in longer than that pair's staleness budget (default 10× the
                source's declared resolution; per-asset overrides live in
                [[oracle.staleness_overrides]]). May be legitimate (oracle paused)
                or a signal of oracle failure — check the oracle's own status page.

  # ── the no-behaviour-change boundary: an un-overridden asset ───────
  # The point of #478 is that adding a per-asset budget must not move a
  # single existing alert. So this pins the exact minute an asset with
  # NO override goes off, against the default budget of 3000 s
  # (10 × reflector's 300 s resolution — the same arithmetic the old
  # expression did inline).
  #
  # time() starts at 0 in a promtool test and last_update_unix is
  # pinned at 0, so the age IS the eval time: the condition first turns
  # true at 51m (3060 > 3000) and `for: 2m` promotes it at 53m. 52m
  # must still be silent — a rule that read a looser budget, or dropped
  # the `for`, would ticket a minute early here.
  #
  # NO resolution series in this fixture, deliberately: if the rule ever
  # regresses to deriving its own threshold from the {source} gauge,
  # this case goes empty instead of silently passing.
  - interval: 1m
    name: an un-overridden asset tickets at the pre-budget threshold and not a minute sooner
    input_series:
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_indexer",instance="r1:9101",source="reflector-cex",asset="crypto:XLM"}'
        values: '0+0x60'
      - series: 'stellarindex_oracle_staleness_budget_seconds{job="stellarindex_indexer",instance="r1:9101",source="reflector-cex",asset="crypto:XLM"}'
        values: '3000+0x60'
    alert_rule_test:
      - eval_time: 52m
        alertname: stellarindex_oracle_stale
        exp_alerts: []
      - eval_time: 53m
        alertname: stellarindex_oracle_stale
        exp_alerts:
          - exp_labels:
              job: stellarindex_indexer
              instance: r1:9101
              source: reflector-cex
              asset: crypto:XLM
              severity: ticket
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-stale.md
              summary: "Oracle reflector-cex stale for crypto:XLM"
              description: |
                reflector-cex hasn't published a price for crypto:XLM
                in longer than that pair's staleness budget (default 10× the
                source's declared resolution; per-asset overrides live in
                [[oracle.staleness_overrides]]). May be legitimate (oracle paused)
                or a signal of oracle failure — check the oracle's own status page.

  # ── an overridden asset is quiet INSIDE its widened budget ────────
  # reflector-cex / crypto:DAI carries the one shipped override: 32400 s
  # (9 h) against the 3000 s (50 min) source default, because DAI is a
  # peg asset Reflector publishes only on movement — observed gaps to
  # 7 h, breaching the default on 11.6% of evaluations with nothing
  # broken (#478).
  #
  # 8 h of silence is well past the default and well inside the
  # override. Under the old per-source threshold this pair would have
  # been ticketing for over seven hours by now.
  - interval: 1m
    name: an overridden asset stays quiet inside its widened budget
    input_series:
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_indexer",instance="r1:9101",source="reflector-cex",asset="crypto:DAI"}'
        values: '0+0x560'
      - series: 'stellarindex_oracle_staleness_budget_seconds{job="stellarindex_indexer",instance="r1:9101",source="reflector-cex",asset="crypto:DAI"}'
        values: '32400+0x560'
      # The source still declares 300 s, and that is the point: this
      # case only means something because the pre-#478 threshold
      # (10 × 300 = 3000 s) is present in the fixture and the rule
      # ignores it in favour of the pair's own budget.
      - series: 'stellarindex_oracle_resolution_seconds{job="stellarindex_indexer",instance="r1:9101",source="reflector-cex"}'
        values: '300+0x560'
    alert_rule_test:
      - eval_time: 480m
        alertname: stellarindex_oracle_stale
        exp_alerts: []

  # ── an overridden asset STILL tickets past its widened budget ─────
  # An override widens the bound; it never removes it. Same series as
  # above, evaluated past 9 h: the condition turns true at 541m
  # (32460 > 32400) and `for: 2m` promotes it at 543m, so a genuine DAI
  # outage still reaches the operator. A "budget" implemented as a mute
  # would leave this case empty.
  - interval: 1m
    name: an overridden asset still tickets once past its widened budget
    input_series:
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_indexer",instance="r1:9101",source="reflector-cex",asset="crypto:DAI"}'
        values: '0+0x560'
      - series: 'stellarindex_oracle_staleness_budget_seconds{job="stellarindex_indexer",instance="r1:9101",source="reflector-cex",asset="crypto:DAI"}'
        values: '32400+0x560'
      - series: 'stellarindex_oracle_resolution_seconds{job="stellarindex_indexer",instance="r1:9101",source="reflector-cex"}'
        values: '300+0x560'
    alert_rule_test:
      - eval_time: 542m
        alertname: stellarindex_oracle_stale
        exp_alerts: []
      - eval_time: 543m
        alertname: stellarindex_oracle_stale
        exp_alerts:
          - exp_labels:
              job: stellarindex_indexer
              instance: r1:9101
              source: reflector-cex
              asset: crypto:DAI
              severity: ticket
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-stale.md
              summary: "Oracle reflector-cex stale for crypto:DAI"
              description: |
                reflector-cex hasn't published a price for crypto:DAI
                in longer than that pair's staleness budget (default 10× the
                source's declared resolution; per-asset overrides live in
                [[oracle.staleness_overrides]]). May be legitimate (oracle paused)
                or a signal of oracle failure — check the oracle's own status page.

  # ── an age with no budget series cannot ticket at all ─────────────
  # This is why the two gauges are emitted from ONE call
  # (obs.RecordOracleUpdate): a bare vector-to-vector comparison is
  # evaluated only where both sides carry identical labels, so an asset
  # that somehow acquired an age without a budget would be silently
  # un-alertable — the rule would look perfectly healthy while covering
  # nothing. Pinned here so the consequence is written down, and
  # prevented in code by TestRecordOracleUpdate_EveryAgeHasABudget
  # (internal/obs) plus TestBuildDispatcher_DeclaresBudgetForEveryOracle-
  # Source (internal/pipeline).
  #
  # Note this is NOT a regression from the join it replaced: the old
  # expression joined against the {source} resolution gauge, so a source
  # missing that series was un-alertable in exactly the same way.
  # obs.OracleStalenessBudget returns +Inf for an undeclared source,
  # which keeps that silence while still emitting a visible series.
  - interval: 1m
    name: an age with no budget series raises nothing
    input_series:
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_indexer",instance="r1:9101",source="reflector-cex",asset="crypto:XLM"}'
        values: '0+0x60'
      - series: 'stellarindex_oracle_resolution_seconds{job="stellarindex_indexer",instance="r1:9101",source="reflector-cex"}'
        values: '300+0x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: stellarindex_oracle_stale
        exp_alerts: []

  # ══ stellarindex_divergence_refresh_error_dominant ════════════════
  # ── firing: errors at 1/s vs ok at 0.1/s for 30+ min ─────────────
  - interval: 1m
    name: an error-dominant divergence refresher tickets after 30m
    input_series:
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="refresh_error"}'
        values: '0+60x50'
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="ok"}'
        values: '0+6x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: stellarindex_divergence_refresh_error_dominant
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/divergence-refresh-error-dominant.md
              summary: "Divergence-cache refresh failing more often than succeeding (P3)"
              description: |
                More refresh_error outcomes than ok over the last 5 min for
                30+ min sustained. CoinGecko / Chainlink RPC reachability is
                the usual cause; the API's `flags.divergence_warning` stops
                updating and goes stale once the 5-min cache TTL elapses.
                Check the upstream reference's status, then the aggregator's
                `divergence refresher wired` startup log line for which
                references are configured.

  # ── near-threshold: a mostly-healthy refresher stays silent ───────
  - interval: 1m
    name: an ok-dominant divergence refresher raises nothing
    input_series:
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="refresh_error"}'
        values: '0+6x50'
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="ok"}'
        values: '0+60x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: stellarindex_divergence_refresh_error_dominant
        exp_alerts: []

  # ── guard: the cold-start state (both rates zero) stays silent ────
  - interval: 1m
    name: a cold-start refresher with flat counters raises nothing
    input_series:
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="refresh_error"}'
        values: '0+0x50'
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="ok"}'
        values: '0+0x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: stellarindex_divergence_refresh_error_dominant
        exp_alerts: []

  # ══ stellarindex_divergence_no_reference (CS-088) ═════════════════
  # ── firing: every pair blind, zero ok outcomes ────────────────────
  # And the CS-088 point in one fixture: no_reference is NEITHER
  # refresh_error NOR ok, so the error-dominant sibling must stay
  # silent while this one fires — the "silent checker" case only this
  # alert can see.
  - interval: 1m
    name: a checker running blind tickets on no-reference and only there
    input_series:
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="no_reference"}'
        values: '0+12x50'
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="ok"}'
        values: '9000+0x50'
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="refresh_error"}'
        values: '0+0x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: stellarindex_divergence_no_reference
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/divergence-no-reference.md
              summary: "Divergence checker running blind — no reference responded (P3)"
              description: |
                For 30+ min more pairs received zero reference responses than got a
                healthy comparison. Every divergence reference (CoinGecko,
                Chainlink) is unreachable for those pairs, so
                flags.divergence_warning is frozen — a live depeg would go
                unflagged. Check the CoinGecko Pro key / 429 state and Chainlink
                RPC reachability; see the runbook.
      - eval_time: 45m
        alertname: stellarindex_divergence_refresh_error_dominant
        exp_alerts: []

  # ── near-threshold: healthy comparisons outnumber blind pairs ─────
  - interval: 1m
    name: minority no-reference outcomes raise nothing
    input_series:
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="no_reference"}'
        values: '0+6x50'
      - series: 'stellarindex_divergence_refresh_total{job="stellarindex_aggregator",instance="r1:9102",outcome="ok"}'
        values: '0+12x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: stellarindex_divergence_no_reference
        exp_alerts: []

  # ══ stellarindex_oracle_stream_rows_unparsed ══════════════════════
  # The counter is an unseeded CounterVec, so a `{source,field}` child
  # is BORN on the first bad row. A relabel typo that breaks one row on
  # a surface nobody re-requests increments it exactly once: the series
  # appears at 1 and stays there. increase() over a flat range is 0 —
  # so the increase() arm alone never fires for the one-off, which is
  # the shape this alert exists to catch.
  #
  # PROVEN-RED: delete the `or ( … unless … offset 6h )` arm from
  # ../rules/divergence.yml and this case fails with
  # "alertname:stellarindex_oracle_stream_rows_unparsed, time:60m,
  #  exp:[…], got:[]".
  - interval: 1m
    name: a single unparseable oracle row tickets even though increase reads zero
    input_series:
      # Absent for 10 min (the child does not exist yet), then born at 1
      # and flat for the rest of the window.
      - series: 'stellarindex_oracle_stream_rows_unparsed_total{job="stellarindex_api",instance="r1:8080",source="reflector",field="asset"}'
        values: '_x10 1+0x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: stellarindex_oracle_stream_rows_unparsed
        exp_alerts:
          - exp_labels:
              job: stellarindex_api
              instance: r1:8080
              source: reflector
              field: asset
              severity: ticket
              team: stellarindex
              component: divergence
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-stream-rows-unparsed.md
              summary: "Oracle rows dropped from the served stream — unparseable asset (reflector)"
              description: |
                LatestOracleStreams could not parse the stored canonical
                `asset` text on one or more reflector
                oracle_updates rows, so those rows are ABSENT from
                /v1/oracle/streams and the explorer's /oracles page.

                The likeliest cause is a hand-written relabel: the documented
                remediation for a mislabelled oracle row is an operator-run raw
                SQL UPDATE against this column, which carries no CHECK
                constraint. Before this alert existed, a typo there deleted the
                row from the served surface silently — the operator would watch
                it disappear and reasonably conclude the relabel had worked.

                Find them:
                  SELECT DISTINCT source, asset, quote FROM oracle_updates
                   WHERE source = 'reflector'
                   ORDER BY 1,2,3;
                and compare against internal/canonical's accepted forms.

  # ── the born-in-window arm ages out ──────────────────────────────
  # Once the birth is older than the 6h window the child stops being
  # "new", increase() is still 0, and the ticket resolves. Without
  # this the raw-value comparison would latch the way the removed
  # nonstandard-decimals detector did (aggregator.yml) — a fixed row
  # would keep ticketing until the API process restarted.
  - interval: 1m
    name: a long-flat unparsed counter stops ticketing once the birth ages out
    input_series:
      - series: 'stellarindex_oracle_stream_rows_unparsed_total{job="stellarindex_api",instance="r1:8080",source="reflector",field="asset"}'
        values: '1+0x450'
    alert_rule_test:
      - eval_time: 430m
        alertname: stellarindex_oracle_stream_rows_unparsed
        exp_alerts: []

  # ── a healthy stream is silent ───────────────────────────────────
  # No child exists at all: nothing has ever failed to parse.
  - interval: 1m
    name: a stream with no unparseable rows raises nothing
    input_series:
      - series: 'stellarindex_oracle_last_update_unix{job="stellarindex_api",instance="r1:8080",source="reflector",asset="XLM"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_oracle_stream_rows_unparsed
        exp_alerts: []
