---
# promtool unit tests for cross-region.yml (GH-1039).
#
#   promtool test rules deploy/monitoring/rule-tests/cross-region_test.yml

rule_files:
  - ../rules/cross-region.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: sustained divergence pages a ticket
    input_series:
      - series: 'stellarindex_cross_region_divergences_total{pair="XLM/USDC", metric="vwap"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: stellarindex_cross_region_divergence
        exp_alerts:
          - exp_labels:
              pair: XLM/USDC
              metric: vwap
              severity: ticket
              team: stellarindex
              component: archive
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/cross-region-divergence.md
              summary: "Cross-region divergence on XLM/USDC/vwap (P3)"
              description: |
                stellarindex_cross_region_divergences_total has been
                incrementing for XLM/USDC / vwap
                for 5+ minutes: two regions disagreed on a closed bucket's
                served value. Check stellarindex_cross_region_checks_total
                (outcome="divergence") per region for which side moved.

  - interval: 1m
    name: no divergence never fires
    input_series:
      - series: 'stellarindex_cross_region_divergences_total{pair="XLM/USDC", metric="vwap"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: stellarindex_cross_region_divergence
        exp_alerts: []

  - interval: 1m
    name: a stalled check loop pages a ticket
    input_series:
      - series: 'stellarindex_cross_region_last_run_timestamp_seconds'
        values: '100 100x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: stellarindex_cross_region_check_stale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: archive
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/cross-region-divergence.md
              summary: "Cross-region check loop has stopped completing sweeps (P3)"
              description: |
                stellarindex_cross_region_last_run_timestamp_seconds has
                not advanced in 5+ minutes: the check loop is stuck or the
                process is down. No region comparisons are running, so a
                real divergence would go unseen. Check
                stellarindex_cross_region_check_in_flight (persistent 1
                means a stuck sweep) and the process logs.

  - interval: 1m
    name: a live-advancing check loop never trips staleness
    input_series:
      - series: 'stellarindex_cross_region_last_run_timestamp_seconds'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: stellarindex_cross_region_check_stale
        exp_alerts: []
