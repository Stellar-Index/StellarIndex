---
# promtool unit tests for the textfile_producer_stale catch-all's exclusions in ../rules/storage.yml.
#
#   promtool test rules deploy/monitoring/rule-tests/storage-textfile-stale-exclusions_test.yml
#
# Split out of storage_test.yml: this group evaluates every storage.yml rule
# each minute out to 841h (~50k steps), so in one file it serialised most of
# `make monitoring-check`, which runs one promtool process per file in parallel.

rule_files:
  - ../rules/storage.yml

evaluation_interval: 1m

tests:
  # ── the textfile_producer_stale catch-all false-fires on producer shapes with
  # no dedicated staleness alert: ops_job's pid-orphan siblings, the
  # one-off backfill, usd-volume-restamp and per-source projected-rebuild
  # jobs, the monthly
  # restore-drill files and the weekly Tier D verify-archive file. This pins the exclusion — and that it does NOT
  # over-exclude other ops_job primaries, which should still trip the
  # catch-all like any other producer.
  - interval: 1m
    name: textfile_producer_stale excludes pid-orphans, one-off ops jobs, restore-drill, tier-d and ch-lake-backup only
    input_series:
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/some_other_producer.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/ops_job_ch_rebuild.pid4242.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/ops_job_backfill.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/ops_job_usd_volume_restamp.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/ops_job_projected_rebuild_cctp.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/ops_job_projected_rebuild_soroswap_router.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/ops_job_projector_replay.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/restore_drill.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/restore_drill_repo2.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/alertmanager_receivers.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/verify_archive_tier_d.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
      - series: 'node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/ch_lake_backup.prom",instance="r1:9100",job="node_exporter"}'
        values: '0x50600'
    alert_rule_test:
      # Past the 24h + 30m threshold: an unrelated producer and a
      # non-excluded ops_job primary both fire — proving the exclusion
      # is scoped to the named shapes, not to every ops_job_* file.
      - eval_time: 26h
        alertname: stellarindex_textfile_producer_stale
        exp_alerts:
          - exp_labels:
              file: /var/lib/node_exporter/textfile_collector/some_other_producer.prom
              instance: r1:9100
              job: node_exporter
              severity: ticket
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/textfile-stale.md#stellarindex_textfile_producer_stale
              summary: "textfile-collector file /var/lib/node_exporter/textfile_collector/some_other_producer.prom has not been refreshed in 24h+ on r1:9100"
              description: |
                node_exporter has not seen a fresh mtime on /var/lib/node_exporter/textfile_collector/some_other_producer.prom
                for 24+ hours. Its producing timer/cron has likely died; check
                scripts/ci/textfile-producers.manifest for which script owns
                this file and `systemctl status` its unit. This is a catch-all:
                most producers should have fired their own, tighter alert long
                before this one does.
          - exp_labels:
              file: /var/lib/node_exporter/textfile_collector/ops_job_projector_replay.prom
              instance: r1:9100
              job: node_exporter
              severity: ticket
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/textfile-stale.md#stellarindex_textfile_producer_stale
              summary: "textfile-collector file /var/lib/node_exporter/textfile_collector/ops_job_projector_replay.prom has not been refreshed in 24h+ on r1:9100"
              description: |
                node_exporter has not seen a fresh mtime on /var/lib/node_exporter/textfile_collector/ops_job_projector_replay.prom
                for 24+ hours. Its producing timer/cron has likely died; check
                scripts/ci/textfile-producers.manifest for which script owns
                this file and `systemctl status` its unit. This is a catch-all:
                most producers should have fired their own, tighter alert long
                before this one does.
      # Still past 35d: the restore-drill files stay excluded from the
      # catch-all forever (no double-alerting with the dedicated rule
      # below), the other exclusions likewise.
      - eval_time: 841h
        alertname: stellarindex_textfile_producer_stale
        exp_alerts:
          - exp_labels:
              file: /var/lib/node_exporter/textfile_collector/some_other_producer.prom
              instance: r1:9100
              job: node_exporter
              severity: ticket
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/textfile-stale.md#stellarindex_textfile_producer_stale
              summary: "textfile-collector file /var/lib/node_exporter/textfile_collector/some_other_producer.prom has not been refreshed in 24h+ on r1:9100"
              description: |
                node_exporter has not seen a fresh mtime on /var/lib/node_exporter/textfile_collector/some_other_producer.prom
                for 24+ hours. Its producing timer/cron has likely died; check
                scripts/ci/textfile-producers.manifest for which script owns
                this file and `systemctl status` its unit. This is a catch-all:
                most producers should have fired their own, tighter alert long
                before this one does.
          - exp_labels:
              file: /var/lib/node_exporter/textfile_collector/ops_job_projector_replay.prom
              instance: r1:9100
              job: node_exporter
              severity: ticket
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/textfile-stale.md#stellarindex_textfile_producer_stale
              summary: "textfile-collector file /var/lib/node_exporter/textfile_collector/ops_job_projector_replay.prom has not been refreshed in 24h+ on r1:9100"
              description: |
                node_exporter has not seen a fresh mtime on /var/lib/node_exporter/textfile_collector/ops_job_projector_replay.prom
                for 24+ hours. Its producing timer/cron has likely died; check
                scripts/ci/textfile-producers.manifest for which script owns
                this file and `systemctl status` its unit. This is a catch-all:
                most producers should have fired their own, tighter alert long
                before this one does.
