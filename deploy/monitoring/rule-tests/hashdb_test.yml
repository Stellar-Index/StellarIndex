---
# promtool unit tests for the hashdb alert family (T634), rules live in
# hashdb.yml.
#
#   promtool test rules deploy/monitoring/rule-tests/hashdb_test.yml
#
# stellarindex_hashdb_append_total{outcome} has carried the warning
# "error means the drift detector is silently not recording" since it
# was declared (internal/obs/metrics.go), but until T634 nothing
# consumed it: hashdb.yml alerted on the verify-sweep side only
# (drift_detected, verify_failing), leaving the write side with zero
# alert coverage. A sustained run of Append errors is the ONLY signal
# that hashdb has gone blind on ingest — the periodic verify sweep
# would just report Missing, never Drifted, for ledgers appended while
# broken.

rule_files:
  - ../rules/hashdb.yml

evaluation_interval: 1m

tests:
  # ── Append is failing more than it succeeds, sustained ───────────
  - interval: 1m
    name: sustained hashdb Append errors trip append_failing
    input_series:
      - series: 'stellarindex_hashdb_append_total{outcome="error",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+2x40'
      - series: 'stellarindex_hashdb_append_total{outcome="ok",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_hashdb_append_failing
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: hashdb
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/hashdb.md#stellarindex_hashdb_append_failing
              summary: "hashdb per-ledger Append failing more often than it succeeds (P3)"
              description: |
                More error-outcome hashdb.Append calls than ok-outcome ones
                over the last 15m, sustained 10+ min. Append runs once per
                ledger on the indexer's live ingest loop and is deliberately
                failure-tolerant — it never stalls or fails ingest — so this
                counter is the ONLY signal that the write side has gone
                silent. A sustained run of errors here means the periodic
                verify sweep has nothing recorded to compare against and
                will report Missing, not Drifted, even if real drift is
                happening. Check the indexer's hashdb Append error logs
                (disk full, permission error, out-of-range seq), then the
                runbook.

  # ── ordinary ingest: Append succeeding must never fire ───────────
  - interval: 1m
    name: healthy hashdb Append outcomes never trip append_failing
    input_series:
      - series: 'stellarindex_hashdb_append_total{outcome="error",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+0x40'
      - series: 'stellarindex_hashdb_append_total{outcome="ok",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_hashdb_append_failing
        exp_alerts: []

  # ── T132: verify sweep permanently idle (every tick an early
  # return in hashDBVerifySweep) must trip verify_stale even though
  # verify_failing's rate() ratio reads as no-data-so-green. Every
  # input below carries the six verify_runs_total series seeded at 0
  # by obs.seedHashdbSeries, as a real scrape does. ─────────────────
  - interval: 1m
    name: append active but verify sweep never emits an outcome trips verify_stale
    input_series:
      - series: 'stellarindex_hashdb_append_total{outcome="ok",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+1x400'
      - series: 'stellarindex_hashdb_append_total{outcome="error",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="drift",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="drift",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
    alert_rule_test:
      - eval_time: 400m
        alertname: stellarindex_hashdb_verify_stale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: hashdb
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/hashdb.md#stellarindex_hashdb_verify_stale
              summary: "hashdb periodic verify sweep has recorded no outcome in 6h+ (T132)"
              description: |
                hashdb.Append has been recording ledgers on this region for
                the last 6h and was already recording 6h ago (so hashdb IS
                enabled and ingest IS live) but
                stellarindex_hashdb_verify_runs_total has not increased over
                the same window — the periodic verifier hasn't completed a
                single pass, clean, drifted or errored.
                verify_failing above can't catch this: it's a ratio of
                outcomes recorded BY the sweep, and a sweep that never
                emits an outcome (every tick took hashDBVerifySweep's early
                return, or the ticker goroutine died) leaves that ratio's
                both sides at zero, which its own `rate(...) > 0` guard
                reads as no signal rather than as failure. Same effect as
                drift_detected going permanently dark: the detector isn't
                wrong, it just stopped running. Check the indexer process
                is alive and its logs for hashdb verifier startup/panic,
                then the runbook.

  # ── hashdb disabled: append and verify series exist at their seeded
  # zero for the life of the process — must stay silent ─────────────
  - interval: 1m
    name: hashdb disabled on region never trips verify_stale
    input_series:
      - series: 'stellarindex_hashdb_append_total{outcome="ok",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_append_total{outcome="error",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="drift",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="drift",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
    alert_rule_test:
      - eval_time: 400m
        alertname: stellarindex_hashdb_verify_stale
        exp_alerts: []

  # ── one verify run inside the 6h window — must not fire ─────────────
  - interval: 1m
    name: verify run within 6h never trips verify_stale
    input_series:
      - series: 'stellarindex_hashdb_append_total{outcome="ok",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+1x400'
      - series: 'stellarindex_hashdb_append_total{outcome="error",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x299 1x100'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="drift",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="drift",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x400'
    alert_rule_test:
      - eval_time: 400m
        alertname: stellarindex_hashdb_verify_stale
        exp_alerts: []

  # ── fresh start (hashdb just enabled, series born at seed 0): the
  # offset 6h arm holds the rule until appends are 6h old, then the
  # still-idle verifier tickets ─────────────────────────────────────
  - interval: 1m
    name: fresh start stays silent for 6h then trips verify_stale
    input_series:
      - series: 'stellarindex_hashdb_append_total{outcome="ok",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+1x420'
      - series: 'stellarindex_hashdb_append_total{outcome="error",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x420'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x420'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x420'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x420'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x420'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="drift",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x420'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="drift",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x420'
    alert_rule_test:
      - eval_time: 360m
        alertname: stellarindex_hashdb_verify_stale
        exp_alerts: []
      - eval_time: 420m
        alertname: stellarindex_hashdb_verify_stale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: hashdb
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/hashdb-drift-detected.md
              summary: "hashdb periodic verify sweep has recorded no outcome in 6h+ (T132)"
              description: |
                hashdb.Append has been recording ledgers on this region for
                the last 6h and was already recording 6h ago (so hashdb IS
                enabled and ingest IS live) but
                stellarindex_hashdb_verify_runs_total has not increased over
                the same window — the periodic verifier hasn't completed a
                single pass, clean, drifted or errored.
                verify_failing above can't catch this: it's a ratio of
                outcomes recorded BY the sweep, and a sweep that never
                emits an outcome (every tick took hashDBVerifySweep's early
                return, or the ticker goroutine died) leaves that ratio's
                both sides at zero, which its own `rate(...) > 0` guard
                reads as no signal rather than as failure. Same effect as
                drift_detected going permanently dark: the detector isn't
                wrong, it just stopped running. Check the indexer process
                is alive and its logs for hashdb verifier startup/panic,
                then the runbook.

  # ── restart of a long-running healthy indexer: counters reset to
  # their seeded 0, but the previous process's hourly runs are still
  # in the window, so the first hour of the new process is silent ───
  - interval: 1m
    name: restart after hourly verify runs never trips verify_stale
    input_series:
      - series: 'stellarindex_hashdb_append_total{outcome="ok",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+1x599 0+1x50'
      - series: 'stellarindex_hashdb_append_total{outcome="error",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x650'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59 0x50'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x650'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x650'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x650'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="drift",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x650'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="drift",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0x650'
    alert_rule_test:
      - eval_time: 650m
        alertname: stellarindex_hashdb_verify_stale
        exp_alerts: []

  # ── history slice errors every sweep while the recent window stays
  # healthy: verify_failing's recent-window ratio is green, so the
  # history rule must fire on its own ───────────────────────────────
  - interval: 60m
    name: history slice erroring with no ok run trips history_verify_failing
    input_series:
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+1x12'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+0x12'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="recent",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 10h
        alertname: stellarindex_hashdb_history_verify_failing
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: hashdb
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/hashdb.md#stellarindex_hashdb_history_verify_failing
              summary: "hashdb history-slice verify has errored with no clean run in 6h (P3)"
              description: |
                Every sweep re-verifies a random slice of pre-window history
                from the archive bucket, besides the recent window. Over the
                last 6h (6 hourly sweeps) that slice recorded at least one
                error and no ok/drift run, for 30+ min sustained. The recent
                window can stay healthy and hide this: its ok runs mask the
                history errors in stellarindex_hashdb_verify_failing, so
                this rule watches window="history" alone. Check the indexer's
                "hashdb verify sweep failed" / "incomplete" WARN lines
                carrying slice=history (they name the seed and range), then
                the runbook.
      - eval_time: 10h
        alertname: stellarindex_hashdb_verify_failing
        exp_alerts: []

  # ── history slice errors once but also completes ok in the window ──
  - interval: 60m
    name: history slice with an ok run in window stays quiet
    input_series:
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="error",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+1x12'
      - series: 'stellarindex_hashdb_verify_runs_total{outcome="ok",window="history",instance="r1:9101",job="stellarindex_indexer"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 10h
        alertname: stellarindex_hashdb_history_verify_failing
        exp_alerts: []
