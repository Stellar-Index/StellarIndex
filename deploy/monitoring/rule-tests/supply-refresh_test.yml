---
# promtool unit tests for stellarindex_aggregator_supply_refresh_stalled
# (W5-mon dead-alert fix).
#
#   promtool test rules deploy/monitoring/rule-tests/supply-refresh_test.yml
#
# The alert was structurally unfireable before this wave: it used
#   time() - max(timestamp(supply_refresh_total{outcome="ok"})) > 30*60
# and timestamp() returns the SAMPLE's scrape time (≈now while the counter
# series is still being scraped), so the age evaluated to ≈0 forever. These
# tests are the positive control: the "stalled" case below FAILS against the
# pre-fix rule (no alert) and PASSES against
#   sum(changes(supply_refresh_total{outcome="ok"}[30m])) == 0.
#
# supply_refresh_total is a direct app-scrape counter (aggregator /metrics),
# not a textfile — so no node_exporter honor_labels rewriting; series carry
# their real labels, and sum() erases them, leaving only the rule's own
# label block on the alert.

rule_files:
  - ../rules/supply-refresh.yml

evaluation_interval: 1m

tests:
  # ── the refresher wedged: ok ticks stopped ───────────────────────
  # The counter climbed for 30m (healthy) then froze at t=30m (the
  # goroutine deadlocked / every asset now fails). By t=60m the 30m
  # changes-window is entirely flat; held past the 5m `for` it fires.
  - interval: 1m
    name: a wedged refresher (no ok tick for 30m) trips stalled
    input_series:
      - series: 'stellarindex_aggregator_supply_refresh_total{asset_key="usdc",outcome="ok"}'
        values: '0+1x30 30+0x60'
    alert_rule_test:
      - eval_time: 70m
        alertname: stellarindex_aggregator_supply_refresh_stalled
        exp_alerts:
          - exp_labels:
              severity: page
              team: stellarindex
              component: supply
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply.md#stellarindex_aggregator_supply_refresh_stalled
              summary: "supply refresher has recorded no successful tick across any watched asset in the last 30m (cadence 5m)"
              description: |
                The aggregator-resident supply refresher emits
                stellarindex_aggregator_supply_refresh_total{outcome="ok"}
                on every successful per-asset tick. No `ok` increments
                in 30+ minutes means either the goroutine is wedged
                (aggregator deadlock), the orchestrator hasn't started,
                or every recent tick across every watched asset has
                failed. /v1/assets/{id}'s F2 fields go increasingly
                stale. Runbook: check aggregator process health first;
                inspect logs for recurring outcome labels; route to the
                error_dominant runbook if every tick is genuinely
                failing.

  # ── the refresher is healthy: ok ticks keep coming ───────────────
  # A counter that keeps incrementing has changes() > 0 over every
  # 30m window — the alert must stay silent.
  - interval: 1m
    name: a healthy refresher never trips stalled
    input_series:
      - series: 'stellarindex_aggregator_supply_refresh_total{asset_key="usdc",outcome="ok"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: stellarindex_aggregator_supply_refresh_stalled
        exp_alerts: []

  # ── one asset stalled, a sibling still ticking ───────────────────
  # Pins the fleet-wide sum(): asset aaa froze at t=30m but asset bbb
  # keeps ticking, so the goroutine is alive — no fleet-wide stall.
  # (A single asset failing 100% is _error_dominant's remit, not this.)
  - interval: 1m
    name: a healthy sibling asset keeps the fleet-wide stalled quiet
    input_series:
      - series: 'stellarindex_aggregator_supply_refresh_total{asset_key="aaa",outcome="ok"}'
        values: '0+1x30 30+0x60'
      - series: 'stellarindex_aggregator_supply_refresh_total{asset_key="bbb",outcome="ok"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: stellarindex_aggregator_supply_refresh_stalled
        exp_alerts: []

  # ── a stalled producer: every asset it feeds reports dormant ─────
  # The anchor is producer-wide, so a dead observer freezes it for all
  # its assets on the same tick. Two dormant assets held past the 30m
  # `for` fire, even though neither is error-dominant.
  - interval: 1m
    name: two assets dormant together trip dormant_fleet
    input_series:
      - series: 'stellarindex_aggregator_supply_refresh_total{asset_key="aaa",outcome="dormant"}'
        values: '0+1x90'
      - series: 'stellarindex_aggregator_supply_refresh_total{asset_key="bbb",outcome="dormant"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 60m
        alertname: stellarindex_aggregator_supply_refresh_dormant_fleet
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: supply
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply.md#stellarindex_aggregator_supply_refresh_dormant_fleet
              summary: "supply refresher: 2 assets reporting dormant together for ≥ 30m — a component observer has likely stalled"
              description: |
                2 watched assets are reporting outcome `dormant`
                at once. The supply freshness anchor is a producer-wide
                watermark (classic: the slowest of the four component
                observers; SEP-41: sep41_supply_events), so assets share a
                frozen anchor only when that producer stops advancing. Each
                tick still re-stamps the last observation as current, so
                served supply goes stale silently until the 24h dormancy
                horizon. Runbook: section "Several assets dormant at once" —
                check each component observer is advancing.

  # ── one dormant asset beside healthy siblings stays quiet ────────
  - interval: 1m
    name: one dormant asset with siblings ok never trips dormant_fleet
    input_series:
      - series: 'stellarindex_aggregator_supply_refresh_total{asset_key="aaa",outcome="dormant"}'
        values: '0+1x90'
      - series: 'stellarindex_aggregator_supply_refresh_total{asset_key="bbb",outcome="ok"}'
        values: '0+1x90'
      - series: 'stellarindex_aggregator_supply_refresh_total{asset_key="ccc",outcome="ok"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 60m
        alertname: stellarindex_aggregator_supply_refresh_dormant_fleet
        exp_alerts: []

  # ── sep41 rollup pinned by an absent projector cursor (GH-1153) ──
  # Rollup cadence 5m. Every pass for CPINNED reports no_cursor, so its
  # fold never moves and supply reads run the full-history scan.
  - interval: 5m
    name: a rollup pinned by an absent projector cursor trips no_cursor
    input_series:
      - series: 'stellarindex_sep41_supply_rollup_advances_total{contract_id="CPINNED",outcome="no_cursor"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 60m
        alertname: stellarindex_sep41_supply_rollup_no_cursor
        exp_alerts:
          - exp_labels:
              contract_id: CPINNED
              severity: ticket
              team: stellarindex
              component: supply
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply.md#stellarindex_sep41_supply_rollup_no_cursor
              summary: "sep41 supply rollup for CPINNED pinned for ≥ 30m: projector cursor (projector, sep41_supply) is absent"
              description: |
                Every rollup pass for CPINNED in the last
                30m folded nothing because ingestion_cursors has no
                (projector, sep41_supply) row. Served supply stays exact,
                but each supply read for this contract sums its whole
                sep41_supply_events history instead of checkpoint + delta —
                the unbounded scan behind the 2026-07-06 Postgres saturation.
                Usual causes: the projector has not committed its first
                sep41_supply cycle (not running, sep41_supply not enabled,
                or quarantined), or ingestion_cursors was lost in a restore.

  # ── a dormant token's steady-state noop is not an absent cursor ──
  - interval: 5m
    name: a dormant token reporting noop never trips no_cursor
    input_series:
      - series: 'stellarindex_sep41_supply_rollup_advances_total{contract_id="CDORMANT",outcome="noop"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 60m
        alertname: stellarindex_sep41_supply_rollup_no_cursor
        exp_alerts: []

  # ── the projector commits its first cycle: the fold resumes ──────
  # no_cursor for 20m, then the cursor appears and passes report ok.
  - interval: 5m
    name: a cursor that appears clears no_cursor
    input_series:
      - series: 'stellarindex_sep41_supply_rollup_advances_total{contract_id="CPINNED",outcome="no_cursor"}'
        values: '0+1x4 4+0x20'
      - series: 'stellarindex_sep41_supply_rollup_advances_total{contract_id="CPINNED",outcome="ok"}'
        values: '0+0x4 0+1x20'
    alert_rule_test:
      - eval_time: 90m
        alertname: stellarindex_sep41_supply_rollup_no_cursor
        exp_alerts: []
