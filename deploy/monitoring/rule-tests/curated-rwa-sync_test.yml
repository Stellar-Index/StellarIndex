---
# promtool unit tests for stellarindex_curated_rwa_sync_stale.
#
#   promtool test rules deploy/monitoring/rule-tests/curated-rwa-sync_test.yml
#
# PROVEN-RED: delete the `or absent_over_time(...[30h])` arm from
# curated-rwa-sync.yml and re-run — the never-ran case (series absent)
# reports 0 firing alerts (FAIL), because with the series absent nothing
# selects it. A sync that was never scheduled is exactly the state the
# rule has to be loudest about.

rule_files:
  - ../rules/curated-rwa-sync.yml

evaluation_interval: 1m

tests:
  # ── ran once, then stopped: series goes absent past the window ──
  - interval: 1h
    name: a sync that stopped running fires the ticket off the absent arm
    input_series:
      - series: 'stellarindex_curated_rwa_sync_last_run_unix{curator="dune:stellar"}'
        values: '0 _x40'
    alert_rule_test:
      - eval_time: 32h
        alertname: stellarindex_curated_rwa_sync_stale
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: api
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/curated-rwa-sync-stale.md
              summary: "the curated RWA sync has not recorded a run in ≥ 30h (cadence daily) — the curated arm will read unavailable at 48h"
              description: |
                No curated-rwa-sync run has stamped `last_run_unix` in over 30
                hours, or none ever has. Either curated-rwa-sync.timer is not
                scheduled, the unit is refusing to start (DUNE_API_KEY unset
                in /etc/default/curated-rwa-sync), the Dune execution is
                failing, or the textfile directory is not writable by the
                unit. At 48 hours the reader's recognition bound empties the
                arm and /v1/rwa/assets reports `curated.status:
                unavailable`. Check `systemctl list-timers
                curated-rwa-sync.timer`, `journalctl -u curated-rwa-sync`,
                and the credit cost gauge — a run that executed but was
                refused still costs nothing, and a run that never executed
                leaves the gauge frozen.

  # ── healthy: stamps daily, never fires ──
  - interval: 1h
    name: a daily sync never fires
    input_series:
      - series: 'stellarindex_curated_rwa_sync_last_run_unix{curator="dune:stellar"}'
        values: '0x24 86400x24 172800x24'
    alert_rule_test:
      - eval_time: 60h
        alertname: stellarindex_curated_rwa_sync_stale
        exp_alerts: []
