---
# promtool unit tests for the "any nonzero increase" TRIPWIRE class (audit
# Q261) against the R1 OVERLAY — configs/prometheus/rules.r1/, the tree r1
# actually loads. Run via:
#
#   promtool test rules deploy/monitoring/rule-tests/tripwire-isolated-increment-r1_test.yml
#
# Case-for-case the same as tripwire-isolated-increment_test.yml (read its
# header for what the class is and why each case exists); only rule_files
# differs. lint-rule-equivalence keeps the two trees' expr/for in step, but
# it compares text — this proves the overlay's copies actually FIRE on one
# isolated increment, which is the property the class lacked. Keep the two
# files' cases identical.

rule_files:
  - ../../../configs/prometheus/rules.r1/ingestion.yml
  - ../../../configs/prometheus/rules.r1/projector.yml
  - ../../../configs/prometheus/rules.r1/ledgerstream-tier.yml
  - ../../../configs/prometheus/rules.r1/stellar.yml
  - ../../../configs/prometheus/rules.r1/api.yml

evaluation_interval: 1m

tests:
  # ══ stellarindex_ingestion_persist_drop ═══════════════════════════
  - interval: 1m
    name: persist_drop — one isolated drop on an existing series tickets
    input_series:
      - series: 'stellarindex_source_insert_errors_total{job="stellarindex_indexer",instance="r1:9100",source="defindex",kind="defindex_flow_vault"}'
        values: '0x3 1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: &persist_drop_alert
          - exp_labels:
              job: stellarindex_indexer
              instance: r1:9100
              source: defindex
              kind: defindex_flow_vault
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/insert-errors.md"
              summary: "Persist drops on defindex/defindex_flow_vault (any rate)"
              description: |
                A trade, soroswap-router or defindex persist write failed for
                defindex/defindex_flow_vault in the last 15 minutes.
                These are DEX-swap / vault-flow rows — even a low-rate drop
                matters. kind="trade" is a trade rejected as a permanent data
                fault: the row is NOT in the served tier (a projected source
                also counts it as projector outcome="sink_permanent"). For the
                other kinds, a write through the projector is retried (watch
                stellarindex_projector_events_decoded_total{outcome="sink_retry"});
                one through the dispatcher drain was dropped. Check Timescale
                health and the poison-row logs.

                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/insert-errors.md
      - eval_time: 15m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: *persist_drop_alert
      # The increment has left the 15m window: a tripwire reports an event,
      # it does not latch.
      - eval_time: 25m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: []

  - interval: 1m
    name: persist_drop — a child BORN at 1 (first drop of the process life) tickets
    input_series:
      - series: 'stellarindex_source_insert_errors_total{job="stellarindex_indexer",instance="r1:9100",source="defindex",kind="defindex_flow_vault"}'
        values: '_x3 1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: *persist_drop_alert
      - eval_time: 15m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: *persist_drop_alert
      - eval_time: 25m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: []

  - interval: 1m
    name: persist_drop — an old flat count does not re-fire the born-arm
    input_series:
      - series: 'stellarindex_source_insert_errors_total{job="stellarindex_indexer",instance="r1:9100",source="defindex",kind="defindex_flow_vault"}'
        values: '7x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: []

  - interval: 1m
    name: persist_drop — a born non-drop kind (abandoned trade retry) stays out of the tripwire
    input_series:
      - series: 'stellarindex_source_insert_errors_total{job="stellarindex_indexer",instance="r1:9100",source="sdex",kind="trade_abandoned"}'
        values: '_x3 1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: []

  # KNOWN LIMITATION of the born-arm, pinned so it stays a documented
  # trade-off rather than a surprise: "did not exist one window ago" is also
  # true when Prometheus itself has no sample there. A scrape gap longer
  # than the 5m lookback, sitting at t-15m, makes an OLD non-zero count read
  # as newly born, and the rule tickets for as long as `offset 15m` lands in
  # the hole — here scrapes are missing from 21m to 34m, so roughly 41m..49m.
  # No drop happened. Accepted at ticket severity (the oracle-symbol rules carry the
  # same behaviour); it is the reason the arm is not on any page.
  - interval: 1m
    name: persist_drop — KNOWN LIMITATION, a Prometheus scrape gap makes an old count ticket falsely
    input_series:
      - series: 'stellarindex_source_insert_errors_total{job="stellarindex_indexer",instance="r1:9100",source="defindex",kind="defindex_flow_vault"}'
        values: '3x20 _x14 3x40'
    alert_rule_test:
      # An old count, before any gap: silent.
      - eval_time: 18m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: []
      # `offset 15m` lands inside the hole: a false ticket.
      - eval_time: 45m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: *persist_drop_alert
      # The hole has left t-15m: quiet again, on its own.
      - eval_time: 55m
        alertname: stellarindex_ingestion_persist_drop
        exp_alerts: []

  # ══ stellarindex_ingestion_trade_buffer_drop ══════════════════════
  - interval: 1m
    name: trade_buffer_drop — one isolated permanent drop tickets
    input_series:
      - series: 'stellarindex_source_insert_errors_total{job="stellarindex_indexer",instance="r1:9100",source="binance",kind="dropped"}'
        values: '0x3 1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_ingestion_trade_buffer_drop
        exp_alerts: &trade_buffer_drop_alert
          - exp_labels:
              job: stellarindex_indexer
              instance: r1:9100
              source: binance
              kind: dropped
              severity: ticket
              team: stellarindex
              component: ingestion
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/trade-insert-backpressure.md"
              summary: "External trade(s) permanently dropped on binance — buffer overflow or data fault during backpressure"
              description: |
                stellarindex_source_insert_errors_total{source="binance",kind="dropped"}
                incremented: at least one external (CEX/FX) trade was
                permanently dropped — either the bounded retry buffer
                overflowed while Postgres was unreachable (see
                stellarindex_ingestion_trade_insert_backpressure) or a
                permanent data fault surfaced during per-row isolation. This
                IS genuine, unrecoverable loss for that trade (vendor-
                refillable, not lake-refillable). Any nonzero rate needs eyes —
                the coarse stellarindex_ingestion_insert_errors alert only
                trips above 0.1/s fleet-wide and can miss a slow trickle.

                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/trade-insert-backpressure.md
      - eval_time: 15m
        alertname: stellarindex_ingestion_trade_buffer_drop
        exp_alerts: *trade_buffer_drop_alert
      - eval_time: 25m
        alertname: stellarindex_ingestion_trade_buffer_drop
        exp_alerts: []

  - interval: 1m
    name: trade_buffer_drop — a child BORN at 1 tickets
    input_series:
      - series: 'stellarindex_source_insert_errors_total{job="stellarindex_indexer",instance="r1:9100",source="binance",kind="dropped"}'
        values: '_x3 1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_ingestion_trade_buffer_drop
        exp_alerts: *trade_buffer_drop_alert
      - eval_time: 25m
        alertname: stellarindex_ingestion_trade_buffer_drop
        exp_alerts: []

  - interval: 1m
    name: trade_buffer_drop — an old flat count and a flat zero stay silent
    input_series:
      - series: 'stellarindex_source_insert_errors_total{job="stellarindex_indexer",instance="r1:9100",source="binance",kind="dropped"}'
        values: '4x60'
      - series: 'stellarindex_source_insert_errors_total{job="stellarindex_indexer",instance="r1:9100",source="kraken",kind="dropped"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: stellarindex_ingestion_trade_buffer_drop
        exp_alerts: []

  # ══ stellarindex_projector_row_quarantined ════════════════════════
  - interval: 1m
    name: row_quarantined — one isolated quarantine tickets
    input_series:
      - series: 'stellarindex_projector_events_decoded_total{job="stellarindex_indexer",instance="r1:9100",source="sep41_transfers",outcome="sink_quarantined"}'
        values: '0x3 1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_projector_row_quarantined
        exp_alerts: &row_quarantined_alert
          - exp_labels:
              job: stellarindex_indexer
              instance: r1:9100
              source: sep41_transfers
              outcome: sink_quarantined
              severity: ticket
              team: stellarindex
              component: projector
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-row-quarantined.md"
              summary: "Projector quarantined a row on sep41_transfers — poison-row escape hatch fired"
              description: |
                stellarindex_projector_events_decoded_total{source="sep41_transfers",outcome="sink_quarantined"}
                incremented: the projector gave up on ONE un-processable row
                after exhausting its retry budget and advanced the cursor past
                it. The row is durably skipped from the served tier — not
                lost (the raw event is still in the lake) — until it is
                re-driven with `stellarindex-ops projector-replay -source
                sep41_transfers` after the underlying defect is fixed.
                Any nonzero rate needs eyes.

                Runbook: docs/operations/runbooks/projector-row-quarantined.md
      - eval_time: 15m
        alertname: stellarindex_projector_row_quarantined
        exp_alerts: *row_quarantined_alert
      - eval_time: 25m
        alertname: stellarindex_projector_row_quarantined
        exp_alerts: []

  - interval: 1m
    name: row_quarantined — a child BORN at 1 (the realistic shape — the outcome is unseeded) tickets
    input_series:
      - series: 'stellarindex_projector_events_decoded_total{job="stellarindex_indexer",instance="r1:9100",source="sep41_transfers",outcome="sink_quarantined"}'
        values: '_x3 1x60'
      # A busy healthy outcome on the same source must not leak in.
      - series: 'stellarindex_projector_events_decoded_total{job="stellarindex_indexer",instance="r1:9100",source="sep41_transfers",outcome="ok"}'
        values: '0+50x63'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_projector_row_quarantined
        exp_alerts: *row_quarantined_alert
      - eval_time: 25m
        alertname: stellarindex_projector_row_quarantined
        exp_alerts: []

  - interval: 1m
    name: row_quarantined — an old flat count stays silent
    input_series:
      - series: 'stellarindex_projector_events_decoded_total{job="stellarindex_indexer",instance="r1:9100",source="sep41_transfers",outcome="sink_quarantined"}'
        values: '2x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: stellarindex_projector_row_quarantined
        exp_alerts: []

  # ══ stellarindex_ledgerstream_tier_both_missing ═══════════════════
  # Seeded at 0 by obs.seedLedgerstreamTierSeries, so the existing-series
  # shape is the production one and no born-arm is needed.
  - interval: 1m
    name: tier_both_missing — one isolated both-tiers miss pages (an archive-phase miss in the indexer is a real hole)
    input_series:
      - series: 'stellarindex_ledgerstream_tier_read_total{job="stellarindex_indexer",instance="r1:9100",outcome="both_missing"}'
        values: '0x3 1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_ledgerstream_tier_both_missing
        exp_alerts:
          - exp_labels:
              job: stellarindex_indexer
              instance: r1:9100
              outcome: both_missing
              severity: page
              team: stellarindex
              component: ledgerstream
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ledgerstream-tier-both-missing.md"
              summary: "LCM read missed BOTH tiers in the last 5 min — indexer cannot progress"
              description: |
                The TieredDataStore tried to read at least one
                LedgerCloseMeta object that returned "not found" from
                BOTH the local galexie-archive (hot) AND the
                aws-public-blockchain bucket (cold). The indexer or
                backfill consumer that hit this is now stalled.

                Most likely causes (runbook walks them):
                  1. The hot range has been trimmed and the
                     corresponding cold object is missing or
                     inaccessible — AWS Open Data partition is in a
                     transient miss state, or the partition naming
                     drifted, or the AWS sponsorship has lapsed.
                  2. A local trim ran too aggressively (the live
                     cursor moved backwards onto a trimmed range).
                  3. The MinIO endpoint, the AWS endpoint, or both,
                     are mis-configured for this binary.
      - eval_time: 12m
        alertname: stellarindex_ledgerstream_tier_both_missing
        exp_alerts: []

  # ══ stellarindex_customer_webhook_delivery_exhausted ══════════════
  # The rate() twin of the class: `sum(rate(..{outcome="exhausted"}[1h])) > 0`
  # with `for: 1h`, under a description about ONE delivery ("A delivery hit
  # the 15-attempt retry budget"). rate() is increase()/W, so it is non-zero
  # for exactly the window after one increment and `for: 1h` could never
  # complete. All twelve outcomes are pre-seeded at 0
  # (obs.seedBoundedLabelSeries, pinned by
  # TestCustomerWebhookDeliveryOutcomesAreSeeded), so the existing-series
  # shape is the production one and no born-arm is needed.
  - interval: 1m
    name: webhook_delivery_exhausted — ONE terminally failed delivery tickets
    input_series:
      - series: 'stellarindex_customer_webhook_delivery_attempts_total{job="stellarindex_api",instance="r1:8080",outcome="exhausted"}'
        values: '0x3 1x120'
      # Ordinary traffic on a sibling outcome must not be what fires it.
      - series: 'stellarindex_customer_webhook_delivery_attempts_total{job="stellarindex_api",instance="r1:8080",outcome="delivered"}'
        values: '0+5x124'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_customer_webhook_delivery_exhausted
        exp_alerts: &webhook_exhausted_alert
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: api
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/customer-webhook-delivery-failing.md"
              summary: "Customer webhook deliveries permanently failed (budget exhausted)"
              description: |
                A delivery hit the 15-attempt retry budget (~8h) and
                was marked terminally failed.
      - eval_time: 60m
        alertname: stellarindex_customer_webhook_delivery_exhausted
        exp_alerts: *webhook_exhausted_alert
      # The increment has left the 1h window: the ticket reports an event,
      # it does not latch.
      - eval_time: 70m
        alertname: stellarindex_customer_webhook_delivery_exhausted
        exp_alerts: []

  - interval: 1m
    name: webhook_delivery_exhausted — an old non-zero count and healthy traffic stay silent
    input_series:
      - series: 'stellarindex_customer_webhook_delivery_attempts_total{job="stellarindex_api",instance="r1:8080",outcome="exhausted"}'
        values: '4x124'
      - series: 'stellarindex_customer_webhook_delivery_attempts_total{job="stellarindex_api",instance="r1:8080",outcome="delivered"}'
        values: '0+5x124'
      - series: 'stellarindex_customer_webhook_delivery_attempts_total{job="stellarindex_api",instance="r1:8080",outcome="server_error"}'
        values: '0+1x124'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_customer_webhook_delivery_exhausted
        exp_alerts: []
      - eval_time: 90m
        alertname: stellarindex_customer_webhook_delivery_exhausted
        exp_alerts: []

  # ══ the SUSTAINED five — silent on an isolated event BY DESIGN ════
  - interval: 1m
    name: sustained-by-design rules stay silent on one isolated increment
    input_series:
      - series: 'stellarindex_discovery_dropped_hits_total{job="stellarindex_indexer",instance="r1:9100"}'
        values: '0x3 1x120'
      - series: 'stellarindex_discovery_record_failures_total{job="stellarindex_indexer",instance="r1:9100"}'
        values: '0x3 1x120'
      - series: 'stellarindex_ch_live_sink_ledgers_total{job="stellarindex_indexer",instance="r1:9100",outcome="dropped"}'
        values: '0x3 5x120'
      # archive-publish.md: "S3 returns a 503, core retries, successfully
      # publishes on retry. Counter still went up. The alert's `for: 1h`
      # threshold filters these."
      - series: 'stellarindex_stellar_archive_publish_errors_total{job="stellar_core",instance="r1:11626"}'
        values: '0x3 1x120'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_stellar_archive_publish_fail
        exp_alerts: []
      - eval_time: 62m
        alertname: stellarindex_stellar_archive_publish_fail
        exp_alerts: []
      - eval_time: 5m
        alertname: stellarindex_ingestion_discovery_drops
        exp_alerts: []
      - eval_time: 5m
        alertname: stellarindex_ingestion_ch_live_sink_drops
        exp_alerts: []
      - eval_time: 12m
        alertname: stellarindex_ingestion_discovery_drops
        exp_alerts: []
      - eval_time: 12m
        alertname: stellarindex_ingestion_discovery_record_failures
        exp_alerts: []
      - eval_time: 12m
        alertname: stellarindex_ingestion_ch_live_sink_drops
        exp_alerts: []
      - eval_time: 62m
        alertname: stellarindex_ingestion_ch_live_sink_drops_sustained
        exp_alerts: []

  # Positive control for the sustained shape, on the one rule of the five
  # with no other promtool case: errors that KEEP arriving do notify.
  - interval: 1m
    name: archive_publish_fail — publish errors sustained past 1h notify
    input_series:
      - series: 'stellarindex_stellar_archive_publish_errors_total{job="stellar_core",instance="r1:11626"}'
        values: '0+1x150'
    alert_rule_test:
      - eval_time: 90m
        alertname: stellarindex_stellar_archive_publish_fail
        exp_alerts:
          - exp_labels:
              job: stellar_core
              instance: r1:11626
              severity: informational
              team: stellarindex
              component: stellar
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/archive-publish.md"
              summary: "Archive-publish errors in the last hour"
              description: |
                stellar-core failed to publish a checkpoint to our history archive.
                Not customer-visible but affects Tier-1 posture if sustained.
