---
# promtool unit tests for stellarindex_aggregator_outlier_storm and
# stellarindex_aggregator_outlier_trim_fraction (2026-08-28 redesign — see
# the rule comments in ../rules/aggregator.yml).
#
#   promtool test rules deploy/monitoring/rule-tests/aggregator_test.yml
#
# WHY THIS FILE EXISTS: the previous rule gated on the per-tick re-count
# of prints the whole-window MAD band trimmed
# (rate(dropped_trades_total{reason="outlier"}[10m]) > 10 for 2h). On
# 2026-08-28 it fired for HOURS on crypto:XLM/fiat:USD and /GBP while
# every venue agreed within 0.9% — the band was trimming a genuine +2%
# step, and the counter faithfully re-counted the trimmed tail every 30 s.
# The alert now reads VENUE DISAGREEMENT (max/min per-venue 5m VWAP), so
# the regression guards are: an AGREED move must stay silent (case 1), a
# venue that leaves the others must fire (case 2), and a single venue can
# never fire (case 3). The trim-fraction successor (cases 4–6) covers the
# single-venue spam shape the disagreement rule cannot see.
#
# PROVEN-RED: restore the pre-2026-08-28 counter-based expr — case 1's
# venue_vwap series produce no dropped_trades_total samples, so the old
# rule is vacuously silent there, but case 2 (venue disagreement with NO
# counter series at all) can never fire under it — promtool reports the
# missing exp_alerts. stellarindex_aggregator_venue_vwap is a gauge
# labelled {pair,window,source}; window_trades is {pair,window,stage}.

rule_files:
  - ../rules/aggregator.yml

evaluation_interval: 1m

tests:
  # ── Case 1: an AGREED regime shift across three venues stays silent ──
  # XLM/USD steps 0.1337 → 0.1364 (+2%) on all three venues at t=20m.
  # Between venues the spread never exceeds 0.5%, so the disagreement
  # ratio stays under 1% throughout — no ticket, however long it lasts.
  # This is the 2026-08-28 shape the counter-based rule ticketed on.
  - interval: 1m
    name: an agreed cross-venue step never fires
    input_series:
      - series: 'stellarindex_aggregator_venue_vwap{pair="crypto:XLM/fiat:USD",window="5m",source="binance",binary="stellarindex-aggregator"}'
        values: '0.1337x20 0.1364x100'
      - series: 'stellarindex_aggregator_venue_vwap{pair="crypto:XLM/fiat:USD",window="5m",source="coinbase",binary="stellarindex-aggregator"}'
        values: '0.1340x20 0.1368x100'
      - series: 'stellarindex_aggregator_venue_vwap{pair="crypto:XLM/fiat:USD",window="5m",source="kraken",binary="stellarindex-aggregator"}'
        values: '0.1335x20 0.1362x100'
    alert_rule_test:
      - eval_time: 60m
        alertname: stellarindex_aggregator_outlier_storm
        exp_alerts: []
      - eval_time: 119m
        alertname: stellarindex_aggregator_outlier_storm
        exp_alerts: []

  # ── Case 2: ONE venue sits +3% above the others → fires after 15m ──
  # binance and coinbase agree at 0.1337; kraken prints 0.1377 (+3%) from
  # t=0. max/min − 1 ≈ 0.030 > 0.01 with 3 venues, so the expr is true
  # from the first evaluation and the alert fires once `for: 15m` has
  # elapsed. At t=10m it must still be pending (silent).
  - interval: 1m
    name: a single venue diverging by 3 percent fires after the 15m for-gate
    input_series:
      - series: 'stellarindex_aggregator_venue_vwap{pair="crypto:XLM/fiat:USD",window="5m",source="binance",binary="stellarindex-aggregator"}'
        values: '0.1337x60'
      - series: 'stellarindex_aggregator_venue_vwap{pair="crypto:XLM/fiat:USD",window="5m",source="coinbase",binary="stellarindex-aggregator"}'
        values: '0.1337x60'
      - series: 'stellarindex_aggregator_venue_vwap{pair="crypto:XLM/fiat:USD",window="5m",source="kraken",binary="stellarindex-aggregator"}'
        values: '0.1377x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: stellarindex_aggregator_outlier_storm
        exp_alerts: []
      - eval_time: 30m
        alertname: stellarindex_aggregator_outlier_storm
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: aggregator
              pair: crypto:XLM/fiat:USD
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator-outlier-storm.md
              summary: "crypto:XLM/fiat:USD venues disagree >1% on the 5m VWAP for 15m — persistent price dispersion (P3)"
              description: |
                The highest and lowest per-venue 5m VWAP feeding
                crypto:XLM/fiat:USD have differed by more than 1% for 15m+
                (stellarindex_aggregator_venue_vwap, the PRE-outlier-filter
                set). The published price is the robust, time-locally filtered
                VWAP across venues, so this is a data-quality / source-health
                signal, NOT a customer-facing price error: one venue is stale,
                thin, mis-decoding amounts, or a stablecoin leg is skewed.
                Find it with
                `stellarindex_aggregator_venue_vwap{pair="crypto:XLM/fiat:USD",window="5m"}`
                — the odd one out is the venue to investigate. Check the pair's
                div:<pair> Redis flag / API flags.divergence_warning for actual
                price impact. NOTE: the stellarindex_price_divergence_* alerts
                are INERT (F-1329, no Prometheus producer) — do not wait on them.
                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator-outlier-storm.md

  # ── Case 3: a SINGLE venue can never fire, whatever it prints ──
  # crypto:XLM/fiat:GBP has only kraken (the 2026-08-28 freeze pair,
  # sources=1). max/min − 1 is 0 for one series and the `count >= 2`
  # guard holds regardless — no ticket even across a wild ±10% swing.
  # Also proves the 1h-window series is ignored (only window="5m" gates).
  - interval: 1m
    name: a single-venue pair never fires
    input_series:
      - series: 'stellarindex_aggregator_venue_vwap{pair="crypto:XLM/fiat:GBP",window="5m",source="kraken",binary="stellarindex-aggregator"}'
        values: '0.1337x20 0.1470x20 0.1200x20'
      - series: 'stellarindex_aggregator_venue_vwap{pair="crypto:XLM/fiat:GBP",window="1h",source="kraken",binary="stellarindex-aggregator"}'
        values: '0.1337x60'
      - series: 'stellarindex_aggregator_venue_vwap{pair="crypto:XLM/fiat:GBP",window="1h",source="sdex",binary="stellarindex-aggregator"}'
        values: '0.2000x60'
    alert_rule_test:
      - eval_time: 59m
        alertname: stellarindex_aggregator_outlier_storm
        exp_alerts: []

  # ── Case 4: a sustained >20% trim share of the 24h window fires ──
  # 1 000 class-filtered trades, 700 surviving the outlier filter (30%
  # trimmed) for 60m. Fires once `for: 30m` has elapsed; silent at 20m.
  - interval: 1m
    name: a sustained 30 percent trim share fires after the 30m for-gate
    input_series:
      - series: 'stellarindex_aggregator_window_trades{pair="crypto:XLM/fiat:USD",window="24h",stage="class",binary="stellarindex-aggregator"}'
        values: '1000x60'
      - series: 'stellarindex_aggregator_window_trades{pair="crypto:XLM/fiat:USD",window="24h",stage="outlier",binary="stellarindex-aggregator"}'
        values: '700x60'
      - series: 'stellarindex_aggregator_window_trades{pair="crypto:XLM/fiat:USD",window="24h",stage="fetched",binary="stellarindex-aggregator"}'
        values: '1200x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: stellarindex_aggregator_outlier_trim_fraction
        exp_alerts: []
      - eval_time: 45m
        alertname: stellarindex_aggregator_outlier_trim_fraction
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: aggregator
              pair: crypto:XLM/fiat:USD
              window: 24h
              binary: stellarindex-aggregator
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator-outlier-storm.md
              summary: "crypto:XLM/fiat:USD outlier filter rejecting >20% of the 24h window for 30m — in-window price dispersion (P3)"
              description: |
                More than 20% of crypto:XLM/fiat:USD's 24h VWAP input has been
                trimmed by the time-local outlier filter for 30m+
                (stellarindex_aggregator_window_trades, stage=outlier vs
                stage=class, ≥20 trades). The filter drops only prints that
                disagree with BOTH the window and their own neighbourhood, so
                this is not a regime shift being erased — it is a large share
                of wild prints inside the window: an SDEX spam / wash wave
                (2026-08-14 token-farm shape), a connector mis-decoding
                amounts, or a venue with dust-sized noise. The published price
                is protected by the trim; the risk is a thin surviving sample
                (see min_usd_volume gating). Diagnose from the trades table
                for the pair; see the spam-wave signature in the runbook.
                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator-outlier-storm.md

  # ── Case 5: a normal trim share (10%) stays silent ──
  - interval: 1m
    name: a 10 percent trim share stays silent
    input_series:
      - series: 'stellarindex_aggregator_window_trades{pair="crypto:XLM/fiat:USD",window="24h",stage="class",binary="stellarindex-aggregator"}'
        values: '1000x60'
      - series: 'stellarindex_aggregator_window_trades{pair="crypto:XLM/fiat:USD",window="24h",stage="outlier",binary="stellarindex-aggregator"}'
        values: '900x60'
    alert_rule_test:
      - eval_time: 59m
        alertname: stellarindex_aggregator_outlier_trim_fraction
        exp_alerts: []

  # ── Case 6: a thin window (<20 trades) stays silent even at 50% trimmed ──
  # 10 trades with 5 surviving is a sample too small to call dispersion.
  - interval: 1m
    name: a window under the 20-trade floor stays silent
    input_series:
      - series: 'stellarindex_aggregator_window_trades{pair="crypto:XLM/fiat:GBP",window="24h",stage="class",binary="stellarindex-aggregator"}'
        values: '10x60'
      - series: 'stellarindex_aggregator_window_trades{pair="crypto:XLM/fiat:GBP",window="24h",stage="outlier",binary="stellarindex-aggregator"}'
        values: '5x60'
    alert_rule_test:
      - eval_time: 59m
        alertname: stellarindex_aggregator_outlier_trim_fraction
        exp_alerts: []
