---
# promtool unit tests for the storage alert family in ../rules/storage.yml,
# part 2 of 3 (split from storage_test.yml so the groups run in parallel;
# label shapes and coverage notes are in that file's header).
#
#   promtool test rules deploy/monitoring/rule-tests/storage-part2_test.yml

rule_files:
  - ../rules/storage.yml

evaluation_interval: 1m

tests:
  # PROVEN-RED case: before this rule existed, a
  # ch-schema-drift.timer that stopped firing left
  # stellarindex_ch_schema_drift_last_run_unix (and _divergent,
  # _intent_converged) frozen at their last values forever — served
  # fresh by node_exporter every scrape — with no rule anywhere reading
  # them, so nothing fired. `absent_over_time` alone would not catch a
  # file that never DISAPPEARS, only never advances, which is why the
  # `time() - last_run_unix` arm below is required in addition to it.
  - interval: 5m
    name: a ch-schema-drift comparison older than 36h tickets
    input_series:
      - series: 'stellarindex_ch_schema_drift_last_run_unix{job="node_exporter",instance="r1:9100"}'
        values: '0+0x450'
    alert_rule_test:
      - eval_time: 2200m
        alertname: stellarindex_ch_schema_drift_stale
        exp_alerts:
          - exp_labels:
              job: node_exporter
              instance: r1:9100
              severity: ticket
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-schema-restore.md
              summary: "ch-schema-drift has not completed a comparison in > 36 h (daily timer)"
              description: |
                ch-schema-drift.timer (daily, 04:10 UTC) has not written a
                fresh stellarindex_ch_schema_drift_last_run_unix in over
                36 h — one missed cycle plus slack — or has never run.
                _detected and _not_converged above are now evaluating a
                frozen or absent verdict and cannot fire either way.
                Check `systemctl status ch-schema-drift.service` and run
                `ch-schema-drift.sh` by hand.

  - interval: 5m
    name: a daily-refreshed ch-schema-drift comparison raises nothing
    input_series:
      - series: 'stellarindex_ch_schema_drift_last_run_unix{job="node_exporter",instance="r1:9100"}'
        values: '0+300x450'
    alert_rule_test:
      - eval_time: 2200m
        alertname: stellarindex_ch_schema_drift_stale
        exp_alerts: []

  # ══ stellarindex_nvme_wear_high ═══════════════════════════════════
  - interval: 1m
    name: an nvme past 80 percent rated endurance tickets after 1h
    input_series:
      - series: 'nvme_percentage_used_ratio{job="node_exporter",instance="r1:9100",device="nvme0n1"}'
        values: '0.9+0x80'
    alert_rule_test:
      - eval_time: 70m
        alertname: stellarindex_nvme_wear_high
        exp_alerts:
          - exp_labels:
              job: node_exporter
              instance: r1:9100
              device: nvme0n1
              severity: ticket
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_nvme_wear_high
              summary: "NVMe nvme0n1 at 90% rated write endurance"
              description: |
                Rated endurance consumed on nvme0n1. Not urgent at
                80%, deliberately: replacing a drive here is a planned
                operation, so this is a procurement trigger, not an incident.

  - interval: 1m
    name: an nvme at 75 percent endurance raises nothing
    input_series:
      - series: 'nvme_percentage_used_ratio{job="node_exporter",instance="r1:9100",device="nvme0n1"}'
        values: '0.75+0x80'
    alert_rule_test:
      - eval_time: 70m
        alertname: stellarindex_nvme_wear_high
        exp_alerts: []

  # ══ stellarindex_nvme_spare_low ═══════════════════════════════════
  - interval: 1m
    name: an nvme eating its spare pool pages after 30m
    input_series:
      - series: 'nvme_available_spare_ratio{job="node_exporter",instance="r1:9100",device="nvme0n1"}'
        values: '0.1+0x45'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_nvme_spare_low
        exp_alerts:
          - exp_labels:
              job: node_exporter
              instance: r1:9100
              device: nvme0n1
              severity: page
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_nvme_spare_low
              summary: "NVMe nvme0n1 spare blocks down to 10%"
              description: |
                The drive is consuming its reserve block pool, which is a
                late-stage wear signal — unlike percentage_used this one moves
                shortly before failure.

  - interval: 1m
    name: an nvme with a healthy spare pool raises nothing
    input_series:
      - series: 'nvme_available_spare_ratio{job="node_exporter",instance="r1:9100",device="nvme0n1"}'
        values: '0.25+0x45'
    alert_rule_test:
      - eval_time: 40m
        alertname: stellarindex_nvme_spare_low
        exp_alerts: []

  # ══ stellarindex_nvme_media_errors ════════════════════════════════
  - interval: 1m
    name: climbing nvme media errors ticket
    input_series:
      - series: 'nvme_media_errors_total{job="node_exporter",instance="r1:9100",device="nvme0n1"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: stellarindex_nvme_media_errors
        exp_alerts:
          - exp_labels:
              job: node_exporter
              instance: r1:9100
              device: nvme0n1
              severity: ticket
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_nvme_media_errors
              summary: "NVMe nvme0n1 reported 15 new media errors in 24h"
              description: |
                Uncorrected media errors on a ZFS member. ZFS will surface
                corruption on scrub, but the drive reporting them first is the
                earlier signal.

  - interval: 1m
    name: a flat media-error counter raises nothing
    input_series:
      - series: 'nvme_media_errors_total{job="node_exporter",instance="r1:9100",device="nvme0n1"}'
        values: '7+0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: stellarindex_nvme_media_errors
        exp_alerts: []

  # ── a SLOW job that fails every run ──────────────────────────────
  # The shape the 6h arm cannot see. This counter is per job, so a job
  # scheduled every T accrues at most 6h/T failures: `> 10 in 6h` needs
  # T < 36 minutes, and every compression policy runs on a 12h schedule.
  # Measured on r1, policy_compression on `trades` (job 1000)
  # had failed 6 times in 7 days with "Failed to convert '1' chunks to
  # columnstore" and no rule could fire on it.
  #
  # Input is that job: one more failure every 12h (24 samples at the 30m
  # interval), for three days.
  - interval: 30m
    name: a 12h-schedule job failing every run is caught by the 3-day arm
    input_series:
      - series: 'stellarindex_timescale_job_failures_total{job="node_exporter",instance="r1:9100",job_id="1000",proc="policy_compression",hypertable="trades"}'
        values: '0x23 1x23 2x23 3x23 4x23 5x23'
    alert_rule_test:
      - eval_time: 71h
        alertname: stellarindex_timescale_job_failures_climbing
        exp_alerts:
          - exp_labels:
              job: node_exporter
              instance: r1:9100
              job_id: "1000"
              proc: policy_compression
              hypertable: trades
              severity: ticket
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale.md#stellarindex_timescale_job_failures_climbing
              summary: "TimescaleDB job policy_compression failing repeatedly (trades)"
              description: |
                Job 1000 (policy_compression on
                trades) is failing repeatedly: more than 10 runs in
                6 hours, 3 or more runs in 3 days, or at least half of the runs its
                schedule_interval gave it in 3 days. TimescaleDB retries on the next
                tick, so the caggs may look fresh and no staleness ticket will fire —
                that is exactly how the 2026 background-worker starvation stayed
                invisible.

                The three arms are not redundant. This counter is per job, so a job
                scheduled every T can accrue at most 6h/T failures and the 6h arm is
                unreachable for anything slower than ~36 minutes — every compression
                policy and five of the CAGG refresh policies. The 3-day count judges
                those, but is itself unreachable once T exceeds a day; the
                schedule_interval arm judges any T, and a job slower than 1.5 days
                trips it on a single failed run.

                Check max_parallel_workers / timescaledb.max_background_workers
                headroom first; "failed to start job" in the job_errors view means
                starvation, not a broken job body.

                The counter above says only that policy_compression is
                failing, never why. Query
                stellarindex_timescale_job_last_failure_reason_info{job_id="1000"}
                for the most recent job_errors.err_message text without a
                psql round trip.

  # ── a slow job that fails ONCE in three days is not a ticket ─────
  # The threshold has to leave the fleet's ordinary retry noise alone:
  # over the same 7 days on r1, the prices_1m refresh failed once.
  - interval: 30m
    name: an isolated failure does not fire either arm
    input_series:
      - series: 'stellarindex_timescale_job_failures_total{job="node_exporter",instance="r1:9100",job_id="1088",proc="policy_refresh_continuous_aggregate",hypertable="prices_1m"}'
        values: '0x71 1x72'
    alert_rule_test:
      - eval_time: 71h
        alertname: stellarindex_timescale_job_failures_climbing
        exp_alerts: []

  # ── a job slower than a day, failing its run ─────────────────────
  # The shape both fixed counts miss. A job scheduled every T runs at
  # most 3d/T times in the 3-day window, so `>= 3 in 3d` is unreachable
  # once T exceeds a day. A weekly policy failing its one run in the
  # window is 100 % of its scheduled runs; failures x schedule_interval
  # (604800) clears the 36h bar on that single failure.
  #
  # 1m samples, as the probe writes them: the interval is an INSTANT
  # selector, so at a 30m input interval it would go stale 5m after each
  # sample and the arm would flap under `for: 30m` instead of holding.
  - interval: 1m
    name: a weekly job failing its only run is caught by the schedule_interval arm
    input_series:
      - series: 'stellarindex_timescale_job_failures_total{job="node_exporter",instance="r1:9100",job_id="1002",proc="policy_retention",hypertable="fx_quotes"}'
        values: '0x1230 1x200'
      - series: 'stellarindex_timescale_job_schedule_interval_seconds{job="node_exporter",instance="r1:9100",job_id="1002",proc="policy_retention",hypertable="fx_quotes"}'
        values: '604800x1440'
    alert_rule_test:
      - eval_time: 20h
        alertname: stellarindex_timescale_job_failures_climbing
        exp_alerts: []
      - eval_time: 22h
        alertname: stellarindex_timescale_job_failures_climbing
        exp_alerts:
          - exp_labels:
              job: node_exporter
              instance: r1:9100
              job_id: "1002"
              proc: policy_retention
              hypertable: fx_quotes
              severity: ticket
              team: stellarindex
              component: storage
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale.md#stellarindex_timescale_job_failures_climbing
              summary: "TimescaleDB job policy_retention failing repeatedly (fx_quotes)"
              description: |
                Job 1002 (policy_retention on
                fx_quotes) is failing repeatedly: more than 10 runs in
                6 hours, 3 or more runs in 3 days, or at least half of the runs its
                schedule_interval gave it in 3 days. TimescaleDB retries on the next
                tick, so the caggs may look fresh and no staleness ticket will fire —
                that is exactly how the 2026 background-worker starvation stayed
                invisible.

                The three arms are not redundant. This counter is per job, so a job
                scheduled every T can accrue at most 6h/T failures and the 6h arm is
                unreachable for anything slower than ~36 minutes — every compression
                policy and five of the CAGG refresh policies. The 3-day count judges
                those, but is itself unreachable once T exceeds a day; the
                schedule_interval arm judges any T, and a job slower than 1.5 days
                trips it on a single failed run.

                Check max_parallel_workers / timescaledb.max_background_workers
                headroom first; "failed to start job" in the job_errors view means
                starvation, not a broken job body.

                The counter above says only that policy_retention is
                failing, never why. Query
                stellarindex_timescale_job_last_failure_reason_info{job_id="1002"}
                for the most recent job_errors.err_message text without a
                psql round trip.

  # ── a 12h job failing a third of its runs is not a ticket ────────
  # The interval arm is a ratio, not a lower bar for every job: two
  # failures of a 12h policy in three days is 2 of 6 runs (86400 s of
  # the 129600 s bar), under both the 3-day count and half-the-runs.
  - interval: 1m
    name: a 12h job failing two of six runs fires no arm
    input_series:
      - series: 'stellarindex_timescale_job_failures_total{job="node_exporter",instance="r1:9100",job_id="1000",proc="policy_compression",hypertable="trades"}'
        values: '0x1439 1x1439 2x1440'
      - series: 'stellarindex_timescale_job_schedule_interval_seconds{job="node_exporter",instance="r1:9100",job_id="1000",proc="policy_compression",hypertable="trades"}'
        values: '43200x4320'
    alert_rule_test:
      - eval_time: 71h
        alertname: stellarindex_timescale_job_failures_climbing
        exp_alerts: []
