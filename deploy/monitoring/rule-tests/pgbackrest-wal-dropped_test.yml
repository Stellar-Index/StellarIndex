---
# promtool unit tests for stellarindex_pgbackrest_wal_dropped.
#
#   promtool test rules deploy/monitoring/rule-tests/pgbackrest-wal-dropped_test.yml

rule_files:
  - ../rules/storage.yml

evaluation_interval: 1m

tests:
  # A drop at t=0 (unix 0 + 600s offset keeps the gauge > 0) fires at once
  # and clears 36h later.
  - interval: 1h
    name: a recent drop pages, and stops once the drop is 36h old
    input_series:
      - series: 'stellarindex_pgbackrest_wal_last_drop_unix{instance="r1:9100",job="node"}'
        values: '600x40'
    alert_rule_test:
      - eval_time: 1h
        alertname: stellarindex_pgbackrest_wal_dropped
        exp_alerts:
          - exp_labels:
              severity: page
              team: stellarindex
              component: storage
              instance: r1:9100
              job: node
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/postgres.md#stellarindex_pgbackrest_wal_dropped
              summary: "pgBackRest dropped queued WAL on r1:9100; point-in-time recovery has a gap"
              description: |
                pgBackRest hit archive-push-queue-max and discarded the queued
                WAL. Postgres saw success, so archiving looks healthy, but no
                restore can reach a point between the last archived segment
                before the drop and the next backup. Take a backup now.
      - eval_time: 37h
        alertname: stellarindex_pgbackrest_wal_dropped
        exp_alerts: []

  - interval: 1m
    name: no drop in the logs stays quiet
    input_series:
      - series: 'stellarindex_pgbackrest_wal_last_drop_unix{instance="r1:9100",job="node"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: stellarindex_pgbackrest_wal_dropped
        exp_alerts: []
