---
# promtool unit test for stellarindex_spectra_unlisted_infrastructure in
# ../rules/projector.yml:
#
#   promtool test rules deploy/monitoring/rule-tests/spectra-unlisted_test.yml
rule_files:
  - ../rules/projector.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: one unlisted-infrastructure increment pages
    input_series:
      - series: 'stellarindex_spectra_unlisted_infrastructure_total{job="stellarindex_indexer",instance="r1:9100",kind="router"}'
        values: '0x3 1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: stellarindex_spectra_unlisted_infrastructure
        exp_alerts:
          - exp_labels:
              job: stellarindex_indexer
              instance: r1:9100
              kind: router
              severity: page
              team: stellarindex
              component: projector
            exp_annotations:
              runbook_url: "https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector.md#stellarindex_spectra_unlisted_infrastructure"
              summary: "Spectra registry named an unaudited router — the gate is incomplete"
              description: |
                A Spectra registry *_change event named a factory, router, order
                engine or token WASM outside the hand-kept audited set. Audit the
                new id, add it in internal/sources/spectra/events.go, then replay
                the source.

                Runbook: docs/operations/runbooks/projector.md#stellarindex_spectra_unlisted_infrastructure

  - interval: 1m
    name: a flat counter does not page
    input_series:
      - series: 'stellarindex_spectra_unlisted_infrastructure_total{job="stellarindex_indexer",instance="r1:9100",kind="router"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: stellarindex_spectra_unlisted_infrastructure
        exp_alerts: []
