---
# promtool unit tests for ../rules/supply.yml.
#
#   promtool test rules deploy/monitoring/rule-tests/supply_test.yml
#
# Coverage note: only stellarindex_supply_cross_check_unevaluable is
# pinned here — it is the rule that covers pairs the divergence gauge
# no longer reports (the refresher deletes their series).

rule_files:
  - ../rules/supply.yml

evaluation_interval: 1m

tests:
  # ══ stellarindex_supply_cross_check_unevaluable ═══════════════════
  - interval: 1m
    name: a pair stuck on read_error is ticketed after the hold
    input_series:
      - series: 'stellarindex_supply_cross_check_total{job="stellarindex_aggregator",instance="r1:9091",outcome="read_error",wrap_class="partial_wrap"}'
        values: '0+1x150'
      - series: 'stellarindex_supply_cross_check_total{job="stellarindex_aggregator",instance="r1:9091",outcome="within",wrap_class="partial_wrap"}'
        values: '0+1x150'
    alert_rule_test:
      - eval_time: 30m
        alertname: stellarindex_supply_cross_check_unevaluable
        exp_alerts: []
      - eval_time: 90m
        alertname: stellarindex_supply_cross_check_unevaluable
        exp_alerts:
          - exp_labels:
              outcome: read_error
              wrap_class: partial_wrap
              severity: ticket
              team: stellarindex
              component: supply
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply-cross-check-unevaluable.md
              summary: "Supply cross-check not evaluated (read_error, partial_wrap) for > 1h (P3)"
              description: |
                At least one configured classic ↔ SAC cross-check pair has
                returned outcome=read_error for over an hour, so
                its classic-vs-SAC conservation invariant is NOT being
                checked and stellarindex_supply_cross_check_divergence
                cannot fire for it. missing_snapshot: a side has no
                asset_supply_history row; read_error: storage reads keep
                failing; misaligned: the two latest snapshots are more
                than 1000 ledgers apart (one side's refresher has stalled).
                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply-cross-check-unevaluable.md

  - interval: 1m
    name: a stalled refresher (misaligned) is ticketed
    input_series:
      - series: 'stellarindex_supply_cross_check_total{job="stellarindex_aggregator",instance="r1:9091",outcome="misaligned",wrap_class="full_wrap"}'
        values: '0+1x150'
    alert_rule_test:
      - eval_time: 90m
        alertname: stellarindex_supply_cross_check_unevaluable
        exp_alerts:
          - exp_labels:
              outcome: misaligned
              wrap_class: full_wrap
              severity: ticket
              team: stellarindex
              component: supply
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply-cross-check-unevaluable.md
              summary: "Supply cross-check not evaluated (misaligned, full_wrap) for > 1h (P3)"
              description: |
                At least one configured classic ↔ SAC cross-check pair has
                returned outcome=misaligned for over an hour, so
                its classic-vs-SAC conservation invariant is NOT being
                checked and stellarindex_supply_cross_check_divergence
                cannot fire for it. missing_snapshot: a side has no
                asset_supply_history row; read_error: storage reads keep
                failing; misaligned: the two latest snapshots are more
                than 1000 ledgers apart (one side's refresher has stalled).
                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply-cross-check-unevaluable.md

  - interval: 1m
    name: a single bootstrap missing_snapshot does not ticket
    input_series:
      - series: 'stellarindex_supply_cross_check_total{job="stellarindex_aggregator",instance="r1:9091",outcome="missing_snapshot",wrap_class="partial_wrap"}'
        values: '0 1 1x148'
    alert_rule_test:
      - eval_time: 90m
        alertname: stellarindex_supply_cross_check_unevaluable
        exp_alerts: []

  - interval: 1m
    name: steady within/over outcomes never trip it
    input_series:
      - series: 'stellarindex_supply_cross_check_total{job="stellarindex_aggregator",instance="r1:9091",outcome="within",wrap_class="partial_wrap"}'
        values: '0+1x150'
      - series: 'stellarindex_supply_cross_check_total{job="stellarindex_aggregator",instance="r1:9091",outcome="over",wrap_class="full_wrap"}'
        values: '0+1x150'
    alert_rule_test:
      - eval_time: 120m
        alertname: stellarindex_supply_cross_check_unevaluable
        exp_alerts: []
