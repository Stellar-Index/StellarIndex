---
# promtool unit tests for stellarindex_twap_history_missing — the alert
# (audit-2026-08-14 W1-migrations-1 / REC-01), which since audit-2026-09-02
# F047/F116/T425 fires on TWO gauge families: stellarindex_twap_history_missing
# for twap_1h/twap_1d and stellarindex_cagg_history_missing for the seven
# prices_* views that migrations 0115/0147 empty in the same breath.
#
#   promtool test rules deploy/monitoring/rule-tests/data-freshness_test.yml
#
# The detector closes the "a migration recreated a TWAP CAGG WITH NO DATA and
# the manual refresh_continuous_aggregate follow-up was never run" gap. The
# emptied view is invisible to newest-bar freshness (its refresh policy re-fills
# a recent sliver) and to the ADR-0033 verdict (twap_* aren't reconcile
# targets), so data-freshness.sh emits stellarindex_twap_history_missing{view}=1
# when the view's oldest bar trails prices_1m's oldest.
#
# PROVEN-RED: with the alert removed from data-freshness.yml, promtool reports
# "no rule with alertname stellarindex_twap_history_missing" and the first two
# cases FAIL — the test is non-vacuous, it exercises the real alert (its `for`
# gate, view-label passthrough, and silent-on-0 behaviour), not a mock.
#
# stellarindex_twap_history_missing is a node_exporter textfile gauge (0/1 per
# view). No honor_labels rewriting matters here: the alert is a bare `== 1`, so
# the series' own {view} label is what the page carries.

rule_files:
  - ../rules/data-freshness.yml

evaluation_interval: 1m

tests:
  # ── the follow-up was skipped: the view is emptied-pending-refresh ──
  # The gauge sits at 1 for both views (migration recreated them WITH NO
  # DATA, refresh never run). Held past the 2h `for`, one alert per view
  # fires, carrying that view's label.
  - interval: 1m
    name: an unrefreshed twap CAGG (history_missing=1) trips the alert per view
    input_series:
      - series: 'stellarindex_twap_history_missing{view="twap_1h"}'
        values: '1x180'
      - series: 'stellarindex_twap_history_missing{view="twap_1d"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: stellarindex_twap_history_missing
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: completeness
              view: twap_1h
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/twap-history-missing.md
              summary: "Continuous aggregate twap_1h is missing its history — post-migration refresh_continuous_aggregate follow-up not run"
              description: |
                twap_1h is missing history the `trades` hypertable holds: the view
                is empty, or its oldest materialized bar is far newer than the oldest trade
                (allowing for an armed retention policy on that view), so it carries only the
                trailing window its refresh policy auto-fills. A migration recreated the view
                WITH NO DATA (the 0081→0115→0126→0147 CAGG-recreate pattern), or a replay
                rewrote its base rows, and the manual re-materialization step was skipped — so
                the API serves NO bars for older ranges at this grain while recent bars, and
                every newest-bar freshness check, look healthy.

                Fix: run the documented follow-up once prices_1m is whole —
                `CALL refresh_continuous_aggregate('twap_1h', NULL, now());` — then
                confirm this clears on the next data-freshness tick.

                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/twap-history-missing.md
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: completeness
              view: twap_1d
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/twap-history-missing.md
              summary: "Continuous aggregate twap_1d is missing its history — post-migration refresh_continuous_aggregate follow-up not run"
              description: |
                twap_1d is missing history the `trades` hypertable holds: the view
                is empty, or its oldest materialized bar is far newer than the oldest trade
                (allowing for an armed retention policy on that view), so it carries only the
                trailing window its refresh policy auto-fills. A migration recreated the view
                WITH NO DATA (the 0081→0115→0126→0147 CAGG-recreate pattern), or a replay
                rewrote its base rows, and the manual re-materialization step was skipped — so
                the API serves NO bars for older ranges at this grain while recent bars, and
                every newest-bar freshness check, look healthy.

                Fix: run the documented follow-up once prices_1m is whole —
                `CALL refresh_continuous_aggregate('twap_1d', NULL, now());` — then
                confirm this clears on the next data-freshness tick.

                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/twap-history-missing.md

  # ── the refresh has NOT yet held for 2h ──────────────────────────
  # Same emptied state, but only 90 min in: the `for: 2h` gate must keep
  # the alert pending (silent), so a legitimate recreate deploy has a
  # window to run the manual refresh before it pages.
  - interval: 1m
    name: history_missing under the 2h for-gate does not fire yet
    input_series:
      - series: 'stellarindex_twap_history_missing{view="twap_1h"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: stellarindex_twap_history_missing
        exp_alerts: []

  # ── the view is fully materialized: history present ──────────────
  # After the refresh_continuous_aggregate follow-up runs, the gauge is 0
  # and the alert stays silent.
  - interval: 1m
    name: a fully-refreshed twap CAGG (history_missing=0) never fires
    input_series:
      - series: 'stellarindex_twap_history_missing{view="twap_1h"}'
        values: '0x180'
      - series: 'stellarindex_twap_history_missing{view="twap_1d"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: stellarindex_twap_history_missing
        exp_alerts: []

  # ── the seven prices_* views are judged by the SAME alert ────────
  # Migrations 0115 and 0147 drop and recreate all nine price/TWAP views
  # together, and for a year only the two TWAPs had a detector. The
  # prices_* arm carries its own gauge family (the SQL and its
  # trades-referenced predicate are executed by
  # test/integration/cagg_history_detector_test.go); what this case pins
  # is that the alert routes it — same severity, same runbook, the
  # view label passed through.
  - interval: 1m
    name: an unrefreshed prices_* CAGG trips the same alert
    input_series:
      - series: 'stellarindex_cagg_history_missing{view="prices_1d"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: stellarindex_twap_history_missing
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: stellarindex
              component: completeness
              view: prices_1d
            exp_annotations:
              runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/twap-history-missing.md
              summary: "Continuous aggregate prices_1d is missing its history — post-migration refresh_continuous_aggregate follow-up not run"
              description: |
                prices_1d is missing history the `trades` hypertable holds: the view
                is empty, or its oldest materialized bar is far newer than the oldest trade
                (allowing for an armed retention policy on that view), so it carries only the
                trailing window its refresh policy auto-fills. A migration recreated the view
                WITH NO DATA (the 0081→0115→0126→0147 CAGG-recreate pattern), or a replay
                rewrote its base rows, and the manual re-materialization step was skipped — so
                the API serves NO bars for older ranges at this grain while recent bars, and
                every newest-bar freshness check, look healthy.

                Fix: run the documented follow-up once prices_1m is whole —
                `CALL refresh_continuous_aggregate('prices_1d', NULL, now());` — then
                confirm this clears on the next data-freshness tick.

                Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/twap-history-missing.md

  # ── a materialized prices_* view is silent ───────────────────────
  - interval: 1m
    name: a fully-refreshed prices_* CAGG never fires
    input_series:
      - series: 'stellarindex_cagg_history_missing{view="prices_1d"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: stellarindex_twap_history_missing
        exp_alerts: []
