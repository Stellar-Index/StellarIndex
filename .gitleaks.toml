# Gitleaks config — allowlists only, no custom rules. The default
# ruleset still applies (extends = "gitleaks").
#
# An exemption names the LITERAL SHAPE that is not a secret (a `regexes`
# entry), not the file it happens to live in. A `paths` entry blanks every
# rule for every line of a file forever, so a real credential pasted into an
# allowlisted test would never be reported. `paths` is used alone only for
# local-dev bulk that is never committed, and for generated / spec artefacts
# whose example values are key-shaped by design — a regex cannot tell those
# examples from a real key of the same shape.
# scripts/ci/gitleaks-allowlist-scope-test.sh plants a credential in every
# tracked file a `paths` entry matches and fails unless it is reported or
# the file is one of those artefacts.
#
# Each allowlist below documents the reason the flagged string is
# a false positive.

title = "stellar-index gitleaks config"

[extend]
useDefault = true

# Global path excludes: gitignored local-dev bulk that only exists in
# working trees, never in a CI checkout — vendored discovery-phase
# clones, JS deps + Next.js build output, archived pre-launch docs.
# verify.sh runs `detect --no-git` (working-tree scan, 2026-07-06),
# which would otherwise red the local gate for any dev with these on
# disk (32k+ findings from .discovery-repos alone, 2026-07-08). CI
# scans a clean checkout, so these excludes subtract nothing there.
[allowlist]
description = "Gitignored local-dev bulk (working-tree scan only)"
paths = [
  '''^\.discovery-repos/''',
  # Per-host ansible inventory + its secrets. These are GITIGNORED and
  # untracked — they hold the real credentials for r1 and the test nets
  # and must never be committed, which is exactly why .gitignore covers
  # them. The working-tree scan reads them anyway, so without this entry
  # verify.sh cannot pass on ANY operator machine that actually holds the
  # inventory, which is every machine that can run a deploy. The
  # protection that matters here is the COMMITTED-HISTORY scan below,
  # which still sees these paths if anyone ever force-adds one. No dot
  # after the host name, so the TRACKED r*.example.yml templates (which
  # .gitignore re-includes) stay scanned.
  '''^configs/ansible/inventory/[^/]+\.secrets\.yml$''',
  '''^configs/ansible/inventory/r[^/.]*\.yml$''',
  '''(^|/)node_modules/''',
  '''^web/[^/]+/(\.next|out)/''',
  '''^docs/archive/''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public Stellar strkeys: a G account id, C contract id or L liquidity-pool id (version byte + 32-byte payload + CRC16 = 56 base32 chars), optionally inside a CODE:ISSUER / CODE-ISSUER asset id. These are public ledger identifiers by construction and fill the decoder, supply, pricing and explorer fixtures; the entropy heuristic reads them as generic keys whenever the variable name ends in key/token/id. The secret-seed form (S...) is deliberately NOT matched, so a leaked seed still trips."
regexes = [
  '''^(?:[A-Za-z0-9]{1,12}[:-])?[GCL][A-Z2-7]{55}$''',
]

[[rules.allowlists]]
description = "Base64 XDR golden fixtures in Go tests: topics_xdr / data_xdr / LedgerKey bodies captured from the certified raw lake (public on-chain data). Every XDR union these fixtures carry opens with a 4-byte big-endian discriminant below 2^8, so the base64 always starts with AAAA; a random credential starts that way with probability 2^-24. Scoped to *_test.go so the exemption cannot reach production code."
condition = "AND"
paths = [
  '''_test\.go$''',
]
regexes = [
  '''^AAAA[A-Za-z0-9+/]{12,}={0,2}$''',
]

[[rules.allowlists]]
description = "Listing-sync address-form table: a contract id deliberately one character short, to prove the parser rejects it. Not a valid strkey, so the strkey entry above does not cover it."
condition = "AND"
paths = [
  '''internal/ops/ingest/listing_sync_test\.go''',
]
regexes = [
  '''^C[A-Z2-7]{54}$''',
]

[[rules.allowlists]]
description = "Test-only Redis lock-key fixture (`abcdef0123456789`) used by the signup-email-locker concurrency test. Fabricated 16-hex-char idempotency key; trips the entropy heuristic but is not a credential."
condition = "AND"
paths = [
  '''internal/auth/signup_email_locker_test\.go''',
]
regexes = [
  '''^abcdef0123456789$''',
]

[[rules.allowlists]]
description = "Redacted third-party NODE_SEED quoted in a security-finding writeup for the legacy Dash k8s cluster. Not our credential; documentation of a known violation."
paths = [
  '''docs/architecture/infrastructure/existing-k8s-assessment\.md''',
]

[[rules.allowlists]]
description = "Generated Redocly HTML — embeds OpenAPI example values (canonical asset_ids: G-strkeys, C-strkeys, transaction hashes) that look like high-entropy secrets to gitleaks. The file is a build artefact regenerated from openapi/stellar-index.v1.yaml."
paths = [
  '''docs/reference/api/index\.html''',
]

[[rules.allowlists]]
description = "OpenAPI spec example values for /v1/signup + /v1/dashboard/keys: synthetic key_id (`k_...`) + plaintext (`re_live_...`) are fabricated illustrations of what the response shape looks like — not real credentials. Real secrets in production never get committed; the response examples MUST be high-entropy-looking to be useful to API consumers. Generated TS types (web/explorer/src/api/types.ts) inherit the same examples in JSDoc; same allowlist rationale applies."
paths = [
  '''openapi/stellar-index\.v1\.yaml''',
  '''web/explorer/src/api/types\.ts''',
]

[[rules.allowlists]]
description = "Generated Redocly-format spec mirror — `make docs-api` regenerates this from openapi/stellar-index.v1.yaml verbatim, so any allowlist on the source yaml must also cover the mirror. Contains the same OpenAPI example values (canonical asset_ids, signup/dashboard key shapes) the source already declares."
paths = [
  '''docs/reference/api/stellar-index\.v1\.yaml''',
]

[[rules.allowlists]]
description = "Historical spec filenames — gitleaks scans full repo history. openapi/stellar-index.v1.yaml + docs/reference/api/stellar-index.v1.yaml were renamed from an earlier filename in a past commit. Those commits still carry the old paths with the SAME synthetic signup/dashboard OpenAPI example keys (k_... key_id + re_live_... plaintext) already allowlisted on the current names above. Allowlist the historical paths so full-history scans pass. Same rationale as the web/showcase historical allowlist."
paths = [
  # Historical pre-rebrand paths — these files no longer exist, but
  # gitleaks scans full history where they do. Path-scoped, harmless.
  '''openapi/rates-engine\.v1\.yaml''',
  '''docs/reference/api/rates-engine\.v1\.yaml''',
]

[[rules.allowlists]]
description = "Historical web/showcase tree — gitleaks scans full repo history. The web/showcase directory was renamed to web/explorer (task #19); past commits contain the old path with the same OpenAPI-derived TS bindings that web/explorer/src/api/types.ts has today (already allowlisted). Allowlist by path so historical scans pass."
paths = [
  '''web/showcase/src/api/types\.ts''',
]

[[rules.allowlists]]
description = "Historical working-doc (removed from the tree, retained in git history) — a user-journey writeup whose prose (`Challenge -> verify -> JWT -> authenticated request -> ...`) trips the entropy heuristic. Not a credential, and the file no longer exists, so no live file is blinded."
paths = [
  '''docs/audit-2026-05-02/03-journeys\.md''',
]

[[rules.allowlists]]
description = "Codex audit evidence doc — a cross-file-interactions findings table quoting public git commit SHAs (e.g. `e9e57cb2...`) and evidence/finding IDs inline. These high-entropy hex strings are commit references, not credentials."
paths = [
  '''docs/audit-2026-05-12-codex/evidence/cross-file-interactions\.md''',
]

# ── curl-auth-header (default rule) ─────────────────────────────────
# The default ruleset flags any `curl -H "Authorization: Bearer …"`
# string. The explorer API-docs page and the dashboard onboarding card
# embed exactly that as a usage EXAMPLE with an obvious placeholder.
[[rules]]
id = "curl-auth-header"
[[rules.allowlists]]
description = "`curl -H \"Authorization: Bearer sip_your_key_here\"` usage examples (explorer /docs page, dashboard onboarding card) showing how to pass an API key. The bearer value is a literal placeholder, not a credential; matched by value so a real key in the same files is still caught."
regexes = [
  '''^sip_your_key(?:_here)?$''',
]
