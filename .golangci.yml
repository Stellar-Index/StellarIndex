# golangci-lint config, applied via `make lint` and CI. Any rule change needs
# a PR + rationale; we don't weaken lint to unblock something
# (docs/engineering-standards.md §8).

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  # Tests are first-class code — they get linted too.
  tests: true

linters:
  default: none
  enable:
    # Correctness
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - bodyclose
    - contextcheck
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
    - ineffassign
    - gosec
    # Exhaustiveness (ADR-0010): catches enum switches that silently drop a
    # variant when a new one is added.
    - exhaustive

    # Style / clarity
    # gofmt + goimports are `formatters:` below in golangci-lint v2; gosimple was
    # merged into staticcheck.
    - unparam
    - unused
    - misspell
    - predeclared
    - usestdlibvars

    # Complexity guards
    - gocognit
    - gocyclo
    - funlen

  settings:
    exhaustive:
      # A `default:` case counts as handling the remaining variants, so only a
      # switch missing cases AND a default is flagged (low noise).
      default-signifies-exhaustive: true
      # The strict form below flags 12 sites repo-wide, mostly intentional
      # error-defaults (canonical/sac.go, supply/key.go, xdrjson/sac.go) and
      # reflect.Kind walkers, and the linter cannot scope strictness to one enum.
      # default-signifies-exhaustive: false
      #
      # Instead, internal/canonical/asset_type_exhaustive_guard_test.go
      # (TestAssetTypeExhaustiveGuard) walks switches on canonical.AssetType at full
      # strictness, and also catches an empty/fallthrough-only `default:`, which this
      # linter counts as exhaustive. Shares this linter's `//exhaustive:ignore`
      # escape hatch (one site: internal/storage/timescale/usd_volume_quote_spec.go).
      # Ignore enums we don't own: go-stellar-sdk `xdr.*` enums have 20+ variants
      # and decoders intentionally handle a subset; `time.Duration` isn't a real
      # enum. Enforcement is scoped to OUR domain enums.
      ignore-enum-types: 'xdr\.|time\.Duration'
    gocognit:
      # Soft limit per engineering-standards.md §4.8: lets linear state machines and
      # dispatcher tables through, flags real mess at 25+.
      min-complexity: 20
    gocyclo:
      min-complexity: 20
    funlen:
      # Soft limit (engineering-standards.md §4.8); exceptions go through review.
      # 100/60 covers dispatch-heavy handlers (handleHistory, handleVWAP,
      # buildDispatcher) that read better linearly.
      lines: 100
      statements: 60
    gosec:
      excludes:
        # G104: errorlint/errcheck cover unchecked errors; gosec's is noisy on
        # intentional ignores.
        - G104
        # G101: false-positives on consts containing "key" or "token" (env-var
        # names). Real secrets never appear as Go literals.
        - G101
        # G115: every flagged int conversion is a Soroban XDR field whose upstream
        # schema caps the range; gosec cannot see that invariant.
        - G115
        # G404: every flagged site is reconnect-backoff jitter or a non-security
        # sample; crypto/rand would block and be rate-limited in a reconnect loop.
        - G404
    errorlint:
      errorf: true
      asserts: true
      comparison: true

  exclusions:
    generated: strict
    rules:
      # Tests: helpers (mustGet, newTestServer) clean up via t.Cleanup, which
      # bodyclose cannot see through, and ctx-less http.Get is fine under the testing
      # package's own timeouts.
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - gocyclo
          - bodyclose
          - noctx
          - errcheck
          - gosec
          - unparam
          - staticcheck
      # Generated files: never lint.
      - path: "(^|/)zz_generated.*\\.go$"
        linters:
          - unused
          - staticcheck
      # cmd/* main.go has fatal-on-error patterns.
      - path: cmd/.*/main\.go
        linters:
          - errcheck

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
  # CI posts a summary of new issues only; but local runs show everything.

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Stellar-Index/StellarIndex
