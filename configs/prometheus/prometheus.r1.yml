# Stellar Index: single-node Prometheus on r1. Scrapes the local exporters and
# alerts to the local Alertmanager. When R2/R3 land, switch to the
# configs/ansible/roles/prometheus 2-host HA topology (Alertmanager cluster on
# :9094).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    region: r1
    deployment: production

# No clustering (single node); Alertmanager fans out to webhook receivers per
# its own config.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

# Operator deploys configs/prometheus/rules.r1/*.yml to
# /etc/prometheus/rules.r1/ (rsync or ansible.builtin.copy of the whole
# directory). Every file has a runbook under docs/operations/runbooks/ and an
# entry in docs/operations/alerts-catalog.md; load the full set so there are no
# silent-rule families. r1 uses hyphenated job labels (multi-host uses
# underscored), and this glob picks up the r1 overlay copies, which match the
# scrape jobs below.
rule_files:
  - /etc/prometheus/rules.r1/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node_exporter
    static_configs:
      - targets: [localhost:9100]
        labels:
          host: r1

  - job_name: stellarindex-indexer
    static_configs:
      - targets: [localhost:9464]
        labels:
          binary: stellarindex-indexer
          host: r1

  - job_name: stellarindex-api
    static_configs:
      - targets: [localhost:3000]
        labels:
          binary: stellarindex-api
          host: r1

  - job_name: stellarindex-aggregator
    static_configs:
      - targets: [localhost:9465]
        labels:
          binary: stellarindex-aggregator
          host: r1

  - job_name: caddy
    static_configs:
      - targets: [localhost:2019]
        labels:
          host: r1
    metrics_path: /metrics

  # Galexie metrics on :6061/metrics (best-effort; the endpoint may hang, see
  # the node-healthcheck.sh comment).
  - job_name: galexie
    static_configs:
      - targets: [localhost:6061]
        labels:
          host: r1
    scrape_timeout: 5s

  # ─── scrape-job coverage ─────────────
  # Multi-host parity for r1's single-host shape. The rule files in
  # configs/prometheus/rules.r1/ (cache.yml, infra.yml, storage.yml) reference
  # the metrics these exporters emit; each job names the runbook family it feeds.

  # redis_exporter, port 9121, installed by
  # configs/ansible/roles/archival-node/tasks/16-prometheus-exporters.yml (Debian
  # package; the redis-sentinel role ships its own tarball exporter on the
  # Sentinel boxes). Feeds cache.yml: redis-writes-blocked, cache-miss-rate-high.
  - job_name: redis_exporter
    static_configs:
      - targets: [localhost:9121]
        labels:
          host: r1
          service: redis

  # Alertmanager self-scrape, port 9093: lets us alert on Alertmanager being
  # down (alertmanager-bad-config + meta runbook family). Required by the
  # deadmansswitch heartbeat (configs/alertmanager/alertmanager.r1.yml).
  - job_name: alertmanager
    static_configs:
      - targets: [localhost:9093]
        labels:
          host: r1

  # postgres_exporter, port 9187, installed by 16-prometheus-exporters.yml
  # (Debian package, peer auth on the local socket). Feeds storage.yml's pg_*
  # alerts.
  - job_name: postgres_exporter
    static_configs:
      - targets: [localhost:9187]
        labels:
          host: r1
          service: postgres
    honor_labels: true

  # pgbackrest_exporter, port 9854 (upstream default), installed by
  # 16-prometheus-exporters.yml (pinned upstream release; version in
  # `pgbackrest_exporter_version`, SHA in inventory).
  - job_name: pgbackrest_exporter
    static_configs:
      - targets: [localhost:9854]
        labels:
          host: r1
          service: pgbackrest

  # ClickHouse, port 9363, served by clickhouse-server ITSELF (no exporter
  # process). Stock config.xml ships the <prometheus> block commented out; the
  # archival-node role's 22-clickhouse-exporter.yml drop-in enables it. Until
  # applied the job is down and clickhouse.yml's stellarindex_clickhouse_server_down
  # pages, the intended signal that the lake's read path has no telemetry.
  # Runbook: docs/operations/runbooks/clickhouse.md
  - job_name: clickhouse
    static_configs:
      - targets: [localhost:9363]
        labels:
          host: r1
          service: clickhouse

  # MinIO cluster metrics: bearer-token auth on the v2 path (not /metrics),
  # read from bearer_token_file.
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [localhost:9000]
        labels:
          host: r1
          service: minio
    # /etc/prometheus/minio.token is minted by 16-prometheus-exporters.yml
    # Group D. Until it exists this job 401s, which surfaces via meta.yml
    # (stellarindex_minio_exporter_down, page).
    # Procedure: docs/operations/runbooks/infra.md#minio-metrics-403
    bearer_token_file: /etc/prometheus/minio.token
