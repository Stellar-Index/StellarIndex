---
# galexie-archive tip-lag alerts (#31) — defense-in-depth for #26.
#
# #26 was a 23-day silent stall of galexie-archive (the ADR-0016 R1
# durable full-mirror). The recurrence fix shipped in #26 is the
# hourly `galexie-archive-fill.timer`; this alert is the safety net
# under it — if that timer (or its `mc` aliases, aws-public IAM,
# etc.) silently breaks, we want to PAGE in hours, not weeks.
#
# Scrape source: node_exporter's textfile_collector reads
# `/var/lib/node_exporter/textfile_collector/galexie_archive_tip_lag.prom`,
# updated every 5 min by `galexie-archive-tip-lag.timer` →
# `/usr/local/bin/galexie-archive-tip-lag`.
#
# Metrics published:
#   galexie_archive_tip_ledger          — gauge, newest ledger in archive bucket.
#   galexie_live_tip_ledger             — gauge, newest ledger in live bucket.
#   galexie_archive_tip_lag_ledgers     — gauge, live - archive (lag in ledgers).
#   galexie_archive_tip_lag_updated_seconds — gauge, unix-time of last successful update.
#
# Partition model — the thresholds below depend on it:
# galexie writes 64,000 ledgers per partition (files_per_partition
# = 64000, ledgers_per_file = 1) and galexie-archive-fill mirrors
# only COMPLETE partitions. The archive tip therefore structurally
# lags galexie-live by however far live is into the current,
# in-progress partition — i.e. the lag sweeps 0 → 64,000 every
# partition (~4 days at mainnet pace) and drops back to ~0 when the
# hourly fill mirrors the just-completed partition. A lag ABOVE one
# full partition means a completed partition went un-mirrored — that
# is the fill timer failing.
#   Warn threshold: >64,000 sustained 90 min → a completed partition
#     stayed un-mirrored past two hourly fill cycles.
#   Page threshold: >128,000 → ≥2 completed partitions behind; the
#     hourly fill has clearly broken (the #26 failure class).
# The pre-2026-05-22 thresholds (5,000 / 50,000) predated this model
# and false-fired through every normal partition cycle.

groups:
  - name: stellarindex.galexie_archive_tip_lag
    interval: 60s
    rules:

      - alert: stellarindex_galexie_archive_tip_lag_high
        expr: galexie_archive_tip_lag_ledgers > 64000
        for: 90m
        labels:
          severity: ticket
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/galexie-archive-tip-lag.md
          summary: "galexie-archive >1 partition behind live ({{ $value }} ledgers, sustained 90m, P3)"
          description: |
            galexie-archive (R1 durable full-mirror) is {{ $value }}
            ledgers behind galexie-live — more than one full 64,000-
            ledger partition — and has stayed there for 90+ minutes
            (two hourly fill cycles). A completed partition is not
            being mirrored: the hourly galexie-archive-fill timer is
            slow or partially failing. Customer impact: none yet
            (live ingest unaffected, durable upstream aws-public-blockchain
            backstops); R1's full-mirror guarantee is degrading.
            Investigate galexie-archive-fill.timer status + last log +
            aws-public mc-alias reachability.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/galexie-archive-tip-lag.md

      - alert: stellarindex_galexie_archive_tip_lag_severe
        expr: galexie_archive_tip_lag_ledgers > 128000
        for: 30m
        labels:
          severity: page
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/galexie-archive-tip-lag.md
          summary: "galexie-archive >2 partitions behind live ({{ $value }} ledgers, P1)"
          description: |
            galexie-archive is {{ $value }} ledgers behind galexie-live
            — more than two full 64,000-ledger partitions. The hourly
            galexie-archive-fill.timer has clearly broken — same
            failure class as the original 23-day stall #26 was the
            initial fix for. Customer impact: local WASM-walks +
            historical backfills past the gap will fail; R1's
            full-mirror integrity-leader role is broken until repair.
            Runbook: same as above.

      - alert: stellarindex_galexie_archive_tip_lag_metric_stale
        expr: time() - galexie_archive_tip_lag_updated_seconds > 1800
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/galexie-archive-tip-lag.md
          summary: "galexie-archive tip-lag metric not updated >30m"
          description: |
            The galexie-archive-tip-lag.timer hasn't successfully
            updated its textfile for >30 min (timer fires every
            5 min). The alert metric itself is the canary; without
            it we lose the safety net. Check
            `systemctl status galexie-archive-tip-lag.timer` +
            the service's last journal entries; verify the script
            can read both MinIO buckets via the `local` mc alias.

      # DR-asset shape guard (2026-08-21 DR review): tip-lag proves the
      # newest edge advances; this proves the MIDDLE is intact. The scan
      # declares the expected coverage (genesis partition + the
      # ARCHIVE_FROM tail, with the capacity-trim window as the ONLY
      # permitted hole) and counts every other discontinuity or overlap.
      # A partition deleted by a bad trim cutoff, a manual mc rm, or a
      # MinIO heal failure would otherwise surface at RESTORE time —
      # the worst possible moment for the mirror the off-site DR copy
      # is pulled from (docs/architecture/multi-region-ha.md §5).
      - alert: stellarindex_galexie_archive_gap
        expr: galexie_archive_unexpected_gaps > 0
        for: 1h
        labels:
          severity: page
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/galexie-archive-contiguity.md
          summary: "galexie-archive has {{ $value }} unexpected partition gap(s)/overlap(s)"
          description: |
            galexie_archive_unexpected_gaps = {{ $value }} — the durable
            mirror's partition coverage no longer matches its declared
            shape (genesis [0,63999] + ARCHIVE_FROM→tip, capacity-trim
            middle excluded). Either a partition was deleted/corrupted or
            a re-fill wrote an overlapping range. Do NOT let the next
            trim run before diagnosing. Enumerate with
            `mc ls local/galexie-archive/` and compare against the
            declared trim; recover a lost partition from
            aws-public-blockchain per the runbook.

      - alert: stellarindex_galexie_archive_contiguity_silent
        # The scan itself is the canary; if its timer breaks, the shape
        # guard is blind (the tip-lag stale alert pattern, same class).
        expr: absent_over_time(galexie_archive_unexpected_gaps[3h])
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/galexie-archive-contiguity.md
          summary: "galexie-archive contiguity scan stopped emitting"
          description: |
            galexie_archive_unexpected_gaps has been absent >3h (the
            timer fires hourly). Check
            `systemctl status galexie-archive-contiguity.timer` + the
            service journal; verify the `local` mc alias can list the
            bucket.

      # ── The scan's own health (monitoring of monitoring) ─────────
      #
      # stellarindex_galexie_archive_gap above is `page` and is the only
      # recurring guard on this bucket's SHAPE. Until this alert existed
      # its producer could fail without saying so:
      #
      #   - The scan read the bucket with `mc ls … || true`, which threw
      #     the exit status away. A read that died PARTWAY handed the
      #     parser a truncated but perfectly contiguous prefix, so the
      #     walk found no holes and wrote `unexpected_gaps 0` — a clean
      #     DR verdict derived from a failed read, byte-identical to the
      #     healthy answer. Reproduced against the shipped bytes
      #     2026-09-05: a listing cut after 4 of 11 partitions.
      #   - A read that died having emitted NOTHING wrote
      #     `unexpected_gaps 1`, which pages with a DR-corruption claim
      #     about a bucket nobody managed to look at, and sends the
      #     responder to the recovery runbook for a `mc` fault.
      #   - The scan not running leaves node_exporter serving the LAST
      #     file forever: present, re-scraped every interval with a fresh
      #     sample timestamp, and frozen on the zero it last wrote. The
      #     contiguity_silent arm above reads ABSENCE and so cannot see
      #     this at all.
      #
      # The producer now publishes its own state on every run, and does
      # not publish a partition verdict for a run that could not look. A
      # SUCCESSFUL read that returns nothing is unchanged and still
      # pages: an empty durable mirror is a real DR event, and
      # galexie_archive_scan_listing_lines is what separates it from a
      # listing the parser no longer matches.
      #
      # `ticket`, not `page`: this is the severity every sibling
      # probe-blindness alert in the tree carries —
      # _galexie_archive_contiguity_silent (which guards the same page),
      # _galexie_archive_tip_lag_metric_stale, _ledger_meta_decode_probe_stale
      # and _timescale_probe_degraded. A blindness alert louder than
      # everything it protects trains people to ignore it, and `ticket`
      # is the quietest severity that is DELIVERED at all
      # (`informational` routes to `receiver: silent`).
      #
      # 10800 s = three missed runs on an hourly timer, matching the 3 h
      # window contiguity_silent already uses; the absent arm's 6 h
      # window is longer than the threshold so the two cannot flap.
      - alert: stellarindex_galexie_archive_scan_degraded
        expr: |
          galexie_archive_scan_ok == 0
          or
          (time() - galexie_archive_scan_last_run_unix) > 10800
          or
          absent_over_time(galexie_archive_scan_last_run_unix[6h])
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/galexie-archive-contiguity.md
          summary: "galexie-archive contiguity scan is not producing a usable verdict"
          description: |
            The hourly partition scan is not producing a usable
            galexie_archive_contiguity.prom, so
            stellarindex_galexie_archive_gap is evaluating over a series
            that is absent or frozen and cannot fire. Silence from it
            currently means nothing either way.

            Which arm tripped says where to look. scan_ok == 0 is a
            bucket listing that errored — the `local` mc alias, MinIO
            reachability, credentials. A last_run_unix older than 3 h, or
            absent, is the scan or its timer not running: node_exporter
            keeps serving the last file it saw, so the verdict stays
            present and stops moving.

            Start with `systemctl status galexie-archive-contiguity.timer`
            and the file's mtime, then run
            /usr/local/bin/galexie-archive-contiguity by hand. When the
            partition count is zero on a SUCCESSFUL read,
            galexie_archive_scan_listing_lines says whether the bucket is
            really empty (0) or answered in a shape the scan can no
            longer parse (> 0).

      - alert: stellarindex_galexie_catchup_refused
        # 2026-07-05: the captive core wedged with 'invalid local state'
        # and refused catchup for 11 hours while the lake froze — the
        # signature sat verbatim in the journal, unwatched. Sustained
        # refusals = the core cannot heal itself; the remedy is a galexie
        # restart (fresh bucket catchup from the archive).
        expr: stellarindex_galexie_catchup_refusals_5m > 0
        for: 10m
        labels:
          severity: page
          team: stellarindex
          component: archive
        annotations:
          summary: "galexie captive core is refusing catchup (invalid local state)"
          description: |
            The galexie captive core has logged catchup refusals ('invalid
            local state') sustained 10+ minutes — the same signature that
            wedged the lake for 11 hours on 2026-07-05. A sustained refusal
            means the core cannot heal itself; the archive tip stops
            advancing. Remedy is a galexie restart (fresh bucket catchup
            from the archive). See the runbook.
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/galexie-catchup-refused.md

      # ── The catchup probe's own health (monitoring of monitoring) ──
      #
      # stellarindex_galexie_catchup_refused above is `page` and has no
      # absent arm and no staleness arm, so until this alert existed
      # every way its producer could fail was silent AND landed on the
      # value 0 — which is also the healthy value:
      #
      #   - The probe counted with `journalctl … | grep -c … || true`.
      #     `grep -c` prints 0 and exits 1 on no match, the healthy
      #     outcome, so the `|| true` was load-bearing and swallowed the
      #     journal read's failure with it. Measured on r1 2026-09-05, a
      #     healthy read, a unit name that does not exist, a journal that
      #     could not be opened and a missing journalctl binary all
      #     produced N=0 and exit 0.
      #   - A read that exits 0 and returns NOTHING (a renamed unit) is a
      #     correctly-derived zero over an empty input, with no error
      #     anywhere. galexie logged 364-409 lines per 5 min across
      #     twelve consecutive buckets on r1, so zero lines is never the
      #     healthy value while galexie is running.
      #   - The probe not running leaves node_exporter serving the LAST
      #     file forever: present, re-scraped with a fresh sample
      #     timestamp every interval, frozen at zero refusals.
      #
      # `ticket`, not `page`, even though what it protects is a page:
      # every sibling probe-blindness alert in the tree is a ticket
      # (_galexie_archive_tip_lag_metric_stale,
      # _galexie_archive_contiguity_silent, _ledger_meta_decode_probe_stale,
      # _timescale_probe_degraded), a blindness alert louder than
      # everything it protects trains people to ignore it, and the
      # CONDITION behind the page it guards has an independent net —
      # a wedged captive core freezes the lake, which stalls
      # stellarindex_cursor_last_ledger and pages via
      # stellarindex_ingestion_ledger_stalled in ~10 min. What is lost
      # while this probe is blind is the alert that NAMES the cause, not
      # the detection. `ticket` is also the quietest severity that is
      # DELIVERED at all (`informational` routes to `receiver: silent`).
      #
      # 600 s = ten missed ticks on a 60 s timer, plus `for: 15m`, so a
      # galexie restart or one slow run cannot trip it. The absent arm's
      # 30 m window is longer than the threshold so the two cannot flap.
      - alert: stellarindex_galexie_catchup_probe_degraded
        expr: |
          stellarindex_galexie_catchup_probe_read_ok == 0
          or
          stellarindex_galexie_catchup_probe_journal_lines == 0
          or
          (time() - stellarindex_galexie_catchup_probe_last_run_unix) > 600
          or
          absent_over_time(stellarindex_galexie_catchup_probe_last_run_unix[30m])
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: archive
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/galexie-catchup-refused.md
          summary: "galexie catchup-refusal probe is not producing usable metrics"
          description: |
            galexie-catchup-probe.timer is not producing a usable
            galexie_catchup.prom, so stellarindex_galexie_catchup_refused
            is evaluating over a series that is absent or frozen and
            cannot fire. Silence from it currently means nothing either
            way.

            Which arm tripped says where to look. read_ok == 0 is a
            journal read that errored — a missing journalctl, an
            unreadable journal. journal_lines == 0 is a read that
            succeeded and returned nothing, which yields a
            correctly-derived zero refusals over an empty input: the unit
            name no longer matches, or galexie is not running at all. A
            last_run_unix older than 10 min, or absent, is the script or
            its timer not running: node_exporter keeps serving the last
            file it saw, so the count stays present and stops moving.

            Start with `systemctl status galexie-catchup-probe.timer` and
            the file's mtime, then run
            /usr/local/sbin/galexie-catchup-probe.sh by hand. While this
            is firing, a wedged captive core would still surface as
            stellarindex_ingestion_ledger_stalled.

      - alert: stellarindex_host_swap_activity
        # Swap engagement is the early warning of the pressure class that
        # wedged the captive core — batch jobs must be memory-capped
        # (run-heavy-job.sh), so ANY sustained swapping means a budget is
        # being violated.
        expr: rate(node_vmstat_pswpout[10m]) > 100
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          summary: "host is swapping — a memory budget is being violated"
          description: |
            The host has been paging to swap (node_vmstat_pswpout) sustained
            15+ minutes. Batch jobs are required to be memory-capped
            (run-heavy-job.sh), so any sustained swapping means a memory
            budget is being violated — the early-warning pressure class that
            wedged the galexie captive core. Identify the over-budget process
            and cap it before the core is starved. See the runbook.
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/host-swap-activity.md
