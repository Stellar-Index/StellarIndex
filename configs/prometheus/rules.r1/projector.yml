---
# R1 single-host overlay of projector alerts (ADR-0032). Same rules
# as deploy/monitoring/rules/projector.yml — duplicated here for
# the R1 single-host prometheus config per the wave-96 monitoring-
# rules CI dual-validation pattern.

groups:
  - name: stellarindex.projector
    interval: 30s
    rules:

      # The `unless` arm (issue #325, 2026-08-29) excuses the ONE lag that
      # is intended: an operator-initiated `stellarindex-ops
      # projector-replay` rewind (the reflector-fx replay of 2026-08-29
      # rewound 2,574,496 ledgers on purpose and ticketed for ~4h while
      # masking any genuine lag on the same source). The flag is 1 only
      # while the cursor is inside the RECORDED window and below its
      # pre-rewind position, and the sibling replay_stalled rule below
      # fires if the replay stops advancing — so this is a discriminator,
      # not a silence.
      - alert: stellarindex_projector_lag_high
        expr: |
          max by (source) (stellarindex_projector_lag_ledgers) > 256
          unless
          max by (source) (stellarindex_projector_replay_window_active) == 1
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-lag.md
          summary: "Projector source {{ $labels.source }} lagging > 256 ledgers"
          description: |
            The ADR-0032 projector's per-source cursor for {{ $labels.source }}
            is {{ $value }} ledgers behind the ledgerstream tip. Sustained lag
            means the projector cannot keep up with raw soroban_events writes,
            so per-source projections (trades, blend_*, phoenix_*, ...) will
            increasingly diverge from the raw store.

            Runbook: docs/operations/runbooks/projector-lag.md

      # Mirror of the rule in deploy/monitoring/rules/projector.yml (the
      # wave-96 monitoring-rules CI dual-validation pattern). The other half
      # of the #325 replay pair: with the lag rule excused during a replay,
      # THIS rule is what keeps the window covered — a stuck replay leaves
      # the served-row deficit it was started to repair wide open. "Not
      # climbing" is read off the lag gauge: a healthy replay's lag falls
      # every 5s cycle, so the current sample sitting AT the 15m maximum
      # means the cursor has stopped (or the tip is outrunning it). `for: 5m`
      # rides out the rewind instant itself, which momentarily satisfies the
      # same equality. The `> 256` LAG FLOOR is the same bound lag_high
      # uses, and is load-bearing: without it `max_over_time(lag[15m]) <=
      # lag` is trivially true at lag 0, so a fully caught-up healthy source
      # would ticket as a stalled replay whenever its window flag was 1.
      - alert: stellarindex_projector_replay_stalled
        expr: |
          (max by (source) (stellarindex_projector_replay_window_active) == 1)
          and
          (max by (source) (stellarindex_projector_lag_ledgers) > 256)
          and
          (max by (source) (max_over_time(stellarindex_projector_lag_ledgers[15m]))
            <= max by (source) (stellarindex_projector_lag_ledgers))
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-replay.md
          summary: "Projector replay for {{ $labels.source }} has STOPPED advancing"
          description: |
            An operator-initiated projector-replay is in progress for
            {{ $labels.source }} (the cursor is still inside the recorded
            rewind window) and its lag is still over the 256-ledger
            lag_high bound but has not fallen for 15+ minutes — the cursor
            is stalled or the live tip is outrunning it, so the replay will
            never finish on its own. The served-row deficit the replay was
            started to repair is still open.

            Check `stellarindex_projector_wedged` and the
            `runs_total{outcome="error"|"sink_retry"}` rates for this source
            first — a floored window or a held sink is the usual cause — and
            follow the replay runbook's decompress-first pre-flight.

            Runbook: docs/operations/runbooks/projector-replay.md

      - alert: stellarindex_projector_error_rate_high
        expr: |
          sum by (source) (rate(stellarindex_projector_runs_total{outcome="error"}[15m])) > 0.05
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-lag.md
          summary: "Projector source {{ $labels.source }} cycle errors sustained"
          description: |
            The projector for {{ $labels.source }} is failing > 5% of cycles
            for 15+ minutes. Cursor is not advancing — backlog is growing.

            Runbook: docs/operations/runbooks/projector-lag.md

      # Mirror of the rule in deploy/monitoring/rules/projector.yml (the
      # wave-96 monitoring-rules CI dual-validation pattern). COR-11/COR-01
      # (audit-2026-07-23): the projector's poison-row escape hatch
      # (quarantineCandidate) gives up on at most ONE un-processable row
      # per cycle once its retry budget is exhausted, then advances the
      # cursor past it. The raw event survives in the lake and is
      # re-driveable via `stellarindex-ops projector-replay`, but a
      # quarantine is otherwise SILENT data-completeness debt. Sensitive
      # (any nonzero increase over the window fires).
      # Q261: `for: 0m` plus a born-inside-the-window arm. `for: 15m` over
      # a 15m increase window cannot fire on ONE quarantine — the expression
      # is true for only 15m after the increment and the pending period
      # needs a further 15m — and a quarantine is one row by construction
      # (quarantineCandidate gives up on at most one row per cycle). The
      # {source,outcome="sink_quarantined"} child is also unseeded, so it is
      # born at 1 and increase() alone reads 0; `unless … offset 15m` reads
      # "exists now, did not exist one window ago" (same idiom as
      # ingestion.yml's stellarindex_ingestion_persist_drop — whose comment
      # also records the arm's known false positive: a Prometheus scrape
      # gap at t-15m makes an already-non-zero child read as newly born and
      # tickets for up to 15m with no new quarantine).
      - alert: stellarindex_projector_row_quarantined
        expr: |
          increase(stellarindex_projector_events_decoded_total{outcome="sink_quarantined"}[15m]) > 0
          or (
            stellarindex_projector_events_decoded_total{outcome="sink_quarantined"} > 0
            unless stellarindex_projector_events_decoded_total{outcome="sink_quarantined"} offset 15m
          )
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-row-quarantined.md
          summary: "Projector quarantined a row on {{ $labels.source }} — poison-row escape hatch fired"
          description: |
            stellarindex_projector_events_decoded_total{source="{{ $labels.source }}",outcome="sink_quarantined"}
            incremented: the projector gave up on ONE un-processable row
            after exhausting its retry budget and advanced the cursor past
            it. The row is durably skipped from the served tier — not
            lost (the raw event is still in the lake) — until it is
            re-driven with `stellarindex-ops projector-replay -source
            {{ $labels.source }}` after the underlying defect is fixed.
            Any nonzero rate needs eyes.

            Runbook: docs/operations/runbooks/projector-row-quarantined.md

      # RLT-131 (audit-2026-09-18). The SISTER of the quarantine rule above,
      # and the gap that made this finding "high": the skip arm — a
      # POSITIVELY-identified permanent data fault, SQLSTATE class 22/23 or a
      # canonical value-shape rejection — sheds rows and advances the cursor
      # past them exactly like a quarantine does, and had no rule of any kind.
      # The only signal was an ERROR log. classifySinkFault returns
      # dispositionSkip for ANY class 22/23 error, and those classes are not
      # always row-local: a migration adding a NOT NULL or a CHECK the live
      # rows violate rejects EVERY row of the window. The projector now holds
      # such a window for QuarantineAfterCyclesNoProgress (~1 h) and then
      # bleeds one row per cycle, which makes the stall visible — but the rows
      # that do leave still leave the served tier silently without this.
      # Same posture, and same Q261 born-inside-the-window arm, as the
      # quarantine rule: the {source,outcome="sink_permanent"} child is
      # unseeded (no projector series on r1 has ever carried an outcome other
      # than "ok"), so it is born at 1 by the very drop the rule is for and
      # increase() alone reads 0.
      - alert: stellarindex_projector_row_dropped_permanent
        expr: |
          increase(stellarindex_projector_events_decoded_total{outcome="sink_permanent"}[15m]) > 0
          or (
            stellarindex_projector_events_decoded_total{outcome="sink_permanent"} > 0
            unless stellarindex_projector_events_decoded_total{outcome="sink_permanent"} offset 15m
          )
        for: 0m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-row-quarantined.md
          summary: "Projector permanently dropped a row on {{ $labels.source }} — the sink rejected its VALUES"
          description: |
            stellarindex_projector_events_decoded_total{source="{{ $labels.source }}",outcome="sink_permanent"}
            incremented: the sink rejected the row's VALUES (SQLSTATE class
            22/23, or a canonical value-shape check before the statement ran)
            and the cursor advanced past it. The raw event is still in the
            lake; the served tier is missing the row until it is re-driven
            with `stellarindex-ops projector-replay -source
            {{ $labels.source }}` after the defect is fixed.

            READ THE RATE, NOT JUST THE EVENT. One row is a poison value. A
            burst across many ledgers of one source is the GLOBAL form of the
            same SQLSTATE — usually a migration whose NOT NULL / CHECK the
            live rows violate — and the projector will be stalling
            (runs_total{outcome="sink_retry"}, rising lag) while it bleeds one
            row per cycle. Fix the schema before the backlog drains.

            Runbook: docs/operations/runbooks/projector-row-quarantined.md

      # RLT-131 / ADR-0003 (docs/adr/0003-i128-no-truncation.md, §Operational
      # impact): "any observed errors.Is(err, canonical.ErrI128Overflow) in
      # production fires a SEV-1. It indicates an int64 sneaking in
      # somewhere." That promise had no implementation — the sentinel is in
      # the projector's valueShapeSentinels, so an overflow was skipped and
      # counted as an ordinary sink_permanent drop, indistinguishable from a
      # bad on-chain value.
      #
      # It is NOT a data-quality verdict. i128 is the width every canonical
      # amount is carried at; the error means one of OUR paths narrowed a
      # value to int64, so every amount that path touched is suspect, not just
      # the row that tripped the check. Hence `page` (this repo's SEV-1) where
      # the sibling drop rule tickets, and `for: 0m` — ONE observation is the
      # whole event.
      #
      # Born-inside-the-window arm for the same reason as the rules above: the
      # child does not exist until the first overflow creates it, so
      # increase() alone would read 0 on exactly the observation this exists
      # to catch.
      - alert: stellarindex_projector_i128_overflow
        expr: |
          increase(stellarindex_projector_events_decoded_total{outcome="sink_i128_overflow"}[15m]) > 0
          or (
            stellarindex_projector_events_decoded_total{outcome="sink_i128_overflow"} > 0
            unless stellarindex_projector_events_decoded_total{outcome="sink_i128_overflow"} offset 15m
          )
        for: 0m
        labels:
          severity: page
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-row-quarantined.md
          summary: "i128 OVERFLOW on {{ $labels.source }} — an int64 has reached an amount path (ADR-0003 SEV-1)"
          description: |
            stellarindex_projector_events_decoded_total{source="{{ $labels.source }}",outcome="sink_i128_overflow"}
            incremented: a canonical.Amount value that must fit in 128 bits
            did not. ADR-0003 fixes i128 as the width of every amount in this
            system, so this is never a property of the chain data — it is
            proof that an int64 has been introduced on one of our own amount
            paths.

            TREAT EVERY AMOUNT THAT PATH TOUCHED AS SUSPECT, not just the
            dropped row: a narrowed int64 truncates silently and only the
            value that exceeded the bound raises this. Find the conversion
            (`git log` the decoder and the sink for {{ $labels.source }}),
            fix it, then re-drive with `stellarindex-ops projector-replay
            -source {{ $labels.source }}` over the whole affected range — the
            rows that did NOT overflow are the dangerous ones, because they
            landed.

            Runbook: docs/operations/runbooks/projector-row-quarantined.md

      # Mirror of the rule in deploy/monitoring/rules/projector.yml (the
      # wave-96 monitoring-rules CI dual-validation pattern). DATA-6 / NS-2
      # (audit-2026-08-14): a projector decode soft-fail SKIPS the row and lets
      # the cursor advance; a shipped decoder REGRESSION breaks a whole CLASS of
      # valid events the same way (the projector runs the SAME decoders as
      # ingest — the phoenix 5,161-orphaned-swap class), silently draining them
      # from the served tier. The cycle is marked runs_total{outcome=
      # "decode_degraded"} (no longer "ok") but the cursor still advances
      # (holding would re-wedge a sole-writer source — COR-11), so this RATE
      # alert is the defence. Sibling of stellarindex_ingestion_decode_error;
      # threshold more sensitive (>0.1/s) so a class-wide regression on a quiet
      # source still fires.
      - alert: stellarindex_projector_decode_error_rate_high
        expr: |
          sum by (source) (rate(stellarindex_projector_events_decoded_total{outcome="decode_error"}[10m])) > 0.1
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-decode-error-rate.md
          summary: "Projector source {{ $labels.source }} decode errors sustained — likely a decoder regression"
          description: |
            The ADR-0032 projector for {{ $labels.source }} is failing to decode
            events at {{ $value | humanize }}/sec sustained 15+ minutes. Each
            failure SKIPS the row and advances the cursor past it, so those
            events are silently dropped from the served per-source tier —
            recoverable only by re-drive. A sustained rate (vs the odd poison
            row) means a decoder REGRESSION broke a whole class of valid events.
            Fix the decoder, then re-drive with `stellarindex-ops
            projector-replay -source {{ $labels.source }}`.

            Runbook: docs/operations/runbooks/projector-decode-error-rate.md

      # Mirror of the rule in deploy/monitoring/rules/projector.yml (the
      # wave-96 monitoring-rules CI dual-validation pattern). PROJECTOR WEDGE
      # (task #33 / W8 recon 9b): the adaptive window has shrunk to the
      # MinBatchLimit floor and STILL cannot advance for WedgeCycles+ consecutive
      # cycles — a floor-sized range stuck over PerSourceTimeout (a dense +
      # compressed chunk) retried identically forever. The gauge flips to 1 on a
      # wedge, clears on any advancing cycle; remediation is manual (raise the
      # per-cycle budget or decompress) per the runbook.
      - alert: stellarindex_projector_wedged
        expr: |
          max by (source) (stellarindex_projector_wedged) > 0
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: projector
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/projector-wedged.md
          summary: "Projector source {{ $labels.source }} is WEDGED — cursor stuck at the window floor"
          description: |
            The ADR-0032 projector for {{ $labels.source }} has shrunk its
            adaptive window to the MinBatchLimit floor (25 ledgers) and STILL
            cannot commit forward progress — it has failed to advance for
            WedgeCycles+ consecutive cycles. A floor-sized range that stays over
            PerSourceTimeout (a dense + compressed chunk) is retried identically
            every cycle forever, so this source's projection stops advancing
            while every OTHER source keeps flowing. No data is lost (the raw
            events survive in the lake) but this source will NOT self-recover.
            Manual remediation: raise the per-cycle budget (PerSourceTimeout) or
            decompress the offending range, then confirm the wedge clears.

            Runbook: docs/operations/runbooks/projector-wedged.md
