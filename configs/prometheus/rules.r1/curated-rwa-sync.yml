---
# Curated RWA sync alerts. Pair with curated-rwa-sync.service/.timer
# (configs/ansible/roles/archival-node/templates/systemd/) — the daily unit that caches a named third party's list of tokenized
# real-world assets and its prices into rwa_curated_directory.
#
# Scrape source: node_exporter's textfile_collector reads
# `/var/lib/node_exporter/textfile_collector/curated_rwa_sync.prom`,
# written by the run itself on every pass, dry or wet.
#
# Why this rule exists. The curated arm's reader enforces a 48-hour
# recognition bound in SQL: past it the arm reports `unavailable` and the
# curated panel says so — which is correct, and also silent. A sync that
# stopped (unit failing before it writes, key rotated out, Dune refusing
# the execution) would otherwise be discovered by a reader of the page.
# 30h is one missed daily run plus jitter: the first firing arrives well
# before the 48h bound empties the arm on the wire.
#
# `ticket`, not `page`: the curated arm going dark degrades a comparison
# panel, not the verified surface beside it.

groups:
  - name: stellarindex.curated_rwa_sync
    interval: 60s
    rules:

      - alert: stellarindex_curated_rwa_sync_stale
        # The absent arm is gated on Prometheus having actually WATCHED
        # 30h of scrapes: absent_over_time is true from the first
        # evaluation on a fresh rule load, and a series that has not
        # existed for 10 minutes is not one that has been missing for
        # 30 hours. ~1,700 node_exporter samples at 60s is 28h+ of
        # observed absence.
        expr: |
          (time() - stellarindex_curated_rwa_sync_last_run_unix) > (30 * 3600)
          or
          (
            absent_over_time(stellarindex_curated_rwa_sync_last_run_unix[30h])
            and on() (count_over_time(up{job="node_exporter"}[30h]) > 1700)
          )
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/curated-rwa-sync-stale.md
          summary: "the curated RWA sync has not recorded a run in ≥ 30h (cadence daily) — the curated arm will read unavailable at 48h"
          description: |
            No curated-rwa-sync run has stamped `last_run_unix` in over 30
            hours, or none ever has. Either curated-rwa-sync.timer is not
            scheduled, the unit is refusing to start (DUNE_API_KEY unset
            in /etc/default/curated-rwa-sync), the Dune execution is
            failing, or the textfile directory is not writable by the
            unit. At 48 hours the reader's recognition bound empties the
            arm and /v1/rwa/assets reports `curated.status:
            unavailable`. Check `systemctl list-timers
            curated-rwa-sync.timer`, `journalctl -u curated-rwa-sync`,
            and the credit cost gauge — a run that executed but was
            refused still costs nothing, and a run that never executed
            leaves the gauge frozen.

      # A run that REFUSED to read the curator — no API key configured —
      # still stamps the textfile (so the alert above measures the timer)
      # and says so here. A fresh install carries an empty placeholder in
      # /etc/default/curated-rwa-sync until the operator sets the key.
      - alert: stellarindex_curated_rwa_sync_refused
        expr: stellarindex_curated_rwa_sync_refused == 1
        for: 2h
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/curated-rwa-sync-stale.md
          summary: "the curated RWA sync is refusing to run — DUNE_API_KEY is not set on this host"
          description: |
            The most recent curated-rwa-sync run exited without reading
            the curator because DUNE_API_KEY is empty in
            /etc/default/curated-rwa-sync. The curated arm of
            /v1/rwa/assets reports `unwired`/`unavailable` until a key is
            set. Set vault_dune_api_key in the host's vault and re-apply
            the archival-node role (it renders the file root:root 0600),
            or paste it into the placeholder, then start
            curated-rwa-sync.service; the gauge clears on the next
            stamped run.
