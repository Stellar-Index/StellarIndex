---
# Storage alerts — Postgres + TimescaleDB + pgBackRest.

groups:
  - name: stellarindex.storage
    interval: 30s
    rules:

      # F-1329: the scrape job is `postgres_exporter` (not `postgres`)
      # and postgres_exporter emits no `role` label, so the old
      # `up{job="postgres",role="primary"}` selector matched no series
      # and this PAGE was dead. postgres_exporter exposes `pg_up` (1 =
      # the exporter reached the server, 0 = it could not) — the direct
      # liveness signal for the single-node r1 primary.
      - alert: stellarindex_timescale_primary_down
        expr: pg_up == 0
        for: 30s
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale-primary-down.md
          summary: "TimescaleDB primary is down (SEV-1)"
          description: |
            Postgres primary {{ $labels.instance }} has been unreachable for
            30+ s. Writes are blocked everywhere. Patroni should auto-failover
            within 60 s — if not, follow the manual-failover path in the
            runbook.

      # F-0151 (audit-2026-05-26): the indexer's *sql.DB pool
      # silently held dead conns for ~14 h after postgres@15-main
      # crashed + recovered, until a manual indexer restart. The
      # pool now retires conns every 30 min via
      # `PoolConnMaxLifetime`; this alert is the LIVE signal so
      # the next cascade surfaces in minutes instead of hours.
      # The indexer's `watchPostgresPing` goroutine probes the
      # pool every 60 s and increments
      # `stellarindex_postgres_ping_total{outcome="error"}` per
      # failure.
      # THRESHOLD IS `> 0`, NOT `> 0.5`. The probe ticks once per 60 s,
      # so the maximum achievable rate is 1/60 = 0.0167/s — a `> 0.5`
      # threshold (150 errors in 5 minutes) is unreachable by 30x, and
      # this page could never fire. That is the F-0151 incident's own
      # detector: on 2026-05-26 the indexer sat on a wedged pool for
      # ~14 h and was found by hand. The metric's own docstring in
      # internal/obs/metrics.go prescribes `> 0` for 2m; the rule did
      # not match it. Corrected 2026-08-04 (cold audit).
      - alert: stellarindex_postgres_ping_failing
        expr: rate(stellarindex_postgres_ping_total{outcome="error"}[5m]) > 0
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/postgres-ping-failing.md
          summary: "Indexer postgres pool ping failing (F-0151)"
          description: |
            The indexer's resilience-ping goroutine is reporting
            sustained Postgres ping failures (rate {{ $value }}/s
            over the last 5 m). The pool's 30 min lifetime
            safety-net will refresh dead conns automatically, but
            until then writes are likely stalled. Check
            `postgresql@15-main.service` (NOT the umbrella) and
            the indexer journal for the `pool may be wedged` log
            line.

      - alert: stellarindex_timescale_replica_lag
        expr: pg_replication_lag_seconds > 5
        for: 2m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/replica-lag.md
          summary: "Postgres sync replica lagging {{ $value }}s"
          description: |
            Replica {{ $labels.instance }} is more than 5 s behind the primary
            for 2+ minutes. If this is the sync replica, writes on the primary
            are being held back until it catches up — look for saturation on
            the replica.

      # F-1251 (audit-2026-05-12): lock-table headroom. The
      # 2026-05-06 SEV-3 hit `out of shared memory (53200)` when
      # the per-tx lock table saturated under concurrent ingest
      # (default max_locks_per_transaction = 64 × 200 conns =
      # 12,800-entry table). Bumped to 256 (51,200) by hand, which
      # held ~9 days before the 2026-05-15 recurrence: trades grew
      # to ~2,738 chunks and concurrent diagnostic queries + the
      # all-time SDEX backfill thrashed it again. The R1 ansible
      # role now templates max_locks_per_transaction = 4096
      # (819,200 entries — permanent growth headroom). This alert
      # fires at 70% saturation so we get warning long before any
      # future bump is forced. postgres_exporter HAS been scraped
      # on R1 since F-0152 closed (2026-05-27, job
      # `postgres_exporter` on :9187) — the stale "not currently
      # scraped" note this block used to carry is what let the
      # broken join below go unnoticed.
      #
      # #301: `pg_locks_count` is NOT a single series. The
      # exporter's built-in `pg_locks` collector emits one sample
      # per (datname, mode) — eight lock modes × every database —
      # so the old unqualified `pg_locks_count / (...)` had no
      # right-hand label set to match and evaluated to the empty
      # vector on every tick: the SEV-3 guard was silently dead.
      # Sum the modes/databases into a per-instance total and join
      # `on (instance)` against the single-series settings gauges,
      # the same shape the sibling `_connections_saturated` was
      # corrected to in 1bcd6a9e. The lock table is one
      # cluster-wide shared-memory arena, so summing across
      # databases as well as modes is the correct numerator.
      - alert: stellarindex_timescale_lock_table_pressure
        expr: |
          sum by (instance) (pg_locks_count)
            / on (instance) (pg_settings_max_locks_per_transaction * pg_settings_max_connections)
            > 0.7
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/pg-conns-saturated.md
          summary: "Postgres lock-table > 70% saturated (P3)"
          description: |
            Lock-table utilisation is {{ $value | humanizePercentage }}.
            The next sustained ingest spike risks SQLSTATE 53200
            ("out of shared memory") and dropped INSERTs — the
            2026-05-06 SEV-3 class. Bump
            `postgres_max_locks_per_transaction` in the archival-node
            role and reapply.

      - alert: stellarindex_timescale_disk_full
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"} /
           node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"}) * 100 < 10
        for: 1m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/db-disk-full.md
          summary: "Postgres disk {{ $value | humanize }}% free (SEV-1)"
          description: |
            Postgres data volume on {{ $labels.instance }} has < 10 % free.
            WAL will refuse to write once full, halting all writes. Act now.

      - alert: stellarindex_timescale_disk_warning
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"} /
           node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"}) * 100 < 20
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/db-disk-full.md
          summary: "Postgres disk {{ $value | humanize }}% free"
          description: |
            Postgres data volume on {{ $labels.instance }} under 20 %. Plan
            retention tuning / vacuum / compression policy review. Hard page
            fires at 10 %.

      # Root filesystem (/) — distinct from /var/lib/postgresql
      # which has its own ZFS dataset with separate space.
      # Caught the 2026-05-10 outage retrospectively: root FS hit
      # 100 % from log accumulation before any existing alert
      # fired. Without this rule the operator sees the symptom
      # downstream (Redis MISCONF → /v1/price 404s) rather than
      # the cause.
      - alert: stellarindex_node_root_disk_full
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} /
           node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 1m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/redis-write-blocked-disk-full.md
          summary: "Root filesystem on {{ $labels.instance }} {{ $value | humanize }}% free (SEV-1)"
          description: |
            Root FS (/) under 10 % free on {{ $labels.instance }}.
            Redis can't snapshot once full; with the default
            stop-writes-on-bgsave-error=yes that blocks every cache
            write, blocking aggregator VWAP refresh, surfacing as
            `/v1/price` 404s on rewritten / triangulated /
            stablecoin-proxy pairs (incident 2026-05-10).

      - alert: stellarindex_node_root_disk_warning
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} /
           node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/redis-write-blocked-disk-full.md
          summary: "Root filesystem on {{ $labels.instance }} {{ $value | humanize }}% free"
          description: |
            Root FS (/) under 20 % on {{ $labels.instance }}.
            Investigate /var/log + /tmp + /var/cache before this
            grows into the page-tier alert.

      # Fast-fill predictor — the static thresholds above fire when
      # the line is ALREADY crossed; the 2026-06-11 CH log-wedge loop
      # filled root at ~3.8 GB/min, going from healthy to full in
      # ~5 min — faster than a human can act on a <10% page. This
      # fires while there is still time: root trending to FULL within
      # 30 min. The avail<50% guard keeps meaningless trends on a
      # roomy disk from paging.
      - alert: stellarindex_node_root_disk_filling_fast
        expr: |
          (
            predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[10m], 1800) < 0
          and
            (node_filesystem_avail_bytes{mountpoint="/"} /
             node_filesystem_size_bytes{mountpoint="/"}) < 0.5
          )
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/node-root-disk-filling-fast.md
          summary: "Root filesystem on {{ $labels.instance }} trending to FULL within 30 min"
          description: |
            Root FS (/) on {{ $labels.instance }} is filling fast enough
            to reach 0 bytes within 30 minutes (10m linear trend). This
            is the log-flood signature (2026-05-10 / 2026-05-13 /
            2026-06-11 class): find the writer NOW —
            `du -xs /var/log/* /tmp | sort -rh | head` — and see the
            runbook for the CH log-wedge kill sequence.

      # Guard-config liveness — born 2026-07-03: the 2026-06-11
      # incident's rsyslog suppression was codified in ansible but
      # NEVER applied to r1 (recorded as fixed), and live-only hand
      # fixes existed that an ansible render would erase. Ansible does
      # not auto-run against r1, so neither direction self-heals;
      # config-assertions.sh (hourly timer) checks the load-bearing
      # files' CONTENT and this pages the gap within ~2h.
      - alert: stellarindex_config_assertion_failed
        expr: stellarindex_config_assertion_ok == 0
        for: 65m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/config-assertion-failed.md
          summary: "Guard config {{ $labels.assertion }} is missing or reverted on {{ $labels.instance }}"
          description: |
            config-assertions.sh found {{ $labels.assertion }} absent or
            content-reverted for two consecutive hourly runs. Each
            assertion is a load-bearing incident fix (root-fill loop
            guards, public-edge firewall, redis cap, CS-010 supply
            config). See the runbook for the per-assertion restore
            recipe and docs/operations/r1-ansible-drift-2026-07-03.md
            for why this class exists.

      - alert: stellarindex_config_assertions_stale
        # Detects the checker itself going silent by watching the textfile's
        # mtime, NOT time()-timestamp(config_assertion_ok): a dead checker's
        # stale .prom is still re-scraped every interval, so timestamp() (the
        # SAMPLE's scrape time) stays ≈now and the old form never fired
        # (W5-mon). node_textfile_mtime_seconds reflects the file's real mtime
        # and stops advancing the moment the timer stops rewriting it.
        expr: time() - node_textfile_mtime_seconds{file="config_assertions.prom"} > 7200
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/config-assertion-failed.md
          summary: "config-assertions has not run for 2h on {{ $labels.instance }}"
          description: |
            The hourly config-assertions.timer is not producing fresh
            textfile output — a silent checker is the same class of
            failure the checker exists to catch. systemctl status
            config-assertions.timer.

      # Redis BGSAVE health — when Redis can't snapshot to disk
      # (typically because the volume backing /var/lib/redis is
      # full) it sets stop-writes-on-bgsave-error and rejects
      # every SET. The aggregator's VWAP cache writes start
      # failing for every pair. Catches the same incident shape
      # as the root-disk alert above from a different angle:
      # the disk could be on a separate mount, or the failure
      # could be caused by something other than disk space
      # (permissions, fork failure on memory pressure).
      - alert: stellarindex_redis_writes_blocked
        expr: redis_rdb_last_bgsave_status == 0
        for: 1m
        labels:
          severity: page
          team: stellarindex
          component: cache
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/redis-write-blocked-disk-full.md
          summary: "Redis BGSAVE failing on {{ $labels.instance }} (SEV-1) — writes blocked"
          description: |
            Redis BGSAVE on {{ $labels.instance }} has been failing
            for 1+ minute. With the default
            stop-writes-on-bgsave-error=yes, every Redis write is
            being rejected — aggregator VWAP cache stops refreshing,
            `/v1/price` 404s on rewritten/triangulated/proxy pairs
            (incident 2026-05-10). Free disk on the Redis volume
            (typically `/`), then `redis-cli BGSAVE` to clear the
            stop-writes block.

      - alert: stellarindex_timescale_connections_saturated
        expr: |
          (sum by (instance) (pg_stat_activity_count) / on (instance)
           pg_settings_max_connections) * 100 > 80
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/pg-conns-saturated.md
          summary: "Postgres connection pool {{ $value | humanize }}% used"
          description: |
            > 80 % of max_connections in use for 5+ minutes. PgBouncer should
            be smoothing this; check that the pool is healthy + sized right.

      # ── WAS INERT (F-1329) — NOW PRODUCED ─────────────────────────
      # The two TimescaleDB-internal alerts below describe job-scheduler
      # state (timescaledb_information.job_stats / .chunks) that
      # postgres_exporter's default queries do not cover, so their
      # metrics had no producer and the rules could not fire:
      #   - stellarindex_cagg_last_refresh_unix /
      #     stellarindex_cagg_refresh_interval_seconds (cagg-stale)
      #   - stellarindex_timescale_chunks_overdue_compression
      #     (compression-lag)
      #
      # The timescale-jobs-probe timer (archival-node role,
      # 10-observability.yml) now queries those views every minute and
      # writes them to the node_exporter textfile collector, and
      # lint-metric-refs.sh reads the inline ansible `content:` blocks
      # via ANSIBLE_TASK_PATHS — so neither metric is parked in that
      # lint's KNOWN_INERT any more. Both are live series.
      - alert: stellarindex_timescale_cagg_stale
        # Producer: timescale-jobs-probe.timer (every 60s). The probe
        # interval is deliberately well inside this rule's 5x-of-30s
        # (=150s) tightest threshold, so the freshness metric cannot age
        # past the window it is used to judge and self-trigger.
        expr: |
          (time() - stellarindex_cagg_last_refresh_unix) > 5 * stellarindex_cagg_refresh_interval_seconds
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/cagg-stale.md
          summary: "Continuous aggregate {{ $labels.cagg }} hasn't refreshed"
          description: |
            Refresh for {{ $labels.cagg }} is 5× its configured interval
            overdue. API reads from this CAGG will return stale data until it
            refreshes; check timescaledb job-scheduler health.

      - alert: stellarindex_timescale_job_failures_climbing
        # Producer: timescale-jobs-probe.timer (every 60s), same probe as
        # the two alerts above.
        #
        # This counter was added BECAUSE nothing surfaced the failure it
        # measures: r1 was silently failing 37-69% of every CAGG refresh
        # run with "failed to start job" (background-worker starvation).
        # The jobs got a slot on a later tick, so last_run_status read
        # Success and the caggs were never stale — _cagg_stale and
        # _compression_lag both stayed quiet, and the only evidence was
        # this counter. Which no rule referenced, so the evidence was
        # collected and never acted on (wave-D ALERT-12).
        #
        # Informational, not ticket: TimescaleDB retries a failed job on
        # the next tick, so isolated failures are normal operation and
        # the CAGG-staleness ticket above is the real customer-impact
        # signal. What this catches is the SHAPE that hid the incident —
        # failures accumulating steadily while everything downstream
        # looks healthy.
        #
        # increase() over 6h rather than a rate threshold: the counter is
        # per-job cumulative and jobs run on minute-scale intervals, so a
        # meaningful burst is "more than a handful in a long window", not
        # a per-second rate.
        expr: increase(stellarindex_timescale_job_failures_total[6h]) > 10
        for: 30m
        labels:
          severity: informational
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale-job-failures-climbing.md
          summary: "TimescaleDB job {{ $labels.proc }} failing repeatedly ({{ $labels.hypertable }})"
          description: |
            Job {{ $labels.job_id }} ({{ $labels.proc }} on
            {{ $labels.hypertable }}) has accumulated more than 10 failed runs
            in 6 hours. TimescaleDB retries on the next tick, so the caggs may
            look fresh and no staleness ticket will fire — that is exactly how
            the 2026 background-worker starvation stayed invisible.

            Check max_parallel_workers / timescaledb.max_background_workers
            headroom first; "failed to start job" in the job_errors view means
            starvation, not a broken job body.

      # Judged against each policy's OWN window, per hypertable.
      #
      # The metric this replaced counted every uncompressed chunk older
      # than a hardcoded 7 days on any hypertable that had a compression
      # policy — one scalar, one interval, 46 policies. Two false shapes
      # came out of that, both measured on r1 2026-09-05:
      #
      #   1. `compress_after` is per-policy, not 7 days. fx_quotes is
      #      90 days, aquarius_admin and defindex_fees are 30. Their
      #      8-to-89-day-old chunks are uncompressed BY DESIGN, and the
      #      old metric called every one of them lag. The runbook carried
      #      that as a "known false-positive pattern" rather than a bug.
      #   2. A policy only compresses on its scheduled tick, and every
      #      policy here runs on a 12h `schedule_interval`. A chunk that
      #      crossed compress_after ten minutes ago is not behind, it is
      #      queued. The old metric was a daily sawtooth: 2-28 at 00:00
      #      as day-chunks crossed the line, back to 0 by ~10:00 once the
      #      policies ran. The alert sat PENDING for a third of every day
      #      and its 24h `for:` was all that kept it from firing.
      #
      # So the producer now subtracts the policy's own compress_after AND
      # its schedule_interval before counting, and labels by hypertable.
      # A chunk counted here is one the policy said it would have
      # compressed by now and has not. `for: 24h` on top of the 12h
      # schedule grace means two full missed ticks before this speaks.
      #
      # NOT this alert's job: a hypertable with NO compression policy at
      # all (the pools_per_source_1h and prices_1m materialisations, 92 GB
      # and 52 GB uncompressed) — a missing policy is
      # `compression_policies_applied` in scripts/ops/config-assertions.sh,
      # surfaced by stellarindex_config_assertion_failed. Counting
      # policy-less chunks here is what made the old number look like a
      # 384-chunk backlog when nothing was ever going to compress them.
      - alert: stellarindex_timescale_compression_lag
        # Producer: timescale-jobs-probe.timer (every 60s).
        expr: stellarindex_timescale_chunks_overdue_compression > 0
        for: 24h
        labels:
          severity: informational
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/compression-lag.md
          summary: "{{ $labels.hypertable }}: {{ $value }} chunks past their compression policy's own window"
          description: |
            Chunks on {{ $labels.hypertable }} are still uncompressed more than
            one full schedule_interval after that hypertable's own
            compress_after elapsed, and have been for 24 h. The policy is not
            keeping up: check the job scheduler, then locks and IO.

      # ── The probe's own health (monitoring of monitoring) ─────────
      #
      # The three alerts above all read one file,
      # /var/lib/node_exporter/textfile_collector/timescale_jobs.prom,
      # written every 60 s by timescale-jobs-probe.timer. Until this
      # alert existed, every way that producer could fail was silent:
      #
      #   - Its psql helper ended in `|| true`, so a failing query
      #     returned an empty result AND exit 0. The file was rewritten
      #     without that query's families, node_exporter served it, and
      #     the alerts built on them evaluated over an absent series.
      #     `>` and `time() - x` over an empty vector are empty, so none
      #     of them can fire on the runs they exist for.
      #   - A query that exits 0 but returns NO ROWS drops the same
      #     series without erroring at all — the compression family is
      #     specifically designed to emit a row per policy including
      #     zeros, so zero rows there IS the blind state.
      #   - The script not running leaves node_exporter serving the LAST
      #     file forever: present, re-scraped every interval with a
      #     fresh sample timestamp, and frozen. This is the shape
      #     stellarindex_config_assertions_stale was written for
      #     (W5-mon) — `timestamp()` on the sample cannot see it.
      #
      # So the producer now publishes its own state on every run and
      # this alert reads it. Four arms, one per failure shape:
      # a query that errored, a query that returned nothing, a file that
      # has stopped being rewritten, and a file that was never written.
      #
      # `ticket`, not `page`: the loudest thing downstream of this file
      # is stellarindex_timescale_cagg_stale, itself a ticket, and the
      # other two are informational. A blindness alert louder than
      # everything it protects trains people to ignore it. `ticket` is
      # also what stellarindex_config_assertions_stale carries for the
      # identical class, and it is the quietest severity that is
      # DELIVERED at all — `informational` routes to `receiver: silent`,
      # so filing this one there would reproduce the defect it closes.
      #
      # 600 s = ten missed ticks on a 60 s timer, plus `for: 15m`, so a
      # postgres restart or one slow run (TimeoutStartSec=60) cannot
      # trip it. The absent arm's 30 m window is longer than the
      # threshold so the two cannot flap against each other.
      #
      # Known limitation, stated rather than hidden: the absent arm is
      # fleet-global, so in the multi-host tree one host still writing
      # the file would mask a second host that never has. The other
      # three arms are per-instance and cover every host that has EVER
      # written it; the anchor series that would make the absent arm
      # per-host (`up{job="node_exporter"} == 1 unless on (instance) …`,
      # the stellarindex_pgbackrest_backup_metrics_absent shape) is
      # wrong here because node_exporter is scraped on every host in the
      # inventory and only archival nodes run this probe.
      - alert: stellarindex_timescale_probe_degraded
        expr: |
          stellarindex_timescale_probe_query_ok == 0
          or
          stellarindex_timescale_probe_rows == 0
          or
          (time() - stellarindex_timescale_probe_last_run_unix) > 600
          or
          absent_over_time(stellarindex_timescale_probe_last_run_unix[30m])
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/timescale-probe-degraded.md
          summary: "TimescaleDB job/CAGG probe is not producing usable metrics{{ if $labels.query }} ({{ $labels.query }}){{ end }}"
          description: |
            timescale-jobs-probe.timer is not producing a usable
            timescale_jobs.prom, so stellarindex_timescale_cagg_stale,
            _compression_lag and _job_failures_climbing are evaluating over
            series that are absent or frozen and cannot fire. Silence from
            those three currently means nothing either way.

            Which arm tripped says where to look. query_ok == 0 is a query
            that errored — psql, peer auth, or a renamed timescaledb_information
            view. rows == 0 is a query that succeeded and returned nothing,
            which drops exactly the same series without raising an error.
            A last_run_unix older than 10 min, or absent, is the script or its
            timer not running: node_exporter keeps serving the last file it
            saw, so the metrics stay present and stop moving.

            Start with `systemctl status timescale-jobs-probe.timer` and the
            file's mtime, then run /usr/local/sbin/timescale-jobs-probe.sh by
            hand.

      # F-1329: repointed off the never-emitted
      # `stellarindex_pgbackrest_last_success_unix` /
      # `stellarindex_pgbackrest_expected_interval_seconds` pair (note the
      # bogus `stellarindex_` prefix — the SCRAPED exporter is woblerr's
      # pgbackrest_exporter, job `pgbackrest_exporter`, which emits
      # `pgbackrest_*`). The exporter computes
      # `pgbackrest_backup_since_last_completion_seconds` server-side as
      # (now - last_backup_stop_time), one series per backup_type
      # {full,diff,incr} per stanza — so it IS already "seconds since",
      # no time()-subtraction. We take `min by (stanza)` so the freshest
      # backup of ANY type satisfies the alert, and exclude the exporter's
      # aggregate pseudo-stanzas so a per-stanza failure can't be masked.
      # Backups can now page if they silently stop (the F-1329 gap).
      - alert: stellarindex_timescale_backup_failed
        expr: |
          min by (stanza) (
            pgbackrest_backup_since_last_completion_seconds{stanza!~"all-stanzas.*"}
          ) > 25 * 3600
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/backup-failed.md
          summary: "pgBackRest stanza {{ $labels.stanza }} last backup {{ $value | humanizeDuration }} ago"
          description: |
            Backup has missed at least one expected daily cycle (no completed
            full/diff/incr in > 25 h). Check pgBackRest logs + MinIO connectivity.

      - alert: stellarindex_timescale_backup_none_24h
        expr: |
          min by (stanza) (
            pgbackrest_backup_since_last_completion_seconds{stanza!~"all-stanzas.*"}
          ) > 24 * 3600
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/backup-failed.md
          summary: "No successful Postgres backup in > 24 h (SEV-1)"
          description: |
            RPO breach. At 24h+ without a backup we exceed the documented
            5-min RPO target by 288×. Escalate immediately.

      # backup-restore-1 (audit 2026-08-28): both alerts above are
      # `min by (stanza)(...) > N` — over an EMPTY vector that is empty,
      # so an exporter that is UP but has no stanza to report (pgbackrest
      # not installed → unit exits 127; the exporter user cannot read
      # pgbackrest.conf / the repo; `pgbackrest info` errors) silences
      # the SEV-1 page for as long as it lasts. The only backstop,
      # meta.yml stellarindex_pgbackrest_exporter_down, checks `up`
      # alone — the F-0085 cascade-blindness class, one layer down.
      # This alert closes it: every up==1 exporter target that has no
      # real-stanza backup series pages. Per-instance (`unless on
      # (instance)`) rather than a bare absent() so a healthy host can
      # never mask a blind one in the multi-host tree, and gated on
      # up==1 so a DOWN exporter is paged once (by exporter_down), not
      # twice. `for: 15m` covers the exporter's --collect.interval=600
      # after a restart. The all-stanzas* pseudo-stanza is excluded for
      # the same reason the alerts above exclude it.
      - alert: stellarindex_pgbackrest_backup_metrics_absent
        expr: |
          up{job="pgbackrest_exporter"} == 1
          unless on (instance)
          pgbackrest_backup_since_last_completion_seconds{stanza!~"all-stanzas.*"}
        for: 15m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/backup-failed.md
          summary: "pgbackrest_exporter on {{ $labels.instance }} is up but reports no stanza — backup alerts are blind"
          description: |
            The exporter answers scrapes (up == 1) but has emitted no
            pgbackrest_backup_since_last_completion_seconds for a
            real stanza for 15+ min. `stellarindex_timescale_backup_failed`
            and `_backup_none_24h` are `min by (stanza)(...) > N`
            over that series: with it absent they evaluate to an
            empty vector and CANNOT fire, so a backup that stopped
            would never page. Usual causes: pgbackrest not installed
            on this host (the unit exits 127), the exporter user
            cannot read /etc/pgbackrest/pgbackrest.conf or the repo,
            or `pgbackrest info` errors on the stanza. Run
            `sudo -u pgbackrest_exporter pgbackrest --stanza=stellarindex info`
            and `curl -s localhost:9854/metrics | grep pgbackrest_backup_since`.

      # The causal, early signal for the same class: the nightly unit
      # itself failed (exit 127 when pgbackrest is absent, or any
      # backup error). Same shape as verify-archive.yml's unit_failed;
      # node_exporter runs with --collector.systemd (10-observability).
      - alert: stellarindex_pgbackrest_backup_unit_failed
        expr: |
          node_systemd_unit_state{
            name="pgbackrest-backup.service",
            state="failed"
          } == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/backup-failed.md
          summary: "pgbackrest-backup.service failed on {{ $labels.instance }}"
          description: |
            The nightly pgBackRest unit exited non-zero. The freshness
            alerts catch this ~24 h later (or never, if the exporter has
            no stanza to report); this is the early, causal signal.
            `journalctl -u pgbackrest-backup.service -n 100`.

      # ─── ClickHouse lake protection (ADR-0043 §2.1) ──────────────
      # The lake has no data backup BY DESIGN — ADR-0043 rejects a
      # multi-TiB third copy of derived data because the raw ledgers
      # already exist in two independent archives. What it protects
      # instead is the metadata: SHOW CREATE for every stellar.* table,
      # the partition/settings inventory, and the ch-backfill cursor
      # state, dumped daily by ch-schema-snapshot.timer (megabytes).
      #
      # That makes the SNAPSHOT'S OWN FRESHNESS load-bearing: if it
      # stops, the lake is protected by a schema that drifts further
      # from reality every day an index, MV or compression policy
      # lands — and nobody finds out until a rebuild reproduces the
      # wrong ORDER BY. Backups that silently stopped is the exact
      # failure class ADR-0043 exists for, so the ADR's own backup
      # gets the same paging discipline as pgBackRest's.
      #
      # Emitted by scripts/ops/ch-schema-snapshot.sh into the
      # node_exporter textfile collector. Deliberately NOT stamped on
      # a partial capture, so a half-written schema reads as stale
      # rather than fresh.
      #
      # absent_over_time branch (OBS-2 pattern, restore-drill.yml;
      # backup-restore-2, audit 2026-08-28): because the script
      # rewrites the textfile WITHOUT the stamp on a partial run, and
      # exits before writing it at all on a first-run failure, the
      # never-succeeded / every-run-failed / host-rebuilt cases make
      # the series ABSENT, not old. `time() - x` over an empty vector
      # is empty and could never fire on exactly the runs it exists
      # for; absent_over_time(...[36h]) restores that coverage.
      - alert: stellarindex_ch_schema_snapshot_stale
        expr: |
          (time() - stellarindex_ch_schema_snapshot_last_success_unix) > 36 * 3600
          or
          absent_over_time(stellarindex_ch_schema_snapshot_last_success_unix[36h])
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-schema-restore.md
          summary: "ClickHouse schema snapshot has recorded no full capture in > 36 h (daily timer)"
          description: |
            ch-schema-snapshot.timer (daily, 03:40 UTC) has not
            completed a full capture in over 36 h — one missed cycle
            plus slack — or has never completed one. The ClickHouse
            lake's ONLY backup is this metadata copy (ADR-0043 §2.1);
            while it is stale, every DDL change since the last good
            snapshot is unprotected and a re-derive would rebuild
            against a schema that no longer matches production.
            The script stamps last_success ONLY on a clean run and
            rewrites the textfile each run, so every-run-failed /
            never-ran shows up as an ABSENT series, not an old one —
            both shapes fire this alert.
            Check `systemctl status ch-schema-snapshot.service` and
            run `/usr/local/bin/ch-schema-snapshot.sh` by hand — it
            refuses to write an empty or partial snapshot, so a
            failure here usually means ClickHouse was unreachable or a
            SHOW CREATE errored.

      # The offsite stamp is only emitted once an offsite target is
      # configured AND a push has succeeded — so, as above, a push that
      # has NEVER succeeded is an absent series and the `time() - x`
      # branch alone can never fire.
      #
      # The absent branch USED TO be gated on
      # `stellarindex_ch_schema_snapshot_offsite_configured == 1`, on
      # the reasoning that a host which acknowledged local-only should
      # not be nagged. That gate made the alert's own precondition the
      # thing it could not report: r1 has never had SNAPSHOT_MC_TARGET
      # set, so the gauge reads 0 and the loudest possible state —
      # the lake's ONLY DDL copy living on the pool it protects, with
      # no off-site copy anywhere — was the one state that stayed
      # silent. It is also not a survivable gap: ADR-0043's restore is
      # schema-FIRST, so in total-site-loss Postgres comes back from S3
      # and the lake's schema exists nowhere. Ungated: a never-configured
      # off-site is now exactly as loud as a broken one.
      #
      # PER HOST, not fleet-global. A bare absent_over_time(offsite[72h])
      # is one boolean for the whole scrape: any host pushing off-site
      # would have made every other host's missing copy invisible —
      # promtool-proven silent for a second instance with no stamp while
      # the first stamped hourly. The second arm instead takes every
      # host that HAS a local snapshot (last_success_unix — the only
      # series a host with a working snapshot always carries) and drops
      # the ones that have pushed off-site inside the window; what is
      # left is exactly the hosts whose only copy is local, each named
      # by its own instance label. A host whose snapshot itself is
      # failing has no last_success_unix and is owned by _stale above,
      # not double-reported here. The role (18-pgbackrest-backup.yml)
      # refuses the backup surface on pubnet without a target and
      # reports it on every full run; the alert is the standing signal
      # and the only way to clear it is to have a copy.
      - alert: stellarindex_ch_schema_snapshot_offsite_stale
        expr: |
          (time() - stellarindex_ch_schema_snapshot_offsite_last_success_unix) > 72 * 3600
          or
          (
            stellarindex_ch_schema_snapshot_last_success_unix
            unless on (instance)
            max_over_time(stellarindex_ch_schema_snapshot_offsite_last_success_unix[72h])
          )
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-schema-restore.md
          summary: "ClickHouse schema snapshot has not reached offsite storage in > 72 h"
          description: |
            The daily schema snapshot is not reaching off-site storage —
            the push has been failing for 3+ days, or no off-site target
            has ever been configured on this host. Either way the only
            copy of the lake's DDL lives on the same pool as the lake
            (CS-111's failure shape, one layer down), and ADR-0043's
            restore is schema-first, so a pool loss makes the re-derive
            archaeology rather than a procedure.
            `stellarindex_ch_schema_snapshot_offsite_configured` tells
            the two apart: 0 = never configured (set
            ch_schema_snapshot_mc_target and re-apply the role), 1 =
            configured but pushing — check the `mc` alias/credentials
            and the remote's quota.

      # Causal, early signal for both snapshot alerts above (same shape
      # as pgbackrest_backup_unit_failed): the unit is Type=oneshot with
      # no OnFailure, so a failed run otherwise surfaces only 36 h later.
      - alert: stellarindex_ch_schema_snapshot_unit_failed
        expr: |
          node_systemd_unit_state{
            name="ch-schema-snapshot.service",
            state="failed"
          } == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ch-schema-restore.md
          summary: "ch-schema-snapshot.service failed on {{ $labels.instance }}"
          description: |
            The daily ClickHouse schema-snapshot unit exited non-zero
            (exit 1 = nothing usable written, exit 2 = written but the
            offsite push failed). The staleness alerts catch the
            consequence 36 h / 72 h later; this is the causal signal.
            `journalctl -u ch-schema-snapshot.service -n 50`.

      # NVMe wear + media health. r1's NVMe is not swappable on demand,
      # so these exist to give a long lead time rather than to catch a
      # failure in progress. Produced by the packaged nvme collector,
      # redirected into the read textfile dir by the archival-node role
      # (10-observability.yml) — before that redirect these series did
      # not exist despite being generated every 5 minutes.
      - alert: stellarindex_nvme_wear_high
        expr: nvme_percentage_used_ratio > 0.80
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/nvme-smart.md
          summary: "NVMe {{ $labels.device }} at {{ $value | humanizePercentage }} rated write endurance"
          description: |
            Rated endurance consumed on {{ $labels.device }}. Not urgent at
            80%, deliberately: replacing a drive here is a planned
            operation, so this is a procurement trigger, not an incident.

      - alert: stellarindex_nvme_spare_low
        expr: nvme_available_spare_ratio < 0.20
        for: 30m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/nvme-smart.md
          summary: "NVMe {{ $labels.device }} spare blocks down to {{ $value | humanizePercentage }}"
          description: |
            The drive is consuming its reserve block pool, which is a
            late-stage wear signal — unlike percentage_used this one moves
            shortly before failure.

      - alert: stellarindex_nvme_media_errors
        expr: increase(nvme_media_errors_total[24h]) > 0
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/nvme-smart.md
          summary: "NVMe {{ $labels.device }} reported {{ $value }} new media errors in 24h"
          description: |
            Uncorrected media errors on a ZFS member. ZFS will surface
            corruption on scrub, but the drive reporting them first is the
            earlier signal.

      # #371 F2: ClickHouse is the only dependency on r1 with no
      # Prometheus exporter of its own — postgres, redis and minio each
      # have one. It is also the raw lake the ADR-0033 completeness
      # claim rests on, so before this alert existed its disappearance
      # had no single symptom: endpoints would simply start failing.
      #
      # The signal is the API's OWN readiness check, published as a
      # gauge (#371). That is deliberately better than a sidecar
      # exporter here: it measures whether the API can actually reach
      # ClickHouse, which is the thing that matters, rather than whether
      # a separate process can.
      #
      # `== 0` and not `absent()`: the gauge is published for every
      # check on every readiness round, including failing ones, so a
      # zero is a real answer. Alerting on absence would fire whenever a
      # check is renamed or the API is briefly down — which the
      # api-down alert already covers.
      - alert: stellarindex_dependency_down
        expr: stellarindex_dependency_up == 0
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: storage
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/dependency-down.md
          summary: "API dependency {{ $labels.dependency }} is unreachable"
          description: |
            The API's /v1/readyz check for {{ $labels.dependency }} has been
            failing for 2+ minutes on {{ $labels.instance }}.

            For clickhouse this is the raw lake (ADR-0034): ingest writes and
            every projector read go through it, and it has no exporter of its
            own, so this gauge is the only signal that it is gone.

            For postgres/redis the dedicated exporter alerts fire alongside
            this one and carry more detail — treat those as primary and this
            as corroboration.
