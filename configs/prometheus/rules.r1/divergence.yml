---
# Price-quality alerts — cross-source divergence detection +
# oracle-staleness. These are "data correctness" signals, not
# infrastructure — but they escalate as P2 when the numbers are bad.

groups:
  - name: stellarindex.divergence
    interval: 60s
    rules:

      # ── INERT (F-1329) — NO PRODUCER ──────────────────────────────
      # The two price-divergence alerts below reference
      # `stellarindex_our_price` / `stellarindex_reference_price` as
      # Prometheus gauges. NOTHING EXPORTS THESE AS METRICS. The
      # divergence worker (internal/divergence/worker.go) computes
      # our_price / ref_price / delta_pct but writes them to Postgres
      # (divergence_observations) + the Redis div:<asset> cache and
      # surfaces them via the API's `flags.divergence_warning` — not via
      # the Prometheus registry. The LIVE Prometheus signal for the same
      # failure is `stellarindex_divergence_refresh_error_dominant` below,
      # which DOES use an emitted metric. Exposing a per-asset price gauge
      # would add high-cardinality series and is out of scope here. These
      # two rules are kept (the runbook + intent survive) but INERT and
      # TRACKED in scripts/ci/lint-metric-refs.sh's KNOWN_INERT list.
      - alert: stellarindex_price_divergence_warning
        # INERT: stellarindex_our_price / stellarindex_reference_price have no
        # Prometheus producer (divergence values live in PG + Redis, not the registry).
        expr: |
          abs(stellarindex_our_price - stellarindex_reference_price)
            / stellarindex_reference_price > 0.05
        for: 2m
        labels:
          severity: informational
          team: stellarindex
          component: divergence
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/price-divergence.md
          summary: "{{ $labels.asset }} {{ $value | humanizePercentage }} off reference"
          description: |
            Our aggregated price for {{ $labels.asset }} differs from reference
            ({{ $labels.reference_source }}) by > 5 % sustained 2 min.
            Normal during rapid market moves; investigate if sustained.

      - alert: stellarindex_price_divergence_critical
        # INERT: see the price_divergence_warning block above — no Prometheus
        # producer for stellarindex_our_price / stellarindex_reference_price.
        expr: |
          abs(stellarindex_our_price - stellarindex_reference_price)
            / stellarindex_reference_price > 0.10
        for: 2m
        labels:
          severity: ticket
          team: stellarindex
          component: divergence
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/price-divergence.md
          summary: "{{ $labels.asset }} {{ $value | humanizePercentage }} off reference (critical)"
          description: |
            Divergence > 10 % from reference sustained 2 min. This is usually
            a bad ingest (wrong decimals, stale source contributing) rather
            than a real market move.

      - alert: stellarindex_oracle_stream_rows_unparsed
        # Deliberately NOT pre-seeded, unlike the divergence outcome
        # counters. Seeding matters when a rule COMPARES two children of
        # one metric (an absent `ok` child makes the comparison empty —
        # wave-D ALERT-06) or DIVIDES by one (wave-D ALERT-04). This is a
        # bare threshold on a single series: it goes from absent to
        # present exactly when the bad thing happens, and increase()
        # reports a positive delta for a counter that appears mid-window.
        # Seeding it would add a permanent zero series for every oracle
        # source for no gain.
        expr: increase(stellarindex_oracle_stream_rows_unparsed_total[6h]) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: divergence
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-stream-rows-unparsed.md
          summary: "Oracle rows dropped from the served stream — unparseable {{ $labels.field }} ({{ $labels.source }})"
          description: |
            LatestOracleStreams could not parse the stored canonical
            `{{ $labels.field }}` text on one or more {{ $labels.source }}
            oracle_updates rows, so those rows are ABSENT from
            /v1/oracle/streams and the explorer's /oracles page.

            The likeliest cause is a hand-written relabel: the documented
            remediation for a mislabelled oracle row is an operator-run raw
            SQL UPDATE against this column, which carries no CHECK
            constraint. Before this alert existed, a typo there deleted the
            row from the served surface silently — the operator would watch
            it disappear and reasonably conclude the relabel had worked.

            Find them:
              SELECT DISTINCT source, asset, quote FROM oracle_updates
               WHERE source = '{{ $labels.source }}'
               ORDER BY 1,2,3;
            and compare against internal/canonical's accepted forms.

      - alert: stellarindex_oracle_stale
        # `ignoring(asset) group_left()`, not a bare comparison. The two
        # metrics carry DIFFERENT label sets — last_update_unix is
        # {source, asset}, resolution_seconds is {source} — and a
        # vector-to-vector op with no on()/ignoring() requires them to be
        # IDENTICAL. Without the join this alert matched nothing in
        # production and could never fire, for any oracle, ever
        # (wave-D ALERT-02). group_left keeps the per-asset cardinality
        # of the left side, so one silent asset still tickets.        #
        # IGNORING, not `on (source)`. `on` discards every label outside
        # the match group, including job/instance — so two scrape targets
        # exporting the same {source} make the right side non-unique and
        # the whole rule fails evaluation:
        #
        #   found duplicate series for the match group {source="…"} on the
        #   right hand-side of the operation — many-to-many matching not
        #   allowed
        #
        # That is not hypothetical: the prometheus job template builds
        # stellarindex_indexer by looping its host group, so a second
        # indexer host (R2, ADR-0004/ADR-0016) produces exactly that
        # shape. The rule would then not merely fail to fire — it would
        # error, which is the pre-fix silence plus noise.
        #
        # `ignoring(asset)` keeps job/instance in the match, so each
        # target pairs with its own resolution series and a multi-host
        # Prometheus yields one correct alert per instance.
        expr: |
          (time() - stellarindex_oracle_last_update_unix)
            > ignoring(asset) group_left() (10 * stellarindex_oracle_resolution_seconds)
        for: 2m
        labels:
          severity: ticket
          team: stellarindex
          component: divergence
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/oracle-stale.md
          summary: "Oracle {{ $labels.source }} stale for {{ $labels.asset }}"
          description: |
            {{ $labels.source }} hasn't published a price for {{ $labels.asset }}
            in > 10× its resolution. May be legitimate (oracle paused) or a
            signal of oracle failure — check the oracle's own status page.

      # Aggregator's divergence-cache refresh loop — `refresh_error`
      # outcome dominates the success rate. CoinGecko / Chainlink
      # unreachable, marshal failure, or Redis cache write failing.
      # Sustained means `flags.divergence_warning` goes stale across
      # the API surface (the cache TTL is 5 min — we have a few-tick
      # grace window before consumers see staleness).
      #
      # Threshold: `refresh_error` rate exceeds `ok` rate AND total
      # rate is non-zero (avoids firing during cold start when both
      # rates are 0). 30-min sustained is the trigger — shorter
      # windows catch transient blips that recover on their own.
      - alert: stellarindex_divergence_refresh_error_dominant
        expr: |
          sum(rate(stellarindex_divergence_refresh_total{outcome="refresh_error"}[5m]))
            >
          sum(rate(stellarindex_divergence_refresh_total{outcome="ok"}[5m]))
          and
          sum(rate(stellarindex_divergence_refresh_total{outcome=~"refresh_error|ok"}[5m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: divergence
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/divergence-refresh-error-dominant.md
          summary: "Divergence-cache refresh failing more often than succeeding (P3)"
          description: |
            More refresh_error outcomes than ok over the last 5 min for
            30+ min sustained. CoinGecko / Chainlink RPC reachability is
            the usual cause; the API's `flags.divergence_warning` stops
            updating and goes stale once the 5-min cache TTL elapses.
            Check the upstream reference's status, then the aggregator's
            `divergence refresher wired` startup log line for which
            references are configured.

      # CS-088: every configured reference went dark for a pair
      # (SuccessCount==0). RefreshPair now emits outcome="no_reference"
      # instead of masking it as "ok", so this alert can see the "silent
      # checker" case the error-dominant alert above cannot (no_reference is
      # neither refresh_error nor ok). flags.divergence_warning freezes at its
      # last value during the outage — a live depeg would go unflagged.
      - alert: stellarindex_divergence_no_reference
        expr: |
          sum(rate(stellarindex_divergence_refresh_total{outcome="no_reference"}[5m]))
            >
          sum(rate(stellarindex_divergence_refresh_total{outcome="ok"}[5m]))
          and
          sum(rate(stellarindex_divergence_refresh_total{outcome="no_reference"}[5m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: divergence
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/divergence-no-reference.md
          summary: "Divergence checker running blind — no reference responded (P3)"
          description: |
            For 30+ min more pairs received zero reference responses than got a
            healthy comparison. Every divergence reference (CoinGecko,
            Chainlink) is unreachable for those pairs, so
            flags.divergence_warning is frozen — a live depeg would go
            unflagged. Check the CoinGecko Pro key / 429 state and Chainlink
            RPC reachability; see the runbook.
