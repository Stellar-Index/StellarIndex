---
# Aggregator alerts; each has a runbook under docs/operations/runbooks/
# (catalog: docs/operations/alerts-catalog.md). Metrics:
# docs/reference/metrics/README.md.
# Thresholds weight false-positive risk highest; tune against pubnet runtime
# data.

groups:
  - name: stellarindex.aggregator
    interval: 30s
    rules:

      - alert: stellarindex_aggregator_silent
        expr: |
          sum(rate(stellarindex_aggregator_vwap_writes_total[5m])) == 0
          OR
          absent_over_time(stellarindex_aggregator_vwap_writes_total[10m]) == 1
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_silent
          summary: "Aggregator has stopped writing VWAP cache (P1)"
          description: |
            Zero VWAP writes for 5+ minutes. Either the orchestrator
            tick loop is wedged, the (pair, window) refresh path is
            consistently empty, or the Redis write is erroring on every
            attempt. VWAP keys expire cachekeys.VWAPMaxAge (5 min) after
            the last write, so /v1/price?window= has been answering 404
            for 5-10 minutes when this fires. /v1/vwap is unaffected (it
            scans raw trades on-query).
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_silent

      # Venue dispersion, not a dropped-trades counter: the whole-window
      # median+MAD band trims an AGREED regime shift (e.g. a genuine +2%
      # Kraken step) until it becomes the window majority, so a counter rule
      # fires for hours while venues agree and served prices are right. This
      # measures the spread between the highest and lowest per-VENUE VWAP of
      # the pre-filter 5m set (stellarindex_aggregator_venue_vwap; a venue
      # leaving the window has its series deleted).
      #
      # At least 2 venues required; SDEX-only pairs are covered by
      # outlier_trim_fraction below. 1% is about 3x the observed agreed-venue
      # spread; `for: 15m` clears a one-tick print. Covered by
      # rule-tests/aggregator_test.yml.
      - alert: stellarindex_aggregator_outlier_storm
        expr: |
          (
            max by (pair) (stellarindex_aggregator_venue_vwap{window="5m"})
            /
            min by (pair) (stellarindex_aggregator_venue_vwap{window="5m"})
            - 1
          ) > 0.01
          and on (pair)
          count by (pair) (stellarindex_aggregator_venue_vwap{window="5m"}) >= 2
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_outlier_storm
          summary: "{{ $labels.pair }} venues disagree >1% on the 5m VWAP for 15m — persistent price dispersion (P3)"
          description: |
            The highest and lowest per-venue 5m VWAP feeding
            {{ $labels.pair }} have differed by more than 1% for 15m+
            (stellarindex_aggregator_venue_vwap, the PRE-outlier-filter
            set). The published price is the robust, time-locally filtered
            VWAP across venues, so this is a data-quality / source-health
            signal, NOT a customer-facing price error: one venue is stale,
            thin, mis-decoding amounts, or a stablecoin leg is skewed.
            Find it with
            `stellarindex_aggregator_venue_vwap{pair="{{ $labels.pair }}",window="5m"}`
            — the odd one out is the venue to investigate. Check the pair's
            div:<pair> Redis flag / API flags.divergence_warning for actual
            price impact.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_outlier_storm

      # Covers what venue disagreement cannot see: a SINGLE-venue pair
      # (SDEX-only token, the token-farm shape) whose prints the outlier
      # filter rejects wholesale. window_trades is a per-refresh gauge
      # (stage=class is the filter input, stage=outlier its survivors), so the
      # fraction is the current window's trim share. The time-local filter
      # never trims an agreed move, so a sustained >20% share is real
      # dispersion (spam / wash / dust prints). 24h window: a spam wave lasts
      # hours and the 5m share flaps. Same runbook as outlier_storm.
      #
      # Proven on the token-farm fixture in
      # internal/aggregate/outliers_spam_test.go (1200 class prints, 720
      # survivors, a 40 % trim share); the promtool case below uses those two
      # values.
      - alert: stellarindex_aggregator_outlier_trim_fraction
        expr: |
          (
            1 -
            stellarindex_aggregator_window_trades{window="24h",stage="outlier"}
            / ignoring (stage)
            stellarindex_aggregator_window_trades{window="24h",stage="class"}
          ) > 0.2
          and ignoring (stage)
          stellarindex_aggregator_window_trades{window="24h",stage="class"} >= 20
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_outlier_trim_fraction
          summary: "{{ $labels.pair }} outlier filter rejecting >20% of the 24h window for 30m — in-window price dispersion (P3)"
          description: |
            More than 20% of {{ $labels.pair }}'s 24h VWAP input has been
            trimmed by the time-local outlier filter for 30m+
            (stellarindex_aggregator_window_trades, stage=outlier vs
            stage=class, ≥20 trades). The filter drops only prints that
            disagree with BOTH the window and their own neighbourhood, so
            this is not a regime shift being erased — it is a large share
            of wild prints inside the window: an SDEX spam / wash wave
            (2026-08-14 token-farm shape), a connector mis-decoding
            amounts, or a venue with dust-sized noise. The published price
            is protected by the trim; the risk is a thin surviving sample
            (see min_usd_volume gating). Diagnose from the trades table
            for the pair; see the spam-wave signature in the runbook.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_outlier_trim_fraction

      # The count share above cannot see WHICH prints were trimmed: the
      # outlier centre is a per-print median, so a few wash prints can outvote
      # one honest block and the filter withholds the window
      # (keepIfVolumeMajority), silently, on the short windows the 24h count
      # rule skips. This rule reads base VOLUME per stage on EVERY window:
      # >20% of traded money trimmed for 15m, 100% when withheld as contested.
      # Covered by rule-tests/aggregator_test.yml.
      - alert: stellarindex_aggregator_outlier_volume_trim_fraction
        expr: |
          (
            1 -
            stellarindex_aggregator_window_base_volume{stage="outlier"}
            / ignoring (stage)
            stellarindex_aggregator_window_base_volume{stage="class"}
          ) > 0.2
          and ignoring (stage)
          stellarindex_aggregator_window_base_volume{stage="class"} > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_outlier_volume_trim_fraction
          summary: "{{ $labels.pair }} outlier filter removing >20% of the {{ $labels.window }} window's volume for 15m (P3)"
          description: |
            The outlier filter has removed more than 20% of the base volume
            in {{ $labels.pair }}'s {{ $labels.window }} window for 15m+
            (stellarindex_aggregator_window_base_volume, stage=outlier vs
            stage=class). At 100% the window is withheld: a count majority
            of prints disagrees with the volume majority, the shape of wash
            prints set against an honest block, and no price is published
            for that window. Compare window_trades for the same window —
            many prints but little volume removed is dust; few prints and
            much volume is a large print outside the band. Diagnose from
            the trades table for the pair.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_outlier_volume_trim_fraction

      - alert: stellarindex_aggregator_fx_snap_fallback_dominant
        expr: |
          sum(rate(stellarindex_aggregator_fx_snap_fallback_total[15m]))
          /
          clamp_min(
            sum(rate(stellarindex_aggregator_triangulations_total{outcome="ok"}[15m])),
            1
          ) > 0.5
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_fx_snap_fallback_dominant
          summary: "FX snap fallback >50% of triangulations for 30m+ (P3)"
          description: |
            The X2.5 forex-factor-snap path is failing for more than
            half of triangulations — most chained-fiat rates are using
            the degraded cached-VWAP fallback instead of the bucket-end
            FX-source quote that ADR-0018 mandates for across-region
            consistency. Investigate FX ingestion: exchangeratesapi /
            exchangeratesapi connector health, and the trades hypertable's
            FX rows.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_fx_snap_fallback_dominant

      # ── Triangulation chains configured but their legs are dry ──
      #
      # The default chains (XLM/EUR, XLM/GBP, ETH/GBP, BTC/GBP) need the
      # fiat/fiat leg from the forex-snap path (fx_quotes, daily buckets,
      # 7-day lookback). If that feed goes dry every chain degrades to
      # `missing_leg` and the corroboration confidence factor silently weighs
      # nothing; direct prices keep serving.
      #
      # fx_snap_fallback_dominant cannot see this: its ratio is over
      # clamp_min(ok_rate, 1), so with ok pinned at zero it never reaches 0.5.
      #
      # Shape: missing_leg is being counted (chains are configured and
      # running) while ok is a hard zero for 30m. All five outcomes are
      # pre-seeded at zero in internal/obs, so `== 0` is a real zero, not a
      # gap. Aggregator down: both series absent, stays quiet
      # (stellarindex_aggregator_silent owns it). No chains configured:
      # missing_leg never increments, also quiet, correctly.
      - alert: stellarindex_aggregator_triangulation_chains_dry
        expr: |
          sum(rate(stellarindex_aggregator_triangulations_total{outcome="missing_leg"}[15m])) > 0
          and
          sum(rate(stellarindex_aggregator_triangulations_total{outcome="ok"}[15m])) == 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_triangulation_chains_dry
          summary: "Triangulation chains configured but legs dry — zero successful triangulations for 30m+ (P3)"
          description: |
            Every configured triangulation chain has been failing on a
            missing leg for 30+ minutes, with ZERO successful
            triangulations in that window. The composite-rate
            corroboration factor (triangulation_agreement, ADR-0019
            seventh factor) is therefore contributing nothing, and the
            thin-pair pairs it was built for (XLM/GBP, XLM/EUR, ETH/GBP)
            are back to single-source with no independent cross-check.
            Do NOT assume direct prices are unaffected. This annotation
            said so until 2026-08-04 and it is false in the REROUTE case:
            when a chain leg goes dry the router substitutes a
            crypto-pivot route and publishes the composite to
            cachekeys.VWAP(target) — the same key /v1/price serves. The
            substitution is reported as outcome="ok", so this alert's own
            `and ...{outcome="ok"} == 0` clause suppresses it precisely
            when a reroute is happening. Check the target's
            :provenance and :composite_meta keys before concluding the
            served price is direct.
            Most likely cause: the fiat-FX feed is dry, so the fiat cross
            leg has no fx_quotes row inside the 7-day lookback. Check
            stellarindex_external_fx_last_quote_unix per source, the
            massive worker in the API binary, then the chain config.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_triangulation_chains_dry

      # A released pair re-caps only once its 30-day bucket density falls
      # under the ADR-0019 hysteresis edge (27 days-equivalent). Several
      # re-capping within the same hour share a cause (gap in ingestion, the
      # aggregator, or prices_1m materialisation) and stay at 0.5 until
      # repaired or rolled out of the window. last_over_time reaches back up
      # to 2d over an outage to the pair's pre-gap state (the restart case).
      # Covered by rule-tests/aggregator_test.yml.
      - alert: stellarindex_aggregator_bootstrap_cap_reengaged
        expr: |
          count(
            (stellarindex_aggregator_bootstrap_capped == 1)
            and
            (last_over_time(stellarindex_aggregator_bootstrap_capped[2d] offset 1h) == 0)
          ) >= 3
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_bootstrap_cap_reengaged
          summary: "{{ $value }} pairs re-entered the bootstrap confidence cap within 1h (P3)"
          description: |
            {{ $value }} pairs whose last state before the past hour was
            released from the ADR-0019 bootstrap cap are capped at 0.5 again
            (stellarindex_aggregator_bootstrap_capped 0 -> 1): their 30-day
            1-minute bucket density fell below the density gate (27
            days-equivalent for a pair released since the aggregator started,
            28.5 after a restart). A
            simultaneous drop across pairs means a shared gap in the
            baseline window, not one thin pair. Served confidence stays at
            0.5 for them until the gap is repaired or rolls out of the
            30-day window.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_bootstrap_cap_reengaged

      - alert: stellarindex_aggregator_class_drop_spike
        expr: |
          sum(rate(stellarindex_aggregator_dropped_trades_total{reason="class"}[10m]))
            > 10 * sum(rate(stellarindex_aggregator_dropped_trades_total{reason="class"}[1h] offset 1h))
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_class_drop_spike
          summary: "Class-filter drop rate >10× baseline (P3)"
          description: |
            The class filter is dropping trades at >10× its baseline
            rate. Most common cause: a new venue connector emitting
            trades that aren't yet registered in
            internal/sources/external/registry.go (so they hit the
            fail-closed fallback IncludeInVWAP=false). Less common:
            an existing aggregator/oracle source unexpectedly
            increased volume.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_class_drop_spike

      # Aggregator cache-write-error rate. A Redis that cannot write (e.g.
      # root FS full blocking BGSAVE, every Set returning MISCONF) surfaces
      # only as customer 404s on rewritten pairs, because `flags.stale` is not
      # flipped: the aggregator is running, just unable to publish. Any
      # sustained non-zero rate means the customer surface is silently
      # degraded.
      - alert: stellarindex_aggregator_cache_write_errors
        expr: |
          sum(rate(stellarindex_aggregator_vwap_cache_write_errors_total[5m])) > 0
          or sum (
            stellarindex_aggregator_vwap_cache_write_errors_total
            unless max_over_time(stellarindex_aggregator_vwap_cache_write_errors_total[1d] offset 5m)
          ) > 0 and on() (time() - prometheus_tsdb_lowest_timestamp_seconds > 86700)
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_cache_write_errors
          summary: "Aggregator failing to publish VWAPs to Redis cache (P1)"
          description: |
            VWAP cache writes are erroring; rewritten / triangulated /
            stablecoin-proxy pairs on /v1/price are about to start
            returning 404 (or already are). Most common cause: Redis
            BGSAVE is failing because the root FS is full
            (stop-writes-on-bgsave-error=yes default — May-10 SEV-2
            class). Recovery: free disk → BGSAVE → cache rebuilds.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_aggregator_cache_write_errors

      # ── Protocol-events rollup worker ──
      #
      # protoeventsrollup folds the trailing-24h per-source event census into
      # protocol_events_24h. A sustained refresh-error rate leaves
      # /v1/protocols' events_24h stale, not blank; informational, no pricing
      # impact.
      - alert: stellarindex_protocol_events_rollup_failing
        expr: |
          sum(rate(stellarindex_protocol_events_rollup_sweeps_total{outcome="refresh_error"}[15m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_protocol_events_rollup_failing
          summary: "Protocol-events rollup sweeps failing ({{ $value | humanize }}/s error rate)"
          description: |
            The aggregator's protocol-events rollup worker has been
            failing its refresh (the trailing-24h census + upsert into
            protocol_events_24h) for 30+ minutes. /v1/protocols
            events_24h counters stop advancing (last-good values persist,
            not zeros). Customer pricing surface is unaffected. Fix the
            failing Postgres backend and the next sweep catches up.

      # ── Asset-volume rollup worker ──
      #
      # assetvolrollup folds the trailing-24h per-asset USD volume over
      # prices_1m into asset_volume_24h. A sustained refresh-error rate leaves
      # the /v1/assets volume_24h_usd stale, not blank; informational, no
      # pricing impact.
      - alert: stellarindex_asset_volume_rollup_failing
        expr: |
          sum(rate(stellarindex_asset_volume_rollup_sweeps_total{outcome="refresh_error"}[15m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_asset_volume_rollup_failing
          summary: "Asset-volume rollup sweeps failing ({{ $value | humanize }}/s error rate)"
          description: |
            The aggregator's asset-volume rollup worker has been failing
            its refresh (the trailing-24h prices_1m SUM + upsert into
            asset_volume_24h) for 30+ minutes. The /v1/assets listing's
            volume_24h_usd column stops advancing (last-good values
            persist, not zeros). Customer pricing surface is unaffected.
            Fix the failing Postgres backend and the next sweep catches up.

      # ── asset-volume-character rollup worker ──
      #
      # The worker sweeps every 6h (the roll scans the full 14-day trades
      # window), so the sibling alerts' 15m/for-30m shape could never fire:
      # one error leaves a ~15m rate blip. Fires instead on a refresh_error in
      # the last 13h with no ok sweep, i.e. two consecutive sweeps failed.
      # Analytics only.
      - alert: stellarindex_asset_character_rollup_failing
        expr: |
          sum(increase(stellarindex_asset_character_rollup_sweeps_total{outcome="refresh_error"}[13h])) > 0
            unless
          sum(increase(stellarindex_asset_character_rollup_sweeps_total{outcome="ok"}[13h])) > 0
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_asset_character_rollup_failing
          summary: "Asset-character rollup failing: errors with no successful sweep in 13h"
          description: |
            The aggregator's asset-volume-character rollup worker (6h
            cadence) has recorded refresh errors and no successful sweep
            in the last 13h. The volume_character label and signals on
            /v1/assets and /v1/assets/{id} stop advancing (last-good
            rows persist, not blank). Pricing, verification and the raw
            volume_24h_usd are unaffected. Fix the failing Postgres
            backend; the next sweep catches up.

      # ── Decimals-assumption landmine ──
      #
      # The served price is Σ(quote_amount)/Σ(base_amount) on RAW
      # smallest-unit integers; decimals cancel ONLY when base and quote share
      # a scale (true while every DEX-traded token is 7-decimal). The
      # decimals-guard sweep (internal/decimalsguard) raises this counter the
      # first time a DEX trade is seen for a Soroban token whose decimals() !=
      # 7. Serving paths auto-normalize via the nonstandard_decimals_assets
      # table (aggregate.AdjustPrice / ResolveDecimals), so detection is an
      # awareness signal, not an action item; the real risk is the correction
      # not being applied
      # (stellarindex_nonstandard_decimals_correction_failing below).
      #
      # There is deliberately no "detected" alert: an all-time counter above
      # zero would fire forever once any nonstandard token trades.
      #
      # The `unless ... offset 15m` arms exist because increase() cannot see a
      # counter's FIRST increment (a series whose first sample is already 1
      # reads 0). That is the reachable shape for both counters here: the
      # refresh counter's startup failure lands before the metrics endpoint is
      # up, and the declined counter is an unseeded CounterVec whose `{asset}`
      # children are born on first use. Same idiom as backup-offsite.yml; it
      # ages out with the window, so a one-off blip resolves instead of
      # latching.
      - alert: stellarindex_nonstandard_decimals_correction_failing
        expr: |
          increase(stellarindex_nonstandard_decimals_cache_refresh_failures_total[15m]) > 0
          or
          increase(stellarindex_price_serve_declined_nonstandard_decimals_total[15m]) > 0
          or (
            stellarindex_nonstandard_decimals_cache_refresh_failures_total > 0
            unless stellarindex_nonstandard_decimals_cache_refresh_failures_total offset 15m
          )
          or (
            stellarindex_price_serve_declined_nonstandard_decimals_total > 0
            unless stellarindex_price_serve_declined_nonstandard_decimals_total offset 15m
          )
          or
          increase(stellarindex_nonstandard_decimals_lockstep_mismatch_total[15m]) > 0
          or (
            stellarindex_nonstandard_decimals_lockstep_mismatch_total > 0
            unless stellarindex_nonstandard_decimals_lockstep_mismatch_total offset 15m
          )
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_nonstandard_decimals_correction_failing
          summary: "Non-7-decimals correction sweep failing, serving declining, or decimals resolvers out of lockstep — tokens at risk of silent price skew (P2)"
          description: |
            Either the aggregator's nonstandard_decimals_assets
            refresh sweep is erroring
            (stellarindex_nonstandard_decimals_cache_refresh_failures_total),
            or a serving path is actively declining instead of
            normalizing (stellarindex_price_serve_declined_nonstandard_decimals_total),
            or the two decimals resolvers disagreed for an asset
            (stellarindex_nonstandard_decimals_lockstep_mismatch_total,
            labelled site=guard_reconcile when the aggregator repaired
            a drifted nonstandard_decimals_assets row toward the lake,
            site=asset_detail when GET /v1/assets/{id} refused a market
            cap because the lake and the projection disagreed at
            request time). When the refresh sweep fails, newly-detected
            non-7-decimal tokens don't get their nonstandard_decimals_assets
            correction entry seeded/refreshed, so their pairs revert
            to the raw, skewed ratio the retired
            stellarindex_dex_nonstandard_decimals_detected alert (removed
            2026-08-05, see above) used to flag — this alert is the
            genuine action item behind that risk now. Investigate
            the aggregator's
            decimals-guard component (internal/decimalsguard) and the
            nonstandard_decimals_assets table directly.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_nonstandard_decimals_correction_failing

      # ── Decimals-guard sweep heartbeat ──
      #
      # The offender counters above cannot tell "swept, found nothing" from
      # "guard never armed"; both read as a healthy zero. This is the backstop
      # for a wedge the lake-dial retry does not cover (goroutine panicking
      # past worker.Recover, lake lost for good;
      # cmd/stellarindex-aggregator/main.go). Sweep stamps
      # stellarindex_decimals_guard_sweep_last_success_unix on every pass and
      # the aggregator seeds it at start (decimalsguard.MarkEnabled), so a
      # cold boot is measured from process start and "never armed" fires on
      # the same budget as a wedge. A gauge at 0 means the guard is DISABLED
      # (lake-less config), not stale; the `> 0` arm avoids a permanent
      # ticket. Threshold is three sweep intervals (DefaultInterval = 15m, so
      # 45m) plus `for: 15m`. Scoped to job="stellarindex-aggregator" because
      # the indexer/api binaries register every gauge at its Go zero-value and
      # would hold the series at 0 and false-page (same trap as
      # stellarindex_priceless_coverage_check_stale in pricing-coverage.yml).
      - alert: stellarindex_decimals_guard_sweep_stale
        expr: |
          (time() - stellarindex_decimals_guard_sweep_last_success_unix{job="stellarindex-aggregator"}) > 2700
            and stellarindex_decimals_guard_sweep_last_success_unix{job="stellarindex-aggregator"} > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_decimals_guard_sweep_stale
          summary: "Decimals-guard sweep has not completed in over 45 min — guard health is unknown"
          description: |
            The aggregator's decimals-assumption guard
            (internal/decimalsguard) has not completed a Sweep pass in
            over 45 minutes (three sweep intervals) plus a 15-minute
            for-duration, counted from its last completed pass or, if it
            has never completed one, from aggregator start: either it
            never armed (the ClickHouse lake dial is still retrying or
            the startup Backfill is still running) or it has wedged.
            The offender counters
            (stellarindex_dex_trade_nonstandard_decimals_total,
            stellarindex_nonstandard_decimals_lockstep_mismatch_total)
            are now UNTRUSTWORTHY: a healthy zero and "the guard never
            armed" look identical without this heartbeat. Check the
            aggregator's `decimals-guard: ClickHouse decimals resolver
            unavailable` / `decimals-guard started` / `decimals-guard
            exited with error` log lines and ClickHouse reachability,
            then the runbook.

      # ── Customer-webhook FAN-OUT losing events ──
      #
      # Fires earlier than the two api.yml delivery alerts, which only count
      # once a `webhook_deliveries` row exists. Here the event fired and the
      # customer was subscribed but no delivery row was written, so nothing
      # can be retried and the event is permanently gone; hence a ticket on a
      # single occurrence.
      #
      # Producer is the AGGREGATOR (freeze + divergence paths);
      # `stellarindex-ops emit-incident` increments the same counter but is
      # unscraped and exits non-zero instead.
      - alert: stellarindex_customer_webhook_fanout_failing
        expr: |
          sum by (event_type, reason) (increase(stellarindex_customer_webhook_fanout_failures_total[1h])) > 0
          or sum by (event_type, reason) (
            stellarindex_customer_webhook_fanout_failures_total
            unless max_over_time(stellarindex_customer_webhook_fanout_failures_total[1d] offset 1h)
          ) > 0 and on() (time() - prometheus_tsdb_lowest_timestamp_seconds > 90000)
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_customer_webhook_fanout_failing
          summary: "Customer webhook fan-out lost {{ $value | humanize }} {{ $labels.event_type }} event(s) ({{ $labels.reason }})"
          description: |
            A customer subscribed to `{{ $labels.event_type }}` did not
            get a delivery row written for an event that fired
            ({{ $labels.reason }}). Unlike a failed delivery ATTEMPT
            there is no retry: `webhook_deliveries` has no row, so the
            worker will never send it and nothing re-derives it.

            reason=enqueue          — one subscriber's INSERT failed;
                                      the count is lost deliveries.
            reason=list_subscribers — the subscriber query failed, so
                                      EVERY subscriber lost the event.
            reason=invalid_payload  — the producer built non-JSON;
                                      a code bug, not an outage.

            The triggering event is still durable in its own table
            (freeze_events / divergence_runs / the incident markdown),
            so the customer-visible gap can be closed by re-emitting
            once the store is healthy.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_customer_webhook_fanout_failing

      # The explorer delta-strip worker (internal/aggregate/changesummary)
      # stopped upserting change_summary_5m, so every list and detail page
      # serves frozen deltas with no error. The gauge is seeded at worker
      # start and advances on any pass upserting an entity, so a
      # never-succeeding worker goes stale too; the `> 0` arm keeps a process
      # that never ran the worker silent. Scoped to
      # job="stellarindex-aggregator" because other binaries register the
      # gauge at 0.
      - alert: stellarindex_change_summary_stale
        expr: |
          (time() - stellarindex_change_summary_last_success_unix{job="stellarindex-aggregator"}) > 1800
            and stellarindex_change_summary_last_success_unix{job="stellarindex-aggregator"} > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_change_summary_stale
          summary: "change_summary_5m has not been refreshed in over 30 min — explorer deltas are frozen"
          description: |
            No change-summary pass has upserted a single entity in over
            30 minutes (six 5-minute intervals) plus a 15-minute
            for-duration. The explorer delta strips (h1/h24/d7/d30,
            ATH/ATL, streak) are serving the last written rows. Look at
            the aggregator's `change-summary pass had failures` warns for
            `first_err`, and
            stellarindex_change_summary_passes_total{outcome="failed"}.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/aggregator.md#stellarindex_change_summary_stale
