---
# R1 single-host overlay of the notify (Resend transactional-email) alerts
# (task #33 / W8 recon 9c). Same rules as deploy/monitoring/rules/notify.yml
# — duplicated here for the R1 single-host prometheus config per the wave-96
# monitoring-rules CI dual-validation pattern. The notify counter is not
# job-labelled, so the expr is byte-identical to the multi-host tree.

groups:
  - name: stellarindex.notify
    interval: 60s
    rules:

      # Mirror of the rule in deploy/monitoring/rules/notify.yml. Sustained
      # mail-send failure ratio per template — a Resend outage is otherwise
      # silent (the login handler swallows the send error to stay
      # enumeration-safe). Ratio + 15m window so a single stray failure in a
      # quiet window doesn't page; NaN on zero traffic drops the comparison.
      - alert: stellarindex_notify_send_failure_ratio_high
        expr: |
          sum by (template) (rate(stellarindex_notify_sends_total{result="failed"}[15m]))
          /
          sum by (template) (rate(stellarindex_notify_sends_total[15m]))
          > 0.5
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: notify
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/notify-send-failure.md
          summary: "Transactional email ({{ $labels.template }}) failing > 50% of sends"
          description: |
            More than half of {{ $labels.template }} email sends have failed
            for 15+ minutes ({{ $value | humanizePercentage }} failed). The
            mail provider (Resend) is likely down, the API key is rotated/
            invalid, or the sending domain is unverified. Customer impact:
            magic-link dashboard LOGIN and/or API-signup CONFIRMATION stop
            delivering — existing sessions and API keys are unaffected. Check
            the Resend status + credentials per the runbook.

            Runbook: docs/operations/runbooks/notify-send-failure.md
