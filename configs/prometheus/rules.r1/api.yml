---
# API serving-plane alerts — API SLA enforcement.

groups:
  - name: stellarindex.api
    interval: 30s
    rules:

      - alert: stellarindex_api_down
        expr: sum(up{job="stellarindex-api"}) == 0
        for: 60s
        labels:
          severity: page
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api-down.md
          summary: "Every API pod is down (SEV-1)"
          description: |
            No API instance is scrape-reachable across the fleet. This is a
            full public outage — customers see connection errors. Follow the
            api-down runbook immediately.

      - alert: stellarindex_api_latency_p95_high
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="stellarindex-api"}[5m]))
          ) > 0.5
        # 10m (not 2m): the p95 is already a 5m-windowed percentile, so single
        # tough queries are absorbed. The longer `for` also rides out transient
        # multi-minute bursts — a deploy restarting the API with cold caches, a
        # brief load spike — and only fires on a genuinely SUSTAINED slowdown.
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api-latency.md
          summary: "API p95 {{ $value | humanizeDuration }} > 500ms"
          description: |
            Freighter SLA is p95 ≤ 200 ms; we alarm at > 500 ms (≥ 2.5×
            target). Typical root cause: Redis cache miss storm → Timescale
            saturation. Check Redis eviction rate + Postgres connection pool.

      - alert: stellarindex_api_latency_p99_high
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="stellarindex-api"}[5m]))
          ) > 2
        # 10m (not 2m): ride out transient tail-latency bursts (deploy cold
        # start, one-off heavy scan); fire only on a sustained p99 regression.
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api-latency.md
          summary: "API p99 {{ $value | humanizeDuration }} > 2s"
          description: |
            Freighter SLA is p99 ≤ 500 ms; we alarm at > 2 s (≥ 4× target).
            Tail latency is usually a specific slow endpoint — check the
            per-endpoint breakdown.

      - alert: stellarindex_api_error_rate_high
        expr: |
          sum(rate(http_requests_total{job="stellarindex-api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="stellarindex-api"}[5m])) > 0.01
        for: 2m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api-5xx.md
          summary: "API 5xx rate {{ $value | humanizePercentage }}"
          description: |
            Sustained > 1 % 5xx responses. At 5 % we escalate to SEV-1 via
            the critical variant.

      - alert: stellarindex_api_error_rate_critical
        expr: |
          sum(rate(http_requests_total{job="stellarindex-api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="stellarindex-api"}[5m])) > 0.05
        for: 2m
        labels:
          severity: page
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/api-5xx.md
          summary: "API 5xx rate {{ $value | humanizePercentage }} (SEV-1)"
          description: |
            > 5 % of requests returning 5xx. Customers are broken; declare
            SEV-1 and follow the api-5xx runbook.

      - alert: stellarindex_api_price_stale
        # F-0104: the staleness gauge is emitted by the aggregator
        # at end-of-tick. Under cascade the aggregator tick wedges,
        # the gauge stops being scraped, and a bare `> 120` would
        # see no-data and never fire — i.e. the alert designed to
        # catch exactly this cascade was itself a victim of it. The
        # absent_over_time() branch fires the alert when the series
        # has been missing for 10 m, surfacing the wedge as a
        # staleness signal in its own right. Same pattern as
        # aggregator_silent (F-0080) and the exporter-down meta-
        # alerts (F-0085).
        expr: |
          stellarindex_price_staleness_seconds > 120
          OR
          absent_over_time(stellarindex_price_staleness_seconds[10m]) == 1
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/price-stale.md
          summary: "Price for {{ $labels.asset }} is {{ $value }}s stale"
          description: |
            The most recent aggregated price observation is older than 2 min
            (Freighter SLA is 30 s freshness; we alarm at 4× SLA). Usually
            means the source for this asset has stopped or the aggregator
            isn't writing. If the gauge is ABSENT (the absent_over_time
            branch fires alone), the aggregator is wedged — see the
            aggregator-silent runbook instead.

      # Per-(cache, op) miss rate. Set this against the in-memory
      # cache wrappers (`v1.CachedMarketsReader`, etc) — when miss
      # rate stays > 50 % for 10 min on a hot op, the prewarm key
      # has drifted from what the handler looks up. We've shipped
      # three of these bugs in 24 h (#1185 / #1194 / #1195); the
      # alert is the cheapest detector. Deliberate that we
      # threshold on RATIO not absolute miss count: a cache that
      # serves 1 req/s with 100 % miss is fine, a cache that
      # serves 1000 req/s with 50 % miss is a phantom-key drift.
      #
      # Denominator is filtered to the READ outcomes (hit|miss|stale).
      # `evicted` and `refresh_error` are side-events, not requests, and
      # counting them made the alert unfirable exactly when it matters:
      # a bounded cache under key enumeration emits one `evicted` per
      # `miss`, so miss/(miss+evicted) tops out at 0.5 and never crosses
      # the threshold.
      - alert: stellarindex_api_cache_miss_rate_high
        expr: |
          (
            sum by (cache, op) (rate(stellarindex_api_cache_ops_total{result="miss"}[5m]))
            /
            sum by (cache, op) (rate(stellarindex_api_cache_ops_total{result=~"hit|miss|stale"}[5m]))
          ) > 0.5
          and
          sum by (cache, op) (rate(stellarindex_api_cache_ops_total{result=~"hit|miss|stale"}[5m])) > 0.1
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/cache-miss-rate-high.md
          summary: "API cache {{ $labels.cache }}/{{ $labels.op }} miss rate {{ $value | humanizePercentage }}"
          description: |
            Sustained > 50 % miss rate on the v1.Cached* wrapper for
            {{ $labels.cache }}/{{ $labels.op }}. The prewarm goroutine
            should keep hot ops > 90 % hit. Likely cause: the prewarm
            is calling the cached reader with a slightly-different
            argument tuple than the handler does (see
            cmd/stellarindex-api/main.go prewarmCaches + the cached
            wrappers at internal/api/v1/markets_cache.go and
            asset_catalogue_cache.go). Cache key is a
            stringified tuple of all args; one drifted dimension
            (Order, Sources, Limit, …) means a phantom warmed slot.
            Follow the cache-miss-rate-high runbook.

      # Customer-webhook delivery health (F-1270 audit-2026-05-12).
      - alert: stellarindex_customer_webhook_delivery_failing
        expr: |
          sum(rate(stellarindex_customer_webhook_delivery_attempts_total{outcome=~"server_error|network_error"}[5m])) > 0.1
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/customer-webhook-delivery-failing.md
          summary: "Customer webhook delivery failing at {{ $value | humanize }}/s"
          description: |
            The customer-webhook delivery worker has been failing
            (5xx + network errors) at > 0.1 attempts/s for 15+ min.
            One customer's endpoint is likely sustained-down.

      # Usage-rollup worker health (#32/#37b). The API binary folds
      # the Redis per-endpoint usage counters into the usage_daily
      # hypertable every 5 min; /v1/account/usage + the dashboard's
      # per-endpoint analytics read the rollups. Sustained failure
      # means the dashboard's usage page goes stale (the API's
      # pricing surface is unaffected, and counters keep
      # accumulating in Redis with a 35-day TTL — short outages
      # lose nothing).
      - alert: stellarindex_usage_rollup_failing
        expr: |
          sum(rate(stellarindex_usage_rollup_sweeps_total{outcome=~"scan_error|sink_error"}[15m])) > 0
        for: 30m
        labels:
          severity: informational
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/usage-rollup-failing.md
          summary: "Usage-rollup sweeps failing ({{ $value | humanize }}/s error rate)"
          description: |
            The API binary's usage-rollup worker has been failing its
            5-minute sweeps (Redis scan or Timescale upsert) for 30+
            minutes. Dashboard per-endpoint usage analytics stop
            advancing; /v1/account/usage degrades to endpoint-less
            legacy rows. Data is safe in Redis for 35 days — fix the
            failing backend and the next sweep catches up.

      - alert: stellarindex_customer_webhook_delivery_exhausted
        expr: |
          sum(rate(stellarindex_customer_webhook_delivery_attempts_total{outcome="exhausted"}[1h])) > 0
        for: 1h
        labels:
          severity: informational
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/customer-webhook-delivery-failing.md
          summary: "Customer webhook deliveries permanently failed (budget exhausted)"
          description: |
            A delivery hit the 15-attempt retry budget (~8h) and
            was marked terminally failed.

      # #368 M6: `mark_error` is the delivery worker completing a POST
      # and then failing to RECORD it. markTerminal's godoc already
      # said this counter "makes the loop visible to an alert" — no
      # such alert existed in either tree, so the loop was visible only
      # in the journal.
      #
      # Its own rule rather than an extra arm on
      # `…_delivery_failing` above: that rule's > 0.1/s threshold
      # describes a customer endpoint failing under load, and one
      # wedged row re-POSTing on its 5-minute claim lease is ~0.003/s —
      # thirty times below it. Folding them would have produced a rule
      # that cannot fire on this fault at all.
      #
      # Range [30m] against `for: 15m` so a single step stays true for
      # longer than the pending period. The label set is pre-seeded in
      # obs.seedBoundedLabelSeries, so increase() reads a real zero
      # before the first occurrence rather than "no data".
      - alert: stellarindex_customer_webhook_mark_errors
        expr: |
          increase(stellarindex_customer_webhook_delivery_attempts_total{outcome="mark_error"}[30m]) > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/customer-webhook-delivery-failing.md
          summary: "Customer-webhook delivery outcomes are not being recorded — deliveries are looping"
          description: |
            stellarindex_customer_webhook_delivery_attempts_total{outcome="mark_error"}
            advanced in the last 30 minutes. The delivery worker
            completed a POST and then failed to write the result
            (MarkDelivered / MarkAttemptFailed). The row keeps the
            5-minute claim lease ListPendingDeliveries set and
            attempt_count does not advance, so the SAME payload is
            re-POSTed to the customer every lease interval until the
            write succeeds — a duplicate-delivery loop with no retry
            budget to end it. Check Postgres health first.

      # F-0051 (audit-2026-05-26). Mirror of the rule in
      # deploy/monitoring/rules/api.yml; wave-96 pair lint
      # requires both copies to stay in sync.
      - alert: stellarindex_tls_cert_expiring_soon
        expr: |
          stellarindex_tls_cert_not_after_unix - time() < 14 * 24 * 3600
          and stellarindex_tls_cert_not_after_unix > 0
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/tls-cert-expiring-soon.md
          summary: "TLS cert for {{ $labels.host }} expires in <14 days"
          description: |
            The leaf certificate for {{ $labels.host }} expires at
            {{ $value | humanizeTimestamp }}. Caddy's Let's Encrypt
            auto-renewal normally triggers 30 days before expiry;
            this alert firing means the renewal hasn't happened
            (rate limit, DNS issue, ACME quota, Caddy stuck).

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/tls-cert-expiring-soon.md

      # C6-032 (audit-2026-07-23): stellarindex_ratelimit_fail_open_total
      # has been registered + incremented since the rate limiter shipped
      # (internal/api/v1/middleware/ratelimit.go:96,190) and NOTHING in
      # either rule tree selected it. The limiter deliberately fails OPEN
      # on a Redis error so a cache outage can't take the API down — a
      # sound choice that also means the DoS/abuse control silently turns
      # ITSELF OFF, with the only trace a counter no one looked at. This
      # is precisely the registered-but-unalerted class metrics-registry.yml
      # was built for, and it did not catch this one (that alert covers a
      # missing Registry, not an unreferenced metric).
      #
      # rate() over 5m with for: 10m fires only on SUSTAINED bypass, so a
      # single-request Redis blip during a failover doesn't ticket, while
      # "the limiter has been off for ten minutes" always does. Expect it
      # to correlate with the Redis readyz probe going red — if it fires
      # ALONE, the limiter is failing open for a reason the health probe
      # can't see (auth to Redis, key eviction, script error).
      - alert: stellarindex_ratelimit_fail_open
        expr: sum(rate(stellarindex_ratelimit_fail_open_total[5m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ratelimit-fail-open.md
          summary: "Rate limiting is FAILING OPEN ({{ $value | humanize }} req/s bypassing the limiter)"
          description: |
            The API rate limiter could not reach its Redis backing store and
            let the requests through unlimited, continuously for the last
            10 minutes. Per-key quotas, burst protection and the abuse
            ceiling are all inert for the duration: a single caller can
            saturate the serving plane, and metered usage still records
            (billing is unaffected) while the throughput cap is not enforced.

            Check the Redis readyz probe first — this normally moves
            together with it. If Redis is healthy, the failure is in the
            limiter's own path (auth, evicted script, key namespace).

      # C3-082 (audit-2026-07-23): the monthly-quota middleware fails OPEN
      # on a backing-store error — correct, because the cap is billing
      # fairness and not a security boundary, so a Redis blip must not 429
      # paying customers. But the pre-fix trace was a `logger.Debug` line,
      # i.e. nothing at all at the API's production log level, and no
      # counter: the metered-spend ceiling could be off indefinitely with
      # zero signal.
      #
      # This is the revenue-side twin of stellarindex_ratelimit_fail_open
      # and is deliberately shaped identically. The exposure is the
      # opposite way round though: the rate limiter failing open costs
      # throughput/abuse headroom, this one costs MONEY — while it is open
      # a metered key bills past its agreed cap and the overage cannot be
      # reclaimed, because the requests were served.
      - alert: stellarindex_monthly_quota_fail_open
        expr: sum(rate(stellarindex_monthly_quota_fail_open_total[5m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/monthly-quota-fail-open.md
          summary: "Monthly quota ceiling is FAILING OPEN ({{ $value | humanize }} req/s bypassing the cap)"
          description: |
            The per-key monthly request quota could not be read from its
            backing store and the requests were served anyway, continuously
            for the last 10 minutes. Every metered key is currently
            uncapped: usage still meters (so the customer is still billed)
            but the agreed ceiling is not enforced, and any overage served
            in this window is unrecoverable.

            Normally moves together with the Redis readyz probe and with
            stellarindex_ratelimit_fail_open — the two share a backing
            store. If this fires ALONE, suspect the usage-counter key
            namespace or an eviction policy rather than Redis availability.

      # C3-067 (audit-2026-07-23): every privileged mutation on the admin
      # surfaces appends its audit row best-effort. The mutation
      # has already committed by then, so swallowing the error is right —
      # but it means an account tier, an API credential or a public status
      # notice can change with NO durable record of who did it or why, and
      # before this metric the only trace was one `logger.Warn` line.
      #
      # increase() over 1h with for: 5m, not rate()>0: these are rare,
      # bursty events (a single audit-DB outage produces a handful), and
      # the operator response is "reconstruct the missing rows from the
      # application logs before their retention closes" — which is worth
      # paging on for ONE occurrence, not only for a sustained rate. The
      # `surface` label is preserved through the alert so the ticket names
      # which mutation class to go looking for.
      - alert: stellarindex_admin_audit_write_failing
        expr: sum by (surface) (increase(stellarindex_admin_audit_write_failures_total[1h])) > 0
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/admin-audit-write-failing.md
          summary: "Admin audit trail has holes: {{ $value | humanize }} lost row(s) on {{ $labels.surface }}"
          description: |
            A privileged mutation on the `{{ $labels.surface }}` surface
            COMPLETED but its durable audit row did not land. The change is
            live — a tier override, a minted or revoked credential, a public
            status notice — with no record of the actor, the reason, or
            the previous values.

            This is a compliance/forensics gap, not an availability one: do
            NOT roll anything back. Recover the missing rows from the API's
            application logs (each site logs `… audit append failed
            (best-effort)` with the target id) BEFORE the log retention
            window closes on them, then fix whatever made the audit store
            unwritable.

      # C3-032 follow-up: the durable login-code lockout's table is
      # written by an UNAUTHENTICATED endpoint under an ATTACKER-CHOSEN
      # key. POST /v1/auth/verify-code with a synthetic address inserts a
      # `login_code_lockouts` row that no successful sign-in can ever
      # clear, bounded only by the anonymous rate limit — a slow, cheap,
      # remote table-fill on a disk-fixed host.
      #
      # Two arms, one alert, because the operator response starts the
      # same way (look at the table):
      #
      #   rows      — the retention sweep is not keeping up, or someone is
      #               filling the table faster than 48h retention drains
      #               it. A healthy deployment sits in the low tens.
      #   status_check — the lockout's pre-match read is FAILING OPEN. The
      #               control is not being enforced and the HTTP response
      #               is identical to the healthy path, so this counter is
      #               the only evidence. Typically migration 0122 lagging
      #               a node.
      #
      # `register` and `sweep` failures are deliberately NOT alerted: the
      # first is a lost guess-count (bounded harm, visible in the same
      # metric), the second surfaces here anyway as the row count climbing.
      - alert: stellarindex_login_code_lockout_table_growing
        expr: |
          stellarindex_login_code_lockout_rows > 10000
          or
          increase(stellarindex_login_code_lockout_errors_total{op="status_check"}[1h]) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/login-code-lockout-table-growing.md
          summary: "login_code_lockouts is growing or its check is failing open ({{ $value | humanize }})"
          description: |
            Either `login_code_lockouts` has exceeded 10k rows — a table
            whose key an unauthenticated caller chooses, so sustained
            growth is a remote fill rather than user behaviour — or the
            lockout's pre-match read has been failing open, which means
            the brute-force bound on the 6-digit email code is not being
            enforced at all while sign-in looks perfectly healthy.

            Neither is an outage. Both are silent: the fill ends at a
            disk-full page that names the wrong subsystem, and the
            fail-open ends at an account takeover with no trace.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/login-code-lockout-table-growing.md

      # ── Auth-reaper liveness (#368 M5) ─────────────────────────────────
      # The three auth-table reapers (login_code_lockouts, magic_link_tokens,
      # speculative-account orphans) each report WHAT they did; none
      # reported THAT they ran. A dead reaper freezes every rows gauge at a
      # healthy-looking value, so login_code_lockout_table_growing
      # (rows > 10000) can never see the bound being lost. The threshold is
      # relative to each reaper's own configured cadence (3 × interval —
      # an hourly reaper tickets after ~3 h of silence). A DISABLED reaper
      # publishes no series and never alerts: absence is config, not death.
      - alert: stellarindex_auth_reaper_stalled
        expr: |
          (time() - stellarindex_auth_reaper_last_sweep_unix)
            > 3 * stellarindex_auth_reaper_interval_seconds
          or
          (stellarindex_auth_reaper_interval_seconds > 0
            unless stellarindex_auth_reaper_last_sweep_unix)
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/auth-reaper-stalled.md
          summary: "{{ $labels.reaper }} auth reaper has not completed a sweep for {{ $value | humanizeDuration }}"
          description: |
            The {{ $labels.reaper }} reaper in the API binary last completed
            a sweep {{ $value | humanizeDuration }} ago — more than three
            times its configured interval. Its bounded table
            (login_code_lockouts / magic_link_tokens / speculative
            accounts) is no longer being trimmed; the rows gauge it
            normally refreshes is FROZEN, not healthy. Check the API
            binary's log for the reaper's "sweep failed" / panic lines and
            whether the goroutine is stuck on a Postgres call.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/auth-reaper-stalled.md

      # v0.21.4 background cache workers. The DEX TVL refresher
      # recomputes per-protocol TVL every 10 min; a failed protocol
      # keeps its previous entry, so /v1/dexes + /v1/protocols keep
      # LOOKING healthy while the figure ages — this alert is the only
      # place sustained failure is visible before the data is hours
      # old. Isolated errors during lake merges self-heal.
      - alert: stellarindex_dex_tvl_refresh_failing
        expr: |
          sum(rate(stellarindex_dex_tvl_refresh_total{outcome="error"}[15m])) > 0
            and
          sum(rate(stellarindex_dex_tvl_refresh_total{outcome="ok"}[15m])) == 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/dex-tvl-refresh-failing.md
          summary: "DEX TVL snapshot refresher failing — TVL figures aging silently"
          description: |
            Every DEX TVL refresh in the last 15 min errored, sustained
            30+ min, with zero successes interleaved. The served TVL on
            /v1/dexes and the per-protocol pages is a carried-forward
            snapshot growing stale behind an honest-looking page. Usual
            causes: lake reserve reads failing (ClickHouse down / part
            churn) or the served-tier prices_1m reads failing.

      # The in-process SDEX order book behind /v1/sdex/orderbook.
      # load_error repeating means the endpoint is stuck on its 503
      # warming problem (user-visible); advance_error sustained means
      # the served book is drifting from the live ledger while
      # answering with an ever-older honest timestamp.
      - alert: stellarindex_sdex_orderbook_maintain_failing
        expr: |
          sum(rate(stellarindex_sdex_orderbook_maintain_total{outcome=~"load_error|advance_error"}[15m])) > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/sdex-orderbook-maintain-failing.md
          summary: "SDEX order-book maintenance failing (load or advance errors 30+ min)"
          description: |
            The live order book's lake reads (initial load or the 60s
            incremental advance) have been failing for 30+ minutes.
            If load_error: /v1/sdex/orderbook is serving 503 warming
            problems. If advance_error: the book serves increasingly
            stale depth with an honest as_of_ledger. Check ClickHouse
            health and the ledger_entry_changes partition layout first.
