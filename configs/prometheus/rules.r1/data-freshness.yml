groups:
  - name: data-freshness
    rules:
      # The "never get behind" alert. Fires when any data domain/source is
      # staler than its expected cadence — the gap that let coingecko rot 11
      # days + sep1 metadata never populate, both unnoticed. Emitted by
      # data-freshness.sh (textfile collector, every 15 min).
      - alert: stellarindex_data_source_stale
        expr: |
          stellarindex_data_freshness_stale == 1
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: data-freshness
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/data-source-stale.md
          summary: "Data source {{ $labels.domain }}/{{ $labels.source }} is stale"
          description: |
            stellarindex_data_freshness_stale{domain="{{ $labels.domain }}",source="{{ $labels.source }}"} = 1
            — no fresh rows for {{ $labels.domain }}/{{ $labels.source }} beyond its expected
            cadence. A feed died (e.g. coingecko hit its API quota), a poller wedged, or a
            writer/timer stopped. The age is on
            stellarindex_data_freshness_age_seconds{domain="{{ $labels.domain }}",source="{{ $labels.source }}"}.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/data-source-stale.md

      # CS-102 (2026-07-28): the domain-level `supply` freshness check measures
      # max(time) across the WHOLE table, so it proves only that SOME asset is
      # publishing. It read green while 37 of 48 watched assets were frozen —
      # the still-live assets kept the global max current. This alert is the
      # per-asset shape that aggregate cannot express.
      - alert: stellarindex_supply_assets_stale
        expr: |
          stellarindex_supply_assets_stale > 0
        for: 2h
        labels:
          severity: ticket
          team: stellarindex
          component: supply
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply-assets-stale.md
          summary: "{{ $value }} watched asset(s) have frozen supply"
          description: |
            stellarindex_supply_assets_stale = {{ $value }} — that many watched
            assets have published no supply snapshot for over 30h, while the
            domain-level `supply` freshness check may still read fresh because
            other assets are publishing normally.

            Worst age is on stellarindex_supply_asset_max_age_seconds.

            The founding case was CS-102: the supply freshness gate anchored on
            per-entity last ACTIVITY instead of the producer's watermark, so any
            quiet asset was mistaken for a stalled producer and refused every
            snapshot. Check whether the affected assets share a component whose
            observations have gone quiet before assuming a dead writer.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/supply-assets-stale.md

      # A source no longer reconciles to the certified lake. Now that the
      # ADR-0033 verdict is trustworthy + self-maintaining (rc.149), a
      # complete=false means a REAL served<>lake gap to re-derive.
      - alert: stellarindex_completeness_incomplete
        expr: |
          stellarindex_completeness_incomplete == 1
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: completeness
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/completeness-incomplete.md
          summary: "Source {{ $labels.source }} failed the ADR-0033 completeness verdict"
          description: |
            stellarindex_completeness_incomplete{source="{{ $labels.source }}"} = 1 — the served
            tier no longer reconciles to the certified ClickHouse lake for {{ $labels.source }}
            (latest verdict complete=false). A real served<>lake gap. Re-derive that source from
            the lake, then re-verify with compute-completeness.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/completeness-incomplete.md

      # UNRECOGNIZED EVENTS FROM A KNOWN PROTOCOL — the bucket that means
      # our bug.
      #
      # A source we index emitted a (contract, topic) shape none of its
      # decoders claimed, so we are silently dropping events on a protocol
      # we promised to cover. attributeRecognitionGaps caps that source's
      # recognition axis; recognition_ok goes 0.
      #
      # This REPLACES stellarindex_recognition_unattributed_jump, which
      # watched the other bucket — unrecognized shapes on contracts NOBODY
      # owns, i.e. foreign protocols. That number is 23866 and grows
      # forever as Stellar grows; the jump alert tried to infer a registry
      # regression from its growth RATE against a ~30/day organic baseline.
      # The inference is unreliable in both directions: it fires when
      # Stellar is merely busy (361 in 2 days on 2026-09-01, all of them on
      # unowned contracts, no source degraded), and a regression would look
      # identical to growth from the alert alone.
      #
      # The signal it was trying to infer is directly observable here, so
      # infer nothing: alert on the source axis itself.
      - alert: stellarindex_source_recognition_failing
        expr: stellarindex_recognition_ok == 0
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: completeness
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/source-recognition-failing.md
          summary: "{{ $labels.source }} emitted events none of its decoders recognise"
          description: |
            Source {{ $labels.source }} has an unrecognized (contract, topic) shape on a
            contract it OWNS — an event we are silently dropping on a protocol we claim to
            index. Its ADR-0033 coverage verdict is capped until this is resolved.

            Two usual causes: the protocol upgraded its contract in place and changed an
            event shape (Soroban contracts can update_contract without changing address —
            see docs/architecture/contract-schema-evolution.md), or a new event kind shipped
            that the decoder has no arm for.

            Run `stellarindex-ops ch-recognition -config /etc/stellarindex.toml -top 60` and
            look for shapes whose contract_id belongs to this source's registry.

            NOT to be confused with stellarindex_recognition_unattributed_shapes, which
            counts shapes on contracts nobody owns (foreign protocols). That number is large,
            always growing, and inert.

      # A continuous aggregate is emptied-pending-refresh: a migration
      # recreated it WITH NO DATA (0081/0115/0126/0147) — or a replay
      # rewrote the base rows underneath it — and the MANUAL
      # `refresh_continuous_aggregate` follow-up that re-materializes its
      # history was never run. The view's refresh policy silently re-fills
      # only a recent trailing sliver, so every newest-bar freshness check
      # reads green while the whole back-history serves empty — and the
      # ADR-0033 completeness verdict can't catch it (these are derived
      # price CAGGs, not reconcile targets). `for: 2h` gives an operator time
      # to run the refresh after a deploy that recreates the view; a genuinely
      # forgotten follow-up keeps firing past it. Emitted by data-freshness.sh.
      #
      # Two families, one alert, because the operator action is identical.
      # `_cagg_history_missing` covers the seven prices_* views that serve
      # /v1/ohlc, /v1/chart and /v1/history/since-inception; migrations 0115
      # and 0147 drop and recreate all nine of these views together, and for
      # a year only the two TWAPs were judged. Both gauges are computed
      # against the `trades` hypertable, not against prices_1m — prices_1m is
      # emptied by the same migrations, so a reference taken from it read
      # healthy in exactly the state the alert exists to name.
      - alert: stellarindex_twap_history_missing
        expr: |
          stellarindex_twap_history_missing == 1
            or
          stellarindex_cagg_history_missing == 1
        for: 2h
        labels:
          severity: ticket
          team: stellarindex
          component: completeness
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/twap-history-missing.md
          summary: "Continuous aggregate {{ $labels.view }} is missing its history — post-migration refresh_continuous_aggregate follow-up not run"
          description: |
            {{ $labels.view }} is missing history the `trades` hypertable holds: the view
            is empty, or its oldest materialized bar is far newer than the oldest trade
            (allowing for an armed retention policy on that view), so it carries only the
            trailing window its refresh policy auto-fills. A migration recreated the view
            WITH NO DATA (the 0081→0115→0126→0147 CAGG-recreate pattern), or a replay
            rewrote its base rows, and the manual re-materialization step was skipped — so
            the API serves NO bars for older ranges at this grain while recent bars, and
            every newest-bar freshness check, look healthy.

            Fix: run the documented follow-up once prices_1m is whole —
            `CALL refresh_continuous_aggregate('{{ $labels.view }}', NULL, now());` — then
            confirm this clears on the next data-freshness tick.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/twap-history-missing.md

      # The watchdog that catches every other staleness is itself dark.
      - alert: stellarindex_data_freshness_watchdog_silent
        expr: |
          absent_over_time(stellarindex_data_freshness_stale[45m])
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: data-freshness
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/data-freshness-watchdog-silent.md
          summary: "data-freshness watchdog stopped emitting"
          description: |
            stellarindex_data_freshness_stale has been absent > 45m — data-freshness.timer
            hasn't refreshed its textfile, so the watchdog that backstops coingecko/sep1/
            verdict staleness is blind. Check `systemctl status data-freshness.service` +
            its last journal on r1.

            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/data-freshness-watchdog-silent.md

      - alert: stellarindex_served_value_drift
        expr: stellarindex_served_value_ok == 0
        for: 26h
        labels:
          severity: ticket
          team: stellarindex
          component: data-truth
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/served-value-drift.md
          summary: "Served value {{ $labels.check }} diverges from independent ground truth"
          description: |
            verify-served-values found {{ $labels.check }} outside its
            tolerance vs its independent source (SDF lumen API /
            Stellar Expert) for two consecutive daily runs. This is
            the CS-010 class — the code is fine but the VALUE we
            serve is wrong. Investigate the derivation before
            customers or auditors sample it by hand.

      # OBS-2 pattern (see restore-drill.yml): a bare `time() - <gauge>`
      # predicate can only measure a series that EXISTS. When the harness
      # has never written its textfile the vector is empty, the subtraction
      # yields nothing, and the one alert whose whole job is "the harness
      # is dark" is itself dark. That is not hypothetical — the timer was
      # missing from the role entirely while these three rules read as
      # coverage. The absent_over_time arm restores the case, over the same
      # 48 h the first branch measures, so a never-installed timer, a purged
      # textfile and a dead-but-present one all land on the same ticket.
      - alert: stellarindex_served_value_check_stale
        expr: |
          (time() - stellarindex_served_value_last_run_unix) > 172800
          or
          absent_over_time(stellarindex_served_value_last_run_unix[2d])
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: data-truth
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/served-value-drift.md
          summary: "verify-served-values has not completed in 2 days"
          description: |
            The daily served-value truth harness hasn't written its
            textfile in 48h — the timer is dead, the run is crashing,
            or the timer was never installed on this host and the
            series has never existed. Data-truth reconciliation is
            dark. Start with `systemctl status
            verify-served-values.timer` on the archival node.

      - alert: stellarindex_served_value_persistently_skipped
        expr: stellarindex_served_value_skipped == 1
        for: 26h
        labels:
          severity: ticket
          team: stellarindex
          component: data-truth
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/served-value-drift.md
          summary: "Served-value check {{ $labels.check }} unverifiable for 2 days (truth source dark)"
          description: |
            verify-served-values has SKIPPED {{ $labels.check }} on every
            run for 2 days — its independent truth source (SDF lumen API /
            Stellar Expert / the stellar/dashboard source behind
            sdf_reserve_list) is unreachable. This is availability, not drift,
            so served_value_drift (ok==0) stays quiet AND check_stale stays
            quiet (the run still completes). Without this alert a PERSISTENT
            truth-source break (URL/schema change) would leave that value
            UNVERIFIED behind a green gate forever — the F5 fail-open a
            skipped check opens (it emits no served_value_ok). Check the
            source is reachable / its response shape; the check resumes
            automatically once truth returns.

      # C4-069: the LIST-level companion to served_value_drift for
      # xlm_circulating_supply. That check's 2% tolerance (~700M XLM) is
      # deliberate — it rides out methodology residuals such as the fee
      # pool — but it cannot see SDF adding or retiring ONE reserve
      # account: the smaller program wallets hold well under 2% of
      # circulating, so a stale supply.sdf_reserve_accounts would mis-state
      # circulating supply indefinitely behind a green value check.
      # verify-served-values diffs the configured set against the accounts
      # stellar/dashboard's common/lumens.js subtracts for its
      # circulatingSupply (the dashboard API itself exposes program sums,
      # never the accounts) and emits one gauge per kind. The gauge is
      # ABSENT when the published source could not be read or parsed —
      # that case is served_value_persistently_skipped{check="sdf_reserve_list"},
      # not this alert — so `> 0` here is always a VERIFIED diff. Same 26h
      # ride-out as its siblings: two daily runs.
      - alert: stellarindex_sdf_reserve_list_drift
        expr: stellarindex_sdf_reserve_list_drift > 0
        for: 26h
        labels:
          severity: ticket
          team: stellarindex
          component: data-truth
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/served-value-drift.md
          summary: "supply.sdf_reserve_accounts differs from the reserve list SDF publishes ({{ $value }} {{ $labels.kind }})"
          description: |
            verify-served-values found {{ $value }} account(s) of kind
            "{{ $labels.kind }}" between supply.sdf_reserve_accounts and the
            reserve list SDF publishes (stellar/dashboard common/lumens.js)
            on two consecutive daily runs. missing = SDF now excludes an
            account we still count as circulating (we over-state); extra =
            SDF no longer excludes one we still subtract (we under-state).
            The xlm_circulating_supply value check may well stay green — a
            single account sits inside its 2% tolerance — which is why this
            check exists. The account ids are in the run's journal:
            `journalctl -u verify-served-values -n 20`. Fix is config, not
            code: update stellarindex_sdf_reserve_accounts (and the paired
            reserve_balances_stroops) in the archival-node role defaults,
            re-render the config and restart the supply writer.

      # Dedicated failed-unit ticket, in place of the catch-all
      # stellarindex_systemd_unit_failed in infra.yml — verify-served-values
      # is one of the units named in scripts/ci/unit-failed-dedicated.baseline
      # and excluded from that rule's selector. The catch-all's `for: 15m` is
      # right for a unit whose failure is unambiguous and wrong here: the
      # harness exits non-zero for a DRIFTED check and for an all-skipped run
      # too, so one day of dashboard.stellar.org or stellar.expert being dark
      # would open a same-day ticket for exactly the third-party wobble the
      # 26h windows on _drift and _persistently_skipped exist to ride out.
      #
      # The ride-out lives in the EXPRESSION rather than in `for:`, and that
      # is load-bearing. A oneshot leaves `failed` while its next run is
      # activating, so a scrape landing in that gap resolves the alert and
      # restarts the pending clock: `for: 26h` over a plain `== 1` is
      # unfireable on a daily oneshot whenever the gap is scraped, and fires
      # only by luck when it is not — the same shape of never-firing rule
      # this whole alert family was fixed for. `offset 25h` asks a question
      # the gap cannot disturb (was this unit ALSO failed a full cycle ago),
      # and `for: 1h` carries the total to the same 26h the sibling rules use.
      - alert: stellarindex_served_value_unit_failed
        expr: |
          node_systemd_unit_state{
            name="verify-served-values.service",
            state="failed"
          } == 1
          and
          node_systemd_unit_state{
            name="verify-served-values.service",
            state="failed"
          } offset 25h == 1
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: data-truth
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/served-value-drift.md
          summary: "verify-served-values.service failed on two consecutive daily runs"
          description: |
            The served-value truth harness exited non-zero on its last two
            runs. Three conditions exit non-zero and they want different
            responses: a DRIFTED check (served_value_drift names which one;
            sdf_reserve_list_drift is the reserve-list check's own ticket),
            an all-skipped run where every independent truth source was dark
            (served_value_persistently_skipped names it), and a crash before
            the textfile is written. Only the third is unique to this ticket
            — served_value_check_stale cannot report a crash until
            last_run_unix is 48h old, most of another day out. So if neither
            companion alert is firing, treat this as the crash case:
            `systemctl status verify-served-values` then
            `journalctl -u verify-served-values --since -50h`.
