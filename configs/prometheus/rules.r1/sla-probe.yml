---
# SLA-probe alerts. Pair with cmd/stellarindex-sla-probe + the
# 15-minute systemd timer in configs/healthchecks/stellarindex-sla-probe.timer.
#
# Scrape source: node_exporter's textfile_collector reads
# `/var/lib/node_exporter/textfile_collector/sla_probe.prom`,
# which the probe writes via -textfile-output (introduced in #293).
# Metric names + labels defined in cmd/stellarindex-sla-probe/textfile.go.
#
# Alert family:
#
#   - `stellarindex_sla_probe_p95_breach` — per-endpoint p95 latency
#     above the 200 ms SLA target for ≥ 2 consecutive runs
#     (i.e. ≥ 30 min sustained). Page-worthy because this is a
#     direct user-visible SLA breach.
#
#   - `stellarindex_sla_probe_freshness_breach` — per-endpoint
#     observed_at freshness > 30 s on the most recent run. The
#     pricing SLA pins 30 s; sustained breach is a P2 page.
#
#   - `stellarindex_sla_probe_unit_failed_alert` — the verdict
#     gauge has been 1 for ≥ 2 consecutive scrapes. Catches the
#     general "any SLA breached" case without naming which one;
#     useful for a single dashboard tile + escalation.
#
#   - `stellarindex_sla_probe_stale` — `last_pass_timestamp` older
#     than 90 minutes (6× the 15-min cadence). Either the timer
#     isn't running or every recent run has failed. P2 page.

groups:
  - name: stellarindex.sla_probe
    interval: 60s
    rules:

      - alert: stellarindex_sla_probe_p95_breach
        expr: stellarindex_sla_probe_latency_ms{quantile="0.95"} > 200
        for: 30m
        labels:
          severity: page
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/sla-probe-p95-breach.md
          summary: "{{ $labels.endpoint }} p95 latency {{ $value }}ms exceeds SLA target (200ms) sustained 30m"
          description: |
            The SLA probe's per-endpoint p95 has been above the 200 ms
            SLA target for ≥ 30 minutes (2 timer firings). User
            impact: the asset detail page shows degraded responsiveness
            on {{ $labels.endpoint }} for the watched pair. Runbook walks
            through {{ $labels.endpoint }}-specific diagnostics, then
            general API-latency triage.

      # Two bounds, and the DEFAULT is the SLA one. /price is the single
      # endpoint carrying a structural exemption: it serves the last
      # CLOSED 1-minute bucket (ADR-0015 closed-bucket serving), so its
      # freshness is ~60-120s by design — that is NOT staleness, it is
      # the consistency contract — and 180s is the genuine-stall line
      # above that envelope. Everything else, /price/tip today and any
      # endpoint that grows an observed_at tomorrow, is held to the 30s
      # pricing SLA.
      #
      # The selector used to read `{endpoint!="price-tip"} > 180`, which
      # handed the closed-bucket exemption to every endpoint that is not
      # the tip. Latent rather than live, since nothing else emitted
      # freshness — but the first endpoint to publish an observed_at
      # (e.g. /oracle/latest) would have inherited a 180s bound that
      # only ADR-0015 justifies, and 179s of oracle staleness would have
      # paged nobody. Inverted to a positive matcher so the exemption is
      # granted by name and the SLA is the fallback.
      - alert: stellarindex_sla_probe_freshness_breach
        expr: |
          stellarindex_sla_probe_freshness_sec{endpoint="price"} > 180
          or
          stellarindex_sla_probe_freshness_sec{endpoint!="price"} > 30
        for: 30m
        labels:
          severity: page
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/sla-probe-freshness-breach.md
          summary: "{{ $labels.endpoint }} price freshness {{ $value }}s over its bound (30s SLA; /price 180s closed-bucket) sustained 30m"
          description: |
            The SLA probe's observed_at freshness for {{ $labels.endpoint }}
            has been over its bound for ≥ 30 minutes. The bound is the 30s
            pricing SLA for every endpoint except /price, which serves the
            ADR-0015 closed bucket and is held to 180s — read the summary
            for the value, not this description, before deciding which one
            tripped.

            When the endpoint is price-tip the usual cause is NOT a broken
            pipeline: computeTip escalates to a 30s window and then falls
            back to the closed bucket, so a pair with no trade for 30+ s
            serves a 60-120s observed_at in-contract (ADR-0018). Check the
            pair's trade cadence first, then the aggregator → Redis → API
            path; bisect by which stage's `observed_at` is lagging.

      - alert: stellarindex_sla_probe_unit_failed_alert
        expr: stellarindex_sla_probe_unit_failed > 0
        for: 30m
        labels:
          severity: ticket
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/sla-probe-unit-failed.md
          summary: "SLA probe verdict has been fail for ≥ 30m — at least one SLA breached"
          description: |
            The probe's overall verdict gauge has been 1 (fail) for
            ≥ 30 minutes. This is the umbrella "something's off"
            signal — the more-specific p95 / freshness / availability
            alerts will name the exact breach if they're configured to
            fire faster. Runbook: pick the most-recent journald entry
            with the JSON report, read the `failed_reasons` array, and
            route to the appropriate per-endpoint runbook.

      # Staleness keys on `last_pass_timestamp`. Default cadence is
      # 15 min so 90 min = 6 missed passes. Either the timer isn't
      # running or every run since has failed. P2 page either way —
      # we lose the SLA-evidence trail when the probe is silent.
      # OBS-2: a failing run drops last_pass_timestamp from the
      # textfile (the probe only emits it on pass and rewrites the whole
      # file), so the every-run-failed case makes the series ABSENT, not
      # old — the `time() - last_pass_timestamp` branch then evaluates
      # over an empty vector and can never fire. The
      # `absent_over_time(...[90m])` branch restores the documented
      # coverage: no passing run recorded in 90 min (timer dead OR every
      # run failing) pages.
      - alert: stellarindex_sla_probe_stale
        expr: |
          (time() - stellarindex_sla_probe_last_pass_timestamp) > (90 * 60)
          or
          absent_over_time(stellarindex_sla_probe_last_pass_timestamp[90m])
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: api
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/sla-probe-stale.md
          summary: "SLA probe has recorded no passing run in ≥ 90m (cadence 15m) — timer dead or every run failing"
          description: |
            Either the systemd timer isn't running, or every run since
            the last pass has failed. Without the probe, we lose the
            SLA-evidence trail. Runbook:
            check systemd-unit status first; fall through to the
            per-breach runbooks if every run is genuinely failing.
