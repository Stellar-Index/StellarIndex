---
# Anomaly + freeze alerts — driven by the metrics emitted in
# internal/aggregate/orchestrator (see ADR-0019). The orchestrator
# writes a freeze marker to Redis when ActionFreeze fires; the API
# reads the marker on every /v1/price request and surfaces
# flags.frozen=true. Both ends are tracked via
# stellarindex_anomaly_freeze_engaged_total — a counter labelled by
# asset class.
#
# Why a counter (not a gauge): the orchestrator doesn't currently
# track per-(asset, quote) "is this pair frozen RIGHT NOW" state;
# it ticks every 30s and emits ActionFreeze decisions one-shot. A
# sustained freeze (the underlying anomaly persists) shows up as a
# steady stream of counter increments. The alerts use rate() over
# windowed ranges to differentiate one-tick blips from a real
# sustained event.
#
# Per-asset granularity is not currently a label on the metric (the
# orchestrator's hot path keeps the label set bounded to AssetClass).
# Per-pair freeze details live in the freeze:<asset>:<quote> Redis
# marker JSON; operator runbook reads from there during triage.

groups:
  - name: stellarindex.anomaly
    interval: 30s
    rules:

      # ─── P3: ActionWarn is firing (the previously-inert warn_pct knob) ──
      #
      # stellarindex_anomaly_warn_total (internal/obs/metrics.go) exists
      # so the operator's warn_pct threshold has somewhere to surface —
      # before it, ActionWarn was computed and discarded (audit COR-09 /
      # AGT-06). A sustained non-zero rate is exactly the "called out,
      # not frozen" signal warn_pct exists to catch.
      # lint-tripwire-window:sustained: warn_rate exists to catch a CONTINUING elevated ActionWarn rate, not a single decision; a lone warn is expected noise
      - alert: stellarindex_anomaly_warn_rate
        expr: |
          sum by (class) (rate(stellarindex_anomaly_warn_total[15m])) > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/anomaly-freeze-engaged.md
          summary: "Anomaly ActionWarn sustained on class {{ $labels.class }} (P3)"
          description: |
            The aggregator's anomaly checker has emitted ActionWarn
            (deviation past warn_pct, short of the freeze threshold)
            for asset class {{ $labels.class }} continuously over the
            last 15 minutes. No customer-facing effect — ActionWarn
            does not freeze or flag /v1/price — but a sustained rate
            means either a real, building market move or warn_pct is
            tuned too tight for this class's normal volatility.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/anomaly-freeze-engaged.md

      - alert: stellarindex_anomaly_freeze_engaged
        expr: |
          sum by (class) (rate(stellarindex_anomaly_freeze_engaged_total[5m])) > 0
        for: 1m
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/anomaly-freeze-engaged.md
          summary: "Anomaly freeze engaged on class {{ $labels.class }} (P3)"
          description: |
            The aggregator's anomaly checker emitted ActionFreeze
            for at least one (pair, window) within the last 5
            minutes, asset class {{ $labels.class }}. The affected
            pair's /v1/price now serves the previous bucket's
            last-known-good VWAP with flags.frozen=true.
            The freeze lasts for its hold (ADR-0019 lifecycle); the
            marker's TTL is the remaining hold plus a 5-minute grace
            (freeze.DefaultMarkerGrace = cachekeys.FreezeTTL), so it
            outlives a missed tick or restart, not the hold itself.
            Inspect the freeze:<asset>:<quote> Redis keys to
            identify the affected pair(s); manual override via
            policy YAML if confirmed false-positive.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/anomaly-freeze-engaged.md

      # The P1 page for a freeze that exhausted its extension
      # ladder lives ONLY in freeze-lifecycle.yml
      # (stellarindex_anomaly_freeze_escalated). A duplicate lived
      # here until GH-1121: same expr on the same unlabelled counter,
      # so `sum by (class)` grouped nothing and every page's summary
      # interpolated a blank `{{ $labels.class }}`, and every
      # escalation paged twice. Engagement (below) stays ticket-level
      # here; escalation pages exactly once, from freeze-lifecycle.yml.
      # Recovery-side health: the freeze recovery worker closes
      # durable freeze_events rows once the Redis marker TTL elapses.
      # When it stalls, the explorer /anomalies timeline shows
      # resolved freezes as still-firing — silent quality regression
      # rather than an outage. F-1229.
      - alert: stellarindex_anomaly_freeze_recovery_stalled
        expr: |
          stellarindex_anomaly_freeze_active > 0
            and on() (sum(rate(stellarindex_anomaly_freeze_recovery_sweeps_total{outcome!="ok"}[15m])) > 0)
        for: 2h
        labels:
          severity: ticket
          team: stellarindex
          component: aggregator
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/freeze-recovery-stalled.md
          summary: "Freeze recovery worker is stalled (P3)"
          description: |
            At least one (pair, window) freeze has stayed active
            (stellarindex_anomaly_freeze_active > 0) for 2h+, AND
            the recovery worker reported sweep failures within the
            last 15 min. The durable freeze_events table is
            accumulating open rows that the explorer /anomalies
            timeline will show as forever-firing.

            The API itself is unaffected — flags.frozen is driven by
            the Redis marker, not the durable mirror. Customer-facing
            data is correct; only the explorer history is wrong.

            Most common cause: postgres connection pool exhaustion
            or a Redis ACL drift. Check the recovery worker logs
            (component=freeze-recovery) for the specific transport
            error.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/freeze-recovery-stalled.md

      # Exploit-shaped detector (4.4c, post-2026-08-25 Blend/Comet).
      # A SELF-PAIR swap (token_in == token_out) on a curated AMM pool
      # moves no value between distinct assets and has NO honest purpose;
      # it is the primitive the exploit ran 390 times to walk the pool's
      # spot price and defeat the freeze/divergence guards. Those guards
      # were blind to it because the self-pair rows never reach the served
      # `trades` table (they decode to zero rows; the raw event still lands
      # in soroban_events). This alert is the tripwire: comet emitted ZERO
      # self-pair swaps before the exploit window, so a burst is an
      # exploit-shaped signal, not noise. increase()[15m] > 10 is far above
      # the normal-zero baseline yet well under the exploit's ~390.
      # Ticket not page (a NEW detector; escalate to page once it proves
      # out) — a human triages the tx + pool via the raw soroban_events.
      # Sensitivity tradeoff: the counter increments only for LIVE (recent
      # close-time) self-pair swaps, so backfill / completeness re-derive of
      # the historical exploit window does not re-fire it. A patient attacker
      # pacing <=10 self-pair swaps per rolling 15m stays under this floor;
      # the raw soroban_events row still lands for forensics, and the floor
      # can be lowered (baseline is truly zero) once the detector proves out.
      - alert: stellarindex_amm_self_pair_swap_burst
        expr: |
          sum by (source) (increase(stellarindex_amm_self_pair_swap_total[15m])) > 10
        for: 2m
        labels:
          severity: ticket
          team: stellarindex
          component: ingestion
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/amm-self-pair-swap-burst.md
          summary: "Self-pair swap burst on {{ $labels.source }} — possible pool-price manipulation (P3)"
          description: |
            More than 10 SELF-PAIR swaps (token_in == token_out) were
            decoded on AMM source {{ $labels.source }} in the last 15
            minutes. A self-pair swap has no honest purpose — it is the
            primitive the 2026-08-25 Blend/Comet exploit ran ~390 times
            to manipulate a pool's spot price. Historically this source
            emitted ZERO, so this is an exploit-shaped signal.

            The self-pair rows are DROPPED before the served trades table
            (they map to zero rows), so they do not move any published
            price directly — but a sustained burst means someone is
            hammering the pool's internal price, which the freeze +
            divergence guards do not see.

            Triage:
              - The raw events are in soroban_events (topic POOL/swap on
                the pool contract) — find the tx_hash(es) and signer.
              - Cross-check the pool's constituent assets for a spot-price
                walk over the burst window.
              - If confirmed benign (a pool op we don't yet model), widen
                or silence; if malicious, follow the incident runbook.
            Runbook: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/amm-self-pair-swap-burst.md
