---
# Host + disk + NVMe + ZFS alerts. Complements the per-service
# rules — these catch the substrate failing out from under us.

groups:
  - name: stellarindex.infra
    interval: 30s
    rules:

      # F-1329: the scrape job is `node_exporter` in both the multi-host
      # (configs/ansible/.../prometheus.yml.j2) and r1
      # (configs/prometheus/prometheus.r1.yml) configs — there is no
      # `node` job, so `up{job="node"}` matched nothing and this alert
      # was dead. (The r1 overlay twin already used `node_exporter`.)
      - alert: stellarindex_host_down
        expr: up{job="node_exporter"} == 0
        for: 2m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/host-down.md
          summary: "Host {{ $labels.instance }} unreachable"
          description: |
            node_exporter on {{ $labels.instance }} hasn't scraped in 2+ min.
            Either the host is down or the scrape path is broken. Service-
            level alerts (timescale/redis/api) on this host will also fire.

      - alert: stellarindex_host_cpu_high
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: informational
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/host-cpu-high.md
          summary: "Host {{ $labels.instance }} CPU at {{ $value | humanize }}%"
          description: |
            CPU > 90 % for 10+ minutes. Either a runaway process or undersized
            host. Dashboards show which service is the top consumer.

      - alert: stellarindex_host_memory_high
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
            / node_memory_MemTotal_bytes * 100 > 90
        for: 10m
        labels:
          severity: informational
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/host-memory-high.md
          summary: "Host {{ $labels.instance }} memory at {{ $value | humanize }}%"
          description: |
            > 90 % memory for 10+ min. OOMKill risk. Check per-service
            allocations; Postgres shared_buffers is the usual culprit if
            the box also runs other workloads.

      # F-1329: repointed from the never-emitted `node_zfs_pool_state`
      # (with UPPERCASE state values + a `pool` label) to node_exporter's
      # real ZFS collector metric `node_zfs_zpool_state`. That metric uses
      # LOWERCASE state values (online|degraded|faulted|offline|removed|
      # unavail|suspended) and labels the pool as `zpool`, with value 1 on
      # the pool's current state. The old name had no producer, so this
      # PAGE was silently dead through the 2026-05-17 zpool incident.
      - alert: stellarindex_zfs_pool_degraded
        expr: node_zfs_zpool_state{state=~"degraded|faulted|unavail|suspended"} > 0
        for: 60s
        labels:
          severity: page
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/zfs-degraded.md
          summary: "ZFS pool {{ $labels.zpool }} is {{ $labels.state }} (SEV-1)"
          description: |
            The data ZFS pool reports {{ $labels.state }} — one or more drives
            have failed. This pool is raidz1 (single parity): it tolerates
            only ONE drive failure — a second failure before the resilver
            completes means data loss. Replace + resilver IMMEDIATELY.

      # ── Pool capacity ─────────────────────────────────────────────
      # No zpool-level capacity metric on this box: node_exporter's ZFS
      # collector here exports only node_zfs_zpool_state + dataset IO
      # counters (no size/alloc/free). All ZFS datasets share the pool's
      # free space, so node_filesystem_avail_bytes{fstype="zfs"} (identical
      # across every dataset) is the pool-free proxy. Added 2026-07-17 after
      # the live R1 review found a ~90%-full pool with NO fullness alert.
      #
      # C6-118 (2026-07-26): the thresholds used to be ABSOLUTE bytes
      # (1.3e12 / 0.65e12), hand-calibrated to r1's ~16.8 TiB pool and
      # shipped VERBATIM to configs/prometheus/rules.r1 and to every other
      # host this file is deployed to. On a host with a differently-sized
      # pool the same numbers mean something else entirely: r2/r3 (ADR-0016)
      # have their own topologies, and a 2 TB box that is 90 % EMPTY still
      # trips a 1.3 TB floor (permanent false ticket), while a 100 TB box at
      # 98 % full never trips it at all (silent, which is the dangerous
      # direction). The floors are now RATIOS of pool capacity, so they
      # travel to any host unchanged.
      #
      # Pool capacity has to be reconstructed from the dataset series
      # because there is no zpool size metric: every ZFS dataset reports
      # `size = <that dataset's used> + <shared pool avail>`, so
      #   pool_used  = sum(size - avail) over the datasets, and
      #   pool_avail = min(avail)         (identical across datasets),
      #   pool_total = pool_used + pool_avail.
      # A per-dataset `avail/size` ratio is NOT equivalent and must not be
      # substituted: it reads the free fraction as avail/(one dataset's used
      # + avail), so a pool whose data is spread across several datasets
      # reports a comfortable ratio while the pool itself is nearly full —
      # fail-open, the exact direction this alert exists to catch.
      #
      # Thresholds preserve r1's calibrated behaviour (1.3e12 and 0.65e12
      # against ~16.8 TiB usable ≈ 18.5e12 B → 7 % and 3.5 %). ZFS is
      # copy-on-write: it degrades sharply past ~90 % full and can stall
      # writes near-full, so both floors sit well above 0.
      #
      # SINGLE-POOL ASSUMPTION: instance-level aggregation treats all
      # fstype="zfs" mounts on a host as one pool (true on r1). A host with
      # two zpools needs a `device=~` / `mountpoint=~` selector added here,
      # or the two pools' used bytes are summed against one pool's free.
      - alert: stellarindex_zfs_pool_low_space
        expr: |
          min by (instance) (node_filesystem_avail_bytes{fstype="zfs"})
            /
          (
            sum by (instance) (
              node_filesystem_size_bytes{fstype="zfs"}
                - node_filesystem_avail_bytes{fstype="zfs"}
            )
            + min by (instance) (node_filesystem_avail_bytes{fstype="zfs"})
          ) < 0.07
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/zfs-pool-full.md
          summary: "ZFS data pool free space low ({{ $value | humanizePercentage }} of capacity free)"
          description: |
            Under 7 % of the ZFS data pool's capacity is free (on r1's raidz1
            ~16.8 TiB pool that is ~1.3 TB). All ZFS datasets share this pool,
            so every writer (ClickHouse lake, MinIO archive, Postgres,
            pgBackRest) is affected. ZFS is copy-on-write: performance
            degrades past ~90 % full and writes stall near-full. Plan
            reclamation (stale snapshots, pgBackRest off-box, TSDB
            compression) — see the storage section of the go-live master plan.
      - alert: stellarindex_zfs_pool_critical_space
        expr: |
          min by (instance) (node_filesystem_avail_bytes{fstype="zfs"})
            /
          (
            sum by (instance) (
              node_filesystem_size_bytes{fstype="zfs"}
                - node_filesystem_avail_bytes{fstype="zfs"}
            )
            + min by (instance) (node_filesystem_avail_bytes{fstype="zfs"})
          ) < 0.035
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/zfs-pool-full.md
          summary: "ZFS data pool CRITICALLY low ({{ $value | humanizePercentage }} of capacity free) (SEV-1)"
          description: |
            Under 3.5 % of the ZFS data pool's capacity is free (on r1's
            ~16.8 TiB pool that is ~650 GB). On a copy-on-write filesystem
            this risks write stalls / ingest failure across ClickHouse, MinIO,
            and Postgres. Reclaim space NOW (drop stale snapshots, move
            pgBackRest off-box) or ingestion will halt.

      # ── INERT — WRONG SERIES NAME, not "no producer" ──────────────
      # The two NVMe alerts below are inert because they name series
      # nothing emits: `node_disk_io_errors_total` and
      # `node_nvme_temperature_celsius` are not node_exporter metrics
      # (the diskstats collector has no io-errors series, and
      # node_exporter has no NVMe-thermal collector).
      #
      # This block USED TO justify that with "NEITHER a smartctl_exporter
      # nor a textfile-collector script is deployed today (configs/ansible
      # confirms only sla-probe + supply-snapshot write textfiles)". That
      # is FALSE and has been for some time (wave-D ALERT-09):
      # configs/ansible/roles/archival-node/tasks/10-observability.yml
      # installs a drop-in piping the packaged
      # `/usr/share/prometheus-node-exporter-collectors/nvme_metrics.py`
      # into the SCRAPED textfile dir as `nvme.prom`, and three LIVE
      # alerts already read its output — stellarindex_nvme_wear_high,
      # _spare_low and _media_errors in storage.yml, all on bare
      # `nvme_*` series.
      #
      # So the thermal alert is very likely one metric-name edit from
      # working: the sibling series follow the `nvme_<field>` convention
      # (`nvme_percentage_used_ratio`, `nvme_available_spare_ratio`), and
      # the temperature field would be `nvme_temperature_celsius`.
      #
      # NOT repointed here, deliberately. Confirming the series exists
      # needs one read on r1 —
      #   curl -s localhost:9100/metrics | grep '^nvme_temperature'
      # — and this change is repo-only. Repointing an expr at a series
      # that may not exist would swap an alert that is honestly inert for
      # one that LOOKS live and still cannot fire, which is strictly
      # worse. Operator: run the grep, then either repoint both trees or
      # replace this paragraph with the observed absence.
      #
      # TRACKED in scripts/ci/lint-metric-refs.sh's KNOWN_INERT list.
      - alert: stellarindex_nvme_smart_warn
        # INERT: node_disk_io_errors_total has no producer (see block above).
        expr: increase(node_disk_io_errors_total[1h]) > 0
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/nvme-smart.md
          summary: "NVMe {{ $labels.device }} reporting IO errors"
          description: |
            Any IO error on an NVMe is a warning sign — schedule a
            replacement during next maintenance window even if ZFS isn't
            complaining yet.

      - alert: stellarindex_nvme_thermal_throttle
        # INERT: node_nvme_temperature_celsius has no producer (see block above).
        expr: node_nvme_temperature_celsius > 70
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/nvme-thermal.md
          summary: "NVMe {{ $labels.device }} at {{ $value }}°C"
          description: |
            Enterprise NVMe spec'd to 70 °C. Above this it throttles IO →
            catchup slows, Postgres WAL flush stalls. Check chassis airflow
            + ambient temperature.

      # ── Catch-all: any systemd unit sitting in `failed` ───────────
      #
      # Most of this host's ~20 oneshot timers are named in NO alert
      # rule. directory-sync is the one that made this urgent: it is the
      # SOLE writer of account_directory, which the scam-pricing gate
      # reads on every aggregated price serve. It is Type=oneshot with
      # no OnFailure and no metric, so if it stops, the table freezes at
      # its last good snapshot, a newly-flagged scam issuer is never
      # learned, and the gate keeps serving — reproducing the incident
      # the gate was built to stop, with the gate present, correct, and
      # reading stale input (wave-D LID-6).
      #
      # Naming every unit individually is how that gap arose, so this is
      # the inverse: everything is covered unless a unit has its OWN
      # alert with better triage. The exclusion list lives at
      # scripts/ci/unit-failed-dedicated.baseline, and its self-test
      # asserts each entry really is named in a rule file — an exclusion
      # cannot be used to silence a unit nothing else watches.
      #
      # Ticket, not page: a failed oneshot is rarely customer-impacting
      # within minutes, and the units whose failure IS urgent already
      # have dedicated alerts at their own severities. `for: 15m` rides
      # out a unit that is failed-then-restarted by its own timer.
      - alert: stellarindex_worker_panicked
        # RAW value, not increase(). A recovered panic means that worker is
        # STOPPED until the process restarts, so the alert must describe the
        # DEAD STATE, not the moment of death. `increase(...[10m]) > 0`
        # auto-resolved about ten minutes after the panic while the worker
        # was still gone — an all-clear for a condition that had not
        # cleared. The counter resets on process start, which is exactly the
        # operator action that fixes it, so the raw form clears itself at the
        # right moment and only then. Same treatment as
        # stellarindex_decoder_panicked.
        expr: stellarindex_worker_panics_total > 0
        for: 0m
        labels:
          severity: page
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/worker-panicked.md
          summary: "background worker {{ $labels.worker }} panicked and is STOPPED (#368 M4)"
          description: |
            worker.Recover swallowed a panic in {{ $labels.worker }} so the
            process stayed up — but that worker will not run again until
            its unit restarts. Nothing downstream fires until the symptom
            (stale prices, unbounded table, cold cache) appears. See the
            runbook: identify the worker, restart the owning unit, file the
            panic as a bug.
      - alert: stellarindex_systemd_unit_failed
        expr: |
          node_systemd_unit_state{state="failed",name!~"verify-archive-tier-a\\.service|verify-archive-tier-b\\.service|ch-supply\\.service|pgbackrest-backup\\.service|ch-schema-snapshot\\.service"} == 1
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/systemd-unit-failed.md
          summary: "systemd unit {{ $labels.name }} is in failed state"
          description: |
            {{ $labels.name }} has been in `failed` for 15m+. Most of this
            host's oneshot timers write data something else reads and then
            trusts — a failed sync leaves a CONSUMER reading a frozen
            table rather than erroring, so the symptom usually appears
            somewhere else entirely.

            `systemctl status {{ $labels.name }}` then
            `journalctl -u {{ $labels.name }} --since -24h` for the cause.
