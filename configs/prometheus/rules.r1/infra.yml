---
# Host + disk + NVMe + ZFS alerts. Complements the per-service
# rules — these catch the substrate failing out from under us.

groups:
  - name: stellarindex.infra
    interval: 30s
    rules:

      # The scrape job is `node_exporter` (there is no `node` job). `up == 0`
      # cannot fire once a target drops out of service discovery, so the
      # `absent_over_time(...) == 1` arm covers that, as in meta.yml's
      # exporter-down alerts.
      - alert: stellarindex_host_down
        expr: |
          up{job="node_exporter"} == 0
          OR
          absent_over_time(up{job="node_exporter"}[5m]) == 1
        for: 2m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_host_down
          summary: "Host {{ $labels.instance }} unreachable"
          description: |
            node_exporter on {{ $labels.instance }} hasn't scraped in 2+ min.
            Either the host is down or the scrape path is broken. Service-
            level alerts (timescale/redis/api) on this host will also fire.

      - alert: stellarindex_host_cpu_high
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: informational
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_host_cpu_high
          summary: "Host {{ $labels.instance }} CPU at {{ $value | humanize }}%"
          description: |
            CPU > 90 % for 10+ minutes. Either a runaway process or undersized
            host. Dashboards show which service is the top consumer.

      - alert: stellarindex_host_memory_high
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
            / node_memory_MemTotal_bytes * 100 > 90
        for: 10m
        labels:
          severity: informational
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_host_memory_high
          summary: "Host {{ $labels.instance }} memory at {{ $value | humanize }}%"
          description: |
            > 90 % memory for 10+ min. OOMKill risk. Check per-service
            allocations; Postgres shared_buffers is the usual culprit if
            the box also runs other workloads.

      # node_exporter's ZFS metric is `node_zfs_zpool_state`, with LOWERCASE
      # state values and a `zpool` label; value 1 marks the current state. A
      # rule on a name with no producer is a silently dead PAGE.
      - alert: stellarindex_zfs_pool_degraded
        expr: node_zfs_zpool_state{state=~"degraded|faulted|unavail|suspended"} > 0
        for: 60s
        labels:
          severity: page
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_zfs_pool_degraded
          summary: "ZFS pool {{ $labels.zpool }} is {{ $labels.state }} (SEV-1)"
          description: |
            The data ZFS pool reports {{ $labels.state }} — one or more drives
            have failed. This pool is raidz1 (single parity): it tolerates
            only ONE drive failure — a second failure before the resilver
            completes means data loss. Replace + resilver IMMEDIATELY.

      # ── Pool capacity ──
      #
      # No zpool size metric exists, so capacity is rebuilt from the dataset
      # series: each dataset reports size = its used + the shared pool avail,
      # so
      #   pool_used = sum(size - avail), pool_avail = min(avail), pool_total = used + avail.
      # A per-dataset avail/size ratio is NOT equivalent: with data spread
      # over several datasets it looks comfortable while the pool is nearly
      # full (fail-open).
      #
      # Floors are ratios so they hold on any pool size; absolute bytes would
      # false-ticket an empty small box and never trip on a large full one
      # (ADR-0016 hosts differ). 7 % and 3.5 % match r1's calibrated 1.3e12 /
      # 0.65e12 B on ~16.8 TiB. ZFS is copy-on-write and degrades sharply past
      # ~90 % full.
      #
      # SINGLE-POOL ASSUMPTION: instance-level aggregation treats all
      # fstype="zfs" mounts on a host as one pool (true on r1). A host with
      # two zpools needs a `device=~` / `mountpoint=~` selector, or the pools'
      # used bytes are summed against one pool's free.
      - alert: stellarindex_zfs_pool_low_space
        expr: |
          min by (instance) (node_filesystem_avail_bytes{fstype="zfs"})
            /
          (
            sum by (instance) (
              node_filesystem_size_bytes{fstype="zfs"}
                - node_filesystem_avail_bytes{fstype="zfs"}
            )
            + min by (instance) (node_filesystem_avail_bytes{fstype="zfs"})
          ) < 0.07
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
          alert_family: zfs_pool_capacity
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_zfs_pool_low_space
          summary: "ZFS data pool free space low ({{ $value | humanizePercentage }} of capacity free)"
          description: |
            Under 7 % of the ZFS data pool's capacity is free (on r1's raidz1
            ~16.8 TiB pool that is ~1.3 TB). All ZFS datasets share this pool,
            so every writer (ClickHouse lake, MinIO archive, Postgres,
            pgBackRest) is affected. ZFS is copy-on-write: performance
            degrades past ~90 % full and writes stall near-full. Plan
            reclamation (stale snapshots, pgBackRest off-box, TSDB
            compression) — see the storage section of the go-live master plan.
      - alert: stellarindex_zfs_pool_critical_space
        expr: |
          min by (instance) (node_filesystem_avail_bytes{fstype="zfs"})
            /
          (
            sum by (instance) (
              node_filesystem_size_bytes{fstype="zfs"}
                - node_filesystem_avail_bytes{fstype="zfs"}
            )
            + min by (instance) (node_filesystem_avail_bytes{fstype="zfs"})
          ) < 0.035
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: infra
          alert_family: zfs_pool_capacity
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_zfs_pool_critical_space
          summary: "ZFS data pool CRITICALLY low ({{ $value | humanizePercentage }} of capacity free) (SEV-1)"
          description: |
            Under 3.5 % of the ZFS data pool's capacity is free (on r1's
            ~16.8 TiB pool that is ~650 GB). On a copy-on-write filesystem
            this risks write stalls / ingest failure across ClickHouse, MinIO,
            and Postgres. Reclaim space NOW (drop stale snapshots, move
            pgBackRest off-box) or ingestion will halt.

      # ── NVMe error log + thermal ──
      #
      # Series come from the packaged nvme_metrics.py textfile collector
      # (archival-node 10-observability.yml), the same source as the
      # storage.yml wear alerts; node_exporter itself has no NVMe error-log or
      # thermal series.
      #
      # Fired-state coverage: deploy/monitoring/rule-tests/infra_test.yml.
      - alert: stellarindex_nvme_smart_warn
        # The controller's error log, not `nvme_media_errors_total`: that has
        # its own alert (stellarindex_nvme_media_errors, storage.yml) and
        # reusing it would notify twice. The error log is wider: timeouts and
        # transport errors never touch the media counter.
        expr: increase(nvme_num_err_log_entries_total[1h]) > 0
        # `for` 5m, not 1h: a `for` equal to the increase() window never
        # matures for an isolated error, because the expr goes false at the
        # same instant.
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_nvme_smart_warn
          summary: "NVMe {{ $labels.device }} logged new controller errors"
          description: |
            The drive's error-information log grew — an IO error, command
            timeout or transport error the controller recorded. Schedule a
            replacement during the next maintenance window even if ZFS
            isn't complaining yet.

      - alert: stellarindex_nvme_thermal_throttle
        expr: nvme_temperature_celsius > 70
        for: 5m
        labels:
          # Page: a drive past its rated ceiling throttles live IO and
          # accelerates its own wear, on a single-parity pool. A 24h-repeat
          # ticket is too slow.
          severity: page
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_nvme_thermal_throttle
          summary: "NVMe {{ $labels.device }} at {{ $value }}°C"
          description: |
            Enterprise NVMe spec'd to 70 °C. Above this it throttles IO →
            catchup slows, Postgres WAL flush stalls. Check chassis airflow
            + ambient temperature.

      # ── Textfile-collector scrape errors ──
      #
      # node_textfile_scrape_error is 1 when ANY textfile-collector file
      # failed to parse; that file's series then vanish and every alert
      # reading it goes quiet instead of firing. Watches the alert inputs
      # themselves (cf. stellarindex_metrics_registry_absent, metrics-
      # registry.yml).
      #
      # `for: 15m` rides out the tmp+mv atomic-write pattern: a scrape mid-
      # rename reads a transient error.
      - alert: stellarindex_textfile_scrape_error
        expr: node_textfile_scrape_error > 0
        for: 15m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_textfile_scrape_error
          summary: "node_exporter textfile collector on {{ $labels.instance }} has a scrape error"
          description: |
            node_textfile_scrape_error{instance="{{ $labels.instance }}"} = 1
            for 15+ min. Something under
            /var/lib/node_exporter/textfile_collector/ is malformed and
            node_exporter has stopped exporting that file's series.
            Every alert built on a textfile-sourced metric on this host
            (archive-completeness, sla-probe, nvme wear,
            process-mappings, zfs-snapshots, binary/stack version skew)
            is now blind to whatever that file reports, with no
            individual alert saying so. Runbook: find the bad file from
            node_exporter's own log, fix or remove it, confirm the
            gauge clears.

      # ── Catch-all: any systemd unit in `failed` ──
      #
      # Most oneshot timers are named in no alert. directory-sync is the sole
      # writer of account_directory (read by the scam-pricing gate); if it
      # fails silently the table freezes and the gate serves on stale input.
      # So everything is covered unless a unit has its OWN alert with better
      # triage.
      #
      # The exclusion list is scripts/ci/unit-failed-dedicated.baseline; its
      # self-test asserts each entry is named in a rule file, so an exclusion
      # cannot silence an unwatched unit.
      #
      # Ticket, not page: units whose failure is urgent have dedicated alerts.
      #
      # A oneshot re-run more often than the ride-out (ch-live-catchup, 10m)
      # dips to `activating` each run, which resolves a plain `== 1` and
      # resets `for`. max_over_time[10m] bridges the dips and `for:` grows by
      # the same 10m, so a failure must still persist 15m+.
      - alert: stellarindex_worker_panicked
        # RAW value, not increase(): a recovered panic leaves the worker
        # STOPPED until restart, so the alert must describe the dead state.
        # increase()[10m] would auto-resolve while the worker is still gone.
        # The counter resets on process start, which is the operator fix. Same
        # as stellarindex_decoder_panicked.
        expr: stellarindex_worker_panics_total > 0
        for: 0m
        labels:
          severity: page
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_worker_panicked
          summary: "background worker {{ $labels.worker }} panicked and is STOPPED (#368 M4)"
          description: |
            worker.Recover swallowed a panic in {{ $labels.worker }} so the
            process stayed up — but that worker will not run again until
            its unit restarts. Nothing downstream fires until the symptom
            (stale prices, unbounded table, cold cache) appears. See the
            runbook: identify the worker, restart the owning unit, file the
            panic as a bug.
      - alert: stellarindex_systemd_unit_failed
        expr: |
          max_over_time(node_systemd_unit_state{state="failed",name!~"verify-archive-tier-a\\.service|verify-archive-tier-b\\.service|ch-supply\\.service|pgbackrest-backup\\.service|ch-schema-snapshot\\.service|verify-served-values\\.service"}[10m]) == 1
        for: 25m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_systemd_unit_failed
          summary: "systemd unit {{ $labels.name }} is in failed state"
          description: |
            {{ $labels.name }} has been failing for 15m+, either
            sitting in `failed` or failing every run while its own
            timer keeps restarting it. Most of this host's oneshot
            timers write data something else reads and then trusts — a
            failed sync leaves a CONSUMER reading a frozen table rather
            than erroring, so the symptom usually appears somewhere
            else entirely.

            `systemctl status {{ $labels.name }}` then
            `journalctl -u {{ $labels.name }} --since -24h` for the cause.

      # keepalived-textfile-scraper.timer runs every 30s, and node_exporter
      # re-serves keepalived.prom's last value even if the timer is dead (same
      # frozen-file class as stellarindex_config_assertions_stale), which
      # stellarindex_haproxy_vip_owner cannot see. 10m tolerates ~20 missed
      # runs.
      - alert: stellarindex_keepalived_textfile_stale
        expr: time() - node_textfile_mtime_seconds{file="/var/lib/node_exporter/textfile_collector/keepalived.prom"} > 600
        for: 5m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_keepalived_textfile_stale
          summary: "keepalived-textfile-scraper has not run for 10m on {{ $labels.instance }}"
          description: |
            keepalived.prom has not been rewritten in 10+ minutes
            despite a 30s timer. stellarindex_haproxy_vip_owner is
            reading a frozen file, not live VRRP state. `systemctl
            status keepalived-textfile-scraper.timer`.

      # r1's boot/root disks are mdadm RAID1 (md0 swap, md1 /). A component
      # dropping out is the same redundancy loss
      # stellarindex_zfs_pool_degraded pages for, on the OS disks. Uses
      # node_md_disks{device,state}.
      - alert: stellarindex_md_array_degraded
        expr: node_md_disks{state="failed"} > 0
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_md_array_degraded
          summary: "mdadm array {{ $labels.device }} on {{ $labels.instance }} has a failed member disk"
          description: |
            node_md_disks reports a disk in the `failed` state for
            {{ $labels.device }}. A RAID1 array tolerates exactly one
            failed member — this is the moment redundancy is lost, not
            yet a data-loss event. Check `cat /proc/mdstat` and replace
            the failed member before a second disk fails.

      # A read-only remount (kernel-forced on block I/O error or corruption)
      # fails writes outright and is invisible to the disk-full alerts, since
      # free space still reports. fstype-excluded: pseudo-filesystems that are
      # read-only by design.
      - alert: stellarindex_filesystem_readonly
        expr: node_filesystem_readonly{fstype!~"tmpfs|squashfs|overlay|nsfs|ramfs"} == 1
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_filesystem_readonly
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is READ-ONLY"
          description: |
            {{ $labels.mountpoint }} ({{ $labels.device }}) has been
            remounted read-only by the kernel, almost always on an
            unrecoverable disk error. Every write to it — Postgres WAL if
            it's the DB volume, application logs if it's root — is now
            failing outright. `dmesg -T | grep -i "remount-ro\|EXT4-fs error\|XFS.*Corruption"`.

      # Bitmask from the drive's SMART log (nvme-cli `critical_warning`) via
      # the packaged nvme collector; see
      # infra.md#stellarindex_nvme_smart_warn. Any nonzero value is a flag
      # from the controller itself (temperature, spare, reliability, read-
      # only, backup device).
      - alert: stellarindex_nvme_critical_warning
        expr: nvme_critical_warning > 0
        for: 5m
        labels:
          severity: page
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_nvme_critical_warning
          summary: "NVMe {{ $labels.device }} reports a critical warning ({{ $value }})"
          description: |
            The drive controller's own critical_warning bitmask is
            nonzero on {{ $labels.device }} — the strongest signal this
            alert set has, direct from the drive rather than inferred
            from wear/spare/media counters. `smartctl -a` the device and
            treat as the other infra.md#stellarindex_nvme_smart_warn alerts.

      # pg_stat_archiver_last_archive_age is the same signal as
      # postgres.wal_archive_max_age_seconds in
      # internal/api/v1/diagnostics_backups.go. Continuous WAL archiving holds
      # the 5-min RPO between full backups (infra.md); 14d max observed was
      # 82s, so 600s is well above steady state.
      - alert: stellarindex_wal_archive_stale
        expr: pg_stat_archiver_last_archive_age > 600
        for: 10m
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_wal_archive_stale
          summary: "WAL archiving on {{ $labels.instance }} is {{ $value | humanizeDuration }} behind"
          description: |
            The newest archived WAL segment is over 10 minutes old.
            Continuous WAL archiving into repo1 (and repo2) is what holds
            the 5-min RPO between full pgBackRest backups — see
            infra.md#stellarindex_timescale_backup_none_24h's Step 4. Check
            `pg_stat_archiver.failed_count` and repo1's free space
            (`infra.md#stellarindex_zfs_pool_low_space`) first.

  # A 14-day trend needs no 30s cadence, and each evaluation walks two
  # weeks of samples.
  - name: stellarindex.infra_pool_trend
    interval: 15m
    rules:

      # Trend tier: the zfs_pool_capacity floors only speak past 93 % full,
      # leaving days to reclaim. These project free space forward against the
      # same reconstructed capacity, regressing over each day's TROUGH
      # (min_over_time 1d) so a transient backup/merge dip counts at its worst
      # and a one-scrape blip cannot swing the slope.
      #
      # Own alert_family: a projection is a different signal from the current-
      # state floors, so a trend page must not mute the 7 % ticket.
      - alert: stellarindex_zfs_pool_fill_85pct_within_30d
        expr: |
          predict_linear(
            (min by (instance) (min_over_time(node_filesystem_avail_bytes{fstype="zfs"}[1d])))[14d:1h],
            30 * 86400
          )
            /
          (
            sum by (instance) (
              node_filesystem_size_bytes{fstype="zfs"}
                - node_filesystem_avail_bytes{fstype="zfs"}
            )
            + min by (instance) (node_filesystem_avail_bytes{fstype="zfs"})
          ) < 0.15
        for: 1h
        labels:
          severity: ticket
          team: stellarindex
          component: infra
          alert_family: zfs_pool_fill_trend
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_zfs_pool_fill_85pct_within_30d
          summary: "ZFS data pool on course to pass 85 % full within 30 days ({{ $value | humanizePercentage }} of capacity free projected)"
          description: |
            A linear fit over the last 14 days of daily free-space troughs
            leaves under 15 % of the ZFS data pool free 30 days from now
            (or the troughs are already there). Past ~85-90 % full ZFS
            copy-on-write allocation slows and fragments. Plan reclamation
            now (stale snapshots, pgBackRest off-box, retention) while it
            is still a ticket.
      - alert: stellarindex_zfs_pool_fill_90pct_within_7d
        expr: |
          predict_linear(
            (min by (instance) (min_over_time(node_filesystem_avail_bytes{fstype="zfs"}[1d])))[14d:1h],
            7 * 86400
          )
            /
          (
            sum by (instance) (
              node_filesystem_size_bytes{fstype="zfs"}
                - node_filesystem_avail_bytes{fstype="zfs"}
            )
            + min by (instance) (node_filesystem_avail_bytes{fstype="zfs"})
          ) < 0.10
        for: 30m
        labels:
          severity: page
          team: stellarindex
          component: infra
          alert_family: zfs_pool_fill_trend
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/infra.md#stellarindex_zfs_pool_fill_90pct_within_7d
          summary: "ZFS data pool on course to pass 90 % full within 7 days ({{ $value | humanizePercentage }} of capacity free projected)"
          description: |
            A linear fit over the last 14 days of daily free-space troughs
            leaves under 10 % of the ZFS data pool free within a week. At
            this fill rate the 3.5 % critical floor (write stalls across
            ClickHouse, MinIO and Postgres) follows within days. Find what
            is filling the pool and reclaim before the floors fire.

      # needrestart is list-only, so the host runs superseded libraries until
      # reboot. Ticket-only with a 7d `for`: a single-box reboot is a
      # scheduled maintenance decision, never a page.
      - alert: stellarindex_node_reboot_required
        expr: node_reboot_required == 1
        for: 7d
        labels:
          severity: ticket
          team: stellarindex
          component: infra
        annotations:
          runbook_url: https://github.com/Stellar-Index/StellarIndex/blob/main/docs/operations/runbooks/ops-job-stalled.md#applying-pending-service-restarts-maintenance-step
          summary: "{{ $labels.instance }} has needed a reboot for 7d+ (running superseded libraries or kernel)"
          description: |
            node_reboot_required has been 1 for a week: an unattended
            security update installed something that only a reboot (or a
            service restart) applies. needrestart is list-only here, so
            nothing restarts services for us. Schedule a maintenance
            window and see the needrestart maintenance notes in the
            ops-job-stalled runbook before rebooting a node that is
            running heavy jobs.
