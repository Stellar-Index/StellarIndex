---
# Top-level playbook — brings a fresh Ubuntu 24.04 (or 22.04) box up
# as a Stellar Index archival node. Idempotent; safe to re-run.
#
# All apt-repo tasks use {{ ansible_distribution_release }} so the
# role itself is codename-agnostic; the assertion below just pins
# the supported-OS set explicitly so an accidental install on, say,
# Debian or CentOS fails loud rather than halfway-through.
#
# Usage:
#   ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml
#
# See configs/ansible/README.md for prerequisites.

- name: Bootstrap archival node
  hosts: archival_nodes
  become: true
  force_handlers: true  # #307: a failure after an acked galexie render must still flush Restart galexie (else a permanent 'false same')
  gather_facts: true

  pre_tasks:
    - name: Confirm Ubuntu 22.04 or 24.04 LTS
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_major_version in ["22", "24"]
        fail_msg: >-
          This role targets Ubuntu 22.04 or 24.04 LTS. Got
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.

  # Vault-encrypted region secrets (postgres passwords, MinIO keys,
  # healthcheck ping URLs). Wired 2026-07-03 — previously the README
  # implied it but nothing loaded the file, so every secret-using task
  # died on undefined vars. Override secrets_file for other regions.
  #
  # THE DEFAULT IS PRODUCTION. Forgetting `-e secrets_file=` while
  # targeting another region does not fail — it silently loads r1's
  # secrets and applies them to that host. On 2026-09-08 that reset a
  # test net's postgres role password to r1's value, leaving the env file
  # (correctly testnet's) and the database disagreeing: every service
  # there died on `failed SASL auth` and the API crash-looped until the
  # role password was put back. Nothing reached disk, because postgres
  # stores only a SCRAM hash — but a missing flag should not be able to
  # cross regions at all, so the assert below refuses the mismatch.
  vars_files:
    - "{{ secrets_file | default('../inventory/r1.secrets.yml') }}"

  pre_tasks:
    - name: Refuse a secrets file that does not belong to this inventory
      ansible.builtin.assert:
        that:
          - (secrets_file | default('../inventory/r1.secrets.yml')) is search(si_region_token)
        fail_msg: >-
          secrets_file resolves to
          '{{ secrets_file | default('../inventory/r1.secrets.yml') }}'
          but this play targets '{{ si_region_token }}'. Pass
          -e secrets_file=../inventory/{{ si_region_token }}.secrets.yml.
          The default is r1's, so an omitted flag would apply PRODUCTION
          secrets to this host.
        success_msg: "secrets file matches the target region ({{ si_region_token }})"
      vars:
        # region_id is what every inventory actually declares (r1 /
        # testnet / futurenet). It is REQUIRED here rather than defaulted:
        # defaulting it to 'r1' is what made the first version of this
        # assert pass trivially on a test net — the guard agreed with the
        # mistake it exists to catch.
        si_region_token: "{{ region_id }}"
      tags: [always]

  roles:
    - role: archival-node
