---
# Brings up Prometheus + Alertmanager on the dedicated prometheus_pair hosts.
# Never an archival node: the role renders the whole-host /etc/nftables.conf,
# which would drop that host's public ports (the role's preflight asserts this
# under any --tags selection). Companion to playbooks/archival-node.yml, which
# installs node_exporter and the metric ports; this wires scrape + alert routing
# on top. Idempotent. Split out so operators running their own Prometheus stack
# (Grafana Cloud, a cross-region aggregator) can skip it.
#
#   ansible-playbook -i <multi-host inventory> playbooks/monitoring.yml
#
# NOT runnable against inventory/r1.yml: the prometheus role is the MULTI-HOST
# shape (roles/prometheus/tasks/01-preflight.yml requires a `prometheus_pair`
# group of exactly two hosts plus a populated stellarindex_api/_aggregator/
# _indexer scrape-target group). r1.yml has one `archival_nodes` host, so the
# play matches no hosts and changes nothing.
#
# r1's Prometheus + Alertmanager are managed out-of-band:
# configs/prometheus/rules.r1/ (kept in lockstep with deploy/monitoring/rules/
# by scripts/ci/lint-rule-equivalence) and configs/alertmanager/alertmanager.r1.yml
# + apply.sh. A single-host path in the prometheus role is on the L4 cutover
# backlog (configs/ansible/README.md).
#
# A single-host SCRAPE-ONLY path exists in the other role:
# roles/archival-node/tasks/23-local-prometheus.yml (`run_local_prometheus`,
# default false, tag `local-prometheus`). It installs the distro package and a
# localhost scrape config, with no Alertmanager or rules, as the metrics backend
# /v1/status reads. The test nets use it; r1 does not. It does not replace this
# playbook on a multi-host deployment.
#
# Per-deployment configuration (inventory `vars:`):
#   - alertmanager_healthchecks_deadmansswitch_url
#   - alertmanager_discord_webhook_url_pages   (page tier -> #pages; empty -> no fanout)
#   - alertmanager_discord_webhook_url_alerts  (ticket tier -> #alerts; empty -> no fanout)
#   - alertmanager_discord_webhook_url_informational
#         (informational tier -> its OWN low-traffic channel, not #alerts;
#          empty -> no fanout, a black hole)
#   - alertmanager_healthchecks_alert_delivery_url
#         (out-of-band leg for a refused chat delivery; empty -> the only
#          signal of a delivery outage travels the failing path)
#   - alertmanager_pagerduty_key               (optional)
#
# Pass the webhook URLs via ansible-vault (e.g. an encrypted
# inventory/r1.secrets.yml unlocked with --ask-vault-pass); never commit a
# webhook. Empty strings are accepted and degrade to "alerts visible in the
# Alertmanager UI only".
#
# The standalone configs/alertmanager/alertmanager.r1.yml + apply.sh are the
# pre-Ansible bootstrap path and stay valid for one-off emergency edits; the
# template here is the preferred one. They must route identically:
# scripts/ci/check-alertmanager-parity.sh renders both with the same inputs and
# fails on any structural difference, since a receiver added to only the
# standalone file would make this playbook route those alerts to nobody.
# route those alerts back to a receiver that delivers to nobody.

- name: Monitoring (Prometheus + Alertmanager)
  hosts: prometheus_pair
  become: true
  gather_facts: true

  roles:
    - prometheus
