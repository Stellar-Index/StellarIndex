---
# Deploy one or more stellarindex-* binaries to a single host.
#
# Triggered by .github/workflows/deploy.yml; not normally run by
# hand. The workflow has already:
#   - Downloaded each binary from the GitHub Release artefacts
#   - Verified SHA256 against the release's SHA256SUMS
#   - Set up SSH key + known_hosts
#
# Required vars (passed via -e from the workflow):
#   version              — SemVer tag being deployed (e.g. v0.2.0)
#   binaries_csv         — comma-separated list (e.g. "stellarindex-api,stellarindex-indexer")
#   local_dist_dir       — path on the controller (Action runner) holding
#                          the binaries; each is named "<binary>-linux-amd64"
#   health_grace_seconds — sleep before /v1/healthz probe (api only)
#   pgbackrest_backup_enabled — "true" on hosts with a pgBackRest
#                          stellarindex stanza (r1); "false" on the
#                          test-net VMs, which have no pgbackrest at all
#                          (18-pgbackrest-backup.yml). Defaults TRUE
#                          (fail closed). deploy.yml sets it per region.
#
# Per-binary sequence:
#   1. Resolve the running version (from --help output or version pkg)
#      so we can stamp the backup filename meaningfully.
#   2. Copy the new binary to /usr/local/bin/<binary>.new (atomic stage).
#   3. Move current binary to /usr/local/bin/<binary>.prev-<running-version>.
#   4. Atomic rename .new → live path (a single rename(2) is atomic
#      across the same filesystem; mv is just a wrapper around it).
#   5. systemctl restart <binary>.
#   6. Health probe:
#         api → curl http://127.0.0.1:3000/v1/healthz expects 200
#         indexer / aggregator / other → systemctl is-active expects "active"
#      after `health_grace_seconds` to give the service a moment to
#      open its listening sockets.
#   7. On any failure in steps 5-6, rollback: move .prev back to live
#      path, restart, leave host in known-good state. Playbook exits
#      non-zero so the workflow surfaces the failure.

- name: Deploy stellarindex binaries
  hosts: all
  gather_facts: false
  become: false                         # workflow already runs as root
  vars:
    binary_list: "{{ binaries_csv.split(',') | map('trim') | list }}"
    install_dir: /usr/local/bin
    api_port: 3000
    api_health_path: /v1/healthz
    # CLI tools — no systemd service to restart, no health probe.
    # The deploy steps short-circuit to a `<binary> -version`
    # smoke test for these. Adding a new daemon binary? Don't
    # touch this; it's the deny-list.
    cli_binaries:
      - stellarindex-ops
      - stellarindex-migrate
      - stellarindex-sla-probe

  pre_tasks:
    - name: Verify required vars are set
      ansible.builtin.assert:
        that:
          - version is defined and version | length > 0
          - binaries_csv is defined and binaries_csv | length > 0
          - local_dist_dir is defined and local_dist_dir | length > 0
          - binary_list | length > 0
        fail_msg: "Missing required deploy vars (version, binaries_csv, local_dist_dir)"

    - name: Confirm SSH connectivity
      ansible.builtin.ping:

    # F-1220 (codex audit-2026-05-12): migration sync + apply
    # before any binary swap. The previous flow could restart a
    # binary onto a database whose schema_migrations was older
    # than the binary expected, producing partial-outage shapes
    # at runtime even though /v1/healthz returned 200. Now the
    # playbook ships the migrations dir from the controller and
    # runs `stellarindex-migrate up` BEFORE touching any binary.
    # Idempotent — golang-migrate skips already-applied versions.
    #
    # ONE archive transfer (ansible.builtin.unarchive) + explicit prune —
    # see ../tasks/sync-migrations.yml for the full history. In short:
    # ansible.posix.synchronize's rsync runs on the CONTROLLER and never
    # sees the `--ssh-common-args "-o ProxyJump=…"` deploy.yml uses for
    # the NAT-only test-net VMs (deploy-ansible-deploy-2); the
    # directory-src ansible.builtin.copy that replaced it (#268) is
    # connection-agnostic but O(files) — > 16 min for 291 unchanged
    # files on the r1 v0.49.0 deploy (run 33244745680) — and dropped
    # synchronize's `delete: true`. unarchive rides the same connection
    # as every other module (jump-safe) and moves the tree in one go.
    # `import_tasks` (static) so --syntax-check and lint-deploy-playbook
    # cover the task file; the `when:` below applies to every task in it.
    - name: Sync migrations from controller (one archive transfer + prune)
      ansible.builtin.import_tasks: ../tasks/sync-migrations.yml
      when:
        - local_dist_dir is defined
        # `| bool` is load-bearing: deploy.yml passes this via
        # `-e "migrations_skip=false"`, which arrives as the STRING
        # "false" — truthy in Jinja, so a bare `not migrations_skip`
        # silently SKIPPED every deploy's migration apply (the F-1220
        # safety feature was a no-op). `| bool` coerces "false"→False.
        - not (migrations_skip | default(false) | bool)

    # C6-107 (audit-2026-07-23): the binary is backed up before a deploy
    # (deploy-one-binary.yml `mv` to .prev-<version>) — the SCHEMA is not.
    # `stellarindex-migrate up` below runs arbitrary DDL against the live
    # database with no snapshot and no proof that a recent restorable
    # backup exists, so a destructive or wrong migration is unrecoverable
    # beyond whatever pgBackRest happens to hold. Sibling of the tracked
    # CID-14.
    #
    # This gate asserts a RESTORABLE backup finished recently, straight
    # from `pgbackrest info --output=json` (backup[-1].timestamp.stop is
    # the completion epoch of the newest backup in the stanza). It fails
    # CLOSED: a pgbackrest that is missing, erroring, or reporting an
    # empty/`error: true` stanza aborts the deploy rather than reading as
    # "fresh" — an un-inspectable backup is exactly the state where you
    # least want to run DDL.
    #
    # Deliberately NOT a `pg_dump`/snapshot step: on a multi-TB TimescaleDB
    # a pre-migration dump would add hours to every deploy. pgBackRest's
    # daily full/diff (18-pgbackrest-backup.yml) plus WAL archiving already
    # gives PITR to any moment; what was missing was proof it is CURRENT
    # before we mutate the schema.
    #
    # Overrides: `-e backup_freshness_max_age_hours=N` widens the window;
    # `-e backup_freshness_skip=true` bypasses entirely (emergency
    # hot-fix). Skipping is loud — the debug task below prints why.
    #
    # `pgbackrest_backup_enabled=false` is the HOST-SHAPE bypass: the
    # test-net VMs never get pgbackrest (18-pgbackrest-backup.yml — no
    # apt task, provisioned out of band on pubnet only), so on them this
    # fail-closed gate can only ever exit 1 and the only way to deploy
    # was migrations_skip=true — i.e. never applying schema from the
    # workflow at all. deploy.yml passes the flag per region; the ad-hoc
    # `-i host,` inventory means the role's inventory var of the same
    # name is NOT loaded here, so it must arrive via -e. Defaults true.
    - name: Assert a recent restorable pgBackRest backup exists before migrating
      ansible.builtin.shell:
        # `set -o pipefail` is a bashism; ansible.builtin.shell defaults to
        # /bin/sh (dash on r1), which errors "Illegal option -o pipefail"
        # BEFORE the check runs — so the gate must run under bash. The cmd
        # genuinely pipes `pgbackrest … | python3`, so pipefail is load-
        # bearing here, not decoration.
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          max_age_hours={{ backup_freshness_max_age_hours | default(36) | int }}
          if ! command -v pgbackrest >/dev/null 2>&1; then
            echo "pgbackrest not installed — refusing to migrate without a restorable backup" >&2
            exit 1
          fi
          info=$(runuser -u postgres -- pgbackrest --stanza=stellarindex --output=json info)
          echo "$info" | python3 -c '
          import json, sys, time
          max_age = int(sys.argv[1]) * 3600
          stanzas = json.load(sys.stdin)
          if not stanzas:
              sys.exit("pgbackrest info returned no stanza — cannot prove a backup exists")
          st = stanzas[0]
          if st.get("status", {}).get("code", 1) != 0:
              sys.exit("stanza status is not ok: %s" % st.get("status"))
          backups = st.get("backup") or []
          if not backups:
              sys.exit("stanza has ZERO backups — refusing to migrate")
          newest = backups[-1]
          stop = int(newest["timestamp"]["stop"])
          age = int(time.time()) - stop
          label = newest.get("label", "?")
          if age > max_age:
              sys.exit("newest backup %s finished %ds ago (> %ds) — refusing to migrate onto a stale backup" % (label, age, max_age))
          print("pgbackrest: newest backup %s is %dh old (limit %dh) — OK to migrate" % (label, age // 3600, max_age // 3600))
          ' "$max_age_hours"
      register: backup_freshness
      changed_when: false
      when:
        - not (migrations_skip | default(false) | bool)
        - not (backup_freshness_skip | default(false) | bool)
        - pgbackrest_backup_enabled | default(true) | bool

    - name: Report backup freshness verdict
      ansible.builtin.debug:
        msg: "{{ backup_freshness.stdout | default('') }}"
      when:
        - backup_freshness is defined
        - backup_freshness.stdout is defined

    - name: Backup-freshness gate skipped — operator override
      ansible.builtin.debug:
        msg: |
          backup_freshness_skip=true — running migrations WITHOUT proving a
          recent restorable backup exists. If this migration is destructive
          there is no verified recovery point. Use only for hot-fix deploys
          whose migrations you have read.
      when:
        - not (migrations_skip | default(false) | bool)
        - backup_freshness_skip | default(false) | bool

    - name: Backup-freshness gate skipped — host has no pgBackRest stanza
      ansible.builtin.debug:
        msg: |
          pgbackrest_backup_enabled=false — this host (test-net shape) has
          no pgBackRest stanza, so migrations run WITHOUT a verified
          recovery point. Expected on testnet/futurenet; NEVER pass this
          for r1.
      when:
        - not (migrations_skip | default(false) | bool)
        - not (backup_freshness_skip | default(false) | bool)
        - not (pgbackrest_backup_enabled | default(true) | bool)

    - name: Apply outstanding migrations
      # Source the host's env (STELLARINDEX_POSTGRES_DSN — the real,
      # password-bearing DSN that the services already use) and let
      # stellarindex-migrate read it, rather than the old hardcoded
      # passwordless `postgres://stellarindex@127.0.0.1` DSN, which fails
      # auth against the live db (28P01 — F-1301). That auth failure is why
      # operators set migrations_skip=true; with the `| bool` skip fix this
      # step actually runs now, so it has to use working credentials. Same
      # mechanism as the bootstrap role + manual applies. An operator can
      # still override with -e migrate_dsn=… .
      #
      # The env file is read VERBATIM, not `.`-sourced: it is systemd
      # EnvironmentFile syntax (unquoted values), so sourcing it lets sh
      # expand `$`, split on `;`/`&`/`|`/whitespace and strip quotes inside
      # the password — the services (systemd reads the raw line) keep
      # working while migrate gets a mangled DSN and fails 28P01, or worse
      # runs the tail of the secret as root (deploy-ansible-secrets-5).
      # POSIX loop (this runs under /bin/sh); same reader as run-heavy-job.sh.
      ansible.builtin.shell:
        cmd: |
          set -eu
          {% if migrate_dsn is defined and migrate_dsn | length > 0 %}
          export STELLARINDEX_POSTGRES_DSN={{ migrate_dsn | quote }}
          {% else %}
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              [A-Za-z_]*=*) export "$line" ;;
            esac
          done < /etc/default/stellarindex
          {% endif %}
          /usr/local/bin/stellarindex-migrate -migrations /usr/local/share/stellarindex/migrations up
      register: migrate_result
      # `migrated to version` is what cmdUp actually prints on success; its
      # only other output is "already at latest version — nothing to do".
      # This used to test for "migrations applied", a string the binary
      # never emits (it exists only in cmdStatus, which this task does not
      # run), so EVERY deploy reported the schema step as ok/changed=0 —
      # including deploys that applied new hypertables requiring a
      # follow-up projector-replay (cold audit 2026-08-04).
      changed_when: "'migrated to version' in migrate_result.stdout"
      failed_when: migrate_result.rc != 0
      when: not (migrations_skip | default(false) | bool)

    - name: Migration sync skipped — operator override
      ansible.builtin.debug:
        msg: |
          migrations_skip=true — skipping migration sync + apply.
          Use this ONLY for hot-fix deploys where you've verified
          the schema is unchanged from the prior tag.
      when: migrations_skip | default(false) | bool

  tasks:
    - name: Per-binary deploy
      include_tasks: ../tasks/deploy-one-binary.yml
      loop: "{{ binary_list }}"
      loop_control:
        loop_var: binary

  post_tasks:
    - name: Deploy summary
      ansible.builtin.debug:
        msg: >-
          Deployed version={{ version }} binaries={{ binary_list | join(',') }}
          to {{ inventory_hostname }}.
