---
# Deploy one or more stellarindex-* binaries to a single host.
#
# Triggered by .github/workflows/deploy.yml (which has already verified SHA256
# and set up SSH); not normally run by hand.
#
# Required vars (-e from the workflow):
#   version              — SemVer tag being deployed
#   binaries_csv         — comma-separated binaries
#   local_dist_dir       — controller dir holding "<binary>-linux-amd64" files
#   health_grace_seconds — sleep before the readiness probe
#   pgbackrest_backup_enabled — "false" on test-net VMs (no pgbackrest, see
#                          18-pgbackrest-backup.yml). Defaults TRUE (fail closed);
#                          deploy.yml sets it per region.
#
# Per-binary sequence: stage <binary>.new, move live to .prev-<running-version>,
# atomic rename .new into place, restart, health probe (api: /v1/readyz;
# daemons: /readyz on daemon_ready_ports). Any failure in restart/probe rolls
# back to .prev and exits non-zero. /v1/healthz is not used: it is a
# constant-200 liveness probe that never touches the schema/DB checks HAProxy
# routes on, so a binary readyz would refuse could pass it and get drained.

- name: Deploy stellarindex binaries
  hosts: all
  gather_facts: false
  become: false                         # workflow already runs as root
  vars:
    binary_list: "{{ binaries_csv.split(',') | map('trim') | list }}"
    install_dir: /usr/local/bin
    api_port: 3000
    # Not /v1/healthz: HAProxy routes on /v1/readyz (Postgres + schema version).
    api_health_path: /v1/readyz
    # Other daemons are probed on their metrics listener's /readyz (schema-head
    # check), not `systemctl is-active`, which reads "active" for a process failing
    # every write. Ports: local_prometheus_{indexer,aggregator}_port. A daemon
    # missing here fails its deploy rather than going unprobed.
    daemon_ready_ports:
      stellarindex-indexer: 9464
      stellarindex-aggregator: 9465
    # CLI tools: no service to restart; deploy runs a `<binary> -version` smoke
    # test. This is the deny-list; do not touch it for a new daemon.
    cli_binaries:
      - stellarindex-ops
      - stellarindex-migrate
      - stellarindex-sla-probe

  pre_tasks:
    - name: Verify required vars are set
      ansible.builtin.assert:
        that:
          - version is defined and version | length > 0
          - binaries_csv is defined and binaries_csv | length > 0
          - local_dist_dir is defined and local_dist_dir | length > 0
          - binary_list | length > 0
        fail_msg: "Missing required deploy vars (version, binaries_csv, local_dist_dir)"

    - name: Confirm SSH connectivity
      ansible.builtin.ping:

    # Migrations run BEFORE any binary swap: a binary on an older schema_migrations
    # than it expects half-fails at runtime while /v1/healthz still returns 200.
    #
    # unarchive + explicit prune, see ../tasks/sync-migrations.yml: synchronize's
    # rsync runs on the controller and ignores deploy.yml's ProxyJump for test-net
    # VMs; a directory copy is O(files) (> 16 min for 291 files) and has no delete.
    # import_tasks (static) so --syntax-check and lint-deploy-playbook cover the
    # task file; the `when:` below applies to every task in it.
    - name: Sync migrations from controller (one archive transfer + prune)
      ansible.builtin.import_tasks: ../tasks/sync-migrations.yml
      when:
        - local_dist_dir is defined
        # `| bool` is load-bearing: deploy.yml passes migrations_skip=false as the
        # STRING "false", truthy in Jinja, so a bare `not` would skip every migration.
        - not (migrations_skip | default(false) | bool)

    # The binary is backed up before a deploy; the SCHEMA is not, and
    # `stellarindex-migrate up` runs arbitrary DDL. This gate asserts a restorable
    # backup finished recently, from `pgbackrest info --output=json`
    # (backup[-1].timestamp.stop). It fails CLOSED: a missing, erroring or
    # empty/`error: true` pgbackrest aborts the deploy.
    #
    # Not a pg_dump step: on multi-TB TimescaleDB that adds hours per deploy.
    # pgBackRest (18-pgbackrest-backup.yml) already gives PITR; this proves it is
    # CURRENT before mutating the schema.
    #
    # `-e backup_freshness_max_age_hours=N` widens the window;
    # `-e backup_freshness_skip=true` bypasses (emergency hot-fix; the debug task
    # below prints why).
    #
    # `pgbackrest_backup_enabled=false` is the host-shape bypass for test-net VMs,
    # which have no pgbackrest. It must arrive via -e: the ad-hoc `-i host,`
    # inventory does not load the role's variable of the same name.
    - name: Assert a recent restorable pgBackRest backup exists before migrating
      ansible.builtin.shell:
        # `set -o pipefail` needs bash (ansible shell defaults to dash on r1, which
        # errors before the check runs); the cmd pipes `pgbackrest … | python3`.
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          max_age_hours={{ backup_freshness_max_age_hours | default(36) | int }}
          if ! command -v pgbackrest >/dev/null 2>&1; then
            echo "pgbackrest not installed — refusing to migrate without a restorable backup" >&2
            exit 1
          fi
          info=$(runuser -u postgres -- pgbackrest --stanza=stellarindex --output=json info)
          echo "$info" | python3 -c '
          import json, sys, time
          max_age = int(sys.argv[1]) * 3600
          stanzas = json.load(sys.stdin)
          if not stanzas:
              sys.exit("pgbackrest info returned no stanza — cannot prove a backup exists")
          st = stanzas[0]
          if st.get("status", {}).get("code", 1) != 0:
              sys.exit("stanza status is not ok: %s" % st.get("status"))
          backups = st.get("backup") or []
          if not backups:
              sys.exit("stanza has ZERO backups — refusing to migrate")
          newest = backups[-1]
          stop = int(newest["timestamp"]["stop"])
          age = int(time.time()) - stop
          label = newest.get("label", "?")
          if age > max_age:
              sys.exit("newest backup %s finished %ds ago (> %ds) — refusing to migrate onto a stale backup" % (label, age, max_age))
          print("pgbackrest: newest backup %s is %dh old (limit %dh) — OK to migrate" % (label, age // 3600, max_age // 3600))
          ' "$max_age_hours"
      register: backup_freshness
      changed_when: false
      when:
        - not (migrations_skip | default(false) | bool)
        - not (backup_freshness_skip | default(false) | bool)
        - pgbackrest_backup_enabled | default(true) | bool

    - name: Report backup freshness verdict
      ansible.builtin.debug:
        msg: "{{ backup_freshness.stdout | default('') }}"
      when:
        - backup_freshness is defined
        - backup_freshness.stdout is defined

    - name: Backup-freshness gate skipped — operator override
      ansible.builtin.debug:
        msg: |
          backup_freshness_skip=true — running migrations WITHOUT proving a
          recent restorable backup exists. If this migration is destructive
          there is no verified recovery point. Use only for hot-fix deploys
          whose migrations you have read.
      when:
        - not (migrations_skip | default(false) | bool)
        - backup_freshness_skip | default(false) | bool

    - name: Backup-freshness gate skipped — host has no pgBackRest stanza
      ansible.builtin.debug:
        msg: |
          pgbackrest_backup_enabled=false — this host (test-net shape) has
          no pgBackRest stanza, so migrations run WITHOUT a verified
          recovery point. Expected on testnet/futurenet; NEVER pass this
          for r1.
      when:
        - not (migrations_skip | default(false) | bool)
        - not (backup_freshness_skip | default(false) | bool)
        - not (pgbackrest_backup_enabled | default(true) | bool)

    - name: Cancel an in-flight asset-volume-character roll
      ansible.builtin.import_tasks: ../tasks/cancel-asset-character-roll.yml
      vars:
        cancel_dsn: "{{ migrate_dsn | default('') }}"
      when: not (migrations_skip | default(false) | bool)

    - name: Apply outstanding migrations
      # Source the host's env (STELLARINDEX_POSTGRES_DSN, the real password-bearing
      # DSN); a hardcoded passwordless DSN fails auth (28P01). -e migrate_dsn=…
      # overrides.
      #
      # The env file is read VERBATIM, not `.`-sourced: it is systemd
      # EnvironmentFile syntax (unquoted), so sourcing lets sh expand `$`, split on
      # `;&|`/whitespace and strip quotes in the password, mangling the DSN or
      # running the tail of the secret as root.
      # POSIX loop (runs under /bin/sh); same reader as run-heavy-job.sh.
      #
      # PGOPTIONS: guards against a DDL lock convoy. An ACCESS EXCLUSIVE request
      # queues behind a long read, and the FIFO lock queue then blocks every later
      # reader. lib/pq (golang-migrate's driver) reads PGOPTIONS as backend startup
      # options, i.e. a session SET before every migration without editing immutable
      # files. An `options=` param in -e migrate_dsn=… REPLACES this string (DSN beats
      # env), so a migration needing more than 5min passes
      # `options=-c lock_timeout=5s -c statement_timeout=<N>` URL-encoded there.
      # Failure aborts the deploy (fail-closed); retry in a low-write window.
      # `timeout 900` below covers a hang that is not a lock wait; shell/command have
      # no task-level timeout.
      environment:
        PGOPTIONS: "-c lock_timeout=5s -c statement_timeout=5min"
      ansible.builtin.shell:
        cmd: |
          set -eu
          {% if migrate_dsn is defined and migrate_dsn | length > 0 %}
          export STELLARINDEX_POSTGRES_DSN={{ migrate_dsn | quote }}
          {% else %}
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              [A-Za-z_]*=*) export "$line" ;;
            esac
          done < /etc/default/stellarindex
          {% endif %}
          timeout 900 /usr/local/bin/stellarindex-migrate -migrations /usr/local/share/stellarindex/migrations up
      register: migrate_result
      # `migrated to version` is what cmdUp prints on success (its only other output
      # is "already at latest version"). "migrations applied" exists only in
      # cmdStatus, so testing for it would report every deploy as changed=0.
      changed_when: "'migrated to version' in migrate_result.stdout"
      failed_when: migrate_result.rc != 0
      when: not (migrations_skip | default(false) | bool)

    - name: Migration sync skipped — operator override
      ansible.builtin.debug:
        msg: |
          migrations_skip=true — skipping migration sync + apply.
          Use this ONLY for hot-fix deploys where you've verified
          the schema is unchanged from the prior tag.
      when: migrations_skip | default(false) | bool

  tasks:
    - name: Per-binary deploy
      include_tasks: ../tasks/deploy-one-binary.yml
      loop: "{{ binary_list }}"
      loop_control:
        loop_var: binary

  post_tasks:
    - name: Check whether this host runs the ClickHouse schema-drift check
      ansible.builtin.stat:
        path: /usr/local/bin/ch-schema-drift.sh
      register: ch_schema_drift_script

    # The drift check refuses a verdict when the shipped intent's Intent-Version
    # predates the running release.
    - name: Re-stamp the ClickHouse schema-drift intent with this release
      ansible.builtin.import_tasks: ../tasks/ship-ch-schema-intent.yml
      when: ch_schema_drift_script.stat.exists

    # Exit 1 (real drift) must not fail a binary deploy that is already
    # live; the check writes its own gauges either way.
    - name: Re-run the schema-drift check against the new intent
      ansible.builtin.command: systemctl start ch-schema-drift.service
      changed_when: false
      failed_when: false
      when: ch_schema_drift_script.stat.exists

    - name: Deploy summary
      ansible.builtin.debug:
        msg: >-
          Deployed version={{ version }} binaries={{ binary_list | join(',') }}
          to {{ inventory_hostname }}.
