---
# Bootstrap the cluster. Runs ONLY on the first host in the
# postgres_cluster group (db-01 by convention).
#
# Two paths:
#   - patroni_bootstrap_method=initdb  → fresh DB; Patroni's
#     own bootstrap section in patroni.yml runs initdb.
#   - patroni_bootstrap_method=pgbackrest → DR rebuild; we
#     pre-restore the data dir from pgBackRest, then start
#     Patroni and it adopts the existing primary.
#
# data-dir-gate.yml has already refused a data dir Patroni did not create
# and registered _patroni_initialized.

- block:
    # Patroni treats a data dir restored outside it as crashed: it strips
    # restore_command and the recovery target from postgresql.auto.conf and
    # removes recovery.signal, so the restore never replays archived WAL (or
    # promotes at the backup's end). Until the restore runs through a Patroni
    # custom bootstrap method, refuse instead of starting a half-recovered DB.
    - name: refuse a pgBackRest restore that Patroni would cut short
      fail:
        msg: >-
          patroni_bootstrap_method=pgbackrest is refused: Patroni discards the
          recovery settings of a data dir restored outside it, so the WAL after
          the backup (and any point-in-time target) would not be replayed. This
          role cannot rebuild a cluster from pgBackRest until the restore runs as
          a Patroni custom bootstrap method; see the role README,
          Restore-from-backup path.
      when:
        - patroni_bootstrap_method == "pgbackrest"
        - not _patroni_initialized.stat.exists

    # Honor `patroni_pgbackrest_restore_target` per the defaults /
    # README / design-note documented contract. Ignoring it would
    # mean an operator setting `time:2026-05-12T14:00:00Z` for a
    # point-in-time recovery silently gets an immediate-consistent
    # restore instead.
    #
    # Supported values:
    #   - `latest`     → pgbackrest --type=default
    #                    (apply all available WAL)
    #   - `time:<ts>`  → pgbackrest --type=time --target=<ts>
    #                    (point-in-time recovery)
    #   - `immediate`  → pgbackrest --type=immediate
    #                    (restore to first consistent point)
    # pgBackRest rejects --target-action without a recovery target (error 031),
    # so it is emitted only for `time:` and `immediate`.
    - name: assert patroni_pgbackrest_restore_target shape
      assert:
        that:
          - patroni_pgbackrest_restore_target in ['latest', 'immediate']
            or patroni_pgbackrest_restore_target.startswith('time:')
        fail_msg: >-
          patroni_pgbackrest_restore_target must be "latest",
          "immediate", or "time:<RFC3339-timestamp>".
          Got "{{ patroni_pgbackrest_restore_target }}".
      when:
        - patroni_bootstrap_method == "pgbackrest"
        - not _patroni_initialized.stat.exists

    - name: bootstrap via pgBackRest restore
      command: >
        pgbackrest --stanza={{ patroni_pgbackrest_stanza }}
        {%- if patroni_pgbackrest_restore_target == 'latest' %}
        --type=default
        {%- elif patroni_pgbackrest_restore_target == 'immediate' %}
        --type=immediate --target-action=promote
        {%- else %}
        --type=time --target={{ patroni_pgbackrest_restore_target[5:] | quote }} --target-action=promote
        {%- endif %}
        --delta
        restore
      become: yes
      become_user: postgres
      when:
        - patroni_bootstrap_method == "pgbackrest"
        - not _patroni_initialized.stat.exists

    - name: ensure restored data dir ownership
      file:
        path: "{{ patroni_data_dir }}"
        owner: postgres
        group: postgres
        state: directory
        recurse: yes
        follow: false
      when:
        - patroni_bootstrap_method == "pgbackrest"
        - not _patroni_initialized.stat.exists
  when:
    - patroni_bootstrap_method == "pgbackrest"

- name: start Patroni
  systemd:
    name: patroni
    state: started

- name: wait for Patroni REST API
  uri:
    url: "http://{{ patroni_rest_connect_address }}/cluster"
    status_code: 200
  register: _bootstrap_state
  retries: 30
  delay: 2
  until: _bootstrap_state.status == 200

- name: confirm primary elected
  command: >
    patronictl -c /etc/patroni/patroni.yml list
  register: _primary_check
  changed_when: false
  retries: 15
  delay: 4
  until: _primary_check.stdout.count('Leader') == 1

# On a replaced db-01 that Leader is a survivor and this member may still be in
# its base backup. /health answers 200 only once this member's Postgres runs
# (leader or replica), so the handlers never fire into a half-copied data dir.
- name: wait for this member's Postgres to run
  uri:
    url: "http://{{ patroni_rest_connect_address }}/health"
    status_code: 200
  register: _bootstrap_health
  retries: "{{ patroni_join_retries | int }}"
  delay: 10
  until: _bootstrap_health.status == 200

- name: read whether this member is the primary
  uri:
    url: "http://{{ patroni_rest_connect_address }}/primary"
    status_code: [200, 503]
  register: _bootstrap_primary
  changed_when: false

# Proves archive-push reaches the repository now, not when pg_wal is full.
# stanza-create is idempotent.
- name: create the pgBackRest stanza and check WAL archiving
  command: "pgbackrest --stanza={{ patroni_pgbackrest_stanza }} {{ item }}"
  loop: [stanza-create, check]
  become: yes
  become_user: postgres
  changed_when: false
  when:
    - "'pgbackrest' in patroni_archive_command"
    - _bootstrap_primary.status == 200
