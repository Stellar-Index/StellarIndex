---
# Render /etc/default/etcd from the inventory cluster spec.
# The 3-node cluster's initial-cluster string lists every host's
# peer URL — same on every node.

- name: ensure /etc/default exists
  file:
    path: /etc/default
    state: directory
    mode: '0755'

# Asserted here (not only in preflight) so a partial `--tags config`
# run can never render a plaintext etcd by accident.
- name: assert etcd TLS material is supplied
  assert:
    that:
      - etcd_tls_ca_pem is defined
      - etcd_tls_ca_pem | length > 0
      - etcd_tls_cert_pem is defined
      - etcd_tls_cert_pem | length > 0
      - etcd_tls_key_pem is defined
      - etcd_tls_key_pem | length > 0
    fail_msg: >-
      etcd_tls_ca_pem, etcd_tls_cert_pem and etcd_tls_key_pem must be
      set (PEM contents from vault; see defaults/main.yml). Refusing to
      configure etcd without TLS; set etcd_tls_enabled=false only for a
      throwaway lab cluster.
  when: etcd_tls_enabled
  no_log: true

- name: ensure etcd TLS directory
  file:
    path: "{{ etcd_tls_dir }}"
    state: directory
    owner: root
    group: etcd
    mode: '0750'
  when: etcd_tls_enabled

- name: install etcd TLS material
  copy:
    content: "{{ item.content }}\n"
    dest: "{{ etcd_tls_dir }}/{{ item.name }}"
    owner: root
    group: etcd
    mode: "{{ item.mode }}"
  loop:
    - { name: ca.pem, content: "{{ etcd_tls_ca_pem | default('') | trim }}", mode: '0644' }
    - { name: server.pem, content: "{{ etcd_tls_cert_pem | default('') | trim }}", mode: '0644' }
    - { name: server-key.pem, content: "{{ etcd_tls_key_pem | default('') | trim }}", mode: '0640' }
  loop_control:
    label: "{{ item.name }}"
  when: etcd_tls_enabled
  no_log: true
  notify: "etcd config changed"

# etcd reads ETCD_INITIAL_CLUSTER_STATE only on an empty data dir. "new" there
# while a peer quorum exists bootstraps a fresh raft log under the member id the
# survivors track, and the member panics; a replacement needs member add + existing.
- name: assert etcd_initial_cluster_state is new or existing
  assert:
    that: etcd_initial_cluster_state in ['new', 'existing']
    fail_msg: "etcd_initial_cluster_state must be new or existing; got {{ etcd_initial_cluster_state }}"

- name: detect this host's etcd member data
  stat:
    path: "{{ etcd_data_dir }}/member"
  register: _etcd_member_dir

- name: ask the other members whether an etcd cluster already has quorum
  shell:
    cmd: |
      for ep in {% for h in groups['postgres_cluster'] | difference([inventory_hostname]) %}{{ 'https' if etcd_tls_enabled else 'http' }}://{{ hostvars[h].ansible_host }}:{{ etcd_client_port }} {% endfor %}; do
        if etcdctl --endpoints="$ep" --dial-timeout=3s --command-timeout=5s \
          {% if etcd_tls_enabled %}--cacert={{ etcd_tls_dir }}/ca.pem --cert={{ etcd_tls_dir }}/server.pem --key={{ etcd_tls_dir }}/server-key.pem{% endif %} \
          endpoint health >/dev/null 2>&1; then
          exit 0
        fi
      done
      exit 1
    executable: /bin/bash
  register: _etcd_peer_quorum
  failed_when: false
  changed_when: false
  when:
    - not _etcd_member_dir.stat.exists
    - etcd_initial_cluster_state == 'new'

- name: refuse to bootstrap a new etcd cluster beside a live one
  fail:
    msg: >-
      {{ inventory_hostname }} has no etcd data and would start with
      ETCD_INITIAL_CLUSTER_STATE=new, but
      {{ 'another member already answers with quorum' if (_etcd_peer_quorum.rc | default(1)) == 0
         else 'not every postgres_cluster host is in this play, so this is not a first bootstrap' }}.
      Replace the member instead: on a surviving member run `etcdctl member remove <old-id>`
      and `etcdctl member add {{ inventory_hostname }}
      --peer-urls={{ 'https' if etcd_tls_enabled else 'http' }}://{{ ansible_host }}:{{ etcd_peer_port }}`,
      then re-run with --limit {{ inventory_hostname }} -e etcd_initial_cluster_state=existing.
  when:
    - not _etcd_member_dir.stat.exists
    - etcd_initial_cluster_state == 'new'
    - (_etcd_peer_quorum.rc | default(1)) == 0
      or (groups['postgres_cluster'] | difference(ansible_play_hosts_all) | length) > 0

- name: render /etc/default/etcd
  template:
    src: etcd.conf.j2
    dest: /etc/default/etcd
    mode: '0640'
    owner: root
    group: etcd
    backup: yes
  notify: "etcd config changed"
