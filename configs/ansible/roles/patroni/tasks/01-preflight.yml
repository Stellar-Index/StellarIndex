---
# Sanity-check the host before any install. Cheap, fail-fast.

- name: assert OS is Ubuntu 22.04 or 24.04
  assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version in ["22.04", "24.04"]
    fail_msg: >-
      patroni role supports Ubuntu 22.04 / 24.04 only;
      detected {{ ansible_distribution }} {{ ansible_distribution_version }}

- name: assert RAM ≥ 32 GB
  assert:
    that:
      - ansible_memtotal_mb >= (32 * 1024 * 0.95)   # 5% slack for kernel reservation
    fail_msg: >-
      patroni role expects ≥ 32 GB RAM (per ha-plan §3.3 hardware target);
      detected {{ ansible_memtotal_mb }} MB

- name: assert host is in the postgres_cluster inventory group
  assert:
    that:
      - inventory_hostname in groups['postgres_cluster']
    fail_msg: >-
      this role must be applied against hosts in the
      postgres_cluster group (see role README inventory model)

# 10-firewall.yml renders the WHOLE /etc/nftables.conf (`flush ruleset`), as
# archival-node does: on one host each run would drop the other's ports.
- name: assert host is not an archival node (this role owns the host firewall)
  assert:
    that:
      - inventory_hostname not in groups['archival_nodes'] | default([])
    fail_msg: >-
      {{ inventory_hostname }} is in archival_nodes. The patroni role replaces
      the host's entire nftables ruleset, and archival-node rewrites it back
      without etcd 2379/2380 and Patroni 8008, which costs etcd quorum and
      demotes the primary. Run it on dedicated postgres_cluster hosts only.
  tags: [always]

- name: assert postgres_cluster has exactly 3 hosts
  assert:
    that:
      - groups['postgres_cluster'] | length == 3
    fail_msg: >-
      patroni role assumes a 3-node cluster (per ha-plan §3.3);
      detected {{ groups['postgres_cluster'] | length }} hosts

# archive_mode is on from bootstrap, and Postgres keeps every segment it cannot
# archive, so an archive_command that cannot succeed fills the data volume. The
# role does not install pgBackRest: its binary and config must already be here.
- name: look for the pgBackRest binary and config archive_command needs
  stat:
    path: "{{ item }}"
  loop: [/usr/bin/pgbackrest, /etc/pgbackrest/pgbackrest.conf, /etc/pgbackrest.conf]
  register: _pgbackrest_present
  when: "'pgbackrest' in patroni_archive_command"

- name: assert archive_command can succeed
  assert:
    that:
      - patroni_archive_command | trim | length > 0
      - "'pgbackrest' not in patroni_archive_command
        or (_pgbackrest_present.results[0].stat.exists
            and (_pgbackrest_present.results[1].stat.exists or _pgbackrest_present.results[2].stat.exists))"
    fail_msg: >-
      archive_mode is on, so patroni_archive_command must be able to archive
      WAL or pg_wal grows until the disk is full. It calls pgBackRest, which
      is not installed or has no /etc/pgbackrest/pgbackrest.conf on
      {{ inventory_hostname }}: provision pgBackRest and its repository first.

- name: assert vault contents present
  assert:
    that:
      - patroni_replicator_password is defined
      - patroni_postgres_password is defined
    fail_msg: >-
      patroni_replicator_password and patroni_postgres_password
      must be set (typically from inventory/<region>.secrets.yml
      via ansible-vault). See role README §Prerequisites.
