---
# Replica join — runs on every host EXCEPT the first in
# postgres_cluster (handled by 08-patroni-bootstrap.yml).
#
# Patroni handles the actual replica setup: when started against
# an existing cluster (visible via etcd), it pg_basebackups from
# the current primary and joins as a replica.

- name: ensure data dir parent exists
  file:
    path: "{{ patroni_data_dir | dirname }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'

- name: start Patroni (replica — Patroni handles pg_basebackup)
  systemd:
    name: patroni
    state: started

- name: wait for Patroni REST API
  uri:
    url: "http://{{ patroni_rest_connect_address }}/cluster"
    status_code: 200
  register: _replica_state
  retries: 60          # base backup can take a while on a real DB
  delay: 5
  until: _replica_state.status == 200

# /replica answers 200 only once this member is a running replica, so it
# also covers the pg_basebackup, which /cluster answers through.
- name: confirm we joined as a replica
  uri:
    url: "http://{{ patroni_rest_connect_address }}/replica"
    status_code: 200
  register: _replica_check
  retries: "{{ patroni_join_retries | int }}"
  delay: 10
  until: _replica_check.status == 200
  when: not _patroni_initialized.stat.exists

# A member that joined before may hold the leader lock now (a switchover or
# failover moves it), and /replica answers 503 on the leader.
- name: confirm a member that joined before is running in either role
  uri:
    url: "http://{{ patroni_rest_connect_address }}/health"
    status_code: 200
  register: _member_health
  retries: 30
  delay: 5
  until: _member_health.status == 200
  when: _patroni_initialized.stat.exists
