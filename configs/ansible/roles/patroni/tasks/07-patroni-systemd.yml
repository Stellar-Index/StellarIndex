---
# Wire systemd unit. The apt-installed Patroni ships a unit at
# /lib/systemd/system/patroni.service, but it points at a config
# we don't use; we override via /etc/systemd/system/patroni.service
# pointing at our /etc/patroni/patroni.yml.

- name: render Patroni systemd unit override
  template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    mode: '0644'
  register: _patroni_unit_render
  notify: "patroni config changed"

# Written here as well as by the handler: a host that fails a later task runs no handlers.
- name: persist the Patroni restart for the unit change
  file:
    path: /etc/patroni/.restart-pending
    state: touch
    mode: '0600'
  when: _patroni_unit_render is changed

# Patroni runs postgres itself; the distro unit would fight it for the data dir.
# The data-dir gate's check is repeated here because --start-at-task skips
# always-tagged tasks.
- name: mask the distro postgresql cluster unit
  shell: |
    set -eu
    d={{ patroni_data_dir | quote }}
    if [ -e "$d/PG_VERSION" ] && [ ! -e "$d/patroni.dynamic.json" ] \
      && [ {{ 'yes' if (inventory_hostname == groups['postgres_cluster'][0]
                      and patroni_bootstrap_method == 'pgbackrest'
                      and (patroni_adopt_existing_data_dir | bool)) else 'no' }} != yes ] \
      && ! systemctl is-active --quiet patroni; then
      echo "refusing to stop or mask anything: $d holds a postgres cluster Patroni did not create (see the data-dir gate)" >&2
      exit 1
    fi
    systemctl mask --now postgresql@{{ patroni_postgres_version }}-main.service
  args:
    executable: /bin/bash
    creates: /etc/systemd/system/postgresql@{{ patroni_postgres_version }}-main.service

- name: enable Patroni
  systemd:
    name: patroni
    enabled: yes
    daemon_reload: yes
