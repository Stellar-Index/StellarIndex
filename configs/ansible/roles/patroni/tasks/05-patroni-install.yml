---
# Install Patroni from apt (Ubuntu universe). Per the design
# note, apt is preferred over PyPI for simpler operational story
# at the cost of lagging by 1-2 minor versions.

- name: ensure apt cache is fresh
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: install Patroni + Python deps
  apt:
    name:
      - patroni
      - python3-etcd3            # for etcd v3 API
      - python3-psycopg2          # Patroni → Postgres bootstrap
      - python3-prettytable       # patronictl output
      - jq                        # the textfile scraper at
                                  # 11-monitoring.yml pipes Patroni
                                  # JSON through jq for ROLE/STATE
                                  # extraction. Without this the
                                  # scraper timer fails on first
                                  # run and Patroni role/health
                                  # metrics never reach Prometheus.
    state: present

# The restart handler reads replica state "streaming" (Patroni >= 3.0.4) and
# runs `switchover --leader`; 2.x reports "running" and only has --master.
- name: read the installed Patroni version
  command: patroni --version
  register: _patroni_version
  changed_when: false
  check_mode: false
  tags: [always]

- name: assert Patroni is 3.0.4 or newer
  assert:
    that:
      - (_patroni_version.stdout.split() | last) is version('3.0.4', '>=')
    fail_msg: >-
      {{ _patroni_version.stdout }} is installed; this role needs Patroni
      3.0.4 or newer (Ubuntu 24.04's package, or the PGDG repository on 22.04).
      Older Patroni reports replicas as "running", which the restart handler
      treats as unhealthy.
  tags: [always]

- name: ensure Patroni config directory
  file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'

- name: ensure Patroni log directory
  file:
    path: /var/log/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'
