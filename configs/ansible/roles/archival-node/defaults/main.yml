---
# Defaults for the archival-node role.
# Every value here is overridable via inventory group_vars / host_vars.
# See inventory/r1.example.yml for the operator-facing knobs.
#
# ─── Per-region differences (ADR-0016) ──────────────────────────────
# Knobs marked `[Per-region: ...]` below differ between regions per
# the storage strategy in docs/adr/0016-per-region-storage-strategy.md:
#
#   R1 FSN1 (Hetzner)        — full local mirror, all 4 verify tiers
#   R2 US-East-1 (AWS)       — galexie-archive read from
#                              s3://aws-public-blockchain (no local
#                              archive bucket); Tier A + D weekly
#   R3 Singapore (Vultr)     — galexie-archive on Vultr Object Storage
#                              (S3, region-local); Tier A + D weekly
#
# When provisioning a new region, copy r1.example.yml → rN.yml and
# override only the [Per-region] knobs. The inventory file is also
# the right place for the per-region cron settings (verify-archive
# tier flags) and for the stellarindex_live_seam_ledger value (each
# region has its own seam where its galexie-live bucket starts).

# ───── Region ────────────────────────────────────────────────────────
# [Per-region: r1=FSN1 (Hetzner Falkenstein), r2=US-East-1, r3=Singapore]
# No default on purpose (audit-2026-07-23 CFG-02): region_id feeds the
# rendered stellarindex.toml [region] id, the galexie S3 region, and
# per-region ADR-0016 data-path decisions. A previous "r1" default
# meant a new-region inventory that forgot to override it would
# silently mislabel the host as r1 — the 01-preflight.yml assert below
# now requires every inventory to set this explicitly instead.
region_id:           ""
region_name:         "FSN1"
home_domain:         "stellarindex.io"

# Minimum RAM the preflight requires (MB). Default = the pubnet archival-node
# spec (32 GB, ~30000 MB usable). A low-traffic testnet/futurenet VM overrides
# this lower in inventory — two VMs share a 64 GB host, so neither can get 32 GB.
archival_node_min_ram_mb: 30000

# ───── Which subsystems to run on this host ──────────────────────────
run_postgres:        true
# Primary stellar-core daemon. Off by default — the archive we ship
# (galexie → MinIO) doesn't need it, and running it alongside the
# captive-cores costs RAM/CPU/peer-slots for no gain. Flip to true
# when we're ready to become a validator (ADR-0004).
run_stellar_core:    false
run_galexie:         true
# stellar-rpc is NOT part of this role. Our indexer reads galexie's
# MinIO output directly via ingest.ApplyLedgerMetadata, so
# stellar-rpc's JSON-RPC surface isn't on the Stellar Index data
# path. It was removed from r1 on 2026-04-23 and the role's
# stellar-rpc task/templates were deleted on 2026-05-22 — see
# docs/operations/r1-deployment-state.md for the rationale.
run_minio:           true
run_observability:   true
# Promtail journald → Loki shipper (10-observability.yml). Requires a
# reachable Loki at `loki_push_url` (r1 runs the single-host system
# package per configs/loki/README.md). Sub-flag of run_observability:
# the whole file is skipped when run_observability is false.
run_promtail:        true

# Data services hand-installed out-of-band on r1 (2026-06 lake pivot),
# codified for fresh hosts (r2/r3/test net). run_clickhouse defaults FALSE
# so a re-run NEVER touches r1's hand-tended lake — a fresh host sets it true
# (together with clickhouse_apply_schema to lay down the deploy/clickhouse
# DDL). run_redis defaults true; `state: present` never upgrades r1's redis.
run_redis:               true
run_clickhouse:          false
clickhouse_apply_schema: false
clickhouse_tcp_port:     9300   # 9000 is MinIO's

# ───── ZFS ───────────────────────────────────────────────────────────
# [Per-region:
#   r1 = raidz2 across 4× NVMe (full local mirror, two-drive tolerance)
#   r2 = NOT used — EBS gp3 directly, no ZFS layer
#   r3 = mirror across 2× NVMe (Vultr SG SKU only ships 2 drives;
#        single-drive tolerance, acceptable for an async DR replica)
# ]
zfs_data_pool_name:  "data"
zfs_data_pool_type:  "raidz2"
zfs_data_devices:    []          # set in inventory, validated in preflight
zfs_ashift:          12          # 4K NVMe sector alignment

# Drives where installimage put OS partitions (ESP/swap/root) in slots
# 1-3, leaving the rest of the disk unallocated. Role carves a p4 on
# each of these spanning all remaining free space, to use as a ZFS
# raidz2 vdev alongside the whole-drive data disks. Empty = no
# partitioning needed (all zfs_data_devices are whole drives).
zfs_os_drives_needing_data_partition: []
zfs_os_drives_data_partition_number: 4

# Per-workload dataset tuning.
#
# recordsize is the PARSABLE byte value (131072, not "128K"): the
# community.general.zfs module reads current properties with `zfs get -p`
# and string-compares, so a human-readable "128K" never equals the live
# "131072" and the task reports a phantom change on every --check run
# (BACKLOG #50 / 2026-07-06 drift reconcile). Every value here is grounded
# in the live `zfs get -p -o property,value,source data/<ds>` output on r1.
#
# List ONLY the properties a dataset sets LOCALLY. A property left to
# inherit the pool default (recordsize 131072 / compression zstd / atime
# off / logbias latency / primarycache all) is simply omitted — the
# "Create ZFS datasets" task manages exactly the keys present on the item,
# so --check never tries to convert an inherited property to local (which
# is a real, drift-reporting change on the mountpoint-only datasets below).
zfs_datasets:
  - name: "os"
    recordsize: "131072"
    compression: "zstd"
    atime: "off"
    mountpoint: "/var/lib/stellarindex"
    # Must agree with 04-users.yml "Ownership — stellarindex data dir"
    # (0750); the 0755 default here ping-ponged the mode every apply
    # and kept the drift check permanently red (2026-07-27).
    dir_mode: "0750"
  - name: "postgres"
    recordsize: "8192"
    compression: "zstd"
    atime: "off"
    logbias: "throughput"
    primarycache: "metadata"
    mountpoint: "/var/lib/postgresql"
  # "core" dataset (for the primary stellar-core daemon's bucket dir
  # at /var/lib/stellar-core) is intentionally NOT in this list
  # while run_stellar_core=false. When flipping to true for Phase-3
  # validator work, add this entry back and re-apply the zfs tag:
  #
  #   - name: "core"
  #     recordsize: "131072"
  #     compression: "zstd"
  #     atime: "off"
  #     mountpoint: "/var/lib/stellar-core"
  - name: "galexie"
    recordsize: "1048576"
    compression: "zstd"
    atime: "off"
    mountpoint: "/var/lib/galexie"
    dir_mode: "0750"   # agree with 04-users.yml ownership task (see "os")
  - name: "minio"
    recordsize: "1048576"
    compression: "zstd"
    atime: "off"
    mountpoint: "/var/lib/minio"
    dir_mode: "0750"   # agree with 04-users.yml ownership task (see "os")
  - name: "archive"
    recordsize: "1048576"
    compression: "zstd"
    atime: "off"
    mountpoint: "/srv/history-archive"
  # Out-of-band datasets, hand-created during incidents and now fully
  # codified (BACKLOG #50 — no un-codified ZFS dataset remains on r1):
  #   clickhouse  — ADR-0034 lake (2026-06-05 pivot)
  #   loki        — CH logs off the 49G root (2026-06-11, commit 5dd6fcda)
  #   prometheus  — TSDB off the root (2026-06-30, launch-todo P0-5)
  #   pgbackrest  — pgBackRest repo1 backups (ADR-0043)
  #   restore-drill — DRILL_ROOT for scripts/ops/restore-drill.sh (CS-110)
  - name: "clickhouse"
    recordsize: "131072"
    compression: "zstd"
    atime: "off"
    mountpoint: "/var/lib/clickhouse"
  - name: "loki"
    recordsize: "131072"
    compression: "zstd"
    atime: "off"
    mountpoint: "/var/lib/loki"
  - name: "prometheus"
    # The Prometheus TSDB (~12-13G) lived on the 49G OS root and kept it
    # chronically >90% full; relocated to ZFS 2026-06-30 (launch-todo P0-5),
    # where zstd compresses it ~12x. recordsize 128K suits its chunk writes.
    recordsize: "131072"
    compression: "zstd"
    atime: "off"
    mountpoint: "/var/lib/prometheus"
  # pgbackrest + restore-drill inherit the pool tuning (recordsize 131072 /
  # compression zstd / atime off / logbias latency / primarycache all on
  # r1), so only the LOCAL properties are declared: the mountpoint, plus
  # the mount-dir mode for pgbackrest (0750, postgres-owned backup repo —
  # dir_mode overrides the file task's 0755 default).
  - name: "pgbackrest"
    mountpoint: "/var/lib/pgbackrest"
    dir_mode: "0750"
  # NOT under /var/tmp: PrivateTmp=true (which restore-drill.service sets,
  # like every hardened unit here) gives the unit its OWN empty /tmp AND
  # /var/tmp, so a drill root under there is invisible inside the service's
  # mount namespace — systemd failed the unit at namespace setup with
  # 226/NAMESPACE and the drill never once ran on its schedule (2026-08-19).
  # A 616 GB Postgres restore is also not temp data. /var/lib stays writable
  # under ProtectSystem=full and is not shadowed.
  # /srv, not /var/tmp and not /var/lib/stellarindex (BDR-04, 2026-08-19):
  #   - /var/tmp is shadowed by PrivateTmp=true, so the unit could not see
  #     its own drill dataset and systemd failed it at namespace setup
  #     (226/NAMESPACE) on every scheduled fire — the drill had never once
  #     run on its timer.
  #   - /var/lib/stellarindex is drwxr-x--- stellarindex:stellarindex, and
  #     pgbackrest runs as POSTGRES, which cannot traverse it ([041]
  #     Permission denied on the scratch pgdata dir).
  # /srv is root:root 0755 (traversable by anyone) and already hosts
  # history-archive. The mount dir itself is postgres-owned because
  # pgbackrest creates the scratch pgdata dir inside it.
  - name: "restore-drill"
    mountpoint: "/srv/restore-drill"
    dir_owner: "postgres"
    dir_group: "postgres"
    dir_mode: "0750"

# ───── OS kernel tuning ──────────────────────────────────────────────
sysctl_tunings:
  # File descriptor headroom (stellar-core + Postgres + Galexie keep many open)
  fs.file-max: 2097152
  fs.nr_open: 2097152
  # Network buffers for the SCP overlay + Galexie writers
  net.core.rmem_max: 16777216
  net.core.wmem_max: 16777216
  net.core.netdev_max_backlog: 5000
  net.ipv4.tcp_rmem: "4096 87380 16777216"
  net.ipv4.tcp_wmem: "4096 65536 16777216"
  # Swap sanity for a DB workload
  vm.swappiness: 1
  vm.dirty_ratio: 10
  vm.dirty_background_ratio: 3
  # Strict overcommit (2) makes malloc fail predictably instead of the
  # OOM-killer nuking a critical process — sound on r1 (188 GB + 16 G swap →
  # a generous commit budget). But on a small VM the budget is
  # `overcommit_ratio% × RAM (+ swap)`, e.g. 80% × 20 GB = 16 GB, which
  # ClickHouse + captive-core + the Go services routinely exceed → malloc/
  # fork fail with "Cannot allocate memory" despite free RAM. Memory-
  # constrained hosts (test-net VMs) override vm_overcommit_memory: 0
  # (heuristic overcommit) — see the note there and the ClickHouse cap.
  vm.overcommit_memory: "{{ vm_overcommit_memory | default(2) }}"
  vm.overcommit_ratio: "{{ vm_overcommit_ratio | default(80) }}"

# ───── Postgres ──────────────────────────────────────────────────────
postgres_version:        "15"
postgres_listen_addresses: "127.0.0.1"          # stellar-core is local
postgres_port:           5432
postgres_shared_buffers: "{{ (ansible_facts.memtotal_mb * 0.25) | int }}MB"
postgres_effective_cache_size: "{{ (ansible_facts.memtotal_mb * 0.5) | int }}MB"
postgres_work_mem:       "32MB"
postgres_maintenance_work_mem: "1GB"
postgres_wal_compression: "zstd"
postgres_max_connections: 200

# Per-tx lock table sizing — see postgresql.conf.j2 for context.
# History of this knob (it keeps needing to grow as the trades
# hypertable accrues chunks — every full-scan query needs ~1 lock
# per chunk):
#   - Postgres default 64 → table 64×200=12,800. Blew during the
#     2026-05-06 SEV-3 ("Postgres lock-table-full", SQLSTATE 53200).
#   - Bumped 64→256 by hand (4×) → table 256×200=51,200. Lasted
#     ~9 days: by 2026-05-15 trades had grown to ~2,738 chunks and
#     concurrent diagnostic queries (coverage / pools / cagg / fx)
#     + the all-time SDEX backfill thrashed the table again — a
#     single observed query held 26,927 locks.
#   - 2026-05-15: 256→4096 (16× the default, 8× the prior value) →
#     table 4096×200 = 819,200 entries. Sized for permanent
#     headroom rather than another incremental bump: handles ~30
#     concurrent peak-size (~27k-lock) queries, or the chunk count
#     growing to ~15,000 (decades at ~365/yr) while still leaving
#     room for 50+ concurrent full scans. Memory cost ≈ 220 MB,
#     negligible against the 48 GB shared_buffers / 188 GB host RAM.
# Lock table size = max_locks_per_transaction × max_connections.
# F-1251 (audit-2026-05-12); re-sized 2026-05-15.
postgres_max_locks_per_transaction: 4096

postgres_db_core:        "stellar_core"
postgres_user_core:      "stellar_core"
# postgres_pass_core ← set in ansible-vault secrets file

# Application database for the indexer / aggregator / api binaries.
# Owns the trades + oracle_updates hypertables + price_aggregates
# CAGGs (see migrations/). TimescaleDB extension is enabled at db
# create time so the migrations can `CREATE EXTENSION IF NOT EXISTS
# timescaledb` without elevation.
postgres_db_stellarindex:    "stellarindex"
postgres_user_stellarindex:  "stellarindex"
# postgres_pass_stellarindex ← set in ansible-vault secrets file

# ───── ClickHouse schema + state snapshot (ADR-0043 §2.1) ─────────────
# The lake's only backup, by design: ADR-0043 rejects a multi-TiB copy
# of derived data (the raw ledgers already live in two independent
# archives) and protects the METADATA instead — SHOW CREATE for every
# stellar.* table/view, the partition + changed-settings inventory, and
# the ch-backfill / ingestion cursor state. Megabytes a day. Losing the
# DDL is what turns a re-derive from "run the script" into archaeology.
#
# Enabled by default: it is seconds of metadata queries, so none of the
# Phase-A capacity caveats that ship restore-drill.timer disabled apply
# here, and a backup that ships disabled is what the ADR was written
# after.
ch_schema_snapshot_enabled: true
ch_schema_snapshot_dir: "/var/lib/stellarindex/ch-schema-snapshot"
# Long tail on purpose — the snapshot's value is partly its DIFF
# history ("when did that ORDER BY change?"), which a 7-day window
# throws away for no saving.
ch_schema_snapshot_retain_days: 90
# `mc` alias/prefix for the offsite copy, e.g.
# "offsite/stellarindex-backups/ch-schema". Empty = local-only, which
# 18-pgbackrest-backup.yml refuses without ch_schema_snapshot_offsite_ack
# (same shape as pgbackrest_offsite_ack): a copy on the pool it protects
# is not a backup.
ch_schema_snapshot_mc_target: ""
ch_schema_snapshot_offsite_ack: false

# ───── ClickHouse schema DRIFT check (C6-008 / C6-003) ────────────────
# The other half of the snapshot: compares deploy/clickhouse/tier1_schema.sql
# (repo intent) against the live SHOW CREATE the snapshot captured, on
# engine (incl. args) / PARTITION BY / ORDER BY / column names. Enabled
# by default — it is sub-second text comparison, and a drift guard that
# ships disabled detects nothing. Deliberately NOT gated on
# ch_schema_snapshot_enabled: with ch_schema_drift_use_live it can read
# ClickHouse directly and needs no snapshot at all.
ch_schema_drift_enabled: true
# Where the shipped copy of the repo's founding DDL lands on the host.
# The comparison needs the repo's intent ON the box; r1 has no checkout.
ch_schema_drift_intent: "/usr/local/share/stellarindex/tier1_schema.sql"
# false = compare against the newest ch-schema-snapshot capture (default:
# one SHOW CREATE sweep per day serves both the backup and the check).
# true = the check runs its OWN SHOW CREATE sweep. Use only if the
# snapshot is disabled or you want the check independent of it.
ch_schema_drift_use_live: false

# ───── ClickHouse serving-query isolation (ADR-0048 D4) ───────────────
# A dedicated ClickHouse settings profile + user for the API's
# per-request explorer reads (GET /v1/ledgers, /v1/tx, /v1/accounts/*
# incl. the ADR-0048 D5 movements feed, …), separate from the
# unauthenticated `default` user every OTHER ClickHouse connection in
# this repo still uses (the indexer's dual-sink, the aggregator's
# explorer reader, stellarindex-ops backfills/gates/replays). Bounded
# so a burst of public API traffic fails fast and cheap instead of
# queuing behind — or getting starved by — a heavy backfill scan or a
# background merge on the same host. See
# 20-clickhouse-serving-profile.yml for the exact settings + rationale
# per knob (max_threads/max_memory_usage/max_execution_time/priority/
# os_thread_priority/max_concurrent_queries_for_user).
#
# clickhouse_serving_profile_enabled defaults true so a fresh apply of
# this role provisions the profile+user by default; the API config
# side (storage.clickhouse_serving_user in stellarindex.toml.j2 below)
# is a SEPARATE opt-in — provisioning the CH-side user does nothing
# until the API is also told to authenticate as it. This intentional
# two-step activation matches how clickhouse_live_sink itself was
# rolled out (ADR-0041) and lets an operator provision the CH side
# ahead of a coordinated API-config flip.
clickhouse_serving_profile_enabled: true
clickhouse_serving_user: "api_serving"
clickhouse_serving_max_threads: 2
clickhouse_serving_max_memory_usage_bytes: 2147483648   # 2 GiB
clickhouse_serving_max_execution_time_s: 10
clickhouse_serving_max_concurrent_queries: 20
# clickhouse_serving_password ← set in ansible-vault secrets file as
# vault_clickhouse_serving_password (mirrors postgres_pass_stellarindex
# / vault_stellarindex_reader_secret_key's pattern — see
# inventory/r1.example.yml for the operator-facing wiring). The
# plaintext is hashed (SHA-256) into the ClickHouse users.d drop-in at
# render time and separately injected into
# STELLARINDEX_CLICKHOUSE_SERVING_PASSWORD in stellarindex.env.j2 for
# the API process to authenticate with — it never lands on disk
# outside the vault + those two rendered, root-only-readable files.
clickhouse_serving_password: "{{ vault_clickhouse_serving_password | default('') }}"

# The API-side activation flip (stellarindex.toml.j2's
# clickhouse_serving_user), SEPARATE from clickhouse_serving_profile_enabled
# above (the CH-side provisioning). false until an operator has
# confirmed the CH-side profile+user is live — see
# 20-clickhouse-serving-profile.yml's header for the two-step
# sequencing rationale.
stellarindex_clickhouse_serving_enabled: false

# ───── ClickHouse ops-batch isolation (2026-08-28 r1 incident) ────────
# The LOW-priority counterpart of the api_serving profile above: a
# settings profile + user that stellarindex-ops batch jobs (ch-rebuild,
# ch-backfill, classic-movements-backfill, verify/gate reads, replays)
# authenticate as, so CH's query scheduler yields their CPU to the
# serving side. WHY: a runbook-prescribed `ch-rebuild -sep41` dry-run
# over 2M ledgers drove r1's load to 12.9 and starved the AGGREGATOR's
# supply refresher — stellarindex_aggregator_supply_refresh_error_dominant
# fired for all 39 watched contracts within 3 minutes; killing the job
# cleared it. run-heavy-job.sh's cgroup caps could not help because the
# contention was INSIDE clickhouse-server, where every ops query ran as
# the same unauthenticated `default` user as the aggregator's. See
# 20-clickhouse-serving-profile.yml for the per-knob rationale and
# docs/operations/clickhouse-ops-batch-profile.md for the operator view.
#
# Two-step activation, same as api_serving: this provisions the CH-side
# user; the ops binary only authenticates as it once
# STELLARINDEX_CLICKHOUSE_OPS_USER/_PASSWORD are in
# /etc/default/stellarindex-ops (09-minio.yml templates them, gated on
# the same flag + a non-empty password so a partial apply can never
# hand ops jobs a credential the CH side does not know).
clickhouse_ops_batch_profile_enabled: true
clickhouse_ops_batch_user: "ops_batch"
clickhouse_ops_batch_max_threads: 2
clickhouse_ops_batch_max_memory_usage_bytes: 8589934592   # 8 GiB (default, not ceiling — see task file)
clickhouse_ops_batch_max_concurrent_queries: 8
# CH `priority`: lower number = higher priority; api_serving is 1, an
# un-opted-in query is 0. 100 leaves room for intermediate tiers.
clickhouse_ops_batch_priority: 100
# Linux nice value for the ops queries' own CH execution threads
# (api_serving is -5; background merges run at 0). Positive so a batch
# scan also yields to merges — falling behind on compaction was the
# other way the 2026-08-28 job hurt the serving side.
clickhouse_ops_batch_os_thread_priority: 5
# clickhouse_ops_batch_password ← ansible-vault, vault_clickhouse_ops_batch_password
# (same discipline as vault_clickhouse_serving_password: SHA-256-hashed
# into the users.d drop-in at render time, plaintext only ever lands in
# /etc/default/stellarindex-ops, mode 0640 root:stellarindex).
clickhouse_ops_batch_password: "{{ vault_clickhouse_ops_batch_password | default('') }}"

# ───── stellarindex-indexer / aggregator / api services ───────────────
run_stellarindex: true

# Indexer source fleet. Region-INVARIANT by design (ADR-0015 closed-
# bucket contract — every region must produce byte-equivalent
# aggregate output from the same inputs), so the full 13-source set
# is the default rather than a per-region knob. Matches r1's live
# /etc/stellarindex.toml.
stellarindex_enabled_sources:
  - "soroswap"
  - "soroswap-router"
  - "defindex"
  - "aquarius"
  - "phoenix"
  - "comet"
  - "reflector-dex"
  - "reflector-cex"
  - "reflector-fx"
  - "redstone"
  - "band"
  - "blend"
  - "blend_backstop"
  - "blend_emitter"
  - "sorocredit"
  - "sdex"
  - "cctp"
  - "rozo"

# Earliest ledger to backfill from on a fresh install (no persisted
# cursor yet). 0 = refuse to start without a cursor — operator must
# pick an explicit ledger to avoid accidental genesis re-ingest.
# [Per-region: each region picks its own backfill floor — r1's live
#  value is 62403000. Set in inventory.]
stellarindex_backfill_from_ledger: 0

# First ledger present in the galexie-live bucket. Below this the
# indexer reads from galexie-archive. Set to whatever galexie-append.sh
# passed as --start when the live tail first started writing —
# query the running galexie process args:
#   pgrep -af 'galexie append'
# 0 = live-only mode (pre-2026-04-26 default; archive bucket unused).
#
# [Per-region: each region has its own seam — the ledger where that
#  region's *own* galexie-live bucket starts emitting. R1's seam was
#  the cutover from archive-fill to live-tail (~April 2026). R2/R3
#  will have later seams set when their indexers first start.]
stellarindex_live_seam_ledger: 0

# ───── Stellar network / quorum ──────────────────────────────────────
stellar_network:         "pubnet"

# The full network passphrase, derived from stellar_network. ONE source
# of truth feeding BOTH stellar-core.cfg's NETWORK_PASSPHRASE AND (for
# non-preset networks like futurenet) galexie's captive core — declared
# here so the two can never drift. Fixes the pre-2026-08-26 bug where
# stellar-core.cfg.j2's else-branch emitted the literal network NAME
# ("futurenet") as the passphrase, so a futurenet captive-core could not
# join the network. MUST match internal/config/config.go's passphrase map.
stellar_passphrases:
  pubnet:    "Public Global Stellar Network ; September 2015"
  testnet:   "Test SDF Network ; September 2015"
  futurenet: "Test SDF Future Network ; October 2022"
stellar_passphrase: "{{ stellar_passphrases[stellar_network] | default(stellar_network) }}"

# Per-network history archive (SDF-published). config.Validate REJECTS a
# pubnet (core-live) URL on a non-pubnet network — the guard against a
# test net silently ingesting pubnet checkpoints — so this MUST track
# stellar_network. Override in inventory for a private/mirror archive.
stellar_history_archive_urls:
  pubnet:    "https://history.stellar.org/prd/core-live/core_live_001"
  testnet:   "https://history.stellar.org/prd/core-testnet/core_testnet_001"
  futurenet: "http://history.stellar.org/dev/core-futurenet/core_futurenet_001"
stellar_history_archive_url: "{{ stellar_history_archive_urls[stellar_network] | default(stellar_history_archive_urls['pubnet']) }}"

# The FULL SDF archive set per network (001/002/003), per
# https://developers.stellar.org/docs/networks. `stellar_history_archive_url`
# above stays single-valued (the archivist mirror + galexie-append probe want
# one URL); this list is what a captive core replaying history should use, so a
# single archive being slow or 404ing a checkpoint fails over instead of
# stalling the replay. Consumed by stellar-core.cfg.j2 on NON-pubnet networks,
# where the pubnet [[VALIDATORS]] (and their pubnet HISTORY URLs) are omitted.
stellar_history_archive_url_sets:
  pubnet:
    - "https://history.stellar.org/prd/core-live/core_live_001"
    - "https://history.stellar.org/prd/core-live/core_live_002"
    - "https://history.stellar.org/prd/core-live/core_live_003"
  testnet:
    - "https://history.stellar.org/prd/core-testnet/core_testnet_001"
    - "https://history.stellar.org/prd/core-testnet/core_testnet_002"
    - "https://history.stellar.org/prd/core-testnet/core_testnet_003"
  futurenet:
    - "http://history.stellar.org/dev/core-futurenet/core_futurenet_001"
    - "http://history.stellar.org/dev/core-futurenet/core_futurenet_002"
    - "http://history.stellar.org/dev/core-futurenet/core_futurenet_003"
stellar_history_archive_url_set: "{{ stellar_history_archive_url_sets[stellar_network] | default([stellar_history_archive_url]) }}"

# Captive stellar-core apt version. Empty = fresh-host "latest available" /
# never-upgrade-an-existing-binary (07-galexie.yml). Pin the exact apt version
# (e.g. "28.0.1-3508.947aad841.noble") to drive a PROTOCOL-UPGRADE core bump —
# required before a network reaches a protocol the installed core predates
# (P28: core >= 28 by mainnet 2026-09-16). See docs/operations/protocol-upgrades.md.
stellar_core_version: ""

# stellar-archivist apt version. Empty = fresh-host "latest available" /
# never-upgrade-an-existing-binary (06-stellar-core.yml), same posture as
# stellar_core_version above. Pin the exact apt version (e.g. "0.1.5-486") to
# clear stellarindex_stellar_stack_lagging{component="archivist"} — the probe
# in 10-observability.yml compares dpkg-installed against the apt candidate.
# archivist is the archive mirror/verify CLI (verify-archive tiers), NOT in the
# live ingest path, so a bump is low-risk and needs no service restart.
stellar_archivist_version: ""

# Protocol-transition era boundaries (internal/config/config.go StellarConfig).
# Pubnet uses the real ledger numbers; a reset testnet/futurenet is entirely
# post-Soroban AND post-P23 from ledger 1, so BOTH are genesis (1) there —
# otherwise the SEP-41 supply observer and the CAP-67 movements feed floor
# ABOVE every ledger the net has and produce nothing. These also drive the
# ch-cap67-movements -floor-ledger flag (14-stellarindex-services.yml).
stellar_soroban_genesis_ledger: "{{ 50457424 if stellar_network == 'pubnet' else 1 }}"
stellar_movements_floor_ledger: "{{ 58762517 if stellar_network == 'pubnet' else 1 }}"

# verify-archive Tier B (checkpoint anchor, ADR-0017) compares each
# 64-ledger checkpoint's header hash against a LOCAL rs-stellar-archivist
# mirror — VERIFY_ARCHIVE_ROOT, /srv/history-archive. That mirror is only
# ever populated for PUBNET. On a test net the path holds a partial PUBNET
# stub (the same one [HISTORY.localmirror] is gated away from in
# stellar-core.cfg.j2 because it corrupts test-net catchup), so Tier B
# anchors TESTNET ledgers against PUBNET header hashes and fails at the
# first checkpoint, every run, forever:
#
#   checkpoint anchor mismatch at ledger 63:
#     our LCM hash        = a4f3016f…   (testnet, correct)
#     archive-signed hash = c03f11ed…   (pubnet stub)
#
# A real integrity check pointed at ANOTHER NETWORK's data is worse than no
# check: it manufactures a permanent red that trains the operator to ignore
# the one failure mode Tier A (chain-link) is blind to. So Tier B is
# omitted where its anchor cannot be network-correct. Tier A still runs on
# every network — it verifies chain linkage from our own archive and needs
# no external mirror (verified on testnet: "chain-link integrity OK ✓").
#
# To enable Tier B on a test net, first build a network-correct mirror with
# stellar-archivist from stellar_history_archive_url_set, then set this true
# in that inventory.
verify_archive_tier_b_enabled: "{{ (stellar_network | default('pubnet')) == 'pubnet' }}"

# archive-completeness verify. Its report has exactly ONE section —
# `cross_anchor` — measured against VERIFY/ARCHIVE root /srv/history-archive,
# the same pubnet-only local mirror Tier B anchors on. There is no
# test-net-meaningful part of this check.
#
# Left ungated it did real harm on the test nets, not just noise. The
# tool's `-network` flag (which the unit template never passed, so it took
# its "pubnet" DEFAULT) enables a cross-anchor FILL phase that fetches
# missing checkpoints FROM PUBNET ARCHIVES. On testnet it measured the
# pubnet stub against testnet's ledger range [2, 4354688], declared 2,506
# checkpoints "missing", and set about downloading pubnet checkpoints to
# fill them — which is also why the unit blew its 30-minute
# TimeoutStartUSec every night. audit-2026-08-26 already identified this
# fill as pubnet-only and added the refusal; nothing was passing the flag
# that triggers it.
#
# The template now passes `-network` explicitly (defence in depth — the
# fill refuses even if the unit is enabled by hand), and the unit is
# omitted where its anchor is not network-correct.
archive_completeness_enabled: "{{ (stellar_network | default('pubnet')) == 'pubnet' }}"

# pgBackRest scheduled backups. pgBackRest itself is NOT installed by this
# role (there is no apt task for it anywhere) — it is provisioned
# out-of-band on the pubnet hosts. So on a test net, "enabled" installed a
# nightly timer whose binary is absent: exit 127 and a failed unit every
# night since provisioning, AND a unit list that reads as though backups
# exist. The test nets are rebuilt from
# docs/operations/testnet-futurenet-reset-runbook.md, not restored.
#
# Derived from the network rather than left to each inventory so a FRESH
# test net is correct before anyone writes an inventory line — the
# inventories set it explicitly too, as documentation of intent. An unset
# network defaults to pubnet, so r1/r2/r3 keep backups on.
pgbackrest_backup_enabled: "{{ (stellar_network | default('pubnet')) == 'pubnet' }}"

catchup_mode:            "CATCHUP_RECENT"       # RECENT | COMPLETE
is_validator:            false
node_is_validator:       "{{ is_validator }}"

