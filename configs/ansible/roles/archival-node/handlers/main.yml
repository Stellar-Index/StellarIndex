---
# CHECK-MODE UNIT GUARD (tasks/main.yml holds the rule and the history).
# Handlers that restart a unit THIS ROLE installs carry
# `when: not ansible_check_mode` — the blunter form, on purpose:
#
#   - the notifying task's register may live in a task file the current
#     `--tags` selection skipped, so the precise
#     `not (ansible_check_mode and <register> is changed)` used on the
#     enable/start tasks would evaluate an undefined variable here;
#   - `state: restarted` asserts no state to preview. It reports changed
#     whenever it is notified, so skipping it in check mode costs the
#     drift report nothing, while NOT skipping it aborts the whole
#     preview the first time a notified unit is not yet on the host.
#
# Handlers for PACKAGED units (postgres, clickhouse-server, redis,
# nftables, ssh, journald, rsyslog, caddy, the apt exporters) are left
# unguarded: apt put those units on the host, so systemd can find them.
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  # Also answer the lowercase `daemon-reload` topic: several drop-in
  # tasks (10-observability.yml probes, the archive-completeness
  # override) notify `daemon-reload`, but this role has no handler by
  # that name — a bare `notify: daemon-reload` errors with "handler not
  # found" the moment the notifying task reports changed. Aliasing it
  # here routes those notifies to the one canonical daemon-reload.
  listen: daemon-reload

- name: Restart postgres
  ansible.builtin.systemd:
    name: "postgresql@{{ postgres_version }}-main"
    state: restarted

- name: Restart stellar-core
  ansible.builtin.systemd:
    name: stellar-core
    state: restarted
  when: not ansible_check_mode  # role-installed unit; see the note above

- name: Restart galexie
  ansible.builtin.systemd:
    name: galexie
    state: restarted
  when: not ansible_check_mode  # role-installed unit; see the note above

- name: Restart minio
  ansible.builtin.systemd:
    name: minio
    state: restarted
  when: not ansible_check_mode  # role-installed unit; see the note above

- name: Restart clickhouse-server
  ansible.builtin.systemd:
    name: clickhouse-server
    state: restarted

- name: Restart stellarindex-indexer
  ansible.builtin.systemd:
    name: stellarindex-indexer
    state: restarted
  when: not ansible_check_mode  # role-installed unit; see the note above

- name: Restart stellarindex-aggregator
  # No-op on test nets (run_aggregator=false) — the unit isn't installed
  # there, so a config-change notify must not try to restart a missing unit.
  when:
    - run_aggregator | default(true) | bool
    - not ansible_check_mode  # role-installed unit; see the note above
  ansible.builtin.systemd:
    name: stellarindex-aggregator
    state: restarted

- name: Restart stellarindex-api
  ansible.builtin.systemd:
    name: stellarindex-api
    state: restarted
  when: not ansible_check_mode  # role-installed unit; see the note above

# Timer-driven oneshot units (verify-archive-tier-a /
# archive-completeness / supply-snapshot): a unit-file change is
# picked up on the next timer fire after a daemon-reload — the
# oneshot service itself is not restarted (it isn't running).
- name: Restart verify-archive-tier-a.timer
  ansible.builtin.systemd:
    name: verify-archive-tier-a.timer
    state: restarted
  when: not ansible_check_mode  # role-installed unit; see the note above

- name: Restart archive-completeness.timer
  ansible.builtin.systemd:
    name: archive-completeness.timer
    state: restarted
  when: not ansible_check_mode  # role-installed unit; see the note above

- name: Restart supply-snapshot.timer
  ansible.builtin.systemd:
    name: supply-snapshot.timer
    state: restarted
  when: not ansible_check_mode  # role-installed unit; see the note above

- name: Restart node_exporter
  # Legacy handler kept for any pre-#33 task references; new tasks
  # should notify `Restart prometheus-node-exporter` instead.
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted

- name: Restart prometheus-node-exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted

- name: Restart promtail
  ansible.builtin.systemd:
    name: promtail
    state: restarted

# 12-hardening — apply the CIS L2 sysctl.d drop-in immediately
# (sysctl --system re-reads every /etc/sysctl.d/* in order, so the
# 90-stellarindex.conf tunings from 02-kernel.yml are unaffected).
- name: Apply sysctl hardening
  ansible.builtin.command: sysctl --system
  changed_when: true

# 12-hardening — merge /etc/audit/rules.d/*.rules and load into the
# running auditd without a service restart (auditd restarts are
# awkward under systemd; augenrules --load is the supported path).
- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: Restart core exporter
  ansible.builtin.systemd:
    name: stellar-core-prometheus-exporter
    state: restarted

- name: Restart nftables
  ansible.builtin.systemd:
    name: nftables
    state: restarted

- name: Restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted

# 15-log-discipline — journald cap is applied by restarting the
# daemon; the new SystemMaxUse limit takes effect on the next
# rotation cycle. Restarting is cheap (sub-second) and idempotent.
- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

# rsyslog needs a HUP rather than a restart to pick up the
# /etc/logrotate.d/rsyslog drop-in; reload triggers a HUP via
# systemd's ExecReload, which rotates without interrupting logging.
- name: Reload rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted  # noble's rsyslog.service has no ExecReload; restart is instant and journald buffers

# 17-stellarindex-healthchecks — wrapper-script and unit edits
# notify only the matching timer group, so a touch on smoke.sh
# doesn't churn the heartbeat or sla-probe timers.
- name: Restart stellarindex-heartbeat timers
  ansible.builtin.systemd:
    name: "stellarindex-heartbeat@{{ item }}.timer"
    state: restarted
  loop:
    - indexer
    - aggregator
    - api
  when: not ansible_check_mode  # role-installed unit; see the note above

- name: Restart stellarindex-smoke timer
  ansible.builtin.systemd:
    name: stellarindex-smoke.timer
    state: restarted
  when: not ansible_check_mode  # role-installed unit; see the note above

- name: Restart stellarindex-sla-probe timer
  ansible.builtin.systemd:
    name: stellarindex-sla-probe.timer
    state: restarted
  when: not ansible_check_mode  # role-installed unit; see the note above

- name: Restart redis
  ansible.builtin.systemd:
    name: redis-server
    state: restarted

- name: Reload caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded

- name: Restart prometheus-postgres-exporter
  ansible.builtin.systemd:
    name: prometheus-postgres-exporter
    state: restarted

# 23-local-prometheus — restart rather than reload. A SIGHUP reload
# would be gentler, but it depends on the packaged unit declaring
# ExecReload, and `state: reloaded` fails outright on a unit that does
# not; a restart works on any packaging. The cost is ~1 s on a test-net
# TSDB and no data: the WAL is replayed on start. `daemon_reload` is on
# because the memory-cap drop-in is a unit change, not just a config one.
- name: Restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true
  # Check mode never really installs the package, so the unit does not
  # exist and systemd fails the handler outright — which made
  # `--check --diff` unusable for this tag on a host that has not had a
  # real apply yet. A dry run that cannot be run is a dry run nobody
  # does, so skip the restart when we are only previewing; there is
  # nothing running to restart in that state anyway.
  when: not ansible_check_mode

- name: Restart cap67-movements
  # Targeted restart for the follow daemon, notified ONLY by its own unit
  # template (14-stellarindex-services.yml). SIGTERM is graceful: the loop
  # exits mid-derive, the watermark holds, ReplacingMergeTree dedups any
  # re-derived window — so a restart on a real unit change is safe.
  ansible.builtin.systemd:
    name: cap67-movements.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode  # role-installed unit; see the note above
