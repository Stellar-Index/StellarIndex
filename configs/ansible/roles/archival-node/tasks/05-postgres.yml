---
# Postgres 15 from the PGDG repository. stellar-core uses BucketListDB
# (Postgres-backed) per ADR discussion in the archival-node spec.
#
# Secrets (postgres_pass_core) come from ansible-vault.

- name: Add PGDG apt key
  ansible.builtin.get_url:
    url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
    dest: /etc/apt/keyrings/pgdg.asc
    mode: "0644"

- name: Add PGDG apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_facts.distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install Postgres {{ postgres_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-contrib-{{ postgres_version }}"
      - "postgresql-client-{{ postgres_version }}"
      - python3-psycopg2          # required by community.postgresql modules
    state: present
    update_cache: true

- name: Verify Postgres cluster dir is on the ZFS dataset
  ansible.builtin.stat:
    path: "/var/lib/postgresql/{{ postgres_version }}/main"
  register: pg_main_dir

# ── WAL headroom guard ──────────────────────────────────────────────
#
# Refuse to write a postgresql.conf whose max_wal_size does not fit the
# filesystem pg_wal is ACTUALLY on. On 2026-09-16 raising max_wal_size
# from 2GB to 16GB took r1's database down: the reasoning in the
# template asserted "pg_wal sits on a dataset with 2.7TB free", which
# was true of the DATA directory and false of pg_wal — a symlink to a
# /pgwal path on the 49GB root filesystem. Root reached 0 bytes, and
# crash recovery could not write a new segment.
#
# The check resolves the symlink rather than trusting the data
# directory, because that substitution is the whole defect. It is a
# pre-flight assert, not a post-hoc alert: max_wal_size is SIGHUP, so a
# bad value reaches a running database without a restart to think twice
# about, and the failure surfaces hours later as an outage.
#
# The 2x multiplier is not padding. Postgres treats max_wal_size as a
# soft target for the CHECKPOINT interval, not a hard cap on the
# directory: a checkpoint that cannot keep up, or an archiver that
# stalls, both let pg_wal exceed it, and 2x is the commonly cited
# working bound. Falling below it is the condition under which this
# host has already failed once.
- name: Resolve the filesystem pg_wal is really on
  ansible.builtin.shell: |
    set -eu
    d=$(readlink -f "/var/lib/postgresql/{{ postgres_version }}/main/pg_wal" 2>/dev/null \
        || echo "/var/lib/postgresql/{{ postgres_version }}/main/pg_wal")
    # The directory may not exist yet on a fresh host; fall back to the
    # nearest existing ancestor so df still describes the right volume.
    while [ ! -d "$d" ] && [ "$d" != "/" ]; do d=$(dirname "$d"); done
    printf '%s %s %s %s\n' "$d" \
      "$(df -P -BM "$d" | tail -1 | awk '{print $4}' | tr -dc 0-9)" \
      "$(df -P "$d" | tail -1 | awk '{print $1}')" \
      "$(du -sm "$d" 2>/dev/null | awk '{print $1}' | tr -dc 0-9 || echo 0)"
  register: pg_wal_fs
  changed_when: false
  check_mode: false

- name: Refuse a max_wal_size that does not fit the pg_wal filesystem
  vars:
    _wal_path: "{{ pg_wal_fs.stdout.split()[0] }}"
    _wal_avail_mb: "{{ pg_wal_fs.stdout.split()[1] | int }}"
    _wal_device: "{{ pg_wal_fs.stdout.split()[2] }}"
    # What WAL already occupies is capacity available TO WAL, so it
    # counts toward the budget: a directory already holding 2GB of
    # segments is not 2GB short, it is 2GB spent on the thing being
    # sized. Without this the check would fail every healthy host.
    _wal_used_mb: "{{ pg_wal_fs.stdout.split()[3] | default(0) | int }}"
    # Accepts the GB/MB spellings this template uses. A unitless value
    # is megabytes, matching Postgres' own default unit for this GUC.
    _max_wal_mb: >-
      {{ (postgres_max_wal_size | default('2GB') | regex_replace('(?i)\s*([kmgt]?b)$', '') | int)
         * (1024 if (postgres_max_wal_size | default('2GB')) is search('(?i)gb$') else 1) }}
  ansible.builtin.assert:
    that:
      - (_wal_avail_mb | int) + (_wal_used_mb | int) >= (_max_wal_mb | int) * 2
    fail_msg: >-
      max_wal_size={{ postgres_max_wal_size | default('2GB') }}
      ({{ _max_wal_mb }}MB) needs {{ (_max_wal_mb | int) * 2 }}MB of room
      on {{ _wal_path }} ({{ _wal_device }}), which has
      {{ (_wal_avail_mb | int) + (_wal_used_mb | int) }}MB
      ({{ _wal_avail_mb }}MB free + {{ _wal_used_mb }}MB already WAL).
      Postgres
      can exceed max_wal_size when a checkpoint or the archiver falls
      behind. Either lower postgres_max_wal_size, or move pg_wal to a
      volume with room — on this fleet the data pool has terabytes free
      while pg_wal is on root. Raising this value past the volume is
      what took r1 down on 2026-09-16.
    success_msg: >-
      max_wal_size {{ _max_wal_mb }}MB fits {{ _wal_path }} on
      {{ _wal_device }}: {{ (_wal_avail_mb | int) + (_wal_used_mb | int) }}MB
      available to WAL against {{ (_max_wal_mb | int) * 2 }}MB needed.

- name: Template postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart postgres

- name: Template pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart postgres

- name: Ensure Postgres is running
  ansible.builtin.systemd:
    name: "postgresql@{{ postgres_version }}-main"
    state: started
    enabled: true

- name: Create stellar-core Postgres role
  when: run_stellar_core | bool  # 2026-07-03: core was trimmed from r1 (2026-04-23); creating its DB role unconditionally breaks on hosts whose secrets file has no postgres_pass_core
  community.postgresql.postgresql_user:
    name: "{{ postgres_user_core }}"
    password: "{{ postgres_pass_core }}"
    encrypted: true
    state: present
  become_user: postgres

- name: Create stellar-core database
  when: run_stellar_core | bool
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_core }}"
    owner: "{{ postgres_user_core }}"
    encoding: "UTF8"
    lc_collate: "en_US.UTF-8"
    lc_ctype: "en_US.UTF-8"
    template: "template0"
    state: present
  become_user: postgres

- name: Enable pg_stat_statements extension (core DB)
  when: run_stellar_core | bool  # 2026-07-03: core trimmed from r1; its DB does not exist
  community.postgresql.postgresql_ext:
    login_db: "{{ postgres_db_core }}"
    name: "pg_stat_statements"
    state: present
  become_user: postgres

# pg_stat_statements on the APPLICATION db is enabled AFTER the db is
# created, below ("Enable pg_stat_statements on stellarindex db"). A
# duplicate task here (before the CREATE DATABASE) passed idempotently on
# the already-built r1 but fails a FRESH build ("database does not exist");
# removed 2026-08-26.

# ──── stellarindex application database ─────────────────────────────
# Used by stellarindex-indexer / aggregator / api. Owns the trades +
# oracle_updates hypertables + price-aggregate CAGGs. TimescaleDB
# extension is enabled at db-create time so migrations don't need
# superuser to CREATE EXTENSION.

- name: Install TimescaleDB apt repo signing key
  ansible.builtin.get_url:
    url: "https://packagecloud.io/timescale/timescaledb/gpgkey"
    dest: /etc/apt/keyrings/timescaledb.asc
    mode: "0644"

- name: Add TimescaleDB apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/timescaledb.asc] https://packagecloud.io/timescale/timescaledb/ubuntu/ {{ ansible_facts.distribution_release }} main"
    state: present
    filename: timescaledb

- name: Install TimescaleDB for Postgres {{ postgres_version }}
  ansible.builtin.apt:
    name: "timescaledb-2-postgresql-{{ postgres_version }}"
    state: present
    update_cache: true
  notify: Restart postgres

- name: Add timescaledb to shared_preload_libraries
  # Value carries a space after the comma to match what Postgres stores
  # and reports back ("timescaledb, pg_stat_statements"). postgresql_set
  # string-compares the desired value against the live pg_settings value,
  # so the spaceless form drifts (reports changed → restart handler) on
  # every --check run (2026-07-06 drift reconcile).
  community.postgresql.postgresql_set:
    name: shared_preload_libraries
    value: "timescaledb, pg_stat_statements"
  become_user: postgres
  notify: Restart postgres

- name: Flush handlers (postgres restart needed before timescaledb extension is usable)
  ansible.builtin.meta: flush_handlers

- name: Create stellarindex Postgres role
  community.postgresql.postgresql_user:
    name: "{{ postgres_user_stellarindex }}"
    password: "{{ postgres_pass_stellarindex }}"
    encrypted: true
    state: present
  become_user: postgres
  no_log: true

- name: Create stellarindex Postgres database
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_stellarindex }}"
    owner: "{{ postgres_user_stellarindex }}"
    encoding: "UTF8"
    lc_collate: "en_US.UTF-8"
    lc_ctype: "en_US.UTF-8"
    template: "template0"
    state: present
  become_user: postgres

- name: Enable timescaledb extension on stellarindex db
  community.postgresql.postgresql_ext:
    login_db: "{{ postgres_db_stellarindex }}"
    name: "timescaledb"
    state: present
  become_user: postgres

- name: Enable pg_stat_statements on stellarindex db
  community.postgresql.postgresql_ext:
    login_db: "{{ postgres_db_stellarindex }}"
    name: "pg_stat_statements"
    state: present
  become_user: postgres

- name: Disable JIT on the stellarindex db (2026-07-10 incident)
  # PG15's LLVM JIT allocates large per-query chunks; under
  # vm.overcommit_memory=2 two concurrent JIT-compiled chart queries
  # blew the kernel commit budget ("FATAL: out of memory / while in
  # LLVM"), poisoning unrelated backends — the aquarius replay's
  # InsertTrade batches all failed for ~15s (dropped rows, re-replayed)
  # and the resulting error-log flood seized the indexer via the fd-2
  # wrap. Timescale workloads see no JIT benefit; keep it off.
  community.postgresql.postgresql_query:
    login_db: "{{ postgres_db_stellarindex }}"
    query: "ALTER DATABASE {{ postgres_db_stellarindex }} SET jit = off"
  become_user: postgres
  changed_when: false
