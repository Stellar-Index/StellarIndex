---
# Idempotent Ansible mirror of `configs/healthchecks/install.sh` (a MANUAL
# operator script, which would otherwise leave the deployed wrappers and units
# drifting behind the repo). Three wrapper-script + unit groups, each with its
# own handler so touching `smoke.sh` restarts only the smoke timer.
# install.sh stays as the ad-hoc bring-up path for hosts not yet in inventory.
#
# The env-file /etc/default/stellarindex-healthchecks is operator-populated: a
# placeholder is written ONLY on first install (`force: false`) so applies keep
# the pasted Healthchecks.io URLs.

- name: Ensure /opt/stellarindex/healthchecks/ exists
  ansible.builtin.file:
    path: /opt/stellarindex/healthchecks
    state: directory
    owner: root
    group: root
    mode: "0755"

# ── Wrapper scripts ────────────────────────────────────────────
#
# Four scripts: three from configs/healthchecks/ plus r1-smoke.sh from
# scripts/dev/, which the smoke wrapper invokes. Sourced via
# `{{ playbook_dir }}/../../../` for a single source of truth, as
# 14-stellarindex-services.yml does for bin/ and migrations/.

- name: Install hc-ping.sh
  # Sourced by all three wrappers. Must land first: a wrapper whose
  # `. hc-ping.sh` cannot resolve exits immediately, taking out the checks it
  # instruments.
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../configs/healthchecks/hc-ping.sh"
    dest: /opt/stellarindex/healthchecks/hc-ping.sh
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart stellarindex-heartbeat timers
    - Restart stellarindex-smoke timer
    - Restart stellarindex-sla-probe timer

- name: Install heartbeat.sh
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../configs/healthchecks/heartbeat.sh"
    dest: /opt/stellarindex/healthchecks/heartbeat.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart stellarindex-heartbeat timers

- name: Install smoke.sh
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../configs/healthchecks/smoke.sh"
    dest: /opt/stellarindex/healthchecks/smoke.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart stellarindex-smoke timer

- name: Install r1-smoke.sh
  # The smoke wrapper invokes /opt/stellarindex/healthchecks/r1-smoke.sh (see
  # SMOKE_SCRIPT in smoke.sh); copying it alongside means no repo checkout is
  # needed on the host.
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/dev/r1-smoke.sh"
    dest: /opt/stellarindex/healthchecks/r1-smoke.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart stellarindex-smoke timer

- name: Install sla-probe.sh
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../configs/healthchecks/sla-probe.sh"
    dest: /opt/stellarindex/healthchecks/sla-probe.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart stellarindex-sla-probe timer

# ── systemd units ─────────────────────────────────────────────
#
# Heartbeat (template service + timer), smoke and sla-probe (service + timer).
# Static, so copied verbatim rather than rendered. Each notify routes the
# matching timer-restart handler so a heartbeat-only edit doesn't churn the
# others.

- name: Install stellarindex-heartbeat@.service
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../configs/healthchecks/stellarindex-heartbeat@.service"
    dest: /etc/systemd/system/stellarindex-heartbeat@.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart stellarindex-heartbeat timers

- name: Install stellarindex-heartbeat@.timer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../configs/healthchecks/stellarindex-heartbeat@.timer"
    dest: /etc/systemd/system/stellarindex-heartbeat@.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart stellarindex-heartbeat timers
  register: stellarindex_heartbeat_timer_unit

- name: Install stellarindex-smoke.service
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../configs/healthchecks/stellarindex-smoke.service"
    dest: /etc/systemd/system/stellarindex-smoke.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart stellarindex-smoke timer

- name: Install stellarindex-smoke.timer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../configs/healthchecks/stellarindex-smoke.timer"
    dest: /etc/systemd/system/stellarindex-smoke.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart stellarindex-smoke timer
  register: stellarindex_smoke_timer_unit

- name: Install stellarindex-sla-probe.service
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../configs/healthchecks/stellarindex-sla-probe.service"
    dest: /etc/systemd/system/stellarindex-sla-probe.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart stellarindex-sla-probe timer

- name: Install stellarindex-sla-probe.timer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../configs/healthchecks/stellarindex-sla-probe.timer"
    dest: /etc/systemd/system/stellarindex-sla-probe.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart stellarindex-sla-probe timer
  register: stellarindex_sla_probe_timer_unit

# ── Env-file (operator-populated) ─────────────────────────────
#
# Holds the five Healthchecks.io URLs (3 heartbeats, 1 smoke, 1 sla-probe).
# `force: false` is the idempotency knob: without it every run would overwrite
# the populated file with the placeholder.

- name: Provision placeholder /etc/default/stellarindex-healthchecks if missing
  ansible.builtin.copy:
    dest: /etc/default/stellarindex-healthchecks
    owner: root
    group: root
    mode: "0600"
    force: false
    content: |
      # Healthchecks.io URLs — operator-populated. Re-run of the
      # archival-node role will NOT overwrite this file (force: false).
      #
      # Each is a separate "Check" on healthchecks.io. Empty URL silently
      # skips the ping (the underlying probe still runs and logs failures
      # via journalctl, so the timer is useful even before URLs are wired).
      #
      # Per-binary heartbeats (60 s cadence, suggested grace 120 s):
      HEALTHCHECKS_URL_INDEXER=
      HEALTHCHECKS_URL_AGGREGATOR=
      HEALTHCHECKS_URL_API=
      # API surface smoke test (5 min cadence, suggested grace 10 min):
      HEALTHCHECKS_URL_SMOKE=
      # SLA probe (latency + freshness; 15 min cadence, grace 30 min):
      HEALTHCHECKS_URL_SLA_PROBE=
      # SLA probe tuning (defaults match the binary's flag defaults).
      # SLA_PROBE_BASE_URL=http://localhost:3000/v1
      # SLA_PROBE_DURATION=30s
      # SLA_PROBE_CONCURRENCY=1
      # SLA_PROBE_PAIR=native,fiat:USD

# ── Enable timers ─────────────────────────────────────────────
#
# daemon_reload here is defence-in-depth: the Reload-systemd handler runs at
# the end of the play, but timers should be usable mid-play.

- name: Enable + start stellarindex-heartbeat timers
  ansible.builtin.systemd:
    name: "stellarindex-heartbeat@{{ item }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  # No aggregator unit exists where run_aggregator is false; its heartbeat
  # would probe a missing service and fail every minute.
  loop: "{{ ['indexer', 'api'] + (['aggregator'] if run_aggregator | default(true) | bool else []) }}"
  when:
    # Role-installed unit — CHECK-MODE UNIT GUARD, tasks/main.yml.
    - not (ansible_check_mode and stellarindex_heartbeat_timer_unit is changed)

- name: Stop + disable stellarindex-heartbeat@aggregator timer when not run (test nets)
  ansible.builtin.systemd:
    name: stellarindex-heartbeat@aggregator.timer
    state: stopped
    enabled: false
  when:
    - not (run_aggregator | default(true) | bool)
    # Role-installed unit — CHECK-MODE UNIT GUARD, tasks/main.yml.
    - not (ansible_check_mode and stellarindex_heartbeat_timer_unit is changed)
  failed_when: false

- name: Enable + start stellarindex-smoke timer
  ansible.builtin.systemd:
    name: stellarindex-smoke.timer
    state: started
    enabled: true
    daemon_reload: true
  when:
    # Role-installed unit — CHECK-MODE UNIT GUARD, tasks/main.yml.
    - not (ansible_check_mode and stellarindex_smoke_timer_unit is changed)

- name: Enable + start stellarindex-sla-probe timer
  ansible.builtin.systemd:
    name: stellarindex-sla-probe.timer
    state: started
    enabled: true
    daemon_reload: true
  when:
    # Role-installed unit — CHECK-MODE UNIT GUARD, tasks/main.yml.
    - not (ansible_check_mode and stellarindex_sla_probe_timer_unit is changed)
