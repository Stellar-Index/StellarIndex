---
# F-0152 (audit-2026-05-26): closes the cascade-blind deployment
# gap where `configs/prometheus/prometheus.r1.yml` has scrape jobs
# for redis_exporter / postgres_exporter / pgbackrest_exporter,
# but none of the three were ever installed on r1. The audit
# originally framed F-0045/F-0046/F-0047 as runtime crashes;
# reality is they never ran. Every alert family that consumes
# their metrics (cache.yml, storage.yml, pgbackrest.* in
# infra.yml) has been silently `absent_over_time` since the rule
# files landed — the F-0085 meta-alert that fires `up == 0` is
# the only thing that currently surfaces the gap.
#
# Four groups wired here:
#   - Group A: redis_exporter via the Debian package
#     `prometheus-redis-exporter` (port 9121). Distinct from the
#     redis-sentinel role's tarball-based exporter — this is
#     archival-node's single-node `redis-server` shape, NOT the
#     Sentinel cluster.
#   - Group B: postgres_exporter via the Debian package
#     `prometheus-postgres-exporter` (port 9187), peer-auth on
#     the local socket as the `postgres` superuser. Requires
#     `GRANT pg_monitor TO postgres_exporter` if the operator
#     later switches to a non-superuser role — documented in
#     `docs/operations/r1-deployment-state.md`.
#   - Group C: pgbackrest_exporter — no Debian package; pinned
#     upstream release tarball from
#     https://github.com/woblerr/pgbackrest_exporter/releases
#     (port 9854). Same fail-fast checksum pattern as F-1280 /
#     F-1285 / F-1291 / F-1293 — operator must set
#     `pgbackrest_exporter_release_sha256` in inventory.
#   - Group D: MinIO's native /minio/v2/metrics/cluster bearer token
#     (INV-0981/INV-1144). No exporter binary — MinIO exposes its
#     own metrics behind `admin:Prometheus`; provisioning was an
#     operator hand-step (docs/operations/runbooks/minio-metrics-403.md)
#     with no ansible task producing it, so a rebuilt or rotated host
#     silently shipped a missing/empty `/etc/prometheus/minio.token`
#     and every MinIO-dependent alert went blind.
#
# Env-files containing DATA_SOURCE_NAME live at mode 0640 with
# group `prometheus` so the package-shipped systemd unit (which
# runs as `prometheus`) can read them but no other local user
# can. Matches the F-1295 posture used by the redis-sentinel
# role's secret env-file.

# ── Group A: redis_exporter (Debian package) ──────────────────
#
# Ubuntu ships `prometheus-redis-exporter` in the `universe`
# component on noble (24.04) and jammy (22.04). r1 is noble per
# `r1-deployment-state.md` § Hardware (Ubuntu 24.04.3 LTS). The
# `apt` module will surface a clear error if universe is not
# enabled — recovery is to add the component via
# `add-apt-repository universe` or via /etc/apt/sources.list.d/.

- name: Install prometheus-redis-exporter Debian package
  ansible.builtin.apt:
    name: prometheus-redis-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

# T641: redis-server now requires auth (08-redis.yml sets
# requirepass from redis_password and flushes that restart before
# this task runs). REDIS_PASSWORD is read directly by the exporter
# binary (same env var oliver006/redis_exporter uses, per
# redis-sentinel/tasks/07-monitoring.yml's precedent) — without it
# every scrape gets NOAUTH and cache.yml's alerts go dark. Same
# 0640 root:prometheus posture as the postgres env-file below.
- name: Template /etc/default/prometheus-redis-exporter
  ansible.builtin.copy:
    dest: /etc/default/prometheus-redis-exporter
    owner: root
    group: prometheus
    mode: "0640"
    content: |
      # Managed by ansible (archival-node role / 16-prometheus-exporters.yml).
      # Sourced via the Debian-shipped systemd unit's `EnvironmentFile=`.
      REDIS_ADDR=redis://localhost:6379
      REDIS_PASSWORD={{ redis_password }}
      # The Debian unit's ExecStart is `prometheus-redis-exporter $ARGS` —
      # it does not read WEB_LISTEN_ADDRESS, so the listen address must be
      # passed as a CLI flag via ARGS (same pattern as node_exporter and
      # local-prometheus in this role) or it silently falls back to :9121
      # on all interfaces. Listen on loopback only — nftables blocks
      # external 9121 access regardless, but defence-in-depth.
      ARGS="--web.listen-address=127.0.0.1:9121"
  no_log: true
  notify:
    - Restart prometheus-redis-exporter

- name: Enable + start prometheus-redis-exporter
  ansible.builtin.systemd:
    name: prometheus-redis-exporter
    state: started
    enabled: true
    daemon_reload: true

# ── Group B: postgres_exporter (Debian package) ───────────────
#
# The Debian package ships its own `prometheus` system user and
# runs the exporter as that user. We auth against postgres on
# the local Unix socket via peer auth, which means the
# DATA_SOURCE_NAME is read from /etc/default/prometheus-postgres-exporter
# by the package's systemd unit. We connect as the exporter's OWN
# OS user (`prometheus`) via peer auth on the local socket to a
# same-named PG role holding pg_monitor — no password anywhere.
# `sslmode=disable` is required for Unix-socket connections.
#
# HISTORY (2026-07-05, the pg_up=0 blind spell): the previous
# `user=postgres` socket DSN could NEVER work — peer auth requires
# the OS user to match, and the unit runs as `prometheus`, not
# `postgres`. The exporter had ALSO kept a stale pre-rotation TCP
# DSN in-process for weeks (env-file edits don't apply until
# restart). Both failure modes are closed by the role task below +
# the restart handler.

# Group B needs a running Postgres to grant into and a role for the
# exporter to authenticate as; main.yml's own scrape-list Jinja already
# gates the `postgres_exporter` job on `run_postgres` (defaults/main.yml)
# — the install/start tasks below must match or a non-Postgres host
# fails the psql GRANT unconditionally.
- name: Group B — postgres_exporter (requires Postgres)
  when: run_postgres | bool
  block:
    - name: PG monitoring role for the exporter (peer-auth, pg_monitor)
      become: true
      become_user: postgres
      become_flags: ""
      ansible.builtin.command:
        cmd: psql -d stellarindex -c "DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'prometheus') THEN CREATE ROLE prometheus LOGIN; END IF; END $do$; GRANT pg_monitor TO prometheus;"
      register: pgrole
      changed_when: "'GRANT ROLE' in pgrole.stdout"
      failed_when: pgrole.rc != 0

    - name: Install prometheus-postgres-exporter Debian package
      ansible.builtin.apt:
        name: prometheus-postgres-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Env-file is 0640 root:prometheus — DATA_SOURCE_NAME would
    # leak a password if the operator switches off peer auth, so
    # we treat the file as secret regardless of current contents
    # (F-1295 posture).
    - name: Template /etc/default/prometheus-postgres-exporter
      ansible.builtin.copy:
        dest: /etc/default/prometheus-postgres-exporter
        owner: root
        group: prometheus
        mode: "0640"
        content: |
          # Managed by ansible (archival-node role / 16-prometheus-exporters.yml).
          # Sourced via the Debian-shipped systemd unit's `EnvironmentFile=`.
          #
          # Peer auth on the local Unix socket as the exporter's own OS
          # user (`prometheus`), matched to a same-named pg_monitor role
          # (created by the role task above); no password anywhere.
          DATA_SOURCE_NAME="user=prometheus host=/var/run/postgresql dbname=stellarindex sslmode=disable"
          # The Debian unit's ExecStart is `prometheus-postgres-exporter $ARGS` —
          # it does not read PG_EXPORTER_WEB_LISTEN_ADDRESS, so the listen
          # address must be passed as a CLI flag via ARGS (same pattern as
          # node_exporter and local-prometheus in this role) or it silently
          # falls back to :9187 on all interfaces. Listen on loopback only —
          # same defence-in-depth as redis_exporter.
          ARGS="--web.listen-address=127.0.0.1:9187"
      notify: Restart prometheus-postgres-exporter

    - name: Enable + start prometheus-postgres-exporter
      ansible.builtin.systemd:
        name: prometheus-postgres-exporter
        state: started
        enabled: true
        daemon_reload: true

# ── Bind post-condition (Groups A + B) ────────────────────────
#
# ARGS reaches the exporter only through the packaged unit's `$ARGS`;
# if that ever stops holding, the exporter silently binds every
# interface and the run stays green. Ask the kernel what is listening.
# Flush first so a changed env-file's restart has already happened.
- name: Apply pending exporter restarts before checking their binds
  ansible.builtin.meta: flush_handlers

- name: Read the exporters' listening sockets
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: [ss, -Hlnt, "sport = :{{ item }}"]
  loop: "{{ [9121] + ([9187] if run_postgres | bool else []) }}"
  register: exporter_listeners
  changed_when: false
  retries: 10
  delay: 2
  until: exporter_listeners.stdout | length > 0

- name: Assert the exporters listen on loopback only
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - item.stdout_lines | reject('search', '[ ]127[.]0[.]0[.]1:' ~ item.item ~ '[ ]') | list | length == 0
    fail_msg: >-
      Exporter on port {{ item.item }} is not bound to 127.0.0.1 only:
      {{ item.stdout_lines }}. Its --web.listen-address in ARGS did not
      take effect.
  loop: "{{ exporter_listeners.results }}"
  loop_control:
    label: "{{ item.item }}"

# ── Group C: pgbackrest_exporter (upstream tarball) ───────────
#
# No Debian package exists. Pinned upstream release from
# https://github.com/woblerr/pgbackrest_exporter/releases.
# Same fail-fast checksum pattern as F-1280/F-1285/F-1291 +
# F-1293 — operator must set `pgbackrest_exporter_release_sha256`
# in inventory before running this group. The default version
# (`pgbackrest_exporter_version` in defaults/main.yml) is
# updated per release; the SHA must be re-pasted from the
# upstream releases page when the version bumps.
#
# Gated the same as the `pgbackrest_exporter` scrape job
# (defaults/main.yml) — nothing to export metrics FOR when backups
# are disabled, and pinning a release without a repo to watch is
# pure risk with no payoff.
- name: Group C — pgbackrest_exporter (requires pgbackrest backups)
  when: pgbackrest_backup_enabled | default(true) | bool
  block:
    - name: assert pgbackrest_exporter_release_sha256 is set
      ansible.builtin.assert:
        that:
          - pgbackrest_exporter_release_sha256 is defined
          - pgbackrest_exporter_release_sha256 | length == 64
        fail_msg: >-
          pgbackrest_exporter_release_sha256 must be set in inventory.
          Pull the matching SHA from the release page:
          https://github.com/woblerr/pgbackrest_exporter/releases/tag/v{{ pgbackrest_exporter_version }}

    - name: Ensure pgbackrest_exporter system user
      ansible.builtin.user:
        name: pgbackrest_exporter
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/pgbackrest_exporter
        create_home: false
        state: present

    - name: Check installed pgbackrest_exporter version
      ansible.builtin.command: /usr/local/bin/pgbackrest_exporter --version
      register: pge_current
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Download pgbackrest_exporter release tarball
      # Skipped when the installed version already matches — the download
      # previously ran unconditionally (2026-07-03 drift audit), and the
      # URL pattern matched the 0.18-era naming; >=0.23 uses
      # name-version-os-arch with x86_64.
      when: pgbackrest_exporter_version not in ((pge_current.stdout | default('')) + (pge_current.stderr | default('')))
      ansible.builtin.get_url:
        url: "https://github.com/woblerr/pgbackrest_exporter/releases/download/v{{ pgbackrest_exporter_version }}/pgbackrest_exporter-{{ pgbackrest_exporter_version }}-linux-x86_64.tar.gz"
        dest: "/tmp/pgbackrest_exporter-{{ pgbackrest_exporter_version }}.tgz"
        checksum: "sha256:{{ pgbackrest_exporter_release_sha256 }}"
        mode: "0644"

    - name: Extract pgbackrest_exporter tarball
      when: pgbackrest_exporter_version not in ((pge_current.stdout | default('')) + (pge_current.stderr | default('')))
      ansible.builtin.unarchive:
        src: "/tmp/pgbackrest_exporter-{{ pgbackrest_exporter_version }}.tgz"
        dest: /tmp/
        remote_src: true

    - name: Install pgbackrest_exporter binary
      when: pgbackrest_exporter_version not in ((pge_current.stdout | default('')) + (pge_current.stderr | default('')))
      ansible.builtin.copy:
        src: "/tmp/pgbackrest_exporter-{{ pgbackrest_exporter_version }}-linux-x86_64/pgbackrest_exporter"
        dest: /usr/local/bin/pgbackrest_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Install pgbackrest_exporter systemd unit
      ansible.builtin.template:
        src: systemd/pgbackrest_exporter.service.j2
        dest: /etc/systemd/system/pgbackrest_exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd
      register: pgbackrest_exporter_unit

    - name: Enable + start pgbackrest_exporter
      ansible.builtin.systemd:
        name: pgbackrest_exporter
        state: started
        enabled: true
        daemon_reload: true
      when:
        # Role-installed unit — CHECK-MODE UNIT GUARD, tasks/main.yml. The
        # two exporters above are PACKAGED (apt puts their units on the
        # host), so they are deliberately left unguarded.
        - not (ansible_check_mode and pgbackrest_exporter_unit is changed)

# Converge the other way: an exporter installed before the gate above
# existed keeps running (and crash-loops with no repo to watch) once
# backups are disabled. The binary is left in place.
- name: Remove pgbackrest_exporter where backups are disabled
  when: not (pgbackrest_backup_enabled | default(true) | bool)
  block:
    - name: Stop + disable pgbackrest_exporter
      ansible.builtin.systemd:
        name: pgbackrest_exporter.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove pgbackrest_exporter unit file and drop-ins
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/pgbackrest_exporter.service
        - /etc/systemd/system/pgbackrest_exporter.service.d
      notify: Reload systemd

    - name: Clear the failed state left by earlier exporter crashes
      ansible.builtin.command:
        cmd: systemctl reset-failed pgbackrest_exporter.service
      changed_when: false
      failed_when: false

# ── Group D: MinIO Prometheus bearer token ─────────────────────
#
# Procedure per docs/operations/runbooks/minio-metrics-403.md: a
# dedicated `prometheus-read` policy scoped to `admin:Prometheus`
# only, then a service account under MinIO root carrying that
# policy — `mc admin user svcacct add` prints the generated secret
# key ONCE, on creation, which is the bearer token
# /minio/v2/metrics/cluster expects.
#
# Requires the `local` mc alias configured earlier in this role
# (09-minio.yml) and the `prometheus` system user Group A/B above
# create.
- name: Group D — MinIO Prometheus bearer token (requires MinIO)
  when: run_minio | bool
  block:
    - name: Render prometheus-read MinIO policy
      # Same dir 09-minio.yml already created for the bucket policies.
      ansible.builtin.copy:
        dest: /etc/minio/policies/prometheus-read.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": ["admin:Prometheus"],
                "Resource": ["arn:aws:s3:::*"]
              }
            ]
          }

    - name: Install / update prometheus-read MinIO policy
      ansible.builtin.command:
        argv:
          - /usr/local/bin/mc
          - admin
          - policy
          - create
          - local
          - prometheus-read
          - /etc/minio/policies/prometheus-read.json
      changed_when: false

    - name: Check for an existing Prometheus MinIO bearer token
      ansible.builtin.stat:
        path: /etc/prometheus/minio.token
      register: minio_prom_token_file

    - name: Generate the Prometheus MinIO bearer token
      # Generated ONCE — svcacct add mints a NEW secret key every call, so
      # re-running this on every apply would invalidate the previous token
      # and break scraping until the next reload. Rotating it (MinIO root
      # rotation only, docs/operations/credential-rotation.md) is a
      # deliberate manual step: remove the file, then re-run this tag.
      # stdout carries the secret key — no_log on this task and the write
      # below, same posture as the `mc admin user add` tasks above.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/mc
          - admin
          - user
          - svcacct
          - add
          - local
          - "{{ minio_root_user }}"
          # mc reads --policy as a JSON file path, not a policy name.
          - --policy
          - /etc/minio/policies/prometheus-read.json
          - --name
          - prometheus-metrics-scrape
          - --description
          - "Bearer-token scrape for /minio/v2/metrics/cluster"
          - --json
      register: minio_prom_svcacct
      # Same reasoning as the mc-admin-user tasks in 09-minio.yml: a real
      # MinIO mutation, not previewable, so it does not run under --check.
      # Guarding the Write task below on the SAME condition (rather than
      # `minio_prom_svcacct is not skipped`) matters on a fresh host that
      # has never had a real apply: under --check the "no file yet" branch
      # is always taken, so without this guard the Write task would
      # reference `minio_prom_svcacct.stdout` from a task --check never ran.
      when:
        - not minio_prom_token_file.stat.exists
        - not ansible_check_mode
      changed_when: true
      no_log: true

    - name: Write the Prometheus MinIO bearer token file
      ansible.builtin.copy:
        dest: /etc/prometheus/minio.token
        owner: prometheus
        group: prometheus
        mode: "0400"
        content: "{{ (minio_prom_svcacct.stdout | from_json).secretKey }}"
      when:
        - not minio_prom_token_file.stat.exists
        - not ansible_check_mode
      no_log: true
      notify: Restart prometheus
