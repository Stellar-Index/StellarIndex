---
# Installs the exporters that `configs/prometheus/prometheus.r1.yml` scrapes.
# Without them the scrape jobs exist but the alert families consuming their
# metrics (cache.yml, storage.yml, pgbackrest.* in infra.yml) go silently
# `absent_over_time`; only the `up == 0` meta-alert surfaces the gap.
#
# Groups: A redis_exporter (9121), B postgres_exporter (9187), C
# pgbackrest_exporter (9854), D MinIO metrics bearer token. A and B use the
# Debian packages, C a pinned upstream tarball, D has no binary.
#
# Env-files holding DATA_SOURCE_NAME are 0640 root:prometheus so the packaged
# unit (runs as `prometheus`) can read them and no other local user can.

# ── Group A: redis_exporter (Debian package) ──────────────────
#
# Ubuntu ships `prometheus-redis-exporter` in `universe` (noble and jammy).
# The apt module errors clearly if universe is disabled; fix with
# `add-apt-repository universe`.

- name: Install prometheus-redis-exporter Debian package
  ansible.builtin.apt:
    name: prometheus-redis-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

# redis-server requires auth (08-redis.yml sets requirepass and flushes that
# restart first). The exporter reads REDIS_PASSWORD directly; without it every
# scrape gets NOAUTH and cache.yml's alerts go dark.
- name: Template /etc/default/prometheus-redis-exporter
  ansible.builtin.copy:
    dest: /etc/default/prometheus-redis-exporter
    owner: root
    group: prometheus
    mode: "0640"
    content: |
      # Managed by ansible (archival-node role / 16-prometheus-exporters.yml).
      # Sourced via the Debian-shipped systemd unit's `EnvironmentFile=`.
      REDIS_ADDR=redis://localhost:6379
      REDIS_PASSWORD={{ redis_password }}
      # The Debian unit's ExecStart is `prometheus-redis-exporter $ARGS` —
      # it does not read WEB_LISTEN_ADDRESS, so the listen address must be
      # passed as a CLI flag via ARGS (same pattern as node_exporter and
      # local-prometheus in this role) or it silently falls back to :9121
      # on all interfaces. Listen on loopback only — nftables blocks
      # external 9121 access regardless, but defence-in-depth.
      ARGS="--web.listen-address=127.0.0.1:9121"
  no_log: true
  notify:
    - Restart prometheus-redis-exporter

- name: Enable + start prometheus-redis-exporter
  ansible.builtin.systemd:
    name: prometheus-redis-exporter
    state: started
    enabled: true
    daemon_reload: true

# ── Group B: postgres_exporter (Debian package) ──────────────
#
# The exporter runs as the OS user `prometheus` and connects over the local
# Unix socket via peer auth to a same-named pg_monitor role (no password).
# `user=postgres` can never work: peer auth needs the OS user to match.
# `sslmode=disable` is required for Unix sockets. Env-file edits only apply on
# restart, so the handler below must run or a stale DSN lives on in-process.

# Needs a running Postgres; gated on `run_postgres` like the
# `postgres_exporter` scrape job in main.yml, or non-Postgres hosts fail the
# psql GRANT.
- name: Group B — postgres_exporter (requires Postgres)
  when: run_postgres | bool
  block:
    - name: PG monitoring role for the exporter (peer-auth, pg_monitor)
      become: true
      become_user: postgres
      become_flags: ""
      ansible.builtin.command:
        cmd: psql -d stellarindex -c "DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'prometheus') THEN CREATE ROLE prometheus LOGIN; END IF; END $do$; GRANT pg_monitor TO prometheus;"
      register: pgrole
      changed_when: "'GRANT ROLE' in pgrole.stdout"
      failed_when: pgrole.rc != 0

    - name: Install prometheus-postgres-exporter Debian package
      ansible.builtin.apt:
        name: prometheus-postgres-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600

    # 0640 root:prometheus: DATA_SOURCE_NAME would leak a password if peer auth
    # is ever replaced.
    - name: Template /etc/default/prometheus-postgres-exporter
      ansible.builtin.copy:
        dest: /etc/default/prometheus-postgres-exporter
        owner: root
        group: prometheus
        mode: "0640"
        content: |
          # Managed by ansible (archival-node role / 16-prometheus-exporters.yml).
          # Sourced via the Debian-shipped systemd unit's `EnvironmentFile=`.
          #
          # Peer auth on the local Unix socket as the exporter's own OS
          # user (`prometheus`), matched to a same-named pg_monitor role
          # (created by the role task above); no password anywhere.
          DATA_SOURCE_NAME="user=prometheus host=/var/run/postgresql dbname=stellarindex sslmode=disable"
          # The Debian unit's ExecStart is `prometheus-postgres-exporter $ARGS` —
          # it does not read PG_EXPORTER_WEB_LISTEN_ADDRESS, so the listen
          # address must be passed as a CLI flag via ARGS (same pattern as
          # node_exporter and local-prometheus in this role) or it silently
          # falls back to :9187 on all interfaces. Listen on loopback only —
          # same defence-in-depth as redis_exporter.
          ARGS="--web.listen-address=127.0.0.1:9187"
      notify: Restart prometheus-postgres-exporter

    - name: Enable + start prometheus-postgres-exporter
      ansible.builtin.systemd:
        name: prometheus-postgres-exporter
        state: started
        enabled: true
        daemon_reload: true

# ── Bind post-condition (Groups A + B) ────────────────────────
#
# ARGS reaches the exporter only through the packaged unit's `$ARGS`; if that
# stops holding the exporter silently binds every interface. Ask the kernel
# what is listening, after flushing so the env-file restart has happened.
- name: Apply pending exporter restarts before checking their binds
  ansible.builtin.meta: flush_handlers

- name: Read the exporters' listening sockets
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: [ss, -Hlnt, "sport = :{{ item }}"]
  loop: "{{ [9121] + ([9187] if run_postgres | bool else []) }}"
  register: exporter_listeners
  changed_when: false
  retries: 10
  delay: 2
  until: exporter_listeners.stdout | length > 0

- name: Assert the exporters listen on loopback only
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - item.stdout_lines | reject('search', '[ ]127[.]0[.]0[.]1:' ~ item.item ~ '[ ]') | list | length == 0
    fail_msg: >-
      Exporter on port {{ item.item }} is not bound to 127.0.0.1 only:
      {{ item.stdout_lines }}. Its --web.listen-address in ARGS did not
      take effect.
  loop: "{{ exporter_listeners.results }}"
  loop_control:
    label: "{{ item.item }}"

# ── Group C: pgbackrest_exporter (upstream tarball) ───────────
#
# No Debian package. Operator must set `pgbackrest_exporter_release_sha256` in
# inventory and re-paste it from the upstream releases page whenever
# `pgbackrest_exporter_version` (defaults/main.yml) bumps.
#
# Gated like the `pgbackrest_exporter` scrape job: nothing to export when
# backups are disabled.
- name: Group C — pgbackrest_exporter (requires pgbackrest backups)
  when: pgbackrest_backup_enabled | default(true) | bool
  block:
    - name: assert pgbackrest_exporter_release_sha256 is set
      ansible.builtin.assert:
        that:
          - pgbackrest_exporter_release_sha256 is defined
          - pgbackrest_exporter_release_sha256 | length == 64
        fail_msg: >-
          pgbackrest_exporter_release_sha256 must be set in inventory.
          Pull the matching SHA from the release page:
          https://github.com/woblerr/pgbackrest_exporter/releases/tag/v{{ pgbackrest_exporter_version }}

    - name: Ensure pgbackrest_exporter system user
      ansible.builtin.user:
        name: pgbackrest_exporter
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/pgbackrest_exporter
        create_home: false
        state: present

    - name: Check installed pgbackrest_exporter version
      ansible.builtin.command: /usr/local/bin/pgbackrest_exporter --version
      register: pge_current
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Download pgbackrest_exporter release tarball
      # Skipped when the installed version already matches. URL naming is
      # name-version-os-arch (>=0.23).
      when: pgbackrest_exporter_version not in ((pge_current.stdout | default('')) + (pge_current.stderr | default('')))
      ansible.builtin.get_url:
        url: "https://github.com/woblerr/pgbackrest_exporter/releases/download/v{{ pgbackrest_exporter_version }}/pgbackrest_exporter-{{ pgbackrest_exporter_version }}-linux-x86_64.tar.gz"
        dest: "/tmp/pgbackrest_exporter-{{ pgbackrest_exporter_version }}.tgz"
        checksum: "sha256:{{ pgbackrest_exporter_release_sha256 }}"
        mode: "0644"

    - name: Extract pgbackrest_exporter tarball
      when: pgbackrest_exporter_version not in ((pge_current.stdout | default('')) + (pge_current.stderr | default('')))
      ansible.builtin.unarchive:
        src: "/tmp/pgbackrest_exporter-{{ pgbackrest_exporter_version }}.tgz"
        dest: /tmp/
        remote_src: true

    - name: Install pgbackrest_exporter binary
      when: pgbackrest_exporter_version not in ((pge_current.stdout | default('')) + (pge_current.stderr | default('')))
      ansible.builtin.copy:
        src: "/tmp/pgbackrest_exporter-{{ pgbackrest_exporter_version }}-linux-x86_64/pgbackrest_exporter"
        dest: /usr/local/bin/pgbackrest_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Install pgbackrest_exporter systemd unit
      ansible.builtin.template:
        src: systemd/pgbackrest_exporter.service.j2
        dest: /etc/systemd/system/pgbackrest_exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd
      register: pgbackrest_exporter_unit

    - name: Enable + start pgbackrest_exporter
      ansible.builtin.systemd:
        name: pgbackrest_exporter
        state: started
        enabled: true
        daemon_reload: true
      when:
        # Role-installed unit: CHECK-MODE UNIT GUARD, tasks/main.yml. The apt-packaged
        # exporters above are deliberately unguarded.
        - not (ansible_check_mode and pgbackrest_exporter_unit is changed)

# Converge disabled hosts: an exporter installed before the gate existed
# crash-loops once backups are off. The binary is left in place.
- name: Remove pgbackrest_exporter where backups are disabled
  when: not (pgbackrest_backup_enabled | default(true) | bool)
  block:
    - name: Stop + disable pgbackrest_exporter
      ansible.builtin.systemd:
        name: pgbackrest_exporter.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove pgbackrest_exporter unit file and drop-ins
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/pgbackrest_exporter.service
        - /etc/systemd/system/pgbackrest_exporter.service.d
      notify: Reload systemd

    - name: Clear the failed state left by earlier exporter crashes
      ansible.builtin.command:
        cmd: systemctl reset-failed pgbackrest_exporter.service
      changed_when: false
      failed_when: false

# ── Group D: MinIO Prometheus bearer token ─────────────────────
#
# Procedure: docs/operations/runbooks/infra.md#minio-metrics-403. A
# `prometheus-read` policy scoped to `admin:Prometheus`, plus a service account
# carrying it; the svcacct creation prints the secret key ONCE, which is
# the bearer token. Needs the `local` mc alias (09-minio.yml) and the
# `prometheus` user from Groups A/B.
- name: Group D — MinIO Prometheus bearer token (requires MinIO)
  when: run_minio | bool
  block:
    - name: Render prometheus-read MinIO policy
      # Dir created by 09-minio.yml for the bucket policies.
      ansible.builtin.copy:
        dest: /etc/minio/policies/prometheus-read.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": ["admin:Prometheus"],
                "Resource": ["arn:aws:s3:::*"]
              }
            ]
          }

    - name: Install / update prometheus-read MinIO policy
      ansible.builtin.command:
        argv:
          - /usr/local/bin/mc
          - admin
          - policy
          - create
          - local
          - prometheus-read
          - /etc/minio/policies/prometheus-read.json
      changed_when: false

    - name: Check for an existing Prometheus MinIO bearer token
      ansible.builtin.stat:
        path: /etc/prometheus/minio.token
      register: minio_prom_token_file

    - name: Generate the Prometheus MinIO bearer token
      # Generated ONCE: each svcacct creation mints a new secret, so re-running
      # would invalidate the token and break scraping. Rotation
      # (docs/operations/credential-rotation.md) is manual: remove the file, re-run
      # this tag. stdout carries the secret, so no_log here and on the write below.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/mc
          - admin
          - user
          - svcacct
          - add
          - local
          - "{{ minio_root_user }}"
          # mc reads --policy as a JSON file path, not a name.
          - --policy
          - /etc/minio/policies/prometheus-read.json
          - --name
          - prometheus-metrics-scrape
          - --description
          - "Bearer-token scrape for /minio/v2/metrics/cluster"
          - --json
      register: minio_prom_svcacct
      # A real MinIO mutation, not previewable, so skipped under --check (as in
      # 09-minio.yml). The Write task uses the SAME condition rather than
      # `minio_prom_svcacct is not skipped`: on a fresh host --check always takes the
      # "no file yet" branch and would reference stdout of a task that never ran.
      when:
        - not minio_prom_token_file.stat.exists
        - not ansible_check_mode
      changed_when: true
      no_log: true

    - name: Write the Prometheus MinIO bearer token file
      ansible.builtin.copy:
        dest: /etc/prometheus/minio.token
        owner: prometheus
        group: prometheus
        mode: "0400"
        content: "{{ (minio_prom_svcacct.stdout | from_json).secretKey }}"
      when:
        - not minio_prom_token_file.stat.exists
        - not ansible_check_mode
      no_log: true
      notify: Restart prometheus
