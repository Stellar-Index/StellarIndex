---
# Single-node MinIO so Galexie has an S3-compatible target locally.
# Production HA MinIO (9-node EC) is a later concern.

# Fail fast without a pinned MinIO digest: a root-owned executable must have
# provenance.
#
# MinIO Inc ships no binaries (dl.min.io, Docker Hub, quay.io carry none). The
# only pullable minio + mc pair is the community `chainguard-forks/minio`
# image on cgr.dev; one pinned pull covers both, so there is no `mc_version`.
- name: assert minio_image is digest-pinned
  ansible.builtin.assert:
    that:
      - minio_image is defined
      - "'@sha256:' in minio_image"
      - minio_image.split('@sha256:')[1] | length == 64
    fail_msg: >-
      minio_image must be a digest-pinned reference, e.g.
      "cgr.dev/chainguard/minio:latest@sha256:<64 hex>" — a bare tag is
      mutable and defeats the pin.

- name: assert minio_release_sha256 / mc_release_sha256 are set
  ansible.builtin.assert:
    that:
      - minio_release_sha256 is defined
      - minio_release_sha256 | length == 64
      - mc_release_sha256 is defined
      - mc_release_sha256 | length == 64
    fail_msg: >-
      minio_release_sha256 + mc_release_sha256 must be set in inventory
      — the SHA-256 of the linux-amd64 `minio` and `mc` binaries as they
      exist inside minio_image. Both are architecture-specific (not
      defaulted here, same as before); compute them once with
      `podman create --platform=linux/amd64 <minio_image>`, then
      `podman cp <cid>:/usr/bin/minio ./minio && sha256sum ./minio`
      (same for /usr/bin/mc), then `podman rm <cid>`.

- name: Check installed MinIO server + mc binaries
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ item }}"
    checksum_algorithm: sha256
  register: minio_bin_stat
  loop:
    - minio
    - mc

# An existing host keeps its binary so a pin bump cannot swap the server under
# a live lake; upgrade per run with -e minio_allow_binary_upgrade=true.
- name: Decide whether to install the pinned MinIO binaries
  ansible.builtin.set_fact:
    minio_bin_missing: >-
      {{ not minio_bin_stat.results[0].stat.exists or not minio_bin_stat.results[1].stat.exists }}
    minio_bin_differs: >-
      {{ minio_bin_stat.results[0].stat.checksum | default('') != minio_release_sha256
         or minio_bin_stat.results[1].stat.checksum | default('') != mc_release_sha256 }}

- name: Set minio_bin_install
  ansible.builtin.set_fact:
    minio_bin_install: >-
      {{ minio_bin_missing | bool
         or (minio_bin_differs | bool and minio_allow_binary_upgrade | default(false) | bool) }}

- name: Warn that the installed MinIO binaries differ from the pin and are kept
  ansible.builtin.debug:
    msg: >-
      /usr/local/bin/minio or mc differs from the pinned checksum; keeping the
      installed binaries. Upgrade deliberately with -e minio_allow_binary_upgrade=true.
  when: minio_bin_differs | bool and not minio_bin_install | bool

- name: Install podman (extracts the pinned binaries from minio_image; no daemon, nothing else on the box needs it)
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true
  when: minio_bin_install | bool

- name: Extract minio + mc from the pinned image
  # Runs the image's own `cp` as root against a bind-mounted dir. `--user=0:0` is
  # required: the image's default user is non-root and cannot write /usr/local/bin.
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --platform=linux/amd64
      - --user=0:0
      - --entrypoint=cp
      - -v
      - /usr/local/bin:/out
      - "{{ minio_image }}"
      - /usr/bin/minio
      - /usr/bin/mc
      - /out/
  when: minio_bin_install | bool

- name: Set ownership + mode on the extracted binaries
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - minio
    - mc
  when: minio_bin_install | bool

- name: Verify extracted binaries against the pinned checksums
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ item }}"
    checksum_algorithm: sha256
  register: minio_bin_verify
  loop:
    - minio
    - mc
  when: minio_bin_install | bool

- name: assert extracted binaries match minio_release_sha256 / mc_release_sha256
  ansible.builtin.assert:
    that:
      - minio_bin_verify.results[0].stat.checksum == minio_release_sha256
      - minio_bin_verify.results[1].stat.checksum == mc_release_sha256
    fail_msg: >-
      A binary extracted from minio_image does not match the pinned
      checksum — refusing to keep a root-owned executable without
      verified provenance (same invariant F-1291 established for the
      old get_url path).
  when: minio_bin_install | bool

- name: Template MinIO environment file
  ansible.builtin.template:
    src: minio.env.j2
    dest: /etc/default/minio
    owner: root
    group: minio
    mode: "0640"
  no_log: true  # the rendered file holds MINIO_ROOT_PASSWORD; --diff would print it
  notify: Restart minio

- name: Install MinIO systemd unit
  ansible.builtin.template:
    src: systemd/minio.service.j2
    dest: /etc/systemd/system/minio.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart minio
  register: minio_unit

- name: Enable + start MinIO
  ansible.builtin.systemd:
    name: minio
    state: started
    enabled: true
    daemon_reload: true
  when:
    # Role-installed unit — CHECK-MODE UNIT GUARD, tasks/main.yml.
    - not (ansible_check_mode and minio_unit is changed)

# ──── Bucket creation ─────────────────────────────────────────────
# Buckets for galexie + pgBackRest + ad-hoc backups. `mc` comes from minio_image
# (no stable apt package). `mc alias set` and `mc mb -p` are idempotent.

- name: Wait for MinIO API to be reachable on :9000
  ansible.builtin.uri:
    url: "http://127.0.0.1:9000/minio/health/live"
    status_code: 200
  retries: 15
  delay: 2
  register: minio_live
  until: minio_live.status == 200

- name: Configure mc alias for local MinIO
  # Credentials go in on STDIN, never argv: anything on argv is readable by every
  # local uid via /proc/<pid>/cmdline, ps and auditd. MC_HOST_<alias> is transient,
  # but the root-run galexie-archive-*.sh scripts rely on the PERSISTED `local`
  # alias. no_log keeps Ansible from echoing stdin/vars on failure.
  # Guarded by scripts/ci/lint-ansible-tasks.sh (secret-on-argv).
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - alias
      - set
      - local
      - "http://127.0.0.1:9000"
    stdin: "{{ minio_root_user }}\n{{ minio_root_password }}"
  changed_when: false
  no_log: true

- name: Ensure required MinIO buckets exist
  ansible.builtin.command: "/usr/local/bin/mc mb --ignore-existing local/{{ item }}"
  loop: "{{ minio_buckets }}"
  register: mc_mb
  changed_when: "'Bucket created successfully' in mc_mb.stdout"

# ──── Least-privilege user for galexie ────────────────────────────
# galexie gets a bucket-restricted user (galexie-live write only), not root creds.

# `copy` does not create parents; the policy JSONs below land in this dir.
- name: Ensure MinIO policies directory exists
  ansible.builtin.file:
    path: /etc/minio/policies
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render galexie-writer MinIO policy
  ansible.builtin.copy:
    dest: /etc/minio/policies/galexie-writer.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:PutObject",
              "s3:GetObject",
              "s3:ListBucket",
              "s3:GetBucketLocation",
              "s3:ListBucketMultipartUploads",
              "s3:ListMultipartUploadParts",
              "s3:AbortMultipartUpload"
            ],
            "Resource": [
              "arn:aws:s3:::{{ galexie_s3_bucket }}",
              "arn:aws:s3:::{{ galexie_s3_bucket }}/*"
            ]
          }
        ]
      }
  register: galexie_policy_file

- name: Ensure /etc/minio/policies directory exists
  ansible.builtin.file:
    path: /etc/minio/policies
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install / update galexie-writer MinIO policy
  # `mc admin policy create` is idempotent; changed JSON updates the policy.
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - create
      - local
      - galexie-writer
      - /etc/minio/policies/galexie-writer.json
  changed_when: false

- name: Create galexie-writer MinIO user (vault-supplied creds)
  # `mc admin user add` updates the secret if the user exists.
  # SECRETKEY omitted from argv on purpose: `mc admin user add` reads it from
  # stdin, keeping it out of /proc/<pid>/cmdline (secret-on-argv,
  # scripts/ci/lint-ansible-tasks.sh).
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - user
      - add
      - local
      - "{{ galexie_s3_access_key }}"
    stdin: "{{ galexie_s3_secret_key }}"
  changed_when: false
  no_log: true

- name: Attach galexie-writer policy to galexie-writer user
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - attach
      - local
      - galexie-writer
      - --user
      - "{{ galexie_s3_access_key }}"
  changed_when: false
  failed_when: false   # mc returns non-zero if policy already attached

# ──── galexie-archive-writer (write on galexie-archive only) ───────
# `/etc/default/galexie-backfill` (07-galexie.yml) exports this identity's keys
# from vault. Codifying it makes `mc admin user add` re-sync the secret on every
# apply (a hand-made identity drifts to SignatureDoesNotMatch unnoticed, since
# the hourly galexie-archive-fill job writes as MinIO root via `local`), and
# gives rehydrate/backfill a non-root identity. See docs/operations/
# credential-rotation.md.
#
# Deliberately WRITE, not write+delete: delete paths on this bucket
# (trim-galexie-archive, the fill script's empty-partition sweep) are separately
# gated and must not inherit authority from the identity that fills the archive.

- name: Render galexie-archive-writer MinIO policy
  ansible.builtin.copy:
    dest: /etc/minio/policies/galexie-archive-writer.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:PutObject",
              "s3:GetObject",
              "s3:ListBucket",
              "s3:GetBucketLocation",
              "s3:ListBucketMultipartUploads",
              "s3:ListMultipartUploadParts",
              "s3:AbortMultipartUpload"
            ],
            "Resource": [
              "arn:aws:s3:::galexie-archive",
              "arn:aws:s3:::galexie-archive/*"
            ]
          }
        ]
      }

- name: Install / update galexie-archive-writer MinIO policy
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - create
      - local
      - galexie-archive-writer
      - /etc/minio/policies/galexie-archive-writer.json
  changed_when: false

- name: Create galexie-archive-writer MinIO user (vault-supplied creds)
  # `mc admin user add` updates the secret if the user exists.
  # SECRETKEY omitted from argv on purpose: `mc admin user add` reads it from
  # stdin, keeping it out of /proc/<pid>/cmdline (secret-on-argv,
  # scripts/ci/lint-ansible-tasks.sh).
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - user
      - add
      - local
      - "{{ galexie_archive_s3_access_key }}"
    stdin: "{{ galexie_archive_s3_secret_key }}"
  changed_when: false
  no_log: true

- name: Attach galexie-archive-writer policy to galexie-archive-writer user
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - attach
      - local
      - galexie-archive-writer
      - --user
      - "{{ galexie_archive_s3_access_key }}"
  changed_when: false
  failed_when: false   # mc returns non-zero if policy already attached

- name: Configure archivewriter mc alias (galexie-archive-fill's identity)
  # Persisted for root because galexie-archive-fill.sh mirrors through it;
  # credentials on stdin, as for the `local` alias above.
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - alias
      - set
      - archivewriter
      - "http://127.0.0.1:9000"
    stdin: "{{ galexie_archive_s3_access_key }}\n{{ galexie_archive_s3_secret_key }}"
  changed_when: false
  no_log: true

# ──── stellarindex-reader (read-only on both buckets) ──────────────
# Used by stellarindex-ops verify-archive, and by the indexer + api later. Scoped
# to BOTH buckets because the indexer stitches across them at the seam. Not a writer.

- name: Render stellarindex-reader MinIO policy
  ansible.builtin.copy:
    dest: /etc/minio/policies/stellarindex-reader.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:GetObject",
              "s3:ListBucket",
              "s3:GetBucketLocation",
              "s3:ListBucketMultipartUploads",
              "s3:ListMultipartUploadParts"
            ],
            "Resource": [
              "arn:aws:s3:::galexie-live",
              "arn:aws:s3:::galexie-live/*",
              "arn:aws:s3:::galexie-archive",
              "arn:aws:s3:::galexie-archive/*"
            ]
          }
        ]
