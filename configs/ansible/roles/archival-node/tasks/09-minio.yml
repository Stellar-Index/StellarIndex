      - /etc/minio/policies/stellarindex-archive-trimmer.json
  changed_when: false

- name: Create stellarindex-archive-trimmer MinIO user (vault-supplied creds)
  # SECRETKEY omitted from argv on purpose: `mc admin user add` reads it from
  # stdin, keeping it out of /proc/<pid>/cmdline (secret-on-argv,
