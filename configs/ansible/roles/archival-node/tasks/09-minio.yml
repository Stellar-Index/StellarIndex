- name: Template /etc/default/stellarindex-ops (env vars for stellarindex-ops batch jobs)
  # Sourced by interactive `stellarindex-ops`, run-heavy-job.sh (which imports the
  # CH ops-batch pair into every wrapped job, 14-stellarindex-services.yml) and the
  # ops timer units (verify-archive-tier-*, ch-schema-*, restore-drill). NOT by the
  # indexer/aggregator/api units, which source /etc/default/stellarindex: this
  # file carries the low-priority ClickHouse identity, which would demote them.
  #
  # The AWS SDK reads AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY; the
  # STELLARINDEX_S3_* duplicates feed config-load.go's ApplyEnvOverrides.
  # STELLARINDEX_POSTGRES_DSN keeps /etc/stellarindex.toml password-free.
  #
  # Mode 0640 root:stellarindex: the service user needs group read. 09-minio runs
  # after 04-users, so the group exists.
  ansible.builtin.copy:
    dest: /etc/default/stellarindex-ops
    owner: root
    group: stellarindex
    mode: "0640"
    content: |
      # Rendered by Ansible. Do not edit by hand — regenerate via
      # `ansible-playbook ... --tags minio`.
      #
      # Source manually for interactive use:
      #   set -a; source /etc/default/stellarindex-ops; set +a
      #   stellarindex-ops verify-archive -config /etc/stellarindex.toml ...
      AWS_ACCESS_KEY_ID={{ stellarindex_reader_access_key }}
      AWS_SECRET_ACCESS_KEY={{ stellarindex_reader_secret_key }}
      # Endpoint + region MUST accompany the keys — without them the
      # SDK signs for AWS proper and MinIO rejects with
      # SignatureDoesNotMatch.
      AWS_ENDPOINT_URL={{ galexie_s3_endpoint }}
      AWS_REGION={{ region_id }}
      STELLARINDEX_S3_ACCESS_KEY={{ stellarindex_reader_access_key }}
      STELLARINDEX_S3_SECRET_KEY={{ stellarindex_reader_secret_key }}
      STELLARINDEX_POSTGRES_DSN={{ postgres_dsn_stellarindex }}
      # Vendor keys for interactive stellarindex-ops runs (divergence
      # spot-checks, fixture capture) — same values the indexer env
      # carries.
      COINGECKO_DEMO_API_KEY={{ vault_coingecko_demo_api_key | default('') }}
      COINGECKO_API_KEY={{ vault_coingecko_api_key | default('') }}
      MASSIVE_API_KEY={{ vault_massive_api_key | default('') }}
      # ClickHouse ops-batch identity: a heavy job running as CH `default`
      # starves the aggregator's supply refresher.
      # internal/storage/clickhouse/ops_auth.go reads this
      # pair so every stellarindex-ops CH connection — interactive,
      # run-heavy-job.sh, the *-tier-*/ch-schema-* timers, scripts/ops
      # wrappers — runs under the low-priority ops_batch profile
      # (20-clickhouse-serving-profile.yml). Emitted only when the CH
      # side is enabled AND the vault password exists, so a partial
      # apply cannot hand jobs a credential CH does not know; absent
      # = CH default user. NEVER copy these
      # into /etc/default/stellarindex — the services would demote
      # themselves to lowest priority.
      {% if clickhouse_ops_batch_profile_enabled | bool and (clickhouse_ops_batch_password | default('')) | length > 0 %}
      STELLARINDEX_CLICKHOUSE_OPS_USER={{ clickhouse_ops_batch_user }}
      STELLARINDEX_CLICKHOUSE_OPS_PASSWORD={{ clickhouse_ops_batch_password }}
      {% endif %}
      # Live-era floor for ch-live-catchup.sh — the lake's only
      # self-healer. One past the ceiling of the certified
      # bulk backfill: below it ch-backfill already wrote a contiguous
      # range, at or above it a dual-sink hole can form. It is a
      # per-HOST fact (each network has its own backfill ceiling), so
      # the role deliberately carries NO default: 08-clickhouse.yml copies
      # the script verbatim to every provisioned host, and a hardcoded
      # mainnet ceiling would be, on another network, a floor above its
      # own tip — a healer that silently scans an empty range. Unset here
      # ⇒ absent from the file ⇒ the script exits 1 naming this variable,
      # which surfaces as stellarindex_systemd_unit_failed rather than as
      # a lake that quietly stops healing. Same "every inventory states its
      # own answer" shape as allowed_ssh_cidrs.
      {% if stellarindex_ch_live_era_from is defined %}
      LIVE_ERA_FROM={{ stellarindex_ch_live_era_from }}
      {% endif %}
  no_log: true
