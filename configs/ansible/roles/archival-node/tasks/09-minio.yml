# ──── stellarindex-archive-trimmer (list+delete, galexie-archive only) ──
# Trim needs delete authority, but not from stellarindex-reader (read-only) nor
# from root or galexie-archive-writer: the fill/write identity must not also
# authorize the destructive trim path (see its policy comment above). This
# identity can list the bucket and delete from it, nothing else.
- name: Render stellarindex-archive-trimmer MinIO policy
  ansible.builtin.copy:
    dest: /etc/minio/policies/stellarindex-archive-trimmer.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:ListBucket",
              "s3:GetBucketLocation",
              "s3:DeleteObject"
            ],
            "Resource": [
              "arn:aws:s3:::galexie-archive",
              "arn:aws:s3:::galexie-archive/*"
            ]
          }
        ]
      }

- name: Install / update stellarindex-archive-trimmer MinIO policy
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
