---
# Single-node MinIO so Galexie has an S3-compatible target locally.
# Production HA MinIO (9-node EC) is a later concern — tracked against
# the HA plan. See TODO(#0).

# F-1291 (codex audit-2026-05-13): fail fast if the operator
# hasn't supplied the MinIO release SHA256. Pre-fix the get_url
# had no `checksum:` — root-owned executable installed without
# provenance. Same fail-fast pattern as F-1280/F-1285.
#
# INV-0706 (2026-09-28): dl.min.io 410s on every binary path now,
# Docker Hub denies `minio/minio` and `minio/mc` outright, and
# quay.io/minio no longer resolves — MinIO Inc went source-only
# distribution on 2025-10-15 (its own GitHub releases ship no binary
# assets) and closed free-tier registry pulls. The one channel still
# serving a pullable, anonymously-accessible minio + mc pair is the
# community `chainguard-forks/minio` build published to cgr.dev — both
# binaries live in the same image, so one pinned pull now replaces both
# prior HTTPS downloads. There is no separate `mc` release to pin
# anymore, so `mc_version` is gone.
- name: assert minio_image is digest-pinned
  ansible.builtin.assert:
    that:
      - minio_image is defined
      - "'@sha256:' in minio_image"
      - minio_image.split('@sha256:')[1] | length == 64
    fail_msg: >-
      minio_image must be a digest-pinned reference, e.g.
      "cgr.dev/chainguard/minio:latest@sha256:<64 hex>" — a bare tag is
      mutable and defeats the pin.

- name: assert minio_release_sha256 / mc_release_sha256 are set
  ansible.builtin.assert:
    that:
      - minio_release_sha256 is defined
      - minio_release_sha256 | length == 64
      - mc_release_sha256 is defined
      - mc_release_sha256 | length == 64
    fail_msg: >-
      minio_release_sha256 + mc_release_sha256 must be set in inventory
      — the SHA-256 of the linux-amd64 `minio` and `mc` binaries as they
      exist inside minio_image. Both are architecture-specific (not
      defaulted here, same as before); compute them once with
      `podman create --platform=linux/amd64 <minio_image>`, then
      `podman cp <cid>:/usr/bin/minio ./minio && sha256sum ./minio`
      (same for /usr/bin/mc), then `podman rm <cid>`.

- name: Check installed MinIO server + mc binaries
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ item }}"
    checksum_algorithm: sha256
  register: minio_bin_stat
  loop:
    - minio
    - mc

# An existing host keeps the binary it runs: a pin bump must not silently
# swap the server under a live lake on the next apply. Replacing one is a
# planned upgrade, opted into per run with -e minio_allow_binary_upgrade=true.
- name: Decide whether to install the pinned MinIO binaries
  ansible.builtin.set_fact:
    minio_bin_missing: >-
      {{ not minio_bin_stat.results[0].stat.exists or not minio_bin_stat.results[1].stat.exists }}
    minio_bin_differs: >-
      {{ minio_bin_stat.results[0].stat.checksum | default('') != minio_release_sha256
         or minio_bin_stat.results[1].stat.checksum | default('') != mc_release_sha256 }}

- name: Set minio_bin_install
  ansible.builtin.set_fact:
    minio_bin_install: >-
      {{ minio_bin_missing | bool
         or (minio_bin_differs | bool and minio_allow_binary_upgrade | default(false) | bool) }}

- name: Warn that the installed MinIO binaries differ from the pin and are kept
  ansible.builtin.debug:
    msg: >-
      /usr/local/bin/minio or mc differs from the pinned checksum; keeping the
      installed binaries. Upgrade deliberately with -e minio_allow_binary_upgrade=true.
  when: minio_bin_differs | bool and not minio_bin_install | bool

- name: Install podman (extracts the pinned binaries from minio_image; no daemon, nothing else on the box needs it)
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true
  when: minio_bin_install | bool

- name: Extract minio + mc from the pinned image
  # Runs the image's own `cp` as root against a bind-mounted host dir —
  # avoids `podman create`/`cp`/`rm` bookkeeping for a one-shot copy.
  # The image's default user is a non-root UID (chainguard convention);
  # `--user=0:0` is required to write into /usr/local/bin.
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --platform=linux/amd64
      - --user=0:0
      - --entrypoint=cp
      - -v
      - /usr/local/bin:/out
      - "{{ minio_image }}"
      - /usr/bin/minio
      - /usr/bin/mc
      - /out/
  when: minio_bin_install | bool

- name: Set ownership + mode on the extracted binaries
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - minio
    - mc
  when: minio_bin_install | bool

- name: Verify extracted binaries against the pinned checksums
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ item }}"
    checksum_algorithm: sha256
  register: minio_bin_verify
  loop:
    - minio
    - mc
  when: minio_bin_install | bool

- name: assert extracted binaries match minio_release_sha256 / mc_release_sha256
  ansible.builtin.assert:
    that:
      - minio_bin_verify.results[0].stat.checksum == minio_release_sha256
      - minio_bin_verify.results[1].stat.checksum == mc_release_sha256
    fail_msg: >-
      A binary extracted from minio_image does not match the pinned
      checksum — refusing to keep a root-owned executable without
      verified provenance (same invariant F-1291 established for the
      old get_url path).
  when: minio_bin_install | bool

- name: Template MinIO environment file
  ansible.builtin.template:
    src: minio.env.j2
    dest: /etc/default/minio
    owner: root
    group: minio
    mode: "0640"
  no_log: true  # the rendered file holds MINIO_ROOT_PASSWORD; --diff would print it
  notify: Restart minio

- name: Install MinIO systemd unit
  ansible.builtin.template:
    src: systemd/minio.service.j2
    dest: /etc/systemd/system/minio.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart minio
  register: minio_unit

- name: Enable + start MinIO
  ansible.builtin.systemd:
    name: minio
    state: started
    enabled: true
    daemon_reload: true
  when:
    # Role-installed unit — CHECK-MODE UNIT GUARD, tasks/main.yml.
    - not (ansible_check_mode and minio_unit is changed)

# ──── Bucket creation ─────────────────────────────────────────────
# Bootstrap the buckets galexie + pgBackRest + ad-hoc backups need.
# `mc` is MinIO's CLI, extracted from minio_image above alongside the
# server binary (not the apt package — there isn't one in stable at
# time of writing). Both `mc alias set` and `mc mb -p` are idempotent
# so this re-runs safely.

- name: Wait for MinIO API to be reachable on :9000
  ansible.builtin.uri:
    url: "http://127.0.0.1:9000/minio/health/live"
    status_code: 200
  retries: 15
  delay: 2
  register: minio_live
  until: minio_live.status == 200

- name: Configure mc alias for local MinIO
  # The credentials go in on STDIN, never on argv: with ACCESSKEY/SECRETKEY
  # omitted, `mc alias set` reads them from stdin (one per line; it only
  # prints the "Enter … Key:" prompts on a tty). Anything on argv is
  # readable by every local uid in /proc/<pid>/cmdline (+ ps, + auditd
  # execve records) for the life of the call — the comment here used to
  # claim env-based auth while the task passed the root password on argv
  # (2026-08-28 audit). MC_HOST_<alias> env would also avoid argv but is
  # transient; the root-run ops scripts (galexie-archive-*.sh) rely on the
  # PERSISTED `local` alias, so stdin it is. no_log prevents Ansible from echoing the stdin/vars on failure.
  # Guarded by scripts/ci/lint-ansible-tasks.sh (secret-on-argv).
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - alias
      - set
      - local
      - "http://127.0.0.1:9000"
    stdin: "{{ minio_root_user }}\n{{ minio_root_password }}"
  changed_when: false
  no_log: true

- name: Ensure required MinIO buckets exist
  ansible.builtin.command: "/usr/local/bin/mc mb --ignore-existing local/{{ item }}"
  loop: "{{ minio_buckets }}"
  register: mc_mb
  changed_when: "'Bucket created successfully' in mc_mb.stdout"

# ──── Least-privilege user for galexie ────────────────────────────
# galexie had been using MinIO root creds. Task #156 scoped it to
# its own user with a bucket-restricted policy — can write to
# galexie-live only, not backups or galexie-archive.

# The policy JSONs below are copied into this dir; `copy` doesn't create
# parents, so a fresh build (dir absent) failed here. r1 already had it.
- name: Ensure MinIO policies directory exists
  ansible.builtin.file:
    path: /etc/minio/policies
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render galexie-writer MinIO policy
  ansible.builtin.copy:
    dest: /etc/minio/policies/galexie-writer.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:PutObject",
              "s3:GetObject",
              "s3:ListBucket",
              "s3:GetBucketLocation",
              "s3:ListBucketMultipartUploads",
              "s3:ListMultipartUploadParts",
              "s3:AbortMultipartUpload"
            ],
            "Resource": [
              "arn:aws:s3:::{{ galexie_s3_bucket }}",
              "arn:aws:s3:::{{ galexie_s3_bucket }}/*"
            ]
          }
        ]
      }
  register: galexie_policy_file

- name: Ensure /etc/minio/policies directory exists
  ansible.builtin.file:
    path: /etc/minio/policies
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install / update galexie-writer MinIO policy
  # `mc admin policy create` is idempotent when the policy exists —
  # pass the same JSON and it's a no-op. If JSON changed it updates.
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - create
      - local
      - galexie-writer
      - /etc/minio/policies/galexie-writer.json
  changed_when: false

- name: Create galexie-writer MinIO user (vault-supplied creds)
  # `mc admin user add` updates the secret if the user already exists.
  # SECRETKEY omitted from argv on purpose: `mc admin user add ALIAS
  # ACCESSKEY` reads the secret from stdin, so it never appears in
  # /proc/<pid>/cmdline (secret-on-argv, scripts/ci/lint-ansible-tasks.sh).
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - user
      - add
      - local
      - "{{ galexie_s3_access_key }}"
    stdin: "{{ galexie_s3_secret_key }}"
  changed_when: false
  no_log: true

- name: Attach galexie-writer policy to galexie-writer user
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - attach
      - local
      - galexie-writer
      - --user
      - "{{ galexie_s3_access_key }}"
  changed_when: false
  failed_when: false   # mc returns non-zero if policy already attached

# ──── galexie-archive-writer (write on galexie-archive only) ───────
# NOT ansible-managed until 2026-07-25, which is why it broke silently.
# `/etc/default/galexie-backfill` (07-galexie.yml) has always exported
# this identity's key pair from vault, and docs/operations/
# credential-rotation.md has always listed it — but nothing ever created
# the MinIO user, rendered a policy, or attached one. The identity was
# hand-made once and then drifted: as of 2026-07-25 the `archivewriter`
# mc alias fails `SignatureDoesNotMatch` on every call, i.e. the live
# secret no longer matches the vaulted one. Nothing noticed because the
# hourly galexie-archive-fill job writes as the `local` alias — MinIO
# ROOT — so the archive's only working write path is a full-admin
# credential (see the credential-hygiene section of
# docs/operations/credential-rotation.md).
#
# Codifying it here does three things at once: `mc admin user add`
# re-syncs the secret from vault on every apply (the drift can't
# persist), the identity gains a bucket-scoped policy instead of none,
# and the rehydrate/backfill procedures get an identity to use that
# isn't root.
#
# Deliberately WRITE, not write+delete: the delete paths on this bucket
# (trim-galexie-archive, the fill script's empty-partition sweep) are
# separately gated destructive operations and must not inherit their
# authority from the identity that merely fills the archive.

- name: Render galexie-archive-writer MinIO policy
  ansible.builtin.copy:
    dest: /etc/minio/policies/galexie-archive-writer.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:PutObject",
              "s3:GetObject",
              "s3:ListBucket",
              "s3:GetBucketLocation",
              "s3:ListBucketMultipartUploads",
              "s3:ListMultipartUploadParts",
              "s3:AbortMultipartUpload"
            ],
            "Resource": [
              "arn:aws:s3:::galexie-archive",
              "arn:aws:s3:::galexie-archive/*"
            ]
          }
        ]
      }

- name: Install / update galexie-archive-writer MinIO policy
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - create
      - local
      - galexie-archive-writer
      - /etc/minio/policies/galexie-archive-writer.json
  changed_when: false

- name: Create galexie-archive-writer MinIO user (vault-supplied creds)
  # `mc admin user add` updates the secret if the user already exists —
  # which is exactly what repairs the drifted `archivewriter` alias.
  # SECRETKEY omitted from argv on purpose: `mc admin user add ALIAS
  # ACCESSKEY` reads the secret from stdin, so it never appears in
  # /proc/<pid>/cmdline (secret-on-argv, scripts/ci/lint-ansible-tasks.sh).
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - user
      - add
      - local
      - "{{ galexie_archive_s3_access_key }}"
    stdin: "{{ galexie_archive_s3_secret_key }}"
  changed_when: false
  no_log: true

- name: Attach galexie-archive-writer policy to galexie-archive-writer user
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - attach
      - local
      - galexie-archive-writer
      - --user
      - "{{ galexie_archive_s3_access_key }}"
  changed_when: false
  failed_when: false   # mc returns non-zero if policy already attached

- name: Configure archivewriter mc alias (galexie-archive-fill's identity)
  # Persisted for root because galexie-archive-fill.sh mirrors through it;
  # credentials on stdin, as for the `local` alias above.
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - alias
      - set
      - archivewriter
      - "http://127.0.0.1:9000"
    stdin: "{{ galexie_archive_s3_access_key }}\n{{ galexie_archive_s3_secret_key }}"
  changed_when: false
  no_log: true

# ──── stellarindex-reader (read-only on both buckets) ──────────────
# Used by stellarindex-ops verify-archive today, and by the indexer +
# api once they have systemd units. Scoped to BOTH galexie-live and
# galexie-archive because the indexer stitches across them at the
# seam. NOT a writer — galexie-writer / galexie-archive-writer cover
# the write paths separately.

- name: Render stellarindex-reader MinIO policy
  ansible.builtin.copy:
    dest: /etc/minio/policies/stellarindex-reader.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:GetObject",
              "s3:ListBucket",
              "s3:GetBucketLocation",
              "s3:ListBucketMultipartUploads",
              "s3:ListMultipartUploadParts"
            ],
            "Resource": [
              "arn:aws:s3:::galexie-live",
              "arn:aws:s3:::galexie-live/*",
              "arn:aws:s3:::galexie-archive",
              "arn:aws:s3:::galexie-archive/*"
            ]
          }
        ]
      }

- name: Install / update stellarindex-reader MinIO policy
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - create
      - local
      - stellarindex-reader
      - /etc/minio/policies/stellarindex-reader.json
  changed_when: false

- name: Create stellarindex-reader MinIO user (vault-supplied creds)
  # SECRETKEY omitted from argv on purpose: `mc admin user add ALIAS
  # ACCESSKEY` reads the secret from stdin, so it never appears in
  # /proc/<pid>/cmdline (secret-on-argv, scripts/ci/lint-ansible-tasks.sh).
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - user
      - add
      - local
      - "{{ stellarindex_reader_access_key }}"
    stdin: "{{ stellarindex_reader_secret_key }}"
  changed_when: false
  no_log: true

- name: Attach stellarindex-reader policy to stellarindex-reader user
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - attach
      - local
      - stellarindex-reader
      - --user
      - "{{ stellarindex_reader_access_key }}"
  changed_when: false
  failed_when: false   # mc returns non-zero if policy already attached

# ──── stellarindex-archive-trimmer (list+delete, galexie-archive only) ──
# CA2-A37-harden-6: galexie-archive-trim.service's only prior credential
# source was stellarindex-reader (read-only — every DeleteObject came
# back AccessDenied, so a run "deleted 0/N" every time). Root and
# galexie-archive-writer both have delete authority on this bucket but
# are deliberately not used here either: galexie-archive-writer's policy
# comment above documents the invariant that the fill/write identity
# must not also authorize the destructive trim path, and running trim as
# root would reintroduce the same "delete path = full admin" problem the
# galexie-archive-writer codification fixed for writes. This identity is
# scoped to exactly what trim needs: list the bucket and delete from it,
# nothing else.
- name: Render stellarindex-archive-trimmer MinIO policy
  ansible.builtin.copy:
    dest: /etc/minio/policies/stellarindex-archive-trimmer.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:ListBucket",
              "s3:GetBucketLocation",
              "s3:DeleteObject"
            ],
            "Resource": [
              "arn:aws:s3:::galexie-archive",
              "arn:aws:s3:::galexie-archive/*"
            ]
          }
        ]
      }

- name: Install / update stellarindex-archive-trimmer MinIO policy
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - create
      - local
      - stellarindex-archive-trimmer
      - /etc/minio/policies/stellarindex-archive-trimmer.json
  changed_when: false

- name: Create stellarindex-archive-trimmer MinIO user (vault-supplied creds)
  # SECRETKEY omitted from argv on purpose: `mc admin user add ALIAS
  # ACCESSKEY` reads the secret from stdin, so it never appears in
  # /proc/<pid>/cmdline (secret-on-argv, scripts/ci/lint-ansible-tasks.sh).
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - user
      - add
      - local
      - "{{ stellarindex_archive_trimmer_access_key }}"
    stdin: "{{ stellarindex_archive_trimmer_secret_key }}"
  changed_when: false
  no_log: true

- name: Attach stellarindex-archive-trimmer policy to stellarindex-archive-trimmer user
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mc
      - admin
      - policy
      - attach
      - local
      - stellarindex-archive-trimmer
      - --user
      - "{{ stellarindex_archive_trimmer_access_key }}"
  changed_when: false
  failed_when: false   # mc returns non-zero if policy already attached

- name: Template /etc/default/stellarindex-ops (env vars for stellarindex-ops batch jobs)
  # Sourced by interactive `stellarindex-ops` invocations, by
  # run-heavy-job.sh (which imports the CH ops-batch pair below into
  # every wrapped job, 14-stellarindex-services.yml) and by the ops
  # timer units (verify-archive-tier-*, ch-schema-*, restore-drill).
  # NOT by the stellarindex-{indexer,aggregator,api} service units —
  # those source /etc/default/stellarindex (14-stellarindex-services.yml
  # templates) and must keep doing so: this file carries the
  # low-priority ClickHouse identity, which would demote them.
  #
  # The AWS SDK that powers the datastore reader (verify-archive +
  # indexer ledgerstream) reads creds from AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY. The STELLARINDEX_S3_* duplicates are for
  # config-load.go's ApplyEnvOverrides path. STELLARINDEX_POSTGRES_DSN
  # carries the application-db password so the file-on-disk
  # /etc/stellarindex.toml stays password-free.
  #
  # Mode 0640 root:stellarindex (CS-118/CS-121 pattern) — the
  # stellarindex service user (04-users.yml, CS-119) needs group read
  # for the units + interactive `stellarindex-ops` runs that source
  # this file after de-privileging. Note: 09-minio runs after
  # 04-users, so the group exists by the time this templates.
  ansible.builtin.copy:
    dest: /etc/default/stellarindex-ops
    owner: root
    group: stellarindex
    mode: "0640"
    content: |
      # Rendered by Ansible. Do not edit by hand — regenerate via
      # `ansible-playbook ... --tags minio`.
      #
      # Source manually for interactive use:
      #   set -a; source /etc/default/stellarindex-ops; set +a
      #   stellarindex-ops verify-archive -config /etc/stellarindex.toml ...
      AWS_ACCESS_KEY_ID={{ stellarindex_reader_access_key }}
      AWS_SECRET_ACCESS_KEY={{ stellarindex_reader_secret_key }}
      # Endpoint + region MUST accompany the keys — without them the
      # SDK signs for AWS proper and MinIO rejects with
      # SignatureDoesNotMatch (feedback_minio_cred_drift; found live
      # 2026-07-03 drift audit — a render dropped them).
      AWS_ENDPOINT_URL={{ galexie_s3_endpoint }}
      AWS_REGION={{ region_id }}
      STELLARINDEX_S3_ACCESS_KEY={{ stellarindex_reader_access_key }}
      STELLARINDEX_S3_SECRET_KEY={{ stellarindex_reader_secret_key }}
      STELLARINDEX_POSTGRES_DSN={{ postgres_dsn_stellarindex }}
      # Vendor keys for interactive stellarindex-ops runs (divergence
      # spot-checks, fixture capture) — same values the indexer env
      # carries; codified 2026-07-03.
      CHAINLINK_RPC_URL={{ vault_chainlink_rpc_url | default('') }}
      COINGECKO_DEMO_API_KEY={{ vault_coingecko_demo_api_key | default('') }}
      COINGECKO_API_KEY={{ vault_coingecko_api_key | default('') }}
      MASSIVE_API_KEY={{ vault_massive_api_key | default('') }}
      # ClickHouse ops-batch identity (2026-08-28 r1: a ch-rebuild
      # running as CH `default` starved the aggregator's supply
      # refresher). internal/storage/clickhouse/ops_auth.go reads this
      # pair so every stellarindex-ops CH connection — interactive,
      # run-heavy-job.sh, the *-tier-*/ch-schema-* timers, scripts/ops
      # wrappers — runs under the low-priority ops_batch profile
      # (20-clickhouse-serving-profile.yml). Emitted only when the CH
      # side is enabled AND the vault password exists, so a partial
      # apply cannot hand jobs a credential CH does not know; absent
      # = CH default user, the pre-fix behaviour. NEVER copy these
      # into /etc/default/stellarindex — the services would demote
      # themselves to lowest priority.
      {% if clickhouse_ops_batch_profile_enabled | bool and (clickhouse_ops_batch_password | default('')) | length > 0 %}
      STELLARINDEX_CLICKHOUSE_OPS_USER={{ clickhouse_ops_batch_user }}
      STELLARINDEX_CLICKHOUSE_OPS_PASSWORD={{ clickhouse_ops_batch_password }}
      {% endif %}
      # Live-era floor for ch-live-catchup.sh — the lake's only
      # self-healer (#371 F10). One past the ceiling of the certified
      # bulk backfill: below it ch-backfill already wrote a contiguous
      # range, at or above it a dual-sink hole can form. It is a
      # per-HOST fact (each network has its own backfill ceiling), so
      # the role deliberately carries NO default: the script used to
      # hardcode r1's mainnet ceiling and 08-clickhouse.yml copies that
      # script verbatim to every provisioned host, which on another
      # network is a floor above its own tip — a healer that silently
      # scans an empty range. Unset here ⇒ absent from the file ⇒ the
      # script exits 1 naming this variable, which surfaces as
      # stellarindex_systemd_unit_failed rather than as a lake that
      # quietly stops healing. Same "every inventory states its own
      # answer" shape as allowed_ssh_cidrs.
      {% if stellarindex_ch_live_era_from is defined %}
      LIVE_ERA_FROM={{ stellarindex_ch_live_era_from }}
      {% endif %}
  no_log: true
