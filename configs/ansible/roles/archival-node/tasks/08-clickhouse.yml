---
# ClickHouse, the certified lake (ADR-0034), codified so a fresh host
# (r2/r3/test net) gets it reproducibly. Imported behind run_clickhouse
# (DEFAULT FALSE in main.yml) so r1's hand-tended ClickHouse is NEVER touched;
# test nets / fresh regions set it true. Native port is clickhouse_tcp_port
# (default 9300; 9000 is MinIO's). Schema application is a SEPARATE opt-in
# (clickhouse_apply_schema, default false) so a re-run never re-executes DDL
# against a live lake.

- name: Install the ClickHouse repo signing key
  # Shipped as a role file: the online key URL 404s and the keyserver fetch is
  # flaky; this is r1's proven key.
  ansible.builtin.copy:
    src: clickhouse-keyring.gpg
    dest: /usr/share/keyrings/clickhouse-keyring.gpg
    mode: "0644"

- name: Add ClickHouse apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg arch=amd64] https://packages.clickhouse.com/deb stable main"
    state: present
    filename: clickhouse

- name: Preseed ClickHouse default-user password (empty — non-interactive install)
  # debconf-set-selections (base `debconf` package) rather than the debconf
  # module, which needs debconf-utils, absent on a fresh host.
  ansible.builtin.shell: echo 'clickhouse-server clickhouse-server/default-password password' | debconf-set-selections
  changed_when: false

- name: Install ClickHouse server + client
  ansible.builtin.apt:
    name:
      - clickhouse-server
      - clickhouse-common-static
      - clickhouse-client
    state: present
    update_cache: true

- name: Configure ClickHouse native port + loopback listen
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/si-override.xml
    mode: "0644"
    content: |
      <clickhouse>
          <tcp_port>{{ clickhouse_tcp_port | default(9300) }}</tcp_port>
          <listen_host>127.0.0.1</listen_host>
      </clickhouse>
  notify: Restart clickhouse-server

- name: Ensure ClickHouse client config.d dir exists (for the client port drop-in)
  # The client package creates /etc/clickhouse-client/ but NOT the config.d/
  # subdir that 15-log-discipline writes the client port drop-in into.
  ansible.builtin.file:
    path: /etc/clickhouse-client/config.d
    state: directory
    mode: "0755"

- name: Ensure clickhouse-server systemd drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/system/clickhouse-server.service.d
    state: directory
    mode: "0755"

- name: Disable core dumps for clickhouse-server
  # apport capturing a crashed ClickHouse held the dead process ~4 min and wrote
  # a 4.7 GB core to the root disk; err.log already has the stack trace.
  ansible.builtin.copy:
    dest: /etc/systemd/system/clickhouse-server.service.d/no-core.conf
    mode: "0644"
    content: |
      [Service]
      LimitCORE=0
  register: ch_no_core

- name: Enable + start clickhouse-server
  ansible.builtin.systemd:
    name: clickhouse-server
    state: started
    enabled: true
    daemon_reload: "{{ ch_no_core is changed }}"

- name: Flush handlers so the port override is live before the schema apply
  ansible.builtin.meta: flush_handlers

- name: Wait for ClickHouse native port {{ clickhouse_tcp_port | default(9300) }}
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ clickhouse_tcp_port | default(9300) }}"
    timeout: 60

# ── Schema (opt-in; fresh host only, never re-run against a live lake) ──
#
# THE APPLY SET IS AN ALLOW-LIST, NOT A GLOB. deploy/clickhouse/ is not a
# bootstrap manifest: `tier1_schema.sql` is the founding DDL, the rest are
# OPERATOR artifacts for the existing deployment (r1: feature DDL mirrors,
# backfill runbooks, migrations), several headed "NOT auto-applied" or
# "FREEZE-GATED". Applying them wherever clickhouse_apply_schema is true
# (testnet.yml, futurenet.yml) would run operator migrations unattended. Most
# CREATEs are no-ops behind `IF NOT EXISTS`, but the cut-over halves
# (ledger_entries_current_v2, contract_events_daily_v2, with their MVs) would
# be built as duplicates of v1 tables the host does not have, doubling MV
# write work and storage for nothing.
#
# The list is DEFAULT-DENY: a new file in deploy/clickhouse/ does not run here
# until added. scripts/ci/lint-ch-apply-scope.sh keeps that from rotting: every
# deploy/clickhouse/*.sql must declare `si-apply-scope: fresh-host|operator`,
# the fresh-host set must EXACTLY equal this list, and every object an operator
# artifact creates must also be declared by a fresh-host file.
#
# clickhouse_apply_schema stays false on r1, whose DDL is applied by hand.
- name: Declare the fresh-host ClickHouse apply set
  when: clickhouse_apply_schema | default(false) | bool
  # lint-ch-apply-scope.sh parses this exact key, so the allow-list has ONE
  # home. tier1_schema.sql must be first: it CREATEs the `stellar` database.
  ansible.builtin.set_fact:
    clickhouse_fresh_host_schema:
      - tier1_schema.sql

- name: Remove any previously staged schema files
  # Removed, not merely re-created: hosts provisioned from an older glob-based
  # version still hold operator artifacts in /tmp/ch-schema, an invitation to
  # `cat /tmp/ch-schema/*.sql | clickhouse-client`.
  when: clickhouse_apply_schema | default(false) | bool
  ansible.builtin.file:
    path: /tmp/ch-schema
    state: absent

- name: Create schema staging dir
  when: clickhouse_apply_schema | default(false) | bool
  ansible.builtin.file:
    path: /tmp/ch-schema
    state: directory
    mode: "0755"

- name: Copy the fresh-host ClickHouse schema files
  when: clickhouse_apply_schema | default(false) | bool
  ansible.builtin.copy:
    # playbook_dir is configs/ansible/playbooks, so three levels up is the repo
    # root, the anchor the ch-live-catchup copies below also use.
    src: "{{ playbook_dir }}/../../../deploy/clickhouse/{{ item }}"
    dest: /tmp/ch-schema/
    mode: "0644"
  loop: "{{ clickhouse_fresh_host_schema }}"

- name: Apply the fresh-host ClickHouse schema
  when: clickhouse_apply_schema | default(false) | bool
  # No `|| true`: it would swallow every non-tier1 failure and report success
  # even if no object was created, and this is the only place a failure can
  # surface (deploy.yml's evidence step only asks whether objects exist).
  #
  # Still applies every file rather than stopping at the first failure (later
  # files are usually independent; aborting leaves a half-applied schema with no
  # report of the rest); failures are collected and the task fails at the end
  # naming each one.
  #
  # The closing line is self-accounting (N of M): "applied cleanly" reads the
  # same over an empty loop as a real apply, and an allow-list that rendered
  # empty must not pass.
  #
  # Per-file blocks are UNROLLED by Jinja, not a shell `for f in $rest` loop:
  # shell runs under /bin/sh (dash), and a rendered-empty word-split loop is a
  # syntax error in one shell and a no-op in another.
  ansible.builtin.shell: |
    set -u
    P={{ clickhouse_tcp_port | default(9300) }}
    want={{ clickhouse_fresh_host_schema | length }}
    if ! clickhouse-client --port "$P" --multiquery < /tmp/ch-schema/tier1_schema.sql; then
      echo "FAILED: tier1_schema.sql (base lake) — nothing else was attempted" >&2
      exit 1
    fi
    applied=1
    failed=""
    {% for f in clickhouse_fresh_host_schema if f != 'tier1_schema.sql' %}
    if clickhouse-client --port "$P" --multiquery < /tmp/ch-schema/{{ f }}; then
      applied=$((applied + 1))
    else
      failed="${failed} {{ f }}"
    fi
    {% endfor %}
    if [ -n "$failed" ]; then
      echo "FAILED to apply:${failed} (applied ${applied} of ${want} fresh-host schema file(s))" >&2
      exit 1
    fi
    if [ "$applied" -ne "$want" ]; then
      echo "applied ${applied} of ${want} fresh-host schema file(s) — the allow-list did not render as declared" >&2
      exit 1
    fi
    echo "applied ${applied} of ${want} fresh-host schema file(s) cleanly"
  changed_when: true

# ─── Tier-1 lake self-healer ──────────────────────────
#
# ch-live-catchup (scripts/ops/ch-live-catchup.sh, deploy/systemd/
# ch-live-catchup.{service,timer}) is the ONLY thing that fills a hole in the
# Tier-1 lake. Without it, internal/projector's resolveTip clamps to the
# ContiguousWatermark, so one unhealed gap stalls the CH-fed projector
# permanently rather than degrading. Live wherever run_clickhouse is true
# (testnet.yml, futurenet.yml).
#
# Units are copied VERBATIM from deploy/systemd/, not templated: they carry no
# host-specific values and the checked-in file stays what actually runs (as
# config-assertions.{service,timer} do in 15-log-discipline.yml).

- name: Install the ClickHouse live-catchup script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/ops/ch-live-catchup.sh"
    dest: /usr/local/bin/ch-live-catchup.sh
    owner: root
    group: root
    mode: "0755"
  when: ch_live_catchup_enabled | default(true) | bool

- name: Install the ClickHouse live-catchup systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ch-live-catchup.service
    - ch-live-catchup.timer
  register: ch_live_catchup_units
  when: ch_live_catchup_enabled | default(true) | bool

- name: Enable + start the ClickHouse live-catchup timer
  ansible.builtin.systemd:
    name: ch-live-catchup.timer
    enabled: true
    state: started
    daemon_reload: "{{ ch_live_catchup_units is changed }}"
  when:
    - ch_live_catchup_enabled | default(true) | bool
    # check-mode guard: --check reports the units changed without writing them,
    # so daemon_reload would act on files that do not exist. Same as the
    # ch-schema-snapshot timer above.
    - not (ansible_check_mode and ch_live_catchup_units is changed)
