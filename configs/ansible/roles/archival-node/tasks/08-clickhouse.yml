---
# ClickHouse — the certified lake (ADR-0034). An out-of-band install on r1
# (the 2026-06 lake pivot); codified here so a fresh host (r2/r3/test net)
# gets it reproducibly. Imported behind run_clickhouse (DEFAULT FALSE in
# main.yml) so r1's hand-tended ClickHouse is NEVER touched by this role —
# test nets / fresh regions set run_clickhouse=true. Native port is
# clickhouse_tcp_port (default 9300; 9000 is MinIO's). Schema application is
# a SEPARATE opt-in (clickhouse_apply_schema, default false) so a re-run
# never re-executes DDL against a live lake.

- name: Install the ClickHouse repo signing key
  # Shipped as a role file — the online key URL (packages.clickhouse.com/deb/
  # pubkey.gpg) 404s and the keyserver fetch is flaky; this is r1's proven key.
  ansible.builtin.copy:
    src: clickhouse-keyring.gpg
    dest: /usr/share/keyrings/clickhouse-keyring.gpg
    mode: "0644"

- name: Add ClickHouse apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg arch=amd64] https://packages.clickhouse.com/deb stable main"
    state: present
    filename: clickhouse

- name: Preseed ClickHouse default-user password (empty — non-interactive install)
  # debconf-set-selections (from the base `debconf` package) rather than the
  # ansible.builtin.debconf module, which needs debconf-utils
  # (debconf-get-selections) — not present on a fresh host.
  ansible.builtin.shell: echo 'clickhouse-server clickhouse-server/default-password password' | debconf-set-selections
  changed_when: false

- name: Install ClickHouse server + client
  ansible.builtin.apt:
    name:
      - clickhouse-server
      - clickhouse-common-static
      - clickhouse-client
    state: present
    update_cache: true

- name: Configure ClickHouse native port + loopback listen
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/si-override.xml
    mode: "0644"
    content: |
      <clickhouse>
          <tcp_port>{{ clickhouse_tcp_port | default(9300) }}</tcp_port>
          <listen_host>127.0.0.1</listen_host>
      </clickhouse>
  notify: Restart clickhouse-server

- name: Ensure ClickHouse client config.d dir exists (for the client port drop-in)
  # The clickhouse-client package creates /etc/clickhouse-client/ but NOT the
  # config.d/ subdir that 15-log-discipline writes the client port drop-in into
  # (so `clickhouse-client` defaults to the same 9300 native port). r1 had it.
  ansible.builtin.file:
    path: /etc/clickhouse-client/config.d
    state: directory
    mode: "0755"

- name: Enable + start clickhouse-server
  ansible.builtin.systemd:
    name: clickhouse-server
    state: started
    enabled: true

- name: Flush handlers so the port override is live before the schema apply
  ansible.builtin.meta: flush_handlers

- name: Wait for ClickHouse native port {{ clickhouse_tcp_port | default(9300) }}
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ clickhouse_tcp_port | default(9300) }}"
    timeout: 60

# ── Schema (opt-in; fresh host only — never re-run against a live lake) ──
#
# THE APPLY SET IS AN ALLOW-LIST, NOT A GLOB (2026-09-09).
#
# This used to copy `deploy/clickhouse/*.sql` with with_fileglob and then
# execute every file it found. That directory is not a bootstrap manifest:
# `tier1_schema.sql` is the founding DDL, and the other files are OPERATOR
# artifacts for the EXISTING deployment (r1) — a per-feature DDL mirror plus
# its windowed-backfill runbook, or a genuine migration. Several say exactly
# that in their own headers ("NOT auto-applied by any bootstrap", "A FRESH
# deployment does NOT need this file", one of them "FREEZE-GATED: do NOT
# run"), and every one of those claims was false wherever
# clickhouse_apply_schema is true — testnet.yml and futurenet.yml. So each
# fresh test-net provision ran the operator's migrations unattended.
#
# What that actually did, measured against the checked-in DDL: every CREATE
# in every non-tier1 file is byte-identical to tier1_schema.sql's own, and
# tier1 runs first, so most were pure no-ops behind `IF NOT EXISTS`. The two
# that were not built the cut-over halves — stellar.ledger_entries_current_v2
# (+_mv) and stellar.contract_events_daily_v2 (+_mv) — as exact duplicates of
# their v1 tables, on a host that has no v1 to cut over FROM. Confirmed on the
# live testnet host: identical column list and order, identical engine, ORDER
# BY and indexes, MVs reading the same source with the same SELECT into a
# second target. That host does double materialized-view write work and holds
# a second copy of the same rows, forever, for nothing.
#
# The list below is DEFAULT-DENY: a new file dropped into deploy/clickhouse/
# does not run here until someone adds it. The other half — so the deny
# cannot rot into a silent omission — is scripts/ci/lint-ch-apply-scope.sh,
# which fails CI unless every deploy/clickhouse/*.sql declares
# `si-apply-scope: fresh-host|operator` in its header, the fresh-host set is
# EXACTLY this list, and every object an operator artifact creates is also
# declared by a fresh-host file (so a genuinely-new fresh-host table cannot
# hide inside a migration).
#
# Deliberately NOT changed: clickhouse_apply_schema stays false on r1, whose
# DDL is applied by hand.
- name: Declare the fresh-host ClickHouse apply set
  when: clickhouse_apply_schema | default(false) | bool
  # scripts/ci/lint-ch-apply-scope.sh parses this exact key, so the
  # allow-list has ONE home. tier1_schema.sql must be first: it CREATEs the
  # `stellar` database everything else depends on.
  ansible.builtin.set_fact:
    clickhouse_fresh_host_schema:
      - tier1_schema.sql

- name: Remove any previously staged schema files
  # Removed rather than merely re-created: a host provisioned before the
  # allow-list still carries the 15 operator artifacts the old with_fileglob
  # copied into /tmp/ch-schema. Leaving them there is an invitation to
  # `cat /tmp/ch-schema/*.sql | clickhouse-client`, which is the defect
  # again by hand.
  when: clickhouse_apply_schema | default(false) | bool
  ansible.builtin.file:
    path: /tmp/ch-schema
    state: absent

- name: Create schema staging dir
  when: clickhouse_apply_schema | default(false) | bool
  ansible.builtin.file:
    path: /tmp/ch-schema
    state: directory
    mode: "0755"

- name: Copy the fresh-host ClickHouse schema files
  when: clickhouse_apply_schema | default(false) | bool
  ansible.builtin.copy:
    # playbook_dir is configs/ansible/playbooks, so three levels up is the
    # repo root — the same anchor the ch-live-catchup copies below use.
    src: "{{ playbook_dir }}/../../../deploy/clickhouse/{{ item }}"
    dest: /tmp/ch-schema/
    mode: "0644"
  loop: "{{ clickhouse_fresh_host_schema }}"

- name: Apply the fresh-host ClickHouse schema
  when: clickhouse_apply_schema | default(false) | bool
  # `|| true` used to swallow EVERY non-tier1 file's failure, so this task
  # reported success whether or not a single object was created. That is the
  # worst shape an apply can have: on 2026-09-07 the DDL for
  # stellar.account_creators_ops had to be applied by hand and confirmed in
  # system.tables, because nothing here would have said it had not been.
  # deploy.yml's evidence step only ASKS whether the objects exist — it is
  # not an apply — so this task was the only place a failure could surface.
  #
  # Still applies every file rather than stopping at the first failure (a
  # later file is usually independent of an earlier one, and aborting early
  # would leave a half-applied schema with no report of the rest), but the
  # failures are collected and the task fails at the end naming each one.
  #
  # The closing line is self-accounting (N of M). "applied every schema file
  # cleanly" reads identically over an empty loop as over a real apply, and
  # an allow-list that rendered empty is precisely the regression this task
  # would otherwise report as success.
  #
  # The per-file blocks are UNROLLED by Jinja rather than walked by a shell
  # `for f in $rest` loop: `ansible.builtin.shell` runs the body under
  # /bin/sh (dash on this role's hosts), and a rendered-empty word-split
  # loop is exactly the kind of dialect-sensitive construct that is a
  # syntax error in one shell and a no-op in another. Unrolling makes the
  # one-file list render as no blocks at all, which is unambiguous
  # everywhere.
  ansible.builtin.shell: |
    set -u
    P={{ clickhouse_tcp_port | default(9300) }}
    want={{ clickhouse_fresh_host_schema | length }}
    if ! clickhouse-client --port "$P" --multiquery < /tmp/ch-schema/tier1_schema.sql; then
      echo "FAILED: tier1_schema.sql (base lake) — nothing else was attempted" >&2
      exit 1
    fi
    applied=1
    failed=""
    {% for f in clickhouse_fresh_host_schema if f != 'tier1_schema.sql' %}
    if clickhouse-client --port "$P" --multiquery < /tmp/ch-schema/{{ f }}; then
      applied=$((applied + 1))
    else
      failed="${failed} {{ f }}"
    fi
    {% endfor %}
    if [ -n "$failed" ]; then
      echo "FAILED to apply:${failed} (applied ${applied} of ${want} fresh-host schema file(s))" >&2
      exit 1
    fi
    if [ "$applied" -ne "$want" ]; then
      echo "applied ${applied} of ${want} fresh-host schema file(s) — the allow-list did not render as declared" >&2
      exit 1
    fi
    echo "applied ${applied} of ${want} fresh-host schema file(s) cleanly"
  changed_when: true

# ─── Tier-1 lake self-healer (wave-D LID-1) ──────────────────────────
#
# ch-live-catchup is the ONLY thing that fills a hole in the ClickHouse
# Tier-1 lake. The script (scripts/ops/ch-live-catchup.sh) and both units
# (deploy/systemd/ch-live-catchup.{service,timer}) already existed and are
# covered by scripts/ops/ch-ops-user-test.sh — but nothing in this role
# ever installed them, so on a playbook-provisioned host the healer was
# simply absent.
#
# That is not cosmetic: internal/projector's resolveTip clamps to the
# ContiguousWatermark, so a single unhealed gap stalls the CH-fed
# projector permanently rather than degrading. Reachable wherever the
# lake is live — testnet.yml and futurenet.yml set run_clickhouse: true,
# and stellarindex.toml.j2 defaults clickhouse_live_sink and
# clickhouse_projector_source to true.
#
# Units are copied VERBATIM from deploy/systemd/ rather than templated:
# they carry no host-specific values, and copying keeps the checked-in
# file the thing that actually runs. That mirrors how
# config-assertions.{service,timer} are installed
# (15-log-discipline.yml) and is why those two are the directory's other
# authoritative entries.

- name: Install the ClickHouse live-catchup script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/ops/ch-live-catchup.sh"
    dest: /usr/local/bin/ch-live-catchup.sh
    owner: root
    group: root
    mode: "0755"
  when: ch_live_catchup_enabled | default(true) | bool

- name: Install the ClickHouse live-catchup systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ch-live-catchup.service
    - ch-live-catchup.timer
  register: ch_live_catchup_units
  when: ch_live_catchup_enabled | default(true) | bool

- name: Enable + start the ClickHouse live-catchup timer
  ansible.builtin.systemd:
    name: ch-live-catchup.timer
    enabled: true
    state: started
    daemon_reload: "{{ ch_live_catchup_units is changed }}"
  when:
    - ch_live_catchup_enabled | default(true) | bool
    # check-mode guard: --check reports the units as changed without
    # writing them, so daemon_reload would act on files that do not
    # exist yet. Same guard as the ch-schema-snapshot timer above.
    - not (ansible_check_mode and ch_live_catchup_units is changed)
