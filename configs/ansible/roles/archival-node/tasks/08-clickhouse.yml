---
# ClickHouse — the certified lake (ADR-0034). An out-of-band install on r1
# (the 2026-06 lake pivot); codified here so a fresh host (r2/r3/test net)
# gets it reproducibly. Imported behind run_clickhouse (DEFAULT FALSE in
# main.yml) so r1's hand-tended ClickHouse is NEVER touched by this role —
# test nets / fresh regions set run_clickhouse=true. Native port is
# clickhouse_tcp_port (default 9300; 9000 is MinIO's). Schema application is
# a SEPARATE opt-in (clickhouse_apply_schema, default false) so a re-run
# never re-executes DDL against a live lake.

- name: Install the ClickHouse repo signing key
  # Shipped as a role file — the online key URL (packages.clickhouse.com/deb/
  # pubkey.gpg) 404s and the keyserver fetch is flaky; this is r1's proven key.
  ansible.builtin.copy:
    src: clickhouse-keyring.gpg
    dest: /usr/share/keyrings/clickhouse-keyring.gpg
    mode: "0644"

- name: Add ClickHouse apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg arch=amd64] https://packages.clickhouse.com/deb stable main"
    state: present
    filename: clickhouse

- name: Preseed ClickHouse default-user password (empty — non-interactive install)
  # debconf-set-selections (from the base `debconf` package) rather than the
  # ansible.builtin.debconf module, which needs debconf-utils
  # (debconf-get-selections) — not present on a fresh host.
  ansible.builtin.shell: echo 'clickhouse-server clickhouse-server/default-password password' | debconf-set-selections
  changed_when: false

- name: Install ClickHouse server + client
  ansible.builtin.apt:
    name:
      - clickhouse-server
      - clickhouse-common-static
      - clickhouse-client
    state: present
    update_cache: true

- name: Configure ClickHouse native port + loopback listen
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/si-override.xml
    mode: "0644"
    content: |
      <clickhouse>
          <tcp_port>{{ clickhouse_tcp_port | default(9300) }}</tcp_port>
          <listen_host>127.0.0.1</listen_host>
      </clickhouse>
  notify: Restart clickhouse-server

- name: Ensure ClickHouse client config.d dir exists (for the client port drop-in)
  # The clickhouse-client package creates /etc/clickhouse-client/ but NOT the
  # config.d/ subdir that 15-log-discipline writes the client port drop-in into
  # (so `clickhouse-client` defaults to the same 9300 native port). r1 had it.
  ansible.builtin.file:
    path: /etc/clickhouse-client/config.d
    state: directory
    mode: "0755"

- name: Enable + start clickhouse-server
  ansible.builtin.systemd:
    name: clickhouse-server
    state: started
    enabled: true

- name: Flush handlers so the port override is live before the schema apply
  ansible.builtin.meta: flush_handlers

- name: Wait for ClickHouse native port {{ clickhouse_tcp_port | default(9300) }}
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ clickhouse_tcp_port | default(9300) }}"
    timeout: 60

# ── Schema (opt-in; fresh host only — never re-run against a live lake) ──
- name: Create schema staging dir
  when: clickhouse_apply_schema | default(false) | bool
  ansible.builtin.file:
    path: /tmp/ch-schema
    state: directory
    mode: "0755"

- name: Copy ClickHouse schema files
  when: clickhouse_apply_schema | default(false) | bool
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tmp/ch-schema/
    mode: "0644"
  with_fileglob:
    - "{{ playbook_dir }}/../../../deploy/clickhouse/*.sql"

- name: Apply ClickHouse tier1 schema (base lake) then the rest
  when: clickhouse_apply_schema | default(false) | bool
  ansible.builtin.shell: |
    set -e
    P={{ clickhouse_tcp_port | default(9300) }}
    clickhouse-client --port $P --multiquery < /tmp/ch-schema/tier1_schema.sql
    for f in /tmp/ch-schema/*.sql; do
      [ "$(basename "$f")" = tier1_schema.sql ] && continue
      clickhouse-client --port $P --multiquery < "$f" || true
    done
  changed_when: true

# ─── Tier-1 lake self-healer (wave-D LID-1) ──────────────────────────
#
# ch-live-catchup is the ONLY thing that fills a hole in the ClickHouse
# Tier-1 lake. The script (scripts/ops/ch-live-catchup.sh) and both units
# (deploy/systemd/ch-live-catchup.{service,timer}) already existed and are
# covered by scripts/ops/ch-ops-user-test.sh — but nothing in this role
# ever installed them, so on a playbook-provisioned host the healer was
# simply absent.
#
# That is not cosmetic: internal/projector's resolveTip clamps to the
# ContiguousWatermark, so a single unhealed gap stalls the CH-fed
# projector permanently rather than degrading. Reachable wherever the
# lake is live — testnet.yml and futurenet.yml set run_clickhouse: true,
# and stellarindex.toml.j2 defaults clickhouse_live_sink and
# clickhouse_projector_source to true.
#
# Units are copied VERBATIM from deploy/systemd/ rather than templated:
# they carry no host-specific values, and copying keeps the checked-in
# file the thing that actually runs. That mirrors how
# config-assertions.{service,timer} are installed
# (15-log-discipline.yml) and is why those two are the directory's other
# authoritative entries.

- name: Install the ClickHouse live-catchup script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/ops/ch-live-catchup.sh"
    dest: /usr/local/bin/ch-live-catchup.sh
    owner: root
    group: root
    mode: "0755"
  when: ch_live_catchup_enabled | default(true) | bool

- name: Install the ClickHouse live-catchup systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ch-live-catchup.service
    - ch-live-catchup.timer
  register: ch_live_catchup_units
  when: ch_live_catchup_enabled | default(true) | bool

- name: Enable + start the ClickHouse live-catchup timer
  ansible.builtin.systemd:
    name: ch-live-catchup.timer
    enabled: true
    state: started
    daemon_reload: "{{ ch_live_catchup_units is changed }}"
  when:
    - ch_live_catchup_enabled | default(true) | bool
    # check-mode guard: --check reports the units as changed without
    # writing them, so daemon_reload would act on files that do not
    # exist yet. Same guard as the ch-schema-snapshot timer above.
    - not (ansible_check_mode and ch_live_catchup_units is changed)
