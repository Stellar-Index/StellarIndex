---
# Build + install the stellarindex-* binaries, ship migrations, run
# them against the freshly-provisioned stellarindex database (05-
# postgres.yml), and bring up the indexer systemd service.
#
# Build is cross-compiled on the operator's host (delegate_to:
# localhost) and copied up — avoids cloning a private git repo on
# r1 and avoids running a Go toolchain there. Operator must have
# Go ≥1.25 locally; verified in 01-preflight.yml.
#
# Re-applying this task is idempotent:
#   - Binary copies are content-hash idempotent (`copy` only writes
#     when the source bytes change).
#   - `stellarindex-migrate up` is idempotent by design (no-op when
#     the schema is at the latest version).
#   - The systemd unit handler restarts only on unit-file change.

- name: Refuse to bootstrap binaries from a dirty working tree (localhost)
  # The bootstrap path builds + ships whatever is in the OPERATOR'S
  # checkout and (with stellarindex_apply_migrations) applies ITS
  # migrations. A half-done branch with an uncommitted migration would
  # reach the host under a version nobody can reproduce — the same
  # incident class the migrations task below records for prod
  # (2026-08-28 audit, deploy-ansible-drift-3). Refuse unless the tree is
  # clean; for a deliberate unreleased-branch bring-up pass
  # `-e stellarindex_bootstrap_allow_dirty_tree=true` (the sidecar then
  # records `-dirty`). `bin/` is gitignored, so prior build output does
  # not trip this.
  when:
    - manage_stellarindex_binaries | default(false) | bool
    - not (stellarindex_bootstrap_allow_dirty_tree | default(false) | bool)
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    chdir: "{{ playbook_dir }}/../../.."
    argv: [git, status, --porcelain]
  register: stellarindex_bootstrap_tree
  changed_when: false
  check_mode: false
  failed_when: stellarindex_bootstrap_tree.stdout | trim | length > 0

- name: Resolve the bootstrap build version (localhost)
  # Written to the deployed-versions sidecars after install, so a later
  # deploy.yml run labels its rollback copy with what was ACTUALLY running
  # instead of `untracked-<timestamp>` (docs/operations/deployed-versions.md).
  when: manage_stellarindex_binaries | default(false) | bool
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    chdir: "{{ playbook_dir }}/../../.."
    argv: [git, describe, --tags, --always, --dirty]
  register: stellarindex_bootstrap_describe
  changed_when: false
  check_mode: false

- name: Cross-compile stellarindex-* binaries (localhost)
  # 2026-07-03 drift audit: binary builds/installs moved to the
  # deploy.yml GitHub workflow (release-artifact + SHA256SUMS + staged
  # install + auto-rollback) — the config playbook manages CONFIG.
  # Flip manage_stellarindex_binaries only for a from-scratch bootstrap
  # where no release exists yet.
  when: manage_stellarindex_binaries | default(false) | bool
  # F-1314 (codex audit-2026-05-13): `sla-probe` added to the
  # bootstrap build/install list. The Healthchecks stellarindex-
  # sla-probe.{service,timer} units invoke
  # /usr/local/bin/stellarindex-sla-probe; pre-fix archival-node
  # bootstrap built indexer/aggregator/api/migrate/ops only, so a
  # fresh-host apply would enable the timer (via the healthchecks
  # role) but find no binary under it. Bootstrap is now complete
  # without an out-of-band ssh side-channel.
  delegate_to: localhost
  # Local `go build` on the CONTROLLER — never escalate. The play sets
  # become: true for the remote host; inheriting it here makes ansible try
  # sudo on the controller, which fails on an operator laptop ("Premature
  # end of stream waiting for become success").
  become: false
  ansible.builtin.command:
    chdir: "{{ playbook_dir }}/../../.."
    argv:
      - go
      - build
      - -trimpath
      - -ldflags
      - "-s -w"
      - -o
      - "{{ playbook_dir }}/../../../bin/stellarindex-{{ item }}"
      - "./cmd/stellarindex-{{ item }}"
  environment:
    GOOS: linux
    GOARCH: amd64
    CGO_ENABLED: "0"
  loop:
    - indexer
    - aggregator
    - api
    - migrate
    - ops
    - sla-probe
  changed_when: true   # rebuild every apply; copy step decides if r1 changed

- name: Install stellarindex binaries on r1
  # 2026-07-03 drift audit: binary builds/installs moved to the
  # deploy.yml GitHub workflow (release-artifact + SHA256SUMS + staged
  # install + auto-rollback) — the config playbook manages CONFIG.
  # Flip manage_stellarindex_binaries only for a from-scratch bootstrap
  # where no release exists yet.
  when: manage_stellarindex_binaries | default(false) | bool
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../bin/stellarindex-{{ item }}"
    dest: "/usr/local/bin/stellarindex-{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - indexer
    - aggregator
    - api
    - migrate
    - ops
    - sla-probe
  # Every long-running unit whose binary this task replaces. It used to
  # notify only the indexer, so a bootstrap apply left the api (and
  # aggregator) units running the OLD binary from memory while
  # /usr/local/bin held the new one — the unit tasks below use
  # `state: started`, which never restarts a running unit (2026-08-28
  # audit, deploy-ansible-drift-3). The aggregator handler self-gates on
  # run_aggregator (no-op on test nets).
  notify:
    - Restart stellarindex-indexer
    - Restart stellarindex-aggregator
    - Restart stellarindex-api

- name: Ensure deployed-versions directory exists (bootstrap)
  when: manage_stellarindex_binaries | default(false) | bool
  ansible.builtin.file:
    path: /var/lib/stellarindex/deployed-versions
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write deployed-versions sidecars for bootstrap-built binaries
  # Same sidecar deploy-one-binary.yml writes (bare version string, one
  # file per binary) — its value is the controller checkout's
  # `git describe --tags --always --dirty`, e.g. v0.47.2-3-g1a2b3c4-dirty.
  when: manage_stellarindex_binaries | default(false) | bool
  ansible.builtin.copy:
    content: "{{ stellarindex_bootstrap_describe.stdout | trim }}"
    dest: "/var/lib/stellarindex/deployed-versions/stellarindex-{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - indexer
    - aggregator
    - api
    - migrate
    - ops
    - sla-probe

# ──── Migrations (versioned schema for trades + oracle_updates + CAGGs) ───

- name: Ensure migrations dir exists on r1
  ansible.builtin.file:
    path: /usr/local/share/stellarindex/migrations
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Sync migrations from repo to the host
  # ansible.builtin.copy (not ansible.posix.synchronize/rsync): synchronize
  # fails over a ProxyJump connection ("'Connection' object has no attribute
  # '_new_stdin'") because rsync runs on the controller and can't inherit the
  # jump. copy is connection-agnostic (works over the private-NAT jump AND
  # r1's direct SSH), content-hash idempotent, and forces root:root ownership
  # regardless of the controller's uid — migrations are append-only, so the
  # lack of stale-file deletion is immaterial.
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../migrations/"
    dest: /usr/local/share/stellarindex/migrations/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Run pending migrations against the stellarindex database
  # OPT-IN since 2026-07-10: deploy.yml is the canonical migration
  # applier (stages migrations FROM THE TAG, guaranteeing
  # binary<->migration parity). This task syncs from the OPERATOR'S
  # LOCAL CHECKOUT, so running it by default applied an UNRELEASED
  # migration (0101) to production during a plain config apply — and
  # it failed on an ownership drift, leaving schema_migrations dirty
  # and the play aborted before the config template it was invoked
  # for. Set stellarindex_apply_migrations=true explicitly (greenfield
  # bringup / deliberate out-of-band apply) to run it.
  when: stellarindex_apply_migrations | default(false) | bool
  ansible.builtin.command:
    argv:
      - /usr/local/bin/stellarindex-migrate
      - -migrations
      - /usr/local/share/stellarindex/migrations
      - up
  environment:
    STELLARINDEX_POSTGRES_DSN: "postgres://{{ postgres_user_stellarindex }}:{{ postgres_pass_stellarindex }}@127.0.0.1:5432/{{ postgres_db_stellarindex }}?sslmode=disable"
  register: migrate_result
  changed_when: "'no change' not in (migrate_result.stdout | default(''))"
  failed_when: migrate_result.rc != 0
  no_log: true

# ──── Indexer service ─────────────────────────────────────────────────

- name: Template /etc/default/stellarindex (runtime secrets env file)
  # EnvironmentFile loaded by the stellarindex-{indexer,aggregator,
  # api} units. Carries the Postgres DSN (with password), the MinIO
  # read creds, and the off-chain connector API keys — everything
  # stellarindex.toml deliberately omits. Mode 0640 root:stellarindex
  # (CS-118/CS-121 pattern): systemd reads EnvironmentFile as PID 1,
  # but scripts sourced interactively by the service user need group
  # read; the stellarindex group is created in 04-users.yml (CS-119).
  ansible.builtin.template:
    src: stellarindex.env.j2
    dest: /etc/default/stellarindex
    owner: root
    group: stellarindex
    mode: "0640"
  no_log: true
  notify:
    - Restart stellarindex-indexer
    - Restart stellarindex-aggregator
    - Restart stellarindex-api

- name: Template /etc/stellarindex.toml
  # The on-disk config carries everything except secrets. Secrets
  # come from /etc/default/stellarindex via EnvironmentFile (the
  # Postgres password overrides the DSN here; S3 creds + connector
  # keys are injected the same way).
  ansible.builtin.template:
    src: stellarindex.toml.j2
    dest: /etc/stellarindex.toml
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart stellarindex-indexer
    - Restart stellarindex-aggregator
    - Restart stellarindex-api

- name: Install stellarindex-indexer systemd unit
  ansible.builtin.template:
    src: systemd/stellarindex-indexer.service.j2
    dest: /etc/systemd/system/stellarindex-indexer.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart stellarindex-indexer

- name: Enable + start stellarindex-indexer
  ansible.builtin.systemd:
    name: stellarindex-indexer
    state: started
    enabled: true
    daemon_reload: true

# ──── Aggregator service ──────────────────────────────────────────────
# Reads Timescale `trades` rows + writes CAGG rollups (per-window VWAP/TWAP).
# /v1/price closed-bucket serving (ADR-0015) depends on this populating
# the CAGG tables — without aggregator running, the API falls back to
# last-trade lookups which won't satisfy the cross-region consistency
# property. See aggregation-plan.md for the pipeline.

- name: Install stellarindex-aggregator systemd unit
  # The aggregator (USD pricing / VWAP / divergence) is Mainnet-only — test
  # nets have no real markets, so it would idle and spew ErrAssetUnsupported.
  # run_aggregator defaults true (pubnet unchanged); test-net inventory sets
  # it false. When off, also stop/disable any unit a prior run installed.
  when: run_aggregator | default(true) | bool
  ansible.builtin.template:
    src: systemd/stellarindex-aggregator.service.j2
    dest: /etc/systemd/system/stellarindex-aggregator.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart stellarindex-aggregator

- name: Enable + start stellarindex-aggregator
  when: run_aggregator | default(true) | bool
  ansible.builtin.systemd:
    name: stellarindex-aggregator
    state: started
    enabled: true
    daemon_reload: true

- name: Stop + disable stellarindex-aggregator when not run (test nets)
  when: not (run_aggregator | default(true) | bool)
  ansible.builtin.systemd:
    name: stellarindex-aggregator
    state: stopped
    enabled: false
  failed_when: false

# ──── API service ─────────────────────────────────────────────────────
# The public REST + SSE server. Caddy terminates TLS on :80/:443 and
# proxies to this on the loopback :3000. Without this unit a rebuild
# produces no public API surface.

- name: Install stellarindex-api systemd unit
  ansible.builtin.template:
    src: systemd/stellarindex-api.service.j2
    dest: /etc/systemd/system/stellarindex-api.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart stellarindex-api

- name: Enable + start stellarindex-api
  ansible.builtin.systemd:
    name: stellarindex-api
    state: started
    enabled: true
    daemon_reload: true

# ──── Timer-driven oneshot units ──────────────────────────────────────
# verify-archive Tier A (nightly chain-link integrity, ADR-0016),
# archive-completeness (daily completeness verify, ADR-0017) and
# supply-snapshot (daily supply writer, ADR-0011). Each is a oneshot
# service fired by a systemd timer. R1 is the integrity leader; R2/R3
# run verify-archive on a slower cadence (separate units, TBD).

- name: stellarindex user reads the galexie report dir (diagnostics/archive endpoint)
  # /var/lib/galexie is 750 galexie:galexie; the api's
  # /v1/diagnostics/archive reads last-completeness-report.json from
  # inside it. Group membership is the narrowest grant (vs 755 on a
  # dir that also holds captive-core state).
  ansible.builtin.user:
    name: stellarindex
    groups: galexie
    append: true

- name: galexie drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/galexie.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: galexie resource-protection drop-in (2026-07-05 captive-core wedge)
  # The captive stellar-core got swapped/starved by co-located batch
  # work (CH allocator exhaustion + an unwindowed ops job) and wedged
  # with 'invalid local state' — an 11h lake stall. MemoryLow makes
  # the kernel reclaim galexie LAST; the weights outrank batch jobs
  # for CPU/IO under contention.
  ansible.builtin.copy:
    dest: /etc/systemd/system/galexie.service.d/resources.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      MemoryLow=16G
      CPUWeight=500
      IOWeight=500
  notify: Reload systemd

- name: heavy-job wrapper (mandatory for ops one-shots on this host)
  # Serialises + host-protects heavy ops one-shots. Two jobs:
  #   1. Singleton lock (C4-14 / INF-11): a per-job flock so overlapping
  #      timer fires (or a manual run racing a timer run) can't stack
  #      and exhaust the single R1 host — a second run is skipped while
  #      the first is still going.
  #   2. For root callers, wraps the command in a systemd transient
  #      scope with a hard memory budget + batch-class CPU/IO so a
  #      ballooning job gets killed before it can starve galexie/CH/PG
  #      (the 2026-07-05 lesson).
  # Usage: run-heavy-job.sh <name> <command...>
  ansible.builtin.copy:
    dest: /usr/local/sbin/run-heavy-job.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Mandatory wrapper for heavy one-shot jobs (ops re-derives,
      # backfills, bulk SQL, archive walks). First takes a per-job
      # singleton lock so a new run can't start while the prior run of
      # the same job is still going (C4-14 / INF-11). Then, for root
      # callers, hard-caps memory at 20G (kill, not swap: MemorySwapMax=0
      # keeps the job away from swap entirely) and deprioritises CPU/IO
      # below the service units; non-root callers exec directly under
      # the lock (see the id -u branch below).
      set -euo pipefail
      if [ "$#" -lt 2 ]; then
        echo "run-heavy-job: usage: run-heavy-job.sh <name> <command> [args...]" >&2
        exit 2
      fi
      NAME="$1"; shift

      # ── Singleton lock (C4-14 / INF-11) ──────────────────────────
      # Per-job flock so a new run cannot start while the prior run of
      # the SAME job is still going. Overlapping timer fires — or a
      # manual run racing a timer run — that would otherwise stack and
      # exhaust the single R1 host are skipped cleanly instead of
      # piling on. The lock is held for the whole run: in the scoped
      # path below the wrapper blocks on systemd-run until the payload
      # exits; in the exec path fd 9 is inherited across exec (flock
      # survives exec) and the payload holds it until it exits.
      LOCK="${HEAVY_JOB_LOCK_DIR:-/run/lock}/stellarindex-heavy-${NAME}.lock"
      exec 9>"$LOCK"
      if ! flock -n 9; then
        echo "run-heavy-job: ${NAME} already running (lock ${LOCK} held) — skipping this fire" >&2
        exit 0
      fi

      # ── ClickHouse ops-batch identity (2026-08-28 r1) ─────────────
      # Import STELLARINDEX_CLICKHOUSE_OPS_USER/_PASSWORD from
      # /etc/default/stellarindex-ops HERE, so every wrapped
      # stellarindex-ops ClickHouse connection authenticates as the
      # low-priority `ops_batch` user (20-clickhouse-serving-profile.yml,
      # internal/storage/clickhouse/ops_auth.go) regardless of the
      # CALLER's shell. The runbooks that prescribe the heavy jobs
      # (sep41-mint-recovery, usd-volume-rederive, fx-history-missing,
      # lcm-cache-tiering) source /etc/default/stellarindex — the PG /
      # MinIO service identity — not -ops, and the 2026-08-28 `ch-rebuild
      # -sep41` that starved the aggregator's supply refresher was
      # launched exactly that way; relying on the caller to source the
      # right file made the profile a silent no-op on the incident path.
      # Only this PAIR is imported, never the whole file: sourcing -ops
      # wholesale would override a caller's deliberate AWS_*/DSN choice
      # (lcm-cache-tiering uses the service identity on purpose). A
      # value already in the caller's env wins. Values are read verbatim
      # (no eval — the password is a secret and may contain shell
      # metacharacters). HEAVY_JOB_OPS_ENV overrides the path for tests
      # and non-standard hosts, same pattern as HEAVY_JOB_LOCK_DIR.
      OPS_ENV="${HEAVY_JOB_OPS_ENV:-/etc/default/stellarindex-ops}"
      if [ -z "${STELLARINDEX_CLICKHOUSE_OPS_USER:-}" ] && [ -r "$OPS_ENV" ]; then
        while IFS= read -r line || [ -n "$line" ]; do
          case "$line" in
            STELLARINDEX_CLICKHOUSE_OPS_USER=*|STELLARINDEX_CLICKHOUSE_OPS_PASSWORD=*)
              export "${line%%=*}=${line#*=}" ;;
          esac
        done < "$OPS_ENV"
      fi
      # Loud either way (the whole 2026-08-28 class is a job that ran
      # at serving priority with nothing saying so): name the identity
      # the job will use, or WARN that it is the CH `default` user.
      if [ -n "${STELLARINDEX_CLICKHOUSE_OPS_USER:-}" ]; then
        echo "run-heavy-job: ${NAME} ClickHouse identity: ${STELLARINDEX_CLICKHOUSE_OPS_USER} (ops_batch low-priority profile)" >&2
      else
        echo "run-heavy-job: WARNING ${NAME} ClickHouse identity: CH 'default' user at SERVING priority — STELLARINDEX_CLICKHOUSE_OPS_USER is neither in the environment nor in ${OPS_ENV}. Any stellarindex-ops ClickHouse read in this job can starve the aggregator/indexer (2026-08-28 r1 supply_refresh_error_dominant class). Enable clickhouse_ops_batch_profile_enabled and apply --tags clickhouse-ops-batch-profile,minio,heavy-job-wrapper." >&2
      fi

      # De-privileged units (User=stellarindex) can't create a system
      # transient scope (polkit denies non-root StartTransientUnit), and
      # Type=notify units must keep the payload as the unit's MAIN pid
      # for sd_notify/WatchdogSec — a systemd-run scope would move it
      # into a child cgroup and silently break NotifyAccess=main. So for
      # non-root callers, exec the payload directly under the held lock.
      # (Root one-shots fall through to the memory-capped scope below;
      # non-root heavy scripts already self-guard memory — e.g.
      # CHSUPPLY_MEMGUARD / 25k-ledger chunking.)
      if [ "$(id -u)" -ne 0 ]; then
        echo "run-heavy-job: WARNING running as non-root — the systemd-run MemoryMax=20G scope cap and the root-FS/DATA-POOL disk watchdog are INACTIVE for this job (only the singleton lock applies). The caller must self-guard memory/disk (e.g. CHSUPPLY_MEMGUARD / chunking)." >&2
        exec "$@"
      fi

      UNIT="heavy-${NAME}-$$"

      # Disk watchdog (2026-06-11 incident follow-up, extended 2026-07-21).
      # Two independent failure modes, each with its own filesystem:
      #   1. ROOT (49G): a heavy job that floods logs or scratch space
      #      fills root faster than anyone reacts, wedging service logging
      #      into the CH async-channel failure mode.
      #   2. DATA POOL: the heavy jobs themselves (backfills, re-derives,
      #      archive walks) WRITE to the ZFS data pool via
      #      /var/lib/clickhouse — a backfill that fills the pool would
      #      break CH ingest and PG/galexie alike, and the root-only guard
      #      above is BLIND to it (different filesystem). A pool near-full
      #      also degrades ZFS write performance sharply. All pool datasets
      #      share the pool's free space, so `df` on the CH dataset is a
      #      faithful pool-capacity probe.
      # Stop the job while EITHER filesystem still has headroom; the
      # services it would have starved keep running. Thresholds/paths are
      # env-overridable for non-standard hosts (same pattern as
      # HEAVY_JOB_LOCK_DIR above).
      POOL_PATH="${HEAVY_JOB_POOL_PATH:-/var/lib/clickhouse}"
      # Default 300 GiB (2026-07-18 rationale): a heavy job that fills the
      # shared ZFS pool wedges LIVE ingest + merges, not just this job — the
      # runaway-phase0 near-miss ran unattended with ~2 TiB left and <1 TiB
      # free, guarded only on root. 300 GiB keeps headroom for merges + the
      # live sink, well above the point where ZFS write performance collapses.
      POOL_MIN_KB="${HEAVY_MIN_DATA_KB:-314572800}"
      # Fail LOUD, not silent: if POOL_PATH doesn't resolve, every watchdog tick
      # would hit the "df glitched — skip" arm and the pool guard would protect
      # nothing, invisibly, while the root guard kept working and masked the
      # gap — the exact fail-open class this watchdog exists to prevent. Probe
      # once up front and warn if it's unusable (the job still runs, guarded by
      # root; an operator sees the warning in the unit log).
      if ! df --output=avail -k "$POOL_PATH" >/dev/null 2>&1; then
        echo "run-heavy-job: WARNING POOL_PATH '${POOL_PATH}' is not statable — the DATA-POOL watchdog is INACTIVE for this job (root-FS guard still active). Set HEAVY_JOB_POOL_PATH to a path on the data pool." >&2
      fi
      (
        # This subshell MUST NOT inherit errexit/pipefail: a single
        # transient `df` failure (EBUSY/EIO under the very I/O pressure a
        # heavy job creates) would otherwise kill the watchdog silently
        # and leave a multi-hour job running with NO disk monitoring —
        # the exact fail-open the watchdog exists to prevent. Keep the
        # loop alive across a bad probe; a non-numeric/empty reading is
        # treated as "skip this tick, re-check in 30s", never as a
        # false low-space trip.
        set +eo pipefail
        stop_job() {  # $1=human reason
          echo "run-heavy-job: ${1} — stopping ${UNIT}" >&2
          systemctl stop "${UNIT}.scope" 2>/dev/null || systemctl kill "${UNIT}.scope" 2>/dev/null || true
          exit 0
        }
        while sleep 30; do
          root_kb=$(df --output=avail -k / 2>/dev/null | tail -1 | tr -d ' ')
          case "$root_kb" in
            ''|*[!0-9]*) : ;;  # df glitched — don't act on garbage
            *) [ "$root_kb" -lt 2097152 ] && stop_job "root FS below 2 GiB (${root_kb} KiB avail)" ;;
          esac
          pool_kb=$(df --output=avail -k "$POOL_PATH" 2>/dev/null | tail -1 | tr -d ' ')
          case "$pool_kb" in
            ''|*[!0-9]*) : ;;  # df glitched or POOL_PATH absent — skip this tick
            *) [ "$pool_kb" -lt "$POOL_MIN_KB" ] && stop_job "data pool ${POOL_PATH} below $((POOL_MIN_KB / 1048576)) GiB (${pool_kb} KiB avail)" ;;
          esac
        done
      ) &
      WATCHDOG=$!
      trap 'kill "$WATCHDOG" 2>/dev/null || true' EXIT

      rc=0
      systemd-run --scope --unit "$UNIT" \
        -p MemoryMax=20G -p MemorySwapMax=0 \
        -p CPUWeight=50 -p IOWeight=50 \
        "$@" || rc=$?
      exit "$rc"
  # Own tag (merged with the import's stellarindex/indexer tags) so the
  # ops-batch identity import above can be re-rendered on a host alone:
  # `--tags clickhouse-ops-batch-profile,minio,heavy-job-wrapper`
  # (docs/operations/clickhouse-ops-batch-profile.md) instead of a full
  # `--tags stellarindex` build+deploy pass.
  tags: [heavy-job-wrapper]

- name: archive-completeness drop-in directory
  # `copy` does not create parent dirs — without this the override.conf
  # copy below fails on a fresh host with "Destination directory
  # /etc/systemd/system/archive-completeness.service.d does not exist".
  # Same idiom as the galexie drop-in directory task above.
  ansible.builtin.file:
    path: /etc/systemd/system/archive-completeness.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: archive_completeness_enabled | bool

- name: archive-completeness override drop-in (root user, no legacy env)
  # Replaces a hand-written pre-rebrand override that still loaded
  # /etc/default/ratesengine — dead legacy credentials whose values
  # loaded AFTER the unit's real env file (later EnvironmentFile wins).
  # Site-audit follow-up 2026-07-03; the legacy file is removed below.
  ansible.builtin.copy:
    dest: /etc/systemd/system/archive-completeness.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      User=root
      Group=root
  notify: Reload systemd
  when: archive_completeness_enabled | bool

- name: Remove the legacy ratesengine env file
  # Pre-rebrand credentials (old DB, deleted MinIO reader) that
  # survived the 2026-07-03 brand purge because a systemd drop-in
  # still referenced the path. Nothing references it after the
  # override above.
  ansible.builtin.file:
    path: /etc/default/ratesengine
    state: absent

- name: Install compute-archive-to.sh helper
  # archive-completeness.service's ExecStartPre derives ARCHIVE_TO
  # from the indexer cursor. Without it ARCHIVE_TO stays 0 and the
  # completeness verify is a no-op (F-1205, audit-2026-05-12).
  ansible.builtin.copy:
    src: compute-archive-to.sh
    dest: /usr/local/sbin/compute-archive-to.sh
    owner: root
    group: root
    mode: "0755"

- name: Install compute-trim-cutoff.sh helper (ADR-0027 §Trim operator)
  # galexie-archive-trim.service's ExecStartPre derives TRIM_CUTOFF
  # = current indexer cursor − 90 days of ledgers. Same pattern as
  # compute-archive-to.sh; the trim binary requires an explicit
  # ledger sequence, and systemd can't do arithmetic in the unit.
  ansible.builtin.copy:
    src: compute-trim-cutoff.sh
    dest: /usr/local/sbin/compute-trim-cutoff.sh
    owner: root
    group: root
    mode: "0755"

- name: Install run-compute-completeness.sh driver (ADR-0033 verdict refresh)
  # compute-completeness.service runs this whole-pass driver: one
  # `compute-completeness -ch -pass` call proves recognition + substrate once
  # at full range for the whole catalogue and reconciles each source's
  # projection incrementally from its own watermark. The SDEX reconcile's
  # ClickHouse memory is bounded inside the tool (25k-ledger CH windowing), so
  # the wrapper no longer chunks — which is what removes the per-chunk repeat of
  # the ~60s global recognition scan that timed the nightly service out.
  ansible.builtin.copy:
    src: run-compute-completeness.sh
    dest: /usr/local/sbin/run-compute-completeness.sh
    owner: root
    group: root
    mode: "0755"

- name: Install data-freshness.sh watchdog (the "never get behind" textfile emit)
  # data-freshness.service runs this every 15 min: emits per-domain ingest
  # freshness + per-source completeness-verdict gauges so a dead feed / silent
  # timer / real served<>lake gap pages instead of rotting unnoticed.
  ansible.builtin.copy:
    src: data-freshness.sh
    dest: /usr/local/sbin/data-freshness.sh
    owner: root
    group: root
    mode: "0755"

- name: Install run-ch-supply.sh driver (supply_flows forward gap-fill)
  # ch-supply.service runs this: a defensive re-seed of stellar.supply_flows
  # for [last-seeded+1, tip] from the certified CH lake, in case the indexer's
  # live decode-at-ingest writer ever falls behind (normally a no-op).
  # supply_flows is what backs /v1/assets SEP-41 supply — summed live on
  # every request (no materialized rollup; the old stellar.token_supply
  # rollup + its -write refresh were retired, ROADMAP #66, 2026-07-10). Seed
  # is chunked + memory-guarded.
  ansible.builtin.copy:
    src: run-ch-supply.sh
    dest: /usr/local/sbin/run-ch-supply.sh
    owner: root
    group: root
    mode: "0755"

- name: Install verify-archive-tier-a / supply-snapshot / galexie-archive-trim units
  ansible.builtin.template:
    src: "systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - verify-archive-tier-a.service
    - verify-archive-tier-a.timer
    # Tier B is NOT in this loop — its checkpoint anchor needs a
    # network-correct local mirror, so it is installed conditionally
    # below (verify_archive_tier_b_enabled).
    # archive-completeness is NOT in this loop — its cross-anchor check is
    # pubnet-mirror-specific; installed conditionally below
    # (archive_completeness_enabled).
    - supply-snapshot.service
    - supply-snapshot.timer
    - galexie-archive-trim.service
    - galexie-archive-trim.timer
    - sep1-refresh.service
    - sep1-refresh.timer
    - directory-sync.service
    - directory-sync.timer
    # cap67-movements: a continuous FOLLOW DAEMON now (5.3), not a
    # timer+oneshot — only the .service is rendered; the old .timer is
    # retired below.
    - holders-rollup.service
    - holders-rollup.timer
    - census-rollup.service
    - census-rollup.timer
    - compute-completeness.service
    - compute-completeness.timer
    - data-freshness.service
    - data-freshness.timer
    - ch-supply.service
    - ch-supply.timer
    - issuer-flags.service
    - issuer-flags.timer
  notify: Reload systemd
  # First tag in this file (36 tasks, none tagged until now), added so
  # the ops-job units can be applied WITHOUT running the whole
  # archival-node role. That matters specifically here: a full role
  # apply can restart galexie, and a galexie restart is a ~9-minute
  # mainnet cold catchup — the 2026-08-27 sequence that cost 22 minutes
  # of r1 ingestion. Rendering unit files should not carry that risk.
  #
  # Untagged behaviour is unchanged: a plain run still includes these,
  # because ansible only filters when --tags is passed.
  tags: [ops-jobs]

- name: Enable + start verify-archive / completeness / supply-snapshot timers
  # galexie-archive-trim.timer is INTENTIONALLY OMITTED from this
  # loop — per [[feedback_cold_tier_premature_enable]] and ADR-0027
  # §Sequencing, the monthly trim is destructive before §3 (cold-
  # tiering enabled) + §4 (bulk-trim done). The operator runs
  # `systemctl enable --now galexie-archive-trim.timer` by hand
  # after the bulk-trim completes.
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - verify-archive-tier-a.timer
    # verify-archive-tier-b.timer is enabled in its own conditional block
    # below — see verify_archive_tier_b_enabled.
    # archive-completeness.timer is enabled in its own conditional block.
    - supply-snapshot.timer
    - sep1-refresh.timer
    - directory-sync.timer
    - holders-rollup.timer
    - census-rollup.timer
    - compute-completeness.timer
    - data-freshness.timer
    - ch-supply.timer
    - issuer-flags.timer
  tags: [ops-jobs]

# ── archive-completeness — only where its cross-anchor is correct ────
# See archive_completeness_enabled in defaults/main.yml: the check's only
# section is measured against the pubnet-only /srv/history-archive mirror,
# and its fill phase pulls FROM pubnet archives.
- name: Install + enable archive-completeness (networks with a correct cross-anchor)
  when: archive_completeness_enabled | bool
  block:
    - name: Install archive-completeness unit + timer
      ansible.builtin.template:
        src: "systemd/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - archive-completeness.service
        - archive-completeness.timer
      notify: Reload systemd

    - name: Enable + start archive-completeness.timer
      ansible.builtin.systemd:
        name: archive-completeness.timer
        state: started
        enabled: true
        daemon_reload: true

- name: Remove archive-completeness where its cross-anchor is not network-correct
  when: not (archive_completeness_enabled | bool)
  block:
    - name: Stop + disable archive-completeness timer and service
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - archive-completeness.timer
        - archive-completeness.service
      failed_when: false

    - name: Remove archive-completeness unit files
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - archive-completeness.timer
        - archive-completeness.service
      notify: Reload systemd

    - name: Clear the failed state left by earlier archive-completeness runs
      ansible.builtin.command:
        cmd: systemctl reset-failed archive-completeness.service
      changed_when: false
      failed_when: false

# ── verify-archive Tier B — only where its anchor can be correct ─────
# Tier B (checkpoint anchor, task #33 / W8 recon 14a): verify_archive.go
# has always implemented `-tier checkpoint` but only Tier A was scheduled,
# so the single-source-corruption anchor check never ran. It reads a LOCAL
# rs-stellar-archivist mirror (/srv/history-archive) which is populated for
# pubnet ONLY — see verify_archive_tier_b_enabled in defaults/main.yml for
# the full rationale and the observed testnet mismatch.
- name: Install + enable verify-archive-tier-b (networks with a correct anchor)
  # Tagged for the same reason as the tier-a install above (:697): the
  # ops-job units must be renderable WITHOUT a full archival-node run,
  # because a full run can restart galexie and a galexie restart is a
  # ~9-minute mainnet cold catchup. Tier B was left untagged when that
  # tag was introduced, so `--tags ops-jobs` — the apply procedure
  # docs/operations/runbooks/archive-divergence.md prescribes — rendered
  # tier-a's unit and silently skipped tier-b's, leaving the checkpoint
  # tier's `-textfile-output` export path (#282) permanently unwired
  # while the confirm step still read green. Untagged behaviour is
  # unchanged: a plain run still includes this block.
  tags: [ops-jobs]
  when: verify_archive_tier_b_enabled | bool
  block:
    - name: Install verify-archive-tier-b unit + timer
      ansible.builtin.template:
        src: "systemd/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - verify-archive-tier-b.service
        - verify-archive-tier-b.timer
      notify: Reload systemd

    - name: Enable + start verify-archive-tier-b.timer
      ansible.builtin.systemd:
        name: verify-archive-tier-b.timer
        state: started
        enabled: true
        daemon_reload: true

# Converge a net provisioned BEFORE the gate above existed: the units are
# on disk and the timer is enabled, so every nightly run leaves a failed
# unit behind for an anchor that cannot ever match. Ansible does not remove
# what it stops templating, so remove it explicitly. Idempotent on a net
# that never had it.
- name: Remove verify-archive-tier-b where its anchor is not network-correct
  # Tagged alongside the install block above so `--tags ops-jobs`
  # converges tier-b to the network-correct state on EITHER branch. A
  # tag that only ever installs and never removes is a half-tag: on a
  # net where the anchor is wrong it would leave the units on disk and
  # the timer enabled, which is exactly the drift this block exists to
  # undo.
  tags: [ops-jobs]
  when: not (verify_archive_tier_b_enabled | bool)
  block:
    - name: Stop + disable verify-archive-tier-b timer and service
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - verify-archive-tier-b.timer
        - verify-archive-tier-b.service
      failed_when: false

    - name: Remove verify-archive-tier-b unit files
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - verify-archive-tier-b.timer
        - verify-archive-tier-b.service
      notify: Reload systemd

    - name: Clear the failed state left by earlier tier-b runs
      ansible.builtin.command:
        cmd: systemctl reset-failed verify-archive-tier-b.service
      changed_when: false
      failed_when: false

- name: Retire the cap67-movements timer in favour of the follow daemon (5.3)
  # The follow daemon (cap67-movements.service, Type=simple, -follow) is the
  # SINGLE writer of stellar.account_movements. Stop + disable the old timer
  # so it can never fire a second, racing catch-up against the daemon's
  # watermark. Idempotent + fail-safe: no-ops on a fresh host that never had
  # the timer.
  ansible.builtin.systemd:
    name: cap67-movements.timer
    state: stopped
    enabled: false
  failed_when: false

- name: Remove the retired cap67-movements.timer unit file
  ansible.builtin.file:
    path: /etc/systemd/system/cap67-movements.timer
    state: absent
  notify: Reload systemd

- name: Install cap67-movements.service (own task so a unit change restarts ONLY this daemon)
  # Split out of the shared unit loop above on 2026-09-02: that loop notifies
  # only "Reload systemd", and the daemon used to be restarted UNCONDITIONALLY
  # by the enable task below (ansible-drift red since 08-31). Templating it
  # here lets a genuine unit-file change notify a targeted restart, while an
  # unchanged unit leaves the running daemon alone.
  ansible.builtin.template:
    src: systemd/cap67-movements.service.j2
    dest: /etc/systemd/system/cap67-movements.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart cap67-movements

- name: Enable + (re)start the cap67-movements follow daemon (5.3, real-time movements)
  # Long-lived daemon: catches up to the contiguous tip, then follows at
  # FOLLOW_INTERVAL. Restart=always in the unit makes it crash-safe; it
  # resumes from the persisted watermark.
  #
  # `restarted` (NOT `started`): `started` is a no-op while the unit is
  # active/activating, which on the timer→daemon cutover leaves an in-flight
  # OLD oneshot running and NEVER launches the new -follow ExecStart (the play
  # goes green with no daemon), and on any later run leaves the running daemon
  # on stale unit config. A deterministic restart is safe here — SIGTERM is
  # graceful (the loop exits mid-derive, the watermark holds, ReplacingMergeTree
  # dedups any re-derived window).
  #
  # 2026-09-02 (ansible-drift red since 08-31): `restarted` is unconditional,
  # so this task reports `changed` on EVERY run — including every `--check`
  # — and restarts a healthy daemon on every real apply. The timer→daemon
  # cutover it guarded against is long past. `started` + a handler notified
  # by the unit-template task above restarts the daemon exactly when its
  # unit file changes, which is the only time a restart is warranted.
  ansible.builtin.systemd:
    name: cap67-movements.service
    state: started
    enabled: true
    daemon_reload: true

# ──── Tier D weekly cron (multi-peer fork-detection) ──────────────────
# Per ADR-0016 §7.4: each region runs verify-archive Tier D weekly to
# catch upstream divergence (R2 reads from aws-public-blockchain S3,
# R3 from Vultr Object Storage; if either upstream's bytes hash to a
# different chain than the network's signed reality, Tier D catches it).
# Runs as root because it needs to read /etc/default/stellarindex-ops
# for galexie-archive S3 creds. Output to journald (logger -t).

- name: Install Tier D verify-archive weekly cron
  ansible.builtin.cron:
    name: stellarindex-verify-archive-tier-d
    cron_file: stellarindex-verify-archive-tier-d
    user: root
    minute: "23"
    hour: "4"
    weekday: "0"   # Sunday morning
    # The -ops file is read VERBATIM (systemd EnvironmentFile syntax is not
    # shell — `source` would expand `$` / split on `;` inside a secret;
    # deploy-ansible-secrets-5). No `%` here: cron turns it into a newline.
    job: >-
      bash -c 'while IFS= read -r l || [ -n "$l" ]; do case "$l" in [A-Za-z_]*=*) export "$l";; esac; done < /etc/default/stellarindex-ops;
      /usr/local/bin/stellarindex-ops verify-archive
      -config /etc/stellarindex.toml
      -tier peers
      -peer-samples 50
      -from 2 -to {{ stellarindex_live_seam_ledger | default(0) | int - 1 }}
      2>&1 | logger -t stellarindex-tier-d'
