---
# Disk-fill prevention for the root FS. A full root blocks Redis
# BGSAVE, which fails the aggregator's VWAP cache writes and 404s
# /v1/price on every rewritten/triangulated pair.
#
# Two layered caps, both applied here so a from-scratch rebuild
# can't regress:
#
#   1. rsyslog logrotate drop-in: cap the live syslog at 100M with
#      7-rotation history, gzip-compressed. Uncapped, /var/log/syslog
#      grows to many GB and rotated-but-not-compressed copies pile up.
#
#   2. systemd-journald cap: SystemMaxUse=500M. Uncapped, the journal
#      grows to several GB.
#
# The Prometheus alerts on root-FS fill (deploy/monitoring/rules/storage.yml,
# `stellarindex_node_root_disk_warning` + `_full`) catch the
# downstream symptom; this task addresses the upstream cause so
# the alert never has to fire in steady state.

- name: Install rsyslog logrotate override
  ansible.builtin.copy:
    dest: /etc/logrotate.d/rsyslog
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (archival-node role / 15-log-discipline.yml).
      # Caps the live syslog + auth.log + kern.log family so the root FS
      # cannot fill with logs.
      #
      # `maxsize 100M` — rotate as soon as a file crosses 100 MB,
      #                  even mid-cycle. Without this the file
      #                  could grow unbounded between daily rotations.
      # `rotate 7`     — keep 7 historic rotations (~7 days at
      #                  typical churn; weeks at quiet times).
      # `compress` +
      # `delaycompress`— gzip rotated copies, but defer one cycle
      #                  so the most-recent rotation stays readable
      #                  without zcat. Reproduces stock Ubuntu policy.
      # `notifempty`   — skip rotation when a file is empty (avoids
      #                  generating zero-byte syslog.1.gz artefacts).
      # `missingok`    — don't fail if any of the listed files
      #                  doesn't exist on this host (some are
      #                  service-specific and may be absent on
      #                  minimal installs).
      #
      # After rotating, send rsyslog a HUP via systemctl reload —
      # the daemon re-opens the file handles and resumes writing
      # to the freshly-rotated current files.
      /var/log/syslog
      /var/log/mail.info
      /var/log/mail.warn
      /var/log/mail.err
      /var/log/mail.log
      /var/log/daemon.log
      /var/log/kern.log
      /var/log/auth.log
      /var/log/user.log
      /var/log/lpr.log
      /var/log/cron.log
      /var/log/debug
      /var/log/messages
      {
              # su directive: /var/log is root:syslog group-writable on noble,
              # and logrotate REFUSES group-writable parents unless told
              # which user/group to rotate as — without it this whole override
              # is SKIPPED with "insecure permissions" errors and the 100M
              # maxsize cap never applies. Stock Ubuntu ships `su root adm` in
              # logrotate.conf for exactly this reason; a per-file override
              # must repeat it.
              su root adm
              rotate 7
              daily
              maxsize 100M
              missingok
              notifempty
              compress
              delaycompress
              sharedscripts
              postrotate
                      /usr/lib/rsyslog/rsyslog-rotate
              endscript
      }
  notify:
    - Reload rsyslog
  tags: [log-discipline, logrotate]

- name: Filter chatty service stdout out of /var/log/syslog
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/10-suppress-noisy-units.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (archival-node role / 15-log-discipline.yml).
      # Stops listed systemd-unit stdout from reaching /var/log/syslog
      # (and the rest of the rsyslog file targets). Messages are still
      # captured by journald and queryable via `journalctl -u <unit>`.
      #
      # Why: Loki single-binary mode at info-or-below logs ~4M
      # `caller=mock.go msg=Get key=collectors/...` lines per day —
      # poll-loop noise that can fill /var/log/syslog by GBs within days.
      # The Loki config itself sets log_level=warn (configs/ansible/roles/loki/
      # templates/loki-config.yaml.j2); this filter is the
      # belt-and-braces guarantee that an accidental log_level
      # regression doesn't blow the disk.
      if $programname == "loki" then stop
      # clickhouse-server: on a full root, CH's log rotation throws and
      # its async log channel wedges ("Cannot log message in
      # OwnAsyncSplitChannel"), spamming ~80k lines/min to journald →
      # rsyslog → /var/log/syslog and re-filling root in a self-
      # sustaining loop that can crash Postgres. CH's own log is also moved
      # to ZFS below so the channel can't wedge; this filter keeps the
      # journald flood off /var/log/syslog as belt-and-braces. journalctl -u
      # clickhouse-server still has the messages.
      if $programname == "clickhouse-server" then stop
  notify:
    - Reload rsyslog
  tags: [log-discipline, rsyslog]

- name: Ensure /etc/systemd/journald.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [log-discipline, journald]

- name: Install journald SystemMaxUse cap + rate-limit bump
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-cap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (archival-node role / 15-log-discipline.yml).
      # Two policies:
      #
      # 1) Storage cap. An unbounded journal grows to several GB of /var/log
      #    and contributes to root-FS fill. 500 MB is enough local buffer;
      #    Loki is the archive.
      #
      # 2) Rate-limit bump. journald's default RateLimitBurst (10000 over
      #    30 s) is hit during the indexer's startup burst — dispatcher
      #    registration, source connections, ledgerstream tier scan all log
      #    within a few seconds. Once the burst limit hits, journald drops
      #    messages for the remainder of the interval, leaving hours-long
      #    gaps in `journalctl -u stellarindex-indexer` with startup logs
      #    missing.
      #    50000-over-10s is generous enough to never legitimately
      #    drop messages from our binaries while still throttling
      #    pathological flood scenarios (e.g. a log loop bug). The
      #    SystemMaxUse cap above is the dominant guard against
      #    pathological log volume.
      [Journal]
      SystemMaxUse=500M
      # SystemKeepFree=300M ensures the journal never consumes the
      # last 300 MB of free space on the journal's filesystem (a
      # final guardrail above SystemMaxUse).
      SystemKeepFree=300M
      # MaxRetentionSec is an explicit UPPER BOUND on how long any
      # journal entry may live. It is usually a no-op on volume —
      # Caddy's access-log volume hits SystemMaxUse first, giving an
      # effective retention of roughly TEN HOURS on r1 — but it makes
      # "we keep logs for at most N" a property of the configuration
      # rather than a coincidence of current traffic. Without it, a drop
      # in request volume silently EXTENDS retention and the privacy
      # page would be claiming something nothing enforces.
      #
      # 14 days, not a month: the tighter of the two candidate ceilings,
      # so codifying it never loosens what the host already enforced.
      #
      # The BINDING number for anything PUBLISHED is Loki's
      # retention_period (720h / 30 days, configs/loki/loki.r1.yml) —
      # journald is the short-lived local buffer, Loki is the archive.
      MaxRetentionSec=14d
      # Carried over from the same stray file so removing it changes
      # nothing about the running configuration.
      SystemMaxFileSize=50M
      # Rate-limit override.
      RateLimitIntervalSec=10s
      RateLimitBurst=50000
  notify:
    - Restart systemd-journald
  tags: [log-discipline, journald]

# The drop-in above supersedes a hand-written one
# (/etc/systemd/journald.conf.d/size-limit.conf, root-owned). It sorts
# lexically AFTER 00-cap.conf, so ITS values would win — the
# applied-but-never-codified case, the mirror image of the usual
# codified-but-never-applied drift. Every setting it carried
# (SystemMaxUse, SystemMaxFileSize, MaxRetentionSec) is in the
# managed file at the same or tighter value, so removing it is a no-op
# on behaviour and makes ansible the single authority.
- name: Remove the superseded hand-written journald drop-in
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/size-limit.conf
    state: absent
  notify:
    - Restart systemd-journald
  tags: [log-discipline, journald]

- name: Install /etc/logrotate.d/stellarindex
  # Rotates /var/log/stellarindex/*.log weekly + on 500M size. Uses
  # copytruncate so long-running stellarindex-ops processes
  # (backfill/replay) holding open FDs don't end up writing to the
  # renamed file forever.
  ansible.builtin.copy:
    src: stellarindex.logrotate
    dest: /etc/logrotate.d/stellarindex
    owner: root
    group: root
    mode: "0644"

# ─── ClickHouse-dependent tasks in this file (F128) ──────────────────
# Everything below that writes into /etc/clickhouse-{server,client},
# chowns to the `clickhouse` user or runs clickhouse-client CONFIGURES a
# ClickHouse this host is assumed to already have — none of it installs
# one. This file is imported unconditionally (it also carries the
# rsyslog/journald/logrotate/Redis guards, which every host needs), and
# it is imported BEFORE 20/21/22, so on a host with no ClickHouse the
# first of these tasks aborted the whole role — the same defect those
# three files were gated for, one import earlier.
#
# Each carries the role-wide fact instead: clickhouse_config_tasks_enabled
# (tasks/main.yml, resolved right after preflight) = the server's config
# dir exists OR run_clickhouse. `run_clickhouse` alone would be the WRONG
# gate — it is false on r1 by design, and r1 is the host these were
# written for. `| default(false)` keeps a standalone import fail-closed.
# There are EIGHT of them; scripts/ci/ansible-clickhouse-host-gate-test.sh
# re-derives the set from this file, so a ninth cannot be added ungated.
- name: Ensure ClickHouse log directory exists on the ZFS pool
  # CH's <log> defaults to /var/log/clickhouse-server on the 49 GB root
  # (1000M x 10 rotation). On a full root the rotation throws and the
  # async log channel wedges ("Cannot log message in
  # OwnAsyncSplitChannel"), spamming ~80k lines/min and re-filling root in
  # a self-sustaining loop that can crash Postgres. /var/lib/clickhouse is
  # the 9 TB ZFS pool, which never fills — moving CH's logs there removes
  # the failure mode at the source.
  ansible.builtin.file:
    path: /var/lib/clickhouse/logs
    state: directory
    owner: clickhouse
    group: clickhouse
    mode: "0750"
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [log-discipline, clickhouse]

- name: Move ClickHouse server logs off root onto the ZFS pool
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/zzz-logpath.xml
    owner: root
    group: root
    mode: "0644"
    content: |
      <clickhouse>
          <!-- Managed by ansible (archival-node / 15-log-discipline.yml).
               2026-06-11 incident fix: CH server logs on the 9TB ZFS pool,
               not the chronically-tight 49G root. A full root must never be
               able to wedge CH's log-rotation/async channel again. -->
          <logger>
              <log>/var/lib/clickhouse/logs/clickhouse-server.log</log>
              <errorlog>/var/lib/clickhouse/logs/clickhouse-server.err.log</errorlog>
          </logger>
      </clickhouse>
  notify:
    - Restart clickhouse-server
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [log-discipline, clickhouse]

# ─── Redis memory cap ────────────────────────────────────────────────
# r1 runs the Debian-packaged redis-server (the redis-sentinel role is
# the future HA-cluster shape, NOT applied to archival nodes). Without
# this cap a rebuild ships an uncapped Redis that can eat the host under
# cache pressure.
- name: Cap Redis memory (Debian-packaged redis on the archival node)
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^#?\s*maxmemory\s+[^-]'
    line: "maxmemory {{ redis_maxmemory | default('1gb') }}"
  notify:
    - Restart redis
  tags: [log-discipline, redis]

# maxmemory alone leaves maxmemory-policy at the packaged
# default (noeviction) implicitly — a rebuild that changes Debian's
# shipped default silently changes eviction behavior. Pin it
# explicitly. noeviction (not allkeys-lru) is deliberate: this
# instance also holds the `apikey:` credential records (see
# redis-sentinel/defaults/main.yml), and allkeys-lru would evict an
# unrecoverable key under memory pressure instead of rejecting the
# write with OOM — a rejected write is loud and recoverable, a
# silently evicted credential is not.
- name: Pin Redis eviction policy (Debian-packaged redis on the archival node)
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^#?\s*maxmemory-policy\s+\S+'
    line: "maxmemory-policy {{ redis_maxmemory_policy | default('noeviction') }}"
  notify:
    - Restart redis
  tags: [log-discipline, redis]

# ─── nft-drop log routing ────────────────────────────────────────────
# Firewall drop logs go to their own small rotated file instead of
# /var/log/syslog — the security record is preserved but syslog stays
# readable and the root FS stays bounded (same class of guard as the
# clickhouse/loki suppression above).
- name: Route nft-drop kernel log lines to their own file
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/10-nft-drop.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (archival-node/15-log-discipline.yml).
      # security record is preserved but syslog stays readable + small.
      :msg, contains, "nft-drop" -/var/log/nft-drop.log
      & stop
  notify:
    - Reload rsyslog
  tags: [log-discipline, rsyslog, firewall]

- name: Rotate the nft-drop log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/nft-drop
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/nft-drop.log {
          daily
          rotate 5
          compress
          missingok
          notifempty
          create 0640 syslog adm
      }
  tags: [log-discipline, firewall]

# ─── config-assertions watchdog ──────────────────────────────────────
# Hourly content-assertions over the load-bearing guard configs; the
# textfile gauge feeds stellarindex_config_assertion_failed. A rebuild
# without this ships a host whose guards can silently regress.
- name: Install config-assertions script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/ops/config-assertions.sh"
    dest: /usr/local/bin/config-assertions.sh
    owner: root
    group: root
    mode: "0755"
  tags: [log-discipline, config-assertions]

- name: Install config-assertions systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - config-assertions.service
    - config-assertions.timer
  register: config_assertions_units
  tags: [log-discipline, config-assertions]

- name: Enable the config-assertions timer
  ansible.builtin.systemd:
    name: config-assertions.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    # Role-installed unit — CHECK-MODE UNIT GUARD, tasks/main.yml.
    - not (ansible_check_mode and config_assertions_units is changed)
  tags: [log-discipline, config-assertions]

- name: ClickHouse server tuning drop-in (formerly hand-managed)
  # zz-ratesengine.xml keeps its old-brand name: renaming needs a
  # coordinated restart, and the file is loaded by name-sort so the
  # prefix matters. max_server_memory_usage: 96G crashes under
  # vm.overcommit_memory=2 (commit budget: swap 16G + 80% x 188G; CH's
  # startup mmaps overshoot), 72G is stable. The completeness reconcile
  # needs real headroom, but the binding constraint is the KERNEL commit
  # budget, not RAM. r1 default = 72G; small test-net VMs override
  # clickhouse_max_server_memory_usage_bytes DOWN (e.g. 4G) so CH can't
  # starve the 20 GB VM (its default cap is 90% of RAM, and even the
  # commit — not the RSS — crowds out the API).
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/zz-ratesengine.xml
    owner: clickhouse
    group: clickhouse
    mode: "0644"
    content: |
      <clickhouse>
          <tcp_port>{{ clickhouse_tcp_port | default(9300) }}</tcp_port>
          <max_server_memory_usage>{{ clickhouse_max_server_memory_usage_bytes | default(77309411328) }}</max_server_memory_usage>
          <listen_host>127.0.0.1</listen_host>
          <listen_host>::1</listen_host>
          <logger><level>warning</level></logger>
      </clickhouse>
  # No automatic restart: CH restarts are operator-coordinated (the
  # lake sink tolerates them, but merges/queries in flight die).
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [clickhouse, log-discipline]

- name: ClickHouse CLIENT port drop-in (must match the server tcp_port above)
  # The server's native port is 9300 because MinIO owns 9000 on
  # this box (minio binds 127.0.0.1:9000, [::1]:9000 AND *:9000). The
  # client's compiled-in default is still 9000 — so a bare
  # `clickhouse-client` opens a TCP connection to MinIO's S3 API, sends
  # the ClickHouse native handshake, and MinIO simply never answers.
  #
  # The failure mode is the nasty one: it does not refuse and it does not
  # error, it HANGS FOREVER. An operator following any runbook that says
  # "run clickhouse-client" gets a dead terminal at the exact moment they
  # are trying to diagnose an incident, with nothing in any log to say
  # why.
  #
  # ROOT-ELEMENT GOTCHA, the reason this needs ansible rather than a
  # one-off file: a drop-in is only merged when its root element matches
  # the root of the config it merges into. /etc/clickhouse-server/*
  # is rooted at <clickhouse>, but the packaged
  # /etc/clickhouse-client/config.xml is rooted at <config>. A
  # hand-written <clickhouse>-rooted client drop-in is parsed, ignored,
  # and reported nowhere. Keep this <config>-rooted, and do not "fix" it
  # to match the server drop-in above.
  ansible.builtin.copy:
    dest: /etc/clickhouse-client/config.d/zz-port.xml
    owner: root
    group: root
    mode: "0644"
    content: |
      <config><port>9300</port></config>
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [clickhouse, log-discipline]

- name: Assert a bare clickhouse-client can actually reach the server
  # Proves the drop-in above took effect rather than trusting that it
  # parsed — the whole defect being fixed was a config that looked right
  # and was silently inert. No --port here ON PURPOSE: this asserts the
  # operator's bare-command path, which is the one that broke.
  # AUTHENTICATION_FAILED here means root's client config and users.d/ops-admin.xml
  # disagree (a killed run); repair with --tags clickhouse-ops-admin-profile.
  ansible.builtin.command:
    cmd: clickhouse-client -q "SELECT 1"
  register: ch_client_probe
  changed_when: false
  failed_when: ch_client_probe.rc != 0 or ch_client_probe.stdout.strip() != "1"
  timeout: 30
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [clickhouse, log-discipline]

- name: ClickHouse merge-memory guard drop-in
  # A merge whose allocation exceeds the KERNEL COMMIT BUDGET
  # (vm.overcommit_memory=2 — see the tuning drop-in above) fails with an
  # allocator ErrnoException (e.g. contract_events_daily's
  # uniqExact(UInt128) state inside AggregatingSortedAlgorithm); the
  # background executor retries in a loop, each attempt starving
  # queries + the live sink until the server is effectively wedged.
  # This soft limit makes an oversized merge ABORT CLEANLY
  # (MEMORY_LIMIT_EXCEEDED) instead of exhausting the commit budget.
  # It does NOT fix that table's merge — that is parked persistently
  # via ALTER TABLE stellar.contract_events_daily MODIFY SETTING
  # max_bytes_to_merge_at_max_space_in_pool = 1 until the MV's
  # uniqExact state is redesigned.
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/zz-merge-memory-guard.xml
    owner: clickhouse
    group: clickhouse
    mode: "0644"
    content: |
      <clickhouse>
          <merges_mutations_memory_usage_soft_limit>10737418240</merges_mutations_memory_usage_soft_limit>
      </clickhouse>
  # No automatic restart — same operator-coordinated policy as above.
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [clickhouse, log-discipline]

- name: ClickHouse default-profile max_query_size raise (users.d drop-in)
  # `supply seed-sac-balances -full-history` needs this:
  # ClassifyTTLLiveness batches 5,000 unhex('<64-hex>') keys per IN-list
  # (~350 KiB of query TEXT), over the 256 KiB default parse cap, which
  # fails with "Max query size exceeded". 4 MiB caps only the query text
  # a client may send (a parse-stage bound), not memory/rows/execution —
  # raising it carries no resource-limit risk. users.d hot-reloads; no
  # restart needed.
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/users.d/zz-max-query-size.xml
    owner: clickhouse
    group: clickhouse
    mode: "0640"
    content: |
      <clickhouse>
          <!-- Managed by ansible (archival-node / 15-log-discipline.yml).
               2026-07-29: ClassifyTTLLiveness batches 5000 unhex() keys per
               IN-list (~350 KiB of query text) — over the 256 KiB default
               parse cap. 4 MiB gives headroom without changing execution
               limits (this caps query TEXT size only, not memory/rows).
               Same day, post-D3: the classifier's aggregation over the
               version-keyed ledger_entries_current OOMed the 10 GiB query
               cap — external group-by/sort spill (4 GiB thresholds) bounds
               it to disk instead of failing, same pattern the D3 rebuild
               script used. -->
          <profiles>
              <default>
                  <max_query_size>4194304</max_query_size>
                  <max_memory_usage>15032385536</max_memory_usage>
                  <max_bytes_before_external_group_by>4294967296</max_bytes_before_external_group_by>
                  <max_bytes_before_external_sort>4294967296</max_bytes_before_external_sort>
              </default>
          </profiles>
      </clickhouse>
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [clickhouse, log-discipline]

- name: ClickHouse system-log TTL drop-in
  # The system.*_log tables (query/trace/part/metric/asynchronous_metric)
  # grow UNBOUNDED by default — the highest-volume ones (trace_log,
  # metric_log, asynchronous_metric_log) add rows every collection tick and
  # were a recurring ~40 GiB of self-inflicted pool bloat with no retention.
  # A <ttl> under each log section makes ClickHouse apply it as the table's
  # native TTL, so old rows age out automatically. event_date exists on all
  # of these. 14 days keeps ample debugging history while bounding growth.
  #
  # Retroactive: on the next (operator-coordinated) CH restart, if an
  # existing system-log table's engine/TTL differs, ClickHouse renames it to
  # <table>_<N> and creates a fresh table with the new TTL; the renamed
  # backlog can be dropped by hand once. Applies going forward regardless.
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/zz-system-log-ttl.xml
    owner: clickhouse
    group: clickhouse
    mode: "0644"
    content: |
      <clickhouse>
          <!-- Managed by ansible (archival-node / 15-log-discipline.yml).
               Bounds system.*_log growth (was ~40 GiB unbounded). TTL is
               read at startup; needs an operator-coordinated CH restart. -->
          <query_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></query_log>
          <query_thread_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></query_thread_log>
          <trace_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></trace_log>
          <part_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></part_log>
          <metric_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></metric_log>
          <asynchronous_metric_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></asynchronous_metric_log>
      </clickhouse>
  # No automatic restart — same operator-coordinated policy as above.
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [clickhouse, log-discipline]

- name: Stop rsyslog duplicating stellarindex unit logs into /var/log/syslog
  # The API's per-request JSON access log alone writes ~2.5 GB/day into
  # /var/log/syslog — a straight DUPLICATE of what journald (capped at
  # 500M above) and Loki already hold. The logrotate maxsize cap above
  # can't help intra-day: Ubuntu's logrotate.timer is daily, so maxsize
  # is only evaluated once per day while the file grows unbounded in
  # between. Filter the stellarindex-* units out of rsyslog entirely —
  # syslog keeps kernel/system lines, the app logs stay queryable via
  # journalctl -u and Loki, and the root FS stops breathing with
  # request volume.
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/30-stellarindex-journald-only.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (archival-node role / 15-log-discipline.yml).
      # stellarindex-* unit output is journald+Loki-only; writing it to
      # /var/log/syslog too would duplicate ~2.5 GB/day onto the root FS.
      if $programname startswith "stellarindex-" then stop
  notify: Reload rsyslog

# ─── Postgres server log: an intra-day size cap ──────────────────────
# Everything above bounds journald (500M), the syslog family,
# ClickHouse's system.*_log tables (14-day TTL) and /var/log/stellarindex;
# this bounds /var/log/postgresql, which is also on the root filesystem.
#
# WHY IT GROWS. `log_min_duration_statement = 1000` logs every
# statement slower than a second, which is the right setting in steady
# state and the wrong one during heavy maintenance — because heavy
# maintenance is precisely what makes ordinary statements slow. A
# restamp campaign can drive the log at ~2.8 GB/day against ~17 MiB/day
# steady state, roughly 170x, enough to trip the root-disk warning on a
# 49 GB root.
#
# WHY A `maxsize` IN /etc/logrotate.d IS NOT ENOUGH — the same trap this
# file documents for syslog. `maxsize` is only evaluated when logrotate
# RUNS, and Ubuntu's logrotate.timer is `OnCalendar=daily`. A daily cap
# cannot bound a file that gains 2.8 GB in a day.
#
# SO THE FIX IS CADENCE PLUS A CAP THE ROLE OWNS. The stock dpkg conffile
# has no `maxsize` at all (weekly, rotate 10, copytruncate, compress +
# delaycompress), so a rebuilt host running it hourly would enforce
# nothing. The hourly unit reads its own config, installed OUTSIDE
# /etc/logrotate.d: overriding the conffile starts a prompt-on-upgrade
# fight, and a second config there matching the same glob makes logrotate
# refuse both with "duplicate log entry".
#
# copytruncate is what makes this safe against a running server: it
# copies then truncates in place, so postgres keeps writing to the same
# inode and needs no reopen, no HUP and no restart (verified live: inode
# unchanged across forced rotations, server still appending after).
- name: Install the size-capped Postgres logrotate policy
  ansible.builtin.copy:
    src: pg-logrotate.conf
    dest: /etc/stellarindex-pg-logrotate.conf
    owner: root
    group: root
    mode: "0644"
  tags: [log-discipline, pg-logrotate]

- name: Install hourly Postgres log rotation units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pg-logrotate.service
    - pg-logrotate.timer
  register: pg_logrotate_units
  tags: [log-discipline, pg-logrotate]

- name: Enable the Postgres log rotation timer
  ansible.builtin.systemd:
    name: pg-logrotate.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    # Role-installed unit — CHECK-MODE UNIT GUARD, tasks/main.yml.
    - not (ansible_check_mode and pg_logrotate_units is changed)
  tags: [log-discipline, pg-logrotate]
