---
# ClickHouse serving-query isolation (ADR-0048 D4) — a dedicated
# settings profile + user for the API's public-serving ClickHouse
# reads (GET /v1/ledgers, /v1/tx, /v1/accounts/* — including ADR-0048
# D5's GET /v1/accounts/{g}/movements, the read that made this a hard
# prerequisite: see ADR-0048's Consequences section), isolated from
# every OTHER ClickHouse connection this repo makes (the indexer's
# real-time dual-sink, the aggregator's own explorer reader,
# stellarindex-ops backfills / ch-rebuild / gates / replays) — which
# authenticate as `ops_batch` / `live_daemon` below when those are
# enabled, and otherwise as CH's unauthenticated `default` user.
#
# NOT applied to r1 by the PR that added this file — codify-only, per
# AGENTS.md's ansible-drift rule ("any config change on r1 lands in
# configs/ansible/ in the same PR" — the CODIFICATION is the same PR;
# the APPLY is a separate, deliberate operator step). Operator apply
# command (run --check --diff FIRST):
#
#   ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
#     --tags clickhouse-serving-profile --check --diff
#   ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
#     --tags clickhouse-serving-profile
#
# Provisioning the CH-side user (this file) does nothing on its own —
# the API only authenticates as it once storage.clickhouse_serving_user
# is also set in stellarindex.toml (internal/config/config.go's
# StorageConfig.ClickHouseServingUser; templated below from
# clickhouse_serving_user, default "api_serving") AND the indexer/api
# services are restarted to pick up the new config + env — a SEPARATE,
# coordinated step (14-stellarindex-services.yml's existing tags),
# deliberately not folded into this task file.

- name: Assert ClickHouse serving-profile password is set (ADR-0048 D4)
  ansible.builtin.assert:
    that:
      - clickhouse_serving_password | default('') | length > 0
    fail_msg: >-
      clickhouse_serving_password is not set. Generate a strong
      password, `ansible-vault edit inventory/r1.secrets.yml` and add
      `vault_clickhouse_serving_password: "<generated>"` (mirrors
      vault_stellarindex_reader_secret_key's pattern — see
      defaults/main.yml's clickhouse_serving_password for the wiring),
      then re-run with --tags clickhouse-serving-profile. Never commit
      the plaintext password. A host that is bringing ClickHouse up
      WITHOUT the serving profile (a DR rebuild that has not minted the
      credential yet) sets clickhouse_serving_profile_enabled: false in
      its inventory instead — the assert is fail-closed on purpose, so
      the API is never pointed at a user that was never provisioned.
  when: clickhouse_serving_profile_enabled | bool
  tags: [clickhouse, clickhouse-serving-profile]

- name: Install the api_serving ClickHouse profile + user (ADR-0048 D4)
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/users.d/api-serving.xml
    owner: clickhouse
    group: clickhouse
    mode: "0640"       # password_sha256_hex is a secret at rest
    content: |
      <clickhouse>
          <!-- Managed by ansible (archival-node /
               20-clickhouse-serving-profile.yml). ADR-0048 D4: an
               isolated settings profile + user for the API's
               public-serving ClickHouse reads, so a burst of public
               API traffic can never queue behind — or get starved
               by — a classic-movements-backfill / ch-rebuild
               derivation job, nor collide with the log-fill /
               merge-memory guards in zz-ratesengine.xml /
               zz-merge-memory-guard.xml (15-log-discipline.yml).

               Settings chosen (research notes, ADR-0048 D4):
                 max_threads / max_memory_usage / max_execution_time —
                 a serving read is a bounded keyset range scan over a
                 sorted-by-address(/ledger) table (ADR-0048 D2's
                 stellar.account_movements ORDER BY, or the explorer
                 lake reads' own bounded LIMITs); if a query needs
                 more than this it is BY DEFINITION not a serving
                 query and should fail fast rather than accumulate
                 threads/memory on a host that also runs backfills and
                 merges. 2 threads / 2 GiB / 10s are conservative
                 relative to what a real page actually costs.
                 max_concurrent_queries_for_user bounds the profile's
                 total footprint even under a traffic spike — N
                 concurrent bounded scans stays well inside the host's
                 72G CH server cap (zz-ratesengine.xml) at these
                 per-query limits.
                 priority=1 is CH's per-query PRIORITY QUEUE knob:
                 lower number = higher priority, 0 = "opted out of
                 prioritization" (CH's default for every OTHER
                 connection this repo makes — none of them set
                 `priority`). A priority=1 serving query is preferred
                 CPU time over any query that hasn't opted in; no
                 corresponding demotion of the backfill/ops path is
                 needed for this to take effect.
                 os_thread_priority=-5 is the setting that actually
                 reaches BACKGROUND MERGES: `priority` only orders
                 CH's query scheduler among QUERY threads — background
                 merges/mutations run in a separate thread pool it
                 does not touch. os_thread_priority sets the Linux
                 `nice` value (-20..19, lower = higher OS scheduling
                 priority) on the query's OWN execution threads via
                 CAP_SYS_NICE (the clickhouse-server package grants
                 this capability at install time, so no extra
                 ansible capability grant is needed here) — -5 gives
                 serving-query threads a real CPU edge over CH's
                 background merge/mutation pool (which runs at the OS
                 default, nice 0) under contention, without going to
                 an extreme (-20) that could starve merges outright
                 and let compaction fall permanently behind.
                 readonly=2 — NOT 1 (C6-015). This user only ever
                 SELECTs, so read-only is right; the question is which
                 read-only. ClickHouse's `readonly` has three values:
                 0 = everything, 1 = read-data queries ONLY and
                 CHANGING SETTINGS IS PROHIBITED, 2 = read data AND
                 change settings (the `readonly` setting itself still
                 cannot be raised, and INSERT/ALTER/DROP/CREATE stay
                 blocked exactly as under 1).
                 Under readonly=1 this profile would have broken every
                 serving endpoint it was built for, on the FIRST
                 REQUEST after ADR-0048's serving flip
                 (stellarindex_clickhouse_serving_enabled). Both
                 constructors the API binary passes these credentials
                 to — clickhouse.NewExplorerReaderAuth and
                 NewSupplyReaderAuth (cmd/stellarindex-api/main.go) —
                 open the connection with
                 `Settings: clickhouse.Settings{"max_execution_time": 30}`,
                 and clickhouse-go merges the connection's Settings
                 into the settings packet of EVERY query it sends
                 (conn.go settings()), flagged Important. Under
                 readonly=1 the server answers that with
                 `Cannot modify 'max_execution_time' setting in
                 readonly mode. (READONLY)`. The native-protocol Ping
                 carries no settings, so the API would have started
                 clean and healthy and then 500'd every explorer /
                 supply read — the worst shape of this failure.
                 Several serving reads also carry their own SQL-text
                 `SETTINGS ...` clause (ADR-0048 D2's
                 stellar.account_movements path), which readonly=1
                 rejects identically.
                 Consequence to be honest about: under readonly=2 the
                 four numbers above are DEFAULTS a per-query SETTINGS
                 may raise, not hard ceilings — and the serving reads
                 do raise them (max_threads 4, max_memory_usage 8 GB,
                 max_execution_time 30). Hard ceilings would need a
                 <constraints><max> block, which IS enforced regardless
                 of readonly; it is deliberately NOT added blind here,
                 because a ceiling set below any real serving query's
                 request turns "bounded" back into "broken", which is
                 the exact failure this value fixes. Derive the maxima
                 from the live per-query settings first.
                 What survives unchanged as defense in depth: no
                 INSERT/ALTER/DROP/CREATE from a leaked credential,
                 allow_databases below pinning it to `stellar`,
                 access_management=0, and the loopback-only network
                 ACL. max_concurrent_queries_for_user still bounds the
                 profile's aggregate footprint for every query that
                 does not override it (no reader in this repo does).

               Password: SHA-256 hex digest of
               clickhouse_serving_password (ansible-vault —
               vault_clickhouse_serving_password in
               inventory/r1.secrets.yml). The plaintext never touches
               disk outside the vault; ansible's `hash` filter
               computes the digest at render time, so it's the ONLY
               secret material this file embeds. -->
          <profiles>
              <api_serving>
                  <max_threads>{{ clickhouse_serving_max_threads }}</max_threads>
                  <max_memory_usage>{{ clickhouse_serving_max_memory_usage_bytes }}</max_memory_usage>
                  <max_execution_time>{{ clickhouse_serving_max_execution_time_s }}</max_execution_time>
                  <max_concurrent_queries_for_user>{{ clickhouse_serving_max_concurrent_queries }}</max_concurrent_queries_for_user>
                  <priority>1</priority>
                  <os_thread_priority>-5</os_thread_priority>
                  <readonly>2</readonly>
              </api_serving>
          </profiles>
          <users>
              <{{ clickhouse_serving_user }}>
                  <password_sha256_hex>{{ clickhouse_serving_password | hash('sha256') }}</password_sha256_hex>
                  <networks>
                      <ip>127.0.0.1</ip>
                      <ip>::1</ip>
                  </networks>
                  <profile>api_serving</profile>
                  <quota>default</quota>
                  <access_management>0</access_management>
                  <!-- Legacy XML access control (this deployment isn't
                       SQL-driven-access-control): restricts this user
                       to the `stellar` database (the Tier-1 lake +
                       ADR-0048 D2's account_movements serving table)
                       — it has no business touching `system` writes
                       or any other database on this host. -->
                  <allow_databases>
                      <database>stellar</database>
                  </allow_databases>
              </{{ clickhouse_serving_user }}>
          </users>
      </clickhouse>
  when: clickhouse_serving_profile_enabled | bool
  no_log: true   # content embeds the password's SHA-256 digest
  # Deliberately NO `notify: Restart clickhouse-server` (2026-08-29): a
  # users.d drop-in (profiles / users / quotas) is HOT-RELOADED by
  # clickhouse-server's users-config reloader, so a restart is never
  # what applies it — it would only bounce the lake (minutes of
  # explorer/lake downtime + cold caches on r1's 9.3 TB) for nothing.
  # The reload + verify tasks below apply it and PROVE it on the host
  # instead (21-clickhouse-drop-guard.yml's pattern). The one CH change
  # in this role that genuinely needs the restart — tcp_port /
  # listen_host in 08-clickhouse.yml's config.d/si-override.xml — keeps
  # its own notify.
  tags: [clickhouse, clickhouse-serving-profile]

- name: Reload ClickHouse config so the api_serving drop-in is live (no restart)
  # `SYSTEM RELOAD CONFIG` is idempotent and makes the users.d pick-up
  # immediate rather than waiting on the reloader's poll. Skipped under
  # --check (command modules do not run there).
  when:
    - clickhouse_serving_profile_enabled | bool
    - not ansible_check_mode
  ansible.builtin.command: >-
    clickhouse-client --port {{ clickhouse_tcp_port | default(9300) }}
    -q "SYSTEM RELOAD CONFIG"
  changed_when: false
  tags: [clickhouse, clickhouse-serving-profile]

- name: Verify the api_serving profile + user are live in ClickHouse
  # system.users / system.settings_profiles are the LIVE access
  # entities after the reload — a drop-in the server rejected (malformed
  # XML keeps the PREVIOUS users config, it does not crash the server)
  # shows up here as 0. Retried because the reloader polls (default
  # 2 s). Skipped under --check for the same reason as above.
  when:
    - clickhouse_serving_profile_enabled | bool
    - not ansible_check_mode
  ansible.builtin.command: >-
    clickhouse-client --port {{ clickhouse_tcp_port | default(9300) }}
    -q "SELECT
    (SELECT count() FROM system.users WHERE name = '{{ clickhouse_serving_user }}'),
    (SELECT count() FROM system.settings_profiles WHERE name = 'api_serving')
    FORMAT CSV"
  register: ch_serving_profile_live
  changed_when: false
  retries: 10
  delay: 2
  # users,profiles — exactly one of each.
  until: ch_serving_profile_live.stdout == '1,1'
  tags: [clickhouse, clickhouse-serving-profile]

# ───── ops_batch: the LOW-priority counterpart (2026-08-28 r1) ─────────
#
# WHY: a runbook-prescribed `stellarindex-ops ch-rebuild -sep41` dry-run
# over 2M ledgers (run under run-heavy-job.sh: CPUWeight=50, IOWeight=50,
# MemoryMax=20G) drove r1's load to 12.9 and starved the AGGREGATOR's
# supply refresher — stellarindex_aggregator_supply_refresh_error_dominant
# fired for all 39 watched contracts within 3 minutes; killing the job
# cleared it. The cgroup caps bound the ops PROCESS; the contention was
# INSIDE clickhouse-server, where the ops job's heavy-FINAL scans and the
# aggregator's supply reads both ran as CH's unauthenticated `default`
# user — the same identity, so CH's query scheduler had nothing to yield
# with. api_serving above protects the API; nothing protected the
# aggregator/indexer side from a batch job. This profile is that
# protection: a dedicated user every stellarindex-ops CH connection
# authenticates as (internal/storage/clickhouse/ops_auth.go reads
# STELLARINDEX_CLICKHOUSE_OPS_USER/_PASSWORD from
# /etc/default/stellarindex-ops, templated by 09-minio.yml).
#
# Same discipline as api_serving: vault-sourced password (assert below),
# SHA-256 digest only in the drop-in, loopback-only, pinned to `stellar`,
# codify-only in the PR that adds it. Gated OFF by default
# (clickhouse_ops_batch_profile_enabled: false in defaults/main.yml):
# the assert below fires only on an explicit enable, so the weekly
# ansible-drift.yml --check against r1 stays green until the operator
# flips the flag in an inventory together with that inventory's
# vault_clickhouse_ops_batch_password. Activation, per host:
#   ansible-vault edit inventory/r1.secrets.yml   # add the password
#   (set clickhouse_ops_batch_profile_enabled: true in inventory/r1.yml)
#   ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
#     --tags clickhouse-ops-batch-profile,minio,heavy-job-wrapper --check --diff
# (all three tags: the CH user AND the env file must move together, or
# the next ops job authenticates with a credential CH does not know;
# heavy-job-wrapper re-renders /usr/local/sbin/run-heavy-job.sh, which
# imports the pair from /etc/default/stellarindex-ops into every wrapped
# job itself — 14-stellarindex-services.yml — so how the runbooks launch
# jobs does not change; a wrapper rendered before 2026-08-28 does not
# import it, hence the tag).

- name: Assert ClickHouse ops-batch profile password is set (2026-08-28 r1)
  ansible.builtin.assert:
    that:
      - clickhouse_ops_batch_password | default('') | length > 0
    fail_msg: >-
      clickhouse_ops_batch_password is not set. Generate a strong
      password, `ansible-vault edit inventory/r1.secrets.yml` and add
      `vault_clickhouse_ops_batch_password: "<generated>"` (mirrors
      vault_clickhouse_serving_password — see defaults/main.yml's
      clickhouse_ops_batch_password for the wiring), then re-run with
      --tags clickhouse-ops-batch-profile,minio,heavy-job-wrapper. Never commit the
      plaintext password.
  when: clickhouse_ops_batch_profile_enabled | bool
  tags: [clickhouse, clickhouse-ops-batch-profile]

- name: Install the ops_batch ClickHouse profile + user (2026-08-28 r1)
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/users.d/ops-batch.xml
    owner: clickhouse
    group: clickhouse
    mode: "0640"       # password_sha256_hex is a secret at rest
    content: |
      <clickhouse>
          <!-- Managed by ansible (archival-node /
               20-clickhouse-serving-profile.yml). The LOW-priority
               identity for stellarindex-ops batch jobs (ch-rebuild,
               ch-backfill, classic-movements-backfill, verify/gate
               reads, replays), so a heavy derivation scan can never
               starve the aggregator's / indexer's / API's reads of
               CPU inside clickhouse-server (2026-08-28 r1: ch-rebuild
               -sep41 as `default` → supply_refresh_error_dominant for
               all 39 watched contracts in 3 minutes).

               Settings:
                 priority = {{ clickhouse_ops_batch_priority }} — CH's per-query priority
                 queue: LOWER number = HIGHER priority, 0 = not
                 participating. api_serving is 1; every un-opted-in
                 connection (indexer sink, aggregator readers) is 0
                 and therefore still preferred over this profile when
                 CPU is contended. Pinned <readonly/> in <constraints>
                 so no per-query SETTINGS clause can promote itself.
                 os_thread_priority = {{ clickhouse_ops_batch_os_thread_priority }} — Linux nice for the
                 query's OWN execution threads (api_serving is -5,
                 background merges run at 0): positive so a batch scan
                 also yields to merges instead of letting compaction
                 fall behind, which was the other way the 2026-08-28
                 job hurt the serving side.
                 max_threads / max_memory_usage /
                 max_concurrent_queries_for_user are DEFAULTS, not
                 ceilings (readonly=0 below): the ops openers set
                 their own per-query class limits (gate.go's
                 heavy-FINAL class runs max_threads 3 / 10 GiB with
                 external sort spill; the writers set
                 max_execution_time only) and those must keep winning
                 — a <constraints><max> set below a real job's request
                 turns "bounded" into "broken" mid-backfill. What the
                 defaults DO bound is every ops read that sets nothing
                 (the bulk of the verify/gate/census helpers).
                 No max_execution_time: a FINAL stream over a
                 full-history window legitimately runs for hours; the
                 openers that want a ceiling set one themselves.
                 readonly = 0 — ops jobs WRITE (Sink, participant /
                 account-movements / entry-change inserts), unlike
                 api_serving's readonly=2.

               Password: SHA-256 hex digest of
               clickhouse_ops_batch_password (ansible-vault —
               vault_clickhouse_ops_batch_password). The plaintext is
               templated ONLY into /etc/default/stellarindex-ops
               (09-minio.yml, 0640 root:stellarindex) — the env file
               the stellarindex-{indexer,aggregator,api} services do
               NOT source, which is what keeps this demotion scoped
               to batch jobs. -->
          <profiles>
              <ops_batch>
                  <max_threads>{{ clickhouse_ops_batch_max_threads }}</max_threads>
                  <max_memory_usage>{{ clickhouse_ops_batch_max_memory_usage_bytes }}</max_memory_usage>
                  <max_concurrent_queries_for_user>{{ clickhouse_ops_batch_max_concurrent_queries }}</max_concurrent_queries_for_user>
                  <priority>{{ clickhouse_ops_batch_priority }}</priority>
                  <os_thread_priority>{{ clickhouse_ops_batch_os_thread_priority }}</os_thread_priority>
                  <readonly>0</readonly>
                  <constraints>
                      <priority>
                          <readonly/>
                      </priority>
                      <os_thread_priority>
                          <readonly/>
                      </os_thread_priority>
                  </constraints>
              </ops_batch>
          </profiles>
          <users>
              <{{ clickhouse_ops_batch_user }}>
                  <password_sha256_hex>{{ clickhouse_ops_batch_password | hash('sha256') }}</password_sha256_hex>
                  <networks>
                      <ip>127.0.0.1</ip>
                      <ip>::1</ip>
                  </networks>
                  <profile>ops_batch</profile>
                  <quota>default</quota>
                  <access_management>0</access_management>
                  <!-- The ops jobs derive/verify Tier-1 lake tables in
                       `stellar` and read `system` (parts, tables,
                       query_log, processes) for census and gates. CH
                       rejects a narrower <grants> beside any other
                       access setting on an XML user. -->
                  <allow_databases>
                      <database>stellar</database>
                      <database>system</database>
                  </allow_databases>
              </{{ clickhouse_ops_batch_user }}>
          </users>
      </clickhouse>
  when: clickhouse_ops_batch_profile_enabled | bool
  no_log: true   # content embeds the password's SHA-256 digest
  # Deliberately NO `notify: Restart clickhouse-server` (2026-08-29,
  # caught in the r1 --check --diff for the FIRST enable): this is a
  # users.d drop-in, hot-reloaded by clickhouse-server — the notify
  # would have restarted the 9.3 TB lake (minutes of explorer/lake
  # downtime + cold caches) for a change a config reload applies. The
  # first enable must not bounce the lake; the reload + verify tasks
  # below apply and prove it instead (same pattern as api_serving above
  # and 21-clickhouse-drop-guard.yml).
  tags: [clickhouse, clickhouse-ops-batch-profile]

- name: Reload ClickHouse config so the ops_batch drop-in is live (no restart)
  # Idempotent; skipped under --check (command modules do not run there).
  when:
    - clickhouse_ops_batch_profile_enabled | bool
    - not ansible_check_mode
  ansible.builtin.command: >-
    clickhouse-client --port {{ clickhouse_tcp_port | default(9300) }}
    -q "SYSTEM RELOAD CONFIG"
  changed_when: false
  tags: [clickhouse, clickhouse-ops-batch-profile]

- name: Verify the ops_batch profile + user are live in ClickHouse
  # LIVE access entities after the reload; a rejected drop-in (the
  # server keeps the previous users config) reads as 0 here and fails
  # the apply. Retried because the reloader polls (default 2 s).
  when:
    - clickhouse_ops_batch_profile_enabled | bool
    - not ansible_check_mode
  ansible.builtin.command: >-
    clickhouse-client --port {{ clickhouse_tcp_port | default(9300) }}
    -q "SELECT
    (SELECT count() FROM system.users WHERE name = '{{ clickhouse_ops_batch_user }}'),
    (SELECT count() FROM system.settings_profiles WHERE name = 'ops_batch')
    FORMAT CSV"
  register: ch_ops_batch_profile_live
  changed_when: false
  retries: 10
  delay: 2
  # users,profiles — exactly one of each.
  until: ch_ops_batch_profile_live.stdout == '1,1'
  tags: [clickhouse, clickhouse-ops-batch-profile]

# ───── live_daemon: a named identity for the live daemons ──────────────
#
# The indexer dual-sink, the aggregator's readers and rollups, and the
# API/indexer readers with no serving user reach CH as its unauthenticated
# `default` user. This user gives them a password-backed identity so
# `default` can be restricted later without cutting them off. It uses the
# stock `default` settings profile, so priority and limits are exactly
# what those connections run with today. Gated OFF by default
# (clickhouse_live_daemon_profile_enabled, defaults/main.yml). Activation,
# per host: add vault_clickhouse_live_daemon_password to the inventory's
# secrets, set the flag, then
#   ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
#     --tags clickhouse-live-daemon-profile,stellarindex --check --diff
# (both tags: the CH user AND /etc/default/stellarindex must move together;
# the env template only renders the pair once both flag and password are
# set, and its notify restarts the daemons onto it).

- name: Assert ClickHouse live-daemon password is set
  ansible.builtin.assert:
    that:
      - clickhouse_live_daemon_password | default('') | length > 0
    fail_msg: >-
      clickhouse_live_daemon_password is not set. Generate a strong
      password (`openssl rand -hex 32`), `ansible-vault edit
      inventory/<region>.secrets.yml` and add
      `vault_clickhouse_live_daemon_password: "<generated>"`, then re-run
      with --tags clickhouse-live-daemon-profile,stellarindex. Never commit
      the plaintext password.
  when: clickhouse_live_daemon_profile_enabled | bool
  tags: [clickhouse, clickhouse-live-daemon-profile]

- name: Install the live_daemon ClickHouse user
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/users.d/live-daemon.xml
    owner: clickhouse
    group: clickhouse
    mode: "0640"       # password_sha256_hex is a secret at rest
    content: |
      <clickhouse>
          <!-- Managed by ansible (archival-node /
               20-clickhouse-serving-profile.yml). The identity for the
               stellarindex-{indexer,aggregator,api} ClickHouse
               connections that carry no serving user.

               Profile `default`: the settings those connections already
               run with as CH's `default` user, so switching identity
               changes no priority or limit.
               Access is database-scoped, not table-scoped: the live sink
               runs CREATE TABLE IF NOT EXISTS, the aggregator's rollups
               TRUNCATE and EXCHANGE TABLES, and the schema checks read
               system.tables. CH rejects a narrower <grants> beside any
               other access setting on an XML user.

               Password: SHA-256 hex digest of
               clickhouse_live_daemon_password (ansible-vault —
               vault_clickhouse_live_daemon_password). The plaintext is
               templated ONLY into /etc/default/stellarindex
               (stellarindex.env.j2, 0640 root:stellarindex). -->
          <users>
              <{{ clickhouse_live_daemon_user }}>
                  <password_sha256_hex>{{ clickhouse_live_daemon_password | hash('sha256') }}</password_sha256_hex>
                  <networks>
                      <ip>127.0.0.1</ip>
                      <ip>::1</ip>
                  </networks>
                  <profile>default</profile>
                  <quota>default</quota>
                  <access_management>0</access_management>
                  <allow_databases>
                      <database>stellar</database>
                      <database>system</database>
                  </allow_databases>
              </{{ clickhouse_live_daemon_user }}>
          </users>
      </clickhouse>
  when: clickhouse_live_daemon_profile_enabled | bool
  no_log: true   # content embeds the password's SHA-256 digest
  # No restart notify: users.d is hot-reloaded; the tasks below apply and
  # verify it (same as api_serving / ops_batch above).
  tags: [clickhouse, clickhouse-live-daemon-profile]

- name: Reload ClickHouse config so the live_daemon drop-in is live (no restart)
  when:
    - clickhouse_live_daemon_profile_enabled | bool
    - not ansible_check_mode
  ansible.builtin.command: >-
    clickhouse-client --port {{ clickhouse_tcp_port | default(9300) }}
    -q "SYSTEM RELOAD CONFIG"
  changed_when: false
  tags: [clickhouse, clickhouse-live-daemon-profile]

- name: Verify the live_daemon user is live in ClickHouse
  # A rejected drop-in keeps the previous users config and reads as 0.
  when:
    - clickhouse_live_daemon_profile_enabled | bool
    - not ansible_check_mode
  ansible.builtin.command: >-
    clickhouse-client --port {{ clickhouse_tcp_port | default(9300) }}
    -q "SELECT count() FROM system.users WHERE name = '{{ clickhouse_live_daemon_user }}' FORMAT CSV"
  register: ch_live_daemon_user_live
  changed_when: false
  retries: 10
  delay: 2
  until: ch_live_daemon_user_live.stdout == '1'
  tags: [clickhouse, clickhouse-live-daemon-profile]

# ───── ops_monitor / ops_admin: the last callers of `default` ───────────
#
# INV-0802 step 2. `default` takes no password, so every local uid gets a
# passwordless superuser over loopback. These two users give its remaining
# callers a password-backed identity so `default` can be locked later:
#   ops_monitor — read-only probes (config-assertions, data-freshness,
#     ch-schema-drift, restore-drill). Stock `default` profile plus
#     readonly=2, so a probe keeps normal priority: on ops_batch's
#     priority 100 a heavy job would time freshness probes out into alerts.
#   ops_admin — root shells and this role's own clickhouse-client tasks,
#     through /root/.clickhouse-client/config.xml. The same envelope as
#     `default` today minus access management.
# Each flag also renders that user's client credential files: ops_monitor's
# root:stellarindex 0640 (data-freshness runs as stellarindex), root's
# ops_admin config root 0600. Client files carry <port> because a -C file or
# ~/.clickhouse-client/config.xml REPLACES /etc/clickhouse-client/config.xml,
# so config.d/zz-port.xml is not merged and a portless file hangs on
# MinIO's :9000 (15-log-discipline.yml). Every task that renders a
# credential is no_log + diff: false; review these with --check only,
# never --diff.
#
# A view created by ops_admin with an explicit `SQL SECURITY DEFINER` runs
# as ops_admin; before dropping the user, check system.tables for `DEFINER = ops_admin`.
#
# Gated OFF by default (defaults/main.yml). Activation, per host: add
# vault_clickhouse_ops_{monitor,admin}_password (alphanumeric) to the
# inventory's secrets, set the flags, then
#   ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
#     --tags clickhouse-ops-monitor-profile,clickhouse-ops-admin-profile --check
# This moves no script. Its one behaviour change is root's bare
# clickhouse-client, which becomes ops_admin (including root-run scripts
# such as ch-live-catchup.sh: a client config with <user> makes the client
# ignore CLICKHOUSE_USER/CLICKHOUSE_PASSWORD).

- name: Assert ClickHouse ops_monitor password is set and netrc-safe
  ansible.builtin.assert:
    that:
      - clickhouse_ops_monitor_password | default('') is match('^[A-Za-z0-9]{16,}$')
    fail_msg: >-
      clickhouse_ops_monitor_password must be at least 16 alphanumeric
      characters (netrc splits on whitespace; the client XML is not
      escaped). Generate one with `openssl rand -hex 32`, add it to
      inventory/<region>.secrets.yml as
      `vault_clickhouse_ops_monitor_password: "<generated>"`, then re-run
      with --tags clickhouse-ops-monitor-profile. Never commit the
      plaintext password.
    quiet: true
  when: clickhouse_ops_monitor_profile_enabled | bool
  tags: [clickhouse, clickhouse-ops-monitor-profile]

- name: Install the ops_monitor ClickHouse profile + user
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/users.d/ops-monitor.xml
    owner: clickhouse
    group: clickhouse
    mode: "0640"       # password_sha256_hex is a secret at rest
    content: |
      <clickhouse>
          <!-- Managed by ansible (archival-node /
               20-clickhouse-serving-profile.yml). Read-only identity for
               the ops probes. Inherits the `default` profile, so priority
               and limits match what the probes run with today; readonly=2
               still lets a probe set per-query SETTINGS.
               Explicit SELECT grants rather than allow_databases, which
               would grant ALL on both databases plus KILL QUERY/SYSTEM.
               Password: SHA-256 hex digest of clickhouse_ops_monitor_password
               (ansible-vault — vault_clickhouse_ops_monitor_password). The
               plaintext is rendered only into the root:stellarindex 0640
               /etc/clickhouse-client/ops-monitor.{xml,netrc}. -->
          <profiles>
              <ops_monitor>
                  <profile>default</profile>
                  <readonly>2</readonly>
              </ops_monitor>
          </profiles>
          <users>
              <{{ clickhouse_ops_monitor_user }}>
                  <password_sha256_hex>{{ clickhouse_ops_monitor_password | hash('sha256') }}</password_sha256_hex>
                  <networks>
                      <ip>127.0.0.1</ip>
                      <ip>::1</ip>
                  </networks>
                  <profile>ops_monitor</profile>
                  <quota>default</quota>
                  <access_management>0</access_management>
                  <grants>
                      <query>GRANT SELECT ON stellar.*</query>
                      <query>GRANT SELECT ON system.*</query>
                  </grants>
              </{{ clickhouse_ops_monitor_user }}>
          </users>
      </clickhouse>
  when: clickhouse_ops_monitor_profile_enabled | bool
  no_log: true   # content embeds the password's SHA-256 digest
  diff: false
  # No restart notify: users.d is hot-reloaded; the tasks below apply and
  # verify it (same as api_serving / ops_batch above).
  tags: [clickhouse, clickhouse-ops-monitor-profile]

- name: Reload ClickHouse config so the ops_monitor drop-in is live (no restart)
  when:
    - clickhouse_ops_monitor_profile_enabled | bool
    - not ansible_check_mode
  ansible.builtin.command: >-
    clickhouse-client --port {{ clickhouse_tcp_port | default(9300) }}
    -q "SYSTEM RELOAD CONFIG"
  changed_when: false
  tags: [clickhouse, clickhouse-ops-monitor-profile]

- name: Verify the ops_monitor profile + user are live in ClickHouse
  # A rejected drop-in keeps the previous users config and reads as 0.
  when:
    - clickhouse_ops_monitor_profile_enabled | bool
    - not ansible_check_mode
  ansible.builtin.command: >-
    clickhouse-client --port {{ clickhouse_tcp_port | default(9300) }}
    -q "SELECT
    (SELECT count() FROM system.users WHERE name = '{{ clickhouse_ops_monitor_user }}'),
    (SELECT count() FROM system.settings_profiles WHERE name = 'ops_monitor')
    FORMAT CSV"
  register: ch_ops_monitor_profile_live
  changed_when: false
  retries: 10
  delay: 2
  until: ch_ops_monitor_profile_live.stdout == '1,1'
  tags: [clickhouse, clickhouse-ops-monitor-profile]

- name: Render the ops_monitor client credential files (root:stellarindex 0640)
  # ops-monitor.xml is the native client's -C file; ops-monitor.netrc is
  # curl's --netrc-file for HTTP :8123, with both hosts because the
  # scripts use both and netrc matches the host name exactly. Neither
  # puts the password on argv. Group-readable because data-freshness runs
  # as User=stellarindex; same exposure as /etc/default/stellarindex-ops.
  # Only the verify task below reads them, so a rotation that aborts
  # before this task leaves nothing broken that the next run won't fix.
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    owner: root
    group: stellarindex
    mode: "0640"
    content: "{{ item.content }}"
  loop:
    - dest: /etc/clickhouse-client/ops-monitor.xml
      content: |
        <config>
            <!-- Managed by ansible (archival-node / 20-clickhouse-serving-profile.yml). -->
            <port>{{ clickhouse_tcp_port | default(9300) }}</port>
            <user>{{ clickhouse_ops_monitor_user }}</user>
            <password>{{ clickhouse_ops_monitor_password }}</password>
        </config>
    - dest: /etc/clickhouse-client/ops-monitor.netrc
      content: |
        machine 127.0.0.1 login {{ clickhouse_ops_monitor_user }} password {{ clickhouse_ops_monitor_password }}
        machine localhost login {{ clickhouse_ops_monitor_user }} password {{ clickhouse_ops_monitor_password }}
  loop_control:
    label: "{{ item.dest }}"
  when: clickhouse_ops_monitor_profile_enabled | bool
  no_log: true
  diff: false
  tags: [clickhouse, clickhouse-ops-monitor-profile]

- name: Verify the ops_monitor client files authenticate as ops_monitor
  # End to end: the native file carries the port (timeout turns a MinIO
  # hang into a failure) and both netrc hosts carry the password.
  when:
    - clickhouse_ops_monitor_profile_enabled | bool
    - not ansible_check_mode
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [timeout, "10", clickhouse-client, -C, /etc/clickhouse-client/ops-monitor.xml, -q, "SELECT currentUser()"]
    - [curl, -sS, --max-time, "10", --netrc-file, /etc/clickhouse-client/ops-monitor.netrc,
       "http://127.0.0.1:8123/", --data-binary, "SELECT currentUser()"]
    - [curl, -sS, --max-time, "10", --netrc-file, /etc/clickhouse-client/ops-monitor.netrc,
       "http://localhost:8123/", --data-binary, "SELECT currentUser()"]
  loop_control:
    label: "{{ item[0] }} {{ item[-3] }}"
  register: ch_ops_monitor_client_probe
  changed_when: false
  retries: 5
  delay: 2
  until: (ch_ops_monitor_client_probe.stdout | trim) == clickhouse_ops_monitor_user
  tags: [clickhouse, clickhouse-ops-monitor-profile]

- name: Assert ClickHouse ops_admin password is set and XML-safe
  ansible.builtin.assert:
    that:
      - clickhouse_ops_admin_password | default('') is match('^[A-Za-z0-9]{16,}$')
    fail_msg: >-
      clickhouse_ops_admin_password must be at least 16 alphanumeric
      characters (the client XML is not escaped). Generate one with
      `openssl rand -hex 32`, add it to inventory/<region>.secrets.yml as
      `vault_clickhouse_ops_admin_password: "<generated>"`, then re-run
      with --tags clickhouse-ops-admin-profile. Never commit the
      plaintext password.
    quiet: true
  when: clickhouse_ops_admin_profile_enabled | bool
  tags: [clickhouse, clickhouse-ops-admin-profile]

- name: Install ops_admin and root's client config together, rolled back on failure
  # users.d hot-reloads within seconds and every later bare clickhouse-client
  # (this play and 08/15 on the next run) authenticates with root's config,
  # so a password rotation must change both before any client call. If the
  # verify fails, both files go back to their previous content. A run killed
  # between the two writes can still leave them apart: 08's schema apply and
  # 15's bare-client assert then fail, and the repair is
  # `--tags clickhouse-ops-admin-profile`, which runs only this section.
  when: clickhouse_ops_admin_profile_enabled | bool
  tags: [clickhouse, clickhouse-ops-admin-profile]
  block:
    - name: Create root's ClickHouse client config directory
      ansible.builtin.file:
        path: /root/.clickhouse-client
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install the ops_admin ClickHouse user
      ansible.builtin.copy:
        dest: /etc/clickhouse-server/users.d/ops-admin.xml
        owner: clickhouse
        group: clickhouse
        mode: "0640"       # password_sha256_hex is a secret at rest
        backup: true       # backups end in `~`, which users.d ignores
        content: |
          <clickhouse>
              <!-- Managed by ansible (archival-node /
                   20-clickhouse-serving-profile.yml). The identity for root
                   shells and ansible's clickhouse-client tasks (schema apply,
                   drop guard, these profile reloads). Same envelope as the
                   `default` user it replaces: `default` profile, every
                   database, loopback only; no access management.
                   Password: SHA-256 hex digest of clickhouse_ops_admin_password
                   (ansible-vault — vault_clickhouse_ops_admin_password). The
                   plaintext is rendered only into the root-only
                   /root/.clickhouse-client/config.xml. -->
              <users>
                  <{{ clickhouse_ops_admin_user }}>
                      <password_sha256_hex>{{ clickhouse_ops_admin_password | hash('sha256') }}</password_sha256_hex>
                      <networks>
                          <ip>127.0.0.1</ip>
                          <ip>::1</ip>
                      </networks>
                      <profile>default</profile>
                      <quota>default</quota>
                      <access_management>0</access_management>
                  </{{ clickhouse_ops_admin_user }}>
              </users>
          </clickhouse>
      register: ch_ops_admin_users_d
      no_log: true   # content embeds the password's SHA-256 digest
      diff: false

    - name: Render root's ClickHouse client config (ops_admin, root-only)
      # The client reads ~/.clickhouse-client/config.xml before
      # /etc/clickhouse-client/config.xml, so root's bare clickhouse-client
      # (interactive shells, ansible over ssh as root, root-run scripts)
      # authenticates as ops_admin with no secret on argv.
      ansible.builtin.copy:
        dest: /root/.clickhouse-client/config.xml
        owner: root
        group: root
        mode: "0600"
        backup: true
        content: |
          <config>
              <!-- Managed by ansible (archival-node / 20-clickhouse-serving-profile.yml). -->
              <port>{{ clickhouse_tcp_port | default(9300) }}</port>
              <user>{{ clickhouse_ops_admin_user }}</user>
              <password>{{ clickhouse_ops_admin_password }}</password>
          </config>
      register: ch_ops_admin_root_client
      no_log: true
      diff: false

    - name: Verify root's bare clickhouse-client authenticates as ops_admin
      # No SYSTEM RELOAD CONFIG: it would authenticate with the new password,
      # so it cannot succeed before the server's own users.d reload anyway.
      # No --port on purpose: this is the operator's bare-command path, and
      # the timeout turns a portless config's MinIO hang into a failure. A
      # rejected drop-in also fails here, and the rescue restores both files.
      when: not ansible_check_mode
      ansible.builtin.command:
        argv: [timeout, "10", clickhouse-client, -q, "SELECT currentUser()"]
      register: ch_ops_admin_client_probe
      changed_when: false
      retries: 10
      delay: 2
      until: (ch_ops_admin_client_probe.stdout | trim) == clickhouse_ops_admin_user

  rescue:
    - name: Restore the previous ops_admin drop-in and root client config
      ansible.builtin.copy:
        src: "{{ item.r.backup_file }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop: &ch_ops_admin_files
        - {dest: /etc/clickhouse-server/users.d/ops-admin.xml, owner: clickhouse, group: clickhouse, mode: "0640",
           r: "{{ ch_ops_admin_users_d | default({}) }}"}
        - {dest: /root/.clickhouse-client/config.xml, owner: root, group: root, mode: "0600",
           r: "{{ ch_ops_admin_root_client | default({}) }}"}
      loop_control:
        label: "{{ item.dest }}"
      when: item.r.backup_file is defined
      no_log: true
      diff: false

    - name: Remove an ops_admin file this run created
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: absent
      loop: *ch_ops_admin_files
      loop_control:
        label: "{{ item.dest }}"
      when:
        - item.r.changed | default(false)
        - item.r.backup_file is not defined
      no_log: true
      diff: false

    - name: Fail after restoring the previous ops_admin credentials
      ansible.builtin.fail:
        msg: >-
          ops_admin did not verify, so users.d/ops-admin.xml and
          /root/.clickhouse-client/config.xml were restored to their previous
          content (or removed if this run created them). Check
          clickhouse-server.err.log for a rejected users config, then re-run
          with --tags clickhouse-ops-admin-profile.

  always:
    - name: Delete the ops_admin backups (they hold the previous credential)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ [ch_ops_admin_users_d | default({}), ch_ops_admin_root_client | default({})]
           | selectattr('backup_file', 'defined') | map(attribute='backup_file') | list }}
      no_log: true
      diff: false
