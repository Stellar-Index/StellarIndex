---
# ClickHouse serving-query isolation (ADR-0048 D4) — a dedicated
# settings profile + user for the API's public-serving ClickHouse
# reads (GET /v1/ledgers, /v1/tx, /v1/accounts/* — including ADR-0048
# D5's GET /v1/accounts/{g}/movements, the read that made this a hard
# prerequisite: see ADR-0048's Consequences section), isolated from
# every OTHER ClickHouse connection this repo makes (the indexer's
# real-time dual-sink, the aggregator's own explorer reader,
# stellarindex-ops backfills / ch-rebuild / gates / replays) — all of
# which keep authenticating as CH's unauthenticated `default` user,
# unbounded, unchanged by this task.
#
# NOT applied to r1 by the PR that added this file — codify-only, per
# CLAUDE.md's ansible-drift rule ("any config change on r1 lands in
# configs/ansible/ in the same PR" — the CODIFICATION is the same PR;
# the APPLY is a separate, deliberate operator step). Operator apply
# command (run --check --diff FIRST):
#
#   ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
#     --tags clickhouse-serving-profile --check --diff
#   ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
#     --tags clickhouse-serving-profile
#
# Provisioning the CH-side user (this file) does nothing on its own —
# the API only authenticates as it once storage.clickhouse_serving_user
# is also set in stellarindex.toml (internal/config/config.go's
# StorageConfig.ClickHouseServingUser; templated below from
# clickhouse_serving_user, default "api_serving") AND the indexer/api
# services are restarted to pick up the new config + env — a SEPARATE,
# coordinated step (14-stellarindex-services.yml's existing tags),
# deliberately not folded into this task file.

- name: Assert ClickHouse serving-profile password is set (ADR-0048 D4)
  ansible.builtin.assert:
    that:
      - clickhouse_serving_password | default('') | length > 0
    fail_msg: >-
      clickhouse_serving_password is not set. Generate a strong
      password, `ansible-vault edit inventory/r1.secrets.yml` and add
      `vault_clickhouse_serving_password: "<generated>"` (mirrors
      vault_stellarindex_reader_secret_key's pattern — see
      defaults/main.yml's clickhouse_serving_password for the wiring),
      then re-run with --tags clickhouse-serving-profile. Never commit
      the plaintext password.
  when: clickhouse_serving_profile_enabled | bool
  tags: [clickhouse, clickhouse-serving-profile]

- name: Install the api_serving ClickHouse profile + user (ADR-0048 D4)
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/users.d/api-serving.xml
    owner: clickhouse
    group: clickhouse
    mode: "0640"       # password_sha256_hex is a secret at rest
    content: |
      <clickhouse>
          <!-- Managed by ansible (archival-node /
               20-clickhouse-serving-profile.yml). ADR-0048 D4: an
               isolated settings profile + user for the API's
               public-serving ClickHouse reads, so a burst of public
               API traffic can never queue behind — or get starved
               by — a classic-movements-backfill / ch-rebuild
               derivation job, nor collide with the log-fill /
               merge-memory guards in zz-ratesengine.xml /
               zz-merge-memory-guard.xml (15-log-discipline.yml).

               Settings chosen (research notes, ADR-0048 D4):
                 max_threads / max_memory_usage / max_execution_time —
                 a serving read is a bounded keyset range scan over a
                 sorted-by-address(/ledger) table (ADR-0048 D2's
                 stellar.account_movements ORDER BY, or the explorer
                 lake reads' own bounded LIMITs); if a query needs
                 more than this it is BY DEFINITION not a serving
                 query and should fail fast rather than accumulate
                 threads/memory on a host that also runs backfills and
                 merges. 2 threads / 2 GiB / 10s are conservative
                 relative to what a real page actually costs.
                 max_concurrent_queries_for_user bounds the profile's
                 total footprint even under a traffic spike — N
                 concurrent bounded scans stays well inside the host's
                 72G CH server cap (zz-ratesengine.xml) at these
                 per-query limits.
                 priority=1 is CH's per-query PRIORITY QUEUE knob:
                 lower number = higher priority, 0 = "opted out of
                 prioritization" (CH's default for every OTHER
                 connection this repo makes — none of them set
                 `priority`). A priority=1 serving query is preferred
                 CPU time over any query that hasn't opted in; no
                 corresponding demotion of the backfill/ops path is
                 needed for this to take effect.
                 os_thread_priority=-5 is the setting that actually
                 reaches BACKGROUND MERGES: `priority` only orders
                 CH's query scheduler among QUERY threads — background
                 merges/mutations run in a separate thread pool it
                 does not touch. os_thread_priority sets the Linux
                 `nice` value (-20..19, lower = higher OS scheduling
                 priority) on the query's OWN execution threads via
                 CAP_SYS_NICE (the clickhouse-server package grants
                 this capability at install time, so no extra
                 ansible capability grant is needed here) — -5 gives
                 serving-query threads a real CPU edge over CH's
                 background merge/mutation pool (which runs at the OS
                 default, nice 0) under contention, without going to
                 an extreme (-20) that could starve merges outright
                 and let compaction fall permanently behind.
                 readonly=2 — NOT 1 (C6-015). This user only ever
                 SELECTs, so read-only is right; the question is which
                 read-only. ClickHouse's `readonly` has three values:
                 0 = everything, 1 = read-data queries ONLY and
                 CHANGING SETTINGS IS PROHIBITED, 2 = read data AND
                 change settings (the `readonly` setting itself still
                 cannot be raised, and INSERT/ALTER/DROP/CREATE stay
                 blocked exactly as under 1).
                 Under readonly=1 this profile would have broken every
                 serving endpoint it was built for, on the FIRST
                 REQUEST after ADR-0048's serving flip
                 (stellarindex_clickhouse_serving_enabled). Both
                 constructors the API binary passes these credentials
                 to — clickhouse.NewExplorerReaderAuth and
                 NewSupplyReaderAuth (cmd/stellarindex-api/main.go) —
                 open the connection with
                 `Settings: clickhouse.Settings{"max_execution_time": 30}`,
                 and clickhouse-go merges the connection's Settings
                 into the settings packet of EVERY query it sends
                 (conn.go settings()), flagged Important. Under
                 readonly=1 the server answers that with
                 `Cannot modify 'max_execution_time' setting in
                 readonly mode. (READONLY)`. The native-protocol Ping
                 carries no settings, so the API would have started
                 clean and healthy and then 500'd every explorer /
                 supply read — the worst shape of this failure.
                 Several serving reads also carry their own SQL-text
                 `SETTINGS ...` clause (ADR-0048 D2's
                 stellar.account_movements path), which readonly=1
                 rejects identically.
                 Consequence to be honest about: under readonly=2 the
                 four numbers above are DEFAULTS a per-query SETTINGS
                 may raise, not hard ceilings — and the serving reads
                 do raise them (max_threads 4, max_memory_usage 8 GB,
                 max_execution_time 30). Hard ceilings would need a
                 <constraints><max> block, which IS enforced regardless
                 of readonly; it is deliberately NOT added blind here,
                 because a ceiling set below any real serving query's
                 request turns "bounded" back into "broken", which is
                 the exact failure this value fixes. Derive the maxima
                 from the live per-query settings first.
                 What survives unchanged as defense in depth: no
                 INSERT/ALTER/DROP/CREATE from a leaked credential,
                 allow_databases below pinning it to `stellar`,
                 access_management=0, and the loopback-only network
                 ACL. max_concurrent_queries_for_user still bounds the
                 profile's aggregate footprint for every query that
                 does not override it (no reader in this repo does).

               Password: SHA-256 hex digest of
               clickhouse_serving_password (ansible-vault —
               vault_clickhouse_serving_password in
               inventory/r1.secrets.yml). The plaintext never touches
               disk outside the vault; ansible's `hash` filter
               computes the digest at render time, so it's the ONLY
               secret material this file embeds. -->
          <profiles>
              <api_serving>
                  <max_threads>{{ clickhouse_serving_max_threads }}</max_threads>
                  <max_memory_usage>{{ clickhouse_serving_max_memory_usage_bytes }}</max_memory_usage>
                  <max_execution_time>{{ clickhouse_serving_max_execution_time_s }}</max_execution_time>
                  <max_concurrent_queries_for_user>{{ clickhouse_serving_max_concurrent_queries }}</max_concurrent_queries_for_user>
                  <priority>1</priority>
                  <os_thread_priority>-5</os_thread_priority>
                  <readonly>2</readonly>
              </api_serving>
          </profiles>
          <users>
              <{{ clickhouse_serving_user }}>
                  <password_sha256_hex>{{ clickhouse_serving_password | hash('sha256') }}</password_sha256_hex>
                  <networks>
                      <ip>127.0.0.1</ip>
                      <ip>::1</ip>
                  </networks>
                  <profile>api_serving</profile>
                  <quota>default</quota>
                  <access_management>0</access_management>
                  <!-- Legacy XML access control (this deployment isn't
                       SQL-driven-access-control): restricts this user
                       to the `stellar` database (the Tier-1 lake +
                       ADR-0048 D2's account_movements serving table)
                       — it has no business touching `system` writes
                       or any other database on this host. -->
                  <allow_databases>
                      <database>stellar</database>
                  </allow_databases>
              </{{ clickhouse_serving_user }}>
          </users>
      </clickhouse>
  when: clickhouse_serving_profile_enabled | bool
  no_log: true   # content embeds the password's SHA-256 digest
  notify: Restart clickhouse-server
  tags: [clickhouse, clickhouse-serving-profile]

# ───── ops_batch: the LOW-priority counterpart (2026-08-28 r1) ─────────
#
# WHY: a runbook-prescribed `stellarindex-ops ch-rebuild -sep41` dry-run
# over 2M ledgers (run under run-heavy-job.sh: CPUWeight=50, IOWeight=50,
# MemoryMax=20G) drove r1's load to 12.9 and starved the AGGREGATOR's
# supply refresher — stellarindex_aggregator_supply_refresh_error_dominant
# fired for all 39 watched contracts within 3 minutes; killing the job
# cleared it. The cgroup caps bound the ops PROCESS; the contention was
# INSIDE clickhouse-server, where the ops job's heavy-FINAL scans and the
# aggregator's supply reads both ran as CH's unauthenticated `default`
# user — the same identity, so CH's query scheduler had nothing to yield
# with. api_serving above protects the API; nothing protected the
# aggregator/indexer side from a batch job. This profile is that
# protection: a dedicated user every stellarindex-ops CH connection
# authenticates as (internal/storage/clickhouse/ops_auth.go reads
# STELLARINDEX_CLICKHOUSE_OPS_USER/_PASSWORD from
# /etc/default/stellarindex-ops, templated by 09-minio.yml).
#
# Same discipline as api_serving: vault-sourced password (assert below),
# SHA-256 digest only in the drop-in, loopback-only, pinned to `stellar`,
# codify-only in the PR that adds it. Gated OFF by default
# (clickhouse_ops_batch_profile_enabled: false in defaults/main.yml):
# the assert below fires only on an explicit enable, so the weekly
# ansible-drift.yml --check against r1 stays green until the operator
# flips the flag in an inventory together with that inventory's
# vault_clickhouse_ops_batch_password. Activation, per host:
#   ansible-vault edit inventory/r1.secrets.yml   # add the password
#   (set clickhouse_ops_batch_profile_enabled: true in inventory/r1.yml)
#   ansible-playbook -i inventory/r1.yml playbooks/archival-node.yml \
#     --tags clickhouse-ops-batch-profile,minio,heavy-job-wrapper --check --diff
# (all three tags: the CH user AND the env file must move together, or
# the next ops job authenticates with a credential CH does not know;
# heavy-job-wrapper re-renders /usr/local/sbin/run-heavy-job.sh, which
# imports the pair from /etc/default/stellarindex-ops into every wrapped
# job itself — 14-stellarindex-services.yml — so how the runbooks launch
# jobs does not change; a wrapper rendered before 2026-08-28 does not
# import it, hence the tag).

- name: Assert ClickHouse ops-batch profile password is set (2026-08-28 r1)
  ansible.builtin.assert:
    that:
      - clickhouse_ops_batch_password | default('') | length > 0
    fail_msg: >-
      clickhouse_ops_batch_password is not set. Generate a strong
      password, `ansible-vault edit inventory/r1.secrets.yml` and add
      `vault_clickhouse_ops_batch_password: "<generated>"` (mirrors
      vault_clickhouse_serving_password — see defaults/main.yml's
      clickhouse_ops_batch_password for the wiring), then re-run with
      --tags clickhouse-ops-batch-profile,minio,heavy-job-wrapper. Never commit the
      plaintext password.
  when: clickhouse_ops_batch_profile_enabled | bool
  tags: [clickhouse, clickhouse-ops-batch-profile]

- name: Install the ops_batch ClickHouse profile + user (2026-08-28 r1)
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/users.d/ops-batch.xml
    owner: clickhouse
    group: clickhouse
    mode: "0640"       # password_sha256_hex is a secret at rest
    content: |
      <clickhouse>
          <!-- Managed by ansible (archival-node /
               20-clickhouse-serving-profile.yml). The LOW-priority
               identity for stellarindex-ops batch jobs (ch-rebuild,
               ch-backfill, classic-movements-backfill, verify/gate
               reads, replays), so a heavy derivation scan can never
               starve the aggregator's / indexer's / API's reads of
               CPU inside clickhouse-server (2026-08-28 r1: ch-rebuild
               -sep41 as `default` → supply_refresh_error_dominant for
               all 39 watched contracts in 3 minutes).

               Settings:
                 priority = {{ clickhouse_ops_batch_priority }} — CH's per-query priority
                 queue: LOWER number = HIGHER priority, 0 = not
                 participating. api_serving is 1; every un-opted-in
                 connection (indexer sink, aggregator readers) is 0
                 and therefore still preferred over this profile when
                 CPU is contended. Pinned <readonly/> in <constraints>
                 so no per-query SETTINGS clause can promote itself.
                 os_thread_priority = {{ clickhouse_ops_batch_os_thread_priority }} — Linux nice for the
                 query's OWN execution threads (api_serving is -5,
                 background merges run at 0): positive so a batch scan
                 also yields to merges instead of letting compaction
                 fall behind, which was the other way the 2026-08-28
                 job hurt the serving side.
                 max_threads / max_memory_usage /
                 max_concurrent_queries_for_user are DEFAULTS, not
                 ceilings (readonly=0 below): the ops openers set
                 their own per-query class limits (gate.go's
                 heavy-FINAL class runs max_threads 3 / 10 GiB with
                 external sort spill; the writers set
                 max_execution_time only) and those must keep winning
                 — a <constraints><max> set below a real job's request
                 turns "bounded" into "broken" mid-backfill. What the
                 defaults DO bound is every ops read that sets nothing
                 (the bulk of the verify/gate/census helpers).
                 No max_execution_time: a FINAL stream over a
                 full-history window legitimately runs for hours; the
                 openers that want a ceiling set one themselves.
                 readonly = 0 — ops jobs WRITE (Sink, participant /
                 account-movements / entry-change inserts), unlike
                 api_serving's readonly=2.

               Password: SHA-256 hex digest of
               clickhouse_ops_batch_password (ansible-vault —
               vault_clickhouse_ops_batch_password). The plaintext is
               templated ONLY into /etc/default/stellarindex-ops
               (09-minio.yml, 0640 root:stellarindex) — the env file
               the stellarindex-{indexer,aggregator,api} services do
               NOT source, which is what keeps this demotion scoped
               to batch jobs. -->
          <profiles>
              <ops_batch>
                  <max_threads>{{ clickhouse_ops_batch_max_threads }}</max_threads>
                  <max_memory_usage>{{ clickhouse_ops_batch_max_memory_usage_bytes }}</max_memory_usage>
                  <max_concurrent_queries_for_user>{{ clickhouse_ops_batch_max_concurrent_queries }}</max_concurrent_queries_for_user>
                  <priority>{{ clickhouse_ops_batch_priority }}</priority>
                  <os_thread_priority>{{ clickhouse_ops_batch_os_thread_priority }}</os_thread_priority>
                  <readonly>0</readonly>
                  <constraints>
                      <priority>
                          <readonly/>
                      </priority>
                      <os_thread_priority>
                          <readonly/>
                      </os_thread_priority>
                  </constraints>
              </ops_batch>
          </profiles>
          <users>
              <{{ clickhouse_ops_batch_user }}>
                  <password_sha256_hex>{{ clickhouse_ops_batch_password | hash('sha256') }}</password_sha256_hex>
                  <networks>
                      <ip>127.0.0.1</ip>
                      <ip>::1</ip>
                  </networks>
                  <profile>ops_batch</profile>
                  <quota>default</quota>
                  <access_management>0</access_management>
                  <!-- Pinned to the `stellar` database like api_serving:
                       the ops jobs derive/verify Tier-1 lake tables and
                       nothing else on this host. -->
                  <allow_databases>
                      <database>stellar</database>
                  </allow_databases>
              </{{ clickhouse_ops_batch_user }}>
          </users>
      </clickhouse>
  when: clickhouse_ops_batch_profile_enabled | bool
  no_log: true   # content embeds the password's SHA-256 digest
  notify: Restart clickhouse-server
  tags: [clickhouse, clickhouse-ops-batch-profile]
