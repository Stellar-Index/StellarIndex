    enabled: true
    state: started
    daemon_reload: true

# ── Ledger-meta decode probe (reactive protocol backstop) ─────────
# The version-lag probe above is the PRIMARY defence, but it compares
# released upstream versions and so cannot know the network has begun
# emitting new XDR. Observed 2026-08-27: testnet ingested 240 P28
# ledgers on a galexie that could NOT decode P28, because the breaking
# arm only appears once a ledger actually contains parallel-execution
# structures; futurenet (which exercises that path) died at ledger
# 92747. This probe watches for the decode failure itself and names
# the cause, so it surfaces as "component is behind a protocol"
# instead of generic tip-lag. See docs/operations/protocol-upgrades.md.
