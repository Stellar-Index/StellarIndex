---
# Orchestrates the archival-node bootstrap. Each included task file carries a
# tag matching its file name so operators can run a subset:
#
#   ansible-playbook ... --tags zfs,postgres
#   ansible-playbook ... --skip-tags minio
#
# ── CHECK-MODE UNIT GUARD ────────────────────────────────────────────
# `--check` never writes files, so a task that enables or starts a unit THIS
# ROLE installs fails fatally ("Could not find the requested service X") while
# the unit is new and not yet on the host. That aborts the preview for every
# later task, hiding the drift a weekly ansible-drift run exists to report.
#
# ROLE-INSTALLED unit (templates/systemd/*.j2, or copied into
# /etc/systemd/system by a task here): register the install task and guard the
# enable/start with
#
#     when: not (ansible_check_mode and <register> is changed)
#
# It fires only when the unit file itself would change, which is exactly when
# the enable cannot be evaluated honestly; otherwise the preview still reports
# "would start stellarindex-indexer".
#
# PACKAGED unit (postgres, redis, clickhouse-server, nftables, caddy, the
# prometheus exporters, fail2ban, ssh, rsyslog...): DO NOT GUARD. The package
# put the unit on the host, so check mode can evaluate it, and a guard would
# hide a real "would start postgres" finding.
#
# HANDLERS on role-installed units use the blunter `not ansible_check_mode`
# (see handlers/main.yml): a handler's register may belong to a task file the
# current --tags skipped, and `state: restarted` has no state to preview.

- name: "Preflight checks"
  ansible.builtin.import_tasks: 01-preflight.yml
  tags: [preflight, always]

# ── DOES THIS HOST HAVE A CLICKHOUSE TO CONFIGURE? ──────────────────
# Several task files CONFIGURE a ClickHouse rather than install one: they drop
# XML into /etc/clickhouse-server/{config.d,users.d}, chown to the `clickhouse`
# user (created by the package, not 04-users.yml) and run clickhouse-client.
# `run_clickhouse` alone is the wrong gate: r1 has it FALSE by design
# (08-clickhouse.yml must never rebuild r1's hand-tended lake) yet needs the
# drop guard, serving profile and metrics endpoint. A host with no ClickHouse
# (DR bring-up, fresh r2/r3, no-lake test box) must skip them or the role fails
# at the serving-profile vault assert.
#
# So gate on the FACT, the server's own config directory, OR'd with
# run_clickhouse so a host that installs ClickHouse later in this run still
# gets configured.
#
# Resolved HERE, right after preflight: 15-log-discipline.yml is imported
# earlier (it carries guards every host needs, so it cannot be gated) and its
# eight ClickHouse-config tasks use this same fact.
# scripts/ci/ansible-clickhouse-host-gate-test.sh re-derives that set from the
# file on every run, so a ninth cannot be added ungated.
#
# Tagged `always` so a targeted apply (`--tags clickhouse-drop-guard`) still
# resolves it.
- name: "Detect an installed ClickHouse server (gates the CH-config tasks)"
  ansible.builtin.stat:
    path: "{{ clickhouse_server_config_dir }}"
  register: clickhouse_server_config
  tags: [always]

- name: "Do the ClickHouse config tasks have a server to configure?"
  ansible.builtin.set_fact:
    clickhouse_config_tasks_enabled: >-
      {{ (run_clickhouse | default(false) | bool)
         or (clickhouse_server_config.stat.isdir | default(false) | bool) }}
  tags: [always]

- name: "Kernel + sysctl tuning"
  ansible.builtin.import_tasks: 02-kernel.yml
  tags: [kernel]

- name: "ZFS install + pool + datasets"
  ansible.builtin.import_tasks: 03-zfs.yml
  when: zfs_data_pool_type | default('') != ''
  tags: [zfs]

# No-ZFS hosts (r2/r3 on EBS/Object-Storage, or a libvirt VM whose host owns
# the ZFS/RAID) skip 03-zfs, so the per-workload mountpoint dirs the datasets
# would have created are made as plain directories; service tasks assume them.
- name: "Create data dirs as plain directories (no-ZFS hosts)"
  ansible.builtin.file:
    path: "{{ item.mountpoint }}"
    state: directory
    mode: "{{ item.dir_mode | default('0755') }}"
    # Mirrors 03-zfs.yml's mount-point task: default(omit) leaves root:root for
    # root-written datasets; only restore-drill (postgres-owned) sets it.
    owner: "{{ item.dir_owner | default(omit) }}"
    group: "{{ item.dir_group | default(omit) }}"
  # Root-owned with the dataset's mode; service tasks chown their own data dirs
  # (04-users). postgres + clickhouse dirs are EXCLUDED: their package installers
  # create and own them, and pre-creating them root-owned breaks cluster init.
  loop: "{{ zfs_datasets | rejectattr('name', 'in', ['postgres', 'postgres/wal', 'clickhouse']) | list }}"
  loop_control:
    label: "{{ item.mountpoint }}"
  when: zfs_data_pool_type | default('') == ''
  tags: [zfs, datadirs]

- name: "Service users"
  ansible.builtin.import_tasks: 04-users.yml
  tags: [users]

- name: "Postgres 15"
  ansible.builtin.import_tasks: 05-postgres.yml
  when: run_postgres | bool
  tags: [postgres]

# run_clickhouse defaults FALSE so r1's hand-tended lake is never touched by
# this role (test nets set it true). Ordered BEFORE pgbackrest, whose ClickHouse
# schema-snapshot/drift tasks need ClickHouse present on a fresh build.
- name: "Redis (API cache / replay guard / rate-limit)"
  ansible.builtin.import_tasks: 08-redis.yml
  when: run_redis | default(true) | bool
  tags: [redis]

- name: "ClickHouse (certified lake — ADR-0034)"
  ansible.builtin.import_tasks: 08-clickhouse.yml
  when: run_clickhouse | default(false) | bool
  tags: [clickhouse, clickhouse-install]

- name: "pgBackRest backup schedule"
  ansible.builtin.import_tasks: 18-pgbackrest-backup.yml
  when: run_postgres | bool
  tags: [postgres, pgbackrest, backup]

# Rolling ZFS snapshots of data/clickhouse + data/postgres: the minutes-scale
# answer to a logical fault, beside pgBackRest's hours-scale PITR. ZFS-owning
# hosts only (same gate as 03-zfs). Own tag so it can be applied alone:
#   ansible-playbook ... --tags zfs-snapshots --check --diff
- name: "Rolling ZFS snapshots (clickhouse + postgres)"
  ansible.builtin.import_tasks: 21-zfs-snapshots.yml
  when:
    - zfs_data_pool_type | default('') != ''
    - zfs_snapshots_enabled | default(true) | bool
  tags: [zfs-snapshots, backup]

- name: "stellar-core"
  ansible.builtin.import_tasks: 06-stellar-core.yml
  when: run_stellar_core | bool
  tags: [stellar-core, core]

- name: "Galexie"
  ansible.builtin.import_tasks: 07-galexie.yml
  when: run_galexie | bool
  tags: [galexie]

- name: "MinIO (single-node local)"
  ansible.builtin.import_tasks: 09-minio.yml
  when: run_minio | bool
  tags: [minio]

- name: "Observability (node_exporter + core exporter)"
  ansible.builtin.import_tasks: 10-observability.yml
  when: run_observability | bool
  tags: [observability, monitoring]

- name: "Prometheus exporters (redis + postgres + pgbackrest)"
  # Exporters whose scrape jobs live in configs/prometheus/prometheus.r1.yml.
  # After 10-observability.yml: needs node_exporter's textfile dir and the
  # `prometheus` group the Debian exporter packages create.
  ansible.builtin.import_tasks: 16-prometheus-exporters.yml
  when: run_observability | bool
  tags: [observability, monitoring, exporters]

- name: "Firewall (nftables)"
  ansible.builtin.import_tasks: 11-firewall.yml
  tags: [firewall]

- name: "SSH + base hardening"
  ansible.builtin.import_tasks: 12-hardening.yml
  tags: [hardening, ssh]

- name: "External healthcheck (Healthchecks.io push)"
  ansible.builtin.import_tasks: 13-healthcheck.yml
  tags: [healthcheck, monitoring]

- name: "Stellar Index services (build, deploy, migrate, indexer)"
  ansible.builtin.import_tasks: 14-stellarindex-services.yml
  when: run_stellarindex | bool
  tags: [stellarindex, indexer]

- name: "Stellar Index Healthchecks.io stack (heartbeat + smoke + sla-probe)"
  # After 14-stellarindex-services.yml, which installs the sla-probe binary and
  # the API surface the smoke wrapper hits. The wrappers degrade gracefully
  # (ping /fail + journalctl) if either is missing, so the dependency is soft.
  ansible.builtin.import_tasks: 17-stellarindex-healthchecks.yml
  tags: [healthchecks, monitoring]

- name: "Caddy public edge"
  ansible.builtin.import_tasks: 19-caddy.yml
  when: run_caddy | default(true) | bool
  tags: [caddy]

- name: "Log discipline (rsyslog cap + journald cap)"
  ansible.builtin.import_tasks: 15-log-discipline.yml
  tags: [log-discipline, logrotate, journald]

- name: "ClickHouse serving-query isolation (ADR-0048 D4)"
  ansible.builtin.import_tasks: 20-clickhouse-serving-profile.yml
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [clickhouse, clickhouse-serving-profile]

- name: "ClickHouse destructive-DDL size guard (2026-08-29 r1 audit)"
  ansible.builtin.import_tasks: 21-clickhouse-drop-guard.yml
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [clickhouse, clickhouse-drop-guard]

- name: "ClickHouse Prometheus endpoint (2026-09-03 r1 observability gap)"
  # Same gate as the two above: reaches r1 (ClickHouse present, run_clickhouse
  # false) and skips a host with no lake.
  ansible.builtin.import_tasks: 22-clickhouse-exporter.yml
  when: clickhouse_config_tasks_enabled | default(false) | bool
  tags: [clickhouse, clickhouse-exporter, observability]

- name: "Local single-host Prometheus (ASH-8 — the /v1/status scrape layer)"
  # LAST on purpose: its scrape list derives from the run_* switches, so every
  # target is already installed (exporters at 10/16/22, units at 14) and the
  # final verify can assert real scrapes on a from-scratch build.
  #
  # Default OFF (run_local_prometheus, defaults/main.yml): r1's Prometheus +
  # Alertmanager stay out-of-band and playbooks/monitoring.yml + roles/prometheus
  # stay the multi-host shape. Test-net inventories turn it on.
  ansible.builtin.import_tasks: 23-local-prometheus.yml
  when: run_local_prometheus | bool
  tags: [local-prometheus, monitoring, observability]
