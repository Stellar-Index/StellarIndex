---
# Preflight checks — fail fast if the host doesn't match expectations.
# Every other task assumes the checks below passed.

- name: Verify RAM sufficient (≥ archival_node_min_ram_mb)
  ansible.builtin.assert:
    that:
      - ansible_facts.memtotal_mb >= (archival_node_min_ram_mb | int)
    fail_msg: >-
      This host has {{ (ansible_facts.memtotal_mb / 1024) | round(1) }} GB RAM;
      this deployment requires {{ ((archival_node_min_ram_mb | int) / 1024) | round(1) }} GB
      minimum (archival_node_min_ram_mb). The pubnet archival-node spec is 32 GB
      (docs/architecture/infrastructure/archival-node-spec.md §3.2); a low-traffic
      test net overrides it lower in inventory.

- name: Verify x86_64 architecture (stellar-core binaries target x86_64)
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture == "x86_64"

# audit-2026-07-23 CFG-02: region_id has no role default (see
# defaults/main.yml) — every inventory must set it explicitly so a
# new-region provisioning that forgets the override fails loudly here
# instead of silently mislabelling the host with a stale default.
- name: Verify region_id is set to a known region code
  ansible.builtin.assert:
    that:
      - region_id | default('') != ''
      - region_id in ['r1', 'r2', 'r3', 'testnet', 'futurenet']
    fail_msg: >-
      region_id must be set in inventory to one of r1/r2/r3 (Mainnet regions)
      or testnet/futurenet (see the inventory examples) — got
      {{ region_id | default('(unset)') }}. A new value should extend this
      list deliberately, not fall through to a default.

# audit-2026-07-23 SEC-network / INF-20: allowed_ssh_cidrs has no role
# default either (see defaults/main.yml). SSH is the port that grants
# root on this box, and the previous "0.0.0.0/0" default handed it to
# the internet by inheritance — an inventory that never mentioned the
# var got the widest possible rule with nothing recording the decision.
# Two separate failures below, deliberately: "you said nothing" and
# "you said 0.0.0.0/0 without acknowledging it" are different mistakes.
- name: Verify allowed_ssh_cidrs is declared in inventory
  ansible.builtin.assert:
    that:
      - allowed_ssh_cidrs | default([]) | length > 0
    fail_msg: >-
      allowed_ssh_cidrs must be set in inventory (see
      inventory/r1.example.yml) — the role no longer defaults it to
      0.0.0.0/0. Narrow it to the operator VPN / jump-host CIDR(s); if
      the port genuinely has to stay world-open, say so explicitly with
      ssh_world_open_ack: true.

- name: Verify a world-open SSH port is explicitly acknowledged
  ansible.builtin.assert:
    that:
      - not (allowed_ssh_cidrs | select('in', ['0.0.0.0/0', '::/0']) | list | length > 0)
        or (ssh_world_open_ack | default(false) | bool)
    fail_msg: >-
      allowed_ssh_cidrs opens SSH to the entire internet
      ({{ allowed_ssh_cidrs | select('in', ['0.0.0.0/0', '::/0']) | list | join(', ') }})
      on {{ inventory_hostname }}. Narrow it to the operator VPN /
      jump-host CIDR(s), or — if that host has no jump host yet —
      declare the exposure in the SAME inventory with
      ssh_world_open_ack: true and a comment saying what retires it.
      Key-only auth plus the 30/min nftables rate limit is the only
      thing in front of a root shell otherwise.

# Only when ZFS is actually used (zfs_data_pool_type set). Hosts that use
# the disk directly — r2/r3 on EBS/Object-Storage, or a libvirt VM whose
# host owns the ZFS/RAID — set zfs_data_pool_type="" + zfs_data_devices=[]
# and skip the ZFS layer entirely (03-zfs.yml is likewise gated).
- name: Check that ZFS data devices are declared
  ansible.builtin.assert:
    that:
      - zfs_data_devices | length >= 2
    fail_msg: "zfs_data_devices must be set in inventory (see inventory/r1.example.yml)."
  when: zfs_data_pool_type | default('') != ''

# Two categories of ZFS devices to validate up-front:
#   * Whole drives referenced in zfs_data_devices — must exist now.
#   * OS-mirror drives in zfs_os_drives_needing_data_partition — the
#     base drive must exist now; the -partN path will be created by
#     03-zfs.yml, so we don't check for that here. 03-zfs.yml itself
#     stats every zfs_data_device post-partitioning.
- name: Verify OS-mirror drives (where we'll carve a ZFS partition) exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ zfs_os_drives_needing_data_partition }}"
  register: os_drive_stat

- name: Fail if any OS-mirror drive is missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "OS-mirror drive {{ item.item }} does not exist."
  loop: "{{ os_drive_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify zfs_data_devices that aren't partitions-to-be-created
  ansible.builtin.stat:
    path: "{{ item }}"
  # Skip any device path ending in -partN whose base drive is in
  # zfs_os_drives_needing_data_partition — those are created later.
  loop: "{{ zfs_data_devices | reject('match', '.*-part\\d+$') | list }}"
  register: device_stat

- name: Fail if any existing-drive ZFS device is missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Device {{ item.item }} does not exist on the host."
  loop: "{{ device_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify admin_ssh_keys is non-empty
  ansible.builtin.assert:
    that:
      - admin_ssh_keys | length >= 1
    fail_msg: >-
      admin_ssh_keys must contain at least one key — otherwise hardening
      will lock us out.

- name: Gather information about network interfaces
  ansible.builtin.setup:
    gather_subset:
      - network

# deploy-ansible-secrets-5: /etc/default/stellarindex and
# /etc/default/stellarindex-ops are systemd EnvironmentFiles — values are
# rendered UNQUOTED (systemd takes the line literally) — yet operators are
# told to `set -a; source` them interactively, and until 2026-08-28 the
# deploy migrate step, a root cron and eleven host scripts did the same.
# A secret containing a shell metacharacter (`$`, `;`, quotes, space, …)
# then works under systemd and is silently mangled — or partly EXECUTED
# as root — under the shell. The programmatic readers now read the file
# verbatim; this assert closes the interactive path by refusing to render
# such a value at all (rotate it: `openssl rand -hex 32`, per
# credential-rotation.md). Names only in the failure — never values.
- name: Collect env-file secrets that carry shell metacharacters
  ansible.builtin.set_fact:
    env_file_unsafe_secrets: >-
      {{ env_file_secrets | dict2items
         | selectattr('value', 'search', env_file_unsafe_re)
         | map(attribute='key') | list }}
  vars:
    env_file_unsafe_re: '[\s$`;&|''"\\<>(){}*?\[\]!~]'
    env_file_secrets:
      postgres_user_stellarindex: "{{ postgres_user_stellarindex | default('') }}"
      postgres_pass_stellarindex: "{{ postgres_pass_stellarindex | default('') }}"
      postgres_db_stellarindex: "{{ postgres_db_stellarindex | default('') }}"
      stellarindex_reader_access_key: "{{ stellarindex_reader_access_key | default('') }}"
      vault_stellarindex_reader_secret_key: "{{ vault_stellarindex_reader_secret_key | default('') }}"
      vault_massive_api_key: "{{ vault_massive_api_key | default('') }}"
      vault_coingecko_demo_api_key: "{{ vault_coingecko_demo_api_key | default('') }}"
      vault_chainlink_rpc_url: "{{ vault_chainlink_rpc_url | default('') }}"
      vault_resend_api_key: "{{ vault_resend_api_key | default('') }}"
      vault_dashboard_code_secret: "{{ vault_dashboard_code_secret | default('') }}"
      clickhouse_serving_password: "{{ clickhouse_serving_password | default('') }}"
      clickhouse_ops_batch_user: "{{ clickhouse_ops_batch_user | default('') }}"
      clickhouse_ops_batch_password: "{{ clickhouse_ops_batch_password | default('') }}"
      # /etc/default/galexie (07-galexie.yml) — sourced by config-assertions.sh
      galexie_s3_access_key: "{{ galexie_s3_access_key | default('') }}"
      galexie_s3_secret_key: "{{ galexie_s3_secret_key | default('') }}"
  no_log: true

- name: Verify env-file secrets are free of shell metacharacters
  ansible.builtin.assert:
    that:
      - env_file_unsafe_secrets | length == 0
    fail_msg: >-
      These vault values would be rendered unquoted into
      /etc/default/{stellarindex,stellarindex-ops,galexie} but contain a shell metacharacter
      (whitespace $ ` ; & | quotes \ < > ( ) { } * ? [ ] ! ~), so systemd
      and any shell that sources the file would disagree on the value —
      refusing to render. Rotate to `openssl rand -hex 32`
      (docs/operations/runbooks/credential-rotation.md):
      {{ env_file_unsafe_secrets | join(', ') }}
