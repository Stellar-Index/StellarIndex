---
# Scheduled pgBackRest backups for the stellarindex stanza.
#
# pgBackRest itself (stanza, repo, WAL archiving, retention=2) is
# configured out-of-band; this task only installs the recurring backup
# *schedule* — which was missing, so the single bootstrap full backup
# aged past 24h and tripped `stellarindex_timescale_backup_none_24h`
# (page) on the status page. Cadence: differential Mon–Sat + a full on
# Sunday, daily at 02:00, which satisfies both the 24h (page) and 25h
# (ticket) thresholds in rules.r1/storage.yml. WAL archiving (archive-async)
# carries the 5-min RPO between backups.

# Offsite (repo2) DR guard (audit-2026-07-23 REL-DR): repo1 lives on the
# SAME host/pool as the database it backs up, so it shares its failure
# domain (host loss, pool loss, ransomware on the box all take out both
# the DB and its only backup copy). Fail loud at role-apply time rather
# than let that gap ship silently: either repo2 is declared (S3 vars
# set — pgbackrest.conf.j2 wires it when pgbackrest_manage_conf is
# true) or the operator explicitly acknowledges the gap with
# pgbackrest_offsite_ack=true (see docs/operations/off-site-backup-plan.md
# for the deferred-offsite decision this currently documents for r1).
- name: Refuse to proceed without an offsite (repo2) backup or an explicit ack of the gap
  ansible.builtin.assert:
    that:
      - (pgbackrest_repo2_s3_bucket | default('') != '') or (pgbackrest_offsite_ack | default(false) | bool)
    fail_msg: >-
      No pgBackRest offsite (repo2) backup is configured for this host, and
      pgbackrest_offsite_ack is not set. repo1-only backups share the DB's
      failure domain (REL-DR). Either set pgbackrest_repo2_s3_bucket (+ the
      other repo2 vars) to provision an offsite copy, or set
      pgbackrest_offsite_ack: true to explicitly accept the gap (see
      docs/operations/off-site-backup-plan.md).
    quiet: true
  # Only meaningful where pgBackRest backups actually run. A host with
  # pgbackrest_backup_enabled=false takes no backups at all, so demanding
  # it justify the offsite GAP in its backups is incoherent — and it would
  # hard-fail the play for every such host.
  when: pgbackrest_backup_enabled | default(true)

- name: Install pgBackRest backup wrapper
  ansible.builtin.template:
    src: pgbackrest-backup.sh.j2
    dest: /usr/local/bin/pgbackrest-backup.sh
    owner: root
    group: root
    mode: "0755"
  when: pgbackrest_backup_enabled | default(true)

- name: Install pgBackRest backup systemd units
  ansible.builtin.template:
    src: "systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pgbackrest-backup.service
    - pgbackrest-backup.timer
  register: pgbackrest_backup_units
  when: pgbackrest_backup_enabled | default(true)

- name: Enable + start the pgBackRest backup timer
  ansible.builtin.systemd:
    name: pgbackrest-backup.timer
    enabled: true
    state: started
    daemon_reload: "{{ pgbackrest_backup_units is changed }}"
  when:
    - pgbackrest_backup_enabled | default(true)
    # check-mode: the unit install above was only simulated, so the unit
    # may not exist on the host yet — enabling it would fail the dry-run
    # (2026-07-27 drift run). Real applies are unaffected.
    - not (ansible_check_mode and pgbackrest_backup_units is changed)

# ADR-0043: pgBackRest core config is now templated (repo1 faithful to
# the live r1 config + the conditional offsite repo2 block, CS-111).
# Gated OFF by default so a plain role apply cannot clobber a
# hand-tuned live config — the operator flips pgbackrest_manage_conf
# after reviewing the rendered diff. When repo2 vars are set, run
# `pgbackrest --stanza=stellarindex stanza-upgrade` then a full backup
# to repo2 (see the operator register).
#
# This precondition MUST run before the template task below (audit-
# 2026-07-23 AGT-ordering): pgbackrest.conf.j2 consumes the same
# repo2 vars, so running the assert after the template would only
# ever fire once the (possibly half-configured) config had already
# been rendered — too late for the friendly precondition to do its
# job.
# repo1 encryption (audit-2026-07-23 F4-F2). repo1 shipped with
# pgbackrest's default cipher-type=none: a full copy of the database —
# API keys, customer records, webhook secrets — in plaintext on disk,
# protected by filesystem permissions alone, and copied verbatim into
# any ZFS send / rsync / disk-level backup of that dataset. repo2 has
# been encrypted since CS-111; repo1 never was.
#
# The fix cannot be a template flip alone: a pgBackRest repo's cipher is
# established at stanza-create and cannot be changed on an existing repo
# (stanza-upgrade does NOT re-encrypt, and a cipher mismatch makes the
# repo unreadable). So this gate does what a config change honestly can
# — it makes "unencrypted" an explicit, greppable declaration instead of
# a silent default, exactly as pgbackrest_offsite_ack does for the
# missing offsite copy. The re-create procedure (and the RPO window it
# opens) is docs/operations/pgbackrest-encryption.md.
- name: Refuse an unencrypted repo1 without an explicit ack of the gap
  ansible.builtin.assert:
    that:
      - >-
        (pgbackrest_repo1_cipher_pass | default('') != '')
        or (pgbackrest_repo1_unencrypted_ack | default(false) | bool)
    fail_msg: >-
      pgBackRest repo1 would be written UNENCRYPTED (cipher-type=none) —
      a plaintext copy of the whole database on local disk. Either set
      pgbackrest_repo1_cipher_pass from vault and follow
      docs/operations/pgbackrest-encryption.md (the repo must be
      RE-CREATED; pgbackrest cannot re-encrypt an existing one), or set
      pgbackrest_repo1_unencrypted_ack: true in the inventory to accept
      the gap explicitly.
    quiet: true
  when: pgbackrest_manage_conf | default(false)

- name: Refuse repo2 without its cipher pass (offsite copies are encrypted by us)
  ansible.builtin.assert:
    that:
      - pgbackrest_repo2_cipher_pass | default('') != ''
      - pgbackrest_repo2_s3_key | default('') != ''
      - pgbackrest_repo2_s3_key_secret | default('') != ''
      - pgbackrest_repo2_s3_endpoint | default('') != ''
    quiet: true
  no_log: true
  when:
    - pgbackrest_manage_conf | default(false)
    - pgbackrest_repo2_s3_bucket | default('') != ''

# `diff: false` (audit-2026-08-28 backup-restore-7): the rendered file
# carries repo1/repo2-cipher-pass and the repo2 S3 key pair verbatim —
# pgbackrest reads them from this postgres-owned 0640 file, and there is
# no env-file form that also reaches archive_command inside the postgres
# server process. Without this keyword the documented `--check --diff`
# review (README, operator register, the weekly ansible-drift job) prints
# the full before/after content — i.e. the ONLY key that decrypts the
# survival backup — into shell scrollback and the CI job log. The
# changed/ok verdict stays visible; only the hunk body is suppressed.
# scripts/ci/lint-ansible-secret-diff.py pins this.
- name: Install pgBackRest core config (repo1 + optional offsite repo2)
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: "0640"
  diff: false
  when: pgbackrest_manage_conf | default(false)

# ─── ClickHouse lake protection: schema + state snapshot ──────────────
# ADR-0043 §2 rejects a full multi-TiB CH backup and commits instead to
# three cheaper guarantees. §2.1 is this one: "Schema + state backup
# (tiny, daily): SHOW CREATE DDL for every table + the
# ch-live-catchup/backfill cursor state, pushed to repo2 alongside
# pgBackRest. Losing DDL/config is what turns a re-derive from 'run the
# script' into archaeology."
#
# It lives in the pgBackRest task file deliberately: the ADR pairs the
# CH metadata copy with the Postgres backup (same destination, same
# cadence, same operator), and the repo2 vars it should ride along with
# are already in scope here.
#
# Nothing existed for §2.1 before this — the lake had DDL in
# deploy/clickhouse/tier1_schema.sql (the FOUNDING schema, since
# outgrown by indexes, MVs and compression policies) and nothing else.
#
# On PUBNET the ack is not accepted. ADR-0043's restore is schema-FIRST:
# the DDL is what a re-derive is replayed into, so in the total-site-loss
# scenario Postgres comes back from the repo2 S3 copy and the lake's
# schema exists on no surviving medium. An ack can record a decision to
# run without a second copy of DATA; it cannot make the only copy of the
# lake's DEFINITION survive the pool it sits on. Test nets rebuild from
# deploy/clickhouse/*.sql in minutes and keep the ack.
#
# WHERE the pubnet refusal engages matters as much as what it says. This
# file is imported at step 18 of a full archival-node.yml run, ahead of
# every task after it — 22-clickhouse-exporter.yml among them — and the
# weekly ansible-drift workflow runs that full playbook, including the
# apply arm that is the only path holding the vault. A hard assert in
# the linear path would abort all of that, on every run, for as long as
# a host that has no off-site target today goes without one: no drift
# verdict, nothing else applied, and the fix shipped beside it out of
# reach. So on pubnet the refusal is scoped to the surface being
# applied. It fires when the operator selects the backup surface by tag
# (`--tags backup` / `pgbackrest` — the invocation v1-launch-plan row
# 1.12 gives for setting the target); a full run, or a run limited to
# some other tag, instead REPORTS the gap by name and carries on,
# installing the snapshot units local-only. Local-only is strictly
# better than no snapshot, and it is the state the standing alert
# (stellarindex_ch_schema_snapshot_offsite_stale — per host, not gated
# on the target being configured) tickets until a copy exists. Non-pubnet
# keeps the plain assert on every run: the ack is a one-line inventory
# var, so it never traps a run.
- name: Record whether this host's ClickHouse schema snapshot would be local-only on pubnet
  ansible.builtin.set_fact:
    ch_schema_snapshot_local_only_pubnet: >-
      {{ (ch_schema_snapshot_mc_target | default('') == '')
         and ((stellar_network | default('pubnet')) == 'pubnet') }}
    # `ansible_run_tags` is ['all'] on an untagged run.
    ch_schema_snapshot_backup_surface_selected: >-
      {{ (ansible_run_tags | default(['all']) | intersect(['backup', 'pgbackrest']) | length) > 0 }}
  when: ch_schema_snapshot_enabled | default(true)

- name: Refuse a local-only ClickHouse schema snapshot (pubnet requires an off-site target)
  ansible.builtin.assert:
    that:
      - >-
        (ch_schema_snapshot_mc_target | default('') != '')
        or (
          (stellar_network | default('pubnet')) != 'pubnet'
          and (ch_schema_snapshot_offsite_ack | default(false) | bool)
        )
    fail_msg: >-
      The ClickHouse schema+state snapshot (ADR-0043 §2.1) would be written
      ONLY to this host's own pool — the same pool it protects, so one pool
      loss takes the lake's DDL with the lake (the CS-111 failure shape,
      one layer down). Set ch_schema_snapshot_mc_target to an mc
      alias/prefix on offsite storage and re-run with --tags backup. On a
      NON-pubnet host ch_schema_snapshot_offsite_ack: true accepts the gap
      instead (the lake there is re-createable from deploy/clickhouse/*.sql);
      on pubnet it is not accepted, because ADR-0043's restore is
      schema-first and a re-derive has nothing to replay into.
      See docs/operations/runbooks/ch-schema-restore.md and
      docs/operations/v1-launch-plan.md row 1.12.
    quiet: true
  when:
    - ch_schema_snapshot_enabled | default(true)
    # Pubnet: only when the backup surface was selected by tag (see the
    # note above). Non-pubnet: on every run — the ack is the escape.
    - >-
      (stellar_network | default('pubnet')) != 'pubnet'
      or (ch_schema_snapshot_backup_surface_selected | default(false) | bool)

- name: Report a local-only ClickHouse schema snapshot on pubnet (full run — not refused here)
  ansible.builtin.debug:
    msg: >-
      ch_schema_snapshot_mc_target is unset on a pubnet host, so the
      ClickHouse schema+state snapshot — the lake's ONLY backup (ADR-0043
      §2.1) — is installed LOCAL-ONLY, on the pool it protects. Not refused
      on this run: only the backup surface refuses (--tags backup).
      stellarindex_ch_schema_snapshot_offsite_stale tickets this host until
      a push lands. Set the target per docs/operations/v1-launch-plan.md
      row 1.12.
  when:
    - ch_schema_snapshot_enabled | default(true)
    - ch_schema_snapshot_local_only_pubnet | default(false) | bool
    - not (ch_schema_snapshot_backup_surface_selected | default(false) | bool)

- name: Install ClickHouse schema-snapshot script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/ops/ch-schema-snapshot.sh"
    dest: /usr/local/bin/ch-schema-snapshot.sh
    owner: root
    group: root
    mode: "0755"
  when: ch_schema_snapshot_enabled | default(true)

- name: Ensure the ClickHouse schema-snapshot directory exists
  ansible.builtin.file:
    path: "{{ ch_schema_snapshot_dir | default('/var/lib/stellarindex/ch-schema-snapshot') }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: ch_schema_snapshot_enabled | default(true)

- name: Install ClickHouse schema-snapshot systemd units
  ansible.builtin.template:
    src: "systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ch-schema-snapshot.service
    - ch-schema-snapshot.timer
  register: ch_schema_snapshot_units
  when: ch_schema_snapshot_enabled | default(true)

# Enabled by default, unlike restore-drill.timer: this is seconds of
# metadata queries and megabytes of output, so the Phase-A capacity
# argument does not apply — and a backup that ships disabled is exactly
# what ADR-0043 was written after.
- name: Enable + start the ClickHouse schema-snapshot timer
  ansible.builtin.systemd:
    name: ch-schema-snapshot.timer
    enabled: true
    state: started
    daemon_reload: "{{ ch_schema_snapshot_units is changed }}"
  when:
    - ch_schema_snapshot_enabled | default(true)
    # check-mode guard — see the pgBackRest timer note above.
    - not (ansible_check_mode and ch_schema_snapshot_units is changed)

# ─── ClickHouse schema DRIFT check (C6-008 / C6-003) ─────────────────
# The snapshot above records what the live schema IS. Nothing recorded
# whether it is what the repo SAYS it should be. Tier-1 lake DDL is
# hand-applied — there is no ClickHouse migration runner the way
# migrations/ + golang-migrate cover Postgres — so a hand ALTER on r1,
# or a table the repo declares that was never created, produced no
# signal at all. A re-derive against an ORDER BY that differs from the
# one the repo assumes does not error; it writes a mis-sorted table.
#
# The repo's founding DDL has to be ON the host for the comparison, so
# tier1_schema.sql is shipped alongside the script rather than read out
# of a checkout that may not exist there.

- name: Install ClickHouse schema-drift check script
  ansible.builtin.copy:
    src: ch-schema-drift.sh
    dest: /usr/local/bin/ch-schema-drift.sh
    owner: root
    group: root
    mode: "0755"
  when: ch_schema_drift_enabled | default(true)

- name: Ensure the shared stellarindex data directory exists
  ansible.builtin.file:
    path: /usr/local/share/stellarindex
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ch_schema_drift_enabled | default(true)

- name: Ship the repo's Tier-1 lake DDL as the drift check's intent side
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../deploy/clickhouse/tier1_schema.sql"
    dest: "{{ ch_schema_drift_intent | default('/usr/local/share/stellarindex/tier1_schema.sql') }}"
    owner: root
    group: root
    mode: "0644"
  when: ch_schema_drift_enabled | default(true)

- name: Install ClickHouse schema-drift systemd units
  ansible.builtin.template:
    src: "systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ch-schema-drift.service
    - ch-schema-drift.timer
  register: ch_schema_drift_units
  when: ch_schema_drift_enabled | default(true)

- name: Enable + start the ClickHouse schema-drift timer
  ansible.builtin.systemd:
    name: ch-schema-drift.timer
    enabled: true
    state: started
    daemon_reload: "{{ ch_schema_drift_units is changed }}"
  when:
    - ch_schema_drift_enabled | default(true)
    # check-mode guard — see the pgBackRest timer note above.
    - not (ansible_check_mode and ch_schema_drift_units is changed)

# ─── Restore-drill (audit-2026-07-23 REL-backup-restore) ──────────────
# CS-110: a backup that has never been restored is a hope, not a
# backup. scripts/ops/restore-drill.sh already exists (non-destructive,
# self-contained — see its own header) and the "restore-drill" ZFS
# dataset is already provisioned (defaults/main.yml zfs_datasets), but
# nothing installed or scheduled it. Wire it up here.
#
# The whole restore-drill family carries `tags: [ops-jobs]` (2026-09-04):
# the documented apply for scheduled ops units is `--tags ops-jobs`, and
# a block outside that tag is rendered by nothing on such a run. The
# script is tagged with the units because the off-site drill below needs
# THIS script — the per-repo textfile, the `repo` label and the
# one-drill-at-a-time lock all ride in it; the units alone would run the
# old copy and write an un-labelled series the off-site alert cannot see.
# Untagged behaviour is unchanged: a plain run still includes all of it.
- name: Install restore-drill script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/ops/restore-drill.sh"
    dest: /usr/local/bin/restore-drill.sh
    owner: root
    group: root
    mode: "0755"
  when: pgbackrest_backup_enabled | default(true)
  tags: [ops-jobs]

- name: Install restore-drill systemd units
  ansible.builtin.template:
    src: "systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - restore-drill.service
    - restore-drill.timer
  register: restore_drill_units
  when: pgbackrest_backup_enabled | default(true)
  tags: [ops-jobs]

- name: Reload systemd for restore-drill units
  ansible.builtin.systemd:
    daemon_reload: true
  when: restore_drill_units is changed
  tags: [ops-jobs]

# 2026-07-27: ENABLED. The condition the note below gated on has
# cleared — the galexie trim took the pool from ~94% to 85% and the
# drill volume (data/postgres) now has 2,657 GB free against the
# script's MIN_FREE_GB=200 floor. Cadence is MONTHLY (first Saturday,
# 04:00 UTC) per ADR-0043 §1/§3. This closes the "restore-drill timer
# re-enabled" half of the v1 launch plan's DR gate; the drill's own
# precondition check still refuses (exit 2, uncounted) if free space
# ever regresses, so enabling is safe under capacity pressure.
#
# Original deferral, kept for the record: R1 was mid Phase-A capacity
# relief (ZFS pool ~94% full,
# docs/operations/runbooks/phase-a-capacity-relief-2026-07-18.md) when
# this landed, and starting a NEW heavy recurring job while capacity
# was that tight was an operator call.
- name: Enable + start the restore-drill timer
  ansible.builtin.systemd:
    name: restore-drill.timer
    enabled: true
    state: started
    daemon_reload: true
  when: pgbackrest_backup_enabled | default(true)
  tags: [ops-jobs]

# ─── OFF-SITE restore-drill, repo2 (2026-09-04) ───────────────────────
# The timer above proves repo1 — the LOCAL repo, on the same disks as the
# database, which dies with the pool. repo2 (encrypted S3) is the copy DR
# actually depends on, and it had been restored exactly once, by hand
# (2026-09-03: restore 2813 s, ~269 GB from S3 for ~$24 of egress, 0
# failures, ~47 min RTO against ~9 min from repo1). Nothing scheduled the
# next one and nothing would have noticed if it never ran. This block
# schedules it monthly on the 15th — never the same day as the repo1
# drill, and the script holds a lock so a hand-run cannot land beside
# either — and stellarindex_restore_drill_offsite_stale tickets when
# last_success_unix{repo="2"} is older than 35 days or absent.
#
# Gated on restore_drill_offsite_enabled (defaults/main.yml): a repo2
# bucket must be configured, or the drill can only ever refuse.
- name: Install + enable the off-site restore-drill (repo2 configured)
  tags: [ops-jobs]
  when: restore_drill_offsite_enabled | bool
  block:
    - name: Install restore-drill-offsite systemd units
      ansible.builtin.template:
        src: "systemd/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - restore-drill-offsite.service
        - restore-drill-offsite.timer
      register: restore_drill_offsite_units

    - name: Enable + start the restore-drill-offsite timer
      ansible.builtin.systemd:
        name: restore-drill-offsite.timer
        enabled: true
        state: started
        daemon_reload: true
      when:
        # check-mode guard — see the pgBackRest timer note above.
        - not (ansible_check_mode and restore_drill_offsite_units is changed)

    # Both drill units stay UNDER the catch-all
    # stellarindex_systemd_unit_failed (they are deliberately NOT in
    # scripts/ci/unit-failed-dedicated.baseline): the 226/NAMESPACE class
    # that hid this drill for months — a unit that never reaches ExecStart
    # — writes no metric, so the catch-all's 15 min is the only fast
    # signal for it; the staleness tickets would take 35–40 days. The cost
    # of keeping it is that a REFUSAL (exit 2) also leaves the oneshot in
    # `failed`, and that state is sticky until someone clears it — a
    # monthly unit would carry the ticket for a month. The remove block
    # below already clears it; the install path did not, so a converge
    # left a stale refusal ticketing. Clear it here too, on both drills:
    # the run's real verdict is in the evidence log and the textfile
    # metric, not in the unit's residual state, and an apply is an
    # operator standing at the box.
    - name: Clear a stale failed state left by an earlier drill refusal
      ansible.builtin.command:
        cmd: "systemctl reset-failed {{ item }}"
      loop:
        - restore-drill.service
        - restore-drill-offsite.service
      changed_when: false
      failed_when: false

# Converge a host that lost its repo2 (or never had one): Ansible does not
# remove what it stops templating, and an off-site drill timer with no
# off-site repo fires monthly into a precondition refusal — a unit list
# that reads as coverage. Tagged with the install block so `--tags
# ops-jobs` converges either way; idempotent on a host that never had it.
- name: Remove the off-site restore-drill where repo2 is not configured
  tags: [ops-jobs]
  when: not (restore_drill_offsite_enabled | bool)
  block:
    - name: Stop + disable the restore-drill-offsite timer
      ansible.builtin.systemd:
        name: restore-drill-offsite.timer
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove restore-drill-offsite unit files
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - restore-drill-offsite.timer
        - restore-drill-offsite.service
      notify: Reload systemd

    - name: Clear the failed state left by earlier off-site drill runs
      ansible.builtin.command:
        cmd: systemctl reset-failed restore-drill-offsite.service
      changed_when: false
      failed_when: false

# ── Converge a host that had backups enabled before ──────────────────
# Ansible does not remove what it merely stops templating. A host whose
# inventory flips pgbackrest_backup_enabled to false — or one provisioned
# before it was set, which is how both test nets ended up here — keeps the
# timer enabled and keeps firing it nightly. pgBackRest itself is not
# installed by this role at all (there is no apt task for it anywhere), so
# on such a host every firing exits 127 and leaves a failed unit:
#
#   pgbackrest-backup.service: Main process exited, code=exited, status=127
#
# Worse than the noise: a backup timer that exists but cannot run reads as
# "backups are configured" to anyone glancing at the unit list. Remove it
# so the absence of backups is honest and visible.
- name: Remove the pgBackRest backup + restore-drill timers where backups are disabled
  when: not (pgbackrest_backup_enabled | default(true))
  block:
    - name: Stop + disable pgBackRest backup and restore-drill timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - pgbackrest-backup.timer
        - pgbackrest-backup.service
        - restore-drill.timer
      failed_when: false

    - name: Remove pgBackRest backup unit files + wrapper
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/pgbackrest-backup.timer
        - /etc/systemd/system/pgbackrest-backup.service
        - /usr/local/bin/pgbackrest-backup.sh
      notify: Reload systemd

    - name: Clear the failed state left by earlier pgBackRest backup runs
      ansible.builtin.command:
        cmd: systemctl reset-failed pgbackrest-backup.service
      changed_when: false
      failed_when: false
