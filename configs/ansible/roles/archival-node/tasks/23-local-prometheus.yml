---
# Local single-host Prometheus.
#
# /v1/status derives background-service liveness from
# PrometheusStatusBackend.Heartbeats(). Without a Prometheus the query errors,
# every service grades `unknown` and rollupOverall reports `degraded`. That
# conservatism is deliberate (never claim "ok" about something unobserved), so
# the fix is to make the observation possible. `api.prometheus_url` already
# points at http://localhost:9090, so the API needs no restart.
#
# Not playbooks/monitoring.yml: that and roles/prometheus are the MULTI-HOST
# shape (01-preflight.yml asserts a two-host `prometheus_pair` group and
# installs a pinned tarball), which a single-host inventory fails. This path
# mirrors r1: the distro package (/usr/bin/prometheus, prometheus.service) with
# a scrape config of localhost targets.
#
# Alerting is out on purpose (see run_local_prometheus in defaults/main.yml and
# templates/local-prometheus.yml.j2): the status endpoint needs only the scrape
# layer, and Incidents() reads the `ALERTS` series, which is empty without rules.
#
# Gated on `run_local_prometheus` (default false; r1 keeps its out-of-band
# stack) with its own tag, so it applies alone:
#
#   ansible-playbook -i inventory/testnet.yml playbooks/archival-node.yml \
#     -e secrets_file=../inventory/testnet.secrets.yml \
#     --tags local-prometheus --check --diff
#   ansible-playbook -i inventory/testnet.yml playbooks/archival-node.yml \
#     -e secrets_file=../inventory/testnet.secrets.yml --tags local-prometheus

# `prometheus` comes from `universe` (jammy, noble), the same source as the
# exporters in 16-prometheus-exporters.yml. It brings /usr/bin/promtool, which
# the config task below validates against.
- name: Install the prometheus Debian package
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: true
    cache_valid_time: 3600

# `--check --diff` is the documented review path, but on a host without the
# package check mode never installs it, /etc/prometheus stays absent and
# copy/template fail hard on the missing directory. Stat it once so the tasks
# that write inside package-created directories preview-skip in that case.
- name: Stat the package-owned config dir (dry-run guard)
  ansible.builtin.stat:
    path: /etc/prometheus
  register: local_prom_confdir
  changed_when: false

- name: Explain the reduced preview on a host without the package
  when:
    - ansible_check_mode
    - not local_prom_confdir.stat.exists
  ansible.builtin.debug:
    msg: >-
      --check: /etc/prometheus does not exist because check mode did not
      really install the prometheus package, so the scrape config and the
      systemd memory drop-in cannot be previewed on this run. Everything
      else previews normally; re-run --check --diff after the first real
      apply to review those two files.

# /etc/prometheus/prometheus.yml is a dpkg conffile; overwriting it matches
# r1 (configs/prometheus/README.md), and unattended-upgrades runs
# --force-confold so upgrades keep it. Ownership matches the package.
#
# `validate` runs promtool on the staged file before it is moved into place, so
# a malformed render cannot take the running Prometheus down. Ansible skips
# validate under --check.
- name: Template the Prometheus scrape config
  when: local_prom_confdir.stat.exists or not ansible_check_mode
  ansible.builtin.template:
    src: local-prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/bin/promtool check config %s"
  notify: Restart prometheus

# Flags the Debian unit appends via `EnvironmentFile=/etc/default/prometheus`
# as `$ARGS`. The unit's ExecStart already supplies --config.file and
# --storage.tsdb.path, so only overrides belong here.
- name: Template /etc/default/prometheus (bind + retention flags)
  ansible.builtin.copy:
    dest: /etc/default/prometheus
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (archival-node role / 23-local-prometheus.yml).
      # Sourced by the Debian-shipped prometheus.service via EnvironmentFile;
      # appended to its ExecStart as $ARGS.
      #
      # Loopback bind: the only consumer is the API on this same box
      # (api.prometheus_url = http://localhost:9090). 9090 is in no
      # inventory's internal_allow_ports, so nftables blocks it anyway —
      # this is the defence-in-depth half, matching the exporters.
      # Operator UI access is `ssh -L 9090:localhost:9090 <host>`.
      #
      # Retention is bounded on BOTH axes so neither a long-lived host
      # nor a sudden series explosion can fill the disk; whichever limit
      # trips first evicts.
      ARGS="--web.listen-address={{ local_prometheus_listen }} --storage.tsdb.retention.time={{ local_prometheus_retention_time }} --storage.tsdb.retention.size={{ local_prometheus_retention_size }}"
  notify: Restart prometheus

- name: Ensure the prometheus systemd drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# The memory cap protects the VM Prometheus shares: testnet.yml records an OOM
# where ClickHouse plus captive-core exhausted committable memory and crashed
# the API despite free RAM. A monitor that can starve what it monitors is worse
# than none. MemoryHigh reclaims and throttles first; MemoryMax is the hard
# stop.
- name: Cap prometheus memory (systemd drop-in)
  # Same dry-run guard as the scrape config: check mode never creates the
  # drop-in dir.
  when: local_prom_confdir.stat.exists or not ansible_check_mode
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service.d/10-memory-cap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (archival-node role / 23-local-prometheus.yml).
      [Service]
      MemoryHigh={{ local_prometheus_memory_high }}
      MemoryMax={{ local_prometheus_memory_max }}
  notify: Restart prometheus

- name: Enable + start prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true
  # In check mode the package was never installed, so systemd cannot find the
  # unit and the task would always fail the preview.
  when: not ansible_check_mode

# Flush the restart before verifying: otherwise the check below reads the
# previous config's targets (on first install, the package's stock
# prometheus.yml). flush_handlers has no per-handler form, so it also runs any
# other pending handler; harmless because this is the last import in the role.
# Skipped with the rest of the file when run_local_prometheus is false.
- name: Apply pending prometheus restarts before verifying
  ansible.builtin.meta: flush_handlers

# The bind + retention flags apply only if the packaged unit's ExecStart ends
# in `$ARGS` from /etc/default/prometheus (Debian's shape). If that silently
# fails the box keeps the 15-day default and a public bind, so ask the process:
# /api/v1/status/flags reports the EFFECTIVE values. It answers on loopback
# either way, so a failure here is a real finding, not a connection error.
- name: Read the effective Prometheus flags
  when: not ansible_check_mode
  ansible.builtin.uri:
    url: "http://{{ local_prometheus_listen }}/api/v1/status/flags"
    return_content: true
  register: local_prom_flags
  changed_when: false
  retries: 10
  delay: 2
  until: local_prom_flags.status is defined and local_prom_flags.status == 200

- name: Assert the bind + retention flags actually applied
  when: not ansible_check_mode
  # Compared by DURATION, never spelling: Prometheus re-prints a duration in the
  # largest unit that divides it exactly, so a configured `7d` returns as `1w`
  # and a string compare fails a correctly applied flag. (r1's 30d survives the
  # round trip, so only a 7d host exposes this.) `ms` is not in the unit table:
  # sub-second retention is meaningless, and a duration carrying one compares
  # unequal, the safe direction.
  vars:
    prom_duration_units: { y: 31536000, w: 604800, d: 86400, h: 3600, m: 60, s: 1 }
    prom_retention_effective_s: >-
      {%- set ns = namespace(total=0) -%}
      {%- for n, unit in ((local_prom_flags.json.data['storage.tsdb.retention.time'] | default('') | string) | regex_findall('([0-9]+)(y|w|d|h|m|s)')) -%}
      {%- set ns.total = ns.total + (n | int) * prom_duration_units[unit] -%}
      {%- endfor -%}
      {{ ns.total }}
    prom_retention_intended_s: >-
      {%- set ns = namespace(total=0) -%}
      {%- for n, unit in ((local_prometheus_retention_time | string) | regex_findall('([0-9]+)(y|w|d|h|m|s)')) -%}
      {%- set ns.total = ns.total + (n | int) * prom_duration_units[unit] -%}
      {%- endfor -%}
      {{ ns.total }}
  ansible.builtin.assert:
    that:
      - prom_retention_intended_s | int > 0
      - prom_retention_effective_s | int == prom_retention_intended_s | int
      - local_prometheus_listen in (local_prom_flags.json.data['web.listen-address'] | default('') | string)
    fail_msg: >-
      /etc/default/prometheus did not reach the process: effective
      web.listen-address={{ local_prom_flags.json.data['web.listen-address'] | default('?') }},
      storage.tsdb.retention.time={{ local_prom_flags.json.data['storage.tsdb.retention.time'] | default('?') }}
      ({{ prom_retention_effective_s }}s) against the intended
      {{ local_prometheus_retention_time }} ({{ prom_retention_intended_s }}s).
      The packaged prometheus.service is expected to source
      EnvironmentFile=/etc/default/prometheus and append $ARGS to its
      ExecStart; check `systemctl cat prometheus`. Until this holds the
      host is on the packaging defaults (15 d retention, 0.0.0.0 bind).

# Prove the scrape layer on the host, as 22-clickhouse-exporter.yml does for
# its hot-reloaded endpoint. Asserts EXACTLY the query /v1/status runs, and that
# the returned job set equals the stellarindex-* jobs this inventory declares
# (a host with run_aggregator: false passes on {api, indexer}).
#
# This checks the SCRAPE, not the services: Prometheus records `up 0` for an
# unreachable target, so the series exists either way. Skipped under --check:
# nothing was written, so `until` could never hold.
- name: Verify Prometheus has scraped the jobs /v1/status reads
  when:
    - not ansible_check_mode
    - run_stellarindex | bool
  vars:
    _si_jobs: >-
      {{ local_prometheus_scrape_jobs | map(attribute='job')
         | select('match', '^stellarindex-') | list | sort }}
  ansible.builtin.uri:
    url: "http://{{ local_prometheus_listen }}/api/v1/query"
    method: POST
    body_format: form-urlencoded
    body:
      query: 'timestamp(up{job=~"stellarindex-indexer|stellarindex-aggregator|stellarindex-api"})'
    return_content: true
  register: local_prom_up
  changed_when: false
  retries: 20
  delay: 3
  until: >-
    local_prom_up.status is defined
    and local_prom_up.status == 200
    and (local_prom_up.json.data.result | default([])
         | map(attribute='metric.job') | list | sort) == _si_jobs
