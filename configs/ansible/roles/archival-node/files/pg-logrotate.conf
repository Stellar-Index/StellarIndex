# Managed by ansible (archival-node role / 15-log-discipline.yml).
# Read only by pg-logrotate.service (hourly). It lives outside
# /etc/logrotate.d on purpose: a second config there matching the same
# glob makes the daily logrotate run refuse both as "duplicate log entry".
#
# Stock Debian postgresql-common policy plus the one line the stock file
# lacks: `maxsize`, which is what gives the hourly run something to enforce.
/var/log/postgresql/*.log {
       weekly
       maxsize 500M
       rotate 10
       copytruncate
       delaycompress
       compress
       notifempty
       missingok
       su root root
}
