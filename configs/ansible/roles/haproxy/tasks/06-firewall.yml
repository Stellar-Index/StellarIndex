---
# F-1278 fix (codex audit-2026-05-13): render the COMPLETE
# /etc/nftables.conf for this host. Previously the role wrote a
# drop-in inside a separate `inet haproxy_filter` table with
# `policy accept`, which composed unpredictably with the repo's
# default-drop base chain. On HA-dedicated LB hosts the haproxy
# role now owns the whole-host firewall.
#
# Public ingress on 80/443; SSH narrowed to allow-list CIDRs; VRRP
# between LB peers; stats endpoint stays loopback-only (no rule).
#
# SL10: haproxy_internal_cidrs / haproxy_allowed_ssh_cidrs entries
# containing ':' were rendered into ipv4_addr-only sets, so an IPv6
# CIDR silently dropped out of the ruleset instead of being enforced.
# Mirror ipv6_addr sets fix that (same pattern as SL12 in the loki role).

- name: ensure nftables installed
  apt:
    name: nftables
    state: present

- name: render full /etc/nftables.conf (default-drop + 80/443 + vrrp + ssh)
  copy:
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
    content: |
      #!/usr/sbin/nft -f
      # Managed by ansible (haproxy role) — DO NOT EDIT BY HAND.
      # F-1278: complete ruleset (was a no-op drop-in until 2026-05-13).
      flush ruleset

      table inet filter {
        set internal_v4 {
          type ipv4_addr
          flags interval
          elements = {
      {% for cidr in haproxy_internal_cidrs if ':' not in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        set ssh_allowed_v4 {
          type ipv4_addr
          flags interval
          elements = {
      {% for cidr in haproxy_allowed_ssh_cidrs if ':' not in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        set internal_v6 {
          type ipv6_addr
          flags interval
          elements = {
      {% for cidr in haproxy_internal_cidrs if ':' in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        set ssh_allowed_v6 {
          type ipv6_addr
          flags interval
          elements = {
      {% for cidr in haproxy_allowed_ssh_cidrs if ':' in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        # Per-source SSH rate-limit state; bounded and expiring so an
        # internet-wide scan cannot grow it without limit.
        set ssh_ratelimit_v4 {
          type ipv4_addr
          size 65535
          flags dynamic,timeout
          timeout 5m
        }

        set ssh_ratelimit_v6 {
          type ipv6_addr
          size 65535
          flags dynamic,timeout
          timeout 5m
        }

        chain input {
          type filter hook input priority filter; policy drop;

          ct state established,related accept
          ct state invalid drop

          iif lo accept

          ip protocol icmp limit rate 10/second accept
          ip6 nexthdr ipv6-icmp limit rate 10/second accept

          # SSH is limited per source address: one shared bucket let any single
          # scanner starve every other new connection into `policy drop`. If the
          # set is full the update does not match and the accept below still applies.
          tcp dport 22 ip saddr @ssh_allowed_v4 ct state new update @ssh_ratelimit_v4 { ip saddr limit rate over 30/minute burst 10 packets } drop comment "ssh-ratelimit"
          tcp dport 22 ip saddr @ssh_allowed_v4 ct state new accept comment "ssh"
          tcp dport 22 ip6 saddr @ssh_allowed_v6 ct state new update @ssh_ratelimit_v6 { ip6 saddr limit rate over 30/minute burst 10 packets } drop comment "ssh-v6-ratelimit"
          tcp dport 22 ip6 saddr @ssh_allowed_v6 ct state new accept comment "ssh-v6"

          # Public ingress.
          tcp dport { 80, 443 } accept comment "haproxy-public"

          # VRRP between peer LB hosts.
          ip protocol vrrp ip saddr @internal_v4 accept comment "vrrp-internal"
          ip6 nexthdr vrrp ip6 saddr @internal_v6 accept comment "vrrp-internal-v6"

          # Stats endpoint is bound to 127.0.0.1; covered by iif lo.

          limit rate 1/second log prefix "nft-drop: " flags all
        }

        chain forward {
          type filter hook forward priority filter; policy drop;
        }

        chain output {
          type filter hook output priority filter; policy accept;
        }
      }
  notify: "firewall rules changed"

- name: ensure nftables enabled + running
  systemd:
    name: nftables
    state: started
    enabled: true

- name: remove legacy 42-haproxy.conf drop-in (was no-op)
  file:
    path: /etc/nftables.d/42-haproxy.conf
    state: absent
  notify: "firewall rules changed"
