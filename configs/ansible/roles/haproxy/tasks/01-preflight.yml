---
# Sanity-check the host before any install. Cheap, fail-fast.

- name: assert OS is Ubuntu 22.04 or 24.04
  assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version in ["22.04", "24.04"]
    fail_msg: >-
      haproxy role supports Ubuntu 22.04 / 24.04 only;
      detected {{ ansible_distribution }} {{ ansible_distribution_version }}

- name: assert host is in the haproxy_lb inventory group
  assert:
    that:
      - inventory_hostname in groups['haproxy_lb']
    fail_msg: >-
      this role must be applied against hosts in the
      haproxy_lb group (see role README inventory model)

- name: assert haproxy_lb has exactly 2 hosts
  assert:
    that:
      - groups['haproxy_lb'] | length == 2
    fail_msg: >-
      haproxy role assumes a 2-LB-host topology (per ha-plan §3.1);
      detected {{ groups['haproxy_lb'] | length }} hosts

# 06-firewall.yml renders the WHOLE /etc/nftables.conf (`flush ruleset`), as
# archival-node does: on one host each run would drop the other's ports.
- name: assert host is not an archival node (this role owns the host firewall)
  assert:
    that:
      - inventory_hostname not in groups['archival_nodes'] | default([])
    fail_msg: >-
      {{ inventory_hostname }} is in archival_nodes. The haproxy role replaces
      the host's entire nftables ruleset, and archival-node rewrites it back
      without VRRP and the VIP's 80/443. Run it on dedicated haproxy_lb hosts only.
  tags: [always]

- name: assert keepalived priorities elect the MASTER
  vars:
    _lb_priorities: >-
      {{ groups['haproxy_lb'] | map('extract', hostvars)
         | map(attribute='keepalived_priority', default=keepalived_priority) | map('int') | list }}
  assert:
    that:
      - keepalived_initial_state is not defined
      - keepalived_preempt_delay is not defined
      - _lb_priorities | unique | length == 2
      - (_lb_priorities | max) - (_lb_priorities | min) < (keepalived_pool_weight | int)
    fail_msg: >-
      Both LBs start as BACKUP and priority elects the MASTER: drop
      keepalived_initial_state and keepalived_preempt_delay (replaced by
      keepalived_pool_recovery_seconds) from the inventory, and give the LBs
      distinct keepalived_priority values less than keepalived_pool_weight
      ({{ keepalived_pool_weight }}) apart, or an empty api_pool on the MASTER
      never moves the VIP. Got {{ _lb_priorities }}.

- name: assert stellarindex_api inventory group is populated
  assert:
    that:
      - "'stellarindex_api' in groups"
      - groups['stellarindex_api'] | length >= 1
    fail_msg: >-
      stellarindex_api inventory group is required (HAProxy needs
      a backend pool to route to)

- name: assert vault contents present
  assert:
    that:
      - haproxy_vip is defined and haproxy_vip | length > 0
      - keepalived_vrrp_password is defined and keepalived_vrrp_password | length > 0
    fail_msg: >-
      haproxy_vip and keepalived_vrrp_password must be set
      (typically from inventory/<region>.secrets.yml via
      ansible-vault). See role README §Prerequisites.

- name: warn on >8-char keepalived_vrrp_password
  debug:
    msg: >-
      WARNING: keepalived truncates auth_pass beyond 8 bytes
      silently. Current password length is
      {{ keepalived_vrrp_password | length }} chars; only the
      first 8 will be used. Shorten to <=8 chars to avoid
      operator confusion.
  when: keepalived_vrrp_password | length > 8

# Required for HAProxy to bind to a VIP not yet assigned to this
# host (keepalived may still consider the other host MASTER at
# bind time). Without this, haproxy fails at startup with
# "cannot bind socket: Cannot assign requested address."
- name: tune kernel for VIP binding (net.ipv4.ip_nonlocal_bind=1)
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_set: yes
    state: present
    reload: yes

- name: ensure haproxy + keepalived users exist
  user:
    name: "{{ item }}"
    system: yes
    shell: /usr/sbin/nologin
    state: present
  loop:
    - haproxy
