---
- name: reload haproxy
  systemd:
    name: haproxy
    state: reloaded
    daemon_reload: yes
  listen: "haproxy config changed"

- name: restart keepalived
  systemd:
    name: keepalived
    state: restarted
    daemon_reload: yes
  # One LB at a time, or both release the VIP together.
  throttle: 1
  listen: "keepalived config changed"

- name: reload firewall
  systemd:
    name: nftables
    state: reloaded
  listen: "firewall rules changed"
