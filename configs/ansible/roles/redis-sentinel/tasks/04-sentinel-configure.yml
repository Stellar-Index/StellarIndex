---
# Render /etc/redis/sentinel.conf. Same idempotency rule: never
# rewrite a sentinel.conf that's already tracking a post-failover
# primary unless redis_first_run_only=false (an explicit
# re-bootstrap).

# A re-render without this line mints a new Sentinel id. The others keep
# the old one as a voter that never answers, which raises the failover
# majority above the Sentinels that are left.
- name: read the Sentinel id this host already has
  command: sed -n 's/^sentinel myid \([0-9a-f]\{40\}\)$/\1/p' /etc/redis/sentinel.conf
  register: redis_sentinel_myid
  failed_when: false
  changed_when: false

- name: render /etc/redis/sentinel.conf
  template:
    src: sentinel.conf.j2
    dest: /etc/redis/sentinel.conf
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0640"
  when: redis_render_configs | bool
  notify: "sentinel config changed"
