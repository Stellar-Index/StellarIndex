---
# F-1278 fix (codex audit-2026-05-13): render the COMPLETE
# /etc/nftables.conf for this host. Previously the role wrote a
# drop-in inside a separate `inet redis_filter` table with
# `policy accept`, which composed unpredictably with the repo's
# default-drop base chain (an `accept` verdict in one chain at
# priority -100 does NOT short-circuit a later priority-0 drop
# in another chain — netfilter evaluates every base chain in the
# hook ladder and a `drop` anywhere is final). On HA-dedicated
# hosts the redis-sentinel role now owns the whole-host firewall.

- name: ensure nftables installed
  apt:
    name: nftables
    state: present

- name: render full /etc/nftables.conf (default-drop + redis/sentinel + ssh)
  copy:
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
    content: |
      #!/usr/sbin/nft -f
      # Managed by ansible (redis-sentinel role) — DO NOT EDIT BY HAND.
      # F-1278: complete ruleset (was a no-op drop-in until 2026-05-13).
      flush ruleset

      table inet filter {
        set internal_v4 {
          type ipv4_addr
          flags interval
          elements = {
      {% for cidr in redis_internal_cidrs if ':' not in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        set ssh_allowed_v4 {
          type ipv4_addr
          flags interval
          elements = {
      {% for cidr in redis_allowed_ssh_cidrs if ':' not in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        # SL26: IPv6 CIDRs were silently filtered out of the v4-only sets
        # above and never placed in any set, so an operator adding an
        # IPv6 CIDR to redis_internal_cidrs/redis_allowed_ssh_cidrs got no
        # error and no rule — the entry just vanished. Mirror both sets
        # for v6; empty is valid nftables and is today's default (no v6
        # CIDRs configured).
        set internal_v6 {
          type ipv6_addr
          flags interval
          elements = {
      {% for cidr in redis_internal_cidrs if ':' in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        set ssh_allowed_v6 {
          type ipv6_addr
          flags interval
          elements = {
      {% for cidr in redis_allowed_ssh_cidrs if ':' in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        # Per-source SSH rate-limit state; bounded and expiring so an
        # internet-wide scan cannot grow it without limit.
        set ssh_ratelimit_v4 {
          type ipv4_addr
          size 65535
          flags dynamic,timeout
          timeout 5m
        }

        set ssh_ratelimit_v6 {
          type ipv6_addr
          size 65535
          flags dynamic,timeout
          timeout 5m
        }

        chain input {
          type filter hook input priority filter; policy drop;

          ct state established,related accept
          ct state invalid drop

          iif lo accept

          ip protocol icmp limit rate 10/second accept
          ip6 nexthdr ipv6-icmp limit rate 10/second accept

          # SSH is limited per source address: one shared bucket let any single
          # scanner starve every other new connection into `policy drop`. If the
          # set is full the update does not match and the accept below still applies.
          tcp dport 22 ip saddr @ssh_allowed_v4 ct state new update @ssh_ratelimit_v4 { ip saddr limit rate over 30/minute burst 10 packets } drop comment "ssh-ratelimit"
          tcp dport 22 ip saddr @ssh_allowed_v4 ct state new accept comment "ssh"
          tcp dport 22 ip6 saddr @ssh_allowed_v6 ct state new update @ssh_ratelimit_v6 { ip6 saddr limit rate over 30/minute burst 10 packets } drop comment "ssh-v6-ratelimit"
          tcp dport 22 ip6 saddr @ssh_allowed_v6 ct state new accept comment "ssh-v6"

          # Redis data plane + Sentinel control plane, internal-only.
          tcp dport { {{ redis_port }}, {{ redis_sentinel_port }} } ip saddr @internal_v4 accept comment "redis-sentinel-internal"
          tcp dport { {{ redis_port }}, {{ redis_sentinel_port }} } ip6 saddr @internal_v6 accept comment "redis-sentinel-internal-v6"
          tcp dport { {{ redis_port }}, {{ redis_sentinel_port }} } ip saddr 127.0.0.1 accept comment "redis-sentinel-loopback"

          # redis_exporter scrape (Prometheus, internal-only).
          tcp dport {{ redis_exporter_listen_port }} ip saddr @internal_v4 accept comment "redis-exporter-internal"
          tcp dport {{ redis_exporter_listen_port }} ip6 saddr @internal_v6 accept comment "redis-exporter-internal-v6"

          limit rate 1/second log prefix "nft-drop: " flags all
        }

        chain forward {
          type filter hook forward priority filter; policy drop;
        }

        chain output {
          type filter hook output priority filter; policy accept;
        }
      }
  notify: "firewall rules changed"

- name: ensure nftables enabled + running
  systemd:
    name: nftables
    state: started
    enabled: true

# Clean up the legacy F-1278-broken drop-in if it still exists on
# previously-deployed hosts. Safe no-op on fresh deploys.
- name: remove legacy 41-redis-sentinel.conf drop-in (was no-op)
  file:
    path: /etc/nftables.d/41-redis-sentinel.conf
    state: absent
  notify: "firewall rules changed"
