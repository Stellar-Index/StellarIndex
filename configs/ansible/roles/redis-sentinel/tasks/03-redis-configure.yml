---
# Render /etc/redis/redis.conf. Idempotency-aware: on re-runs
# against an already-running cluster, ask Sentinel who the
# current primary is — never overwrite a post-failover replicaof
# directive when redis_first_run_only=true.

- name: detect current primary via Sentinel (skip on first run)
  command: >-
    redis-cli -h {{ ansible_host }} -p {{ redis_sentinel_port }}
    -a "{{ redis_password }}" --no-auth-warning
    SENTINEL get-master-addr-by-name {{ redis_sentinel_master_name }}
  register: redis_sentinel_state
  failed_when: false
  changed_when: false
  no_log: true

- name: derive effective primary host (Sentinel-aware)
  set_fact:
    redis_effective_primary_host: >-
      {%- if redis_sentinel_state.rc == 0 and redis_sentinel_state.stdout_lines | length >= 1 -%}
      {{ redis_sentinel_state.stdout_lines[0] }}
      {%- else -%}
      {{ hostvars[groups['redis_cluster']
          | map('extract', hostvars)
          | selectattr('redis_role', 'equalto', 'primary')
          | map(attribute='inventory_hostname') | first].ansible_host }}
      {%- endif -%}

- name: render /etc/redis/redis.conf
  template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0640"
  when: not redis_first_run_only or redis_sentinel_state.rc != 0
  notify: "redis config changed"

# F-1213 (audit-2026-05-12): when redis_acl_lockdown is true, render
# a narrow ACL file that disables the legacy default user + creates
# one application user with scoped commands + key patterns. The
# redis.conf.j2 template references this file iff the flag is set.
# Opt-in to preserve backward compat for deployments that aren't
# ready to migrate; R1 should flip this on pre-flip.
- name: render /etc/redis/users.acl (lockdown)
  template:
    src: users.acl.j2
    dest: /etc/redis/users.acl
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0640"
  when:
    - redis_acl_lockdown | bool
    - not redis_first_run_only or redis_sentinel_state.rc != 0
  notify: "redis config changed"

# redis.conf is rendered on first run only (above), so a changed
# redis_maxmemory_policy never reaches a running cluster through the
# template. Apply it live on every node and persist it with CONFIG
# REWRITE: an allkeys-* policy left running evicts the TTL-less
# credential records (GH #1317). Under ACL lockdown only the sentinel
# user holds CONFIG SET/REWRITE.
- name: enforce maxmemory-policy on the running instance
  shell: |
    set -eu
    cli() {
      redis-cli -h {{ ansible_host }} -p {{ redis_port }} \
        {{ ('--user ' ~ redis_sentinel_auth_user) if (redis_acl_lockdown | bool) else '' }} \
        "$@"
    }
    current=$(cli CONFIG GET maxmemory-policy | sed -n 2p)
    if [ "$current" = "{{ redis_maxmemory_policy }}" ]; then
      echo unchanged
      exit 0
    fi
    [ "$(cli CONFIG SET maxmemory-policy {{ redis_maxmemory_policy }})" = OK ]
    [ "$(cli CONFIG REWRITE)" = OK ]
    echo changed
  args:
    executable: /bin/bash
  environment:
    # redis-cli reads the password from here, keeping it off argv.
    REDISCLI_AUTH: "{{ redis_password }}"
  register: redis_policy_enforce
  changed_when: redis_policy_enforce.stdout == 'changed'
  when: redis_sentinel_state.rc == 0
  no_log: true
