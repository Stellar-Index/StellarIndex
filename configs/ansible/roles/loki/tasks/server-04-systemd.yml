---
- name: render loki systemd unit
  template:
    src: loki.service.j2
    dest: /etc/systemd/system/loki.service
    mode: "0644"
  notify: "loki config changed"

- name: daemon-reload systemd
  systemd:
    daemon_reload: yes

- name: enable + start loki
  systemd:
    name: loki
    enabled: yes
    state: started

- name: wait for loki to answer /ready
  uri:
    url: "http://{{ '127.0.0.1' if loki_listen_address in ['0.0.0.0', '::'] else ('[' ~ loki_listen_address ~ ']' if ':' in loki_listen_address else loki_listen_address) }}:{{ loki_http_port }}/ready"
    status_code: 200
  register: _loki_ready
  retries: 30
  delay: 5
  until: _loki_ready.status == 200
