---
- name: render loki systemd unit
  template:
    src: loki.service.j2
    dest: /etc/systemd/system/loki.service
    mode: "0644"
  notify: "loki config changed"

- name: daemon-reload systemd
  systemd:
    daemon_reload: yes

# Without both keys Loki starts and answers /ready, then every chunk
# flush to MinIO fails. Only the key names are checked, never the values.
- name: assert /etc/default/loki carries the S3 credentials
  shell: >-
    grep -Eq '^AWS_ACCESS_KEY_ID=.+' /etc/default/loki &&
    grep -Eq '^AWS_SECRET_ACCESS_KEY=.+' /etc/default/loki
  register: _loki_creds_probe
  changed_when: false
  failed_when: false

- name: refuse to start loki without S3 credentials
  assert:
    that:
      - _loki_creds_probe.rc == 0
    fail_msg: >-
      /etc/default/loki must define AWS_ACCESS_KEY_ID and
      AWS_SECRET_ACCESS_KEY (MinIO credentials) before loki starts;
      otherwise chunk flushes fail while /ready still answers 200.

- name: enable + start loki
  systemd:
    name: loki
    enabled: yes
    state: started

# A changed config or unit restarts loki in a handler; run it now so the
# /ready wait below checks the new process, not the old one.
- name: apply pending loki restarts before the readiness check
  meta: flush_handlers

- name: wait for loki to answer /ready
  uri:
    url: "http://{{ '127.0.0.1' if loki_listen_address in ['0.0.0.0', '::'] else ('[' ~ loki_listen_address ~ ']' if ':' in loki_listen_address else loki_listen_address) }}:{{ loki_http_port }}/ready"
    status_code: 200
  register: _loki_ready
  retries: 30
  delay: 5
  until: _loki_ready.status == 200
