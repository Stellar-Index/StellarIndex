---
# F-1278 fix (codex audit-2026-05-13): render the COMPLETE
# /etc/nftables.conf for this host. Previously the role wrote a
# drop-in inside a separate `inet prometheus_filter` table with
# `policy accept`, which composed unpredictably with the repo's
# default-drop base chain. On HA-dedicated prom hosts the role
# now owns the whole-host firewall.
#
# Internal-only:
#   - 9090 (Prometheus web/scrape) — peer Prometheuses scrape each other
#   - 9093 (Alertmanager API) — peer Prometheuses deliver alerts
#   - 9094 (Alertmanager cluster gossip, TCP + UDP)
# Operators reach the web UI via SSH tunnel; SSH is the only
# inbound port allowed from the SSH allow-list CIDRs.

- name: ensure nftables installed
  apt:
    name: nftables
    state: present

- name: render full /etc/nftables.conf (default-drop + prom stack + ssh)
  copy:
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
    content: |
      #!/usr/sbin/nft -f
      # Managed by ansible (prometheus role) — DO NOT EDIT BY HAND.
      # F-1278: complete ruleset (was a no-op drop-in until 2026-05-13).
      flush ruleset

      table inet filter {
        set internal_v4 {
          type ipv4_addr
          flags interval
          elements = {
      {% for cidr in prometheus_internal_cidrs if ':' not in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        set ssh_allowed_v4 {
          type ipv4_addr
          flags interval
          elements = {
      {% for cidr in prometheus_allowed_ssh_cidrs if ':' not in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        # SL13: IPv6 CIDRs were silently filtered out of the v4-only sets
        # above and never placed in any set, so an operator adding an
        # IPv6 CIDR to prometheus_internal_cidrs/prometheus_allowed_ssh_cidrs
        # got no error and no rule — the entry just vanished. Mirror both
        # sets for v6; empty is valid nftables and is today's default
        # (no v6 CIDRs configured).
        set internal_v6 {
          type ipv6_addr
          flags interval
          elements = {
      {% for cidr in prometheus_internal_cidrs if ':' in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        set ssh_allowed_v6 {
          type ipv6_addr
          flags interval
          elements = {
      {% for cidr in prometheus_allowed_ssh_cidrs if ':' in cidr %}
            {{ cidr }}{% if not loop.last %},{% endif %}
      {% endfor %}
          }
        }

        # Per-source SSH rate-limit state; bounded and expiring so an
        # internet-wide scan cannot grow it without limit.
        set ssh_ratelimit_v4 {
          type ipv4_addr
          size 65535
          flags dynamic,timeout
          timeout 5m
        }

        set ssh_ratelimit_v6 {
          type ipv6_addr
          size 65535
          flags dynamic,timeout
          timeout 5m
        }

        chain input {
          type filter hook input priority filter; policy drop;

          ct state established,related accept
          ct state invalid drop

          iif lo accept

          ip protocol icmp limit rate 10/second accept
          ip6 nexthdr ipv6-icmp limit rate 10/second accept

          # SSH is limited per source address: one shared bucket let any single
          # scanner starve every other new connection into `policy drop`. If the
          # set is full the update does not match and the accept below still applies.
          tcp dport 22 ip saddr @ssh_allowed_v4 ct state new update @ssh_ratelimit_v4 { ip saddr limit rate over 30/minute burst 10 packets } drop comment "ssh-ratelimit"
          tcp dport 22 ip saddr @ssh_allowed_v4 ct state new accept comment "ssh"
          tcp dport 22 ip6 saddr @ssh_allowed_v6 ct state new update @ssh_ratelimit_v6 { ip6 saddr limit rate over 30/minute burst 10 packets } drop comment "ssh-v6-ratelimit"
          tcp dport 22 ip6 saddr @ssh_allowed_v6 ct state new accept comment "ssh-v6"

          # Prometheus + Alertmanager API + gossip (TCP).
          tcp dport { 9090, 9093, {{ alertmanager_cluster_listen_port }} } ip saddr @internal_v4 accept comment "prometheus-stack-tcp"
          tcp dport { 9090, 9093, {{ alertmanager_cluster_listen_port }} } ip6 saddr @internal_v6 accept comment "prometheus-stack-tcp-v6"
          # Alertmanager cluster gossip (UDP).
          udp dport {{ alertmanager_cluster_listen_port }} ip saddr @internal_v4 accept comment "alertmanager-cluster-udp"
          udp dport {{ alertmanager_cluster_listen_port }} ip6 saddr @internal_v6 accept comment "alertmanager-cluster-udp-v6"

          limit rate 1/second log prefix "nft-drop: " flags all
        }

        chain forward {
          type filter hook forward priority filter; policy drop;
        }

        chain output {
          type filter hook output priority filter; policy accept;
        }
      }
  notify: "firewall rules changed"

- name: ensure nftables enabled + running
  systemd:
    name: nftables
    state: started
    enabled: true

- name: remove legacy 43-prometheus.conf drop-in (was no-op)
  file:
    path: /etc/nftables.d/43-prometheus.conf
    state: absent
  notify: "firewall rules changed"
