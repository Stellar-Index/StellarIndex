---
# Opt-in basic auth in front of the 0.0.0.0 listener, layered on
# the firewall. No-op (file absent, flag unwired below) when
# alertmanager_basic_auth_password_hash is unset.
- name: render /etc/alertmanager/web-config.yml (basic auth)
  template:
    src: alertmanager-web-config.yml.j2
    dest: /etc/alertmanager/web-config.yml
    owner: root
    group: "{{ alertmanager_user }}"
    mode: "0640"
    # Same exporter-toolkit web config format as Prometheus.
    validate: "promtool check web-config %s"
  when: alertmanager_basic_auth_password_hash | length > 0
  notify: "alertmanager config changed"

# With basic auth unset the file stays until "restart alertmanager" has dropped
# --web.config.file: the running process re-reads it on every request.

- name: render /etc/alertmanager/alertmanager.yml
  template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    owner: root
    group: "{{ alertmanager_user }}"
    mode: "0640"
    validate: "amtool check-config %s"
  # The template inlines the pager key and webhook URLs; --diff would print them.
  diff: false
  notify: "alertmanager config changed"
