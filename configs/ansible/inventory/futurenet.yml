---
# Inventory for FUTURENET — the 2nd libvirt VM on the Frankfurt host
# (95.217.126.13). Secrets in futurenet.secrets.yml (gitignored). The VM is on
# the host's private NAT (192.168.122.20); ansible reaches it via ProxyJump
# through the host. Lean cut-down explorer, same as testnet: SDEX-only, no
# bespoke Soroban DEX/AMM, no oracles, no external markets, no aggregator/
# pricing (every asset is $0). Futurenet resets on protocol bumps — see the
# reset runbook (upgrade-reset flavor: bump core/galexie/SDK first).
all:
  vars:
    ssh_permit_root_login: "prohibit-password"
    # Supply-chain checksums (same pinned versions as r1 + node_exporter 1.8.2).
    minio_release_sha256:               "c27873d791b56d33518de11f12c5bfae4be88ebac00e12c6dd0027b08123fd80"
    mc_release_sha256:                  "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"
    pgbackrest_exporter_release_sha256: "e73a862a900ef08d697a64b6644abb078453370e8e02db75a24d8b496ea33e6d"
    node_exporter_release_sha256:       "6809dd0b3ec45fd6e992c19071d6b5253aed3ead7bf0686885a51d85c6643c66"

    region_id:           "futurenet"
    region_name:         "FSN-futurenet"
    home_domain:         "stellarindex.io"
    # Low-traffic test net on a shared 64 GB host (2 VMs) — relax the pubnet
    # 32 GB RAM floor (this VM has 20 GB).
    archival_node_min_ram_mb: 18000

    # ── THE network switch ──
    stellar_network:     "futurenet"
    catchup_mode:        "CATCHUP_RECENT"
    is_validator:        false
    node_is_validator:   "{{ is_validator }}"

    # Coherent RECENT start: galexie's captive core catches up to this ledger
    # via the futurenet dev archive and the indexer's backfill floor matches,
    # so live-only ingest has no gap. galexie_start_ledger MUST equal
    # backfill_from_ledger. Keep this CLOSE to the current archive tip (~a few
    # hundred ledgers below): galexie replays start→tip as a *buffered* catchup
    # only when the gap is small — a large gap makes captive-core do an
    # online-catchup that SKIPS to live (leaving galexie parked, never
    # exporting). Tip was ~230975 (2026-08-26). UPDATE BOTH before any full
    # role re-deploy or after a reset (ledgers restart at 1) — see the reset
    # runbook; a stale (far-behind) value strands galexie.
    galexie_start_ledger:              230400
    stellarindex_backfill_from_ledger: 230400
    stellarindex_live_seam_ledger:     0

    # Plain virtual disk — host owns storage; no in-VM ZFS.
    zfs_data_devices:    []
    zfs_data_pool_type:  ""
    zfs_data_pool_name:  ""

    run_postgres:        true
    # Codified installs (r1 has these hand-installed; a fresh test net needs
    # them from the role): ClickHouse lake + its schema, Redis (default on).
    run_clickhouse:          true
    clickhouse_apply_schema: true
    # Memory tuning for the small (20 GB) shared VM — see testnet.yml. r1's
    # strict overcommit + 72 GB ClickHouse cap starve the 20 GB VM (malloc/
    # fork fail despite free RAM). Heuristic overcommit + a 4 GB CH cap.
    vm_overcommit_memory: 0
    clickhouse_max_server_memory_usage_bytes: 4294967296   # 4 GiB
    run_stellar_core:    false
    # From-scratch bootstrap: build + install the network-aware binaries from
    # the local checkout (the task forces GOOS=linux GOARCH=amd64).
    manage_stellarindex_binaries: true
    stellarindex_apply_migrations: true
    run_galexie:         true
    # A fresh `go install` on the VM yields a different-bytes galexie than r1's
    # codified binary — skip the drift-guard asserts (N/A for a from-source
    # test-net build). galexie has no built-in futurenet preset, so its captive
    # core relies on the codified stellar_passphrases[futurenet] +
    # stellar_history_archive_urls[futurenet] (in the role defaults).
    galexie_expected_binary_sha256: ""
    galexie_expected_version_string: ""
    # Pin the captive core to a P28-capable version (futurenet leads protocol
    # bumps) so a fresh redeploy reproduces it exactly.
    stellar_core_version: "28.0.1-3508.947aad841.noble"
    run_minio:           true
    run_observability:   true
    # Host runs the public reverse proxy (one TLS point for all subdomains);
    # the VM has no public IP, so its own Caddy/LE would fail.
    run_caddy:           false

    minio_buckets:
      - "galexie-live"
      - "galexie-archive"
      - "backups"
    galexie_s3_endpoint: "http://127.0.0.1:9000"
    galexie_s3_bucket:   "galexie-live"
    galexie_s3_region:   "{{ region_id }}"

    # "Mostly an explorer": SDEX only (the native DEX exists on every network);
    # bespoke Soroban DEX/AMM + oracles + external markets + aggregator all cut.
    run_aggregator: false
    stellarindex_enabled_sources:
      - sdex
    stellarindex_sdf_reserve_accounts: []
    stellarindex_reserve_balances_stroops: {}
    stellarindex_watched_sep41_contracts: []
    # No verified-currency / market-cap surface on a test net (the default is a
    # pubnet asset list). Empty → the explorer shows assets with no USD value.
    stellarindex_watched_classic_assets: []

    # Disposable test net: pgBackRest is NOT installed by the role (there is
    # no apt task for it anywhere), and the nets are rebuilt from the reset
    # runbook rather than restored. Leaving backups "enabled" installed a
    # nightly timer whose binary is absent -> exit 127 and a failed unit
    # every night, AND a unit list that reads as though backups exist.
    # Turning it off removes the timer and makes the absence honest.
    pgbackrest_backup_enabled: false

    # Single test box — no offsite backup target yet (ack, like r1).
    pgbackrest_offsite_ack: true
    ch_schema_snapshot_offsite_ack: true
    stellarindex_clickhouse_serving_enabled: true

    prometheus_scrape_allow_cidrs: ["127.0.0.1/32"]
    # This role installs promtail but NOT Loki (r1's is a hand-install per
    # configs/loki/README.md). With no Loki on the test-net VMs, promtail
    # shipped journald into a dead localhost:3100 endpoint — log
    # aggregation that silently did nothing. Off until Loki is codified
    # and actually deployed here; journalctl remains the log surface.
    run_promtail: false
    loki_push_url: "http://localhost:3100/loki/api/v1/push"

    # MUST include the keys we connect with — the role REPLACES authorized_keys.
    admin_ssh_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPknEhtWeiFH7MRebS0X2A2JdHbmyixmpD0YaJChG/jQ Ashs-MacBook-Pro.local-04-04-2024"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFusEIOFA2VH3xvFWIMA8q60iXb1DZvDHrD21wjnv32u gh-actions-deploy@stellarindex"
    # The VM's SSH is reachable ONLY from the host bridge (ProxyJump source).
    allowed_ssh_cidrs: ["192.168.122.0/24"]
    ssh_world_open_ack: false
    # The API binds 0.0.0.0:3000 (below) so the host's Caddy can reach it over
    # the private NAT; open ONLY 3000 to internal_cidrs. The VM has no public
    # route, so this is host-NAT-only.
    stellarindex_api_listen_addr: "0.0.0.0:3000"
    internal_allow_ports:
      - { port: 3000, proto: "tcp", comment: "API — host Caddy reverse-proxies here" }

  children:
    archival_nodes:
      hosts:
        si-futurenet:
          ansible_host: "192.168.122.20"
          ansible_user: "root"
          ansible_port: 22
          ansible_ssh_private_key_file: "~/.ssh/si_deploy"
          ansible_ssh_common_args: '-o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ProxyCommand="ssh -i ~/.ssh/si_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -W %h:%p root@95.217.126.13"'
