---
# Sync the release's migrations/ tree from the controller to the host as ONE
# transfer, with explicit delete semantics. Imported by
# playbooks/deploy-binary.yml (pre_tasks) and exercised against temp dirs by
# scripts/ci/deploy-sync-test.sh.
#
# Rejected alternatives:
#   - ansible.posix.synchronize: rsync runs on the CONTROLLER and never sees
#     deploy.yml's `--ssh-common-args "-o ProxyJump=..."`, so the NAT-only
#     test-net VMs are unreachable.
#   - ansible.builtin.copy with a DIRECTORY src: O(files), one SFTP round-trip
#     plus remote checksum per file with no ControlPersist on the GH runner
#     (> 16 minutes for 291 identical files on r1), and it drops `delete`.
#
# This step is O(1) AND connection-agnostic:
#   1. Controller builds a DETERMINISTIC tar.gz of {{ local_dist_dir }}/
#      migrations/ (sorted entries, mtime 0, uid/gid 0, modes normalised to
#      0644/0755, gzip mtime 0) and prints the manifest. unarchive decides
#      "changed" with `tar --diff` (mtime/size/content), so a stable archive
#      gives changed=false on an identical re-run (the weekly drift job reads
#      that).
#   2. ansible.builtin.unarchive ships it over the SAME connection every other
#      module uses (jump-safe).
#   3. A fail-closed prune reproduces `delete: true`: files under the dest not
#      in the manifest are removed. It deletes only paths `find` enumerated
#      INSIDE the dest, refuses an empty manifest (would wipe the dir) and a
#      non-absolute dest. golang-migrate walks the dir, so a stale file from a
#      reverted/renumbered migration must not survive.
#
# Vars (the test overrides all three; deploy.yml sets none):
#   migrations_dest   - defaults to /usr/local/share/stellarindex/migrations
#   migrations_owner  - defaults to root
#   migrations_group  - defaults to root

- name: Build deterministic migrations archive on the controller
  # `run_once` + `delegate_to: localhost`: built ONCE on the runner; the
  # registered manifest is visible to every host.
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      src={{ (local_dist_dir ~ '/migrations') | quote }}
      out={{ (local_dist_dir ~ '/migrations.deploy.tar.gz') | quote }}
      if [ ! -d "$src" ]; then
        echo "migrations source dir not found on controller: $src" >&2
        exit 1
      fi
      python3 - "$src" "$out" <<'PY'
      import gzip, io, os, stat, sys, tarfile
      src, out = sys.argv[1], sys.argv[2]
      entries = []
      for root, dirs, files in os.walk(src):
          dirs.sort()
          rel_root = os.path.relpath(root, src)
          for d in dirs:
              entries.append((os.path.normpath(os.path.join(rel_root, d)), True))
          for f in sorted(files):
              entries.append((os.path.normpath(os.path.join(rel_root, f)), False))
      entries.sort()
      files_only = [rel for rel, is_dir in entries if not is_dir]
      if not files_only:
          sys.exit("refusing to build an EMPTY migrations archive from %s" % src)
      buf = io.BytesIO()
      with gzip.GzipFile(filename="", mode="wb", fileobj=buf, mtime=0) as gz:
          with tarfile.open(fileobj=gz, mode="w", format=tarfile.PAX_FORMAT) as tar:
              for rel, is_dir in entries:
                  path = os.path.join(src, rel)
                  st = os.lstat(path)
                  if stat.S_ISLNK(st.st_mode) or not (stat.S_ISDIR(st.st_mode) or stat.S_ISREG(st.st_mode)):
                      sys.exit("refusing non-regular entry in migrations dir: %s" % rel)
                  ti = tarfile.TarInfo(rel)
                  ti.mtime = 0
                  ti.uid = ti.gid = 0
                  ti.uname = ti.gname = "root"
                  if is_dir:
                      ti.type = tarfile.DIRTYPE
                      ti.mode = 0o755
                      tar.addfile(ti)
                  else:
                      ti.type = tarfile.REGTYPE
                      ti.mode = 0o644
                      ti.size = st.st_size
                      with open(path, "rb") as fh:
                          tar.addfile(ti, fh)
      tmp = out + ".tmp"
      with open(tmp, "wb") as fh:
          fh.write(buf.getvalue())
      os.replace(tmp, out)
      sys.stdout.write("".join(rel + "\n" for rel in files_only))
      PY
  register: migrations_archive
  changed_when: false
  # MUST run under --check: shell is skipped in check mode, which would leave
  # the archive unbuilt and the unarchive below failing on a missing file,
  # turning the weekly ansible-drift preview red for an unrelated reason
  # (deploy-binary.yml never runs --check; the archival-node role does).
  #
  # Safe to force: it writes ONE file into the controller's own dist directory,
  # touches no host, and is changed_when: false.
  check_mode: false
  delegate_to: localhost
  # NEVER escalate on the controller. archival-node.yml sets `become: true` for
  # the remote host and a delegated task inherits it, so ansible would try sudo
  # on the OPERATOR'S LAPTOP and die ("sudo: a password is required").
  # deploy-binary.yml sets `become: false`. The controller-side `go build` in the
  # archival-node role carries the same note.
  become: false
  run_once: true

- name: Ensure migrations dir exists on host
  ansible.builtin.file:
    path: "{{ migrations_dest | default('/usr/local/share/stellarindex/migrations') }}"
    state: directory
    owner: "{{ migrations_owner | default('root') }}"
    group: "{{ migrations_group | default('root') }}"
    mode: "0755"

- name: Sync migrations dir from controller
  # The ONE transfer. Modes/mtimes come from the archive; owner/group are
  # applied post-extract (tar --diff ignores uid/gid when owner/group are given,
  # so a re-run stays changed=false).
  ansible.builtin.unarchive:
    src: "{{ local_dist_dir }}/migrations.deploy.tar.gz"
    dest: "{{ migrations_dest | default('/usr/local/share/stellarindex/migrations') }}"
    remote_src: false
    owner: "{{ migrations_owner | default('root') }}"
    group: "{{ migrations_group | default('root') }}"

- name: Remove migrations on host that are not in the release (delete semantics)
  # Manifest arrives on STDIN (not argv — lint-ansible-tasks rule 2, and
  # 291 paths would not fit a sane command line anyway).
  ansible.builtin.shell:
    executable: /bin/bash
    stdin: "{{ migrations_archive.stdout }}"
    stdin_add_newline: true
    cmd: |
      set -euo pipefail
      dest={{ migrations_dest | default('/usr/local/share/stellarindex/migrations') | quote }}
      case "$dest" in
        /?*/*) ;;  # absolute, at least two components — never / or /usr
        *) echo "refusing to prune: dest '$dest' is not a nested absolute path" >&2; exit 1 ;;
      esac
      manifest="$(grep -v '^$' | LC_ALL=C sort -u || true)"
      if [ -z "$manifest" ]; then
        echo "refusing to prune: empty manifest (would wipe $dest)" >&2
        exit 1
      fi
      if grep -Eq '(^|/)\.\.(/|$)|^/' <<<"$manifest"; then
        echo "refusing to prune: manifest contains an unsafe path" >&2
        exit 1
      fi
      present="$(cd "$dest" && find . -mindepth 1 \( -type f -o -type l \) -print | sed 's#^\./##' | LC_ALL=C sort -u)"
      extras="$(LC_ALL=C comm -13 <(printf '%s\n' "$manifest") <(printf '%s\n' "$present") || true)"
      n=0
      while IFS= read -r rel; do
        [ -n "$rel" ] || continue
        # $rel came from find inside $dest and is relative by construction.
        rm -f -- "$dest/$rel"
        echo "removed $rel"
        n=$((n + 1))
      done <<<"$extras"
      find "$dest" -mindepth 1 -type d -empty -delete
      echo "prune: removed $n extra file(s) from $dest"
  register: migrations_prune
  changed_when: migrations_prune.stdout_lines | select('match', '^removed ') | list | length > 0
