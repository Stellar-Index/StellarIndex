---
# Deploy one binary atomically with rollback-on-failure.
# Included from playbooks/deploy-binary.yml; expects:
#   binary               — name of the binary (e.g. "stellarindex-api")
#   version              — SemVer tag being deployed
#   local_dist_dir       — controller-side path holding "<binary>-linux-amd64"
#   install_dir          — usually /usr/local/bin
#   api_port             — only consulted for stellarindex-api
#   api_health_path      — only consulted for stellarindex-api
#   health_grace_seconds — sleep before health probe
#
# Per-binary sequence:
#   1. Resolve the previously-deployed version from the sidecar file
#      /var/lib/stellarindex/deployed-versions/<binary>; if missing,
#      fall back to a timestamp (this is fine on the first ever
#      deploy via this workflow — older manual installs don't have
#      sidecar files).
#   2. Stage new binary as <binary>.new alongside live path.
#   3. Move current binary to <binary>.prev-<previous-tag>.
#   4. Atomic rename .new → live.
#   5. Write the new sidecar file.
#   6. systemctl restart <binary>.
#   7. Health probe (api: /v1/healthz; others: systemctl is-active)
#      after `health_grace_seconds`.
#   8. On failure in steps 6-7: rollback (mv .prev back, restart,
#      restore old sidecar). Playbook exits non-zero. This rolls back
#      the BINARY only — migrations already applied in this deploy's
#      pre_tasks are never reverted (CS-099; that's policy, not a gap,
#      see docs/operations/deploy-workflow.md).
#      Every rollback — this binary's and the whole-deploy one below —
#      acts on the record the forward path wrote BEFORE it touched the
#      path (`rollback_record`), and moves aside only what this run can
#      show it installed: nothing before the atomic rename, and nothing
#      it cannot put a recorded backup back into. A binary this run
#      installed for the first time has no backup: it is left installed,
#      its service stopped, and NAMED in the failure — not deleted
#      (K078).
#   9. Prune backups beyond the latest 5 to bound disk use.

- name: "[{{ binary }}] Confirm new artefact exists on controller"
  ansible.builtin.stat:
    path: "{{ local_dist_dir }}/{{ binary }}-linux-amd64"
  delegate_to: localhost
  register: src_stat

- name: "[{{ binary }}] Fail fast if controller-side artefact missing"
  ansible.builtin.assert:
    that: src_stat.stat.exists
    fail_msg: "{{ local_dist_dir }}/{{ binary }}-linux-amd64 not found on the runner"

- name: "[{{ binary }}] Ensure deployed-versions directory exists"
  ansible.builtin.file:
    path: /var/lib/stellarindex/deployed-versions
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "[{{ binary }}] Read previous deployed version from sidecar"
  ansible.builtin.slurp:
    src: "/var/lib/stellarindex/deployed-versions/{{ binary }}"
  register: sidecar
  ignore_errors: true

- name: "[{{ binary }}] Compute backup tag"
  ansible.builtin.set_fact:
    # Prefer the sidecar; fall back to a UTC timestamp so first-ever
    # deploys via this workflow still produce a unique backup name.
    backup_tag: >-
      {{ (sidecar.content | b64decode | trim) if sidecar is succeeded and sidecar.content is defined
         else 'untracked-' + ansible_date_time.iso8601_basic_short | default(lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ')) }}

- name: "[{{ binary }}] Check whether a current binary exists"
  # Read-only, and deliberately OUTSIDE the block below: the rescue reads
  # the record built from it, so it must describe THIS binary. Facts are
  # host-scoped and persist across the include_tasks loop, so a stat that
  # could be skipped by an early failure would leave the previous
  # iteration's answer in scope (K078).
  ansible.builtin.stat:
    path: "{{ install_dir }}/{{ binary }}"
  register: current_stat

# K078 (audit-2026-09-02): what a rollback may undo is what this deploy
# OBSERVED before it touched anything — never something re-derived while
# the rescue runs. The two disagree exactly when it matters: a binary this
# run installs for the FIRST time has no .prev-<tag> to go back to, and a
# rescue that assumes one deletes a healthy binary. Empty string means
# "nothing to restore", and every rollback task below is gated on it.
- name: "[{{ binary }}] Record what a rollback of this binary may undo"
  ansible.builtin.set_fact:
    rollback_record:
      live_path: "{{ install_dir }}/{{ binary }}"
      # The backup the "Backup current binary" task below will create —
      # empty when there is no current binary to back up.
      prev_path: >-
        {{ (install_dir ~ '/' ~ binary ~ '.prev-' ~ backup_tag) if current_stat.stat.exists else '' }}
      # The version the sidecar recorded before this run. Empty for an
      # untracked install (binary present, no sidecar) as well as for a
      # first install — in both cases `backup_tag` is a synthetic
      # "untracked-<timestamp>" that was never a deployed version and must
      # never be written back into the sidecar as if it were one.
      prev_version: >-
        {{ backup_tag if (sidecar is succeeded and sidecar.content is defined) else '' }}
    # Flipped by the atomic rename below. Until then the live path holds
    # the build that was already installed, which this run must not treat
    # as "the bad binary" and move aside (K078).
    rollback_swapped: false

- name: "[{{ binary }}] Stage new binary as .new alongside live path"
  ansible.builtin.copy:
    src: "{{ local_dist_dir }}/{{ binary }}-linux-amd64"
    dest: "{{ install_dir }}/{{ binary }}.new"
    owner: root
    group: root
    mode: "0755"

- name: "[{{ binary }}] Block: backup → install → restart → probe → rollback-on-failure"
  block:
    - name: "[{{ binary }}] Backup current binary"
      ansible.builtin.command:
        cmd: "mv {{ install_dir }}/{{ binary }} {{ install_dir }}/{{ binary }}.prev-{{ backup_tag }}"
      when: current_stat.stat.exists

    - name: "[{{ binary }}] Stamp backup mtime to now (backup time, not the binary's original copy time)"
      # `mv` on the same filesystem is a rename — it does NOT touch the
      # file's mtime, so the backup above inherits whatever mtime the
      # now-superseded binary already had (its own deploy/copy time,
      # possibly much older than "now"). The prune task below sorts
      # backups by mtime to decide what's oldest; without this stamp, a
      # revert-to-an-older-version run creates a backup that already
      # LOOKS old and can be pruned in this same run — the opposite of
      # "keep the latest 5" (audit-2026-07-23 AGT-08).
      ansible.builtin.file:
        path: "{{ install_dir }}/{{ binary }}.prev-{{ backup_tag }}"
        state: touch
      when: current_stat.stat.exists

    - name: "[{{ binary }}] Atomic rename .new → live"
      ansible.builtin.command:
        cmd: "mv {{ install_dir }}/{{ binary }}.new {{ install_dir }}/{{ binary }}"
        creates: "{{ install_dir }}/{{ binary }}"

    - name: "[{{ binary }}] Mark the live path as holding this run's build"
      ansible.builtin.set_fact:
        rollback_swapped: true

    - name: "[{{ binary }}] Write sidecar version marker"
      ansible.builtin.copy:
        content: "{{ version }}"
        dest: "/var/lib/stellarindex/deployed-versions/{{ binary }}"
        owner: root
        group: root
        mode: "0644"

    # CLI tools (ops, migrate, sla-probe) are one-shot binaries
    # with no daemon to restart. Each CLI has a different
    # version convention (ops uses `version` subcommand,
    # migrate too, sla-probe uses `-version` flag), so per-CLI
    # version flags can't be a uniform smoke. Use ansible.stat
    # to confirm the file is present + executable + non-empty,
    # which catches the "scp truncated mid-upload" / "wrong
    # arch" / "missing chmod +x" failure modes a runtime probe
    # would catch — without depending on any external tooling
    # being installed on the host.
    - name: "[{{ binary }}] Smoke-test CLI binary (executable + non-empty)"
      when: binary in cli_binaries
      ansible.builtin.stat:
        path: "{{ install_dir }}/{{ binary }}"
      register: cli_stat
      failed_when: >
        not cli_stat.stat.exists
        or not cli_stat.stat.executable
        or cli_stat.stat.size < 1024

    - name: "[{{ binary }}] Restart service"
      when: binary not in cli_binaries
      ansible.builtin.systemd:
        name: "{{ binary }}.service"
        state: restarted
        daemon_reload: false

    - name: "[{{ binary }}] Grace period before health probe"
      when: binary not in cli_binaries
      ansible.builtin.pause:
        seconds: "{{ health_grace_seconds | int }}"

    - name: "[{{ binary }}] Health probe — API endpoint"
      when: binary == 'stellarindex-api'
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ api_port }}{{ api_health_path }}"
        status_code: 200
        timeout: 5
      register: probe
      retries: 5
      delay: 3
      until: probe.status is defined and probe.status == 200

    - name: "[{{ binary }}] Health probe — systemd active"
      when: binary != 'stellarindex-api' and binary not in cli_binaries
      ansible.builtin.command:
        cmd: "systemctl is-active {{ binary }}.service"
      changed_when: false
      register: svc_state
      retries: 5
      delay: 3
      until: svc_state.rc == 0 and (svc_state.stdout | trim) == 'active'

    # audit-2026-07-23 CID-14: migrations are applied once for the whole
    # deploy up-front, but each binary swap+probe is independent — record
    # every binary that reached a HEALTHY new version in this run so that
    # if a LATER binary in binary_list fails, the rescue block below can
    # roll ALL of them back together, not just the failing one. Facts
    # persist across include_tasks loop iterations (host-scoped, not
    # loop-scoped), so this accumulates across the whole binary_list loop.
    #
    # The value is the restore RECORD built before this binary was touched
    # (K078), not the backup tag: the rescue must be able to tell "roll
    # this one back to <path>" from "this run installed it for the first
    # time, there is nothing to roll back to".
    - name: "[{{ binary }}] Record successful swap (for whole-deploy rollback if a LATER binary fails)"
      ansible.builtin.set_fact:
        swapped_binaries: "{{ (swapped_binaries | default({})) | combine({binary: rollback_record}) }}"

  rescue:
    # Neither of these narrate an OUTCOME: at this point the rescue has
    # not run, and whether there is anything to roll back to depends on
    # the record (K078). The "FAIL the play" task at the end of the rescue
    # is the one that reports what actually happened.
    - name: "[{{ binary }}] FAILURE — rolling back"
      ansible.builtin.debug:
        msg: >-
          {{ binary }} failed its deploy; running its rollback now
          {{ ('(previous binary: ' ~ rollback_record.prev_path ~ ')')
             if rollback_record.prev_path | length > 0
             else '(no previous binary recorded — nothing to roll back to)' }}

    - name: "[{{ binary }}] NOTE — binary rolled back, DB schema is not"
      ansible.builtin.debug:
        msg: "{{ binary }} is being rolled back to the binary that preceded this run, where one exists; DB schema remains at the new version — this is SAFE per the additive-migrations policy (every migration must stay backward-compatible with the previous released binary; see docs/operations/deploy-workflow.md and migrations/README.md rule 9). Migrations are never auto-rolled-back on a binary rollback."

    - name: "[{{ binary }}] Stop failing service"
      when: binary not in cli_binaries
      ansible.builtin.systemd:
        name: "{{ binary }}.service"
        state: stopped
      ignore_errors: true

    # Only the build THIS run put at the live path is "the bad binary".
    # When the block failed before the atomic rename — a backup `mv` that
    # errored on a hand-written sidecar, a full filesystem — the live path
    # still holds the previously installed, working build, and moving it
    # to .failed-<version> deletes a binary this run never installed
    # (K078). `removes:` also makes a repeated rescue a no-op instead of
    # clobbering the forensic copy.
    - name: "[{{ binary }}] Move bad binary out of the way"
      when: rollback_swapped | bool
      ansible.builtin.command:
        cmd: "mv {{ rollback_record.live_path }} {{ rollback_record.live_path }}.failed-{{ version }}"
        removes: "{{ rollback_record.live_path }}"
      ignore_errors: true

    # Restore from the recorded backup, and only if that exact file is on
    # disk now: with no prior install there is nothing to move back, and
    # the un-gated `mv` only ever failed into ignore_errors (K078).
    # `creates:` keeps it from clobbering a live path that is still
    # occupied — if the move-aside above did not run, what is there is
    # already the build we want.
    - name: "[{{ binary }}] Check the recorded backup is still on disk"
      ansible.builtin.stat:
        path: "{{ rollback_record.prev_path }}"
      when: rollback_record.prev_path | length > 0
      register: rollback_self_prev
      ignore_errors: true

    - name: "[{{ binary }}] Restore backup binary"
      when: rollback_self_prev.stat.exists | default(false)
      ansible.builtin.command:
        cmd: "mv {{ rollback_record.prev_path }} {{ rollback_record.live_path }}"
        removes: "{{ rollback_record.prev_path }}"
        creates: "{{ rollback_record.live_path }}"
      ignore_errors: true

    - name: "[{{ binary }}] Confirm the install path is occupied after the rollback"
      ansible.builtin.stat:
        path: "{{ rollback_record.live_path }}"
      register: rollback_self_after
      ignore_errors: true

    - name: "[{{ binary }}] Restore sidecar version marker"
      when: rollback_record.prev_version | length > 0
      ansible.builtin.copy:
        content: "{{ rollback_record.prev_version }}"
        dest: "/var/lib/stellarindex/deployed-versions/{{ binary }}"
        owner: root
        group: root
        mode: "0644"
      ignore_errors: true

    # No sidecar before this run (first install, or an untracked one):
    # restoring the pre-deploy state means REMOVING the marker this run
    # wrote, not stamping the synthetic "untracked-<timestamp>" tag as if
    # it were a released version — the next deploy would back the binary
    # up under that tag and `deploy.yml`'s skew check would read it as the
    # live version.
    - name: "[{{ binary }}] Drop sidecar version marker (there was none before this run)"
      when: rollback_record.prev_version | length == 0
      ansible.builtin.file:
        path: "/var/lib/stellarindex/deployed-versions/{{ binary }}"
        state: absent
      ignore_errors: true

    # Whatever is at the live path now is a build that predates this run —
    # the restored backup, or the one the deploy never got to replace. If
    # the path is empty there is nothing to start and the failure says so.
    - name: "[{{ binary }}] Restart with old binary"
      when:
        - binary not in cli_binaries
        - rollback_self_after.stat.exists | default(false)
      ansible.builtin.systemd:
        name: "{{ binary }}.service"
        state: restarted
      ignore_errors: true

    # audit-2026-07-23 CID-14: this binary failing its health probe means
    # the whole deploy failed — don't leave EARLIER binaries in this same
    # run stranded on the new version while this one reverts. Roll every
    # binary recorded in swapped_binaries (built up by the "Record
    # successful swap" task above, across prior loop iterations) back to
    # its own pre-deploy state too. Best-effort (ignore_errors) — we're
    # already in the failure path and want to revert as much as possible
    # rather than abort partway through cleanup.
    - name: "[{{ binary }}] Whole-deploy rollback — stop other newly-swapped services"
      ansible.builtin.systemd:
        name: "{{ item.key }}.service"
        state: stopped
      loop: "{{ (swapped_binaries | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key not in cli_binaries
      ignore_errors: true

    # K078 (audit-2026-09-02): this used to move EVERY recorded binary
    # aside and then `mv` a .prev-<tag> back with ignore_errors. For a
    # binary this run installed for the FIRST time no .prev-<tag> exists,
    # so the restore failed silently and the install path was left EMPTY
    # while the play reported it rolled back — a bad deploy turned into an
    # outage for a binary that was healthy. Nothing is moved aside now
    # unless the exact backup the forward path recorded is on disk at this
    # moment; the rest are named in the failure instead of being deleted.
    - name: "[{{ binary }}] Whole-deploy rollback — stat each recorded previous binary"
      ansible.builtin.stat:
        path: "{{ item.value.prev_path }}"
      loop: "{{ (swapped_binaries | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value.prev_path | length > 0
      register: rollback_prev_stat
      ignore_errors: true

    - name: "[{{ binary }}] Whole-deploy rollback — which recorded binaries can be put back"
      ansible.builtin.set_fact:
        rollback_restorable: >-
          {{ rollback_prev_stat.results | default([]) | selectattr('stat', 'defined')
             | selectattr('stat.exists') | map(attribute='item.key') | list }}

    - name: "[{{ binary }}] Whole-deploy rollback — which recorded binaries cannot"
      ansible.builtin.set_fact:
        rollback_unrestorable: >-
          {{ (swapped_binaries | default({})) | dict2items
             | rejectattr('key', 'in', rollback_restorable) | map(attribute='key') | list }}

    - name: "[{{ binary }}] Whole-deploy rollback — move restorable binaries aside"
      ansible.builtin.command:
        cmd: "mv {{ item.value.live_path }} {{ item.value.live_path }}.rolledback-{{ version }}"
        removes: "{{ item.value.live_path }}"
      loop: "{{ (swapped_binaries | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key in rollback_restorable
      ignore_errors: true

    - name: "[{{ binary }}] Whole-deploy rollback — restore each one's previous binary"
      ansible.builtin.command:
        cmd: "mv {{ item.value.prev_path }} {{ item.value.live_path }}"
        removes: "{{ item.value.prev_path }}"
        creates: "{{ item.value.live_path }}"
      loop: "{{ (swapped_binaries | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key in rollback_restorable
      ignore_errors: true

    - name: "[{{ binary }}] Whole-deploy rollback — confirm each restored binary is back"
      ansible.builtin.stat:
        path: "{{ item.value.live_path }}"
      loop: "{{ (swapped_binaries | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key in rollback_restorable
      register: rollback_after_stat
      ignore_errors: true

    - name: "[{{ binary }}] Whole-deploy rollback — name any restore that did not land"
      ansible.builtin.set_fact:
        rollback_missing: >-
          {{ rollback_after_stat.results | default([]) | selectattr('stat', 'defined')
             | rejectattr('stat.exists') | map(attribute='item.key') | list }}

    - name: "[{{ binary }}] Whole-deploy rollback — restore each one's sidecar version marker"
      ansible.builtin.copy:
        content: "{{ item.value.prev_version }}"
        dest: "/var/lib/stellarindex/deployed-versions/{{ item.key }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ (swapped_binaries | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.key in rollback_restorable
        - item.value.prev_version | length > 0
      ignore_errors: true

    # Untracked prior install: the marker this run wrote is the only one
    # that ever existed, so restoring the pre-deploy state removes it.
    # A binary that stayed on the new version keeps its marker — the
    # sidecar must name what is actually on disk.
    - name: "[{{ binary }}] Whole-deploy rollback — drop sidecars that did not exist before this run"
      ansible.builtin.file:
        path: "/var/lib/stellarindex/deployed-versions/{{ item.key }}"
        state: absent
      loop: "{{ (swapped_binaries | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.key in rollback_restorable
        - item.value.prev_version | length == 0
      ignore_errors: true

    # Only the ones actually put back. A binary left on the new version
    # stays STOPPED — that is its pre-deploy state (nothing was installed
    # at its path before this run) and the failure below says so.
    - name: "[{{ binary }}] Whole-deploy rollback — restart each one with its previous binary"
      ansible.builtin.systemd:
        name: "{{ item.key }}.service"
        state: restarted
      loop: "{{ (swapped_binaries | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.key not in cli_binaries
        - item.key in rollback_restorable
      ignore_errors: true

    # The message must describe what the rescue ACTUALLY did. It used to
    # list every recorded binary as "rolled back" whether or not the
    # restore landed, so the one case that needs an operator — an install
    # path the rollback cannot refill — read as a clean rollback (K078).
    - name: "[{{ binary }}] FAIL the play"
      ansible.builtin.fail:
        msg: >-
          {{ binary }} deploy failed.
          {% if not (rollback_swapped | bool) %}
          It failed BEFORE the new build reached {{ rollback_record.live_path }},
          so the binary already installed there was left exactly where it was.
          {% elif rollback_self_after.stat.exists | default(false) %}
          Rolled back to {{ backup_tag }}. Bad binary preserved at
          {{ rollback_record.live_path }}.failed-{{ version }} for forensics.
          {% else %}
          NOT rolled back — nothing to restore ({% if rollback_record.prev_path | length > 0 %}the
          recorded backup {{ rollback_record.prev_path }} is gone{% else %}this run was its
          first install{% endif %}), so {{ rollback_record.live_path }} is now unoccupied.
          Bad binary preserved at {{ rollback_record.live_path }}.failed-{{ version }}
          for forensics.
          {% endif %}
          {% if rollback_restorable | length > 0 %}
          Also rolled back these earlier-in-this-run binaries to keep the
          host on one consistent version set: {{ rollback_restorable | join(', ') }}.
          {% endif %}
          {% if rollback_unrestorable | length > 0 %}
          NOT rolled back — no previous binary to restore (installed for the
          first time by this run, or its recorded backup is gone):
          {{ rollback_unrestorable | join(', ') }}. They are LEFT INSTALLED on
          {{ version }} with their services stopped; start or remove them by hand.
          {% endif %}
          {% if rollback_missing | length > 0 %}
          RESTORE FAILED — these install paths are EMPTY and need a hand:
          {{ rollback_missing | join(', ') }}.
          {% endif %}

  always:
    - name: "[{{ binary }}] Clean up stale .new"
      ansible.builtin.file:
        path: "{{ install_dir }}/{{ binary }}.new"
        state: absent

- name: "[{{ binary }}] Prune backups beyond the latest 5"
  ansible.builtin.shell: |
    set -e
    # Keep the most-recent 5 .prev-* backups; delete the rest. Sort
    # by mtime so reverts to older versions retain their backup.
    find {{ install_dir }} -maxdepth 1 -name '{{ binary }}.prev-*' \
      -printf '%T@ %p\n' \
      | sort -nr \
      | tail -n +6 \
      | awk '{print $2}' \
      | xargs -r rm -f
  changed_when: false
