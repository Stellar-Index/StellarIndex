[defaults]
# Path only — the password itself lives outside the repo (0600).
vault_password_file    = ~/.ansible/r1_vault_pass
# No default inventory: `inventory` names a guard file that no inventory
# plugin can parse, so a run that forgets -i resolves ZERO hosts instead of
# guessing a region. Defaulting to `./inventory` — the DIRECTORY — would make
# ansible merge it: every region file declares the same `archival_nodes` group,
# so an -i-less run would point r1 (production) AND both test nets at
# `hosts: all` / `hosts: archival_nodes` in one play, with per-region host
# vars clobbered by load order. Every run passes -i explicitly; the guard
# file carries the region list and the rest of the rationale.
inventory              = ./inventory/no-default-inventory.yml
roles_path             = ./roles
collections_paths      = ~/.ansible/collections
host_key_checking      = True
retry_files_enabled    = False
# YAML output for readable play recaps, via the built-in default
# callback's result_format.
stdout_callback        = default
result_format          = yaml
bin_ansible_callbacks  = True
forks                  = 10
timeout                = 30
gathering              = smart
fact_caching           = jsonfile
# Under the operator's home, not shared world-writable /tmp: a fixed
# /tmp path is guessable/pre-creatable by any other local user on a
# shared box, letting them read or poison cached facts (e.g. the
# ansible_distribution_release archival-node.yml keys its apt-repo
# tasks off) within fact_caching_timeout. Mirrors vault_password_file
# and collections_paths above, which already live under ~/.ansible.
fact_caching_connection= ~/.ansible/fact_cache
fact_caching_timeout   = 3600

# Output: one task per line, no huge "OK/CHANGED" stanzas unless -v
display_skipped_hosts  = False

[ssh_connection]
pipelining             = True
ssh_args               = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30

[privilege_escalation]
become                 = True
become_method          = sudo
become_ask_pass        = False
