# Single-host Alertmanager config for R1.
#
# Companion to configs/prometheus/prometheus.r1.yml +
# configs/prometheus/rules.r1/. This config maps OUR severity
# vocabulary (page / ticket / informational) — the same
# vocabulary used by the multi-host Ansible template at
# configs/ansible/roles/prometheus/templates/alertmanager.yml.j2
# (the template converged on this severity ladder post-R1
# standup; F-1265, 2026-05-13). The remaining difference between
# the two is config shape, not severity vocabulary.
#
# Apply via configs/alertmanager/apply.sh — it env-substitutes the
# placeholder URLs from a sourced env file (kept off-disk in git per
# the deadmansswitch runbook).
#
# Chat fanout is Discord (Alertmanager-native discord_configs,
# v0.25+). Discord incoming webhooks are locked to one channel each,
# so pages and alerts use two separate webhook URLs
# (DISCORD_WEBHOOK_URL_PAGES, DISCORD_WEBHOOK_URL_ALERTS) — point both
# at the same webhook if you only want one channel.
#
# ─── The Discord message templates are BOUNDED. Keep them that way. ──
#
# A Discord embed is rejected whole if its description exceeds 4096
# characters, its title exceeds 256, or the two together exceed 6000.
# Alertmanager 0.26 (the version on r1) does not truncate either field,
# and it treats the resulting HTTP 400 as UNRECOVERABLE — one oversized
# notification kills the receiver for every alert routed to it, not just
# the one that overflowed.
#
# That is not hypothetical. On 2026-09-07T14:28 reflector-dex stalled,
# 22 stellarindex_oracle_stale alerts landed in one group, the then
# unbounded `range .Alerts` rendered a 9319-character description, and
# chat-default returned 400 on every attempt for 11 hours
# (alertmanager_notifications_failed_total{integration="discord"} = 107).
# Every other ticket alert in that window was silently dropped with it.
#
# So both message templates render AT MOST `$max` alerts, state the
# remainder, and cap every interpolated field with `printf "%.Ns"`. The
# bound is therefore hard, not an estimate: no annotation, label or URL
# can grow the payload. Measured worst case is 2257 characters (55% of
# the 4096 limit) at any group size; the real 22-alert group renders at
# 1378. If you edit a template here, re-measure — apply.sh's
# `--check-only` validates syntax, not size.

global:
  resolve_timeout: 5m

# ─── Templating ──────────────────────────────────────────────────
# Inline templating only — no separate templates dir on R1.

# ─── Routing tree ────────────────────────────────────────────────
route:
  receiver: chat-default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

  routes:
    # Deadmansswitch — fires constantly. Routed to healthchecks.io.
    # When the heartbeat stops (Prometheus or Alertmanager itself
    # is broken), healthchecks.io pages us via a separate channel.
    # See docs/operations/runbooks/deadmansswitch.md.
    - matchers: [alertname = "stellarindex_deadmansswitch"]
      receiver: deadmansswitch
      group_interval: 60s
      repeat_interval: 60s
      continue: false

    # Delivery failure — reported OUT OF BAND, on purpose.
    #
    # stellarindex_alertmanager_notifications_failing is the alert that
    # says "a receiver is being refused by the far end". Routed by
    # severity alone it is a ticket, so it lands in chat-default — i.e.
    # it is delivered through the very integration whose failure it is
    # reporting. During the 2026-09-07 Discord outage it fired for 11
    # hours into the dead channel and nobody saw it: the only signal of
    # a delivery failure travelled the failing path.
    #
    # `continue: true` — this route ADDS a transport, it does not take
    # one away. The alert still falls through to the severity routes
    # below and reaches chat exactly as before whenever chat works.
    - matchers: [alertname = "stellarindex_alertmanager_notifications_failing"]
      receiver: alert-delivery-failure
      group_interval: 5m
      repeat_interval: 1h
      continue: true

    # SEV-1 — page operators. Currently routes to chat-page; wire
    # PagerDuty in chat-page receiver below when integration_key is
    # provisioned.
    - matchers: [severity = "page"]
      receiver: chat-page
      continue: false

    # Ticket — actionable but not urgent. Same chat fanout, lower
    # repeat cadence.
    - matchers: [severity = "ticket"]
      receiver: chat-default
      repeat_interval: 24h
      continue: false

    # Informational — a low-traffic Discord channel of its own, kept
    # separate from `alerts` so a routine notice (an oracle publishing a
    # ticker we do not map yet) can never bury a ticket in the same feed.
    # If DISCORD_WEBHOOK_URL_INFORMATIONAL is unset the renderer strips
    # the block and this receiver degrades to a stub — identical to the
    # `silent` it replaced, so an unset URL is a no-op, not a config error.
    - matchers: [severity = "informational"]
      receiver: chat-informational
      continue: false

# ─── Inhibit rules ───────────────────────────────────────────────
inhibit_rules:
  # If a page-severity alert fires for a component, mute the ticket +
  # informational variants on that SAME component to avoid stacking.
  #
  # `equal` is [component] ONLY — NOT [alertname, component]. A page and
  # its paired lower-severity alert are DIFFERENT alerts with different
  # alertnames (e.g. `..._tip_lag_severe` [page] escalates
  # `..._tip_lag_high` [ticket]), so requiring alertname equality made
  # the inhibition never fire — the source page and target ticket could
  # never have the same alertname. Matching on `component` alone lets the
  # page suppress the ticket/informational variants for that component.
  - source_matchers: [severity = "page"]
    target_matchers: [severity =~ "ticket|informational"]
    equal: [component]

# ─── Receivers ───────────────────────────────────────────────────
receivers:
  # Deadmansswitch heartbeat URL — env-substituted at apply time.
  - name: deadmansswitch
    webhook_configs:
      - url: ${HEALTHCHECKS_DEADMANSSWITCH_URL}
        send_resolved: false

  # Page-severity fanout → Discord #stellarindex-pages webhook.
  # An unset URL still RENDERS as a stub (that keeps this file valid),
  # but apply.sh refuses to install it — see its header for why.
  - name: chat-page
    discord_configs:
      - webhook_url: ${DISCORD_WEBHOOK_URL_PAGES}
        send_resolved: true
        title: '🚨 PAGE — {{ printf "%.120s" .GroupLabels.alertname }}'
        message: |
          {{ $max := 3 }}{{ $shown := .Alerts }}{{ if gt (len .Alerts) $max }}{{ $shown = slice .Alerts 0 $max }}{{ end }}{{ range $shown }}{{ $sum := printf "%.160s" .Annotations.summary }}{{ $desc := printf "%.300s" (trimSpace .Annotations.description) }}
          **{{ $sum }}{{ if ne $sum .Annotations.summary }} …{{ end }}**
          {{ $desc }}{{ if ne $desc (trimSpace .Annotations.description) }} …{{ end }}
          {{ if .Annotations.runbook_url }}Runbook: {{ printf "%.200s" .Annotations.runbook_url }}{{ end }}
          {{ end }}{{ if gt (len .Alerts) $max }}
          … and {{ len (slice .Alerts $max) }} more in this group — see {{ printf "%.120s" .ExternalURL }}
          {{ end }}

  # Ticket-severity + default → Discord #stellarindex-alerts webhook,
  # less urgent text.
  - name: chat-default
    discord_configs:
      - webhook_url: ${DISCORD_WEBHOOK_URL_ALERTS}
        send_resolved: true
        title: '{{ printf "%.120s" .GroupLabels.alertname }}'
        message: |
          {{ $max := 3 }}{{ $shown := .Alerts }}{{ if gt (len .Alerts) $max }}{{ $shown = slice .Alerts 0 $max }}{{ end }}{{ range $shown }}{{ $sum := printf "%.160s" .Annotations.summary }}{{ $desc := printf "%.300s" (trimSpace .Annotations.description) }}
          **[{{ printf "%.16s" (.Labels.severity | toUpper) }}]** {{ $sum }}{{ if ne $sum .Annotations.summary }} …{{ end }}
          {{ $desc }}{{ if ne $desc (trimSpace .Annotations.description) }} …{{ end }}
          {{ if .Annotations.runbook_url }}Runbook: {{ printf "%.200s" .Annotations.runbook_url }}{{ end }}
          {{ end }}{{ if gt (len .Alerts) $max }}
          … and {{ len (slice .Alerts $max) }} more in this group — see {{ printf "%.120s" .ExternalURL }}
          {{ end }}

  # Delivery-failure escape hatch — a SECOND Healthchecks.io check,
  # deliberately NOT the deadmansswitch one. Pinging the deadman check's
  # /fail endpoint would work mechanically, but it would make one signal
  # carry two meanings ("Prometheus or Alertmanager is dead" and "chat
  # delivery is being refused") and send the operator to the wrong
  # runbook. Provision a separate check — see
  # docs/operations/runbooks/alertmanager-notifications-failing.md.
  #
  # Dark until that check exists: with the URL unset the renderer drops
  # this block and the receiver becomes a stub. That is why the route
  # above carries `continue: true` — chat delivery is identical either
  # way, and apply.sh names this receiver on every run so the gap cannot
  # go unnoticed. max_alerts bounds the webhook body for the same reason
  # the Discord templates are bounded.
  - name: alert-delivery-failure
    webhook_configs:
      - url: ${HEALTHCHECKS_ALERT_DELIVERY_URL}
        send_resolved: true
        max_alerts: 5

  # ─── silent — A BLACK HOLE, ON PURPOSE ─────────────────────────
  #
  # READ THIS BEFORE ASSUMING THE EMPTY STANZA IS AN OVERSIGHT.
  #
  # `- name: silent` has no webhook_configs, no discord_configs and
  # no pagerduty_configs, and that is DELIBERATE: an Alertmanager
  # receiver with no *_configs block accepts the alert and delivers
  # it to NOBODY. Every `severity: informational` rule routes here,
  # so a firing informational alert reaches a human only if someone
  # happens to open the Alertmanager UI. It does not reach Discord,
  # it does not reach Healthchecks, and there is no PagerDuty leg
  # anywhere in this file for any severity.
  #
  # Do NOT "repair" this by adding a webhook. Whether each of those
  # rules should be delivered is an open POLICY question tracked in
  # issue #485; the per-alert triage that decides it lives in
  # docs/operations/alerts-catalog.md, section "Informational alerts
  # — delivery register", and `scripts/ci/lint-alerts-catalog.py`
  # requires a register row for every informational rule so a new one
  # cannot land in this bucket by accident.
  #
  # The one exception to "informational goes nowhere" is
  # stellarindex_deadmansswitch: it carries severity=informational
  # but the alertname-matched route above it fires first
  # (`continue: false`), so it reaches Healthchecks.io and never
  # reaches this receiver.
  # Informational fanout → a dedicated Discord channel. Same bounded
  # template as chat-default: every interpolated field is capped and at
  # most $max alerts render, because an unbounded body is what returned
  # 400 for eleven hours and silently dropped every other alert with it.
  - name: chat-informational
    discord_configs:
      - webhook_url: ${DISCORD_WEBHOOK_URL_INFORMATIONAL}
        send_resolved: false
        title: '{{ printf "%.120s" .GroupLabels.alertname }}'
        message: |
          {{ $max := 3 }}{{ $shown := .Alerts }}{{ if gt (len .Alerts) $max }}{{ $shown = slice .Alerts 0 $max }}{{ end }}{{ range $shown }}{{ $sum := printf "%.160s" .Annotations.summary }}{{ $desc := printf "%.300s" (trimSpace .Annotations.description) }}
          **[FYI]** {{ $sum }}{{ if ne $sum .Annotations.summary }} …{{ end }}
          {{ $desc }}{{ if ne $desc (trimSpace .Annotations.description) }} …{{ end }}
          {{ if .Annotations.runbook_url }}Runbook: {{ printf "%.200s" .Annotations.runbook_url }}{{ end }}
          {{ end }}{{ if gt (len .Alerts) $max }}
          … and {{ len (slice .Alerts $max) }} more in this group — see {{ printf "%.120s" .ExternalURL }}
          {{ end }}

  - name: silent
