# /etc/ssh/sshd_config.d/00-keys-only.conf on the KVM host.
#
# Debian's default leaves PasswordAuthentication on. Internet password guessing then
# fills the unauthenticated-connection slots (MaxStartups) and sshd drops real logins,
# including the ProxyJump every ansible run and deploy uses to reach the VMs.
PasswordAuthentication no
KbdInteractiveAuthentication no
MaxStartups 60:30:200
