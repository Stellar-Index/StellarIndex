# Hetzner installimage config for the Testnet+Futurenet KVM HOST.
#
# Usage (from the Hetzner rescue system, which the box boots into after you
# activate "Rescue" in Robot and reboot):
#   1. Copy this file to /autosetup on the rescue system.
#   2. Run `installimage` (it auto-detects /autosetup and runs unattended).
#   3. Reboot into the installed Debian 12.
# See configs/libvirt/README.md for the full host bring-up.
#
# Layout rationale: /boot is mdadm RAID1 (installimage does this automatically
# even at SWRAIDLEVEL 0 — a mirrored boot survives a single-disk failure),
# and the data (root + VM storage) is mdadm RAID0 across both NVMe → one LVM
# VG (vg0) ~1.74 TB. RAID0 (not a mirror) is deliberate: test-net data is
# disposable/re-ingestable, so we take the full capacity. A drive failure =
# re-provision + re-ingest from genesis.

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
SWRAID 1
SWRAIDLEVEL 0
BOOTLOADER grub
HOSTNAME si-testnet-fn-host
PART /boot ext4 1024M
PART lvm vg0 all
LV vg0 root / ext4 100G
LV vg0 swap swap swap 8G
# Debian 12 (bookworm) — Proxmox VE requires Debian, but we use plain libvirt/
# KVM here; the VMs run Ubuntu 24.04 to match r1. Update the image filename to
# whatever the rescue system ships under /root/images/.
IMAGE /root/images/Debian-1215-bookworm-amd64-base.tar.zst
